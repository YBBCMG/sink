<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>记忆当铺 · Memory Pawn</title>
<style>
  :root {
    --bg: #1b1530;
    --panel: #262043;
    --panel2: #2f2852;
    --line: #4a3f75;
    --txt: #f0eaff;
    --dim: #b3a9dc;
    --gold: #e8b74a;
    --gold2: #ffd98a;
    --violet: #b48ae0;
    --green: #7ed6a0;
    --red: #e0708a;
    --blk: #6a5f9e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--txt); height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px; line-height: 1.65; padding: 10px;
    overflow: hidden; /* 页面本身不滚——滚轮只作用于右侧面板 */
  }
  /* v31.2 上屏口径：原来 1180px 顶死，画布只能拿到 ~846px（= 0.881 倍缩小）——
     960 的逻辑画布被浏览器缩着采样，细线和字全是糊的。放到 1360 让画布拿到 ≥960，
     背板跟屏幕设备像素 1:1（见 game23.js setupCanvas），显示大小反而更足。 */
  #app { max-width: 1360px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
  header#topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 8px 16px; margin-bottom: 10px; flex: none;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  #logo { font-weight: 700; letter-spacing: 3px; color: var(--gold2); font-size: 17px; white-space: nowrap; }
  #logo small { color: var(--dim); font-weight: 400; letter-spacing: 0; margin-left: 8px; font-size: 11px; }
  #hud { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-family: ui-monospace, Consolas, monospace; }
  #hud .hitem { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; color: var(--dim); }
  #hud b { color: #fff; font-size: 15px; }
  #hud .gold-ico { color: var(--gold2); }
  .bar { width: 100px; height: 9px; background: #141026; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--violet); transition: width .25s; }
  .bar i.warn { background: var(--gold); }
  .bar i.bad { background: var(--red); }
  #relics { letter-spacing: 2px; font-size: 13px; }
  #relics .got { color: var(--gold2); }
  #relics .no { color: var(--line); }
  #btn-restart {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  #btn-restart:hover { color: var(--txt); border-color: var(--red); }
  #btn-dev {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer;
    font-family: ui-monospace, Consolas, monospace;
  }
  #btn-dev:hover { color: var(--txt); border-color: var(--violet); }
  #btn-dev.on { color: #fff; background: var(--red); border-color: var(--red); }
  #btn-bgm {
    background: var(--panel2); border: 1px solid var(--line); color: var(--gold2);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  #btn-bgm:hover { color: #fff; border-color: var(--gold); }
  #btn-bgm.off { color: var(--dim); text-decoration: line-through; }
  /* 「档案」那颗按钮已摘（用户：「这个世界档案删了吧，没啥用」）—— 样式一起收走，
     免得留一条指着不存在按钮的规则。面板本身（#pane-archive）还在，接回来时把上面这段和
     顶栏那颗一起加回即可。
     JS 那侧也留了同一句话：refreshArchive() 与 #pane-archive 一个字节没删，refreshAlbum()
     里接上了「结局图鉴（y/4）」这块玩家资产 —— 旧门摘了，里面的东西有人接。 */
  /* v37 全屏键：跟旁边那族同款外观；.on = 当前在全屏里 */
  #btn-fs {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  #btn-fs:hover { color: var(--gold2); border-color: var(--gold); }
  #btn-fs.on { color: #fff; background: var(--violet); border-color: var(--violet); }
  /* 进全屏时把 #app 的 1360px 上限撤掉 —— 不撤的话大屏上游戏只占中间一条。
     只放开宽度上限，**比例与尺寸一个数都不动**：画布仍是 10:7，背板仍由
     game23.js 的 setupCanvas 按「显示宽度 × DPR」现算（全屏后视口变了会重算）。
     顺带把 UA 给 :fullscreen 的黑底换成页面自己的底色 —— 免得两侧看着像黑边框。 */
  #app:fullscreen { max-width: none; background: var(--bg); }
  #app:-webkit-full-screen { max-width: none; background: var(--bg); }
  /* 开发者模式浮层（z 最高：modal 6 / 结局 7 / 确认 8 之上，可与游戏面板同时操作） */
  #dev-panel {
    position: absolute; top: 10px; right: 10px; width: 312px; max-height: calc(100% - 20px);
    background: rgba(24, 18, 44, .97); border: 2px solid var(--red); border-radius: 12px;
    z-index: 9; display: none; flex-direction: column;
    box-shadow: 0 5px 0 rgba(0,0,0,.4);
  }
  #dev-panel.show { display: flex; }
  #dev-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; border-bottom: 1px solid var(--line); flex: none;
  }
  #dev-head b { color: var(--red); font-size: 13px; letter-spacing: 2px; }
  #dev-head small { color: var(--dim); font-size: 10.5px; margin-left: 8px; }
  #dev-close { background: none; border: none; color: var(--dim); font-size: 15px; cursor: pointer; line-height: 1; }
  #dev-close:hover { color: var(--txt); }
  #dev-body { overflow-y: auto; padding: 8px 10px 10px; font-size: 12px; }
  #dev-body .dv-sec { margin: 9px 0 4px; color: var(--gold2); font-size: 11.5px; letter-spacing: 1px; }
  #dev-body .dv-sec:first-child { margin-top: 0; }
  /* v34：开发者面板的名单（38 条记忆 / 60+ 条旗标 / 18 个谜题节点）。
     .pz-btn 一只有 40px 高，上百条滚不完 —— 名单改用紧凑行。 */
  #dev-body .dv-list { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 2px; }
  #dev-body .dv-row {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-family: inherit; font-size: 11.5px; text-align: left; cursor: pointer;
    color: var(--txt); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 7px; min-height: 0;
  }
  #dev-body .dv-row:hover { border-color: var(--gold2); }
  #dev-body .dv-row i { font-style: normal; color: var(--dim); flex: none; }
  #dev-body .dv-row.on { border-color: var(--gold); color: var(--gold2); }
  #dev-body .dv-sub { color: var(--dim); font-size: 10.5px; margin: 5px 0 2px; }
  #dev-body .dv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  #dev-body .dv-grid.tp { grid-template-columns: repeat(3, 1fr); }
  #dev-body button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 7px; padding: 4px 2px; font-size: 11.5px; cursor: pointer; font-family: inherit;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #dev-body button:hover { border-color: var(--violet); }
  #dev-body button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
  #dev-body button.warn { border-color: var(--red); color: var(--red); }
  #dev-body button:disabled { opacity: .35; cursor: not-allowed; }
  /* 危险操作整行铺开：四列格里「从第一天重新开始」会被省略号吃掉，必须独占一行 */
  #dev-body button[data-dev="wipe"] { grid-column: 1 / -1; }
  #confirm-box {
    position: absolute; inset: 0; background: rgba(16, 11, 32, .85);
    display: none; align-items: center; justify-content: center; z-index: 8;
  }
  #confirm-box.show { display: flex; }
  #confirm-card {
    background: var(--panel); border: 2px solid var(--red); border-radius: 14px;
    padding: 18px 24px; text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  #confirm-card p { margin-bottom: 14px; font-size: 14px; }
  #confirm-card button {
    margin: 0 6px; border-radius: 9px; padding: 6px 18px; font-size: 13.5px;
    cursor: pointer; font-family: inherit;
  }
  #cf-yes { background: var(--red); color: #fff; border: none; }
  #cf-no { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); }
  main { display: flex; gap: 10px; align-items: stretch; flex: 1; min-height: 0; justify-content: center; }
  #world-wrap {
    position: relative; flex: 1; min-width: 0; align-self: flex-start;
    max-width: min(100%, calc((100vh - 155px) * 10 / 7));
    border: 2px solid var(--line); border-radius: 14px; overflow: hidden;
    background: #141026;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  canvas#world {
    display: block; width: 100%; aspect-ratio: 10 / 7;
    /* 背板分辨率由 JS 按"显示尺寸 × DPR"逐 1/8 档对齐（见 game23.js setupCanvas）。
       这里只给兜底：对得上时 JS 会切成 pixelated 走硬边，要缩放时留 auto 让浏览器平滑。
       以前写死 pixelated，缩采样时 1px 线直接被打成马赛克。 */
    image-rendering: auto;
    filter: saturate(1.06) contrast(1.03);
  }
  /* 高清文字层：地图文字用 DOM 渲染（不跟画布一起像素化），保证清晰可读 */
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  #labels .lbl {
    position: absolute; transform: translate(-50%, 0); line-height: 1.25;
    font-size: 15px; font-weight: 500; color: #cfc6f2; white-space: nowrap;
    text-shadow: 0 1px 0 #141026, 0 0 6px rgba(20,16,38,.95), 0 2px 5px rgba(0,0,0,.85);
  }
  #labels .lbl.npc { color: #9fe1cb; }
  #labels .lbl.sign {
    font-size: 14px; color: #ffd98a; background: rgba(20,16,38,.88);
    border: 1px solid #6a4bb8; border-radius: 5px; padding: 1px 5px;
    box-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  #labels .lbl.ekey {
    font-size: 15px; font-weight: 700; color: #ffd98a;
    background: rgba(20,16,38,.92); border: 1px solid #e8b74a; border-radius: 7px;
    padding: 1px 8px; opacity: 0; transition: opacity .15s;
    transform: translate(-50%, -100%);
  }
  #labels .lbl.ekey.show { opacity: 1; animation: ebob 1s ease-in-out infinite; }
  @keyframes ebob { 0%, 100% { margin-top: 0; } 50% { margin-top: -3px; } }
  aside#side { width: 320px; flex: none; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  aside section {
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 8px 10px; display: flex; flex-direction: column; min-height: 0;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  #tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  #tabs button {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 9px; padding: 4px 0; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #tabs button.on { background: var(--violet); color: #fff; border-color: var(--violet); font-weight: 500; }
  .pane { overflow-y: auto; min-height: 0; flex: 1; display: none; }
  .pane.on { display: flex; flex-direction: column; gap: 4px; }
  .log-line { font-size: 13.5px; color: var(--txt); padding: 3px 0; border-bottom: 1px dashed rgba(74,63,117,.4); }
  .log-line .lt { color: var(--dim); font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; margin-right: 6px; }
  .mem-hold { color: var(--txt); }
  .mem-blk { color: var(--blk); background: rgba(106,95,158,.14); border-radius: 3px; padding: 0 1px; }
  .mem-lost { color: var(--blk); text-decoration: line-through; opacity: .75; }
  .kw-blk { color: var(--blk); background: rgba(106,95,158,.2); border-radius: 3px; }
  .mem-card {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 8px; font-size: 13.5px;
  }
  .mem-card .m-tag {
    display: inline-block; font-size: 10.5px; color: #fff; background: var(--violet);
    border-radius: 5px; padding: 0 6px; margin-right: 6px;
  }
  .mem-card .m-val { float: right; color: var(--gold2); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .mem-card.pawned { border-color: var(--gold); }
  .mem-card.pawned .cd { color: var(--gold2); font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .mem-card.lost { opacity: .55; border-style: dashed; }
  .arch-btn {
    display: block; width: 100%; text-align: left; margin-top: 4px; padding: 4px 9px;
    background: rgba(106, 95, 158, .14); border: 1px solid var(--line); border-radius: 7px;
    color: var(--txt); font-size: 12.5px; line-height: 1.5; cursor: pointer; font-family: inherit;
  }
  .arch-btn:hover { border-color: var(--gold); color: var(--gold2); }
  .arch-btn.gold { border-color: rgba(212, 175, 55, .55); }
  .empty-tip { color: var(--dim); font-size: 13px; text-align: center; padding: 10px 0; }
  .ticket-card {
    background: var(--panel2); border: 1px solid var(--gold); border-radius: 9px;
    padding: 6px 8px; font-size: 13.5px; display: flex; gap: 8px; align-items: center;
  }
  .ticket-card .tk-ico { color: var(--gold2); font-size: 15px; flex: none; }
  .ticket-card .tk-b { flex: 1; min-width: 0; }
  .ticket-card .tk-b b { font-weight: 500; display: block; }
  .ticket-card .tk-b i { font-style: normal; color: var(--dim); font-size: 11px; }
  #footer-tips {
    margin-top: 10px; text-align: center; color: var(--dim); font-size: 13px; flex: none;
  }
  #footer-tips .blk { color: var(--blk); }
  /* 事件模态 */
  #modal {
    position: absolute; inset: 0; background: rgba(16, 11, 32, .82);
    display: none; align-items: center; justify-content: center; z-index: 6; padding: 12px;
  }
  #modal.show { display: flex; }
  #m-card {
    width: min(520px, 94%); max-height: 92%; overflow-y: auto;
    background: var(--panel); border: 2px solid var(--gold); border-radius: 16px;
    padding: 16px 18px; box-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  #m-title { font-size: 16px; color: var(--gold2); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  #m-body { font-size: 14px; margin-bottom: 12px; }
  #m-body p { margin-bottom: 8px; }
  #m-btns { display: flex; flex-direction: column; gap: 6px; }
  #m-btns button {
    text-align: left; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 9px; padding: 7px 12px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #m-btns button:hover { border-color: var(--violet); }
  #m-btns button.gold { border-color: var(--gold); color: var(--gold2); }
  #m-btns button.danger { border-color: var(--red); color: var(--red); }
  #m-btns button:disabled { opacity: .45; cursor: not-allowed; }
  #m-btns button .cost { float: right; color: var(--gold2); font-family: ui-monospace, Consolas, monospace; }
  #m-btns button .sub { display: block; color: var(--dim); font-size: 11.5px; }
  #m-body input#riddle-input {
    width: 90px; background: #141026; border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 5px 8px; font-size: 15px; font-family: ui-monospace, Consolas, monospace;
    text-align: center;
  }
  .knock-track { display: flex; gap: 5px; margin: 8px 0; min-height: 22px; align-items: center; }
  .knock-track span { font-family: ui-monospace, Consolas, monospace; font-size: 15px; color: var(--gold2); }
  .knock-track span.wrong { color: var(--red); }
  .knock-track span.slot { color: var(--dim); opacity: .45; }
  .riddle-row { display: flex; gap: 8px; align-items: center; }
  /* 主界面 · 选章节（v46 像素版）—— 不另起一套设计语言：**主界面就是当铺柜台本身**。
     画布 960×672 逻辑（js/home-art.js 烘一张底图，每帧只重画小人/光圈/铜锁），文字与按钮
     留在 DOM 层，按逻辑坐标绝对定位到两本账册的标签牌上 —— 字因此不被像素化，键鼠可达。
     v45 那版三个坑，这版都堵上：① 遮罩只盖画布区 → 右侧面板与半截顶栏露在外头；
     ② 画布按屏幕算一套倍率、文字按另一套 → 两层对不上，字压在字上；
     ③ 卡内文字靠 margin 硬堆 + 按钮 absolute 钉死 → 提示语一折行就压按钮。
     现在：整屏盖、整块 stage 一起缩、卡内真 flex（行高锁死 + 提示行留两行 + 按钮顶到牌底）。
     字号收成四级：17（章名）/ 13（按钮）/ 12（招牌副题·页脚）/ 11（三行小字）。
     ⚠ 下面两组坐标来自 js/home-art.js 的 GEO：标签牌 = 封面 +34/+34、宽 −58、高 −84。
       第一章 108,278 → 标签牌 142,312 · 第二章 552,278 → 586,312（242×166）。
     旧版是一张 660×355 的 2px 金线白板压在平灰遮罩上 —— 跟世界两套材质语言，所以重做。 */
  /* 主界面是**整屏一个模式**，不是压在画布上的一张纸 —— 顶栏、右侧「日志/任务/相簿」
     面板全归它盖住。v45 只盖画布区，旁边那一列紫块、半截顶栏就是它漏出来的。
     fixed + 挂在 body 下：不受 #world-wrap 的 overflow:hidden / contain:paint 管。 */
  #home-modal {
    position: fixed; inset: 0; z-index: 120; overflow: hidden;
    display: none; align-items: center; justify-content: center;
    /* 大屏上 960×672 铺不满（画质口径就是 1:1，不放大）——剩下的地方不许是"没画完的黑":
       给它一块当铺暗处的席子（2×2 抖动）+ 一圈铜边，读起来才是"匾挂在暗处"，不是没画完。 */
    background: #0d0a16;
    background-image: repeating-conic-gradient(#141020 0% 25%, #0d0a16 0% 50%);
    background-size: 4px 4px;
  }
  #home-modal.show { display: flex; }

  /* v47：每章入场动画（账册翻开 → 暖光过渡 → 章节标题 → 落到该章第一屏）。
     三条口径写死在这一块里：① z-index 5 **低于 #modal 的 6** —— 二章开场独白压在它上头，
     照样看得见（不吞独白）；② pointer-events:none —— 它只许盖画面，绝不许拦交互（不卡住）；
     ③ 画布恒 960×672，装不下整体缩（跟主界面一套，不用自己算倍率）。 */
  #chapter-intro {
    /* **必须待在 #world-wrap 里**（跟 #modal 同一个层叠上下文）——z-index 只在同一层叠上下文里
       才有意义：挂在 body 上时它是 5 > #world-wrap 自己那一层，整块 UI（含开场独白）会被它盖住，
       实测独白量得出来在屏上、图里却看不见。搬进来之后 5 < 60 才是真的。 */
    position: absolute; inset: 0; z-index: 5; overflow: hidden;
    display: none; align-items: center; justify-content: center;
    background: #0a0714; pointer-events: none;
  }
  #chapter-intro.show { display: flex; }
  #chapter-intro.out { opacity: 0; transition: opacity .18s linear; }
  #ci-cv { display: block; image-rendering: pixelated; transform-origin: 50% 50%; }
  #ci-title { position: absolute; left: 0; right: 0; top: 38%; text-align: center; opacity: 0; transition: opacity .22s linear; }
  #chapter-intro.titled #ci-title { opacity: 1; }

/* 引水网格（v38：管道改成"恒常臂 + CSS 旋转"画法，不再是字形；格宽/管宽走变量，手机端只改变量） */
.sl-grid {
  --cell: 46px; --arm: 10px;
  display: grid; grid-template-columns: repeat(4, var(--cell)); gap: 4px; justify-content: center;
  margin: 10px 0; padding: 6px; background: #0f0c08; border: 1px solid var(--line, #3a3226);
}
.sl-cell { width: var(--cell); height: var(--cell); border: 1px solid #2b2418; background: #17130d; position: relative; }
.sl-cell.pipe { background: #1d1810; cursor: pointer; }
.sl-cell.pipe:hover { background: #251f14; }
/* v38 美术：管子当成"铁管"来画 —— 外圈暗描边 + 上下高光 = 圆柱感；
   接头是个带铆钉的方头。水位/水流的颜色走青金，跟盐田的冷色对上。 */
.sl-rot { position: absolute; inset: 0; transition: transform .16s steps(3, end); }
.sl-rot i {
  position: absolute; background: linear-gradient(180deg, #7d6c4e, #5d5039);
  box-shadow: 0 0 0 1px #1b160e, inset 0 1px 0 #a58e64, inset 0 -1px 0 #43392a;
}
.sl-rot i.a.up, .sl-rot i.a.dn { left: calc((var(--cell) - 2px - var(--arm)) / 2); width: var(--arm); height: 50%; }
.sl-rot i.a.lf, .sl-rot i.a.rt { top: calc((var(--cell) - 2px - var(--arm)) / 2); height: var(--arm); width: 50%; }
.sl-rot i.a.up { top: 0; background-image: linear-gradient(180deg, #4a3f2c, #7d6c4e); }
.sl-rot i.a.dn { bottom: 0; background-image: linear-gradient(180deg, #7d6c4e, #4a3f2c); }
.sl-rot i.a.lf { left: 0; } .sl-rot i.a.rt { right: 0; }
.sl-rot i.hub {
  left: calc((var(--cell) - 2px - var(--arm)) / 2); top: calc((var(--cell) - 2px - var(--arm)) / 2);
  width: var(--arm); height: var(--arm);
  background: radial-gradient(circle at 50% 50%, #b9a27a 0 2px, #6d5d43 2px);
  box-shadow: 0 0 0 1px #1b160e, inset 0 1px 0 #a58e64;
}
.sl-cell.pipe.flow { background: #12222b; }
.sl-cell.pipe.flow .sl-rot i {
  background: linear-gradient(180deg, #63c6e6, #2f7f9e);
  box-shadow: 0 0 0 1px #08222b, inset 0 1px 0 #cdf1ff, 0 0 7px rgba(99, 198, 230, .3);
  animation: sl-pulse 1.1s steps(2, end) infinite;
}
@keyframes sl-pulse {
  0%, 49% { background: linear-gradient(180deg, #63c6e6, #2f7f9e); }
  50%, 100% { background: linear-gradient(180deg, #7ed8f2, #3f9cbd); }
}
.sl-cell.src { background: #2a2110; border-color: var(--gold, #c9a227); }
.sl-gate { position: absolute; inset: 3px; background: linear-gradient(180deg, #463a19, #2f2611); box-shadow: inset 0 0 0 1px #c9a227; }
.sl-gate i { position: absolute; top: 2px; bottom: 2px; width: 4px; background: linear-gradient(180deg, #e6c46a, #a8852c); box-shadow: 0 0 0 1px #6d5713; }
.sl-gate i:nth-child(1) { left: 18%; } .sl-gate i:nth-child(2) { left: 44%; } .sl-gate i:nth-child(3) { left: 70%; }
.sl-cell.src.gush .sl-gate { box-shadow: inset 0 0 0 1px #ffe08a, 0 0 10px rgba(255, 224, 138, .25); }
.sl-cell.src.gush .sl-gate i { background: linear-gradient(180deg, #fff3c4, #ffd76a); animation: sl-pulse 1.1s steps(2, end) infinite; }
.sl-cell.pool { background: #101a1e; border-color: #2c4f52; }
.sl-pool { position: absolute; inset: 3px; background: linear-gradient(180deg, #0b1216, #0d1a1f); box-shadow: inset 0 0 0 1px #1d3a3d; overflow: hidden; }
.sl-pool i.lvl { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, #3f9cbd, #2b6f74); transition: height .22s steps(4, end); }
.sl-cell.pool.done { border-color: #8fc7c0; }
.sl-cell.pool.done .sl-pool i.lvl { height: 100%; background: linear-gradient(180deg, #6fc0bb, #2b6f74); box-shadow: inset 0 2px 0 #b7ece6; }

  #guide-note {

  #guide-note.flash { box-shadow: 0 0 0 2px rgba(240,196,106,.85), 0 6px 20px rgba(0,0,0,.5); }
  #guide-bar { display: flex; align-items: baseline; gap: 6px; font-size: 11px; letter-spacing: .4px; color: #6d5a35; }

  #guide-mom { margin: 3px 0 5px; font-size: 12.8px; line-height: 1.62; }

  #guide-mom::after { content: '」'; color: #8a7444; }
  #guide-mom .g-note { color: #6b5a38; }

  @media (max-width: 760px) {

  /* 跑腿任务的路线条：✓ 走过 / ● 这一段 / ○ 还没到 */
  .leg-route { margin-top: 5px; font-size: 12.5px; color: #cbb894; letter-spacing: .3px; }
  .leg-route i { font-style: normal; color: #6b6152; padding: 0 4px; }
</style>
<style>
/* ================= 像素皮 v31.4（A 线美术） =================
   世界是硬边像素（1 美术像素 = 1 逻辑像素、限定色阶、2×2 抖动），
   外壳原来却是圆角 + 弥散阴影 + 缓动 —— 一边像素一边 iOS。
   这一节只覆盖观感：圆角一律归零、面板切角、阴影改硬台阶、加 2×2 抖动底、
   动画/过渡走 steps()、等宽字。不动布局、不动尺寸、不动文案。
   要回退：整块删掉即可（前面的规则一条没改）。 */
*, *::before, *::after { border-radius: 0 !important; }

/* ① 面板底纹：4px 一格的 2×2 抖动 —— 像素画里最省的"材质" */
#topbar, aside#side section, #m-card, #toast, #dev-panel, .pane, .ticket-card, .tk-ico {
  background-image: repeating-conic-gradient(rgba(255,255,255,.035) 0 25%, transparent 0 50%) !important;
  background-size: 4px 4px !important;
  box-shadow: 0 3px 0 rgba(0,0,0,.42) !important;
}
/* ② 切角：像素 UI 的角是"缺一块"，不是圆的 */
#m-card, #toast, #dev-panel, button, .ch-lamp, .lz-cell, .ticket-card {
  clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px),
                     calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
}
/* ③ 硬边加粗 + 按下位移 1px（"咔"一下，不是渐变） */
button, #m-card, #toast, aside#side section, #topbar { border-width: 2px !important; }
button { transition: none !important; }
button:active { transform: translate(1px, 1px); }
/* ④ 进度条：分段刻度（像素仪表盘的读法） */
.bar, .ch-bar, #hud .bar {
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 1px, transparent 1px 7px) !important;
}
/* ⑤ 一切动画/过渡走 steps：硬跳，不缓动 */
*, *::before, *::after {
  animation-timing-function: steps(4, end) !important;
  transition-timing-function: steps(4, end) !important;
}
/* ⑥ 等宽字：不许引字体资源，等宽是最接近代码字形的一档 */
#app, #app button, #app input, #app textarea { font-family: Consolas, "Cascadia Mono", ui-monospace, monospace !important; }
/* 页签是中文短词，等宽会把"世界档案"挤成两行 —— 这几个回无衬线且不折行 */
[id^="tab-"] { font-family: inherit !important; white-space: nowrap !important; }
/* 世界里那层 DOM 字保持无衬线（等宽挤在一起反而难读） */
#labels .lbl { font-family: "Microsoft YaHei", system-ui, sans-serif !important; }
</style>
<!-- ==================== 对话框皮（E 线）· 只给剧情对话 ====================
     用户原话：「现在对话的这个对话框看的也不是很好看。我说的是对话过程中，
               不是最后的解谜和商店那个框。」
             「对话框不要放在屏幕正中间，放到屏幕下面的那种，类似于传说之下那种对话框。」

     判别式：#m-body 里有 .dlg-line 的模态才算剧情对话 —— .dlg-line 是
     game23.js renderDialog()（第 498 行）独有的标记，谜题 / 商店 / 结局一律没有。
     所以这一节**不需要动 game23.js 一行**，也天然够不着别人家的框。

     贴底口径：底边距 28px 固定，框高 auto **往上长**（框底不动）。
     九宫格：border-image-slice 58 切四角（◆✦ 与双线金边锁死），只让中段伸缩。

     要回退：整块删掉即可（前面的规则一条没改）。 -->
<style>
  /* ①-a 让画布成为 fixed 后代的**包含块** —— 这是"贴底贴在哪"的关键一步。
     全局那条 #modal 是 position:fixed（本文件第 506 行，全屏模态的既有设计），
     直接贴底会把框摆到**视口**底部 —— 那会横跨侧栏与页脚、整个落在画面之外
     （实测：框 1180 宽落在 1030 宽的画布外，底边 y=872 落在画布底 790 之下）。
     剧情对话的框属于游戏画面（Undertale 的框也在游戏窗里），所以要把基准收回画布。
     ⚠ 这里**不用**把 #modal 改成 absolute —— 那会踩掉 .workbuddy/tests/smoke23.js ㊴
     钉的老判据（「弹窗必须视口级 fixed，absolute 会被画布区高度截断」）。
     改用 contain:paint：它让 #world-wrap 成为 fixed 后代的包含块，
     于是 #modal 的 **computed position 仍然是 fixed**（老判据不惊动），实际却按画布定位。
     contain:paint 的语义（后代不画到框外）跟 #world-wrap 本来就有的 overflow:hidden
     完全一致，所以除了"包含块"这一条，观感零变化。只作用于对话态。 */
  #world-wrap:has(#m-body > .dlg-line) { contain: paint; }

  /* ① 模态从「居中」改成「底部对齐 + 固定底边距」 */
  #modal:has(#m-body > .dlg-line) {
    align-items: flex-end;
    justify-content: center;
    padding: 12px 0 28px;              /* 底边距 28px —— 固定值，框往上长它不动 */
    /* 只留一条贴地的暗角给字托底：画面上 2/3 一点不糊 */
    background: linear-gradient(to top,
                rgba(16,11,32,.66) 0%, rgba(16,11,32,.34) 38%, rgba(16,11,32,0) 64%);
  }

  /* ② 九宫格底框：四角锁死、中段伸缩、高度 auto 向上生长 */
  #modal:has(#m-body > .dlg-line) #m-card {
    --dlg-frame: 36px;
    position: relative;
    width: 90%;
    max-width: 1180px;
    height: auto;
    max-height: 100%;                  /* 兜底：绝不让框顶穿舞台（实测 10 行态用不到） */
    /* 用户报障：▼ 卡在框内偏上位置 —— 真因是 #m-btns 的 right/bottom 相对 **padding box** 计算，
       而 padding box 缩在 36px 边框里侧 ⇒ 怎么调都离框底 40px 以上。要让 ▼ 落进底边那道金线带，
       就得允许它画到 padding box 之外。长文仍由 #m-body 自己滚（flex + min-height:0），
       卡片这层高度是 auto、本来就不滚，所以这里放开不改变极端长文的行为。 */
    overflow: visible;
    margin: 0;
    padding: 6px 14px 8px 14px;
    /* 像素皮 v31.4 用 !important 强推 border-width:2px + clip-path 切角 ——
       九宫格的 36px 框和 ◆✦ 角饰得压回来，所以这里同权 !important。
       ⚠ 这里**不能用 border 简写**：简写会把 border-image 一并重置成 none。 */
    border-style: solid !important;
    border-color: transparent !important;
    border-width: var(--dlg-frame) !important;
    /* 素材换新：旧图里焊着原工程的**薰衣草进度条**与左上角一枚 ✦（截图残留），
       已由 tools/make-dialogue-skin.mjs 清理成 174×174 纯九宫格源。?v=2 = 缓存口径。 */
    border-image-source: url("assets/dialogue/dlg-panel.png?v=2");
    border-image-slice: 58 fill;
    border-image-width: var(--dlg-frame);
    border-image-repeat: stretch;
    clip-path: none !important;
    background-color: #1c1531 !important;
    background-image: none !important;
    box-shadow: 0 3px 0 rgba(0,0,0,.42) !important;
  }

  /* ③ 名牌：文本层压在页签上（以后换角色不用重做图）；蝴蝶是固定件，不跟着拉 */
  #modal:has(#m-body > .dlg-line) #m-title {
    position: relative;
    display: block;
    width: fit-content;
    height: auto;
    margin: 0 0 12px;                  /* 用户报障：正文紧贴名牌下沿 → 给足一口气 */
    padding: 0 12px;
    font-size: 14px;
    font-weight: 700;
    line-height: 22px;
    letter-spacing: 1px;
    color: var(--gold2);
    text-shadow: 0 1px 0 rgba(0,0,0,.65);
    white-space: nowrap;
    /* 名牌板：源图是一块**缺底边**的截图（y=67 处被裁掉）⇒ 看着像没关上的标签。
       make-dialogue-skin.mjs 已用顶边镜像把它补成完整板（214×46），这里按 6/30 九宫格拉伸：
       上下 6 行 = 3px 金线（1:1 不缩放），左右 30px 端帽画成 15px（金线 ≈2px，与底框边线同档）。 */
    border-style: solid;
    border-color: transparent;
    border-width: 3px 15px;
    border-image-source: url("assets/dialogue/dlg-tab.png?v=2");
    border-image-slice: 6 30 6 30 fill;
    border-image-width: 3px 15px;
    border-image-repeat: stretch;
  }
  #modal:has(#m-body > .dlg-line) #m-title::after {
    content: '';
    position: absolute;
    left: 100%;
    bottom: 23px;                      /* padding box 高 22 ⇒ 22 就是名牌板顶沿，23 = 压住 1px */
    width: 54px;
    height: 26px;
    margin-left: 17px;                 /* left:100% 是 padding box 右沿，+15 补回右边框宽，+2 留缝 */
    /* 旧图把蝴蝶身后那条**面板顶边金线**一起切了进来 —— 玩家看到的就是"蝴蝶的横线"。
       新图只取蝴蝶本体（y≤52），现在停在名牌板顶沿上。 */
    background: url("assets/dialogue/dlg-butterfly.png?v=2") left center / 100% 100% no-repeat;
    pointer-events: none;
  }

  /* ④ 正文 */
  #modal:has(#m-body > .dlg-line) #m-body {
    margin: 0;                          /* 基础规则给的 12px 底距在框里是白占高度 */
    padding-right: 0;                /* ▼ 已挪进底边金线带，末行不必再让道 */
    font-size: 15px;
    line-height: 1.8;
    color: #efe7d6;
    /* overflow **保持**基础规则的 auto —— "弹窗正文要能滚"是 smoke23 ㊴ 的老判据，
       不能为了好看把它关掉。高度 auto 的卡片里它本来就不滚；
       只有超过 max-height 的极端长文才滚，那正是兜底该干的事。 */
  }
  #modal:has(#m-body > .dlg-line) #m-body .dlg-line { margin: 0; }

  /* ⑤ ▼ 继续指示：框内右下角（按源图 45×46 等比） */
  #modal:has(#m-body > .dlg-line) #m-btns {
    position: absolute;
    /* 落进右下角那道 36px 金线带里：right/bottom 相对 padding box，所以要取负值把它推出去。
       -14 / -16 ⇒ 实测（4× 放大图）箭头整体落在底边金线**上沿之上**、右沿离框外沿 14px：
       贴住右下角，又同时躲开那道金线和角上那枚 ◆。 */
    right: -14px;
    bottom: -16px;
    display: block;
    margin: 0;
  }
  /* ⚠ 这里**不能**把按钮压成 27×28 —— 基础规则 index.html:531 的
     `#m-btns button { min-height: 44px }` 是给触屏留的可点面积，为了好看把它压掉
     就是拿可点性换观感。做法：可点区照旧 44×44，箭头按源图 27×28 贴在按钮右下角画。 */
  #modal:has(#m-body > .dlg-line) #m-btns button {
    width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    border: 0 !important;
    border-radius: 0 !important;
    clip-path: none !important;
    /* 旧图 45×46：▼ 只占左上角，右下角还焊着一枚 ✦、整张又是不透明深紫底 ——
       画出来就是"一块比卡面亮的方砖 + 一个像 × 的小伪影"。新图 27×17 只留 ▼，透明底。 */
    background: url("assets/dialogue/dlg-arrow.png?v=2") right bottom / 27px 17px no-repeat !important;
    color: transparent !important;      /* 标签仍留在 DOM 里（读屏与测试还能取到） */
    font-size: 0 !important;
    line-height: 0 !important;
    cursor: pointer;
    animation: dlgBob 1.1s steps(2, end) infinite;
  }
  @keyframes dlgBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

  /* ⑥ 窄屏：框厚与底边距一起收窄，别把画布糊满 */
  @media (max-width: 760px) {
    #modal:has(#m-body > .dlg-line) { padding: 8px 0 16px; }
    #modal:has(#m-body > .dlg-line) #m-card {
      --dlg-frame: 22px;
      width: 94%;
      padding: 2px 34px 6px 6px;
    }
    #modal:has(#m-body > .dlg-line) #m-title { font-size: 12.5px; line-height: 20px; border-width: 3px 13px; border-image-width: 3px 13px; }
    #modal:has(#m-body > .dlg-line) #m-title::after { bottom: 21px; width: 46px; height: 22px; margin-left: 15px; }
    #modal:has(#m-body > .dlg-line) #m-body { font-size: 13px; line-height: 1.8; }
    #modal:has(#m-body > .dlg-line) #m-btns { right: -12px; bottom: -16px; }
    #modal:has(#m-body > .dlg-line) #m-btns button { background-size: 22px 14px !important; }
  }
</style>

<div id="app">

<script>
/* v37 全屏键（功能增加线 · D）。U 键 / 顶栏「⛶ 全屏」按钮 切换全屏，ESC 退出。
   三条口径：
     ① **只认用户手势**：requestFullscreen 只在按键/点击里调，页面加载绝不自动进
        （否则浏览器以 NotAllowedError 拒掉，白留一条 console 报错）。
     ② **全屏后视口变了，画布背板必须重算**：走游戏自己暴露的 GAME23.QUALITY.setup()
        （就是 game23.js 的 setupCanvas —— 它本来也挂在 window.resize 上；这里在
        fullscreenchange 后补调，防的是 resize 早于排版落定的时机差，幂等、多调不亏）。
     ③ 按钮文字/高亮跟 document.fullscreenElement 同步 —— 用 ESC 退、用键退、用按钮退，
        三种退法都跟得上。
   不引任何外部依赖；file:// 双击、--app 独立窗口、线上三种打开方式同样有效。 */
(function () {
  var KEY = 'u';
  function appEl() { return document.getElementById('app') || document.documentElement; }
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function supported() { var e = document.documentElement; return !!(e.requestFullscreen || e.webkitRequestFullscreen); }
  function enter() {
    var el = appEl(), fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn) return null;
    var p = fn.call(el);
    if (p && p.catch) p.catch(function () { /* 被浏览器拒了（无手势/iframe 无 allow）：安静失败，别炸 console */ });
    return p;
  }
  function leave() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (!fn) return null;
    var p = fn.call(document);
    if (p && p.catch) p.catch(function () {});
    return p;
  }
  function toggle() { if (fsEl()) leave(); else enter(); }
  function sync() {
    var b = document.getElementById('btn-fs'); if (!b) return;
    var on = !!fsEl();
    b.textContent = on ? '⛶ 退出全屏' : '⛶ 全屏';
    b.classList.toggle('on', on);
    b.title = on ? '退出全屏（U 键 / ESC）' : '全屏（U 键，ESC 退出）';
  }
  function reflow() {
    var g = window.GAME23, setup = g && g.QUALITY && g.QUALITY.setup;
    if (typeof setup !== 'function') return;
    try { setup(); } catch (e) { /* 重算失败不该打断全屏本身 */ }
    window.setTimeout(function () { try { setup(); } catch (e) {} }, 80);   /* 兜排版时机差 */
  }
  document.addEventListener('fullscreenchange', function () { sync(); reflow(); });
  document.addEventListener('webkitfullscreenchange', function () { sync(); reflow(); });
  window.addEventListener('keydown', function (e) {
    var t = e.target || {}, tag = (t.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || t.isContentEditable) return;   /* 打字时不抢键 */
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key !== KEY && e.key !== KEY.toUpperCase()) return;
    e.preventDefault();
    toggle();
  });
  var btn = document.getElementById('btn-fs');
  if (btn) {
    if (supported()) btn.addEventListener('click', function () { toggle(); });
    else btn.style.display = 'none';    /* 不支持（如 iOS Safari）就别摆个按不动的按钮 */
  }
  window.addEventListener('load', sync);
  sync();
})();
</script>
