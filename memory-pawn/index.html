<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>记忆当铺 · Memory Pawn</title>
<style>
  :root {
    --bg: #1b1530;
    --panel: #262043;
    --panel2: #2f2852;
    --line: #4a3f75;
    --txt: #f0eaff;
    --dim: #b3a9dc;
    --gold: #e8b74a;
    --gold2: #ffd98a;
    --violet: #b48ae0;
    --green: #7ed6a0;
    --red: #e0708a;
    --blk: #6a5f9e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--txt); height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px; line-height: 1.65; padding: 10px;
    overflow: hidden; /* 页面本身不滚——滚轮只作用于右侧面板 */
  }
  #app { max-width: 1180px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
  header#topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 8px 16px; margin-bottom: 10px; flex: none;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  #logo { font-weight: 700; letter-spacing: 3px; color: var(--gold2); font-size: 17px; white-space: nowrap; }
  #logo small { color: var(--dim); font-weight: 400; letter-spacing: 0; margin-left: 8px; font-size: 11px; }
  #hud { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-family: ui-monospace, Consolas, monospace; }
  #hud .hitem { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; color: var(--dim); }
  #hud b { color: #fff; font-size: 15px; }
  #hud .gold-ico { color: var(--gold2); }
  .bar { width: 100px; height: 9px; background: #141026; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--violet); transition: width .25s; }
  .bar i.warn { background: var(--gold); }
  .bar i.bad { background: var(--red); }
  #relics { letter-spacing: 2px; font-size: 13px; }
  #relics .got { color: var(--gold2); }
  #relics .no { color: var(--line); }
  #btn-restart {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  #btn-restart:hover { color: var(--txt); border-color: var(--red); }
  #btn-dev {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer;
    font-family: ui-monospace, Consolas, monospace;
  }
  #btn-dev:hover { color: var(--txt); border-color: var(--violet); }
  #btn-dev.on { color: #fff; background: var(--red); border-color: var(--red); }
  #btn-bgm {
    background: var(--panel2); border: 1px solid var(--line); color: var(--gold2);
    border-radius: 8px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  #btn-bgm:hover { color: #fff; border-color: var(--gold); }
  #btn-bgm.off { color: var(--dim); text-decoration: line-through; }
  /* 开发者模式浮层（z 最高：modal 6 / 结局 7 / 确认 8 之上，可与游戏面板同时操作） */
  #dev-panel {
    position: absolute; top: 10px; right: 10px; width: 312px; max-height: calc(100% - 20px);
    background: rgba(24, 18, 44, .97); border: 2px solid var(--red); border-radius: 12px;
    z-index: 9; display: none; flex-direction: column;
    box-shadow: 0 5px 0 rgba(0,0,0,.4);
  }
  #dev-panel.show { display: flex; }
  #dev-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; border-bottom: 1px solid var(--line); flex: none;
  }
  #dev-head b { color: var(--red); font-size: 13px; letter-spacing: 2px; }
  #dev-head small { color: var(--dim); font-size: 10.5px; margin-left: 8px; }
  #dev-close { background: none; border: none; color: var(--dim); font-size: 15px; cursor: pointer; line-height: 1; }
  #dev-close:hover { color: var(--txt); }
  #dev-body { overflow-y: auto; padding: 8px 10px 10px; font-size: 12px; }
  #dev-body .dv-sec { margin: 9px 0 4px; color: var(--gold2); font-size: 11.5px; letter-spacing: 1px; }
  #dev-body .dv-sec:first-child { margin-top: 0; }
  #dev-body .dv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  #dev-body .dv-grid.tp { grid-template-columns: repeat(3, 1fr); }
  #dev-body button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 7px; padding: 4px 2px; font-size: 11.5px; cursor: pointer; font-family: inherit;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #dev-body button:hover { border-color: var(--violet); }
  #dev-body button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
  #dev-body button.warn { border-color: var(--red); color: var(--red); }
  #dev-body button:disabled { opacity: .35; cursor: not-allowed; }
  /* 危险操作整行铺开：四列格里「从第一天重新开始」会被省略号吃掉，必须独占一行 */
  #dev-body button[data-dev="wipe"] { grid-column: 1 / -1; }
  #confirm-box {
    position: absolute; inset: 0; background: rgba(16, 11, 32, .85);
    display: none; align-items: center; justify-content: center; z-index: 8;
  }
  #confirm-box.show { display: flex; }
  #confirm-card {
    background: var(--panel); border: 2px solid var(--red); border-radius: 14px;
    padding: 18px 24px; text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  #confirm-card p { margin-bottom: 14px; font-size: 14px; }
  #confirm-card button {
    margin: 0 6px; border-radius: 9px; padding: 6px 18px; font-size: 13.5px;
    cursor: pointer; font-family: inherit;
  }
  #cf-yes { background: var(--red); color: #fff; border: none; }
  #cf-no { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); }
  main { display: flex; gap: 10px; align-items: stretch; flex: 1; min-height: 0; justify-content: center; }
  #world-wrap {
    position: relative; flex: 1; min-width: 0; align-self: flex-start;
    max-width: min(100%, calc((100vh - 155px) * 10 / 7));
    border: 2px solid var(--line); border-radius: 14px; overflow: hidden;
    background: #141026;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  canvas#world {
    display: block; width: 100%; aspect-ratio: 10 / 7;
    /* 背板分辨率由 JS 按"显示尺寸 × DPR"逐 1/8 档对齐（见 game23.js setupCanvas）。
       这里只给兜底：对得上时 JS 会切成 pixelated 走硬边，要缩放时留 auto 让浏览器平滑。
       以前写死 pixelated，缩采样时 1px 线直接被打成马赛克。 */
    image-rendering: auto;
    filter: saturate(1.06) contrast(1.03);
  }
  /* 高清文字层：地图文字用 DOM 渲染（不跟画布一起像素化），保证清晰可读 */
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  #labels .lbl {
    position: absolute; transform: translate(-50%, 0); line-height: 1.25;
    font-size: 15px; font-weight: 500; color: #cfc6f2; white-space: nowrap;
    text-shadow: 0 1px 0 #141026, 0 0 6px rgba(20,16,38,.95), 0 2px 5px rgba(0,0,0,.85);
  }
  #labels .lbl.npc { color: #9fe1cb; }
  #labels .lbl.sign {
    font-size: 14px; color: #ffd98a; background: rgba(20,16,38,.88);
    border: 1px solid #6a4bb8; border-radius: 5px; padding: 1px 5px;
    box-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  #labels .lbl.ekey {
    font-size: 15px; font-weight: 700; color: #ffd98a;
    background: rgba(20,16,38,.92); border: 1px solid #e8b74a; border-radius: 7px;
    padding: 1px 8px; opacity: 0; transition: opacity .15s;
    transform: translate(-50%, -100%);
  }
  #labels .lbl.ekey.show { opacity: 1; animation: ebob 1s ease-in-out infinite; }
  @keyframes ebob { 0%, 100% { margin-top: 0; } 50% { margin-top: -3px; } }
  aside#side { width: 320px; flex: none; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  aside section {
    background: var(--panel); border: 2px solid var(--line); border-radius: 12px;
    padding: 8px 10px; display: flex; flex-direction: column; min-height: 0;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  #tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  #tabs button {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 9px; padding: 4px 0; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #tabs button.on { background: var(--violet); color: #fff; border-color: var(--violet); font-weight: 500; }
  .pane { overflow-y: auto; min-height: 0; flex: 1; display: none; }
  .pane.on { display: flex; flex-direction: column; gap: 4px; }
  .log-line { font-size: 13.5px; color: var(--txt); padding: 3px 0; border-bottom: 1px dashed rgba(74,63,117,.4); }
  .log-line .lt { color: var(--dim); font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; margin-right: 6px; }
  .mem-hold { color: var(--txt); }
  .mem-blk { color: var(--blk); background: rgba(106,95,158,.14); border-radius: 3px; padding: 0 1px; }
  .mem-lost { color: var(--blk); text-decoration: line-through; opacity: .75; }
  .kw-blk { color: var(--blk); background: rgba(106,95,158,.2); border-radius: 3px; }
  .mem-card {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 8px; font-size: 13.5px;
  }
  .mem-card .m-tag {
    display: inline-block; font-size: 10.5px; color: #fff; background: var(--violet);
    border-radius: 5px; padding: 0 6px; margin-right: 6px;
  }
  .mem-card .m-val { float: right; color: var(--gold2); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .mem-card.pawned { border-color: var(--gold); }
  .mem-card.pawned .cd { color: var(--gold2); font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .mem-card.lost { opacity: .55; border-style: dashed; }
  .arch-btn {
    display: block; width: 100%; text-align: left; margin-top: 4px; padding: 4px 9px;
    background: rgba(106, 95, 158, .14); border: 1px solid var(--line); border-radius: 7px;
    color: var(--txt); font-size: 12.5px; line-height: 1.5; cursor: pointer; font-family: inherit;
  }
  .arch-btn:hover { border-color: var(--gold); color: var(--gold2); }
  .arch-btn.gold { border-color: rgba(212, 175, 55, .55); }
  .empty-tip { color: var(--dim); font-size: 13px; text-align: center; padding: 10px 0; }
  .ticket-card {
    background: var(--panel2); border: 1px solid var(--gold); border-radius: 9px;
    padding: 6px 8px; font-size: 13.5px; display: flex; gap: 8px; align-items: center;
  }
  .ticket-card .tk-ico { color: var(--gold2); font-size: 15px; flex: none; }
  .ticket-card .tk-b { flex: 1; min-width: 0; }
  .ticket-card .tk-b b { font-weight: 500; display: block; }
  .ticket-card .tk-b i { font-style: normal; color: var(--dim); font-size: 11px; }
  #footer-tips {
    margin-top: 10px; text-align: center; color: var(--dim); font-size: 13px; flex: none;
  }
  #footer-tips .blk { color: var(--blk); }
  /* 事件模态 */
  #modal {
    position: absolute; inset: 0; background: rgba(16, 11, 32, .82);
    display: none; align-items: center; justify-content: center; z-index: 6; padding: 12px;
  }
  #modal.show { display: flex; }
  #m-card {
    width: min(520px, 94%); max-height: 92%; overflow-y: auto;
    background: var(--panel); border: 2px solid var(--gold); border-radius: 16px;
    padding: 16px 18px; box-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  #m-title { font-size: 16px; color: var(--gold2); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  #m-body { font-size: 14px; margin-bottom: 12px; }
  #m-body p { margin-bottom: 8px; }
  #m-btns { display: flex; flex-direction: column; gap: 6px; }
  #m-btns button {
    text-align: left; background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 9px; padding: 7px 12px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #m-btns button:hover { border-color: var(--violet); }
  #m-btns button.gold { border-color: var(--gold); color: var(--gold2); }
  #m-btns button.danger { border-color: var(--red); color: var(--red); }
  #m-btns button:disabled { opacity: .45; cursor: not-allowed; }
  #m-btns button .cost { float: right; color: var(--gold2); font-family: ui-monospace, Consolas, monospace; }
  #m-btns button .sub { display: block; color: var(--dim); font-size: 11.5px; }
  #m-body input#riddle-input {
    width: 90px; background: #141026; border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 5px 8px; font-size: 15px; font-family: ui-monospace, Consolas, monospace;
    text-align: center;
  }
  .knock-track { display: flex; gap: 5px; margin: 8px 0; min-height: 22px; align-items: center; }
  .knock-track span { font-family: ui-monospace, Consolas, monospace; font-size: 15px; color: var(--gold2); }
  .knock-track span.wrong { color: var(--red); }
  .knock-track span.slot { color: var(--dim); opacity: .45; }
  .riddle-row { display: flex; gap: 8px; align-items: center; }
  /* 结局模态 */
  #end-modal {
    position: absolute; inset: 0; background: rgba(16, 11, 32, .9);
    display: none; align-items: center; justify-content: center; z-index: 7; padding: 12px;
  }
  #end-modal.show { display: flex; }
  #end-card {
    width: min(520px, 94%); background: var(--panel); border: 2px solid var(--gold);
    border-radius: 16px; padding: 24px 26px; text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.35);
  }
  #end-name { font-size: 26px; color: var(--gold2); font-weight: 700; letter-spacing: 6px; margin-bottom: 12px; }
  #end-text { text-align: left; font-size: 14px; margin-bottom: 14px; }
  #end-text p { margin-bottom: 8px; }
  #end-stats { font-size: 12px; color: var(--dim); margin-bottom: 14px; font-family: ui-monospace, Consolas, monospace; }
  #end-card button {
    background: var(--gold); color: #241a08; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; padding: 10px 40px; cursor: pointer; letter-spacing: 2px; font-family: inherit;
  }
  #toast {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(38, 32, 67, .95); border: 1px solid var(--gold); color: var(--gold2);
    border-radius: 9px; padding: 6px 16px; font-size: 13.5px; opacity: 0;
    pointer-events: none; transition: opacity .25s; z-index: 60; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  /* 小游戏面板 */
  #mini-stage { min-height: 210px; }
  .mini-hint { color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }
  .mini-progress { font-size: 12.5px; color: var(--gold2); margin-top: 6px; }
  .mini-dial { display: block; margin: 4px auto; }
  .tone-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .tone-pad {
    width: 62px; height: 62px; border-radius: 10px; border: 2px solid rgba(0,0,0,.45);
    font-size: 19px; font-weight: bold; color: rgba(20,16,38,.88); cursor: pointer; font-family: inherit;
    opacity: .45; filter: grayscale(.45); transition: opacity .1s, filter .1s, transform .05s;
  }
  .tone-pad.lit { opacity: 1; filter: none; transform: scale(1.09); box-shadow: 0 0 14px rgba(255,235,170,.55); }
  /* ---------- 手机 / 触屏适配 ---------- */
  html, body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button, input { touch-action: manipulation; }
  /* 虚拟按键：默认隐藏，触屏或窄屏显示；面板层级低于模态/结局/确认框，方向键组可在模态打开时被单独隐藏 */
  #touch-ui { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 7; }
  #dpad {
    position: absolute; left: 12px; bottom: 12px; pointer-events: none;
    display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 3px;
  }
  #dpad button, #btn-e {
    pointer-events: auto; background: rgba(38, 32, 67, .62); border: 1px solid var(--line);
    color: var(--gold2); border-radius: 12px; font-size: 17px; cursor: pointer;
    font-family: inherit; touch-action: none; -webkit-user-select: none; user-select: none;
    box-shadow: 0 2px 0 rgba(0,0,0,.35); transition: background .08s;
  }
  #dpad button:active, #dpad button.press, #btn-e:active { background: rgba(180, 138, 224, .55); }
  #dpad button:nth-child(1) { grid-column: 2; grid-row: 1; }
  #dpad button:nth-child(2) { grid-column: 1; grid-row: 2; }
  #dpad button:nth-child(3) { grid-column: 3; grid-row: 2; }
  #dpad button:nth-child(4) { grid-column: 2; grid-row: 3; }
  #btn-e {
    position: absolute; right: 14px; bottom: 20px; width: 62px; height: 62px;
    border-radius: 50%; font-size: 20px; font-weight: 700; border-color: var(--gold);
  }
  @media (hover: none), (max-width: 760px) {
    #touch-ui { display: block; }
  }
  /* 窄屏（手机竖屏）：上下堆叠布局 */
  @media (max-width: 760px) {
    body { padding: 6px; }
    #app { max-width: 100%; }
    header#topbar { gap: 7px; padding: 6px 10px; border-radius: 11px; margin-bottom: 6px; }
    #logo { font-size: 14px; letter-spacing: 1px; }
    #logo small { display: none; }
    #hud { gap: 7px; }
    #hud .hitem { font-size: 10.5px; gap: 4px; }
    #hud b { font-size: 12.5px; }
    .bar { width: 60px; height: 8px; }
    #relics { font-size: 11px; }
    #btn-restart, #btn-bgm, #btn-dev { padding: 3px 8px; font-size: 11px; }
    main { flex-direction: column; }
    #world-wrap {
      max-width: min(100%, calc((100vh - 220px) * 10 / 7));
      margin: 0 auto; align-self: auto;
    }
    #labels .lbl { font-size: 11px; }
    #labels .lbl.sign { font-size: 10.5px; padding: 1px 4px; }
    #labels .lbl.ekey { font-size: 11px; }
    aside#side { width: 100%; flex: 1; min-height: 140px; }
    #dev-panel { width: calc(100vw - 16px); max-width: 340px; right: 6px; top: 6px; }
    #toast { font-size: 12px; max-width: 92%; white-space: normal; text-align: center; }
    .tone-pad { width: 52px; height: 52px; font-size: 16px; }
    #m-card { padding: 13px 14px; }
  }
  /* 手机横屏矮窗：画布预留更小，保住 D-pad 空间 */
  @media (max-height: 480px) and (max-width: 920px) {
    #world-wrap { max-width: min(100%, calc((100vh - 96px) * 10 / 7)); }
    aside#side { width: 240px; }
  }
  .mini-clues { margin: 6px 0 10px; }
  .mini-clue {
    font-size: 12.5px; color: var(--txt); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; margin-bottom: 4px;
  }
  .mini-clue.hint { color: var(--gold2); border-color: var(--gold2); }
  .ledger-rows { display: flex; flex-direction: column; gap: 6px; }
  .ledger-row {
    display: flex; gap: 10px; align-items: baseline; text-align: left;
    background: var(--panel2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .ledger-row:hover { border-color: var(--gold2); }
  .ledger-row b { color: var(--gold2); min-width: 60px; }
  .ledger-row i { margin-left: auto; color: var(--dim); font-style: normal; font-size: 12px; }
  .ledger-row.wrong { opacity: .45; border-style: dashed; text-decoration: line-through; }
  .ledger-note { font-size: 12px; color: var(--dim); margin: -2px 0 2px 6px; }
  @media (max-width: 880px) {
    main { flex-direction: column; }
    aside#side { width: 100%; }
    html, body { overflow: auto; }
    #app { height: auto; }
  }
</style>
<style>
/* v23 追加样式：新场景横幅 + 谜题控件（沿用 v22 的 CSS 变量与观感） */
#scene-banner {
  position: absolute; left: 0; right: 0; top: 10px; text-align: center;
  font-size: 15px; letter-spacing: 3px; color: var(--gold2, #e0b25c);
  text-shadow: 0 1px 6px #000; pointer-events: none; opacity: 0;
  transition: opacity .35s ease; z-index: 6;
}
#scene-banner.on { opacity: 1; }
#scene-banner small { display: block; font-size: 11px; letter-spacing: 1px; color: var(--dim, #8b8b8b); margin-top: 2px; }

/* 幕间卡：换一幕的时候得让玩家知道"进新的一幕了"（以前只有场景横幅，看不出换了幕） */
#act-card {
  position: absolute; left: 0; right: 0; top: 33%; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity .55s ease; z-index: 7;
}
#act-card.on { opacity: 1; }
#act-card .ac-no { font-size: 12px; letter-spacing: 7px; color: var(--gold2, #e0b25c); }
#act-card .ac-name { font-size: 30px; letter-spacing: 6px; color: #f4ecd8; margin: 4px 0 7px;
  text-shadow: 0 2px 20px #000, 0 0 30px rgba(240,196,106,.30); }
#act-card .ac-line { font-size: 13px; color: #cec4ae; letter-spacing: 1px; text-shadow: 0 2px 12px #000; }
#act-card .ac-rule { height: 1px; margin: 9px 22%; background: linear-gradient(90deg, transparent, rgba(201,162,39,.65), transparent); }

/* 通用谜题控件 */
.pz-tip { font-size: 12.5px; color: var(--dim, #9a9a9a); margin: 2px 0 8px; }
.pz-clue { font-size: 12.5px; color: var(--gold2, #e0b25c); background: var(--panel2, #221c14);
  border: 1px solid var(--line, #3a3226); border-radius: 8px; padding: 5px 10px; margin-bottom: 6px; }
.pz-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
.pz-opt, .pz-btn {
  font-family: inherit; font-size: 13.5px; color: var(--txt, #e6e0d6);
  background: var(--panel2, #221c14); border: 1px solid var(--line, #3a3226);
  border-radius: 10px; padding: 8px 14px; cursor: pointer; min-width: 44px; min-height: 40px;
}
.pz-opt:hover, .pz-btn:hover { border-color: var(--gold2, #e0b25c); }

/* 手机：弹窗必须占满视口 —— 原来 position:absolute 依附画布区，375 宽下 4×4 网格只露 2 行、
   复位/开闸按钮直接够不着（实测）。改成视口级遮罩 + 正文滚动 + 按钮常驻底部。 */
#modal {
  position: fixed; inset: 0; z-index: 60;
}
#m-card {
  display: flex; flex-direction: column;
  max-height: calc(100vh - 24px);
  max-height: calc(100dvh - 24px);
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
#m-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
#m-btns { flex: 0 0 auto; }
@media (max-width: 420px) {
  #m-card { width: calc(100vw - 16px); padding: 12px 12px; border-radius: 12px; }
  #m-title { font-size: 15px; }
  .sl-grid { gap: 4px !important; }
  .sl-cell { width: 38px !important; height: 38px !important; }
}
/* 手机：弹窗（对话/谜题）打开时收起触屏控件——实测 375 宽下面板会被方向盘压住半格网格 */
/* 「记」面板：这是游戏的名字所在 —— 当出去的记，正文在你这里就是空的 */
.mem-tag { display: inline-block; min-width: 42px; color: #f0c060; font-weight: 700; margin-right: 6px; }
.mem-w { color: #9aa4c8; font-size: 12px; margin-left: 6px; }
.mem-blank { color: #6f7896; font-style: italic; }
.arc-item.locked .mem-tag { color: #8a7f66; }
body.mp-modal #dpad,
body.mp-modal #btn-e { display: none !important; }
#m-btns button { min-height: 44px; }   /* 触屏可点面积 */
.pz-opt.on, .pz-opt.sel { border-color: var(--gold, #c9a227); background: #3a2f18; color: #fff; }
.pz-opt.wrong { border-color: var(--red, #c05a5a); color: var(--red, #c05a5a); text-decoration: line-through; opacity: .6; }
.pz-opt:disabled, .pz-btn:disabled { opacity: .45; cursor: default; }
.pz-slots { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
.pz-slot {
  width: 52px; height: 52px; border: 1px dashed var(--line, #3a3226); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--gold2, #e0b25c);
}
.pz-slot.filled { border-style: solid; border-color: var(--gold, #c9a227); background: #2c2415; }
.pz-progress { text-align: center; font-size: 12.5px; color: var(--dim, #9a9a9a); margin-top: 6px; }

/* 秤 */
.sc-pan { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0; }
.sc-beam { width: 120px; height: 6px; background: var(--line, #3a3226); border-radius: 3px; position: relative; }
.sc-beam i { position: absolute; top: -4px; width: 16px; height: 14px; background: var(--gold, #c9a227); border-radius: 3px; }
.sc-num { font-size: 20px; color: var(--gold2, #e0b25c); min-width: 46px; text-align: center; }

/* 引水网格 */
.sl-grid { display: grid; gap: 3px; justify-content: center; margin: 8px 0; }
.sl-cell {
  width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--line, #3a3226);
  background: #16130e; cursor: pointer; position: relative;
}
.sl-cell.pipe { background: #241d12; }
.sl-cell span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #6f6350; }
.sl-cell.src { border-color: var(--gold, #c9a227); background: #2f2612; }
.sl-cell.pool { border-color: #4c7f7a; background: #16262a; }
.sl-cell.pool.done { background: #1d4a44; border-color: #8fc7c0; }
.sl-cell.flow { background: #10365c; }

/* 排序 */
.od-list { display: flex; flex-direction: column; gap: 6px; }
.od-item {
  text-align: left; font-family: inherit; font-size: 13px; color: var(--txt, #e6e0d6);
  background: var(--panel2, #221c14); border: 1px solid var(--line, #3a3226);
  border-radius: 10px; padding: 8px 12px; cursor: pointer;
}
.od-item.sel { border-color: var(--gold, #c9a227); background: #332a16; }
.od-item.ok { border-color: #4c7f7a; }
.od-item .od-n { color: var(--dim, #9a9a9a); margin-right: 8px; font-size: 12px; }

/* 检索 */
.sr-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.sr-row label { font-size: 12.5px; color: var(--dim, #9a9a9a); width: 54px; text-align: right; }
.sr-row select {
  flex: 1; font-family: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px;
  background: var(--panel2, #221c14); color: var(--txt, #e6e0d6); border: 1px solid var(--line, #3a3226);
}
.sr-result { font-size: 13px; min-height: 40px; margin-top: 8px; }
.sr-result.ok { color: #8fc7c0; }
.sr-result.no { color: var(--red, #c05a5a); }

/* 拼字 */
.nm-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
.nm-pc {
  font-family: inherit; font-size: 18px; padding: 8px 0; border-radius: 8px; cursor: pointer;
  background: var(--panel2, #221c14); color: var(--txt, #e6e0d6); border: 1px solid var(--line, #3a3226);
}
.nm-pc.sel { border-color: var(--gold, #c9a227); background: #332a16; }

/* 歌谣 */
.sm-pads { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
.sm-pad {
  width: 62px; height: 62px; border-radius: 14px; font-size: 20px; cursor: pointer;
  background: var(--panel2, #221c14); color: var(--txt, #e6e0d6); border: 1px solid var(--line, #3a3226);
}
.sm-pad:active, .sm-pad.lit { background: #3a2f18; border-color: var(--gold, #c9a227); color: #fff; }
.sm-seq { text-align: center; font-size: 15px; letter-spacing: 4px; color: var(--gold2, #e0b25c); min-height: 22px; }

/* 三问 / 填空 */
.qa-q { font-size: 14px; margin: 10px 0 4px; color: var(--txt, #e6e0d6); }
.qa-in {
  width: 100%; font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px;
  background: var(--panel2, #221c14); color: var(--txt, #e6e0d6); border: 1px solid var(--line, #3a3226);
}
.qa-opt { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }

/* 灯阵（九宫翻灯） */
.lz-grid { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; justify-content: center; margin: 12px 0; }
.lz-cell { height: 60px; border-radius: 12px; cursor: pointer; background: #171b22; border: 1px solid var(--line, #3a3226); }
.lz-cell.on { background: radial-gradient(circle at 50% 45%, #ffe6ab, #e0a63c 60%, #7a5313); border-color: var(--gold, #c9a227); box-shadow: 0 0 14px rgba(255,206,132,.35); }

/* 算盘（当金算账） */
.ab-table { margin: 8px 0; }
.ab-row { display: grid; grid-template-columns: 1.4fr .7fr 1fr .5fr; gap: 6px; align-items: center; font-size: 13px;
  color: var(--txt, #e6e0d6); padding: 6px 8px; border-radius: 8px; background: var(--panel2, #221c14);
  border: 1px solid var(--line, #3a3226); margin-bottom: 6px; }
.ab-row .ab-q { color: var(--gold2, #e0b25c); text-align: right; }
.ab-in { width: 170px; font-family: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; text-align: center;
  background: var(--panel2, #221c14); color: var(--txt, #e6e0d6); border: 1px solid var(--line, #3a3226); }
.ab-unit { color: var(--dim, #9a9a9a); font-size: 13px; }

/* 换过字的契（字表） */
.ci-cell { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; width: 30px; padding: 3px 0;
  margin: 2px; border-radius: 8px; cursor: pointer; background: var(--panel2, #221c14);
  border: 1px solid var(--line, #3a3226); font-size: 13px; }
.ci-cell b { font-size: 9px; color: var(--dim, #9a9a9a); font-weight: 400; }
.ci-cell:hover { border-color: var(--gold2, #e0b25c); }

/* 配对（对牌 / 断句） */
.hp-wrap { display: flex; gap: 14px; justify-content: center; align-items: flex-start; margin: 10px 0; }
.hp-col { display: flex; flex-direction: column; gap: 8px; flex: 1 1 0; min-width: 0; }
.hp-col .pz-opt { width: 100%; text-align: left; font-size: 13px; }

/* 连环锁（幕五 · 五道环 · 一百秒） */
.ch-clock { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-size: 13px; }
.ch-clock .ch-lab { color: var(--dim, #9a9a9a); }
.ch-clock b { color: var(--gold2, #e0b25c); font-variant-numeric: tabular-nums; }
.ch-bar { flex: 1 1 auto; height: 8px; border-radius: 4px; background: #1b2029; overflow: hidden; }
.ch-bar i { display: block; height: 100%; background: linear-gradient(90deg, #c9a227, #e0b25c); }
.ch-clock .ch-try { color: var(--dim, #9a9a9a); font-size: 11.5px; }
.ch-rings { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
.ch-ring { width: 64px; height: 64px; border-radius: 50%; cursor: default; background: #171b22;
  border: 2px solid var(--line, #3a3226); color: var(--dim, #9a9a9a); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; }
.ch-ring small { font-size: 10px; }
.ch-ring.now { border-color: var(--gold, #c9a227); color: var(--gold2, #e0b25c); cursor: pointer; box-shadow: 0 0 14px rgba(255,206,132,.25); }
.ch-ring.done { border-color: #6f7f5a; color: #9fd08a; background: #1c2418; }
.ch-ring.off { opacity: .55; }
.ch-big { width: 118px; height: 118px; border-radius: 50%; margin: 14px auto; display: flex; align-items: center;
  justify-content: center; font-size: 22px; cursor: pointer; background: radial-gradient(circle at 50% 40%, #2a2f38, #14171d);
  border: 2px solid var(--line, #3a3226); color: var(--dim, #9a9a9a); }
.ch-big:active, .ch-big.lit { border-color: var(--gold, #c9a227); color: #fff; box-shadow: 0 0 22px rgba(255,206,132,.4);
  background: radial-gradient(circle at 50% 40%, #6a5320, #2a2213); }
.ch-marks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0; }
.ch-mark { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  background: var(--panel2, #221c14); border: 1px solid var(--line, #3a3226); color: var(--txt, #e6e0d6); font-size: 15px; }
.ch-mark.now { border-color: var(--gold, #c9a227); color: #fff; box-shadow: 0 0 12px rgba(255,206,132,.3); }
.ch-lamps { display: flex; gap: 12px; justify-content: center; margin: 14px 0; }
.ch-lamp { width: 54px; height: 54px; border-radius: 12px; cursor: pointer; font-size: 16px;
  background: var(--panel2, #221c14); color: var(--txt, #e6e0d6); border: 1px solid var(--line, #3a3226); }
.ch-lamp.lit { background: #3a2f18; border-color: var(--gold, #c9a227); color: #fff; }
.ch-seq { text-align: center; font-size: 14px; letter-spacing: 3px; color: var(--gold2, #e0b25c); min-height: 20px; }

/* 档案页 */
.arc-h { font-size: 14px; color: var(--gold2, #e0b25c); margin: 12px 0 6px; letter-spacing: 1px; }
.arc-item { font-size: 12.5px; color: var(--txt, #e6e0d6); background: var(--panel2, #221c14);
  border: 1px solid var(--line, #3a3226); border-radius: 8px; padding: 6px 10px; margin-bottom: 5px; }
.arc-item b { color: var(--gold2, #e0b25c); margin-right: 6px; }
.arc-item.locked { color: var(--dim, #6c6c6c); border-style: dashed; }
.arc-lock { text-align: center; color: var(--dim, #9a9a9a); font-size: 13px; padding: 30px 10px; }
/* 任务页：现在要干的那一件顶在最上面，后面几幕不出现 */
.arc-item.task-now { border-color: var(--gold, #c9a227); background: linear-gradient(180deg, rgba(201,162,39,.15), rgba(201,162,39,.03)); }
.tn-tag { display: inline-block; font-size: 11px; color: #241d08; background: var(--gold2, #e0b25c); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
.arc-item.done-line { color: var(--dim, #9a9a9a); background: none; border-style: dashed; padding: 3px 10px; }
.arc-note { text-align: center; color: var(--dim, #9a9a9a); font-size: 12px; line-height: 1.8; padding: 10px 6px; }

  /* 小怪的威胁条：解谜的时候它就在面板后头点你 */
  #threat {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
    z-index: 70; pointer-events: none; display: none;
    padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: #ffd9d0; background: rgba(72,14,26,.82); border: 1px solid rgba(255,120,120,.5);
    box-shadow: 0 0 14px rgba(255,60,60,.35);
  }
  #threat.on { display: block; animation: threatPulse 1.1s ease-in-out infinite; }
  @keyframes threatPulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
  body.mp-threat #world-wrap { box-shadow: 0 0 0 2px rgba(255,90,90,.5), 0 0 22px rgba(255,60,60,.3) inset; }
  /* 面板开着的时候：世界的红边看不见了，就把红边挪到面板本体上 */
  body.mp-threat #m-card { box-shadow: 0 0 0 2px rgba(255,90,90,.5), 0 0 26px rgba(255,60,60,.28); }
  .arc-item.mem-hurt { border-left: 3px solid rgba(226,131,111,.85); color: #e8c9c0; }
  .arc-item.mem-hurt .mem-tag { color: #e2836f; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="logo">记忆当铺<small>归潮屿 · 望归灯</small></div>
    <div id="hud">
      <span class="hitem"><span class="gold-ico">◆</span> 当金 <b id="hud-gold">0</b></span>
      <span class="hitem">相簿 <span class="bar"><i id="hud-album-bar"></i></span> <b id="hud-album">0/4</b></span>
      <span class="hitem">任务 <b id="hud-tasks" style="color:var(--gold2)">0/32</b></span>
      <span class="hitem" id="hud-hurt-wrap" style="display:none">记伤 <b id="hud-hurt" style="color:#e2836f">0</b></span>
      <span class="hitem">第 <b id="hud-act">1</b> 幕 · <b id="hud-scene">望归灯</b></span>
      <span class="hitem">目标 <b id="hud-goal" style="color:var(--gold2)">—</b></span>
      <button id="btn-restart" title="回到本幕开头自动记下的存档点（每幕开头记一次）">↺ 存档点</button>
      <button id="btn-bgm" title="背景音乐开关">♪ 开</button>
      <button id="btn-archive" title="通关后解锁：世界档案">档案</button>
      <button id="btn-dev" title="开发者模式（按 ` 或 F2 切换）">DEV</button>
    </div>
  </header>
  <main>
    <div id="world-wrap">
      <canvas id="world" width="960" height="672"></canvas>
      <div id="threat"></div>
      <div id="scene-banner"></div>
      <div id="act-card"></div>
      <div id="toast"></div>
      <div id="touch-ui" aria-hidden="true">
        <div id="dpad">
          <button data-k="ArrowUp" title="上">▲</button>
          <button data-k="ArrowLeft" title="左">◀</button>
          <button data-k="ArrowRight" title="右">▶</button>
          <button data-k="ArrowDown" title="下">▼</button>
        </div>
        <button id="btn-e" title="互动 / 确定（等同 E 键）">E</button>
      </div>
      <div id="modal">
        <div id="m-card">
          <div id="m-title"></div>
          <div id="m-body"></div>
          <div id="m-btns"></div>
        </div>
      </div>
      <div id="end-modal">
        <div id="end-card">
          <div id="end-name"></div>
          <div id="end-text"></div>
          <div id="end-stats"></div>
          <div style="display:flex; gap:10px; justify-content:center; margin-top:14px;">
            <button id="btn-again">再走一遍这条路</button>
            <button id="btn-main" style="display:none; background:transparent; color:var(--gold2); border:1px solid var(--gold); font-weight:500;">▸ 走进世界档案</button>
          </div>
        </div>
      </div>
      <div id="confirm-box">
        <div id="confirm-card">
          <p id="cf-text">要回到本幕开头的存档点吗？</p>
          <button id="cf-yes">回到存档点</button>
          <button id="cf-no">接着走</button>
        </div>
      </div>
      <div id="dev-panel">
        <div id="dev-head"><b>DEV</b><small>开发者模式 · 测试专用</small><button id="dev-close" title="关闭">✕</button></div>
        <div id="dev-body"></div>
      </div>
    </div>
    <aside id="side">
      <section id="panel-sec" style="flex:1; min-height:220px;">
        <div id="tabs">
          <button id="tab-log" class="on">日志</button>
          <button id="tab-mem">记</button>
          <button id="tab-tasks">任务</button>
          <button id="tab-album">相簿</button>
          <button id="tab-archive">世界档案</button>
        </div>
        <div id="pane-log" class="pane on"></div>
        <div id="pane-mem" class="pane"></div>
        <div id="pane-tasks" class="pane"></div>
        <div id="pane-album" class="pane"></div>
        <div id="pane-archive" class="pane"></div>
      </section>
    </aside>
  </main>
  <div id="footer-tips">WASD / 方向键 走动 · E 互动 · 触屏用左下方向盘 + 右下 E · 走到门/阶梯上自动换场景 · 按 <b>`</b> 或点 DEV 开开发者模式</div>
</div>
<script src="js/story23.js?v=29"></script>
<script src="js/audio.js?v=29"></script>
<script src="js/music.js?v=29"></script>
<script src="js/mobs23.js?v=29"></script>
<script src="js/puzzles23.js?v=29"></script>
<script src="js/game23.js?v=29"></script>
</body>
