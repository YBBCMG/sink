<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 记忆当铺 · 像素风灯笼：灯里藏着一只不肯被忘记的小幽灵 -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#262043"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#4a3f75" stroke-width="2"/>
  <!-- 吊环 -->
  <rect x="27" y="6" width="10" height="3" fill="none" stroke="#e8b74a" stroke-width="2"/>
  <!-- 灯顶 -->
  <rect x="20" y="10" width="24" height="5" fill="#b8863a"/>
  <rect x="22" y="9" width="20" height="2" fill="#e8b74a"/>
  <!-- 灯身 -->
  <rect x="15" y="15" width="34" height="27" fill="#e8b74a"/>
  <rect x="19" y="19" width="26" height="19" fill="#ffd98a"/>
  <!-- 灯骨 -->
  <rect x="23" y="15" width="2" height="27" fill="#b8863a"/>
  <rect x="39" y="15" width="2" height="27" fill="#b8863a"/>
  <!-- 小幽灵：记得一切的那只 -->
  <rect x="26" y="24" width="12" height="10" fill="#7ed6a0"/>
  <rect x="24" y="27" width="2" height="7" fill="#7ed6a0"/>
  <rect x="38" y="27" width="2" height="7" fill="#7ed6a0"/>
  <rect x="27" y="24" width="10" height="2" fill="#a5ecc4"/>
  <rect x="28" y="28" width="2" height="3" fill="#141026"/>
  <rect x="34" y="28" width="2" height="3" fill="#141026"/>
  <!-- 灯座 -->
  <rect x="20" y="42" width="24" height="5" fill="#b8863a"/>
  <rect x="22" y="47" width="20" height="2" fill="#e8b74a"/>
  <!-- 流苏 -->
  <rect x="30" y="49" width="4" height="7" fill="#e0708a"/>
  <rect x="29" y="56" width="6" height="3" fill="#c85a74"/>
  <!-- 微光 -->
  <rect x="10" y="20" width="3" height="3" fill="#ffd98a" opacity=".5"/>
  <rect x="51" y="30" width="3" height="3" fill="#ffd98a" opacity=".4"/>
  <rect x="12" y="44" width="3" height="3" fill="#b48ae0" opacity=".5"/>
</svg>
