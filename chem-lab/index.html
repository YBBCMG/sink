  const startExp = (id, rs) => { const f = (window.CHEM && window.CHEM.tutStart) || tutStart; return f(id, rs); };
  box.querySelectorAll('.tutitem').forEach((b) => b.addEventListener('click', () => { Lab.tut.sel = b.dataset.exp; tutRender(true); }));
  const cl = box.querySelector('#tutClose'); if (cl) cl.addEventListener('click', () => tutToggle(false));
  const dm = box.querySelector('#tutDemo'); if (dm) dm.addEventListener('click', () => { const r = tutDemo(); if (!r.ok) toast(r.why); });

    const id = bg.dataset.exp;
    Lab.tut.handOff = false;                       // 从教程面板进来 = 明确要看引导
    if (Lab.tut.id === id) { tutToggle(false); toast('继续：跟着工作台右边的步骤面板做'); }
    else { startExp(id); toast('开始：工作台已摆好，跟着右边步骤面板做'); }
    tutRender(true);
  });
}
function tutToggle(on) {
  Lab.tut.open = on === undefined ? !Lab.tut.open : !!on;
  if (Lab.tut.open && Lab.tut.id) Lab.tut.sel = Lab.tut.id;   // 全览默认翻到"正在进行"的那个实验
  tutRender(true);
  if (Lab.tut.open) tutSave();
}

function tutInit() {
  tutLoad();
  const btn = document.querySelector('#tutBtn');
  if (btn) btn.addEventListener('click', () => tutToggle());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Lab.tut.open) tutToggle(false); });
  tutRender(true);
}

document.addEventListener('DOMContentLoaded', tutInit);
Object.assign(window.CHEM, {
  TUT, tutStart, tutDemo, tutTick, tutReset, tutToggle, tutRender, tutSave, tutLoad,
  tutState: () => ({ id: Lab.tut.id, sel: Lab.tut.sel, step: Lab.tut.step, done: Lab.tut.done, expDone: Lab.tut.expDone, uids: Lab.tut.uids.slice(), open: Lab.tut.open, handOff: !!Lab.tut.handOff }),
});


/* ================= 09-guide.js ================= */
/* ============================================================================
 * 09-guide.js —— 手把手带做（不是演示）
 *   三件事：
 *     ① 推导：每一步到底该点哪个按钮（干跑 st.auto，拿真实调用参数）
 *     ② 盯着你手：高亮目标控件 + 点错当场纠正 + 卡住才给提示
 *     ③ 不挡手：引导条贴在顶栏下方，工作台/试剂架照样能点
 * ==========================================================================*/

const GUIDE_KINDS = ['addReagent', 'setHeater', 'ignite', 'stir', 'pour', 'feedGas', 'filterApp', 'setPower', 'clearApp', 'measure', 'addApparatus',
  'addTool', 'placeOn', 'lightTool'];
const G_ORIG = {};
let gDry = null;            // 非 null = 干跑模式（只记录调用，不碰真状态）
let gDryTools = {};         // 干跑里"虚拟摆出来的器材"：uid → 影子器材（只为把种类对上，不碰真台面）
let gActs = [];             // 玩家真实动作队列
let gSig = '', gKey = '', gHint = 0, gLastStep = -1, gLastDone = null, gFrame = 0, gLastReal = 0;
const gCfg = { hintSec: 12, demoSec: 30 };   // 卡多久给提示 / 卡多久放演示

/* --------------------------- ① 动作录制与计划推导 -------------------------- */
let gInstalled = false;
function guideInstall() {
  if (gInstalled) return;
  gInstalled = true;
  GUIDE_KINDS.forEach((k) => {
    const f = window[k];
    if (typeof f !== 'function') return;
    G_ORIG[k] = f;
    window[k] = function (...a) {
      if (gDry) {                                     // 干跑：不改状态
        gDry.push({ k, a: a });
        // 返回值要"像真的"，否则 auto 里 `const t = addTool('lamp'); placeOn(uid, t.uid)` 推导不出来
        if (k === 'addTool') {                        // 影子器材：让 `const t = addTool('lamp'); placeOn(uid, t.uid)` 推得下去
          const vt = { uid: 'T' + (Object.keys(gDryTools).length + 1), hid: a[0], def: HEATERS.find((x) => x.id === a[0]) || null, on: false, dry: true };
          gDryTools[vt.uid] = vt;
          return vt;
        }
        if (k === 'placeOn') return { ok: true, tool: gDryTools[a[1]] || null };
        if (k === 'lightTool') { if (gDryTools[a[0]]) gDryTools[a[0]].on = !!a[1]; return { ok: true, tool: gDryTools[a[0]] || null }; }
        return { ok: true };
      }
      const r = f.apply(this, a);
      // 记下"做这个动作时进行到第几步"：步骤已经翻页的动作不再拿新步骤去评判（否则会冤枉玩家）
      gActs.push({ k: k, a: a, at: Lab.time || 0, step: (Lab.tut && Lab.tut.step) || 0 });
      return r;
    };
  });
}

function guideNorm(r) {
  const k = r.k, a = r.a || [], o = { k: k };
  if (k === 'addReagent') { o.uid = a[0]; o.f = a[1]; o.v = a[2]; o.u = a[3]; }
  else if (k === 'setHeater') { o.uid = a[0]; o.h = a[1]; o.on = a[2]; }
  else if (k === 'pour' || k === 'feedGas' || k === 'filterApp') { o.uid = a[0]; o.to = a[1]; }
  else if (k === 'setPower') { o.uid = a[0]; o.on = a[1]; }
  else if (k === 'measure') { o.uid = (a[0] && a[0].uid) || (typeof a[0] === 'string' ? a[0] : null); }   // measure 收 app 对象（也兼容 uid）
  else if (k === 'addApparatus') { o.kind = a[0]; }              // 参数是仪器 id（'tube'…）
  else if (k === 'addTool') { o.hid = a[0]; }
  else if (k === 'placeOn') { o.uid = a[0]; o.tool = a[1]; o.toolHid = ((gDryTools[a[1]] || toolByUid(a[1])) || {}).hid || null; }
  else if (k === 'lightTool') { o.uid = a[0]; o.lit = a[1]; o.hid = ((gDryTools[a[0]] || toolByUid(a[0])) || {}).hid || null; }
  else { o.uid = a[0]; }
  return o;
}

/** 干跑这一步的 auto：把动作函数换成记录器、把工作台换成一次性副本 → 拿到"该做哪些动作"且零副作用 */
function guideDryRun(exp, idx) {
  const st = exp.steps[idx];
  if (!st || !st.auto) return [];
  const real = Lab.apps, realSel = Lab.selected, realSig = benchSig;
  Lab.apps = real.map((a) => Object.assign({}, a, { contents: a.contents.slice(), gasOut: Object.assign({}, a.gasOut) }));
  const rec = [];
  gDry = rec; gDryTools = {};
  try { st.auto(); } catch (e) { /* 推导失败不算错，退化成"只给文字提示" */ }
  gDry = null;
  Lab.apps = real; Lab.selected = realSel; benchSig = realSig;   // 台面签名也还原，避免白刷一帧
  return rec.map(guideNorm);
}

function guidePlan(exp, idx) {
  if (!exp) return [];
  if (!Lab.tut.pcache) Lab.tut.pcache = {};
  const key = exp.id + ':' + idx;
  if (!Lab.tut.pcache[key]) Lab.tut.pcache[key] = guideDryRun(exp, idx);
  return Lab.tut.pcache[key];
}

/** 手把手：这一步的计划里正好要加这种试剂 → 取用量弹窗直接按步骤填好。
 *  （默认 50 mL 过不了要 80 mL 的步骤；中和滴定那类"多一滴就过头"的步骤更不能拿默认值去撞） */
function guideAmountFor(formula, dflt, unit) {
  const r = { v: dflt, u: unit, used: false };
  try {
    const exp = tutExp();
    if (!exp || !guideOn()) return r;
    const plan = guidePlan(exp, Lab.tut.step);
    const it = plan[guidePlanNext(plan)];
    if (it && it.k === 'addReagent' && it.f === formula && Number(it.v) > 0) {
      r.v = it.v; if (it.u) r.u = it.u; r.used = true;
    }
  } catch (e) { }
  return r;
}

/** 计划里"想要的实物状态已经成立"的项 —— 玩家自己先点着了灯 / 先架上去了，就别再指着让点第二遍
 *  （否则引导会说"点🔥点燃"，而那盏灯正亮着，一点就变成熄灭，还判你点错） */
function guideSatisfied(w) {
  if (!w) return false;
  if (w.k === 'addTool') return Lab.tools.some((t) => t.hid === w.hid);
  if (w.k === 'lightTool') { const t = Lab.tools.find((x) => x.hid === w.hid); return !!t && !!t.on === !!w.lit; }
  if (w.k === 'placeOn') {
    const a = appByUid(w.uid); if (!a) return false;
    if (w.toolHid === 'gauze') return !!a.gauze;                  // 石棉网已经垫上了
    const m = meterOn(a, (METERS.find((x) => x.id === w.toolHid) || {}).measures);   // 量器已经插着了
    if (m) return true;
    if (!a.standOn) return false;
    const t = toolByUid(a.standOn); return !!t && (!w.toolHid || t.hid === w.toolHid);
  }
  if (w.k === 'measure') return false;                            // 测量只能真点（点第二次无害，所以不做"已满足"跳过）
  if (w.k === 'setPower') { const a = appByUid(w.uid); return !!a && !!a.elec === !!w.on; }
  if (w.k === 'setHeater') { const a = appByUid(w.uid); return !!a && !!a.heater && !!a.heater.on === !!w.on; }
  return false;        // 加料 / 搅拌 / 测量 / 倾倒 / 过滤 / 导气 / 点燃 / 清空 / 摆仪器：只能真做，不能跳过
}

/** 把计划的指针推过"已完成 + 已经满足"的项，返回下一个真正要让玩家做的项 */
function guideAdvance(plan) {
  const d = (Lab.tut.pdone || (Lab.tut.pdone = {}));
  let pi = Lab.tut.pi || 0;
  while (pi < plan.length && (d[pi] || guideSatisfied(plan[pi]))) { d[pi] = true; pi++; }
  Lab.tut.pi = pi;
  return pi;
}

/** 覆盖率自检：49 步里有多少步能指出"点哪个控件"（用各实验自己的台面、按顺序推进状态再推导，状态相关的 auto 才准） */
function guideCoverage() {
  const keep = { id: Lab.tut.id, open: Lab.tut.open, step: Lab.tut.step, done: Object.assign({}, Lab.tut.done), pos: Object.assign({}, Lab.tut.pos), expDone: Object.assign({}, Lab.tut.expDone) };
  const rows = []; const kinds = {};
  TUT.forEach((e) => {
    tutStart(e.id, true);
    e.steps.forEach((s, i) => {
      Lab.tut.step = i;
      const t = guideTarget();
      const kind = t ? t.kind : null;
      kinds[kind || 'none'] = (kinds[kind || 'none'] || 0) + 1;
      rows.push({ at: e.id + ':' + (i + 1), kind: kind, label: t ? t.label : null, text: s.t });
      if (s.auto) { try { s.auto(); } catch (err) { } }     // 按理想路径把状态推到下一步（只推导，不跑物理）
    });
  });
  Lab.tut.done = keep.done; Lab.tut.pos = keep.pos; Lab.tut.expDone = keep.expDone; Lab.tut.pcache = {};
  if (keep.id) { tutStart(keep.id); Lab.tut.step = keep.step; Lab.tut.pos[keep.id] = keep.step; } else { tutReset(); }
  if (keep.open) tutToggle(true);
  const waits = rows.filter((r) => r.kind === 'wait' || r.kind === 'done').length;
  return { steps: rows.length, waits: waits, pointed: rows.length - waits, kinds: kinds, rows: rows };
}

/* ------------------------------ ② 目标控件链 ------------------------------ */
const gCard = (uid) => document.querySelector('.appcard[data-uid="' + uid + '"]');
const gTool = (uid) => document.querySelector('.toolcard[data-uid="' + uid + '"]');
const gToolBtn = (uid, op) => { const c = gTool(uid); return c ? c.querySelector('.ops button[data-op="' + op + '"]') : null; };
const gToolName = (uid) => { const t = (typeof toolByUid === 'function') ? toolByUid(uid) : null; return t ? t.def.name + ' ' + uid : '器材'; };
const gOpBtn = (uid, op) => { const c = gCard(uid); return c ? c.querySelector('.ops button[data-op="' + op + '"]') : null; };
const gAppName = (uid) => { const a = appByUid(uid); return a ? a.def.name : '容器'; };

/** 当前这一步，玩家"现在该点哪个控件" —— 按真实 UI 路径一步步指 */
function guideTarget() {
  const exp = tutExp(); if (!exp) return null;
  const st = exp.steps[Lab.tut.step];
  const speedBtn = document.querySelector('#speedBtn');
  if (!st) return { key: 'alldone', el: speedBtn, label: '🎉 这个实验做完了 —— 点「📖 全览」写实验报告', kind: 'done' };
  const plan = guidePlan(exp, Lab.tut.step);
  const a = plan[guideAdvance(plan)];
  const mAmt = document.querySelector('#modal.show #amtOk');
  const mTgt = document.querySelector('#modal.show .tgt');
  // 有对话框挡着，但它不是这一步要用的 → 先让玩家关掉
  if (!a) {
    const sp = Lab.speed || 1, top = (typeof SPEEDS !== 'undefined') ? SPEEDS[SPEEDS.length - 1] : 20;
    return {
      key: 'wait' + sp, el: sp < top ? speedBtn : null, kind: 'wait',
      label: sp < top
        ? '这一步自己会进行 —— 点「⏩ 时间」调到 ×' + top + '，几秒就能看完'
        : '已经在 ×' + top + ' 最快了 —— 真实实验要等几分钟，看着它发生就行',
    };
  }
  if (a.k !== 'addReagent' && mAmt) return { key: 'closex', el: document.querySelector('#amtCancel'), label: '这一步不需要加入药品 → 先点「取消」', kind: 'close' };
  if (a.k === 'addReagent') {
    if (mAmt) {
      const inp = document.querySelector('#modal #amtVal'), un = document.querySelector('#modal #amtUnit');
      const wv = Number(a.v), wu = a.u || 'g';
      const isOk = !!inp && Math.abs(Number(inp.value) - wv) < 1e-6 && (!un || un.value === wu);
      if (isOk) return { key: 'amtok', el: mAmt, label: '用量 ' + wv + ' ' + wu + ' 就是这一步要的 → 点「加入 ' + gAppName(a.uid) + '」', kind: 'modal' };
      return { key: 'amtfix', el: inp || mAmt, want: { v: wv, u: wu }, label: '把用量改成 ' + wv + ' ' + wu + '（这一步不能多也不能少）→ 再点「加入 ' + gAppName(a.uid) + '」', kind: 'amount' };
    }
    if (Lab.selected !== a.uid && gCard(a.uid)) return { key: 'sel:' + a.uid, el: gCard(a.uid), label: '先点一下「' + gAppName(a.uid) + '」卡片，把它选中', kind: 'select' };
    const s = subOf(a.f) || {};
    // 单质（Fe / Mg / Cu / C / S…）根本不在试剂架里 —— 只在左边元素周期表上，引导必须指对地方
    if (s.isElem) {
      const el = (typeof ELEM_BY_SYM !== 'undefined' && ELEM_BY_SYM.get) ? ELEM_BY_SYM.get(a.f) : null;
      const sym = el ? el.sym : a.f;
      const info = document.querySelector('#elemInfo');
      const tb = document.querySelector('#takeElem');
      if (tb && info && info.dataset.sym === sym) return { key: 'take:' + sym, el: tb, label: '点「取用 5 g ' + (el ? el.cn : sym) + '」→ 弹窗里点「加入 ' + gAppName(a.uid) + '」', kind: 'element' };
      const cell = document.querySelector('#ptable [data-sym="' + sym + '"]');
      if (cell) return { key: 'el:' + sym, el: cell, label: '左边「元素周期表」→ 点「' + sym + ' ' + (el ? el.cn : '') + '」（单质不在试剂架上，得从周期表取）', kind: 'element' };
    }
    const chip = document.querySelector('#shelf [data-sub="' + a.f + '"]');
    if (chip) return { key: 'chip:' + a.f, el: chip, label: '右边试剂架 → 点「' + a.f + ' ' + (s.name || '') + '」', kind: 'reagent' };
    return { key: 'search:' + a.f, el: document.querySelector('#shelfSearch'), label: '右边试剂架搜索框里搜「' + (s.name || a.f) + '」', kind: 'search' };
  }
  if (a.k === 'addTool') {
    const h = (typeof HEATERS !== 'undefined' ? HEATERS : []).find((x) => x.id === a.hid);
    const ab = document.querySelector('#addTools button[data-hid="' + a.hid + '"]');
    if (ab) return { key: 'addtool:' + a.hid, el: ab, label: '工作台上方「器材」行 → 点「' + (h ? h.icon + ' ' + h.name : a.hid) + '」摆一件上台面', kind: 'tool' };
  }
  if (a.k === 'placeOn') {
    const t = Lab.tools.find((x) => x.hid === a.toolHid) || Lab.tools[0] || null;
    const mb = t ? gToolBtn(t.uid, 'mount') : null;
    if (mb) {
      // 「⬆ 架上来」架的是**当前选中的**那个容器 —— 选错了就会把别的器皿架上灯，玩家照着点也做不完
      if (a.uid && Lab.selected !== a.uid && gCard(a.uid)) {
        return { key: 'sel:' + a.uid, el: gCard(a.uid), label: '先点一下「' + gAppName(a.uid) + '」卡片把它选中 —— 「⬆ 架上来」架的是选中的那一个（现在选的是「' + gAppName(Lab.selected) + '」）', kind: 'select' };
      }
      return { key: 'mount:' + t.uid, el: mb, label: '点「' + t.def.name + '」卡片上的「⬆ 架上来」，把' + gAppName(a.uid) + '架到它上面（也可以直接把容器拖到灯上）', kind: 'place' };
    }
    const ab = document.querySelector('#addTools button[data-hid="' + (a.toolHid || 'lamp') + '"]');
    if (ab) return { key: 'addtool:' + (a.toolHid || 'lamp'), el: ab, label: '先在「器材」行点一件加热器材摆上台面', kind: 'tool' };
  }
  if (a.k === 'lightTool') {
    const t = Lab.tools.find((x) => x.hid === a.hid && (a.lit ? !x.on : x.on)) || Lab.tools.find((x) => x.hid === a.hid) || null;
    const lb = t ? gToolBtn(t.uid, 'light') : null;
    if (lb) return { key: 'light:' + t.uid, el: lb, label: '在「' + t.def.name + '」卡片上点「' + (a.lit ? '🔥 点燃' : '💨 熄灭') + '」' + (a.lit ? ' —— 点着才会真的开始加热' : ''), kind: 'tool' };
  }
  if (a.k === 'setHeater') {
    if (mTgt) return { key: 'closetgt', el: document.querySelector('#tgtCancel'), label: '这个窗口用不上 → 先点「取消」', kind: 'close' };
    const h = (typeof HEATERS !== 'undefined' ? HEATERS : []).find((x) => x.id === a.h);
    const t = Lab.tools.find((x) => x.hid === a.h && x.on);
    const lb = t ? gToolBtn(t.uid, 'light') : null;
    if (lb) return { key: 'light:' + t.uid, el: lb, label: '在「' + t.def.name + '」卡片上点「🔥 点燃」', kind: 'tool' };
    const ab = document.querySelector('#addTools button[data-hid="' + a.h + '"]');
    if (ab && h) return { key: 'addtool:' + a.h, el: ab, label: '先摆一件「' + h.icon + ' ' + h.name + '」到台面上', kind: 'tool' };
  }
  if (a.k === 'pour' || a.k === 'feedGas' || a.k === 'filterApp') {
    const op = a.k === 'pour' ? 'pour' : a.k === 'feedGas' ? 'gas' : 'filter';
    const tgt = document.querySelector('#modal.show .tgt[data-uid="' + a.to + '"]');
    if (tgt) return { key: 'tgt:' + a.to, el: tgt, label: '在弹窗里点「' + gAppName(a.to) + '」当目标容器', kind: 'target' };
    const ob = gOpBtn(a.uid, op);
    const verb = { pour: '🫗 倾倒', gas: '💨 导气', filter: '🧻 过滤' }[op];
    return { key: 'op:' + a.uid + ':' + op, el: ob, label: '在「' + gAppName(a.uid) + '」卡片上点「' + verb + '」', kind: 'op' };
  }
  if (a.k === 'measure') {
    const mb = gOpBtn(a.uid, 'measure');
    if (mb) return { key: 'op:' + a.uid + ':measure', el: mb, label: '在「' + gAppName(a.uid) + '」卡片上点「📏 测量」，读数会写进现象日志', kind: 'op' };
  }
  if (a.k === 'addApparatus') {
    const ab = document.querySelector('#addApparatus button[data-kind="' + a.kind + '"]');
    const def = (typeof APPARATUS !== 'undefined' ? APPARATUS : []).find((x) => x.id === a.kind);
    if (ab) return { key: 'add:' + a.kind, el: ab, label: '工作台上方点「' + (def ? def.name : a.kind) + '」添一个容器', kind: 'apparatus' };
  }
  const opMap = { ignite: 'ignite', stir: 'stir', setPower: 'power', clearApp: 'clear' };
  const op = opMap[a.k];
  if (op) {
    const ob = gOpBtn(a.uid, op);
    const verb = { ignite: '⚡ 点燃', stir: '🌀 搅拌', power: '⚡ 通电', clear: '🧼 倒空' }[op];
    if (ob) return { key: 'op:' + a.uid + ':' + op, el: ob, label: '在「' + gAppName(a.uid) + '」卡片上点「' + verb + '」', kind: 'op' };
  }
  return { key: 'wait', el: speedBtn, label: '这一步会自动发生 —— 想快点就点「⏩ 时间」', kind: 'wait' };
}

/** 玩家刚才那个动作，算不算"这一步该做的" */
const guidePlanNext = (plan) => { const d = Lab.tut.pdone || {}; for (let i = 0; i < plan.length; i++) { if (!d[i]) return i; } return plan.length; };
function guideMatch(act, want) {
  if (!want) return false;
  if (act.k !== want.k) return false;
  if (want.k === 'addReagent') return act.a[0] === want.uid && act.a[1] === want.f;
  if (want.k === 'setHeater') return act.a[0] === want.uid;
  if (want.k === 'pour' || want.k === 'feedGas' || want.k === 'filterApp') return act.a[0] === want.uid && act.a[1] === want.to;
  if (want.k === 'measure') return !!(act.a[0] && act.a[0].uid === want.uid);
  if (want.k === 'addApparatus') return act.a[0] === want.kind;
  if (want.k === 'addTool') return act.a[0] === want.hid;
  // 器材 uid 每次摆都不是同一个（干跑摆的是影子器材），所以按"种类 + 谁被架上去了 + 点着与否"判定
  if (want.k === 'placeOn') return act.a[0] === want.uid && (!want.toolHid || ((toolByUid(act.a[1]) || {}).hid === want.toolHid));
  if (want.k === 'lightTool') return !!act.a[1] === !!want.lit && (!want.hid || ((toolByUid(act.a[0]) || {}).hid === want.hid));
  return act.a[0] === want.uid;
}
const gVerb = (act) => {
  const a = act.a || [];
  if (act.k === 'addReagent') { const s = subOf(a[1]) || {}; return '加入 ' + (s.name || a[1]); }
  if (act.k === 'setHeater') { const h = (HEATERS || []).find((x) => x.id === a[1]); return (a[2] ? '打开' : '关掉') + (h ? h.name : '热源') + '（' + gAppName(a[0]) + '）'; }
  if (act.k === 'pour') return '倾倒（' + gAppName(a[0]) + '）';
  if (act.k === 'feedGas') return '导气（' + gAppName(a[0]) + '）';
  if (act.k === 'filterApp') return '过滤（' + gAppName(a[0]) + '）';
  if (act.k === 'ignite') return '点燃（' + gAppName(a[0]) + '）';
  if (act.k === 'setPower') return (a[1] ? '通电' : '断电') + '（' + gAppName(a[0]) + '）';
  if (act.k === 'clearApp') return '倒空（' + gAppName(a[0]) + '）';
  if (act.k === 'stir') return '搅拌';
  if (act.k === 'measure') return '测量（' + gAppName(a[0] && a[0].uid) + '）';
  if (act.k === 'addApparatus') { const d = (APPARATUS || []).find((x) => x.id === a[0]); return '摆了' + (d ? d.name : a[0]); }
  if (act.k === 'addTool') { const h = (HEATERS || []).find((x) => x.id === a[0]); return '摆了' + (h ? h.name : a[0]); }
  if (act.k === 'placeOn') { const t = toolByUid(a[1]); return '把' + gAppName(a[0]) + '架到' + (t ? t.def.name : '台面') + '上'; }
  if (act.k === 'lightTool') { const t = toolByUid(a[0]); return (a[1] ? '点燃' : '熄灭') + (t ? t.def.name : '器材'); }
  return act.k;
};

/* --------------------------- ③ 每帧：判定 / 纠错 / 提示 --------------------------- */
function guideTick(dtReal) {
  guideInstall();
  const exp = tutExp();
  const step = exp ? Lab.tut.step : -1;
  if (exp && step !== gLastStep) {            // 换步：重置本步子动作指针与计时
    gLastStep = step; Lab.tut.pi = 0; Lab.tut.pdone = {}; Lab.tut.idle = 0; gHint = 0; Lab.tut.nudge = null; Lab.tut.nudgeAt = 0;
  }
  if (gActs.length) {
    const cur = exp && exp.steps[Lab.tut.step];
    // 沙盒 / 引导条收起 / 全览打开 / 这个实验已经做完 → 一律不评判（免得偷偷写日志，也免得读到不存在的步骤）
    if (!exp || !cur || !guideOn()) { gActs = []; }
    else {
      const plan = guidePlan(exp, Lab.tut.step);
      const d = (Lab.tut.pdone || (Lab.tut.pdone = {}));
      gActs.forEach((act) => {
        Lab.tut.idle = 0; gHint = 0;
        if (act.step !== Lab.tut.step) return;                          // 上一步的动作，别拿这一步的清单去评判
        let hit = -1;                                                   // 同一步里的动作顺序可以不同：命中任意未完成项都算对
        for (let i = 0; i < plan.length; i++) {
          if (d[i] && !guideSatisfied(plan[i])) continue;               // 已经做过的项不再重复接受（但"刚做完就自然满足"的项要收下，别把玩家自己的正确操作判成多余）
          if (guideMatch(act, plan[i])) { hit = i; break; }
        }
        if (hit >= 0) { d[hit] = true; guideAdvance(plan); Lab.tut.nudge = null; return; }
        if (act.k === 'stir') return;                                   // 搅拌无害：这一步用不上它，也不判玩家错
        if (!Lab.tut.nudge || (Lab.time - Lab.tut.nudgeAt) > 6) {        // 同一类错别刷屏
          Lab.tut.nudge = '⚠ 刚才那步不是必需的：' + gVerb(act) + ' —— 这一步要做的是「' + cur.t + '」';
          Lab.tut.nudgeAt = Lab.time;
          Lab.tut.wrong = (Lab.tut.wrong || 0) + 1;
          Lab.log.push({ k: 'warn', at: Lab.time, text: '🎓 引导：' + Lab.tut.nudge });
        }
      });
      guideAdvance(plan);          // 玩家没做、但实物状态本来就成立的项 → 直接跳过，别指着让点第二遍
      gActs = [];
    }
  }
  if (exp && exp.steps[Lab.tut.step]) { Lab.tut.idle = (Lab.tut.idle || 0) + dtReal; }
  const lvl = Lab.tut.idle >= gCfg.demoSec ? 2 : Lab.tut.idle >= gCfg.hintSec ? 1 : 0;
  if (lvl !== gHint) gHint = lvl;
  guideRender(false);
  // 只有引导条在跑时才画高亮/箭头 —— 否则「全览」面板打开时箭头会浮在面板上面穿帮
  if (guideOn()) { if ((gFrame = (gFrame + 1) % 6) === 0) guidePaintLast(); }
}

let gLastT = null;
function guidePaintLast() {
  if (!guideOn()) return;                   // 全览面板打开时一律不画（滚动/缩放事件也会走到这里）
  let t = gLastT;
  if (!t || !t.el || !t.el.isConnected) t = guideTarget();   // 台面 DOM 被重建过 → 重新解析目标，别让高亮凭空消失
  if (!t || !t.el) return;
  gLastT = t;
  if (!t.el.classList.contains('tutglow')) { guideClearGlow(); t.el.classList.add('tutglow'); }
  // 台面挤的时候，正在指的那张卡片抬到最上层 —— 否则它可能被别的卡片盖住点不到
  const card = t.el.closest ? t.el.closest('.appcard, .toolcard') : null;
  if (card) {
    document.querySelectorAll('.tutlift').forEach((e) => { if (e !== card) e.classList.remove('tutlift'); });
    card.classList.add('tutlift');
  }
  guideArrow(t.el, t.label);
}

/** 清掉所有高亮（含"抬到上层"的卡片） */
function guideClearGlow() {
  document.querySelectorAll('.tutglow').forEach((e) => e.classList.remove('tutglow'));
  document.querySelectorAll('.tutlift').forEach((e) => e.classList.remove('tutlift'));
}

function guideArrow(el, label) {
  const ar = document.querySelector('#guarrow'); if (!ar) return;
  const r = el.getBoundingClientRect();
  const vis = r.width > 0 && r.bottom > 56 && r.top < (window.innerHeight - 4);
  if (!vis) { ar.classList.remove('show'); return; }
  ar.textContent = '👆 ' + (label || '点这里');
  ar.classList.add('show');
  // 弹窗里的目标（「加入」按钮）一律把气泡放到下面 —— 放上面会盖住「用量 / 单位」那两行，玩家正要看它们
  const inModal = !!(el.closest && el.closest('#modal'));
  const above = !inModal && r.top > 96;
  ar.style.left = Math.max(8, Math.min(window.innerWidth - 300, r.left + r.width / 2 - 90)) + 'px';
  ar.style.top = (above ? Math.max(58, r.top - 30) : r.bottom + 6) + 'px';
}

function guidePaint(t) {
  gLastT = t;
  guideClearGlow();
  const ar = document.querySelector('#guarrow'); if (ar) ar.classList.remove('show');
  if (!t || !t.el) return;
  t.el.classList.add('tutglow');
  const card = t.el.closest ? t.el.closest('.appcard, .toolcard') : null;
  if (card) card.classList.add('tutlift');           // 指着的卡片抬到最上层，保证点得到
  if (t.key !== gKey) {                       // 目标变了才滚动，别跟玩家抢滚动条
    gKey = t.key;
    try { t.el.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (e) { }
  } else {
    // 台面是横向可滚的：指着的控件被滚出视野时要拉回来（否则引导指着看不见的东西）
    try {
      const bench = t.el.closest && t.el.closest('#bench');
      if (bench) {
        const r = t.el.getBoundingClientRect(), br = bench.getBoundingClientRect();
        if (r.left < br.left + 6 || r.right > br.right - 6 || r.top < br.top + 6 || r.bottom > br.bottom - 6) {
          t.el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
      }
    } catch (e) { }
  }
  guideArrow(t.el, t.label);
}
function guideArrowOff() { const ar = document.querySelector('#guarrow'); if (ar) ar.classList.remove('show'); guideClearGlow(); }

/* --------------------------- 手把手步骤面板（工作台右侧） --------------------------- */
const guideOn = () => !!(Lab.tut.id && !Lab.tut.open && !Lab.tut.handOff);
function guideRender(force) {
  const box = document.querySelector('#guide'); if (!box) return;
  const on = guideOn();
  document.body.classList.toggle('guiding', on);
  if (!on) { if (box.classList.contains('show')) { box.classList.remove('show'); box.innerHTML = ''; } gSig = ''; guideArrowOff(); return; }
  const exp = tutExp(); if (!exp) { box.classList.remove('show'); return; }
  const st = exp.steps[Lab.tut.step];
  const t = guideTarget();
  const done = !st;
  const sig = [exp.id, Lab.tut.step, Lab.tut.pi, t && t.key, Lab.tut.nudge || '', gHint, done].join('|');
  if (!force && sig === gSig) { guidePaintLast(); return; }
  gSig = sig;
  const pct = Math.round(Lab.tut.step / exp.steps.length * 100);
  const hintText = gHint >= 1 && st && st.h ? '💡 ' + st.h : '';
  let line3 = '';
  if (Lab.tut.nudge) line3 = '<span class="gnudge">' + Lab.tut.nudge + '</span>';
  else if (hintText) line3 = '<span class="ghint">' + hintText + '</span>';
  else if (gLastDone && (Lab.time - gLastDone.at) < 6) line3 = '<span class="gok">✅ ' + gLastDone.text + '</span>';
  else line3 = '<span class="gtip">照着「🎯」点就行。点错了我会当场提醒，不会扣你分。</span>';
  /* 全部步骤铺开：做过的打勾、当前这条高亮 —— 玩家一眼看到"整段流程走到哪了" */
  let list = '';
  exp.steps.forEach((s, i) => {
    const isDone = !!Lab.tut.done[exp.id + ':' + i];
    const cur = i === Lab.tut.step;
    list += '<div class="gitem' + (isDone ? ' done' : cur ? ' cur' : '') + '" data-i="' + i + '">'
      + '<span class="gn">' + (isDone ? '✅' : (i + 1)) + '</span><span>' + s.t + '</span></div>';
  });
  const scrollTop = (() => { const l = box.querySelector('.glist'); return l ? l.scrollTop : 0; })();
  box.innerHTML = '<div class="gwrap">'
    + '<div class="grow1">'
    + '<span class="gno">' + exp.no + '　第 ' + Math.min(Lab.tut.step + 1, exp.steps.length) + ' / ' + exp.steps.length + ' 步</span>'
    + '<span class="gbar"><i style="width:' + pct + '%"></i></span>'
    + '<span class="gsp"></span>'
    + '<button id="gFull" title="看完整讲解（目的 / 现象 / 方程式 / 易错）">📖</button>'
    + '<button id="gRestart" title="从第 1 步重做">↺</button>'
    + '<button id="gOff" title="收起步骤面板（点「📘 实验教程」可再打开）">✕</button>'
    + '</div>'
    + '<b class="gtitle">' + exp.title + '</b>'
    + '<div class="gcur">'
    + '<div class="grow2"><span class="gstepn">' + Math.min(Lab.tut.step + 1, exp.steps.length) + '</span>'
    + '<b class="gtodo">' + (done ? '本实验全部完成！🎉' : st.t) + '</b></div>'
    + (t ? '<span class="gtgt">🎯 <b>' + t.label + '</b></span>' : '')
    + '<div class="grow3">' + line3 + '</div>'
    + '<div class="gacts">'
    + (gHint >= 2 && st && st.auto ? '<button id="gDemo" class="ghost">🎬 看一遍</button>' : '')
    + (st && !st.auto ? '<span class="gtip">⏳ 这一步要等一等（可点顶栏「⏩ 时间」加速）</span>' : '')
    + '</div>'
    + '</div>'
    + '<div class="glist"><div class="glbl">完整步骤（' + exp.steps.length + ' 步）</div>' + list + '</div>'
    + '</div>';
  box.classList.add('show');
  const gl = box.querySelector('.glist'); if (gl && scrollTop) gl.scrollTop = scrollTop;
  const b1 = box.querySelector('#gFull'); if (b1) b1.addEventListener('click', () => tutToggle(true));
  const b2 = box.querySelector('#gRestart'); if (b2) b2.addEventListener('click', () => { tutStart(exp.id, true); toast('已重置工作台，从第 1 步重做'); });
  const b3 = box.querySelector('#gOff'); if (b3) b3.addEventListener('click', () => { Lab.tut.handOff = true; guideRender(true); toast('步骤面板已收起（点右上「📘 实验教程」可再打开）'); });
  const b4 = box.querySelector('#gDemo'); if (b4) b4.addEventListener('click', () => { Lab.tut.demoN = (Lab.tut.demoN || 0) + 1; const r = tutDemo(); if (!r.ok) toast(r.why); });
  guidePaint(t);
}

/* --------------------------- 接入：包住教程的状态机 --------------------------- */
function guideWrapTut() {
  const _start = window.tutStart, _reset = window.tutReset, _tick = window.tutTick, _toggle = window.tutToggle;
  window.tutStart = function (id, restart) {
    const r = _start(id, restart);
    gActs = [];                                 // 摆仪器是教程自动做的，不算"玩家动作"（不然一开局就误报）
    Lab.tut.pcache = {}; Lab.tut.pi = 0; Lab.tut.pdone = {}; Lab.tut.idle = 0; Lab.tut.nudge = null; Lab.tut.wrong = 0; Lab.tut.handOff = false;
    gLastStep = -1; gHint = 0; gLastDone = null; gKey = '';
    _toggle.call(null, false);                 // 手把手：面板让开，别挡着工作台
    guideRender(true);
    return r;
  };
  window.tutReset = function () {
    const r = _reset(); gActs = []; Lab.tut.handOff = false;
    Lab.tut.nudge = null; Lab.tut.wrong = 0; Lab.tut.pdone = {}; Lab.tut.pi = 0;   // 退出教程 → 引导状态一起清干净
    guideRender(true); return r;
  };
  window.tutToggle = function (on) { const r = _toggle(on); gSig = ''; guideRender(true); return r; };
  window.tutTick = function (dt) {
    const before = Lab.tut.step;
    _tick(dt);
    if (Lab.tut.step !== before && tutExp()) {
      const prev = tutExp().steps[before];
      if (prev) { gLastDone = { text: '第 ' + Lab.tut.step + ' 步完成：' + prev.t, at: Lab.time }; Lab.tut.pi = 0; }
    }
    guideTick(dt);
  };
}

function guideInit() {
  if (document.querySelector('#guarrow')) return;
  const ar = document.createElement('div');
  ar.id = 'guarrow'; ar.className = 'guarrow';
  document.body.appendChild(ar);
  window.addEventListener('scroll', () => guidePaintLast(), true);
  window.addEventListener('resize', () => guidePaintLast());
  guideInstall(); guideWrapTut(); guideRender(true);
  // 教程模块导出的是"包装前"的函数引用 —— 这里换成包装后的，外部调用才走引导
  Object.assign(window.CHEM, { tutStart: window.tutStart, tutReset: window.tutReset, tutTick: window.tutTick, tutToggle: window.tutToggle });
  // 动作函数同理：CHEM.addReagent 等也要经过录制器，否则"程序化操作"会绕过引导判定
  GUIDE_KINDS.forEach((k) => { if (typeof window[k] === 'function' && window.CHEM[k]) window.CHEM[k] = window[k]; });
}
document.addEventListener('DOMContentLoaded', guideInit);

Object.assign(window.CHEM, {
  guideOn: guideOn, guideTarget: guideTarget, guidePlan: guidePlan, guideCoverage: guideCoverage,
  guideTick: guideTick, guideRender: guideRender, guideCfg: gCfg,
  guideActs: () => gActs.slice(),
  guideState: () => {
    const exp = tutExp(), t = guideTarget();
    return {
      on: guideOn(), mode: Lab.tut.open ? 'list' : 'hand', exp: exp ? exp.id : null, step: Lab.tut.step,
      steps: exp ? exp.steps.length : 0, pi: Lab.tut.pi, wrong: Lab.tut.wrong || 0, demoN: Lab.tut.demoN || 0,
      hint: gHint, idle: Math.round((Lab.tut.idle || 0) * 10) / 10, nudge: Lab.tut.nudge || null,
      plan: exp ? guidePlan(exp, Lab.tut.step) : [],
      target: t ? { key: t.key, label: t.label, kind: t.kind, want: t.want || null, tag: t.el ? (t.el.tagName + (t.el.dataset ? JSON.stringify(t.el.dataset) : '')) : null,
        visible: !!(t.el && t.el.getBoundingClientRect().width > 0) } : null,
    };
  },
});

/* 拓展实验：教材里没有（或只在"拓展视野"里），但学生该会 —— 表里用 ext 标出来 */
const EXT_EXPS = { e16: '离子检验是中考必考题型，教材正文以"活动与探究"形式给出', e18: '碳酸氢钠的性质属拓展内容', e20: '结晶水与无水硫酸铜检验水，教材"拓展视野"内容' };

const unitLabel = (u) => u.book + ' · 第' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'][u.no] + '单元';
const courseOf = (id) => {
  for (const u of CURRICULUM) {
    for (const l of u.lessons) if (l.exps.indexOf(id) >= 0) return { u, l };
  }
  return null;
};

/** 把课程表回填进实验数据：分组标签、课题信息。表是唯一真源。 */
function courseApply() {
  if (typeof TUT === 'undefined') return [];
  const miss = [];
  TUT.forEach((e) => {
    const hit = courseOf(e.id);
    if (!hit) { miss.push(e.id); return; }
    e.grp = unitLabel(hit.u) + '（' + hit.l.n + ' ' + hit.l.t + '）';
    e.course = { unit: hit.u.unit, unitNo: hit.u.no, book: hit.u.book, lesson: hit.l.n + ' ' + hit.l.t, alt: hit.u.alt };
  });
  return miss;
}

const courseStats = () => {
  let core = 0, todo = 0, exps = 0, out = 0;
  CURRICULUM.forEach((u) => u.lessons.forEach((l) => { core += 1; exps += l.exps.length; todo += l.todo.length; }));
  (typeof TUT !== 'undefined' ? TUT : []).forEach((e) => { if (!courseOf(e.id)) out += 1; });
  return { units: CURRICULUM.length, lessons: core, exps, todo, out };
};
/** 自查：有没有实验没进课程表、有没有课程表点了名但游戏里没有的实验 */
const courseAudit = () => {
  const ids = (typeof TUT !== 'undefined' ? TUT : []).map((e) => e.id);
  const mapped = [];
  CURRICULUM.forEach((u) => u.lessons.forEach((l) => l.exps.forEach((x) => mapped.push(x))));
  return {
    unmapped: ids.filter((x) => mapped.indexOf(x) < 0),          // 游戏里有、表里没写
    missing: mapped.filter((x) => ids.indexOf(x) < 0),           // 表里写了、游戏里没有
    dup: mapped.filter((x, i) => mapped.indexOf(x) !== i),
  };
};

/* ------------------------------- 界面 ------------------------------- */
function courseHTML() {
  const done = (typeof Lab !== 'undefined' && Lab.tut && Lab.tut.expDone) || {};
  const st = courseStats();
  let h = '<div class="ctop"><b>📚 人教版九年级化学 · 教材课程与配套实验</b>'
    + '<span class="cnote">上册 ' + CURRICULUM.filter((u) => u.book === '上册').length + ' 个单元 / 下册 '
    + CURRICULUM.filter((u) => u.book === '下册').length + ' 个单元 · 已配套 <b class="cok">' + st.exps + '</b> 个实验 · 待收录 '
    + '<b class="ctd">' + st.todo + '</b> 个</span>'
    + '<input id="cSearch" placeholder="搜单元 / 课题 / 实验（也可搜化学式，如 CO2）">'
    + '<button id="cClose">✕ 关闭</button></div>'
    + '<div class="cbody">';
  CURRICULUM.forEach((u) => {
    const expsN = u.lessons.reduce((a, l) => a + l.exps.length, 0);
    /* data-strong = 单元名/课题名（标题命中优先）；data-key = 连实验名、待收录项一起（次要命中） */
    h += '<div class="cunit" data-strong="' + [u.book, u.unit, u.alt, u.lessons.map((l) => l.t).join(' ')].join(' ').toLowerCase()
      + '" data-key="' + [u.book, u.unit, u.alt].concat(u.lessons.map((l) => l.t + l.exps.join(''))).join(' ').toLowerCase() + '">';
    h += '<h4>' + unitLabel(u) + '　' + u.unit
      + (u.alt ? ' <i class="calt">（' + u.alt + '）</i>' : '')
      + ' <span class="ccount">配了 ' + expsN + ' 个实验</span></h4>';
    u.lessons.forEach((l) => {
      h += '<div class="clesson" data-strong="' + l.t.toLowerCase() + '" data-key="'
        + (l.t + ' ' + l.exps.join(' ') + ' ' + l.todo.join(' ')).toLowerCase() + '">';
      h += '<b>' + l.n + '　' + l.t + '</b><div class="cchips">';
      if (!l.exps.length && !l.todo.length) h += '<span class="cnone">（理论内容，无需实验）</span>';
      l.exps.forEach((id) => {
        const e = (typeof TUT !== 'undefined') ? TUT.find((x) => x.id === id) : null;
        if (!e) { h += '<span class="cchip miss">表里有、游戏里还没做：' + id + '</span>'; return; }
        h += '<button class="cchip' + (done[id] ? ' ok' : '') + '" data-exp="' + id + '" title="点开就手把手做这个实验">'
          + (done[id] ? '✅ ' : '🧪 ') + e.no + '　' + e.title
          + (EXT_EXPS[id] ? ' <i class="cext">拓展</i>' : '')
          + '<i class="cgoal">' + e.goal + '</i></button>';
      });
      l.todo.forEach((t) => { h += '<span class="ctodo" title="教材里有、本作还没做进去 —— 待收录">◻ ' + t + '</span>'; });
      h += '</div></div>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function courseOpen(on) {
  const m = document.querySelector('#courseModal');
  if (!m) return;
  const show = on == null ? !m.classList.contains('show') : !!on;
  if (show) m.innerHTML = '<div class="cbox">' + courseHTML() + '</div>';
  m.classList.toggle('show', show);
  if (show) {
    const s = document.querySelector('#cSearch');
    if (s) {
      s.addEventListener('input', () => {
        const q = s.value.trim().toLowerCase();
        const units = [...document.querySelectorAll('#courseModal .cunit')];
        const hitStrong = (el) => (el.dataset.strong || '').toLowerCase().indexOf(q) >= 0;
        /* 标题命中优先：搜"溶液"就该先给"第九单元 溶液"，而不是把所有提到溶液的边角都翻出来 */
        const anyStrong = !q || units.some((u) => hitStrong(u) || [...u.querySelectorAll('.clesson')].some(hitStrong));
        units.forEach((u) => {
          let any = false;
          u.querySelectorAll('.clesson').forEach((l) => {
            const hit = !q || (anyStrong ? (hitStrong(u) || hitStrong(l)) : (l.dataset.key || '').indexOf(q) >= 0);
            l.style.display = hit ? '' : 'none';
            if (hit) any = true;
          });
          u.style.display = any ? '' : 'none';
        });
      });
      s.focus();
    }
    m.querySelectorAll('.cchip[data-exp]').forEach((b) => b.addEventListener('click', () => {
      const id = b.dataset.exp;
      courseOpen(false);
      if (window.CHEM && window.CHEM.tutStart) window.CHEM.tutStart(id, true);
    }));
    m.querySelector('#cClose').addEventListener('click', () => courseOpen(false));
  }
}

function courseInit() {
  const miss = courseApply();
  if (miss.length) console.warn('课程表没收录的实验：' + miss.join(', '));
  const a = courseAudit();
  if (a.missing.length || a.dup.length) console.warn('课程表与实验对不上：', a);
  const btn = document.querySelector('#courseBtn');
  if (btn) btn.addEventListener('click', () => courseOpen());
  if (!document.querySelector('#courseModal')) {
    const m = document.createElement('div');
    m.id = 'courseModal';
    m.addEventListener('click', (ev) => { if (ev.target === m) courseOpen(false); });
    document.body.appendChild(m);
  }
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') courseOpen(false); });
  /* 教程面板顶部的分组标签是用 grp 拼的 —— 回填完刷一次列表 */
  if (typeof tutRender === 'function') tutRender(true);
}

document.addEventListener('DOMContentLoaded', courseInit);

Object.assign(window.CHEM, {
  CURRICULUM, courseOpen, courseStats, courseAudit, courseOf,
  courseHTML: () => courseHTML(),
});


/* ================= 11-observe.js ================= */
/* ============================================================================
 * 11-observe.js —— 俯视观察窗（从上往看容器里面）
 *
 *   侧视图能看清"有没有气泡往上冒"，但**颜色变化、沉淀、结晶、浑浊**这些
 *   侧着看几乎看不出来 —— 真实实验里学生是低头往烧杯里看的。
 *   这里就补上这一眼：每个容器一个圆（俯视），放大显示液面颜色、沉淀颗粒、
 *   结晶闪光、气泡，配一句"肉眼能写进实验报告"的现象描述（不给数字 ——
 *   要数字得拿量器去测）。
 * ==========================================================================*/

const OBS_C = { bg: '#0c161d', glass: '#8fb6c9', label: '#b9d7e6' };

/** 用肉眼能说的话描述容器里现在什么样（不是数值！） */
function observe(app) {
  if (app.broken) return { txt: '器皿已破裂，内容物洒了', tag: 'bad' };
  const bits = [];
  const solids = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
  const fine = app.contents.some((c) => c.dissolved && subOf(c.formula) && subOf(c.formula).st === 's');
  const murky = solids.length > 0 || app.pptMade > 1e-6 || fine;
  const col = solutionColor(app);
  const [r, g, b] = col.rgb;
  const base = [200, 228, 245];                                   // 纯水在这个配色下的样子
  const dbase = Math.abs(r - base[0]) + Math.abs(g - base[1]) + Math.abs(b - base[2]);
  const tinted = !!indicatorTint(app);
  if (waterMol(app) > 1e-9) {
    if (tinted) bits.push('指示剂已经显色');
    else if (dbase > 26) {
      const name = (r > g && g > b) ? (b > 150 ? '黄色' : '橙棕色') : (b > r && b > g ? '蓝色' : (g > r && g > b ? '绿色' : '有色'));
      bits.push(name + '溶液');
    } else bits.push(murky ? '液体本身无色' : '无色澄清的液体');
  }
  if (app.pptRate > 2) bits.push('白色沉淀正在生成');
  else if (murky) bits.push('浑浊，有沉淀（' + (solids.length ? subName(solids[0].formula) : '细小颗粒') + '）');
  if (app.bubbleRate > 12) bits.push('剧烈冒气泡');
  else if (app.bubbleRate > 1.5) bits.push('不断冒出气泡');
  if (app.flame > 0.25) bits.push('有火焰');
  if (app.smoke > 0.25) bits.push('冒白烟');
  if (app.steamAccum > 0.02) bits.push('水汽蒸腾');
  if (app.iceMol > 1e-6) bits.push('结冰了');
  if (app.temp > 372 && waterMol(app) > 1e-6) bits.push('液体在沸腾');
  else if (app.standOn) { const t = toolByUid(app.standOn); if (t && t.on) bits.push('正在受热'); }
  if (!bits.length) bits.push(waterMol(app) > 1e-9 ? '无明显变化（澄清液体）' : '空的');
  return { txt: bits.join('；') };
}

function drawObserve(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 340, h = cv.clientHeight || 150;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#eef4f7';                     // 白台面：俯视看的就是它，浅色差异一眼能辨
  if (g.roundRect) { g.beginPath(); g.roundRect(0, 0, w, h, 10); g.fill(); } else g.fillRect(0, 0, w, h);
  const apps = Lab.apps;
  if (!apps.length) {
    g.fillStyle = '#7b8fa0'; g.font = '12px system-ui';
    g.fillText('工作台上还没有容器', 12, h / 2);
    return;
  }
  const n = apps.length;
  const perRow = n <= 3 ? n : Math.ceil(n / 2);
  const rows = Math.ceil(n / perRow);
  const cellW = w / perRow, cellH = h / rows;
  const base = Math.min(cellW, cellH) * 0.42;
  apps.forEach((app, i) => {
    const cx = (i % perRow) * cellW + cellW / 2;
    const cy = Math.floor(i / perRow) * cellH + cellH * 0.46;
    const sel = app.uid === Lab.selected;
    const R = base * (sel ? 1.16 : 1);
    // 液体填充比例（俯视：水越多圆越大，最多到器皿内径）
    const cap = app.def.cap;
    const fill = Math.min(1, Math.max(0, (waterVolume(app) * 1000 + app.contents.filter((c) => !c.dissolved && c.phase !== 'g').reduce((a, c) => a + c.mol * 20, 0)) / cap));
    const { rgb, alpha } = solutionColor(app);
    // 玻璃外圈
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,.8)'; g.fill();
    g.lineWidth = sel ? 2.6 : 1.5;
    g.strokeStyle = sel ? '#0f9b8e' : '#9fb6c2'; g.stroke();
    // 液面
    const rl = R * 0.86 * (fill > 0.02 ? Math.sqrt(Math.min(1, fill)) : 0);
    if (rl > 1.5) {
      g.beginPath(); g.arc(cx, cy, rl, 0, Math.PI * 2);
      g.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + Math.max(0.78, alpha) + ')'; g.fill();
    }
    // 沉淀（贴底，俯视看是撒在圆里的小颗粒）
    const solids = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
    const ppts = app.pptMade > 1e-6 || app.pptRate > 0.5;
    if (solids.length || ppts) {
      const dots = Math.min(22, 6 + Math.round((solids.reduce((a, c) => a + c.mol, 0) + app.pptMade) * 140));
      const pcol = (solids.length && (subOf(solids[0].formula) || {}).color) || '#e8eef2';
      g.globalAlpha = 0.9; g.fillStyle = pcol;
      const pale = /^#(f|e|d)/i.test(pcol);        // 白色沉淀在白台面上要有轮廓才看得见
      g.strokeStyle = 'rgba(120,150,170,.75)'; g.lineWidth = 0.8;
      for (let k = 0; k < dots; k++) {
        const a = (k * 2.399) % (Math.PI * 2), rr = rl * 0.92 * Math.sqrt((k + 0.5) / dots);
        g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.9, 0, Math.PI * 2); g.fill();
        if (pale) g.stroke();
      }
      g.globalAlpha = 0.32; g.strokeStyle = pcol; g.lineWidth = 3;   // 沉降在底上的一圈
      g.beginPath(); g.arc(cx, cy, rl * 0.9, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 1;
    }
    // 结晶闪光
    if (app.contents.some((c) => c.formula === 'H2O' && c.phase === 's') === false && app.iceMol > 1e-6) {
      g.strokeStyle = 'rgba(220,245,255,.75)'; g.lineWidth = 1;
      for (let k = 0; k < 6; k++) {
        const a = k * 1.05, rr = rl * (0.3 + 0.6 * ((k % 3) / 3));
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        g.beginPath(); g.moveTo(x - 3, y); g.lineTo(x + 3, y); g.moveTo(x, y - 3); g.lineTo(x, y + 3); g.stroke();
      }
    }
    // 气泡：俯视看是液面上不断冒出的白点
    const bub = Math.min(26, Math.round(app.bubbleRate * 0.5));
    for (let k = 0; k < bub; k++) {
      const a = (k * 1.7 + (Date.now() / 620) % 6.28), rr = rl * (0.25 + 0.7 * ((k % 5) / 5));
      g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 2.1, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
      g.strokeStyle = 'rgba(120,150,170,.5)'; g.lineWidth = 0.7; g.stroke();
    }
    // 受热：外圈暖光
    const st = app.standOn ? toolByUid(app.standOn) : null;
    if (st && st.on && !app.broken) {
      g.beginPath(); g.arc(cx, cy, R + 3, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(255,180,84,.55)'; g.lineWidth = 2.4; g.stroke();
    }
    // 标签
    g.fillStyle = sel ? '#0b6b60' : '#3f5568'; g.font = (sel ? '600 ' : '') + '11px system-ui';
    const nm = app.uid + ' ' + app.def.name;
    g.fillText(nm, cx - g.measureText(nm).width / 2, cy + R + 13);
  });
}

function obsRender() {
  const info = document.querySelector('#obslist');
  if (info) {
    if (!Lab.apps.length) info.innerHTML = '<span class="hint">工作台上还没有容器</span>';
    else {
      const html = Lab.apps.map((a) => '<div class="obsrow' + (a.uid === Lab.selected ? ' sel' : '') + '" data-uid="' + a.uid + '">'
        + '<b>' + a.uid + ' ' + a.def.name + '</b><span>' + esc(observe(a).txt) + '</span></div>').join('');
      if (info._sig !== html) { info.innerHTML = html; info._sig = html; }
    }
  }
  const cv = document.querySelector('#obscv');
  if (cv) drawObserve(cv);
}

function obsInit() {
  const host = document.querySelector('#right .scroll');
  if (!host || document.querySelector('#obsbox')) return;
  const box = document.createElement('div');
  box.id = 'obsbox';
  box.innerHTML = '<h4>🔍 俯视观察<small>低头看容器里面：颜色 / 沉淀 / 气泡 / 结晶</small></h4>'
    + '<canvas id="obscv"></canvas><div id="obslist"></div>';
  const shelf = document.querySelector('#shelf');
  if (shelf && shelf.parentNode) shelf.parentNode.insertBefore(box, shelf.parentNode.firstChild);
  else host.insertBefore(box, host.firstChild);
  box.addEventListener('click', (ev) => {
    const row = ev.target.closest('.obsrow'); if (!row) return;
    Lab.selected = row.dataset.uid; renderBench(true); updateReadouts(); obsRender();
  });
  setInterval(obsRender, 220);
  obsRender();
}
document.addEventListener('DOMContentLoaded', obsInit);
Object.assign(window.CHEM, { observe, obsRender });
