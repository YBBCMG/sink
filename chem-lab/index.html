function placeOn(appUid, toolUid) {
  const app = appByUid(appUid); if (!app) return { ok: false, why: '没有这个容器' };
  if (app.broken) return { ok: false, why: app.def.name + ' 已经炸裂了' };
  if (!toolUid) {
    app.standOn = null;
    (app.meters || []).forEach((uid) => { const m = toolByUid(uid); if (m) m.app = null; });
    app.meters = []; app.gauze = false;
    repackBench(); syncHeaters(); return { ok: true };
  }
  const t = toolByUid(toolUid); if (!t) return { ok: false, why: '台面上没有这件器材' };
  if (t.kind === 'meter') {                              // 测量：插进容器（一台仪器一次只插一个）
    Lab.tools.forEach((o) => { if (o !== t && o.kind === 'meter' && o.app === app.uid && o.def.measures === t.def.measures) o.app = null; });
    Lab.apps.forEach((o) => { if (o !== app && o.meters) o.meters = o.meters.filter((uid) => uid !== t.uid); });
    app.meters = (app.meters || []).filter((uid) => (toolByUid(uid) || {}).app === app.uid);
    if (app.meters.indexOf(t.uid) < 0) app.meters.push(t.uid);
    t.app = app.uid;
    Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + t.def.name + ' 插进 ' + app.def.name + ' ' + app.uid + '（' + t.def.desc + '）' });
    repackBench(); updateReadouts && updateReadouts();
    return { ok: true, tool: t, meter: true };
  }
  if (t.kind === 'item' && t.hid === 'gauze') {           // 石棉网：垫在容器下面
    app.gauze = true; t.app = app.uid;
    Lab.log.push({ k: 'place', at: Lab.time, text: '在 ' + app.def.name + ' ' + app.uid + ' 下面垫了石棉网' });
    syncHeaters(); return { ok: true, tool: t, meter: true };
  }
  const other = occupantOf(t, app);
  if (other) return { ok: false, why: t.def.name + ' 上已经架着 ' + other.def.name + ' ' + other.uid + ' 了' };
  app.standOn = t.uid; app.x = t.x; app.y = t.y || 0;
  app.z = Math.max(app.z || 0, (t.z || 0) + 1);        // 架上去的容器画在器材上面（但别挡住器材的按钮区）
  repackBench();                                       // 重排一次，别让两张卡片压住对方的按钮
  Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + app.def.name + ' ' + app.uid + ' 架到 ' + t.def.name + ' ' + t.uid + ' 上' });
  syncHeaters();
  return { ok: true, tool: t };
}

/* ------------------------------ 测量（数值只能测出来） ------------------------------ */
const meterOn = (app, measures) => ((app && app.meters) || []).map(toolByUid).filter(Boolean)
  .find((t) => t.def && t.def.measures === measures) || null;
const meterOnBench = (measures) => Lab.tools.find((t) => t.kind === 'meter' && t.def.measures === measures) || null;
/** 读数的新鲜度：容器里的东西/温度变过，旧读数就不作数 */
const appSig = (app) => app.contents.length + '|' + round(app.contents.reduce((a, c) => a + c.mol, 0), 4) + '|' + round(app.temp, 0);
const measFresh = (app, m) => { const r = app.meas && app.meas[m]; return !!r && r.sig === appSig(app); };

/** 读一个数：必须真的用量器 —— 温度计/量筒/pH 计要插进容器，天平放台面上就行 */
function readValue(app, measures) {
  const def = METERS.find((m) => m.measures === measures);
  if (!def) return { ok: false, why: '没有这种测量器材' };
  const on = meterOn(app, measures), bench = meterOnBench(measures);
  if (def.attach && !on) {
    return { ok: false, meter: def, why: '先把「' + def.icon + ' ' + def.name + '」插进' + app.def.name
      + (bench ? '（点它卡片上的「⬇ 插进 ' + app.def.name + '」）' : '（台面上还没摆，先在「器材」行点一件）') };
  }
  if (!def.attach && !bench) return { ok: false, meter: def, why: '台面上还没有「' + def.name + '」，先在「器材」行摆一件' };
  let v = null, text = '';
  if (measures === 'temp') { v = K2C(app.temp); text = v + ' °C（' + round(app.temp, 2) + ' K）'; }
  else if (measures === 'vol') { v = round(waterVolume(app) * 1000, 1); text = v + ' mL 液体'; }
  else if (measures === 'ph') {
    const ph = computePH(app);
    if (ph == null) return { ok: false, meter: def, why: app.def.name + ' 里没有水溶液，pH 计读不出数（先加水/加溶液）' };
    v = round(ph, 2);
    text = v + (ph > 7.8 ? '（明显碱性）' : ph < 6.5 ? '（明显酸性）' : '（接近中性）');
  } else if (measures === 'mass') { v = round(totalMass(app), 2); text = v + ' g（含容器 ' + round(app.glassMass, 1) + ' g）'; }
  app.meas = app.meas || {};
  app.meas[measures] = { v: v, text: text, at: Lab.time, sig: appSig(app), by: def.name };
  Lab.log.push({ k: 'measure', at: Lab.time, text: '【测量 ' + app.def.name + ' ' + app.uid + '】' + def.icon + ' ' + def.name + '：' + text });
  Lab.measureCount = (Lab.measureCount || 0) + 1;
  return { ok: true, v: v, text: text, meter: def };
}
/** 四样一起测：有量器的读出来，没有的给出缺什么 */
function measureAll(app) {
  const got = [], miss = [];
  METERS.forEach((m) => { const r = readValue(app, m.measures); if (r.ok) got.push(r.text); else miss.push(r.why); });
  return { ok: got.length > 0, got: got, miss: miss };
}

function delTool(uid) {  const i = Lab.tools.findIndex((t) => t.uid === uid); if (i < 0) return;
  const t = Lab.tools[i];
  Lab.apps.forEach((a) => { if (a.standOn === t.uid) a.standOn = null; });   // 器材撤走 → 容器落回台面
  Lab.tools.splice(i, 1);
  repackBench();
  Lab.log.push({ k: 'clear', at: Lab.time, text: '收走 ' + t.def.name });
  syncHeaters();
}

function removeApp(uid) {
  const i = Lab.apps.findIndex((a) => a.uid === uid); if (i < 0) return;
  Lab.apps.splice(i, 1);
  if (Lab.selected === uid) Lab.selected = Lab.apps.length ? Lab.apps[0].uid : null;
  syncHeaters();
}

/** 把"实物关系"翻译成物理引擎认的 app.heater（每步同步一次，所以挪走/熄灭立刻生效） */
function syncHeaters() {
  Lab.apps.forEach((app) => {
    if (app.broken) { app.heater = null; return; }         // 碎了的器皿不再受热
    const t = standOf(app);
    if (!t) { app.heater = null; return; }
    const h = Object.assign({}, t.def, { on: !!t.on });
    if (h.needsDirect && !app.def.direct && !app.gauze) {   // 烧杯这类不能直火，得垫石棉网
      h.eff *= 0.5;
      if (t.on && !app._meshWarned) {
        app._meshWarned = true;
        pushMsg(app.def.name + ' 不能直接放在明火上，须垫石棉网：受热不均，传热效率下降，可能炸裂'
          + '（台面上先摆「🕸 石棉网」，再点它的「⬇ 垫到容器下」）');
      }
    } else if (h.needsDirect && !app.def.direct && app.gauze && t.on && !app._meshOk) {
      app._meshOk = true;
      pushMsg(app.def.name + ' 垫了石棉网，受热均匀了，可以正常加热');
    }
    app.heater = h;
  });
  return Lab.apps;
}

/** 脚本 API（老接口，教程/测试用）：等价于"摆一件器材 → 架上去 → 点着"三步。
 *  手玩时请直接用台面上的「放一个」按钮、拖拽、器材卡片上的「点燃」。 */
function setHeater(uid, heaterId, on) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };
  if (app.broken) { pushMsg(app.def.name + ' 已经炸裂了，不能再加热'); return { ok: false, why: '已炸裂' }; }
  if (!on) { const t = standOf(app); if (t) lightTool(t.uid, false); app.heater = null; return { ok: true, off: true }; }
  const h = HEATERS.find((x) => x.id === heaterId); if (!h) return { ok: false, why: '没有这种热源' };
  let t = standOf(app);
  if (!t || t.hid !== h.id) t = Lab.tools.find((x) => x.hid === h.id && !occupantOf(x)) || addTool(h.id, app.x);
  if (!t) return { ok: false, why: '台面摆不下器材了' };
  const r = placeOn(app.uid, t.uid); if (!r.ok) return r;
  lightTool(t.uid, true);
  syncHeaters();
  return { ok: true, tool: t };
}
function ignite(uid) {
  const app = appByUid(uid); if (!app) return;
  app.ignited = true; app.igniteUntil = Lab.time + 3;
  app.flame = Math.max(app.flame, 0.6);
  Lab.log.push({ k: 'ignite', text: '点燃 ' + app.def.name + ' 中的物质', at: Lab.time });
}
function stir(uid) {
  const app = appByUid(uid); if (!app) return;
  app.stirrerOn = !app.stirrerOn;
  Lab.log.push({ k: 'stir', text: (app.stirrerOn ? '开始' : '停止') + '搅拌 ' + app.def.name, at: Lab.time });
}
function clearApp(uid) {
  const app = appByUid(uid); if (!app) return;
  app.contents.length = 0; app.gasBubbles.length = 0; app.bubbles.length = 0; app.ppts.length = 0;
  app.temp = PHYS.T0; app.iceMol = 0; app.dryWarn = false;
  Lab.log.push({ k: 'clear', text: '倒空并洗净 ' + app.def.name, at: Lab.time });
}
/** 倾倒：把 from 的液体（含溶质）全部转移到 to */
function pour(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的倾倒' };
  if (a.broken) return { ok: false, why: a.def.name + ' 已经炸裂了，里面的东西全洒了' };
  if (b.broken) return { ok: false, why: b.def.name + ' 已经炸裂了，装不了东西' };
  const liquid = a.contents.filter((c) => c.dissolved || c.phase === 'l' || c.phase === 'aq');
  const wMol = liquid.filter((c) => c.formula === 'H2O').reduce((s, c) => s + c.mol, 0);
  if (wMol <= 1e-9) return { ok: false, why: a.def.name + ' 里没有可倒的液体' };
  if ((waterMol(b) + wMol) * 18.015 > b.def.cap) return { ok: false, why: b.def.name + ' 装不下这些液体' };
  if (shockCheck(b, wMol * 18.015)) return { ok: false, why: b.def.name + ' 被倒进来的液体骤冷激裂了！' };
  liquid.forEach((c) => {
    addContent(b, c.formula, c.mol, c.phase === 'l' ? 'l' : 'aq', c.phase !== 'l');
    c.mol = 0;
  });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  Lab.pourCount++;
  Lab.log.push({ k: 'pour', text: '把 ' + a.def.name + ' 中的液体倒入 ' + b.def.name, at: Lab.time });
  return { ok: true };
}

/** 导气：把 a 气相里的气体通入 b（导管/排气法）。装不下的从 b 逸出；b 里有液体则冒泡穿过 */
function feedGas(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的导气目标' };
  if (a.broken || b.broken) return { ok: false, why: '炸裂的容器接不了导管' };
  // 通气时，溶液里溶解的气体也会被带出来：溶解的 CO₂ 回到气相，碳酸不稳定、直接分解放出 CO₂
  [...a.contents].forEach((c) => {
    if (c.mol <= 1e-9 || c.phase === 'g' || c.formula === 'H2O') return;
    if (c.formula === 'H2CO3') {
      addContent(a, 'H2O', c.mol, null, true);
      addContent(a, 'CO2', c.mol, 'g', false);
      c.mol = 0;
    } else if (c.formula === 'NH3·H2O') {
      // 氨水被"导气"带走时放出氨气（真实实验里加热氨水就是制氨气的办法）
      addContent(a, 'H2O', c.mol, null, true);
      addContent(a, 'NH3', c.mol, 'g', false);
      c.mol = 0;
    } else {
      const s = subOf(c.formula);
      if (s && s.st === 'g') { c.phase = 'g'; c.dissolved = false; }
    }
  });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  const gases = a.contents.filter((c) => c.phase === 'g' && c.mol > 1e-9);
  if (!gases.length) return { ok: false, why: a.def.name + ' 里没有气体可导出（先让它产生气体）' };
  const names = gases.map((c) => c.formula);
  gases.forEach((c) => {
    const keep = putGas(b, c.formula, c.mol);
    if (keep > 1e-12 && waterMol(b) > 1e-9) b.gasBubbles.push({ f: c.formula, mol: keep });   // 气体穿过液体 → 冒泡
    c.mol = 0;
  });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  Lab.gasFeedCount++;
  Lab.log.push({
    k: 'pour', at: Lab.time,
    text: '导气：' + a.def.name + ' 中的 ' + names.join('、') + ' 通入 ' + b.def.name
      + (waterMol(b) > 1e-9 ? '（气泡穿过液体）' : ''),
  });
  return { ok: true, moved: names };
}

/* 过滤：把液相滤到另一个容器，未溶固体留在原容器（初中「粗盐提纯」核心操作） */
function filterApp(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的过滤目标' };
  if (a.broken || b.broken) return { ok: false, why: '炸裂的容器不能用来过滤' };
  const liquid = a.contents.filter((c) => c.phase !== 'g' && (c.dissolved || c.phase === 'l'));
  const wMol = liquid.filter((c) => c.formula === 'H2O').reduce((s, c) => s + c.mol, 0);
  if (wMol <= 1e-9) return { ok: false, why: a.def.name + ' 里没有可滤的液体' };
  if ((waterMol(b) + wMol) * 18.015 > b.def.cap) return { ok: false, why: b.def.name + ' 装不下这些滤液' };
  liquid.forEach((c) => { addContent(b, c.formula, c.mol, c.phase === 'l' ? 'l' : 'aq', c.phase !== 'l'); c.mol = 0; });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  const kept = a.contents.filter((c) => !c.dissolved && c.phase !== 'g');
  Lab.filterCount++;
  Lab.log.push({
    k: 'pour', at: Lab.time,
    text: '过滤：' + a.def.name + ' 里的液体滤进 ' + b.def.name + '，滤纸上留下 '
      + (kept.length ? kept.map((c) => c.formula).join('、') : '少量不溶物'),
  });
  return { ok: true, kept: kept.map((c) => c.formula) };
}

/** 通电（电解）：需要容器里有水/电解质溶液 */
function setPower(uid, on) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };
  if (app.broken) return { ok: false, why: app.def.name + ' 已经炸裂了，不能通电' };
  if (on && waterMol(app) <= 1e-9) return { ok: false, why: app.def.name + ' 里没有液体，通不了电（电解需要水溶液）' };
  app.elec = !!on;
  if (app.elec) {
    Lab.elecCount++;
    Lab.log.push({ k: 'ignite', text: '给 ' + app.def.name + ' 通电：两根惰性电极插入液体', at: Lab.time });
    pushMsg('⚡ 通电中：两极冒气泡（负极氢气、正极氧气，体积比约 2:1）。真实实验会加少量硫酸钠增强导电');
  } else {
    Lab.log.push({ k: 'ignite', text: '切断 ' + app.def.name + ' 的电源', at: Lab.time });
  }
  return { ok: true, on: app.elec };
}

function pushMsg(text) { Lab.lastMsg = text; Lab.log.push({ k: 'warn', text, at: Lab.time }); if (Lab.log.length > 200) Lab.log.shift(); }

/** 每步环境（点燃/催化剂/浓度） */
function envOf(app) {
  const cats = new Set(app.contents.filter((c) => c.mol > 1e-9 && CATALYSTS.has(c.formula)).map((c) => c.formula));
  return {
    temp: app.temp,
    catalysts: cats,
    ignite: !!app.ignited && (app.igniteUntil || 0) > Lab.time,
    conc: app.acidConc === 'conc' ? 'conc' : 'dil',
    light: false, discharge: !!app.discharge, elec: !!app.elec,
  };
}

/* ------------------------------ 引导任务 --------------------------------- */
/** 反应是否已被发现（key 是排序过的，用集合比较更稳） */
function rxFound(lhs, rhs) {
  const norm = (s) => s.split(',').map((x) => x.trim()).sort().join(',');
  const want = norm(lhs) + '>' + norm(rhs);
  return Lab.discovered.has(want);
}
const TASKS = [
  { id: 't1', text: '称 5 g 食盐溶于 50 mL 水，得到澄清溶液', check: () => Lab.apps.some((a) => a.contents.some((c) => c.formula === 'NaCl' && c.dissolved && c.mol > 0.05)) },
  { id: 't2', text: '把水加热到沸腾（看温度计到 373 K 以上）', check: () => Lab.apps.some((a) => a.steamAccum > 0) },
  { id: 't3', text: '让盐酸和氢氧化钠中和，并用酚酞或 pH 计确认接近中性', check: () => rxFound('HCl,NaOH', 'NaCl,H2O') || Lab.apps.some((a) => { const ph = computePH(a); return ph != null && ph > 5.5 && ph < 8.5 && a.contents.some((c) => c.formula === 'NaCl' && c.dissolved); }) },
  { id: 't4', text: '用锌（或铁）把硫酸铜里的铜置换出来（蓝色褪去、析出红色铜）', check: () => rxFound('Zn,CuSO4', 'ZnSO4,Cu') || rxFound('Fe,CuSO4', 'FeSO4,Cu') },
  { id: 't5', text: '做出一次明显放热反应（反应本身让温度上升 10 K 以上）', check: () => (Lab.maxRxRise || 0) > 10 },
  { id: 't6', text: '放出一次气体（看到气泡逸出）', check: () => Lab.apps.some((a) => a.gasVented > 0.001) },
];
function refreshTasks() {
  TASKS.forEach((t) => { if (!Lab.taskDone[t.id] && t.check()) { Lab.taskDone[t.id] = true; Lab.log.push({ k: 'task', text: '✅ 任务完成：' + t.text, at: Lab.time }); } });
  return TASKS;
}

/* ------------------------------ 主循环一步 ------------------------------- */
function labStep(dt) {
  const envs = [];
  Lab.time += dt;
  syncHeaters();                                    // 先把"谁架在什么器材上、点着没有"翻译成热源，再跑物理
  Lab.tools.forEach((t) => { t.t = (t.t || 0) + dt; t.flame = Math.max(0, (t.flame || 0) - dt * 0.8); });
  Lab.apps.forEach((app) => {
    // 反应产物气泡/蒸汽速率自然衰减（缓慢衰减：气泡要飘一会儿才散）
    app.bubbleRate = Math.max(0, app.bubbleRate - dt * 6);
    app.pptRate = Math.max(0, app.pptRate - dt * 4);
    if (app.gasBubbles.length) app.bubbleRate = Math.max(app.bubbleRate, 30);
    app.flash = Math.max(0, app.flash - dt * 1.6);
    app.flame = Math.max(0, app.flame - dt * 0.8);
    app.smoke = Math.max(0, app.smoke - dt * 0.7);
    if (app.ignited && (app.igniteUntil || 0) <= Lab.time && app.flame <= 0.05) app.ignited = false;
    // 冒泡计数 → 供渲染与气体验证
    app.gasBubbles = app.gasBubbles.filter((g) => { g.mol -= dt * 0.02; return g.mol > 1e-4; });
    const before = app.temp;
    const rx = worldStep(app, dt, envOf(app));
    rx.forEach((r) => {
      Lab.totalRx++;
      Lab.discovered.add(r.rx.key);
      Lab.log.push({
        k: 'rxn', at: Lab.time, uid: app.uid,
        text: r.rx.eq + (r.rx.condText ? '  （' + r.rx.condText + '）' : ''),
        note: r.rx.note + '｜' + r.rx.phen.join('、') + '｜ΔH≈' + round(r.dHUsed, 1) + ' kJ/mol'
          + (r.usedAq ? (r.rx.dhAqEst ? '（估算）' : '（水合态生成焓）') : (r.rx.dhEst ? '（估算）' : '（由生成焓算出）')),
      });
    });
    // 反应过程内的累计温升（同一次反应可能跨好几步，不能只看单步；单纯加热不算）
    if (rx.length) {
      if (app._rxMark == null || Lab.time - (app._rxLast || 0) > 1.5) app._rxMark = before;
      app._rxLast = Lab.time;
      Lab.maxRxRise = Math.max(Lab.maxRxRise || 0, app.temp - app._rxMark);
    } else if (app._rxMark != null && Lab.time - (app._rxLast || 0) > 1.5) app._rxMark = null;
  });
  if (Lab.log.length > 240) Lab.log.splice(0, Lab.log.length - 240);
  refreshTasks();
}


/* ================= 06-view.js ================= */
/* ============================================================================
 * 06-view.js —— 视觉层：玻璃器皿、液面、固体堆积、气泡、沉淀、火焰、蒸汽、闪光
 * ----------------------------------------------------------------------------
 * 全部 Canvas 2D 手绘，无贴图无外部资源。粒子数与物理步长解耦（固定 dt 上限）。
 * ==========================================================================*/

const VIEW = { bubbleCap: 90, pptCap: 80, steamCap: 40 };

/* ---------------------------- 溶液颜色（真实观感） ------------------------- */
const TINT_STRENGTH = {
  CuSO4: 3.2, CuCl2: 2.6, 'Cu(NO3)2': 2.6, KMnO4: 6.0, I2: 4.0, Br2: 4.0,
  FeCl3: 2.0, 'Fe2(SO4)3': 2.0, K2MnO4: 3.0, 酚酞: 2.0, 石蕊: 1.5,
};
function solutionColor(app) {
  const V = Math.max(1e-4, waterVolume(app));
  let r = 0, g = 0, b = 0, wsum = 0;
  app.contents.filter((c) => c.dissolved && c.formula !== 'H2O').forEach((c) => {
    const s = subOf(c.formula); if (!s) return;
    const col = hex2rgb(s.color);
    // 无色溶质（食盐、硝酸银、氢氧化钠…）不该把水染成白汤，只有带色离子的才计权
    const mx = Math.max(col[0], col[1], col[2]);
    if (mx <= 0) return;
    const sat = (mx - Math.min(col[0], col[1], col[2])) / mx;
    if (sat < 0.12) return;
    const conc = c.mol / V;
    const str = (TINT_STRENGTH[c.formula] || 1) * conc;
    if (str < 1e-4) return;
    r += col[0] * str; g += col[1] * str; b += col[2] * str; wsum += str;
  });
  // 指示剂（酚酞遇碱变红 / 石蕊变蓝）优先级最高：真实实验里它就是一眼能看见
  const tint = indicatorTint(app);
  if (tint) { const col = hex2rgb(tint); const w = 1.1; r += col[0] * w; g += col[1] * w; b += col[2] * w; wsum += w; }
  if (wsum > 0) {
    const base = [200, 228, 245];
    const mix = [r / wsum, g / wsum, b / wsum];
    const a = Math.min(0.92, 0.12 + wsum * 0.5);
    const col = base.map((v, i) => Math.round(v * (1 - a) + mix[i] * a));
    return { rgb: col, alpha: 0.62 + a * 0.28 };
  }
  return { rgb: [200, 228, 245], alpha: 0.55 };
}
const hex2rgb = (h) => {
  if (!h) return [200, 200, 200];
  if (h[0] !== '#') return [200, 200, 200];
  const v = h.length === 4 ? h.slice(1).split('').map((c) => c + c).join('') : h.slice(1);
  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
};
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

/* ------------------------------- 器皿几何 -------------------------------- */
function vesselGeom(shape, w, h) {
  const P = new Path2D();
  let top, bot, x0, x1;
  if (shape === 'tube') {
    x0 = w * 0.37; x1 = w * 0.63; top = h * 0.10; bot = h * 0.86;
    const r = (x1 - x0) / 2;
    P.moveTo(x0, top); P.lineTo(x0, bot - r); P.arc((x0 + x1) / 2, bot - r, r, Math.PI, 0, true);
    P.lineTo(x1, top); P.closePath();
  } else if (shape === 'beaker') {
    x0 = w * 0.24; x1 = w * 0.76; top = h * 0.20; bot = h * 0.84;
    P.moveTo(x0, top); P.lineTo(x0 + w * 0.02, bot - h * 0.04); P.quadraticCurveTo(x0 + w * 0.03, bot, x0 + w * 0.09, bot);
    P.lineTo(x1 - w * 0.09, bot); P.quadraticCurveTo(x1 - w * 0.03, bot, x1 - w * 0.02, bot - h * 0.04);
    P.lineTo(x1, top); P.closePath();
  } else if (shape === 'flask') {
    x0 = w * 0.20; x1 = w * 0.80; top = h * 0.08; bot = h * 0.88;
    const nx0 = w * 0.43, nx1 = w * 0.57, ny = h * 0.36;
    P.moveTo(nx0, top); P.lineTo(nx0, ny); P.lineTo(x0, bot - h * 0.05);
    P.quadraticCurveTo(x0, bot, x0 + w * 0.12, bot); P.lineTo(x1 - w * 0.12, bot);
    P.quadraticCurveTo(x1, bot, x1, bot - h * 0.05); P.lineTo(nx1, ny); P.lineTo(nx1, top); P.closePath();
  } else if (shape === 'dish') {
    x0 = w * 0.18; x1 = w * 0.82; top = h * 0.46; bot = h * 0.84;
    P.moveTo(x0, top); P.quadraticCurveTo(w * 0.5, bot + h * 0.06, x1, top); P.closePath();
  } else {                                  // crucible 坩埚
    x0 = w * 0.28; x1 = w * 0.72; top = h * 0.34; bot = h * 0.86;
    P.moveTo(x0, top); P.lineTo(x0 + w * 0.06, bot); P.lineTo(x1 - w * 0.06, bot); P.lineTo(x1, top); P.closePath();
  }
  return { path: P, top, bot, x0, x1, cx: (x0 + x1) / 2, w: x1 - x0 };
}

/* -------------------------------- 粒子系统 -------------------------------- */
function spawnParticles(app, dt) {
  const g = app._geo; if (!g) return;
  const boil = app.temp > (typeof boilingPoint === 'function' ? boilingPoint(app) - 1.5 : 372) && waterMol(app) > 1e-9;
  let rate = app.bubbleRate + (boil ? 26 : 0);
  if (app.heater && app.heater.on && waterMol(app) > 1e-9 && app.temp > 320) rate += (app.temp - 320) * 0.08;
  // 累积器：每帧生成量常常不足 1 个，直接四舍五入会永远生不出粒子
  const acc = (k, amt) => { app[k] = (app[k] || 0) + amt; const n = Math.floor(app[k]); app[k] -= n; return n; };
  const nB = Math.min(8, acc('_bAcc', rate * dt * 2));
  for (let i = 0; i < nB && app.bubbles.length < VIEW.bubbleCap; i++) {
    const bx = g.x0 + (g.x1 - g.x0) * (0.12 + Math.random() * 0.76);
    const y = app._liquidTop + (g.bot - app._liquidTop) * (0.3 + Math.random() * 0.7);
    app.bubbles.push({ x: bx, y, r: 1.2 + Math.random() * 2.6, v: 12 + Math.random() * 26, ph: Math.random() * 6.28 });
  }
  const nP = Math.min(6, acc('_pAcc', app.pptRate * dt * 2));
  for (let i = 0; i < nP && app.ppts.length < VIEW.pptCap; i++) {
    const px = g.x0 + (g.x1 - g.x0) * (0.08 + Math.random() * 0.84);
    app.ppts.push({ x: px, y: app._liquidTop + Math.random() * (g.bot - app._liquidTop) * 0.5, r: 0.8 + Math.random() * 1.6, v: 4 + Math.random() * 9, c: app._pptRgb || [80, 80, 80] });
  }
  const nS = Math.min(4, acc('_sAcc', boil ? dt * 18 : 0));
  for (let i = 0; i < nS && app.steam.length < VIEW.steamCap; i++) {
    app.steam.push({ x: g.cx + (Math.random() - 0.5) * g.w * 0.7, y: app._liquidTop - 2, r: 4 + Math.random() * 7, life: 1, v: 14 + Math.random() * 16 });
  }
}

function stepParticles(app, dt) {
  const g = app._geo; if (!g) return;
  const surface = app._liquidTop;
  app.bubbles = app.bubbles.filter((b) => {
    b.y -= b.v * dt; b.ph += dt * 6;
    return b.y > surface - 3;
  });
  app.ppts = app.ppts.filter((p) => {
    p.y += p.v * dt;
    return p.y < g.bot - 2;
  });
  app.steam = app.steam.filter((s) => { s.y -= s.v * dt; s.r += dt * 9; s.life -= dt * 0.55; return s.life > 0; });
}

/* --------------------------------- 渲染 ---------------------------------- */
function drawBench(ctx, w, h) {
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#10161d'); bg.addColorStop(0.62, '#0d1319'); bg.addColorStop(1, '#1b2833');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(120,180,220,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h * 0.86); ctx.lineTo(w, h * 0.86); ctx.stroke();
  ctx.fillStyle = 'rgba(120,180,220,0.05)'; ctx.fillRect(0, h * 0.86, w, h * 0.14);
  // 网格纹路
  ctx.strokeStyle = 'rgba(120,180,220,0.05)';
  for (let x = 0; x < w; x += 18) { ctx.beginPath(); ctx.moveTo(x, h * 0.86); ctx.lineTo(x, h); ctx.stroke(); }
}

function drawFlame(ctx, app, g, h) {
  if (!app.heater || !app.heater.on) return;
  const t = app.time * 8;
  const cx = g.cx, base = h * 0.90;
  const kind = app.heater.id;
  const flick = 0.85 + 0.15 * Math.sin(t) + 0.08 * Math.sin(t * 2.7);
  if (kind === 'plate') {
    const grd = ctx.createRadialGradient(cx, base - 4, 2, cx, base - 4, g.w * 0.8);
    grd.addColorStop(0, 'rgba(255,90,40,0.55)'); grd.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(cx, base - 2, g.w * 0.8, h * 0.05, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(20,20,24,0.9)'; ctx.fillRect(cx - g.w * 0.55, base - 2, g.w * 1.1, 6);
    return;
  }
  const fh = (kind === 'bunsen' ? h * 0.22 : h * 0.15) * flick;
  const fw = g.w * (kind === 'bunsen' ? 0.34 : 0.42);
  // 外焰
  let grd = ctx.createRadialGradient(cx, base - fh * 0.45, 1, cx, base - fh * 0.45, fh * 0.9);
  grd.addColorStop(0, kind === 'bunsen' ? 'rgba(170,220,255,0.95)' : 'rgba(255,230,150,0.95)');
  grd.addColorStop(0.5, kind === 'bunsen' ? 'rgba(90,150,255,0.65)' : 'rgba(255,150,40,0.7)');
  grd.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, base - fh * 0.45, fw * 0.6, fh * 0.62, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - fw * 0.35, base); ctx.quadraticCurveTo(cx - fw * 0.15, base - fh * 0.9, cx, base - fh);
  ctx.quadraticCurveTo(cx + fw * 0.15, base - fh * 0.9, cx + fw * 0.35, base); ctx.closePath();
  ctx.fillStyle = kind === 'bunsen' ? 'rgba(150,200,255,0.55)' : 'rgba(255,200,90,0.5)'; ctx.fill();
  // 灯体
  if (kind === 'lamp') { ctx.fillStyle = '#2a3947'; ctx.fillRect(cx - g.w * 0.26, base, g.w * 0.52, h * 0.07); }
  else { ctx.fillStyle = '#26333f'; ctx.fillRect(cx - 4, base, 8, h * 0.07); ctx.fillRect(cx - g.w * 0.3, h * 0.97, g.w * 0.6, 4); }
}

function drawBroken(ctx, g, app, w, h) {
  ctx.save();
  // 只剩半截的器壁 + 锯齿缺口
  ctx.strokeStyle = 'rgba(150,205,225,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(g.x0, g.top + (g.bot - g.top) * 0.34);
  ctx.lineTo(g.x0, g.bot - 8);
  ctx.quadraticCurveTo(g.cx, g.bot + 8, g.x1, g.bot - 8);
  ctx.lineTo(g.x1, g.top + (g.bot - g.top) * 0.42);
  ctx.stroke();
  // 裂纹
  ctx.strokeStyle = 'rgba(225,245,255,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const x = g.x0 + (g.x1 - g.x0) * (0.18 + i * 0.21);
    ctx.beginPath();
    ctx.moveTo(x, g.bot - 10);
    ctx.lineTo(x + (i % 2 ? 7 : -7), g.top + (g.bot - g.top) * (0.45 + i * 0.05));
    ctx.stroke();
  }
  // 台面上的碎玻璃
  (app.shards || []).forEach((s) => {
    const sx = g.cx + s.x * (g.x1 - g.x0) * 1.15;
    const sy = Math.min(h - 6, g.bot + 8 + s.y * 34);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(s.rot);
    ctx.beginPath();
    ctx.moveTo(-s.r * 0.6, s.r * 0.5); ctx.lineTo(s.r * 0.7, s.r * 0.3); ctx.lineTo(-s.r * 0.1, -s.r * 0.7);
    ctx.closePath();
    ctx.fillStyle = 'rgba(170,220,240,0.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(230,250,255,0.7)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = 'rgba(255,120,120,0.92)';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('❌ 已炸裂', g.cx, g.top + 14);
  ctx.restore();
}

function renderApparatus(canvas, app, dt) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 190, h = canvas.clientHeight || 150;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBench(ctx, w, h);
  const g = vesselGeom(app.def.shape, w, h);
  app._geo = g;
  if (app.broken) { drawBroken(ctx, g, app, w, h); return; }

  // 液面高度
  const fr = Math.max(0, Math.min(1, fillRatio(app)));
  const innerTop = g.top + (g.bot - g.top) * 0.06;
  const liquidTop = g.bot - (g.bot - innerTop) * Math.min(1, fr);
  app._liquidTop = liquidTop;
  const col = solutionColor(app);
  app._pptRgb = (app.contents.find((c) => !c.dissolved && c.phase !== 'g' && subOf(c.formula) && subOf(c.formula).solubility === -1) ?
    hex2rgb(subOf(app.contents.find((c) => !c.dissolved && c.phase !== 'g' && subOf(c.formula) && subOf(c.formula).solubility === -1).formula).color) : [70, 70, 70]);

  spawnParticles(app, dt);
  stepParticles(app, dt);

  drawFlame(ctx, app, g, h);

  // 玻璃内部
  ctx.save();
  ctx.fillStyle = 'rgba(190,225,245,0.06)'; ctx.fill(g.path); ctx.fill();
  if (waterMol(app) > 1e-9 || app.iceMol > 0) {
    ctx.save(); ctx.clip(g.path);
    const lg = ctx.createLinearGradient(0, liquidTop, 0, g.bot);
    lg.addColorStop(0, rgba(col.rgb, col.alpha * 0.85));
    lg.addColorStop(1, rgba(col.rgb.map((v) => Math.round(v * 0.82)), col.alpha));
    ctx.fillStyle = lg;
    ctx.fillRect(g.x0 - 2, liquidTop, g.w + 4, g.bot - liquidTop + 2);
    // 水面的弯月面
    ctx.strokeStyle = rgba([235, 248, 255], 0.55); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(g.x0, liquidTop); ctx.quadraticCurveTo(g.cx, liquidTop + 3, g.x1, liquidTop); ctx.stroke();
    ctx.restore();
  }
  // 未溶解固体（按量堆积）
  const solids = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
  if (solids.length) {
    ctx.save(); ctx.clip(g.path);
    let pile = 0;
    solids.forEach((c) => {
      const s = subOf(c.formula); if (!s) return;
      const c2 = hex2rgb(s.color);
      const vol = massOf(c) / Math.max(0.5, subDensity(s) || 2);
      const hgt = Math.min(h * 0.30, 3 + vol * 0.9);
      const yy = g.bot - pile;
      ctx.fillStyle = rgba(c2, 0.95);
      ctx.beginPath();
      ctx.moveTo(g.x0 + 1, yy);
      for (let i = 0; i <= 8; i++) {
        const x = g.x0 + 1 + (g.w - 2) * (i / 8);
        const bump = Math.sin(i * 1.7 + c.mol * 3) * (hgt * 0.22);
        ctx.lineTo(x, yy - hgt * (0.55 + 0.45 * Math.sin((i / 8) * Math.PI)) - bump);
      }
      ctx.lineTo(g.x1 - 1, yy); ctx.closePath(); ctx.fill();
      pile += hgt * 0.28;
    });
    ctx.restore();
  }
  // 沉淀颗粒
  app.ppts.forEach((p) => {
    ctx.fillStyle = rgba(p.c, 0.85);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  });
  // 气泡
  app.bubbles.forEach((b) => {
    const wob = Math.sin(b.ph) * 1.4;
    ctx.strokeStyle = 'rgba(240,252,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x + wob, b.y, b.r, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(220,245,255,0.18)'; ctx.fill();
  });
  // 液面上方的蒸汽
  app.steam.forEach((s) => {
    ctx.fillStyle = 'rgba(225,240,250,' + (0.30 * s.life) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  });
  // 玻璃高光与轮廓
  ctx.save(); ctx.clip(g.path);
  const hl = ctx.createLinearGradient(g.x0, 0, g.x1, 0);
  hl.addColorStop(0, 'rgba(255,255,255,0.16)'); hl.addColorStop(0.18, 'rgba(255,255,255,0.03)');
  hl.addColorStop(0.85, 'rgba(255,255,255,0.01)'); hl.addColorStop(1, 'rgba(255,255,255,0.13)');
  ctx.fillStyle = hl; ctx.fillRect(g.x0 - 4, 0, g.w + 8, h);
  ctx.restore();
  ctx.strokeStyle = 'rgba(200,232,248,0.55)'; ctx.lineWidth = 1.6; ctx.stroke(g.path);
  // 刻度线
  if (app.def.shape !== 'dish') {
    ctx.strokeStyle = 'rgba(200,232,248,0.28)'; ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      const y = g.bot - (g.bot - g.top) * (i / 5);
      ctx.beginPath(); ctx.moveTo(g.x1 - 6, y); ctx.lineTo(g.x1 - 1, y); ctx.stroke();
    }
  }
  // 反应闪光 / 干烧告警
  if (app.flash > 0.01) {
    const grd = ctx.createRadialGradient(g.cx, liquidTop, 1, g.cx, liquidTop, Math.max(g.w, 60));
    grd.addColorStop(0, 'rgba(255,240,190,' + Math.min(0.75, app.flash) + ')');
    grd.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
  }
  if (app.flame > 0.5) {
    ctx.fillStyle = 'rgba(255,200,120,' + Math.min(0.35, app.flame * 0.25) + ')';
    ctx.beginPath(); ctx.arc(g.cx, liquidTop, Math.max(g.w * 0.7, 40), 0, 6.283); ctx.fill();
  }
  if (app.smoke > 0.05) {
    ctx.fillStyle = 'rgba(235,235,240,' + Math.min(0.5, app.smoke * 0.35) + ')';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(g.cx + (Math.sin(app.time * 1.4 + i * 2) * g.w * 0.28), h * 0.16 - i * 5, 6 + i * 3, 0, 6.283);
      ctx.fill();
    }
  }
  if (app.dryWarn) {
    ctx.strokeStyle = 'rgba(255,90,70,' + (0.35 + 0.25 * Math.sin(app.time * 6)) + ')';
    ctx.lineWidth = 2.4; ctx.stroke(g.path);
  }
  // 高温红热
  if (app.temp > 700) {
    const hot = Math.min(0.5, (app.temp - 700) / 900);
    ctx.save(); ctx.clip(g.path);
    ctx.fillStyle = 'rgba(255,110,40,' + hot + ')'; ctx.fillRect(g.x0 - 4, g.bot - h * 0.3, g.w + 8, h * 0.3);
    ctx.restore();
  }
}

/** 初始化容器的粒子容器字段 */
function initViewState(app) {
  app.bubbles = app.bubbles || []; app.ppts = app.ppts || []; app.steam = app.steam || [];
}

/* ============================ 器材（热源）绘制 ============================= */
/** 画一件热源器材。点着时火焰顶到画布上沿 —— 正好接住架在它上面的容器底部。 */
function flame(ctx, cx, baseY, hh, ww, inner, outer) {
  const grd = ctx.createRadialGradient(cx, baseY - hh * 0.35, 1, cx, baseY - hh * 0.3, Math.max(6, hh * 0.85));
  grd.addColorStop(0, 'rgba(' + inner.join(',') + ',0.96)');
  grd.addColorStop(0.45, 'rgba(' + outer.join(',') + ',0.85)');
  grd.addColorStop(1, 'rgba(' + outer.join(',') + ',0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(cx - ww / 2, baseY);
  ctx.quadraticCurveTo(cx - ww * 0.64, baseY - hh * 0.55, cx, baseY - hh);
  ctx.quadraticCurveTo(cx + ww * 0.64, baseY - hh * 0.55, cx + ww / 2, baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,253,225,0.75)';
  ctx.beginPath();
  ctx.moveTo(cx - ww * 0.22, baseY);
  ctx.quadraticCurveTo(cx - ww * 0.30, baseY - hh * 0.42, cx, baseY - hh * 0.64);
  ctx.quadraticCurveTo(cx + ww * 0.30, baseY - hh * 0.42, cx + ww * 0.22, baseY);
  ctx.closePath(); ctx.fill();
}

function renderTool(canvas, tool, dt) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 104, h = canvas.clientHeight || TOOL_TOP;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, baseY = h - 5;
  const on = !!tool.on;
  tool.t = (tool.t || 0) + dt;
  const flick = 0.88 + 0.12 * Math.sin(tool.t * 9.3) + 0.06 * Math.sin(tool.t * 21.7);
  // 台面上的影子
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.beginPath(); ctx.ellipse(cx, baseY + 2, w * 0.36, 4.5, 0, 0, 6.283); ctx.fill();

  if (tool.hid === 'lamp') {
    const bh = h * 0.46, bw = w * 0.58, tw = w * 0.28;
    ctx.beginPath();                                     // 玻璃灯体
    ctx.moveTo(cx - bw / 2, baseY);
    ctx.lineTo(cx + bw / 2, baseY);
    ctx.lineTo(cx + tw / 2, baseY - bh);
    ctx.lineTo(cx - tw / 2, baseY - bh);
    ctx.closePath();
    const lg = ctx.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0);
    lg.addColorStop(0, 'rgba(190,225,245,0.32)'); lg.addColorStop(0.45, 'rgba(225,242,252,0.10)');
    lg.addColorStop(1, 'rgba(170,210,235,0.28)');
    ctx.fillStyle = lg; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(150,215,235,0.28)';            // 乙醇（约半瓶）
    ctx.fillRect(cx - bw / 2, baseY - bh * 0.52, bw, bh * 0.52);
    ctx.restore();
    ctx.strokeStyle = 'rgba(200,232,248,0.62)'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#8b939c';                           // 灯芯座
    ctx.fillRect(cx - tw / 2 - 2, baseY - bh - 7, tw + 4, 8);
    ctx.strokeStyle = '#cdbb9c'; ctx.lineWidth = 2.2;    // 灯芯
    ctx.beginPath(); ctx.moveTo(cx, baseY - bh - 6); ctx.lineTo(cx, baseY - bh - 13); ctx.stroke();
    if (on) flame(ctx, cx, baseY - bh - 11, h * 0.62 * flick, w * 0.24, [255, 235, 170], [255, 150, 40]);
  } else if (tool.hid === 'bunsen') {
    ctx.fillStyle = '#6f7883';                           // 底座
    ctx.beginPath(); ctx.ellipse(cx, baseY - 3, w * 0.34, 7, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#7d8791';
    ctx.fillRect(cx - w * 0.30, baseY - 5, w * 0.60, 6);
    const th = h * 0.44, tw2 = w * 0.17;
    const tg = ctx.createLinearGradient(cx - tw2, 0, cx + tw2, 0);
    tg.addColorStop(0, '#5c646d'); tg.addColorStop(0.35, '#9aa4ad'); tg.addColorStop(1, '#5c646d');
    ctx.fillStyle = tg; ctx.fillRect(cx - tw2 / 2, baseY - 5 - th, tw2, th);
    ctx.fillStyle = '#3a424a';                           // 进气孔
    for (let i = 0; i < 3; i++) ctx.fillRect(cx - tw2 / 2 - 1, baseY - 5 - th + 8 + i * 6, tw2 + 2, 2.4);
    if (on) {
      flame(ctx, cx, baseY - 5 - th + 1, h * 0.66 * flick, w * 0.20, [235, 246, 255], [90, 150, 255]);
      ctx.fillStyle = 'rgba(255,180,90,0.35)';
      ctx.beginPath(); ctx.arc(cx, baseY - 5 - th - 2, 3.6, 0, 6.283); ctx.fill();
    }
  } else {                                               // 电热板
    const pw = w * 0.78, ph = h * 0.17, py = baseY - ph - 6;
    ctx.fillStyle = '#2f3841';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - pw / 2, py, pw, ph, 3) : ctx.rect(cx - pw / 2, py, pw, ph); ctx.fill();
    ctx.fillStyle = on ? 'rgba(255,90,40,' + (0.55 + 0.25 * flick) + ')' : '#20272e';
    ctx.beginPath(); ctx.ellipse(cx, py + ph / 2, pw * 0.40, ph * 0.42, 0, 0, 6.283); ctx.fill();
    if (on) {
      ctx.strokeStyle = 'rgba(255,190,110,0.75)'; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(cx + i * pw * 0.13, py + 2); ctx.lineTo(cx + i * pw * 0.13, py + ph - 2); ctx.stroke(); }
    }
    ctx.fillStyle = '#4a555f';                           // 支柱 + 底座
    ctx.fillRect(cx - w * 0.06, py + ph, w * 0.12, baseY - py - ph - 4);
    ctx.fillRect(cx - w * 0.30, baseY - 4, w * 0.60, 5);
    ctx.fillStyle = on ? '#ff6a3d' : '#3b444d';          // 指示灯
    ctx.beginPath(); ctx.arc(cx + w * 0.26, baseY - 8, 2.6, 0, 6.283); ctx.fill();
  }
}

/* ============================================================================
 * 07-app.js —— 界面与主循环：周期表、试剂架、工作台、操作、日志、引导、存档
 * ==========================================================================*/

const $ = (s) => document.querySelector(s);
const mk = (tag, cls, html) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; };
const K2C = (k) => Math.round((k - 273.15) * 10) / 10;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* ------------------------------- 周期表面板 ------------------------------- */
function buildPtable() {
  const g = $('#ptable'); if (!g) return;
  g.innerHTML = '';
  ELEMENTS.forEach((e) => {
    const d = mk('button', 'el', '<b>' + e.sym + '</b><i>' + e.z + '</i>');
    d.dataset.z = e.z; d.dataset.sym = e.sym;      // 手把手引导要靠它找到"该点哪个元素"（单质只在周期表上，试剂架里没有）
    d.title = e.cn + ' ' + e.sym + '｜' + e.catName;
    d.style.gridColumn = e.group; d.style.gridRow = e.period <= 7 ? e.period : e.period === 8 ? 9 : 10;
    d.style.borderColor = e.color; d.style.background = 'color-mix(in srgb, ' + e.color + ' 16%, transparent)';
    d.addEventListener('click', () => showElement(e));
    g.appendChild(d);
  });
}
function showElement(e) {
  const box = $('#elemInfo');
  box.dataset.sym = e.sym;                          // 记住"现在摊开的是哪个元素"，引导靠它判断该点格子还是该点「取用」
  box.innerHTML = '<h4>' + e.z + ' 号 · ' + e.cn + ' <span class="sym">' + e.sym + '</span></h4>'
    + '<div class="kv"><span>类别</span><b>' + e.catName + '</b></div>'
    + '<div class="kv"><span>原子量</span><b>' + e.mass + ' g/mol</b></div>'
    + '<div class="kv"><span>密度</span><b>' + (e.density != null ? e.density + (e.st === 'g' ? ' g/L' : ' g/cm³') : '—') + '</b></div>'
    + '<div class="kv"><span>熔点</span><b>' + (e.mp != null ? e.mp + ' K（' + K2C(e.mp) + '°C）' : '—') + '</b></div>'
    + '<div class="kv"><span>沸点</span><b>' + (e.bp != null ? e.bp + ' K（' + K2C(e.bp) + '°C）' : '—') + '</b></div>'
    + '<div class="kv"><span>电负性</span><b>' + (e.en != null ? e.en : '—') + '</b></div>'
    + '<div class="kv"><span>常见氧化态</span><b>' + e.ox.join(' / ') + '</b></div>'
    + '<div class="kv"><span>外观</span><b>' + (e.look || '—') + '</b></div>'
    + (e.hazard.length ? '<div class="hazard">⚠ ' + e.hazard.join('、') + '</div>' : '')
    + '<button class="primary" id="takeElem">取用 5 g ' + e.cn + '（' + (ELEM_REAGENT.get(e.sym) || e.sym) + '）</button>';
  $('#takeElem').addEventListener('click', () => askAmount(ELEM_REAGENT.get(e.sym) || e.sym, 5, (v, u) => {
    const app = selectedApp();
    if (!app) return toast('先添加一个容器并选中它');
    const r = addReagent(app.uid, ELEM_REAGENT.get(e.sym) || e.sym, v, u);
    toast(r.ok ? '已加入 ' + e.cn : r.why);

}

/* -------------------------------- 试剂架 --------------------------------- */
const CAT_NAME = { acid: '酸', base: '碱', salt: '盐', oxide: '氧化物', element: '单质', organic: '有机物', indicator: '指示剂', solvent: '溶剂' };
function buildShelf() {
  const box = $('#shelf'); if (!box) return;
  const cats = ['acid', 'base', 'salt', 'oxide', 'element', 'organic', 'indicator', 'solvent'];
  const q = ($('#shelfSearch') || {}).value || '';
  box.innerHTML = '';
  cats.forEach((cat) => {
    const list = SUBSTANCES.filter((s) => s.cat === cat && !s.isElem)
      .filter((s) => !q || s.name.includes(q) || s.formula.toLowerCase().includes(q.toLowerCase())
        || (s.alias || '').includes(q));
    if (!list.length) return;
    const sec = mk('div', 'shelfsec', '<h5>' + CAT_NAME[cat] + '</h5>');
    const wrap = mk('div', 'chips');
    list.forEach((s) => {
      // 试剂卡片：化学式 + 化学名称 + 俗名（教材里说的"纯碱/小苏打/大理石"都能对上）
      const b = mk('button', 'chip', '<b>' + s.formula + '</b><span>' + s.name + '</span>'
        + (s.alias ? '<i class="alias">俗名 ' + s.alias + '</i>' : ''));
      b.title = subFull(s.formula);                 // 悬停看完整交代：学名（化学式，类别）＋俗名
      b.dataset.sub = s.formula;                    // 手把手引导要靠它找到"该点哪个试剂"
      b.style.borderColor = 'color-mix(in srgb, ' + s.color + ' 55%, #4a6a80)';
      b.addEventListener('click', () => {
        const isLiq = s.st === 'l' || s.st === 'aq' || s.formula === 'H2O';
        askAmount(s.formula, isLiq ? 50 : 5, (v, u) => {
          const app = selectedApp();
          if (!app) return toast('先添加一个容器并选中它');
          const r = addReagent(app.uid, s.formula, v, u);
          toast(r.ok ? '已加入 ' + s.name : r.why);
        }, isLiq ? 'mL' : 'g');
      });
      wrap.appendChild(b);
    });
    sec.appendChild(wrap); box.appendChild(sec);
  });
  // 单质（118 种元素）单独一格
  const sec = mk('div', 'shelfsec', '<h5>元素单质（' + ELEMENTS.length + ' 种，点周期表取用）</h5>');
  sec.appendChild(mk('div', 'hint', '周期表里点任一元素 → 取用该单质'));
  box.appendChild(sec);
}

/* ------------------------------- 取用量弹窗 ------------------------------- */
function askAmount(formula, def, cb, unit) {
  const s = subOf(formula);
  const g = guideAmountFor(formula, def, unit);     // 手把手：这一步正好要加它 → 用量按步骤填好（默认 50 mL 过不了要 80 mL 的步骤）
  def = g.v; unit = g.u;
  const isLiq = unit === 'mL' || s.st === 'l' || s.st === 'aq' || formula === 'H2O';
  const m = $('#modal');
  m.innerHTML = '<div class="card"><h4>' + s.name + '（' + formula + '）</h4>'
    + '<div class="subfull">' + subFull(s.formula) + (s.note ? '<br>' + s.note : '') + '</div>'
    + (g.used ? '<div class="ghint">🎓 这一步需要 ' + def + ' ' + (isLiq ? 'mL' : 'g') + ' —— 已按步骤填好，直接点「加入」</div>' : '')
    + '<div class="kv"><span>摩尔质量</span><b>' + s.M + ' g/mol</b></div>'
    + '<div class="kv"><span>溶解度</span><b>' + solText(s) + '</b></div>'
    + (s.dHf ? '<div class="kv"><span>ΔfH°</span><b>' + s.dHf.v + ' kJ/mol' + (s.dHf.est ? '（估算）' : '') + '</b></div>' : '')
    + '<label>用量 <input id="amtVal" type="number" value="' + def + '" min="0.01" step="0.5"></label>'
    + '<label>单位 <select id="amtUnit">'
    + '<option value="g">克 g</option><option value="mL">毫升 mL</option><option value="mol">摩尔 mol</option>'
    + '</select></label>'
    + '<div class="row"><button class="primary" id="amtOk">加入 ' + (selectedApp() ? selectedApp().def.name : '（未选容器）') + '</button>'
    + '<button id="amtCancel">取消</button></div></div>';
  m.classList.add('show');
  $('#amtUnit').value = isLiq ? 'mL' : 'g';
  $('#amtOk').addEventListener('click', () => {
    const v = Number($('#amtVal').value), u = $('#amtUnit').value;
    m.classList.remove('show'); cb(v, u);
  });
  $('#amtCancel').addEventListener('click', () => m.classList.remove('show'));
  m.addEventListener('click', (ev) => { if (ev.target === m) m.classList.remove('show'); });
}
const solText = (s) => s.solubility === -1 ? '不溶' : s.solubility === -2 ? '微溶' : s.solubility === Infinity ? '互溶' : s.solubility == null ? '—' : s.solubility + ' g/100g 水';

/* ------------------------------- 工作台 --------------------------------- */
let benchSig = '';
let taskSig = '';
function benchSignature() {
  return Lab.apps.map((a) => a.uid + ':' + a.def.id + '@' + Math.round(a.x) + ',' + Math.round(a.y || 0) + '/' + (a.standOn || '-')
    + (Lab.selected === a.uid ? '*' : '') + (a.broken ? 'B' : '') + (a.acidConc === 'conc' ? 'C' : '')).join('|')
    + '#' + Lab.tools.map((t) => t.uid + ':' + t.hid + '@' + Math.round(t.x) + '/' + Math.round(t.y || 0) + (t.on ? '!' : '')).join('|');
}
const benchEl = () => document.getElementById('bench');
const itemPos = (x, w) => Math.max(2, x);            // 台面够长：不压缩位置，超出就横向滚动

function renderBench(force) {
  const sig = benchSignature();
  if (!force && sig === benchSig) return;
  benchSig = sig;
  const bench = benchEl(); bench.innerHTML = '';
  if (!Lab.apps.length && !Lab.tools.length) {
    bench.appendChild(mk('div', 'empty', '这是一大片空地 —— 上面点「放一个」把容器和酒精灯摆上台面'));
    return;
  }
  assignZ();
  Lab.tools.forEach((t) => { bench.appendChild(mkToolCard(t)); });     // 器材在下层，容器在上层
  Lab.apps.forEach((app) => { bench.appendChild(mkAppCard(app)); });
  layoutRig();                                                     // 架上去的容器：按器材"真实"高度抬升 + 不让它被顶出台面
  if (Lab.scrollEnd) { Lab.scrollEnd = false; ensureVisible(); }   // 只有"刚摆上来"才滚到新卡片，别跟引导抢滚动
  updateHeatStatus();
}

/** 架上去的容器该抬多高 —— 量器材卡片的**实际**高度（写死常数会算错，卡片会压住器材的火焰和标题）。
 *  两条约束：
 *    ① 抬升量不许把容器的顶推出台面（矮窗口里宁可视觉上重叠一点，也不能看不见、点不到）
 *    ② 抬升量要留着器材自己的按钮行露在下面（否则「点燃 / 架上来 / 收走」被容器盖住） */
function layoutRig() {
  const bench = benchEl(); if (!bench) return;
  const bh = bench.clientHeight || 0;
  Lab.apps.forEach((app) => {
    const card = bench.querySelector('.appcard[data-uid="' + app.uid + '"]'); if (!card) return;
    const t = standOf(app);
    if (!t) { card.style.bottom = (app.y || 0) + 'px'; return; }
    const tc = bench.querySelector('.toolcard[data-uid="' + t.uid + '"]');
    const th = (tc && tc.offsetHeight) || TOOL_TOP;
    const ah = card.offsetHeight || 0;
    const want = th - 4;
    let lift = want;
    if (bh && ah) lift = Math.max(0, Math.min(lift, bh - ah - 6));      // ① 顶不出台面
    card.style.bottom = (lift + (app.y || 0)) + 'px';
    card.classList.toggle('rigtight', lift < want - 2);                 // 保底压缩了 → 标一下，样式上给个暗示
  });
}

/** 台面比窗口宽时，把最右边（刚摆的）那张卡片滚进视野 */
function ensureVisible() {
  const bench = benchEl(); if (!bench) return;
  let right = 0;
  Lab.tools.concat(Lab.apps).forEach((it) => { right = Math.max(right, it.x + (it.kind === 'heat' ? ITEM_W.heat : ITEM_W.app)); });
  if (right > bench.scrollLeft + bench.clientWidth - 8) bench.scrollLeft = right - bench.clientWidth + 16;
}

/** 台面层级：按"摆放先后"排成 10..21（永远压在弹窗 50 / 引导 55 / 教程 60 之下） */
function assignZ() {
  Lab.tools.concat(Lab.apps).sort((a, b) => (a.z || 0) - (b.z || 0)).forEach((it, i) => { it._zi = 10 + i; });
}

/** 容器卡片：底边 = 台面；架在器材上时抬高到器材顶 */
function mkAppCard(app) {
  const t = standOf(app);
  const card = mk('div', 'appcard' + (Lab.selected === app.uid ? ' sel' : '') + (app.broken ? ' broken' : '') + (t ? ' onrig' : ''));
  card.dataset.uid = app.uid;
  card.style.left = itemPos(app.x, ITEM_W.app) + 'px';
  card.style.bottom = ((t ? TOOL_TOP - 4 : 0) + (app.y || 0)) + 'px';
  card.style.zIndex = String(app._zi || 12);
  card.innerHTML = '<div class="apphead dragbar" title="按住这里可拖动；拖到酒精灯上面就架上去"><b>' + app.def.name + '</b><span class="uid">' + app.uid + '</span>'
    + '<span class="cap">' + app.def.cap + ' mL</span></div>'
    + '<canvas class="vessel"></canvas>'
    + '<div class="readouts"></div>'
    + '<div class="ops">'
    + '<button data-op="ignite">🔥 点燃</button><button data-op="stir">🌀 搅拌</button>'
    + '<button data-op="measure">📏 测量</button><button data-op="clear">🧼 倒空</button><button data-op="del">✕ 移除</button>'
    + '</div><div class="ops ops2">'
    + '<button data-op="pour">🫗 倾倒</button><button data-op="filter">🧻 过滤</button>'
    + '<button data-op="gas">💨 导气</button><button data-op="power"' + (app.elec ? ' class="on"' : '') + '>⚡ 通电</button>'
    + '</div><div class="ops ops3">'
    + '<button data-op="conc"' + (app.acidConc === 'conc' ? ' class="on"' : '') + '>🧪 酸浓度：' + (app.acidConc === 'conc' ? '浓' : '稀') + '</button>'
    + (t ? '<button data-op="unmount">⬇ 放回台面</button>' : '')
    + '</div><div class="heatrow"></div>';
  card.addEventListener('click', (ev) => {
    if (ev.target.closest('button')) return;
    Lab.selected = app.uid; renderBench(true); updateReadouts();
  });
  card.querySelectorAll('.ops button').forEach((b) => b.addEventListener('click', (ev) => { ev.stopPropagation(); opClick(app, b.dataset.op); }));
  attachDrag(card, app, 'app');
  app.canvas = card.querySelector('canvas');
  return card;
}

/** 器材卡片：一件实物（酒精灯/本生灯/电热板），自己有点燃开关 */
function mkToolCard(t) {
  const card = mk('div', 'toolcard' + (t.on ? ' lit' : ''));
  card.dataset.uid = t.uid; card.dataset.hid = t.hid;
  card.style.left = itemPos(t.x, ITEM_W.heat) + 'px';
  card.style.bottom = (t.y || 0) + 'px';
  card.style.zIndex = String(t._zi || 11);
  const isHeat = t.kind === 'heat', isMeter = t.kind === 'meter', isGauze = t.hid === 'gauze';
  const sel = Lab.apps.find((a) => a.uid === Lab.selected) || Lab.apps[0] || null;
  const attached = isMeter && t.app ? Lab.apps.find((a) => a.uid === t.app) : null;
  const meta = isHeat ? t.def.icon + ' ' + t.def.power + ' W · ≤' + K2C(t.def.flameT) + ' °C'
    : t.def.icon + ' ' + (isMeter ? '测量：' + ({ temp: '温度', vol: '体积', ph: 'pH', mass: '质量' }[t.def.measures] || '') : '辅助器材');
  const ops = isHeat
    ? '<button data-op="light"' + (t.on ? ' class="on"' : '') + '>' + (t.on ? '💨 熄灭' : '🔥 点燃') + '</button>'
      + '<button data-op="mount">⬆ 架上来</button><button data-op="deltool">✕ 收走</button>'
    : isMeter
      ? (attached
        ? '<button data-op="unmount" class="on">⏏ 从 ' + attached.def.name + ' 拔出</button><button data-op="deltool">✕ 收走</button>'
        : '<button data-op="mount"' + (sel ? '' : ' disabled') + '>⬇ 插进' + (sel ? sel.def.name : '（先加容器）') + '</button><button data-op="deltool">✕ 收走</button>')
      : isGauze
        ? (t.app ? '<button data-op="unmount" class="on">⏏ 从 ' + ((Lab.apps.find((a) => a.uid === t.app) || {}).def || {}).name + ' 拿开</button><button data-op="deltool">✕ 收走</button>'
          : '<button data-op="mount"' + (sel ? '' : ' disabled') + '>⬇ 垫到' + (sel ? sel.def.name + '下' : '（先加容器）') + '</button><button data-op="deltool">✕ 收走</button>')
        : '<button data-op="deltool">✕ 收走</button>';
  card.innerHTML = '<div class="toolhead dragbar" title="按住这里拖动这件器材"><b>' + t.def.icon + ' ' + t.def.name + '</b><span class="uid">' + t.uid + '</span></div>'
    + '<canvas class="toolcv"></canvas>'
    + '<div class="ops">' + ops + '</div>'
    + '<div class="toolmeta" title="' + t.def.name + '：' + (t.def.desc || (t.def.power + ' W，火焰最高 ' + K2C(t.def.flameT) + ' °C，燃料 ' + t.def.fuel)) + '">'
    + meta + '</div>';
  card.querySelectorAll('.ops button').forEach((b) => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (b.dataset.op === 'light') { lightTool(t.uid, !t.on); renderBench(true); updateReadouts(); }
    else if (b.dataset.op === 'unmount') { placeOn(t.app, null); toast(t.def.name + ' 已拿开'); renderBench(true); updateReadouts(); }
    else if (b.dataset.op === 'mount') {
      if (t.kind !== 'heat') {                                   // 测量/辅助器材：认"当前选中的容器"
        const app = Lab.apps.find((a) => a.uid === Lab.selected) || Lab.apps[0];
        if (!app) { toast('先在工作台上加一个容器'); return; }
        const r = placeOn(app.uid, t.uid);
        if (r.ok) {
          Lab.selected = app.uid;
          toast(t.hid === 'gauze' ? '石棉网垫在 ' + app.def.name + ' 下面了 —— 现在可以用明火加热'
            : t.def.name + ' 插进 ' + app.def.name + ' 了 —— 点容器的「📏 测量」读数');
        } else toast(r.why);
        renderBench(true); updateReadouts(); return;
      }
      const app = mountTarget(t);
      if (!app) { toast('台面上没有可以架上去的容器（都架着了？先加一个仪器）'); return; }
      const r = placeOn(app.uid, t.uid);
      if (r.ok) { Lab.selected = app.uid; toast('把 ' + app.def.name + ' 架到 ' + t.def.name + ' 上了' + (t.on ? '，正在加热' : '，记得点着它')); }
      else toast(r.why);
      renderBench(true); updateReadouts();
    }
    else { delTool(t.uid); renderBench(true); updateReadouts(); }
  }));
  card.addEventListener('click', (ev) => {
    if (ev.target.closest('button')) return;
    const a = occupantOf(t); if (a) { Lab.selected = a.uid; renderBench(true); updateReadouts(); }
  });
  attachDrag(card, t, 'heat');
  t.canvas = card.querySelector('canvas');
  return card;
}

/* ------------------------------ 拖拽摆放 -------------------------------- */
function attachDrag(card, item, kind) {
  const bar = card.querySelector('.dragbar'); if (!bar) return;
  bar.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault(); ev.stopPropagation();
    const bench = benchEl();
    const bw = Math.max(160, bench.clientWidth);
    const w = kind === 'heat' ? ITEM_W.heat : ITEM_W.app;
    const startX = ev.clientX, origX = item.x;
    let moved = false;
    bar.setPointerCapture(ev.pointerId);
    card.classList.add('dragging');
    const move = (e) => {
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 2) moved = true;
      item.x = Math.max(2, Math.min(bw - w - 2, origX + dx));
      card.style.left = item.x + 'px';
      if (kind === 'app') {
        const near = nearestTool(item);
        document.querySelectorAll('.toolcard').forEach((c) => c.classList.toggle('over', !!near && c.dataset.uid === near.uid));
      }
    };
    const up = () => {
      bar.removeEventListener('pointermove', move);
      bar.removeEventListener('pointerup', up);
      card.classList.remove('dragging');
      document.querySelectorAll('.toolcard.over').forEach((c) => c.classList.remove('over'));
      if (!moved) {                                  // 只是点了一下 = 选中
        if (kind === 'app') Lab.selected = item.uid;
        else { const a = occupantOf(item); if (a) Lab.selected = a.uid; }
        renderBench(true); updateReadouts(); return;
      }
      if (kind === 'app') dropApp(item); else dropTool(item);
    };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
}

/** 离这个容器最近的、还没被占用的器材（横向距离够近就算"放上去"） */
function nearestTool(app) {
  const maxD = 78; let best = null, bd = 1e9;
  Lab.tools.forEach((t) => {
    const d = Math.abs((t.x + ITEM_W.heat / 2) - (app.x + ITEM_W.app / 2));
    if (d < maxD && d < bd && !occupantOf(t, app)) { bd = d; best = t; }
  });
  return best;
}
function dropApp(app) {
  const t = nearestTool(app);
  if (t) {
    const r = placeOn(app.uid, t.uid);
    if (r.ok) toast('把 ' + app.def.name + ' 架到 ' + t.def.name + ' 上了' + (t.on ? '，正在加热' : '，记得点着它'));
    else toast(r.why);
  } else if (app.standOn) { placeOn(app.uid, null); toast(app.def.name + ' 放回台面'); }
  else Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + app.def.name + ' ' + app.uid + ' 挪到台面另一处' });
  renderBench(true); updateReadouts();
}
function dropTool(t) {
  Lab.apps.forEach((a) => { if (a.standOn === t.uid) a.x = t.x; });     // 架在它上面的容器跟着走
  renderBench(true); updateReadouts();
}

/** 点器材上「⬆ 架上来」时，架谁上去：优先当前选中的容器，否则挑第一个空着的 */
function mountTarget(t) {
  const free = (a) => a && !a.broken && (!a.standOn || a.standOn === t.uid) && !occupantOf(t, a);
  const sel = selectedApp();
  if (free(sel)) return sel;
  return Lab.apps.find((a) => free(a)) || null;
}

/** 卡片底部那行"现在被什么加热"的状态 */
function updateHeatStatus() {
  Lab.apps.forEach((app) => {
    const card = document.querySelector('.appcard[data-uid="' + app.uid + '"]'); if (!card) return;
    const row = card.querySelector('.heatrow'); if (!row) return;
    const t = standOf(app);
    const txt = !t
      ? '<span class="lbl">未加热</span><i>把酒精灯等器材拖到它下面就能加热</i>'
      : (t.on
        ? '<span class="lbl hot">' + t.def.icon + ' 正在用 ' + t.def.name + ' 加热</span><i>' + t.def.power + 'W · 火焰 ' + K2C(t.def.flameT) + '°C</i>'
        : '<span class="lbl">' + t.def.icon + ' 架在 ' + t.def.name + ' ' + t.uid + ' 上（还没点着）</span><i>点器材上的「🔥 点燃」</i>');
    if (row._sig !== txt) { row.innerHTML = txt; row._sig = txt; }
  });
}

function opClick(app, op) {
  Lab.selected = app.uid;
  if (op === 'ignite') ignite(app.uid);
  else if (op === 'stir') { stir(app.uid); renderBench(true); }
  else if (op === 'clear') clearApp(app.uid);
  else if (op === 'del') { removeApp(app.uid); renderBench(true); }
  else if (op === 'measure') measure(app);
  else if (op === 'conc') { app.acidConc = app.acidConc === 'conc' ? 'dil' : 'conc'; renderBench(true); }
  else if (op === 'unmount') { placeOn(app.uid, null); toast(app.def.name + ' 放回台面'); renderBench(true); }
  else if (op === 'power') { const r = setPower(app.uid, !app.elec); if (!r.ok) toast(r.why); renderBench(true); }
  else if (op === 'pour' || op === 'filter' || op === 'gas') askTarget(app, op);
  updateReadouts();
}

/** 选目标容器的小对话框（倾倒 / 过滤 / 导气共用） */
const OP_INFO = {
  pour: { title: '🫗 倾倒', verb: '把液体倒入', why: '把液体（含溶质）转移到另一个容器' },
  filter: { title: '🧻 过滤', verb: '把滤液滤进', why: '不溶固体留在原容器，液体滤到另一个容器（粗盐提纯核心操作）' },
  gas: { title: '💨 导气', verb: '把气体通入', why: '用导管把气相里的气体通到另一个容器（检验 CO₂、收集 O₂）' },
};
/** 关掉任何打开着的弹窗（用量弹窗 / 目标选择弹窗）—— 键盘 Esc、点遮罩、脚本清场都走它 */
function closeModal() {
  const m = $('#modal'); if (!m) return false;
  const wasOpen = m.classList.contains('show');
  m.classList.remove('show'); m.innerHTML = '';
  return wasOpen;
}
function askTarget(app, op) {
  const info = OP_INFO[op];
  const others = Lab.apps.filter((a) => a !== app && !a.broken);
  const m = $('#modal');
  m.innerHTML = '<div class="card"><h4>' + info.title + '　' + app.def.name + ' ' + app.uid + '</h4>'
    + '<p class="hint">' + info.why + '</p>'
    + '<div class="targetlist">'
    + (others.length
      ? others.map((t) => '<button class="tgt" data-uid="' + t.uid + '">' + info.verb + '：' + t.def.name + ' ' + t.uid + '（' + t.def.cap + ' mL）</button>').join('')
      : '<span class="hint">工作台上只有一个容器 —— 先在上面加一个仪器（烧杯/试管/蒸发皿…）再说</span>')
    + '</div><div class="row"><button id="tgtCancel">取消</button></div></div>';
  m.classList.add('show');
  const close = () => { m.classList.remove('show'); m.innerHTML = ''; };
  m.querySelectorAll('.tgt').forEach((b) => b.addEventListener('click', () => {
    const to = b.dataset.uid;
    const r = op === 'pour' ? pour(app.uid, to) : op === 'filter' ? filterApp(app.uid, to) : feedGas(app.uid, to);
    close();
    if (!r.ok) toast(r.why || '这个操作做不了');
    else { toast(info.title + '完成'); Lab.dirtySave = true; }
    updateReadouts(); flushLog();
  }));
  $('#tgtCancel').addEventListener('click', close);
}
function measure(app) {
  const r = measureAll(app);
  if (!r.ok) { toast('还测不了：' + (r.miss[0] || '')); pushMsg('📏 测量：' + r.miss.join(' ／ ')); return r; }
  toast('测得 —— ' + r.got.join('　'));
  if (r.miss.length) pushMsg('还有量不到的数：' + r.miss.join(' ／ '));
  return r;
}

/* ------------------------------ 读数刷新 --------------------------------- */
function updateReadouts() {
  Lab.apps.forEach((app) => {
    const card = document.querySelector('.appcard[data-uid="' + app.uid + '"]');
    if (!card) return;
    card.classList.toggle('sel', Lab.selected === app.uid);
    const ro = card.querySelector('.readouts');
    const ph = computePH(app);
    const liq = app.contents.filter((c) => c.dissolved);
    const solid = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
    const gas = app.gasBubbles.concat(app.contents.filter((c) => c.dissolved && subOf(c.formula).st === 'g'));
    const cTxt = (n) => (n >= 0.01 ? round(n, 3) : n.toExponential(1));
    const cNm = (f) => '<b class="cnm" title="' + esc(subFull(f)) + '">' + esc(subName(f)) + '</b> <code>' + esc(f) + '</code>';
    /* 读数不再是白送的：容器上只写"测没测过"，数值要拿量器量（温度计/量筒/pH 计/天平） */
    const mrow = (icon, label, kind, need) => {
      const m = app.meas && app.meas[kind];
      const fresh = m && m.sig === appSig(app);
      const has = !!meterOn(app, kind) || (kind === 'mass' && !!meterOnBench(kind));
      return '<span class="mi"><i>' + icon + '</i>' + label + ' '
        + (m ? '<b class="' + (fresh ? 'mv' : 'stale') + '">' + esc(fresh ? m.text : m.text + '（需重测）') + '</b>'
          : '<b class="un">未测</b>')
        + (has ? '' : '<u class="need" title="' + esc(need) + '">' + esc(need) + '</u>') + '</span>';
    };
    const html = '<div class="ro meas">' + mrow('🌡', '温度', 'temp', '需温度计')
      + mrow('⚖', '质量', 'mass', '需天平')
      + mrow('📐', '体积', 'vol', '需量筒')
      + mrow('🖊', 'pH', 'ph', '需 pH 计') + '</div>'
      + (liq.filter((c) => c.formula !== 'H2O').length || waterMol(app) > 1e-9
        ? '<div class="contents"><i>溶液：</i>' + (waterMol(app) > 1e-9 ? '水（溶剂）　' : '')
          + liq.filter((c) => c.formula !== 'H2O').map((c) => cNm(c.formula)).join('，') + '</div>' : '')
      + (solid.length ? '<div class="contents"><i>固体：</i>' + solid.map((c) => cNm(c.formula) + (c.dissolved ? '' : '（未溶）')).join('，') + '</div>' : '')
      + (gas.length ? '<div class="contents gas"><i>气体：</i>' + gas.map((g) => cNm(g.f || g.formula)).join('，') + '</div>' : '')
      + (app.dryWarn && !app.broken ? '<div class="warn">⚠ 干烧！容器里没有液体了</div>' : '');
    if (app.broken) {
      card.classList.add('broken');
      const bh = '<div class="warn big">❌ 已炸裂：' + esc(app.brokenWhy || '受热/骤冷超过玻璃承受极限') + '</div>'
        + '<div class="contents"><i>提示：</i>内容物已洒掉。玻璃器皿不能干烧，也不能趁热倒冷水 —— 点「✕ 移除」清理碎片</div>';
      if (ro._sig !== bh) { ro.innerHTML = bh; ro._sig = bh; }
      return;
    }
    card.classList.remove('broken');
    if (ro._sig !== html) { ro.innerHTML = html; ro._sig = html; }
    card.querySelectorAll('.ops button').forEach((b) => {
      if (b.dataset.op === 'stir') b.classList.toggle('on', !!app.stirrerOn);
      if (b.dataset.op === 'conc') b.classList.toggle('on', app.acidConc === 'conc');
    });
  });
  updateHeatStatus();
  $('#apparatusCount').textContent = Lab.apps.length + ' / 6';
  const tc = $('#toolCount'); if (tc) tc.textContent = Lab.tools.length + ' / 6';
}

/* -------------------------------- 日志 --------------------------------- */
let logShown = 0;
const ICON = { rxn: '🧪', add: '➕', measure: '📏', warn: '⚠', task: '✅', ignite: '🔥', stir: '🌀', clear: '🧼', pour: '🫗' };
function flushLog() {
  const box = $('#log');
  if (logShown > Lab.log.length) { box.innerHTML = ''; logShown = 0; }
  for (let i = logShown; i < Lab.log.length; i++) {
    const e = Lab.log[i];
    const d = mk('div', 'logrow ' + e.k);
    d.innerHTML = '<span class="ic">' + (ICON[e.k] || '·') + '</span><span class="tx">' + esc(e.text)
      + (e.note ? '<br><small>' + esc(e.note) + '</small>' : '') + '</span>';
    box.appendChild(d);
  }
  if (Lab.log.length > logShown) { box.scrollTop = box.scrollHeight; logShown = Lab.log.length; }
  $('#rxCount').textContent = Lab.discovered.size;
  $('#rxTotal').textContent = RXNS.length;
}

/* -------------------------------- 任务 --------------------------------- */
function renderTasks(force) {
  const sig = String(Lab.guideOn) + '|' + TASKS.map((t) => (Lab.taskDone[t.id] ? 1 : 0)).join('');
  if (!force && sig === taskSig) return;
  taskSig = sig;
  const box = $('#tasks');
  box.innerHTML = '<h4>新手引导 ' + (Lab.guideOn ? '' : '<small>（已关闭）</small>') + '</h4>';
  if (!Lab.guideOn) { box.appendChild(mk('div', 'hint', '引导已关闭：随便玩。想重新打开点右上角「引导」。')); return; }
  TASKS.forEach((t) => {
    const done = !!Lab.taskDone[t.id];
    box.appendChild(mk('div', 'task' + (done ? ' done' : ''), (done ? '✅ ' : '⬜ ') + t.text));
  });
  const done = TASKS.filter((t) => Lab.taskDone[t.id]).length;
  box.appendChild(mk('div', 'hint', '进度 ' + done + ' / ' + TASKS.length + (done === TASKS.length ? '　🎉 全部完成' : '')));
}

/* -------------------------------- 存档 --------------------------------- */
const SAVE_KEY = 'chemlab.v01';
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      guideOn: Lab.guideOn, taskDone: Lab.taskDone, discovered: [...Lab.discovered],
      apps: Lab.apps.map((a) => ({ def: a.def.id, b: a.broken ? 1 : 0, contents: a.contents.map((c) => ({ f: c.formula, m: c.mol, d: c.dissolved })) })),
    }));
  } catch (e) { /* file:// 下 localStorage 可能不可用，静默降级 */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const s = JSON.parse(raw);
    Lab.guideOn = s.guideOn !== false;
    Lab.taskDone = s.taskDone || {};
    (s.discovered || []).forEach((k) => Lab.discovered.add(k));
    (s.apps || []).slice(0, 3).forEach((a) => {
      const app = addApparatus(a.def); if (!app) return;
      if (a.b) breakVessel(app, '上次实验里炸裂的容器');
      (a.contents || []).forEach((c) => { if (subOf(c.f)) addContent(app, c.f, c.m, null, c.d); });
    });
    return true;
  } catch (e) { return false; }
}

/* -------------------------------- 提示 --------------------------------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ------------------------------- 主循环 -------------------------------- */
/** 时间倍率：物理一点没改，只是把同一段时间快点过完（蒸发/结晶这类真实验要等几分钟的步骤，调到 ×60 就能几秒看完） */
const SPEEDS = [1, 5, 20, 60];
let lastT = 0, acc = 0;
function frame(now) {
  const dtReal = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  acc += dtReal;
  const step = 1 / 60;
  const sp = Math.max(1, Math.min(SPEEDS[SPEEDS.length - 1], Lab.speed || 1));
  let guard = 0;
  while (acc >= step && guard++ < 4) { for (let k = 0; k < sp; k++) labStep(step); acc -= step; }
  Lab.apps.forEach((app) => { initViewState(app); if (app.canvas) renderApparatus(app.canvas, app, dtReal); });
  Lab.tools.forEach((t) => { if (t.canvas) renderTool(t.canvas, t, dtReal); });
  renderBench(false);
  updateReadouts(); flushLog(); renderTasks(); tutTick(dtReal);
  if (Lab.dirtySave || (Lab.time % 5) < 0.02) { save(); Lab.dirtySave = false; }
  requestAnimationFrame(frame);
}

/* -------------------------------- 启动 --------------------------------- */
function boot() {
  buildPtable(); buildShelf();
  if (!load()) { addApparatus('beaker'); addApparatus('tube'); }
  Lab.selected = Lab.apps.length ? Lab.apps[0].uid : null;
  renderBench(true);
  $('#addApparatus').innerHTML = APPARATUS.map((a) => '<button data-kind="' + a.id + '">' + a.name + '<i>' + a.cap + 'mL</i></button>').join('');
  $('#addApparatus').addEventListener('click', (ev) => {
    const k = ev.target.dataset.kind; if (!k) return;
    const app = addApparatus(k);
    if (app) { Lab.selected = app.uid; Lab.dirtySave = true; renderBench(true); shim(); }
    else toast('最多 6 个容器');
    updateReadouts();
  });
  const grp = (defs) => defs.map((h) => '<button data-hid="' + h.id + '" title="' + (h.desc || (h.power + 'W，最高 ' + K2C(h.flameT) + '°C，' + h.eff * 100 + '% 传热效率')) + '">'
    + h.icon + ' ' + h.name + '<i>' + (h.power ? h.power + 'W' : h.kind === 'meter' ? '测量' : '辅助') + '</i></button>').join('');
  $('#addTools').innerHTML = '<span class="tglbl">热源</span>' + grp(HEATERS)
    + '<span class="tglbl">测量</span>' + grp(METERS) + '<span class="tglbl">辅助</span>' + grp(ITEMS);
  $('#addTools').addEventListener('click', (ev) => {
    const hid = ev.target.closest('button') && ev.target.closest('button').dataset.hid; if (!hid) return;
    const t = addTool(hid);
    if (t) {
      toast(t.kind === 'heat' ? '台面上摆了 ' + t.def.name + ' —— 把容器拖到它上面，再点「🔥 点燃」'
        : '摆好了 ' + t.def.name + ' —— ' + (t.kind === 'meter' ? '选好容器，点它卡片上的「⬇ 插进…」，再点容器的「📏 测量」' : '点它卡片上的按钮把它放到容器上'));
      Lab.dirtySave = true; renderBench(true);
    }
    updateReadouts();
  });
  $('#guideToggle').addEventListener('click', () => {
    Lab.guideOn = !Lab.guideOn; renderTasks(); save();
    toast(Lab.guideOn ? '引导已打开' : '引导已关闭（纯沙盒）');
  });
  $('#speedBtn').addEventListener('click', () => {
    Lab.speed = SPEEDS[(SPEEDS.indexOf(Lab.speed || 1) + 1) % SPEEDS.length];
    $('#speedBtn').textContent = '⏩ 时间 ×' + Lab.speed;
    toast(Lab.speed === 1 ? '恢复实时' : '时间加速 ×' + Lab.speed + '（物理不变，只是快点过）');
  });
  $('#resetAll').addEventListener('click', () => {
    Lab.apps.length = 0; Lab.log.length = 0; Lab.discovered.clear(); Lab.taskDone = {}; logShown = 0;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
    tutReset();
    addApparatus('beaker'); addApparatus('tube'); renderBench(true); toast('已重置');
  });
  $('#shelfSearch').addEventListener('input', buildShelf);
  Lab.log.push({ k: 'warn', at: 0, text: '欢迎来到元素实验室：左边点元素取单质，右边点试剂加料，中间加热/点燃/搅拌，看现象。' });
  renderTasks(); updateReadouts();
  requestAnimationFrame((t) => { lastT = t; frame(t); });
}

/* ============================================================================
 * 08-tutorial.js —— 初中化学实验教程（人教九上 + 九下）
 *   22 个教材经典实验，每个实验配完整步骤 + 名称对照表；每一步都从真实状态自动判定
 *   （不是"点了就算"，而是真的检测容器里的物质、温度、气体、pH、过滤结果）
 * ==========================================================================*/

/* --------------------------- 判定工具（只看真实状态） ---------------------- */
const tutApp = (i) => appByUid(Lab.tut.uids[i] || '');
const tutUid = (i) => (Lab.tut.uids[i] || '');
const norm2 = (s) => s.split(',').map((x) => x.trim()).sort().join(',');
/* 注意：判定一律看"工作台当前状态"（容器是开始实验时新建的，所以天然是本次实验的净结果），
   不用 Lab.discovered —— 那是全局积累的，别的实验做过同样的反应会把它提前点亮。 */
const anyHas = (f, min) => Lab.apps.some((a) => a.contents.some((c) => c.formula === f && c.mol > (min || 1e-6)));
const appHas = (app, f, min) => !!app && app.contents.some((c) => c.formula === f && c.mol > (min || 1e-6));
const dissolved = (app, f, min) => !!app && app.contents.some((c) => c.formula === f && c.dissolved && c.mol > (min || 1e-6));
const solMol = (app, f) => (app ? app.contents.filter((c) => c.formula === f).reduce((s, c) => s + c.mol, 0) : 0);
const gasNew = (f, min) => Lab.apps.some((a) => (a.gasOut[f] || 0) + gasInApp(a, f) >= (min || 5e-4));
const gasHere = (f, min) => Lab.apps.some((a) => {
  const total = (a.gasOut[f] || 0) + gasInApp(a, f)          // 逸出记过账的 + 气相里的
    + a.contents.filter((c) => c.formula === f && c.mol > 0).reduce((s, c) => s + c.mol, 0);   // + 溶在水里的（SO₂、CO₂ 都会溶）
  return total >= (min || 1e-4);
});
const gasAt = (i, f) => { const a = tutApp(i); return a ? (a.gasOut[f] || 0) + gasInApp(a, f) : 0; };
const solidHere = (f, min) => Lab.apps.some((a) => a.contents.some((c) => c.formula === f && c.mol > (min || 1e-6))
  || (a.pptBy && (a.pptBy[f] || 0) > (min || 1e-6)));
const heldGas = (f, min) => Lab.apps.some((a) => gasInApp(a, f) >= (min || 1e-4));
const heatTo = (T, f) => Lab.apps.some((a) => a.temp >= T && (!f || appHas(a, f)));
const phOf = (f) => { const a = Lab.apps.find((x) => x.contents.some((c) => c.formula === f && c.mol > 1e-9)); return a ? computePH(a) : null; };
const opNew = (k) => (Lab[k] || 0) > (Lab.tut.base[k.replace('Count', '')] || 0);
const base = () => Lab.tut.base;

/** 对照表第 2 列：化学式 → 「化学名称 化学式（下标写法）」；仪器/概念写 — */
function termChem(f) {
  if (!f || f === '—') return '—';
  const s = subOf(f);
  if (!s) return '<code>' + prettyFormula(f) + '</code>';
  return s.name + ' <code>' + prettyFormula(s.formula) + '</code>'
    + (s.alias ? '<i class="tal">俗名 ' + s.alias + '</i>' : '');
}
/** 全局俗名对照表（教程面板里可展开） */
function aliasTableHTML() {
  const rows = SUBSTANCES.filter((s) => s.alias)
    .sort((a, b) => a.name.localeCompare(b.name, 'zh'))
    .map((s) => '<tr><td>' + s.name + '</td><td><code>' + prettyFormula(s.formula) + '</code></td><td>' + s.alias + '</td>'
      + '<td>' + (SUB_CAT_CN[s.cat] || s.cat) + '</td></tr>').join('');
  return '<details class="aliasbox"><summary>🔤 全部试剂名称对照表（' + SUBSTANCES.filter((s) => s.alias).length + ' 条俗名 → 化学名称）</summary>'
    + '<table class="termtab"><tr><th>化学名称</th><th>化学式</th><th>俗名 / 别名</th><th>类别</th></tr>' + rows + '</table></details>';
}

/* ------------------------------- 状态与存档 ------------------------------- */
Lab.tut = { id: null, sel: null, step: 0, done: {}, expDone: {}, pos: {}, mem: {}, uids: [], base: { rx: new Set(), measure: 0, filter: 0, pour: 0, gasFeed: 0, elec: 0 }, open: false };
const TUT_KEY = 'chemlab.tut.v01';
let tutThrottle = 0;

function tutSave() {
  try {
    localStorage.setItem(TUT_KEY, JSON.stringify({
      id: Lab.tut.id, step: Lab.tut.step, done: Lab.tut.done, expDone: Lab.tut.expDone, pos: Lab.tut.pos,
    }));
  } catch (e) { /* file:// 下可能不可用，静默降级 */ }
}
function tutLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(TUT_KEY) || 'null');
    if (s && s.id) {
      Lab.tut.id = s.id; Lab.tut.step = s.step || 0; Lab.tut.done = s.done || {};
      Lab.tut.expDone = s.expDone || {}; Lab.tut.pos = s.pos || {};
    }
  } catch (e) { }
}

function tutReset() {
  Lab.tut.id = null; Lab.tut.step = 0; Lab.tut.done = {}; Lab.tut.expDone = {}; Lab.tut.pos = {}; Lab.tut.mem = {}; Lab.tut.uids = [];
  try { localStorage.removeItem(TUT_KEY); } catch (e) { }
  tutRender(true);
}
const tutExp = (id) => TUT.find((e) => e.id === (id || Lab.tut.id)) || null;
/** 教程在进行中吗：面板打开（全览）或手把手引导条在跑 —— 两种模式都必须判定步骤 */
function tutActive() {
  return !!Lab.tut.open || !!(window.CHEM && typeof window.CHEM.guideOn === 'function' && window.CHEM.guideOn());
}

/** 开始/切换实验：清空工作台 → 摆好仪器 → 记录基线。
 *  restart=true 时连进度一起清掉；切换实验则保留各实验自己的进度（不会把做过的一步步弄丢） */
function tutStart(id, restart) {
  const exp = TUT.find((e) => e.id === id);
  if (!exp) return { ok: false, why: '没有这个实验' };
  if (restart) {
    exp.steps.forEach((_, i) => { delete Lab.tut.done[id + ':' + i]; });
    delete Lab.tut.expDone[id];
    Lab.tut.pos[id] = 0;
  }
  Lab.apps.length = 0; Lab.tools.length = 0; Lab.selected = null;   // 器材也要清：上个实验点着的酒精灯留在台面上，引导就会指着"一盏已经亮着的灯"让你去点燃，一点反而熄灭
  Lab.tut.uids = [];
  exp.bench.forEach((k) => { const a = addApparatus(k); Lab.tut.uids.push(a ? a.uid : ''); });
  Lab.tut.id = id;
  Lab.tut.step = restart ? 0 : (Lab.tut.pos[id] || 0);
  if (Lab.tut.step > exp.steps.length) Lab.tut.step = 0;
  Lab.tut.mem = {};
  Lab.tut.base = {
    rx: new Set(Lab.discovered), measure: Lab.measureCount || 0,
    filter: Lab.filterCount || 0, pour: Lab.pourCount || 0, gasFeed: Lab.gasFeedCount || 0, elec: Lab.elecCount || 0,
  };
  Lab.selected = Lab.tut.uids[0] || null;
  renderBench(true);
  Lab.log.push({ k: 'warn', at: Lab.time, text: '📘 开始『' + exp.no + '　' + exp.title + '』（第 ' + (Lab.tut.step + 1) + ' 步继续）：工作台已按清单摆好仪器，跟着右边步骤做。' });
  tutSave(); tutRender(true);
  return { ok: true, exp: exp.id, step: Lab.tut.step, uids: Lab.tut.uids.slice() };
}

/** 自动完成当前这一步（给不会操作的人看演示，也是自动化验收的入口） */
function tutDemo() {
  const exp = tutExp(); if (!exp) return { ok: false, why: '先选一个实验' };
  const st = exp.steps[Lab.tut.step]; if (!st) return { ok: false, why: '这个实验已经做完了' };
  if (st.auto) { try { st.auto(); } catch (e) { return { ok: false, why: '演示失败：' + (e && e.message) }; } }
  labStep(0.05);
  tutRender(true);
  return { ok: true, step: Lab.tut.step, auto: !!st.auto };
}

/** 每帧调用：节流检查当前步骤是否完成 → 自动进入下一步 */
function tutTick(dt) {
  tutThrottle += dt;
  if (tutThrottle < 0.2) return;
  tutThrottle = 0;
  const exp = tutExp();
  if (!exp || !tutActive()) return;
  const st = exp.steps[Lab.tut.step];
  if (!st) return;
  let ok = false;
  try { ok = !!st.c(); } catch (e) { ok = false; }
  if (!ok) return;
  if (Lab.tut.step === 1 && exp.id === 'e8') Lab.tut.mem.m0 = totalMass(tutApp(0));   // 反应前质量快照
  Lab.tut.done[exp.id + ':' + Lab.tut.step] = true;
  Lab.tut.step++;
  Lab.tut.pos[exp.id] = Lab.tut.step;
  const last = Lab.tut.step >= exp.steps.length;
  Lab.log.push({
    k: 'task', at: Lab.time,
    text: '✅ ' + exp.no + ' 第 ' + Lab.tut.step + ' 步完成：' + st.t + (last ? '　🎉 实验完成！' : ''),
  });
  if (last) { Lab.tut.expDone[exp.id] = true; toast('🎉 ' + exp.title + ' 全部完成'); }
  else toast('✅ 第 ' + Lab.tut.step + ' 步完成');
  tutSave(); tutRender(true);
}

/* -------------------------------- 界面 ---------------------------------- */
function tutRender(force) {
  const box = document.querySelector('#tutorial'); if (!box) return;
  box.classList.toggle('show', !!Lab.tut.open);
  if (!Lab.tut.open) return;
  const prog = (e) => e.steps.filter((_, i) => Lab.tut.done[e.id + ':' + i]).length;
  /* 选中（看详情）≠ 开工：列表里点一下只是选中，真正的开工要按「▶ 开始实验」 */
  const sel = tutExp(Lab.tut.sel) || tutExp() || TUT[0];
  Lab.tut.sel = sel.id;
  const running = Lab.tut.id === sel.id;
  const selProg = prog(sel), selStep = running ? Lab.tut.step : (Lab.tut.pos[sel.id] || 0);
  const allDone = selProg >= sel.steps.length;
  const atStep = Math.min(selStep + 1, sel.steps.length);
  const beginTxt = running ? (allDone ? '▶ 回到工作台（已全部完成 🎉）' : '▶ 回到工作台（继续第 ' + atStep + ' 步）')
    : allDone ? '↺ 再做一遍（上次已全部完成）'
      : selProg > 0 ? '▶ 继续实验（第 ' + atStep + ' 步）' : '▶ 开始实验';
  let html = '<div class="tutwrap">'
    + '<div class="tutside"><h3>📘 初中化学实验教程</h3>'
    + '<p class="hint">' + TUT.length + ' 个教材经典实验（人教九上＋九下）。点一个看详情 → 按「▶ 开始实验」，工作台右侧就会弹出<b>步骤面板</b>，跟着一步步做。每一步都会真的检查（物质、温度、气体、pH、过滤结果），每个实验都带<b>名称对照表</b>：俗名、化学名称、化学式一一对应。</p>'
    + '<div class="tutlist">';
  TUT.forEach((e) => {
    const p = prog(e), all = p >= e.steps.length;
    html += '<button class="tutitem' + (Lab.tut.sel === e.id ? ' cur' : '') + (all ? ' ok' : '') + '" data-exp="' + e.id + '">'
      + '<b>' + (all ? '✅ ' : '') + e.no + '　' + e.title + '</b>'
      + '<i>' + e.grp + '　' + p + '/' + e.steps.length + (Lab.tut.id === e.id ? '　▶ 进行中' : '') + '</i></button>';
  });
  html += '</div>' + aliasTableHTML() + '</div><div class="tutmain">';
  {
    const p = selProg;
    html += '<h3>' + sel.no + '　' + sel.title + ' <small>' + sel.grp + '</small></h3>'
      + '<p class="goal">🎯 ' + sel.goal + '</p>'
      + '<div class="gearbox"><b>仪器与药品：</b>' + sel.gear.join(' ｜ ') + '</div>'
      + (sel.terms && sel.terms.length ? '<div class="termsbox"><b>🔤 名称对照表（俗名 ↔ 化学名称）：</b>'

        + sel.terms.map((r) => '<tr><td>' + r[0] + '</td><td>' + termChem(r[1]) + '</td><td>' + r[2] + '</td></tr>').join('')
        + '</table></div>' : '')
      + '<div class="beginrow">'
      + '<button class="primary big" id="tutBegin" data-exp="' + sel.id + '">' + beginTxt + '</button>'
      + ((p > 0 || running) ? '<button id="tutRestart">↺ 从头重做</button>' : '')
      + (running ? '<span class="hint">这个实验正在工作台进行 —— 关掉本窗口就能看到右侧步骤面板</span>' : '')
      + '</div>'
      + '<div class="steps">';
    sel.steps.forEach((s, i) => {
      const done = !!Lab.tut.done[sel.id + ':' + i];
      const cur = running && i === Lab.tut.step;
      html += '<div class="step' + (done ? ' done' : cur ? ' cur' : '') + '">'
        + '<span class="n">' + (done ? '✅' : i + 1) + '</span>'
        + '<div class="sbody"><b>' + s.t + '</b><i>👉 ' + s.h + '</i>'
        + (cur ? '<div class="srow"><button class="primary" id="tutDemo">' + (s.auto ? '▶ 演示这一步' : '⏳ 这一步要等一等（可点「⏩ 时间」加速）') + '</button>'
          + '<button id="tutSkip">跳过判定</button></div>' : '')
        + '</div></div>';
    });
    html += '</div>';
    html += '<div class="tutsum"><b>现象：</b>' + sel.see + '</div>'
      + '<div class="tutsum"><b>化学方程式：</b>' + sel.eq.map((x) => '<code>' + x + '</code>').join('') + '</div>'
