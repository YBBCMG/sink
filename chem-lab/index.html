<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元素实验室 · 真实化学沙盒</title>
<style>
/* 元素实验室 —— 样式（深色实验室风） */
:root {
  --bg: #080d12; --panel: #0f1922; --panel2: #14222d; --line: #20343f;
  --txt: #d9e9f4; --dim: #7d9cb0; --acc: #4fd1c5; --warm: #ffb454; --bad: #ff7a5c; --ok: #8ce07a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--txt); font: 13px/1.5 "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
  background: radial-gradient(1200px 700px at 20% -10%, #12222e 0%, var(--bg) 60%);
  overflow: hidden;
}
h4, h5 { margin: 0 0 6px; font-size: 13px; }
button { font: inherit; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; cursor: pointer; transition: .12s; }
button:hover { border-color: var(--acc); background: #1b2c38; }
button.primary { background: linear-gradient(180deg, #1d4a4a, #16383a); border-color: #2f7b76; color: #d8fffa; }
button.on { border-color: var(--warm); box-shadow: 0 0 0 1px #ffb45433 inset; color: #ffdca8; }
input, select { font: inherit; color: var(--txt); background: #0b141b; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }

header {
  height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #122330, #0d1a22);
}
header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
header h1 small { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 6px; }
header .stat { color: var(--dim); font-size: 12px; }
header .stat b { color: var(--acc); }
header .spacer { flex: 1; }

main { display: grid; grid-template-columns: 402px minmax(470px, 1fr) 372px; gap: 10px; padding: 10px; height: calc(100vh - 52px); }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; min-height: 0; }
.pane > .scroll { overflow: auto; min-height: 0; }

/* 周期表 */
#ptable { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; margin-bottom: 8px; }
.el { aspect-ratio: 1; padding: 0; border-width: 1px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.el b { font-size: 11px; }
.el i { font-size: 7.5px; color: var(--dim); font-style: normal; }
.el:hover { transform: translateY(-1px); border-color: #fff; }
#elemInfo { border-top: 1px solid var(--line); padding-top: 8px; }
#elemInfo h4 .sym { color: var(--acc); font-size: 15px; }
.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 1px 0; }
.kv span { color: var(--dim); }
.hazard { color: var(--bad); font-size: 12px; margin: 4px 0; }
#elemInfo button { width: 100%; margin-top: 6px; }

/* 试剂架 */
#shelfSearch { width: 100%; margin-bottom: 8px; }
.shelfsec { margin-bottom: 8px; }
.shelfsec h5 { color: var(--dim); text-transform: none; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 3px 7px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.chip b { font-size: 11px; }
.chip span { font-size: 10px; color: var(--dim); }
.hint { color: var(--dim); font-size: 11px; }

/* 工作台：一大片空地 —— 容器和热源器材都是摆上台面的"实物" */
.bars { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.barrow { display: flex; align-items: center; gap: 6px; }
.barlbl { color: var(--dim); font-size: 10.5px; min-width: 82px; }
.barlbl b { color: var(--txt); }
#addApparatus, #addTools { display: flex; gap: 5px; flex-wrap: wrap; }
#addApparatus button i, #addTools button i { color: var(--dim); font-size: 10px; font-style: normal; margin-left: 4px; }
#addTools button { border-color: #5c4520; background: linear-gradient(180deg, #2a2114, #221a10); }
#addTools button:hover { border-color: var(--warm); background: #322616; }

#bench { position: relative; flex: 1 1 auto; min-width: 176px; min-height: 296px; margin-top: 4px; border-radius: 12px;
  border: 1px solid var(--line); overflow-x: auto; overflow-y: hidden;
  background: radial-gradient(130% 90% at 50% 0%, #16222d 0%, #0e1720 58%, #0a111a 100%); }
#bench::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 54px; pointer-events: none;
  background: linear-gradient(180deg, #1e2c37 0%, #17222c 14%, #121b24 100%);
  border-top: 2px solid #2b3d4d; box-shadow: inset 0 1px 0 #ffffff10; }
.empty { position: relative; z-index: 3; color: var(--dim); padding: 96px 30px; text-align: center; }

.appcard, .toolcard { position: absolute; bottom: 0; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 10px; padding: 6px; cursor: pointer; }
.appcard { width: 168px; z-index: 2; }
.toolcard { width: 104px; padding: 5px; z-index: 1; background: linear-gradient(180deg, #231b12, #1a140d); border-color: #4a3a22; }
.appcard.sel { border-color: var(--acc); box-shadow: 0 0 0 1px #4fd1c555, 0 6px 20px #0008; }
.appcard.onrig { border-color: #ffab4a; box-shadow: 0 0 0 1px #ffab4a44, 0 8px 22px #000a; }
.appcard.rigtight { box-shadow: 0 0 0 1px #ffab4a33, 0 -6px 18px #ffab4a22; }   /* 窗口太矮、抬升被压缩时的视觉提示 */
.toolcard.lit { border-color: #ff8a3d; box-shadow: 0 0 16px #ff7a2a55; }
.toolcard.over { outline: 2px dashed #ffb35c; outline-offset: 3px; }
.dragbar { cursor: grab; touch-action: none; }
.dragging { opacity: .85; z-index: 44 !important; }
.tutlift { z-index: 45 !important; }
.apphead, .toolhead { display: flex; align-items: center; gap: 5px; font-size: 12px; margin-bottom: 3px; }
.toolhead { font-size: 11px; }
.apphead .uid, .apphead .cap, .toolhead .uid { color: var(--dim); font-size: 10px; }
.apphead .uid, .toolhead .uid { margin-left: auto; }
.vessel { width: 100%; height: 86px; border-radius: 8px; display: block; background: #0a1116; }
.toolcv { width: 100%; height: 58px; display: block; background: transparent; }
.toolmeta { color: var(--dim); font-size: 9.5px; text-align: center; margin-top: 2px; line-height: 1.2; }
.toolcard .ops { justify-content: center; }
.toolcard .ops button { padding: 2px 4px; font-size: 10px; }
.readouts { margin: 4px 0; font-size: 10.5px; }
.ro { display: flex; gap: 6px; align-items: center; }
.ro b.hot { color: var(--warm); }
.contents { color: var(--dim); font-size: 10px; word-break: break-all; }
.contents.gas { color: #9fd8ff; }
.warn { color: var(--bad); font-size: 10.5px; }
.ops { display: flex; flex-wrap: wrap; gap: 3px; }
.ops button { padding: 2px 5px; font-size: 10.5px; }
.ops2, .ops3 { margin-top: 3px; }
.heatrow { display: flex; flex-direction: column; gap: 1px; margin-top: 3px; }
.heatrow .lbl { color: var(--dim); font-size: 10.5px; }
.heatrow .lbl.hot { color: #ffb35c; }
.heatrow i { color: var(--dim); font-size: 10px; font-style: normal; }
.hbtn { padding: 2px 6px; font-size: 11px; }
.hbtn i { color: var(--dim); font-style: normal; font-size: 10px; }

/* 日志 */
#log { flex: 1; overflow: auto; font-size: 12px; }
.logrow { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px dashed #1a2b36; }
.logrow .ic { width: 16px; }
.logrow.rxn .tx { color: #bff5ea; }
.logrow.warn .tx { color: var(--warm); }
.logrow.task .tx { color: var(--ok); }
.logrow small { color: var(--dim); }
#tasks { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
.task { font-size: 12px; padding: 2px 0; color: #cfe6f2; }
.task.done { color: var(--dim); text-decoration: line-through; }

/* 弹窗与提示 */
#modal { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 50; }
#modal.show { display: flex; }
#modal .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: 320px; box-shadow: 0 20px 60px #000c; }
#modal label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 12px; }
#modal input, #modal select { width: 130px; }
#modal .row { display: flex; gap: 8px; margin-top: 12px; }
.ghint { background: #12303a; border: 1px solid #2f7d8c; color: #bff5ea; border-radius: 8px; padding: 6px 8px; font-size: 11.5px; margin-bottom: 6px; }
#modal .row button { flex: 1; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #16323c; border: 1px solid var(--acc); color: #d8fffa; padding: 8px 16px; border-radius: 20px; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.pane h3 { margin: 0 0 6px; font-size: 13px; color: var(--dim); font-weight: 500; }

/* 炸裂的容器 */
.appcard.broken { border-color: #ff6b6b; background: rgba(60, 18, 22, 0.55); }
.appcard.broken .vessel { filter: saturate(0.6); }
.readouts .warn.big { color: #ff9a9a; font-weight: 600; line-height: 1.5; }

/* ---------------------- 实验教程（覆盖式面板） ---------------------- */
#tutorial { position: fixed; inset: 0; background: #000b; display: none; z-index: 60; padding: 26px; }
#tutorial.show { display: block; }
.tutwrap { position: relative; margin: 0 auto; max-width: 1180px; height: 100%; display: grid;
  grid-template-columns: 330px minmax(0, 1fr); gap: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; box-shadow: 0 24px 70px #000d; }
.tutside { border-right: 1px solid var(--line); padding: 14px; overflow: auto; background: #0c1620; }
.tutside h3, .tutmain h3 { font-size: 15px; margin: 0 0 8px; }
.tutmain h3 small { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 8px; }
.tutlist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.tutitem { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; }
.tutitem b { font-size: 12px; font-weight: 600; }
.tutitem i { color: var(--dim); font-size: 10px; font-style: normal; }
.tutitem.cur { border-color: var(--acc); background: #16323a; }
.tutitem.ok b { color: var(--ok); }
.tutmain { padding: 16px 18px; overflow: auto; }
.tutmain .goal { color: var(--txt); margin: 4px 0 10px; }
.gearbox { background: #0c1620; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--dim); }
.beginrow { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; flex-wrap: wrap; }
.beginrow .primary.big { font-size: 14px; padding: 9px 16px; font-weight: 600; }
.beginrow .hint { flex: 1 1 100%; }
.steps { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.step { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: #0e1a23; }
.step .n { flex: 0 0 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--panel2); color: var(--dim); font-size: 11px; }
.step .sbody { flex: 1; }
.step .sbody b { display: block; font-size: 13px; }
.step .sbody i { display: block; color: var(--dim); font-size: 11px; font-style: normal; margin-top: 3px; }
.step.cur { border-color: var(--acc); background: #12262c; box-shadow: 0 0 0 1px #4fd1c533 inset; }
.step.cur .n { background: var(--acc); color: #06222a; font-weight: 700; }
.step.done { opacity: .72; }
.step.done .n { background: #1d3a24; color: var(--ok); }
.srow { display: flex; gap: 8px; margin-top: 8px; }
.srow button { font-size: 11px; }
.tutsum { margin: 8px 0; font-size: 12px; color: var(--txt); }
.tutsum b { color: var(--acc); }
.tutsum code { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 6px; background: #0b141b; border: 1px solid var(--line); border-radius: 5px; font-size: 11px; }
.tutsum ul { margin: 4px 0 0; padding-left: 20px; color: var(--dim); }
.tutsum ul li { margin: 2px 0; }
.tutsum.warn { color: var(--warm); }

/* --------- 名称对照表：俗名 ↔ 化学名称 ↔ 化学式（每个实验一份 + 全局一份） --------- */
.termsbox { margin: 8px 0; font-size: 12px; color: var(--txt); }
.termsbox > b { color: var(--acc); }
.termtab { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 11.5px; }
.termtab th { text-align: left; color: var(--dim); font-weight: 500; font-size: 10.5px;
  border-bottom: 1px solid var(--line); padding: 3px 6px 3px 0; }
.termtab td { padding: 3px 6px 3px 0; vertical-align: top; border-bottom: 1px dashed rgba(120,160,200,.13); color: var(--dim); }
.termtab td:first-child { color: var(--txt); white-space: nowrap; }
.termtab code { padding: 1px 5px; background: #0b141b; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; color: var(--txt); }
.termtab .tal { display: block; color: var(--warm); font-size: 10.5px; font-style: normal; }
.aliasbox { margin-top: 10px; font-size: 12px; }
.aliasbox > summary { cursor: pointer; color: var(--acc); padding: 6px 8px; background: #0c1620;
  border: 1px solid var(--line); border-radius: 8px; }
.aliasbox .termtab { max-height: 300px; overflow: auto; display: block; }
.chip .alias { font-size: 9.5px; color: var(--warm); opacity: .95; }
.subfull { font-size: 11.5px; color: var(--dim); margin: 2px 0 6px; line-height: 1.5; }
.cnm { font-weight: 500; }
.tutbar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim); }
.tutclose { position: absolute; top: 10px; right: 12px; }
.tutmain .hint.big { margin-top: 30px; font-size: 13px; }
#modal .targetlist { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
#modal .targetlist .tgt { text-align: left; }

/* ============ 手把手步骤面板：常驻工作台右侧（与工作台同排并列 → 谁都不挡谁） ============ */
#workrow { display: flex; gap: 8px; flex: 1 1 auto; min-height: 0; }
#guide { flex: 0 1 252px; min-width: 168px; display: none; min-height: 0; }
#guide.show { display: flex; flex-direction: column; }
#guide .gwrap {
  display: flex; flex-direction: column; min-height: 0; height: 100%;
  background: linear-gradient(180deg, #12303a, #0d2029);
  border: 1px solid #2b6d70; border-radius: 10px; padding: 8px 9px 9px; box-shadow: 0 8px 24px #0006;
}
#guide .grow1 { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--dim); }
#guide .gno { color: var(--acc); font-weight: 600; white-space: nowrap; }
#guide .gtitle { display: block; margin-top: 3px; font-size: 12px; color: #dff6ff; font-weight: 600; line-height: 1.3; }
#guide .gsp { flex: 0 0 4px; }
#guide .gbar { flex: 1 1 auto; height: 5px; background: #0a1a20; border-radius: 3px; overflow: hidden; }
#guide .gbar i { display: block; height: 100%; background: linear-gradient(90deg, #2f7b76, #4fd1c5); }
#guide button { padding: 2px 6px; font-size: 11px; }
#guide .gcur { margin-top: 7px; padding: 8px 9px; border: 1px solid #2b6d70; border-radius: 9px; background: #0f232b; }
#guide .grow2 { display: flex; gap: 7px; align-items: flex-start; }
#guide .gstepn { flex: 0 0 19px; height: 19px; line-height: 19px; text-align: center; border-radius: 50%;
  background: var(--acc); color: #06222a; font-size: 11px; font-weight: 700; }
#guide .gtodo { font-size: 12.5px; color: #eafcff; line-height: 1.35; }
#guide .gtgt { display: block; margin-top: 5px; font-size: 11px; color: var(--warm); line-height: 1.4; }
#guide .gtgt b { color: #ffdca8; }
#guide .grow3 { margin-top: 5px; font-size: 10.5px; min-height: 14px; line-height: 1.4; }
#guide .ghint { color: var(--warm); }
#guide .gnudge { color: var(--bad); }
#guide .gok { color: var(--ok); }
#guide .gtip { color: var(--dim); }
#guide .gacts { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
#guide .glist { flex: 1 1 auto; overflow: auto; min-height: 0; margin-top: 9px; }
#guide .glbl { font-size: 10px; color: var(--dim); margin-bottom: 4px; }
#guide .gitem { display: flex; gap: 6px; align-items: flex-start; padding: 4px 6px; margin-bottom: 3px;
  border-radius: 7px; font-size: 10.5px; color: var(--dim); line-height: 1.35; border-left: 2px solid transparent; }
#guide .gitem .gn { flex: 0 0 13px; color: var(--dim); }
#guide .gitem.done { color: #86c79a; }
#guide .gitem.cur { color: #eafcff; background: #16323a; border-left-color: var(--acc); }
/* 引导进行时两侧收窄一点，把地方让给工作台 + 步骤面板（1280 的笔记本上也放得下两张卡片） */
body.guiding main { grid-template-columns: 340px minmax(360px, 1fr) 330px; }
@media (max-width: 1500px) {
  #guide { flex: 0 0 224px; }
  body.guiding main { grid-template-columns: 300px minmax(320px, 1fr) 318px; }
}

/* 目标控件脉冲高亮（只动 outline/阴影，不改尺寸 → 绝不挪动布局） */
.tutglow { position: relative; z-index: 4; outline: 2px solid var(--warm) !important; outline-offset: 2px;
  animation: tutpulse 1.05s ease-in-out infinite; }
@keyframes tutpulse {
  0%, 100% { box-shadow: 0 0 0 0 #ffb45488, 0 0 12px 2px #ffb45455; }
  50% { box-shadow: 0 0 0 6px #ffb45400, 0 0 18px 6px #ffb45433; }
}
.guarrow { position: fixed; z-index: 70; pointer-events: none; display: none; padding: 2px 8px; font-size: 11px;
  background: #ffb454; color: #201202; border-radius: 6px; font-weight: 600; box-shadow: 0 4px 12px #0007; max-width: 300px; }
.guarrow.show { display: block; }

/* ---------- 教材课程（人教版配套）覆盖层 ---------- */
#courseModal { position: fixed; inset: 0; background: #000b; display: none; align-items: center; justify-content: center; z-index: 60; }
#courseModal.show { display: flex; }
#courseModal .cbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(1080px, 94vw); height: min(84vh, 900px); display: flex; flex-direction: column; box-shadow: 0 24px 70px #000d; overflow: hidden; }
#courseModal .ctop { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #14242f, #101c25); }
#courseModal .ctop b { font-size: 14px; }
#courseModal .cnote { color: var(--dim); font-size: 12px; }
#courseModal .cnote .cok { color: var(--ok); }
#courseModal .cnote .ctd { color: var(--warm); }
#courseModal #cSearch { flex: 1; max-width: 340px; margin-left: auto; }
#courseModal .cbody { overflow: auto; padding: 6px 16px 18px; }
#courseModal .cunit { border-top: 1px solid var(--line); padding: 10px 0 6px; }
#courseModal .cunit h4 { font-size: 13.5px; color: var(--acc); display: flex; align-items: baseline; gap: 8px; }
#courseModal .cunit .calt { color: var(--dim); font-size: 11px; font-style: normal; font-weight: 400; }
#courseModal .cunit .ccount { color: var(--dim); font-size: 11px; font-weight: 400; margin-left: auto; }
#courseModal .clesson { padding: 4px 0 4px 10px; border-left: 2px solid var(--line); margin: 3px 0 3px 2px; }
#courseModal .clesson b { font-size: 12.5px; color: #b9d7e6; }
#courseModal .cchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
#courseModal .cchip { text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 5px 9px; font-size: 12px; max-width: 100%; }
#courseModal .cchip .cgoal { color: var(--dim); font-size: 10.5px; font-style: normal; }
#courseModal .cchip .cext { color: var(--warm); font-size: 10px; font-style: normal; border: 1px solid #6b4a1c; border-radius: 4px; padding: 0 3px; }
#courseModal .cchip.ok { border-color: #3b6b3a; }
#courseModal .cchip.miss { color: var(--bad); font-size: 11px; }
#courseModal .cnone { color: var(--dim); font-size: 11.5px; }
#courseModal .ctodo { color: var(--dim); font-size: 11.5px; border: 1px dashed var(--line); border-radius: 6px; padding: 4px 7px; }

/* ---------- 读数：数值必须"测"出来 ---------- */
.readouts .ro .un { color: #5d7386; font-weight: 400; }
.readouts .ro .mv { color: var(--acc); }
.readouts .ro .stale { color: var(--warm); font-weight: 400; }
.readouts .ro .need { color: #54707f; font-size: 10px; margin-left: 4px; }
#addTools .tglbl { color: var(--dim); font-size: 10.5px; margin: 0 2px 0 6px; align-self: center; }
#addTools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
#addTools button:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- 俯视观察窗 ---------- */
#obsbox { border-bottom: 1px solid var(--line); padding: 4px 2px 8px; margin-bottom: 6px; }
#obsbox h4 { font-size: 12.5px; display: flex; align-items: baseline; gap: 8px; }

/* ============================================================================
 * 02-chem.js —— 化学内核：化学式解析、摩尔质量、物质库
 * ----------------------------------------------------------------------------
 * 物质库格式（| 分隔）：
 *   化学式|名称|298K态|类别|颜色|溶解度|ΔfH°|备注
 *     态：s 固 / l 液 / g 气 / aq 水溶液中的溶质
 *     类别：solvent acid base salt oxide element organic indicator ore
 *     溶解度：数值 g/100g 水(20°C) ／ - 不溶 ／ ~ 微溶 ／ ∞ 互溶 ／ 空 未知
 *     ΔfH°：kJ/mol，前面加 ~ 表示估算值（无真实数据）；空 = 未知
 *   化学式支持：括号、结晶水（·）、电荷（^2- / ^+）
 *
 * 俗名对照表（ALIAS_RAW）：教材里说的是俗名（纯碱、小苏打、生石灰…），
 *   界面上每一处都按「俗名（化学名称 化学式）」显示 —— 见 subTitle()/subFull()。
 * ==========================================================================*/

/** 解析化学式 → { atoms: Map<符号,个数>, charge: number } */
function parseFormula(f) {
  let body = String(f).trim(), charge = 0;
  const cm = /^(.*?)\^(\d*)([+-])$/.exec(body);
  if (cm) { body = cm[1]; charge = (cm[2] ? Number(cm[2]) : 1) * (cm[3] === '+' ? 1 : -1); }
  const atoms = new Map();
  const countGroup = (str, mult) => {
    let i = 0;
    while (i < str.length) {
      const ch = str[i];
      if (ch === '(') {
        let depth = 1, j = i + 1;
        while (j < str.length && depth > 0) { if (str[j] === '(') depth++; else if (str[j] === ')') depth--; j++; }
        let k = j, num = '';
        while (k < str.length && /\d/.test(str[k])) num += str[k++];
        countGroup(str.slice(i + 1, j - 1), mult * (num ? Number(num) : 1));
        i = k;
      } else if (/[A-Z]/.test(ch)) {
        let sym = ch, j = i + 1;
        while (j < str.length && /[a-z]/.test(str[j])) sym += str[j++];
        let num = '';
        while (j < str.length && /\d/.test(str[j])) num += str[j++];
        if (!ELEM_BY_SYM.has(sym)) throw new Error('未知元素符号: ' + sym + ' (在 ' + f + ')');
        atoms.set(sym, (atoms.get(sym) || 0) + mult * (num ? Number(num) : 1));
        i = j;
      } else i++;
    }
  };
  // 结晶水：CuSO4·5H2O → CuSO4 + 5×(H2O)
  body.split(/[·⋅.]/).forEach((part, idx) => {
    let p = part, mult = 1;
    const hm = /^(\d+)(.+)$/.exec(p);
    if (hm && idx > 0) { mult = Number(hm[1]); p = hm[2]; }
    countGroup(p, mult);
  });
  return { atoms, charge };
}

/** 摩尔质量 g/mol（由元素真实原子量累加，不查表 → 不可能写错） */
const _mmCache = new Map();
function molarMass(f) {
  if (_mmCache.has(f)) return _mmCache.get(f);
  let m = 0;
  try { parseFormula(f).atoms.forEach((n, sym) => { m += n * ELEM_BY_SYM.get(sym).mass; }); }
  catch (e) { m = NaN; }
  m = Math.round(m * 1000) / 1000;
  _mmCache.set(f, m);
  return m;
}

/* ============================================================================
 * 03-reactions.js —— 反应引擎：自动配平 + 真实反应库 + 匹配与推进
 * ----------------------------------------------------------------------------
 * 设计要点：
 *   1) 反应只写「左边有什么、右边有什么」，系数由线性代数配平器求出
 *      （分数精确运算 + 零空间），配不出来的模板直接不进库并记 warning。
 *   2) 每一条入库反应都会跑一次元素守恒 + 电荷守恒校验，校验不过 = 抛错。
 *   3) ΔH 由生成焓 ΔfH° 自动算（ΔH = ΣνΔfH°(产物) − ΣνΔfH°(反应物)）；
 *      缺数据的标「估算」，有真实数据的标「实测」，不冒充。
 * ==========================================================================*/

/* ------------------------------ 精确分数工具 ------------------------------ */
const _gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
const _lcm2 = (a, b) => Math.abs(a * b) / _gcd(a, b);
function fr(n, d = 1) { if (d < 0) { n = -n; d = -d; } if (n === 0) return [0, 1]; const g = _gcd(n, d); return [n / g, d / g]; }
const fAdd = (a, b) => fr(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
const fSub = (a, b) => fr(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
const fMul = (a, b) => fr(a[0] * b[0], a[1] * b[1]);
const fDiv = (a, b) => fr(a[0] * b[1], a[1] * b[0]);

/* ------------------------------- 配平器 --------------------------------- */
/** 求 lhs/rhs 的最简整数系数；无唯一正解则返回 null */
function balanceReaction(lhs, rhs) {
  const n = lhs.length + rhs.length;
  if (!lhs.length || !rhs.length) return null;
  if (lhs.some((f) => rhs.includes(f))) return null;          // 两边同种物质 → 拒绝
  const all = lhs.concat(rhs);
  let parsed;
  try { parsed = all.map(parseFormula); } catch (e) { return null; }
  const signs = all.map((_, i) => (i < lhs.length ? 1 : -1));
  const elems = new Set();
  parsed.forEach((p) => p.atoms.forEach((_, k) => elems.add(k)));
  const rows = [...elems].map((el) => parsed.map((p, i) => (p.atoms.get(el) || 0) * signs[i]));
  if (parsed.some((p) => p.charge !== 0)) rows.push(parsed.map((p, i) => p.charge * signs[i]));
  const m = rows.length;
  const A = rows.map((r) => r.map((v) => fr(v)));

  // 高斯-约当消元（RREF）
  const pivot = [];
  let r = 0;
  for (let c = 0; c < n && r < m; c++) {
    let p = -1;
    for (let i = r; i < m; i++) if (A[i][c][0] !== 0) { p = i; break; }
    if (p < 0) continue;
    const t = A[r]; A[r] = A[p]; A[p] = t;
    const pv = A[r][c];
    for (let j = c; j < n; j++) A[r][j] = fDiv(A[r][j], pv);
    for (let i = 0; i < m; i++) {
      if (i === r || A[i][c][0] === 0) continue;
      const k = A[i][c];
      for (let j = c; j < n; j++) A[i][j] = fSub(A[i][j], fMul(k, A[r][j]));
    }
    pivot.push(c); r++;
  }
  const free = [];
  for (let c = 0; c < n; c++) if (!pivot.includes(c)) free.push(c);
  if (free.length !== 1) return null;                          // 需唯一解
  const fc = free[0];
  const x = new Array(n).fill(null).map(() => [0, 1]);
  x[fc] = [1, 1];
  pivot.forEach((pc, idx) => { x[pc] = fr(-A[idx][fc][0], A[idx][fc][1]); });

  // 清分母 → 最简整数
  let L = 1;
  x.forEach((v) => { L = _lcm2(L, v[1]); });
  let ints = x.map((v) => Math.round(v[0] * L / v[1]));
  let g = 0;
  ints.forEach((v) => { g = _gcd(g, v); });
  if (g > 1) ints = ints.map((v) => v / g);
  if (ints.some((v) => !Number.isFinite(v)) || ints.some((v) => v <= 0)) return null;
  return ints;
}

/** 守恒校验：左右原子数 + 电荷（配平的最终判据） */
function verifyBalance(lhs, rhs, coef) {
  const all = lhs.concat(rhs);
  const parsed = all.map(parseFormula);
  const bad = [];
  const elems = new Set();
  parsed.forEach((p) => p.atoms.forEach((_, k) => elems.add(k)));
  elems.forEach((el) => {
    let s = 0;
    parsed.forEach((p, i) => { s += p.atoms.get(el) * coef[i] * (i < lhs.length ? 1 : -1); });
    if (Math.abs(s) > 1e-9) bad.push(el + (s > 0 ? ' 多' : ' 少') + Math.abs(s));
  });
  let q = 0;
  parsed.forEach((p, i) => { q += p.charge * coef[i] * (i < lhs.length ? 1 : -1); });
  if (Math.abs(q) > 1e-9) bad.push('电荷不平衡 ' + q);
  return bad;
}

    else if (t === 'h') c.light = true;
    else if (t === 'dis') c.discharge = true;
    else if (t === 'el') c.elec = true;
    else if (t.startsWith('T:')) c.temp = Number(t.slice(2));
    else if (t.startsWith('cat:')) c.cat = t.slice(4);
  });

}

/** 建库：配平 → 校验 → 入库；任何一条不配平都不进库 */
function buildReactions() {
  RX_DEFS.concat(RX_DEFS_MORE).forEach(([kind, lhsS, rhsS, condS, rate, phen, note]) => {
    const lhs = lhsS.split(',').map((s) => s.trim());
    const rhs = rhsS.split(',').map((s) => s.trim());
    const unknown = lhs.concat(rhs).filter((f) => !SUB.has(f));
    if (unknown.length) { RX_WARN.push({ lhs: lhsS, rhs: rhsS, why: '物质库缺少: ' + unknown.join(',') }); return; }
    const coef = balanceReaction(lhs, rhs);
    if (!coef) { RX_WARN.push({ lhs: lhsS, rhs: rhsS, why: '配平失败（无唯一整数解）' }); return; }
    const bad = verifyBalance(lhs, rhs, coef);
    if (bad.length) { RX_WARN.push({ lhs: lhsS, rhs: rhsS, why: '守恒校验失败: ' + bad.join('/') }); return; }
    const cond = parseCond(condS);
    // ΔH：全部有生成焓才算「实测」，缺数据则按类别估算
    let dh = 0, dhAq = 0, missing = false, est = false, estAq = false;
    const sum = (arr, off, sgn) => arr.forEach((f, i) => {
      const s = subOf(f);
      if (!s || !s.dHf) { missing = true; return; }
      if (s.dHf.est) est = true;
      dh += sgn * coef[off + i] * s.dHf.v;
      // 逐物质判断：在溶液里以水合离子存在的用 ΔfH°(aq)；
      // 金属固体、以及会冒泡逸出的气体（CO₂/H₂…）仍用它自己纯态的值。
      const aq = s.st === 'g' ? null : DHF_AQ[f];
      if (aq ? aq.est : s.dHf.est) estAq = true;
      dhAq += sgn * coef[off + i] * (aq ? aq.v : s.dHf.v);
    });
    sum(lhs, 0, -1); sum(rhs, lhs.length, +1);
    if (missing) {
      const KIND_DH = { 中和: -57, 燃烧: -550, 置换: -150, 化合: -300, 分解: 120, 复分解: -60, 氧化还原: -200 };
      dh = KIND_DH[kind] != null ? KIND_DH[kind] : -100;
      est = true;
      dhAq = dh; estAq = true;
    }
    dh = Math.round(dh * 10) / 10;
    dhAq = Math.round(dhAq * 10) / 10;
    // 气体／沉淀自动识别
    const gases = [], ppts = [];
    rhs.forEach((f, i) => {
      const s = subOf(f);
      if (s.st === 'g') gases.push(f);
      else if ((s.solubility === -1 || s.solubility === -2) && ['salt', 'base', 'oxide'].includes(s.cat)
        && (cond.sol || lhs.some((lf) => subOf(lf).st === 'aq'))) ppts.push(f);
    });
    const eq = lhs.map((f, i) => (coef[i] > 1 ? coef[i] : '') + f).join(' + ')
      + ' → ' + rhs.map((f, i) => (coef[lhs.length + i] > 1 ? coef[lhs.length + i] : '') + f
        + (gases.includes(f) ? '↑' : ppts.includes(f) ? '↓' : '')).join(' + ');
    const condText = [cond.ignite ? '点燃' : '', cond.temp ? '≥' + cond.temp + 'K' : '',
      cond.cat ? '催化剂 ' + cond.cat : '', cond.conc === 'conc' ? '浓' : cond.conc === 'dil' ? '稀' : '',
      cond.discharge ? '放电' : '', cond.sol ? '溶液' : ''].filter(Boolean).join(' · ');
    RXNS.push({
      id: RXNS.length, kind, lhs, rhs, coef, cond, rate, phen: phen.split('、'),
      note, dH: dh, dhEst: est, dHaq: dhAq, dhAqEst: estAq, gases, ppts, eq, condText,
      key: lhs.slice().sort().join(',') + '>' + rhs.slice().sort().join(','),
    });
  });
  return RXNS;
}
buildReactions();

/* ------------------------------ 反应匹配 --------------------------------- */
/** 条件是否满足（env = {temp, catalysts:Set, conc, dilute}） */
function condMet(rx, env) {
  const c = rx.cond;
  if (c.ignite && !env.ignite) return false;
  if (c.elec && !env.elec) return false;
  if (c.discharge && !env.discharge) return false;
  if (c.light && !env.light) return false;
  if (c.temp && env.temp + 1e-6 < c.temp) return false;
  if (c.cat && !(env.catalysts && env.catalysts.has(c.cat))) return false;
  if (c.conc === 'conc' && env.conc !== 'conc') return false;
  if (c.conc === 'dil' && env.conc === 'conc') return false;
  return true;
}

/** 从容器内容里找出所有能进行的反应（按 条件更苛刻者优先 排序） */
/** 互逆反应对（A+B→C 与 C→A+B）：两条方向在同一步里都能发生时，
 *  体系会被来回翻 —— 玩家看到的就是"容器里的东西疯狂变"（CO₂ ⇄ H₂CO₃ 就是典型）。
 *  规则：只留"更强"的那条 —— 速率大的赢；速率相同则条件更严的（更专门的）赢。 */
const RX_REV_KEY = (r) => r.lhs.slice().sort().join('+') + '>' + r.rhs.slice().sort().join('+');
let RX_REV = null;
function rxReverse(r) {
  if (!RX_REV) {
    RX_REV = new Map();
    RXNS.forEach((x) => RX_REV.set(RX_REV_KEY(x), x));
  }
  const self = RX_REV_KEY(r);
  return RX_REV.get(r.rhs.slice().sort().join('+') + '>' + r.lhs.slice().sort().join('+')) || null;
}
const rxScore = (r) => (r.cond.ignite ? 8 : 0) + (r.cond.cat ? 4 : 0) + (r.cond.conc ? 2 : 0)
  + (r.cond.temp ? 1 : 0) + (r.cond.elec ? 1 : 0) + (r.cond.light ? 1 : 0);
/** 同一批匹配里，把互逆对里的弱者踢掉。
 *  注意判据是"**反向反应此刻能不能发生**"（condMet），不是"反向有没有被匹配到" ——
 *  来回翻的典型是 CO₂ + H₂O ⇄ H₂CO₃：每一步只有一边的原料在，两边交替 100% 转化，
 *  容器里的东西就一步一变。只要反向此刻能发生，就只留更强的一条。 */
function dropWeakerTwins(list, env) {
  if (!list.length) return list;
  const matched = new Set(list.map((m) => RX_REV_KEY(m.rx)));
  return list.filter((m) => {
    const rev = rxReverse(m.rx);
    if (!rev || !condMet(rev, env)) return true;
    const sa = rxScore(m.rx), sb = rxScore(rev);
    if (sa !== sb) return sa > sb;
    if (m.rx.rate !== rev.rate) return m.rx.rate > rev.rate;
    const revMatched = matched.has(RX_REV_KEY(rev));      // 完全打平：谁真在反应就留谁
    return !revMatched || RX_REV_KEY(m.rx) < RX_REV_KEY(rev);
  });
}

function matchReactions(contents, env) {
  const have = new Map();
  contents.forEach((c) => { if (c.mol > 1e-9) have.set(c.formula, (have.get(c.formula) || 0) + c.mol); });
  const out = [];
  for (const rx of RXNS) {
    if (!condMet(rx, env)) continue;
    if (rx.cond.sol) {   // 溶液反应：允许有固体（固液界面反应），但必须存在溶液相
      const ok = rx.lhs.every((f) => (have.get(f) || 0) > 1e-9);
      const hasSolution = contents.some((c) => c.mol > 1e-9 && (c.dissolved || subOf(c.formula).st === 'aq' || subOf(c.formula).st === 'l'));
      if (!ok || !hasSolution) continue;
    } else if (!rx.lhs.every((f) => (have.get(f) || 0) > 1e-9)) continue;
    // 反应进度上限 = 极限试剂
    let max = Infinity;
    rx.lhs.forEach((f, i) => { max = Math.min(max, (have.get(f) || 0) / rx.coef[i]); });
    if (!(max > 1e-12)) continue;
    out.push({ rx, max });
  }
  // 更苛刻（有温度/点燃/催化剂要求）的排前面，避免被泛化反应抢走
  out.sort((a, b) => {
    const sc = (o) => (o.rx.cond.ignite ? 8 : 0) + (o.rx.cond.cat ? 4 : 0) + (o.rx.cond.conc ? 2 : 0) + (o.rx.cond.temp ? 1 : 0);
    return sc(b) - sc(a) || b.rx.rate - a.rx.rate;
  });
  return out;
}

/** 按极限试剂推进一次反应；返回 {extent, dH(J), eq, phen, gases, ppts}
 *  inSolution=true 时用「水合离子生成焓」算 ΔH —— 溶液里真正生成的是水合离子，
 *  用纯态生成焓会把中和热算成 −104 kJ/mol（真值 −57.3）。 */
function applyReaction(match, dtSec, inSolution) {
  const { rx, max } = match;
  const rateLimit = rx.rate * 0.25 * dtSec;         // 速率越高越快完成
  const extent = Math.min(max, rateLimit);
  if (!(extent > 1e-12)) return null;
  const useAq = !!inSolution && rx.dHaq != null && !rx.dhAqEst;
  const dh = useAq ? rx.dHaq : rx.dH;
  return {
    rx, extent, dHUsed: dh, usedAq: useAq,
    dH: dh * 1000 * extent,                       // kJ/mol → J
    consume: rx.lhs.map((f, i) => ({ formula: f, mol: rx.coef[i] * extent })),
    produce: rx.rhs.map((f, i) => ({ formula: f, mol: rx.coef[rx.lhs.length + i] * extent })),
  };
}

/* 自检：全库守恒（探针会再独立跑一遍） */
const RX_BAD = RXNS.filter((rx) => verifyBalance(rx.lhs, rx.rhs, rx.coef).length > 0);


/* ================= 04-physics.js ================= */
/* ============================================================================
 * 04-physics.js —— 物理层：热量、相变、溶解、浓度、pH（全部按真实公式/常数）
 * ----------------------------------------------------------------------------
 * 统一记账单位：物质的量 mol（质量 g = mol × M，体积 L 由水的量推出）
 *   热     Q = Σ n·Cp,m·ΔT      （水 Cp,m = 75.3 J/(mol·K)，实测）
 *   供热   Q = P·η·dt，且不超过热源温度（火焰不是无限热源）
 *   散热   牛顿冷却 dQ = -k·(T−T_env)·dt
 *   沸腾   达到沸点后多出来的能量全部用于汽化：Δn = ΔQ / ΔHvap（水 40.65 kJ/mol → 2257 J/g）
 *   溶解   溶解速率 ∝ 表面积 ×(1−c/c_sat)，并计入真实溶解焓（硝酸铵溶于水会真的变冷）
 *   沸点升高 ΔTb = Kb·b（水 Kb=0.512）、凝固点降低 ΔTf = Kf·b（Kf=1.86）
 * ==========================================================================*/

const PHYS = {
  R: 8.314, T0: 298.15, P0: 101325,
  Kb: 0.512, Kf: 1.86,          // 水的沸点升高 / 凝固点降低常数 K·kg/mol
  ETA_FLAME: 0.35, ETA_PLATE: 0.72,  // 火焰/电热板 传热效率
  MAX_PARTICLES: 140,
};

const _sub = (f) => subOf(f);

/** 液态水物质的量 */
const waterMol = (app) => app.contents.filter((c) => c.formula === 'H2O' && c.phase !== 'g')
  .reduce((a, c) => a + c.mol, 0);
/** 水溶液体积 L */
const waterVolume = (app) => waterMol(app) * 18.015 / 1000;
/** 玻璃器皿炸裂：内容物洒掉、热源/电源断开、留下碎玻璃 —— 真实实验室最常见的翻车 */
function breakVessel(app, why) {
  if (app.broken) return;
  app.broken = true;
  app.brokenWhy = why;
  app.contents = [];
  app.heater = null;
  app.standOn = null;                       // 器皿碎了就不再架在灯上（灯还亮着，但没什么可加热了）
  app.elec = false;
  app.ignited = false;
  app.bubbleRate = 0; app.pptRate = 0; app.flash = 0; app.flame = 0; app.smoke = 0;
  app.temp = PHYS.T0 + 15;
  for (let i = 0; i < 16; i++) {
    app.shards.push({
      x: (Math.random() - 0.5) * 1.05, y: Math.random() * 0.35,
      r: 2 + Math.random() * 4.5, rot: Math.random() * 6.283,
    });
  }
  Lab.log.push({ k: 'warn', text: '❌ ' + app.def.name + ' 炸裂：' + why + '　内容物全部洒掉，容器报废（点「✕ 移除」清理）', at: Lab.time });
  Lab.lastMsg = app.def.name + ' 炸裂了！' + why;
  Lab.brokenCount = (Lab.brokenCount || 0) + 1;
}

/** 骤冷判定：往滚烫的玻璃器皿里加室温物料 → 热应力炸裂 */
function shockCheck(app, addMassG) {
  if (app.broken || app.def.mat !== 'glass') return false;
  if (!(app.temp > 430) || !(addMassG > 1)) return false;
  const C0 = heatCapacity(app), C1 = addMassG * 4.18;
  const mixed = (C0 * app.temp + C1 * PHYS.T0) / Math.max(1e-6, C0 + C1);
  if (app.temp - mixed > 130) {
    breakVessel(app, '骤冷：' + Math.round(app.temp - 273.15) + '°C 的器皿直接加入室温物料，热应力炸裂');
    return true;
  }
  return false;
}

/** 容器里气相空间能装多少 mol 气体（1 atm 理想气体，气体受热膨胀后装得更少） */
function headspaceMol(app) {
  const ml = Math.max(0, app.def.cap - waterVolume(app));
  return (ml / 1000) / 24.5 * (298.15 / Math.max(200, app.temp));
}
const gasInApp = (app, formula) => app.contents
  .filter((c) => c.phase === 'g' && (!formula || c.formula === formula))
  .reduce((a, c) => a + c.mol, 0);
/** 把气体放进容器气相：装不下的部分冒泡逸出；两种情况都计入「放出过这种气体」 */
function putGas(app, formula, mol) {
  const room = Math.max(0, headspaceMol(app) - gasInApp(app));
  const keep = Math.min(mol, room);
  if (keep > 1e-12) addContent(app, formula, keep, 'g', false);
  const out = mol - keep;
  if (out > 1e-12) app.gasBubbles.push({ f: formula, mol: out });
  app.gasVented += Math.max(0, out);
  app.gasOut[formula] = (app.gasOut[formula] || 0) + mol;
  return keep;
}
/** 溶质总物质的量（已溶解、非水） */
const soluteMol = (app) => app.contents.filter((c) => c.dissolved && c.formula !== 'H2O')
  .reduce((a, c) => a + c.mol, 0);
/** 质量 g */
const massOf = (c) => c.mol * (_sub(c.formula) ? _sub(c.formula).M : 20);
const totalMass = (app) => app.contents.reduce((a, c) => a + massOf(c), 0) + app.glassMass;

/** 热容 J/K：内容物 + 玻璃器壁 */
function heatCapacity(app) {
  let C = app.glassMass * 0.83;                 // 硼硅玻璃 cp ≈ 0.83 J/(g·K)
  app.contents.forEach((c) => {
    const s = _sub(c.formula); if (!s) return;
    C += c.mol * subCp(s) * s.M;
  });
  return C;
}

/** 沸点 K：水的沸点 + 溶质引起的沸点升高 */
function boilingPoint(app) {
  const w = waterMol(app); if (!w) return 373.15;
  const m = (soluteMol(app) / (w * 18.015)) * 1000;   // 质量摩尔浓度 mol/kg
  return 373.15 + PHYS.Kb * m;
}
/** 凝固点 K */
function freezingPoint(app) {
  const w = waterMol(app); if (!w) return 273.15;
  const m = (soluteMol(app) / (w * 18.015)) * 1000;
  return 273.15 - PHYS.Kf * m;
}

/* --------------------------------- 溶解 ---------------------------------- */
const _dissRate = new Map();
/** 水蒸干后，溶解的溶质以晶体析出（蒸发结晶） */
function crystallize(app) {
  let n = 0;
  app.contents.forEach((c) => { if (c.dissolved && c.formula !== 'H2O') { c.dissolved = false; c.phase = 's'; n++; } });
  if (n) Lab.log.push({ k: 'clear', at: Lab.time, text: app.def.name + ' 里的水蒸干了，溶质以晶体析出（' + n + ' 种）' });
}

function stepDissolution(app, dt) {
  const w = waterMol(app);
  if (!w) { crystallize(app); return; }
  const V = waterVolume(app);
  app.contents.forEach((c) => {
    // 气体也按溶解度溶进水里（CO₂ 溶进水才显酸性；NH₃ 这类极易溶的一进去就被吸收）
    if (c.dissolved || c.formula === 'H2O') return;
    const s = _sub(c.formula); if (!s || !s.balanced) return;
    if (!Number.isFinite(c.mol) || c.mol <= 0) return;
    let sol = s.solubility;
    if (sol === -1) return;                       // 不溶
    if (sol === -2) sol = 0.2;                    // 微溶
    if (sol === Infinity) sol = 1000;
    if (sol == null) sol = 5;
    // 溶解度随温度升高而增大（KNO3 类显著，用 2%/K 近似）
    sol *= 1 + 0.02 * (app.temp - 298.15);
    const csat = (sol * 10) / s.M;                // mol/L
    // 已经溶掉的那部分才产生浓度 —— 早先这里拿"固体总量"当浓度算，
    // 于是少量水里撒一把盐会出现「总量超过饱和度 → 一点都不溶」的假象（2 g NH₄Cl 放进 5 mL 水永远不溶解）
    const disMol = app.contents.filter((x) => x.formula === c.formula && x.dissolved)
      .reduce((a, x) => a + x.mol, 0);
    const conc = disMol / V;
    if (conc >= csat - 1e-12) return;
    const area = Math.pow(Math.max(c.mol, 1e-9), 2 / 3);   // 表面积近似
    let rate = 0.35 * area * (1 - conc / csat);            // mol/s
    if (s.st === 'aq' || s.st === 'l') rate = c.mol / dt;  // 液体/溶液立刻混匀
    const dn = Math.min(c.mol, rate * dt, (csat - conc) * V);
    if (dn <= 1e-12) return;
    c.mol -= dn;
    addContent(app, c.formula, dn, 'aq', true);
    const dh = DISSOLUTION_DH[c.formula];
    if (dh != null) app.heatBuffer += -dh * 1000 * dn;      // 吸热为正 → 温度下降
    app.events.push({ t: 'dissolve', f: c.formula, mol: dn, dh: dh || 0 });
    if (c.mol <= 1e-9) c.mol = 0;
  });
  app.contents = app.contents.filter((c) => c.mol > 1e-12);   // 清掉溶解完的空壳
  crystallizeExcess(app);
}

/** 过饱和处理：水被蒸发掉以后，溶质超过该温度下的溶解度就以晶体析出；
 *  溶解的气体过饱和则逸出到气相（液体不做处理）。没有这一步，盐水会越蒸越浓，沸点飙到几百 K。
 *  （真实实验就是这个过程：蒸发浓缩 → 出现晶体 → 趁热过滤） */
function crystallizeExcess(app) {
  const V = waterVolume(app);
  if (!(V > 1e-12)) return;
  [...app.contents].forEach((c) => {
    if (!c.dissolved || c.formula === 'H2O') return;
    const s = _sub(c.formula);
    if (!s || !(s.M > 0) || s.st === 'l') return;
    let sol = s.solubility;
    if (sol === -1 || sol === -2) return;
    if (sol === Infinity) sol = 1000;
    if (sol == null) sol = 5;
    sol *= 1 + 0.02 * (app.temp - 298.15);
    const over = c.mol - ((sol * 10) / s.M) * V;
    if (over <= 1e-9) return;
    c.mol -= over;
    if (s.st === 'g') putGas(app, c.formula, over);            // 溶解的气体过饱和 → 逸出
    else {
      addContent(app, c.formula, over, 's', false);            // 溶质 → 晶体
      if (!app._cryLog || Lab.time - app._cryLog > 2) {
        app._cryLog = Lab.time;
        Lab.log.push({ k: 'clear', at: Lab.time, text: app.def.name + '：溶液已饱和，' + (s.name || c.formula) + ' 开始以晶体析出' });
      }
    }
    if (c.mol <= 1e-9) { const i = app.contents.indexOf(c); if (i >= 0) app.contents.splice(i, 1); }
  });
}

/* ------------------------------ 内容物操作 ------------------------------- */
function addContent(app, formula, mol, phase, dissolved) {
  const ex = app.contents.find((c) => c.formula === formula && c.phase === (phase || (subOf(formula) || {}).st) && !!c.dissolved === !!dissolved);
  if (ex) { ex.mol += mol; return ex; }
  const s = subOf(formula);
  const st = phase || (s ? s.st : 's');
  const entry = { formula, mol, phase: dissolved ? 'aq' : st, dissolved: !!dissolved, born: app.time };
  app.contents.push(entry);
  return entry;
}
function removeContent(app, formula, mol) {
  const c = app.contents.find((x) => x.formula === formula && x.mol > 0);
  if (!c) return;
  c.mol = Math.max(0, c.mol - mol);
  if (c.mol <= 1e-9) app.contents.splice(app.contents.indexOf(c), 1);
}
/** 容器里元素原子总数（守恒断言用） */
function atomTally(app) {
  const t = {}; 
  app.contents.forEach((c) => {
    const p = parseFormula(c.formula);
    p.atoms.forEach((n, sym) => { t[sym] = (t[sym] || 0) + n * c.mol; });
  });
  return t;
}

/* --------------------------------- 热量 ---------------------------------- */
function stepThermal(app, dt) {
  if (!Number.isFinite(app.temp)) app.temp = PHYS.T0;   // 自愈：任何非有限温度都拉回室温
  if (!Number.isFinite(app.heatBuffer)) app.heatBuffer = 0;
  const C = heatCapacity(app);
  let dQ = app.heatBuffer; app.heatBuffer = 0;
  const src = app.heater && app.heater.on ? app.heater : null;
  if (src) {
    const gap = src.flameT - app.temp;
    if (gap > 0) dQ += Math.min(src.power * (src.eff || PHYS.ETA_FLAME) * dt, C * gap);
  }
  dQ -= app.kCool * (app.temp - PHYS.T0) * dt;      // 牛顿冷却
  app.temp += dQ / C;

  // ---- 沸腾：多余能量全部用于汽化，温度锁在沸点 ----
  const w = waterMol(app);
  const bp = boilingPoint(app);
  if (w > 1e-9 && app.temp > bp) {
    const C2 = heatCapacity(app);
    const excess = (app.temp - bp) * C2;
    const hvapJ = (HVAP.H2O || 40.65) * 1000;
    const dn = Math.min(w, excess / hvapJ);
    app.temp = bp;
    if (dn > 0) {
      removeContent(app, 'H2O', dn);
      app.steamAccum += dn;
      app.events.push({ t: 'boil', mol: dn });
    }
    // 继续沸腾由后续供热推动（温度被锁在沸点，热量不断转成汽化）
    if (dn <= 1e-12 && src) {
      const dn2 = Math.min(w, src.power * (src.eff || PHYS.ETA_FLAME) * dt / hvapJ);
      if (dn2 > 0) { removeContent(app, 'H2O', dn2); app.steamAccum += dn2; app.events.push({ t: 'boil', mol: dn2 }); }
    }
  }
  // ---- 凝固：水结冰（放热） ----
  const fp = freezingPoint(app);
  if (w > 1e-9 && app.temp < fp) {
    const C2 = heatCapacity(app);
    const deficit = (fp - app.temp) * C2;
    const hfusJ = (HFUS.H2O || 6.01) * 1000;
    const dn = Math.min(w, deficit / hfusJ);
    if (dn > 0) { app.temp = fp; app.iceMol = (app.iceMol || 0) + dn; app.events.push({ t: 'freeze', mol: dn }); }
  }
  // ---- 干烧保护：容器耐温上限 ----
  if (app.temp > app.maxTemp) { app.temp = app.maxTemp; app.dryWarn = true; }
  // 玻璃器皿受热超过承受极限 → 炸裂（陶瓷的 breakT 比 maxTemp 高，所以永远不会触发）
  if (app.def.breakT && !app.broken && app.temp >= app.def.breakT) {
    breakVessel(app, '受热到 ' + Math.round(app.temp) + ' K（' + Math.round(app.temp - 273.15) + '°C），超过玻璃承受极限；干烧/不均匀受热必然炸裂');
  }
  if (waterMol(app) < 1e-9 && app.heater && app.heater.on) app.dryWarn = true;
  else if (waterMol(app) > 1e-9) app.dryWarn = false;
  // ---- 辐射散热让温度不会无限涨（大温差时冷却更快，已是线性近似） ----
  app.C = C;
  return app.temp;
}

/* --------------------------------- 反应 ---------------------------------- */
function stepChemistry(app, dt, env) {
  const contents = app.contents;
  const matches = dropWeakerTwins(matchReactions(contents, env), env);   // 互逆反应只留一条，免得来回翻
  const done = [];
  for (const mt of matches) {
    const r = applyReaction(mt, dt, waterMol(app) > 1e-9);   // 有水就是溶液态 → 用水合生成焓
    if (!r) continue;
    // 消耗：跨多条同种物质记录按化学计量精确扣除（同一物质可能同时有固体和已溶两份）
    r.consume.forEach(({ formula, mol }) => {
      let need = mol;
      for (let i = 0; i < contents.length && need > 1e-12; i++) {
        const c = contents[i];
        if (c.formula !== formula) continue;
        const take = Math.min(c.mol, need);
        c.mol -= take; need -= take;
      }
    });
    for (let i = contents.length - 1; i >= 0; i--) if (contents[i].mol <= 1e-12) contents.splice(i, 1);
    // 生成产物
    r.produce.forEach(({ formula, mol }) => {
      const s = subOf(formula);
      if (s.st === 'g') {
        // 可溶气体先溶进水里（NH3/HCl/CO2…），剩下的进容器气相，装不下才冒泡逸出
        const sol = s.solubility;
        const w = waterMol(app);
        let rest = mol;
        if (w > 0 && sol !== null && sol !== -1 && sol > 0.05) {
          const csat = (sol * 10) / s.M;
          const V = waterVolume(app);
          const cur = app.contents.filter((x) => x.formula === formula && x.dissolved).reduce((a, x) => a + x.mol, 0) / V;
          const dis = Math.min(mol, Math.max(0, (csat - cur) * V));
          if (dis > 1e-12) addContent(app, formula, dis, 'aq', true);
          rest = mol - dis;
        }
        if (rest > 1e-12) putGas(app, formula, rest);
      } else {
        // 在溶液里生成的可溶物应当直接溶在水里，而不是凭空变成一堆固体颗粒
        const w = waterMol(app);
        const dissolvable = s.st === 'aq' || (s.st !== 'l' && (s.solubility === Infinity
          || (typeof s.solubility === 'number' && s.solubility > 0.01)));
        const asDissolved = dissolvable && (s.st === 'aq' || w > 1e-9);
        addContent(app, formula, mol, asDissolved ? 'aq' : null, asDissolved);
      }
    });
    app.heatBuffer -= r.dH;                    // ΔH：负=放热 → 给体系加热（符号别写反）
    app.flash = Math.min(1, app.flash + Math.min(1, Math.abs(r.dH) / 4000) * (r.dH < 0 ? 1 : 0.25));
    app.events.push({ t: 'rxn', rx: r.rx, extent: r.extent, dH: r.dH });
    done.push(r);
    if (r.rx.gases.length) app.bubbleRate = Math.min(80, app.bubbleRate + 40 * r.extent * 20);
    if (r.rx.ppts.length) {
      app.pptRate = Math.min(60, app.pptRate + 40 * r.extent * 20);
      r.rx.ppts.forEach((f) => { const p = r.produce.find((x) => x.formula === f); if (p) { app.pptMade += p.mol; app.pptBy[f] = (app.pptBy[f] || 0) + p.mol; } });
    }
    if (r.rx.phen.includes('白烟') || r.rx.phen.includes('大量白烟')) app.smoke = Math.min(1.5, app.smoke + 0.6);
    if (r.rx.phen.some((p) => p.includes('火焰') || p.includes('白光') || p.includes('火星'))) app.flame = Math.min(1.6, app.flame + 0.8);
  }
  return done;
}

/* --------------------------------- pH ----------------------------------- */
/** 真实 pKa / pKb（第一个质子） */
const ACID_PKA = {
  HCl: -6.3, H2SO4: -3.0, HNO3: -1.4, HF: 3.17, H3PO4: 2.15, H2CO3: 6.35, H2S: 7.05, CH3COOH: 4.76, H2O2: 11.6,
  // 溶解在水里的酸性气体就是酸：CO₂ → 碳酸（pH≈3.9 饱和），SO₂ → 亚硫酸
  CO2: 6.35, SO2: 1.85,
};
const BASE_PKB = { NaOH: -0.6, KOH: -0.5, 'Ca(OH)2': -2.4, 'Ba(OH)2': -2.4, 'NH3·H2O': 4.75 };

function computePH(app) {
  const V = waterVolume(app);
  if (V < 1e-6) return null;
  let cH = 0, cOH = 0;
  app.contents.filter((c) => c.dissolved).forEach((c) => {
    const c0 = c.mol / V;
    const pKa = ACID_PKA[c.formula];
    if (pKa != null) {
      const ka = Math.pow(10, -pKa);
      cH += ka > 1 ? c0 : Math.sqrt(ka * c0);      // 强酸完全电离 / 弱酸近似
    }
    const pKb = BASE_PKB[c.formula];
    if (pKb != null) {
      const kb = Math.pow(10, -pKb);
      cOH += kb > 1 ? c0 : Math.sqrt(kb * c0);
    }
  });
  const net = cH - cOH;
  if (Math.abs(net) < 1e-12) return 7;
  const negLog = (x) => -Math.log10(Math.max(1e-15, Math.min(1, x)));
  return net > 0 ? negLog(net) : 14 - negLog(-net);
}
/** 指示剂颜色（真实变色范围：酚酞 8.2 无色→红，石蕊 5.5~7.5 红→蓝） */
function indicatorTint(app) {
  const ph = computePH(app);
  if (ph == null) return null;
  const has = (name) => app.contents.some((c) => c.dissolved && c.formula === name);
  if (has('酚酞')) return ph >= 8.2 ? '#e0409a' : null;
  if (has('石蕊')) return ph < 5.5 ? '#e04040' : ph > 7.5 ? '#4050e0' : '#8a5fbf';
  return null;
}

/* ------------------------------ 单步推进 -------------------------------- */
function worldStep(app, dt, env) {
  app.events = app.events.filter((e) => (app.time - (e.at || (e.at = app.time))) < 0.2);
  stepDissolution(app, dt);
  const rxns = stepChemistry(app, dt, env || { temp: app.temp });
  stepThermal(app, dt);
  app.time += dt;
  app.gasMol = app.gasBubbles.reduce((a, g) => a + g.mol, 0);
  return rxns;
}

/** 新建容器状态 */
function makeApparatus(def) {
  return {
    id: def.id, def, contents: [], temp: PHYS.T0, time: 0,
    glassMass: def.glassMass, kCool: def.kCool, maxTemp: def.maxTemp,
    heatBuffer: 0, heater: null, events: [], gasBubbles: [], steamAccum: 0, iceMol: 0,
    bubbleRate: 0, pptRate: 0, flash: 0, flame: 0, smoke: 0, dryWarn: false,
    gasVented: 0, pptMade: 0, gasOut: {}, pptBy: {}, elec: false,
    broken: false, brokenWhy: null, shards: [], meters: [], gauze: false, meas: {},
    stir: 0, ignited: false, stirrerOn: false, catalysts: new Set(),
    dirty: true, bubbles: [], ppts: [], steam: [], C: 0, gasMol: 0,
  };
}

/** 把「数值 + 单位」换算成 mol */
function amountToMol(formula, value, unit) {
  const s = subOf(formula); if (!s) return 0;
  if (unit === 'mol') return value;
  if (unit === 'g') return value / s.M;
  if (unit === 'mL') {                     // 体积：真实密度 × 质量分数换算（浓盐酸 37%、浓硫酸 98%）
    const d = subDensity(s) || 1.0;
    return (value * d * massFrac(formula)) / s.M;
  }
  return 0;
}

function addReagent(uid, formula, value, unit) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };
  const s = subOf(formula); if (!s) return { ok: false, why: '库里没有这种物质' };
  const mol = amountToMol(formula, value, unit || 'g');
  if (!Number.isFinite(mol) || !(mol > 0)) return { ok: false, why: '取用量无效（' + value + ' ' + (unit || 'g') + '）' };
  if (app.broken) return { ok: false, why: app.def.name + ' 已经炸裂了，先点「✕ 移除」再换一个' };
  if (s.st !== 'g' && shockCheck(app, mol * s.M)) return { ok: false, why: app.def.name + ' 在加料时骤冷炸裂了！' };
  const after = waterMol(app) + (formula === 'H2O' ? mol : 0);
  if (after * 18.015 > app.def.cap) return { ok: false, why: app.def.name + ' 装不下（容积 ' + app.def.cap + ' mL）' };
  // 气体：能溶的先溶，其余进容器气相（装不下才逸出）——「通入 CO₂」就是这条路
  if (s.st === 'g') {
    let rest = mol;
    if (s.solubility !== null && s.solubility > 0.05 && waterMol(app) > 0) {
      const V = waterVolume(app);
      const csat = (s.solubility * 10) / s.M;
      const cur = app.contents.filter((c) => c.formula === formula && c.dissolved).reduce((a, c) => a + c.mol, 0);
      const dis = Math.min(mol, Math.max(0, csat * V - cur));
      if (dis > 1e-12) addContent(app, formula, dis, 'aq', true);
      rest = mol - dis;
    }
    if (rest > 1e-12) putGas(app, formula, rest);
  } else if (formula === 'H2O' || s.st === 'l' || s.st === 'aq' || !app.contents.some((c) => c.formula === 'H2O')) {
    // 溶剂/液体/溶液，或干容器里直接投料：液体成相，固体先当未溶固体
    const liquid = (formula === 'H2O' || s.st === 'l' || s.st === 'aq') && !CATALYSTS.has(formula);
    addContent(app, formula, mol, liquid ? null : 's', false);
  } else {
    addContent(app, formula, mol, 's', false);
  }
  Lab.log.push({
    k: 'add', at: Lab.time,
    text: '往 ' + app.def.name + ' 里加入 ' + fmtAmount(s, value, unit) + ' ' + s.name
      + '（' + prettyFormula(s.formula) + (s.alias ? '，俗名 ' + s.alias.split('、')[0] : '') + '）',
  });

  return { ok: true, mol };
}
