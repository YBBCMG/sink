      + '<button data-op="mount">⬆ 架上来</button><button data-op="deltool">✕ 收走</button>'
    : isMeter
      ? (attached
        ? '<button data-op="unmount" class="on">⏏ 从 ' + attached.def.name + ' 拔出</button><button data-op="deltool">✕ 收走</button>'
        : '<button data-op="mount"' + (sel ? '' : ' disabled') + '>⬇ 插进' + (sel ? sel.def.name : '（先加容器）') + '</button><button data-op="deltool">✕ 收走</button>')
      : isGauze
        ? (t.app ? '<button data-op="unmount" class="on">⏏ 从 ' + ((Lab.apps.find((a) => a.uid === t.app) || {}).def || {}).name + ' 拿开</button><button data-op="deltool">✕ 收走</button>'
          : '<button data-op="mount"' + (sel ? '' : ' disabled') + '>⬇ 垫到' + (sel ? sel.def.name + '下' : '（先加容器）') + '</button><button data-op="deltool">✕ 收走</button>')
        : isStand
          ? ((standAppOf(t) ? '<button data-op="unslotapp">⬆ 取回上格容器</button>' : '<button data-op="slotapp">⬆ 上格放容器</button>')
            + (standLampOf(t)
              ? '<button data-op="light"' + (standLampOf(t).on ? ' class="on"' : '') + '>🔥 ' + (standLampOf(t).on ? '熄灭' : '点燃') + '</button>'
                + '<button data-op="unslotlamp">⬇ 取出热源</button>'
              : '<button data-op="slotlamp">⬇ 下格放热源</button>')
            + '<button data-op="deltool">✕ 收走</button>')
          : isRod
            ? (t.app
              ? '<button data-op="unmount" class="on">⏏ 从 ' + ((Lab.apps.find((a) => a.uid === t.app) || {}).def || {}).name + ' 拔出</button><button data-op="deltool">✕ 收走</button>'
              : '<button data-op="mount"' + (sel ? '' : ' disabled') + '>⬇ 插进' + (sel ? sel.def.name : '（先加容器）') + '</button><button data-op="deltool">✕ 收走</button>')
            : isSplint
              ? '<button data-op="splintlight"' + (t.lit ? ' class="on"' : '') + '>' + (t.lit ? '💨 吹灭木条' : '🔥 点着木条') + '</button>'
                + '<button data-op="probe">🔎 伸进容器检验</button><button data-op="deltool">✕ 收走</button>'
              : '<button data-op="deltool">✕ 收走</button>';
  card.innerHTML = '<div class="toolhead dragbar" title="按住这里拖动这件器材"><b>' + t.def.icon + ' ' + t.def.name + '</b><span class="uid">' + t.uid + '</span></div>'
    + '<canvas class="toolcv"></canvas>'
    + '<div class="ops">' + ops + '</div>'
    + '<div class="toolmeta" title="' + t.def.name + '：' + (t.def.desc || (t.def.power + ' W，火焰最高 ' + K2C(t.def.flameT) + ' °C，燃料 ' + t.def.fuel)) + '">'
    + meta + '</div>';
  card.querySelectorAll('.ops button').forEach((b) => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (b.dataset.op === 'light') {
      const lt = isStand ? standLampOf(t) : t;                  // 铁架台：点燃的是下格里的酒精灯
      if (lt) lightTool(lt.uid, !lt.on); else toast('下格还没有酒精灯');
      renderBench(true); updateReadouts();
    }
    else if (b.dataset.op === 'rig') {                          // 一键配齐：铁架台 + 石棉网 + 下格酒精灯
      const r = assembleRig(t.uid);
      toast(r.ok ? '铁架台 + 石棉网 + 下格' + r.lamp.def.name + '都齐了，' + r.app.def.name + '开始受热' : r.why);
      renderBench(true); updateReadouts();
    }
    else if (b.dataset.op === 'slotapp') {                      // 上格：放一个空着的容器
      const app = Lab.apps.find((a) => a.uid === Lab.selected && !standOf(a)) || Lab.apps.find((a) => !standOf(a));
      if (!app) { toast('台面上没有空着的容器 —— 先点左上「放一个」烧杯/锥形瓶'); return; }
      const r = placeOn(app.uid, t.uid);
      if (r.ok) {
        Lab.selected = app.uid;
        const lamp = standLampOf(t);
        toast(app.def.name + ' 放进铁架台上格了' + (lamp ? (lamp.on ? '，下格' + lamp.def.name + '正在加热' : '，下格' + lamp.def.name + '还没点着') : '，下格还空着 —— 点「⬇ 下格放热源」'));
      } else toast(r.why);
      renderBench(true); updateReadouts(); return;
    }
    else if (b.dataset.op === 'unslotapp') {
      const a = standAppOf(t); if (a) { placeOn(a.uid, null); toast(a.def.name + ' 取回台面'); }
      renderBench(true); updateReadouts(); return;
    }
    else if (b.dataset.op === 'slotlamp') {                     // 下格：放一件**台面上已有**的热源（酒精灯/本生灯/喷灯/电热板）
      const heat = Lab.tools.find((x) => x.kind === 'heat' && !x.def.big && !x.lampStand)
        || Lab.tools.find((x) => x.kind === 'heat' && !x.def.big);
      if (!heat) { toast('还差一件热源 —— 先在左侧「器材」里摆上 🕯 酒精灯（或本生灯 / 喷灯）'); return; }
      const r = slotLamp(t.uid, heat.uid);
      toast(r.ok ? '把 ' + heat.def.name + ' 放进下格了' + (heat.on ? '' : ' —— 点「🔥 点燃」')
        : (r.why || '放不进去'));
      renderBench(true); updateReadouts(); return;
    }
    else if (b.dataset.op === 'unslotlamp') {
      slotLamp(t.uid, null); toast('热源取回台面');
      renderBench(true); updateReadouts(); return;
    }
    else if (b.dataset.op === 'unmount') { placeOn(t.app, null); toast(t.def.name + ' 已拿开'); renderBench(true); updateReadouts(); }
    else if (b.dataset.op === 'splintlight') { lightSplint(t.uid, !t.lit); toast(t.lit ? '木条点着了 —— 用「🔎 伸进容器检验」' : '木条吹灭了'); renderBench(true); updateReadouts(); return; }
    else if (b.dataset.op === 'probe') { askProbe(t); return; }
    else if (b.dataset.op === 'mount') {
      if (t.kind !== 'heat') {                                   // 测量/辅助器材：认"当前选中的容器"
        const app = Lab.apps.find((a) => a.uid === Lab.selected) || Lab.apps[0];
        if (!app) { toast('先在工作台上加一个容器'); return; }
        const r = placeOn(app.uid, t.uid);
        if (r.ok) {
          Lab.selected = app.uid;
          toast(t.hid === 'gauze' ? '石棉网垫在 ' + app.def.name + ' 下面了 —— 现在可以用明火加热'
            : t.hid === 'rod' ? '🥢 玻璃棒插进 ' + app.def.name + ' 了 —— 点容器的「🌀 搅拌」，溶解速率 ×1.8'
              : t.def.name + ' 插进 ' + app.def.name + ' 了 —— 点容器的「📏 测量」读数');
        } else toast(r.why);
        renderBench(true); updateReadouts(); return;
      }
      const app = mountTarget(t);
      if (!app) { toast('台面上没有可以架上去的容器（都架着了？先加一个仪器）'); return; }
      const r = placeOn(app.uid, t.uid);
      if (r.ok) { Lab.selected = app.uid; toast('把 ' + app.def.name + ' 架到 ' + t.def.name + ' 上了' + (t.on ? '，正在加热' : '，记得点着它')); }
      else toast(r.why);
      renderBench(true); updateReadouts();
    }
    else { delTool(t.uid); renderBench(true); updateReadouts(); }
  }));
  card.addEventListener('click', (ev) => {
    if (ev.target.closest('button')) return;
    const a = occupantOf(t); if (a) { Lab.selected = a.uid; renderBench(true); updateReadouts(); }
  });
  attachDrag(card, t, 'heat');
  t.canvas = card.querySelector('canvas');
  return card;
}

/* ------------------------------ 拖拽摆放 -------------------------------- */
/* 拖动进行中：这一帧不要重建台面。
   renderBench(false) 每帧按签名决定要不要重画，而拖动会改 item.x → 签名变 → 台面重建 →
   被拖的卡片、提示条、高亮当场被换成新元素，pointermove 还在旧元素上，拖拽就"没反应"了。
   （B28：真因在这里，不是事件没到。） */
let dragActive = false;
/* 拖动时悬停的"落点提示条" */
function dragTipEl() {
  let el = document.getElementById('dragtip');
  if (!el) { el = mk('div', 'dragtip'); el.id = 'dragtip'; (benchEl() || document.body).appendChild(el); }
  return el;
}
/** 水平方向最近、且槽位空着的铁架台（容器 → 上格；热源 → 下格） */
function nearestStand(item, forWhat) {
  let best = null, bd = 96;
  Lab.tools.forEach((t) => {
    if (t.hid !== 'stand') return;
    if (forWhat === 'app' && occupantOf(t, item)) return;          // 上格已经占了别的容器
    if (forWhat === 'heat' && standLampOf(t)) return;              // 下格已经有热源
    const d = Math.abs((t.x + toolW(t) / 2) - (item.x + (forWhat === 'app' ? ITEM_W.app : toolW(item)) / 2));
    if (d < bd) { bd = d; best = t; }
  });
  return best;
}
/** 离器材最近的容器（横向够近就算"拖到它上面"） */
function nearestApp(tool) {
  let best = null, bd = 70;
  Lab.apps.forEach((a) => {
    const d = Math.abs((a.x + ITEM_W.app / 2) - (tool.x + toolW(tool) / 2));
    if (d < bd) { bd = d; best = a; }
  });
  return best;
}
/** 松手时会做什么：拖拽的全部落点规则集中在这里（高亮和提示都读它） */
function dragCandidate(item, kind) {
  if (kind === 'app') {
    const own = item.standOn ? toolByUid(item.standOn) : null;      // 它现在待着的架子——拖动 = 取下来，不是原地弹回
    const st = nearestStand(item, 'app');
    if (st && st.uid !== item.standOn) return { act: 'standUpper', tool: st, text: '松手 → 把 ' + item.def.name + ' 放进铁架台上格' };
    const t = nearestTool(item);
    if (t && t.hid !== 'stand' && t.uid !== item.standOn) {
      return { act: 'placeOn', tool: t, text: t.kind === 'heat'
        ? '松手 → 把 ' + item.def.name + ' 架到 ' + t.def.name + ' 上（点着就能加热）'
        : '松手 → 把 ' + item.def.name + ' 装到 ' + t.def.name + ' 上' };
    }
    if (own) return { act: 'free', text: '松手 → 把 ' + item.def.name + ' 从 ' + own.def.name + ' 上取下来，摆在台面这个位置' };
    return { act: 'free', text: '松手 → ' + item.def.name + ' 摆在台面这个位置' };
  }
  if (item.kind === 'heat') {
    const st = nearestStand(item, 'heat');
    if (st) return { act: 'standLower', tool: st, text: '松手 → 把 ' + item.def.name + ' 放进铁架台下格' };
    return { act: 'free', text: '松手 → ' + item.def.name + ' 摆在台面（拖到容器上方可「架上来」）' };
  }
  if (item.hid === 'stand' && occupantOf(item)) {
    return { act: 'free', text: '松手 → ' + item.def.name + ' 连上面的 ' + occupantOf(item).def.name + ' 一起挪到这儿' };
  }
  const a = nearestApp(item);
  if (a) {
    const verb = item.hid === 'gauze' ? '垫到 ' + a.def.name + ' 下面（垫了才能受热均匀）'
      : item.hid === 'rod' ? '插进 ' + a.def.name + '（可以搅拌了）'
        : item.kind === 'meter' ? '插进 ' + a.def.name + ' 就能读数'
          : '装到 ' + a.def.name + ' 上';
    return { act: 'mount', app: a, text: '松手 → 把 ' + item.def.name + ' ' + verb };
  }
  return { act: 'free', text: '松手 → ' + item.def.name + ' 摆在台面这个位置' };
}
function attachDrag(card, item, kind) {
  const bar = card.querySelector('.dragbar'); if (!bar) return;
  /* 第十一轮：整张卡片都能拖（用户："所有东西都可以拖动，方便整理桌面"）。
     但控件上的按下不算拖拽 —— 按钮 / 读数行（点一下自动插量具）/ 用量框 / 下拉框 / 输入框各有各的活。 */
  const isCtl = (el) => !!(el && el.closest && el.closest('button, input, select, textarea, a, .readouts, .ops, .amtbox, .chips, .logrow'));
  card.addEventListener('pointerdown', (ev) => {
    if (ev.button !== 0) return;
    if (isCtl(ev.target)) return;
    ev.preventDefault(); ev.stopPropagation();
    const bench = benchEl();
    const bw = Math.max(160, bench.clientWidth);
    const w = kind === 'heat' ? toolW(item) : ITEM_W.app;
    const startX = ev.clientX, origX = item.x;
    let moved = false, cand = null;
    dragActive = true;
    const tip = dragTipEl();
    card.setPointerCapture(ev.pointerId);
    card.classList.add('dragging');
    const paint = () => {                                        // 落点高亮 + 提示条
      document.querySelectorAll('.toolcard.over, .appcard.over').forEach((c) => c.classList.remove('over'));
      if (cand && cand.tool) { const c = document.querySelector('.toolcard[data-uid="' + cand.tool.uid + '"]'); if (c) c.classList.add('over'); }
      if (cand && cand.app) { const c = document.querySelector('.appcard[data-uid="' + cand.app.uid + '"]'); if (c) c.classList.add('over'); }
      if (!moved) { tip.classList.remove('show'); return; }
      tip.textContent = cand ? cand.text : '';
      tip.classList.add('show');
      tip.style.left = Math.max(4, Math.min(bw - 210, item.x)) + 'px';
      tip.style.top = '6px';        // 固定贴在台面顶端：offsetTop 的参照系不稳，别拿它算垂直位置
      tip.style.bottom = 'auto';
    };
    const move = (e) => {
      const dx = e.clientX - startX;
      if (!moved && Math.abs(dx) > 2) {
        moved = true;
        /* 第十一轮：架在铁架台/热源上的容器，一开始拖就先"端下来"——否则它会一直挂在架子上，
           卡片却跟着指针跑，看着就像"烧杯被铁架台拖着走"。只是点一下（没动）不会端下来。 */
        if (kind === 'app' && item.standOn) detachApp(item);
      }
      item.x = Math.max(2, Math.min(bw - w - 2, origX + dx));
      card.style.left = item.x + 'px';
      cand = dragCandidate(item, kind);
      paint();
    };
    const up = () => {
      card.removeEventListener('pointermove', move);
      card.removeEventListener('pointerup', up);
      card.classList.remove('dragging');
      document.querySelectorAll('.toolcard.over, .appcard.over').forEach((c) => c.classList.remove('over'));
      tip.classList.remove('show');
      dragActive = false;
      if (!moved) {                                  // 只是点了一下 = 选中
        if (kind === 'app') Lab.selected = item.uid;
        else { const a = occupantOf(item); if (a) Lab.selected = a.uid; }
        renderBench(true); updateReadouts(); return;
      }
      const c2 = cand || dragCandidate(item, kind);
      if (c2.act === 'standUpper') { const r = placeOn(item.uid, c2.tool.uid); toast(r.ok ? item.def.name + ' 放进铁架台上格了 —— 下格要放热源、器皿下垫石棉网' : r.why); renderBench(true); updateReadouts(); return; }
      if (c2.act === 'standLower') { const r = slotLamp(c2.tool.uid, item.uid); toast(r.ok ? item.def.name + ' 放进铁架台下格了 —— 点「🔥 点燃」开始加热' : (r.why || '放不进去')); renderBench(true); updateReadouts(); return; }
      if (c2.act === 'mount' || c2.act === 'placeOn') {
        const r = placeOn(c2.act === 'mount' ? c2.app.uid : item.uid, c2.act === 'mount' ? item.uid : c2.tool.uid);
        if (r.ok) Lab.selected = c2.act === 'mount' ? c2.app.uid : item.uid;
        toast(r.ok ? '装好了' : r.why);
        renderBench(true); updateReadouts(); return;
      }
      if (kind === 'app') dropApp(item); else dropTool(item);
    };
    card.addEventListener('pointermove', move);
    card.addEventListener('pointerup', up);
  });
}

/** 离这个容器最近的、还没被占用的器材（横向距离够近就算"放上去"） */
function nearestTool(app) {
  const maxD = 78; let best = null, bd = 1e9;
  Lab.tools.forEach((t) => {
    if (t.lampStand) return;                                   // 在下格里的酒精灯不接收"架上来"
    const d = Math.abs((t.x + toolW(t) / 2) - (app.x + ITEM_W.app / 2));
    if (d < maxD && d < bd && !occupantOf(t, app)) { bd = d; best = t; }
  });
  return best;
}
/** 从架子上取下来：只断"架子 + 石棉网"，插着的温度计/pH 计/玻璃棒跟着容器走（它们是在容器里的） */
function detachApp(app) {
  const own = app.standOn ? toolByUid(app.standOn) : null;
  if (!own) return false;
  app.standOn = null;
  if (app.gauze) {
    Lab.tools.forEach((t) => { if (t.hid === 'gauze' && t.app === app.uid) t.app = null; });
    app.gauze = false;                                            // 石棉网留在架子上，不跟着容器跑
  }
  Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + app.def.name + ' ' + app.uid + ' 从 ' + own.def.name + ' 上取下来' });
  repackBench(); syncHeaters();
  return true;
}
function dropApp(app) {
  const t = nearestTool(app);
  if (t && t.uid !== app.standOn) {
    const r = placeOn(app.uid, t.uid);
    if (r.ok) toast('把 ' + app.def.name + ' 架到 ' + t.def.name + ' 上了' + (t.on ? '，正在加热' : '，记得点着它'));
    else toast(r.why);
  } else if (detachApp(app)) { toast(app.def.name + ' 从架子上取下来了，摆在台面这个位置'); }
  else Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + app.def.name + ' ' + app.uid + ' 挪到台面另一处' });
  renderBench(true); updateReadouts();
}
function dropTool(t) {
  Lab.apps.forEach((a) => { if (a.standOn === t.uid) a.x = t.x; });     // 架在它上面的容器跟着走
  renderBench(true); updateReadouts();
}

/** 点器材上「⬆ 架上来」时，架谁上去：优先当前选中的容器，否则挑第一个空着的 */
function mountTarget(t) {
  const free = (a) => a && !a.broken && (!a.standOn || a.standOn === t.uid) && !occupantOf(t, a);
  const sel = selectedApp();
  if (free(sel)) return sel;
  return Lab.apps.find((a) => free(a)) || null;
}

/** 卡片底部那行"现在被什么加热"的状态 */
function updateHeatStatus() {
  Lab.apps.forEach((app) => {
    const card = document.querySelector('.appcard[data-uid="' + app.uid + '"]'); if (!card) return;
    const row = card.querySelector('.heatrow'); if (!row) return;
    const t = standOf(app), h = app.heater;      // app.heater 是"真正在加热它的东西"（铁架台会指向下格的酒精灯）
    if (h && h.blocked) {                        // 明火 + 玻璃器皿：器材不齐 = 一点热都不给
      const txt0 = '<span class="lbl blk">⛔ ' + (h.blocked === 'directFlame'
        ? app.def.name + ' 不能直接架在' + h.name + '上（明火直烧玻璃会炸）'
        : '铁架台上还差一张石棉网') + '</span>'
        + '<i>要「🗼 铁架台（上格放器皿）+ 🕸 石棉网 + 🕯 酒精灯（下格）」三件齐了才传热'
        + (h.blocked === 'directFlame' ? '｜最快：选中器皿后点酒精灯卡片上的「🗼 配铁架台」' : '｜点石棉网卡片的「⬇ 垫到' + app.def.name + '下」') + '</i>';
      if (row._sig !== txt0) { row.innerHTML = txt0; row._sig = txt0; }
      return;
    }
    const txt = (h && h.on)
      ? '<span class="lbl hot">' + h.icon + ' ' + h.name + (h.viaStand ? '（在铁架台下格）' : '') + ' 正在加热</span>'
        + '<i>火焰 ' + K2C(h.flameT) + '°C · 传给容器约 ' + Math.round(h.power * (h.eff || 0.3)) + ' W'
        + (h.meshMissing ? '｜⚠ 没垫石棉网，传热效率减半' : '') + '</i>'
      : (t
        ? '<span class="lbl">' + (t.hid === 'stand'
          ? '🗼 架在铁架台上格' + (standLampOf(t) ? '（下格酒精灯还没点着）' : '（下格还没放酒精灯）')
          : t.def.icon + ' 架在 ' + t.def.name + ' ' + t.uid + ' 上（还没点着）') + '</span><i>点器材上的「🔥 点燃」</i>'
        : '<span class="lbl">未加热</span><i>把酒精灯等器材拖到它下面就能加热</i>');
    if (row._sig !== txt) { row.innerHTML = txt; row._sig = txt; }
  });
}

function opClick(app, op) {
  Lab.selected = app.uid;
  if (op === 'ignite') ignite(app.uid);
  else if (op === 'stir') { stir(app.uid); renderBench(true); }
  else if (op === 'clear') clearApp(app.uid);
  else if (op === 'del') { removeApp(app.uid); renderBench(true); }
  else if (op === 'measure') measure(app);
  else if (op === 'conc') { app.acidConc = app.acidConc === 'conc' ? 'dil' : 'conc'; renderBench(true); }
  else if (op === 'unmount') { placeOn(app.uid, null); toast(app.def.name + ' 放回台面'); renderBench(true); }
  else if (op === 'submerge') {
    const r = submergeJar(app.uid, (troughApp() || {}).uid);
    if (!r.ok) toast(r.why);
    renderBench(true);
  }
  else if (op === 'liftjar') {
    const r = liftJar(app.uid);
    toast(r.ok ? '取出集气瓶：瓶内收集到 ' + round(r.ml, 1) + ' mL 气体' : r.why);
    renderBench(true);
  }
  else if (op === 'power') { const r = setPower(app.uid, !app.elec); if (!r.ok) toast(r.why); renderBench(true); }
  else if (op === 'pour' || op === 'filter' || op === 'gas') askTarget(app, op);
  updateReadouts();
}

/** 选目标容器的小对话框（倾倒 / 过滤 / 导气共用） */
const OP_INFO = {

};
/** 关掉任何打开着的弹窗（用量弹窗 / 目标选择弹窗）—— 键盘 Esc、点遮罩、脚本清场都走它 */

/** 木条检验：把燃着的木条伸进哪个容器（氧气 → 复燃；二氧化碳 → 熄灭） */
function askProbe(t) {

function askTarget(app, op) {

function measure(app) {

/* --------------------- 缺量器？点读数行直接摆出来 ------------------------ */
/** 想量某一项但台面上没有量器：**量具得玩家自己从器材行拿**（第十一轮：所有东西都手动拿）。
 *  只有手把手课程"自动做一步"时才代取。 */
function ensureMeter(app, kind, thenMeasure) {
  const def = METERS.find((m) => m.measures === kind); if (!def || !app) return null;
  let t = meterOn(app, kind);
  let made = false;
  if (!t) {
    t = Lab.tools.find((x) => x.kind === 'meter' && x.def.measures === kind) || null;
    if (!t && !window._tutAuto) {
      toast('还差 ' + def.icon + ' ' + def.name + '：先到「器材」行点一下把它拿上台面，再点这一行读数 —— 读数不白送');
      return null;
    }
    if (!t) { t = addTool(def.id); made = true; }
  }
  if (!t) { toast('台面上已经摆了 6 件器材，先收走一件再摆' + def.name); return null; }
  if (def.attach && app.meters.indexOf(t.uid) < 0) {
    const r = placeOn(app.uid, t.uid);
    if (!r.ok) { toast(r.why); return t; }
  }
  Lab.selected = app.uid;
  toast((made ? '摆出 ' + def.name + '，' : '') + (def.attach ? '插进 ' + app.def.name + ' 了' : '台面上已有 ' + def.name)
    + ' —— 这就给你读数');
  if (thenMeasure) { renderBench(true); updateReadouts(); measure(app); }
  return t;
}

/* ------------------------------ 读数刷新 --------------------------------- */
function updateReadouts() {
  Lab.apps.forEach((app) => {
    const card = document.querySelector('.appcard[data-uid="' + app.uid + '"]');
    if (!card) return;
    card.classList.toggle('sel', Lab.selected === app.uid);
    const ro = card.querySelector('.readouts');
    const ph = computePH(app);
    const liq = app.contents.filter((c) => c.dissolved);
    const solid = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
    const gas = app.gasBubbles.concat(app.contents.filter((c) => c.dissolved && subOf(c.formula).st === 'g'));
    const cTxt = (n) => (n >= 0.01 ? round(n, 3) : n.toExponential(1));
    const cNm = (f) => '<b class="cnm" title="' + esc(subFull(f)) + '">' + esc(subName(f)) + '</b> <code>' + esc(f) + '</code>';
    /* 读数不再是白送的：容器上只写"测没测过"，数值要拿量器量（温度计/量筒/pH 计/天平） */
    /* 插在容器里的温度计 / pH 计是"一直泡着"的 —— 它们给的是实时读数；
       天平、量筒只给一次快照，内容变了就得重测 */
    const liveText = (kind) => {
      if (kind === 'temp') return K2C(app.temp) + ' °C';
      if (kind === 'ph') {
        const ph = computePH(app);
        if (ph == null) return null;
        return round(ph, 2) + (ph > 7.8 ? '（碱性）' : ph < 6.5 ? '（酸性）' : '（中性）');
      }
      return null;
    };
    const mrow = (icon, label, kind, need) => {
      const m = app.meas && app.meas[kind];
      const fresh = m && m.sig === appSig(app);
      const has = !!meterOn(app, kind) || (kind === 'mass' && !!meterOnBench(kind));
      const live = meterOn(app, kind) ? liveText(kind) : null;
      const title = kind === 'temp' ? '当前 ' + round(app.temp, 2) + ' K —— 温度计只要插在容器里就是实时读数'
        : kind === 'ph' ? '当前 pH ' + (computePH(app) == null ? '测不出（没有水溶液）' : round(computePH(app), 2)) + ' —— pH 计插在溶液里就是实时读数'
        : need + ' —— 点这一行直接把量器摆出来并读数';
      const wide = kind === 'temp' || (kind === 'ph' && (!!live || !!m)) || (kind === 'mass' && !!m);  // 窄格放不下「0.22（酸性）需重测」，这几行占整行
      return '<button class="mi' + (has ? '' : ' lack') + (wide ? ' wide' : '') + '" data-needm="' + kind + '" title="' + esc(title) + '">'
        + '<i>' + icon + '</i>' + label + ' '
        + (live ? '<b class="mv">' + esc(live) + '</b><u class="live">实时</u>'
          : m ? '<b class="' + (fresh ? 'mv' : 'stale') + '">' + esc(fresh ? m.text : m.text + '（需重测）') + '</b>'
            : '<b class="un">未测</b>')
        + (has ? '' : '<u class="need">' + esc(need) + '</u>') + '</button>';
    };
    /* 内容物搬到卡片最上方（.contbar）：定高 + 滚动，攒多少气体都不会盖住瓶身和读数 */
    const gasShow = gas.slice(0, 3), gasMore = gas.length - gasShow.length;
    const contHTML = (liq.filter((c) => c.formula !== 'H2O').length || waterMol(app) > 1e-9
      ? '<div class="contents"><i>溶液：</i>' + (waterMol(app) > 1e-9 ? '水（溶剂）　' : '')
        + liq.filter((c) => c.formula !== 'H2O').map((c) => cNm(c.formula)).join('，') + '</div>' : '')
      + (solid.length ? '<div class="contents"><i>固体：</i>' + solid.slice(0, 3).map((c) => cNm(c.formula) + (c.dissolved ? '' : '（未溶）')).join('，')
        + (solid.length > 3 ? '，等 ' + solid.length + ' 种' : '') + '</div>' : '')
      + (gas.length ? '<div class="contents gas"><i>气体：</i>' + gasShow.map((g) => cNm(g.f || g.formula)).join('，')
        + (gasMore > 0 ? '，等 ' + gas.length + ' 种' : '') + '</div>' : '')
      + (app.dryWarn && !app.broken ? '<div class="warn">⚠ 干烧！容器里没有液体了</div>' : '');
    const cb = card.querySelector('.contbar');
    if (cb && cb._sig !== contHTML) { cb.innerHTML = contHTML; cb._sig = contHTML; }
    const html = '<div class="ro meas">' + mrow('🌡', '温度', 'temp', '需温度计')
      + mrow('⚖', '质量', 'mass', '需天平')
      + mrow('📐', '体积', 'vol', '需量筒')
      + mrow('🖊', 'pH', 'ph', '需 pH 计') + '</div>';
    if (app.broken) {
      card.classList.add('broken');
      const bh = '<div class="warn big">❌ 已炸裂：' + esc(app.brokenWhy || '受热/骤冷超过玻璃承受极限') + '</div>'
        + '<div class="contents"><i>提示：</i>内容物已洒掉。玻璃器皿不能干烧，也不能趁热倒冷水 —— 点「✕ 移除」清理碎片</div>';
      if (ro._sig !== bh) { ro.innerHTML = bh; ro._sig = bh; }
      return;
    }
    card.classList.remove('broken');
    if (ro._sig !== html) { ro.innerHTML = html; ro._sig = html; }
    card.querySelectorAll('.ops button').forEach((b) => {
      if (b.dataset.op === 'stir') b.classList.toggle('on', !!app.stirrerOn);
      if (b.dataset.op === 'conc') b.classList.toggle('on', app.acidConc === 'conc');
    });
  });
  updateHeatStatus();
  $('#apparatusCount').textContent = Lab.apps.length + ' / 6';
  const tc = $('#toolCount'); if (tc) tc.textContent = Lab.tools.length + ' / 6';
}

/* -------------------------------- 存档 --------------------------------- */
const SAVE_KEY = 'chemlab.v01';
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      guideOn: Lab.guideOn, taskDone: Lab.taskDone, discovered: [...Lab.discovered],
      apps: Lab.apps.map((a) => ({ def: a.def.id, b: a.broken ? 1 : 0, contents: a.contents.map((c) => ({ f: c.formula, m: c.mol, d: c.dissolved })) })),
      made: [...(Lab.madeEver || [])],
    }));
  } catch (e) { /* file:// 下 localStorage 可能不可用，静默降级 */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const s = JSON.parse(raw);
    Lab.guideOn = s.guideOn !== false;
    Lab.taskDone = s.taskDone || {};
    (s.discovered || []).forEach((k) => Lab.discovered.add(k));
    (s.made || []).forEach((k) => Lab.madeEver.add(k));
    (s.apps || []).slice(0, 3).forEach((a) => {
      const app = addApparatus(a.def); if (!app) return;
      if (a.b) breakVessel(app, '上次实验里炸裂的容器');
      (a.contents || []).forEach((c) => { if (subOf(c.f)) addContent(app, c.f, c.m, null, c.d); });
    });
    return true;
  } catch (e) { return false; }
}

/* -------------------------------- 提示 --------------------------------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ------------------------------- 主循环 -------------------------------- */
/** 时间倍率：物理一点没改，只是把同一段时间快点过完（蒸发/结晶这类真实验要等几分钟的步骤，调到 ×60 就能几秒看完） */
const SPEEDS = [1, 5, 20, 60];
let lastT = 0, acc = 0;
function frame(now) {
  const dtReal = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  acc += dtReal;
  const step = 1 / 60;
  const sp = Math.max(1, Math.min(SPEEDS[SPEEDS.length - 1], Lab.speed || 1));
  let guard = 0;
  if (Lab.paused) acc = 0;                        // 暂停：物理/化学停在这里，渲染与 UI 照常（看得见状态）
  else while (acc >= step && guard++ < 4) { for (let k = 0; k < sp; k++) labStep(step); acc -= step; }
  Lab.apps.forEach((app) => { initViewState(app); if (app.canvas) renderApparatus(app.canvas, app, dtReal); });
  Lab.tools.forEach((t) => { if (t.canvas) renderTool(t.canvas, t, dtReal); });
  renderFx();                                        // 第九轮：白光/爆炸要漫出容器小画布
  if (!dragActive) renderBench(false);               // 拖拽中不重建台面（见 dragActive 注释）
  updateReadouts(); flushLog(); renderTasks(); tutTick(dtReal);
  if (Lab.dirtySave || (Lab.time % 5) < 0.02) { save(); Lab.dirtySave = false; }
  requestAnimationFrame(frame);
}

/* -------------------------------- 启动 --------------------------------- */

    $('#speedBtn').textContent = '⏩ 时间 ×' + Lab.speed;

  });

  });
  $('#shelfSearch').addEventListener('input', buildShelf);
  /* 空格 = 暂停 / 继续；F = 全屏（在输入框里打字时不抢键） */
  const typing = (el) => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
  $('#pauseBtn').addEventListener('click', () => setPaused(!Lab.paused));
  $('#fsBtn').addEventListener('click', () => toggleFull());
  document.addEventListener('fullscreenchange', () => {
    const b = $('#fsBtn'); if (b) b.textContent = document.fullscreenElement ? '⛶ 退出全屏' : '⛶ 全屏';
  });
  document.addEventListener('keydown', (ev) => {
    if (typing(ev.target) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.code === 'Space' || ev.key === ' ') {
      ev.preventDefault();
      setPaused(!Lab.paused);
    } else if (ev.key === 'f' || ev.key === 'F') {
      ev.preventDefault(); toggleFull();
    }
  });
  $('#bench').addEventListener('click', (ev) => {                 // 点读数行 = 缺什么补什么

    const app = appByUid(card.dataset.uid); if (!app) return;

/* ============================================================================
 * 08-tutorial.js —— 初中化学实验教程（人教九上 + 九下）
 *   22 个教材经典实验，每个实验配完整步骤 + 名称对照表；每一步都从真实状态自动判定
 *   （不是"点了就算"，而是真的检测容器里的物质、温度、气体、pH、过滤结果）

/* --------------------------- 判定工具（只看真实状态） ---------------------- */
const tutApp = (i) => appByUid(Lab.tut.uids[i] || '');
const tutUid = (i) => (Lab.tut.uids[i] || '');
const norm2 = (s) => s.split(',').map((x) => x.trim()).sort().join(',');
/* 注意：判定一律看"工作台当前状态"（容器是开始实验时新建的，所以天然是本次实验的净结果），
   不用 Lab.discovered —— 那是全局积累的，别的实验做过同样的反应会把它提前点亮。 */
const anyHas = (f, min) => Lab.apps.some((a) => a.contents.some((c) => c.formula === f && c.mol > (min || 1e-6)));
/** 容器里某物质的**未溶解**部分（mol）—— 判"饱和/有晶体析出"用 */
const crysMol = (app, f) => (app ? app.contents.filter((c) => c.formula === f && !c.dissolved).reduce((s, c) => s + c.mol, 0) : 0);
const appHas = (app, f, min) => !!app && app.contents.some((c) => c.formula === f && c.mol > (min || 1e-6));
const dissolved = (app, f, min) => !!app && app.contents.some((c) => c.formula === f && c.dissolved && c.mol > (min || 1e-6));
const solMol = (app, f) => (app ? app.contents.filter((c) => c.formula === f).reduce((s, c) => s + c.mol, 0) : 0);
const gasNew = (f, min) => Lab.apps.some((a) => (a.gasOut[f] || 0) + gasInApp(a, f) >= (min || 5e-4));
const gasHere = (f, min) => Lab.apps.some((a) => {
  const total = (a.gasOut[f] || 0) + gasInApp(a, f)          // 逸出记过账的 + 气相里的
    + a.contents.filter((c) => c.formula === f && c.mol > 0).reduce((s, c) => s + c.mol, 0);   // + 溶在水里的（SO₂、CO₂ 都会溶）
  return total >= (min || 1e-4);
});
const gasAt = (i, f) => { const a = tutApp(i); return a ? (a.gasOut[f] || 0) + gasInApp(a, f) : 0; };
const solidHere = (f, min) => Lab.apps.some((a) => a.contents.some((c) => c.formula === f && c.mol > (min || 1e-6))
  || (a.pptBy && (a.pptBy[f] || 0) > (min || 1e-6)));
const heldGas = (f, min) => Lab.apps.some((a) => gasInApp(a, f) >= (min || 1e-4));
const heatTo = (T, f) => Lab.apps.some((a) => a.temp >= T && (!f || appHas(a, f)));
const phOf = (f) => { const a = Lab.apps.find((x) => x.contents.some((c) => c.formula === f && c.mol > 1e-9)); return a ? computePH(a) : null; };
const opNew = (k) => (Lab[k] || 0) > (Lab.tut.base[k.replace('Count', '')] || 0);
const base = () => Lab.tut.base;

/* ------------------------------ 步骤构造器 -------------------------------- */
const mkStep = (t, h, c, auto) => ({ t, h, c, auto: auto || null });

/** 自动步骤用的加热装配：**显式**摆出器材（铁架台/石棉网/热源），再架上去点着。
 *  第十轮起 setHeater/assembleRig 不再白送器材 —— 自动步骤也要"真的把器材摆出来"，
 *  于是干跑出来的计划就是玩家看到的：摆器材 → 垫石棉网 → 放上铁架台 → 热源进下格 → 点燃。 */
function tutHeat(i, hid) {
  const app = tutApp(i); if (!app) return { ok: false, why: '先有容器' };
  const id = hid || 'lamp';
  const h = Lab.tools.find((x) => x.hid === id) || addTool(id);
  if (!h) return { ok: false, why: '摆不下热源' };
  if (app.def.direct) { placeOn(app.uid, h.uid); lightTool(h.uid, true); syncHeaters(); return { ok: true, direct: true }; }
  const stand = Lab.tools.find((x) => x.hid === 'stand') || addTool('stand');
  const g = Lab.tools.find((x) => x.hid === 'gauze') || addTool('gauze');
  if (g) placeOn(app.uid, g.uid);
  if (stand) { placeOn(app.uid, stand.uid); slotLamp(stand.uid, h.uid); }
  lightTool(h.uid, true);
  syncHeaters();
  return { ok: true, rig: true };
}

function termChem(f) {
  if (!f || f === '—') return '—';
  const s = subOf(f);
  if (!s) return '<code>' + prettyFormula(f) + '</code>';
  return s.name + ' <code>' + prettyFormula(s.formula) + '</code>'
    + (s.alias ? '<i class="tal">俗名 ' + s.alias + '</i>' : '');
}
/** 全局俗名对照表（教程面板里可展开） */
function aliasTableHTML() {

    .map((s) => '<tr><td>' + s.name + '</td><td><code>' + prettyFormula(s.formula) + '</code></td><td>' + s.alias + '</td>'
      + '<td>' + (SUB_CAT_CN[s.cat] || s.cat) + '</td></tr>').join('');
  return '<details class="aliasbox"><summary>🔤 全部试剂名称对照表（' + SUBSTANCES.filter((s) => s.alias).length + ' 条俗名 → 化学名称）</summary>'
    + '<table class="termtab"><tr><th>化学名称</th><th>化学式</th><th>俗名 / 别名</th><th>类别</th></tr>' + rows + '</table></details>';
}

/* ------------------------------- 状态与存档 ------------------------------- */
Lab.tut = { id: null, sel: null, step: 0, done: {}, expDone: {}, pos: {}, mem: {}, uids: [], added: {}, base: { rx: new Set(), measure: 0, filter: 0, pour: 0, gasFeed: 0, elec: 0, stir: 0, submerge: 0, probe: 0, drop: 0 }, open: false };
const TUT_KEY = 'chemlab.tut.v01';
let tutThrottle = 0;

function tutSave() {
  try {
    localStorage.setItem(TUT_KEY, JSON.stringify({
      id: Lab.tut.id, step: Lab.tut.step, done: Lab.tut.done, expDone: Lab.tut.expDone, pos: Lab.tut.pos,
    }));
  } catch (e) { /* file:// 下可能不可用，静默降级 */ }
}
function tutLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(TUT_KEY) || 'null');
    if (s && s.id) {
      Lab.tut.id = s.id; Lab.tut.step = s.step || 0; Lab.tut.done = s.done || {};
      Lab.tut.expDone = s.expDone || {}; Lab.tut.pos = s.pos || {};
    }
  } catch (e) { }
}

function tutReset() {
  Lab.tut.id = null; Lab.tut.step = 0; Lab.tut.done = {}; Lab.tut.expDone = {}; Lab.tut.pos = {}; Lab.tut.mem = {}; Lab.tut.uids = [];
  try { localStorage.removeItem(TUT_KEY); } catch (e) { }
  tutRender(true);
}
const tutExp = (id) => TUT.find((e) => e.id === (id || Lab.tut.id)) || null;
/** 教程在进行中吗：面板打开（全览）或手把手引导条在跑 —— 两种模式都必须判定步骤 */
function tutActive() {
  return !!Lab.tut.open || !!(window.CHEM && typeof window.CHEM.guideOn === 'function' && window.CHEM.guideOn());
}

/** 开始/切换实验：清空工作台 → 摆好仪器 → 记录基线。
 *  restart=true 时连进度一起清掉；切换实验则保留各实验自己的进度（不会把做过的一步步弄丢） */
function tutStart(id, restart) {
  const exp = TUT.find((e) => e.id === id);
  if (!exp) return { ok: false, why: '没有这个实验' };
  if (restart) {
    exp.steps.forEach((_, i) => { delete Lab.tut.done[id + ':' + i]; });
    delete Lab.tut.expDone[id];
    Lab.tut.pos[id] = 0;
  }
  Lab.apps.length = 0; Lab.tools.length = 0; Lab.selected = null;   // 器材也要清：上个实验点着的酒精灯留在台面上，引导就会指着"一盏已经亮着的灯"让你去点燃，一点反而熄灭
  Lab.tut.added = {};                                              // 本实验的"加料台账"（每次开课清零，避免上个实验的料算到这一步）
  Lab.tut.uids = [];
  exp.bench.forEach((k) => { const a = addApparatus(k); Lab.tut.uids.push(a ? a.uid : ''); });
  Lab.tut.id = id;
  Lab.tut.step = restart ? 0 : (Lab.tut.pos[id] || 0);
  if (Lab.tut.step > exp.steps.length) Lab.tut.step = 0;
  Lab.tut.mem = {};
  Lab.tut.base = {
    rx: new Set(Lab.discovered), measure: Lab.measureCount || 0,
    filter: Lab.filterCount || 0, pour: Lab.pourCount || 0, gasFeed: Lab.gasFeedCount || 0, elec: Lab.elecCount || 0,
    stir: Lab.stirCount || 0, submerge: Lab.submergeCount || 0, probe: Lab.probeCount || 0, drop: Lab.dropCount || 0,
  };
  Lab.selected = Lab.tut.uids[0] || null;
  renderBench(true);
  Lab.log.push({ k: 'warn', at: Lab.time, text: '📘 开始『' + exp.no + '　' + exp.title + '』（第 ' + (Lab.tut.step + 1) + ' 步继续）：工作台已按清单摆好仪器，跟着右边步骤做。' });
  tutSave(); tutRender(true);
  return { ok: true, exp: exp.id, step: Lab.tut.step, uids: Lab.tut.uids.slice() };
}

/** 自动完成当前这一步（给不会操作的人看演示，也是自动化验收的入口） */
function tutDemo() {
  const exp = tutExp(); if (!exp) return { ok: false, why: '先选一个实验' };
  const st = exp.steps[Lab.tut.step]; if (!st) return { ok: false, why: '这个实验已经做完了' };
  if (st.auto) {
    window._tutAuto = true;                            // 教程代取器材的开关：只有"演示/自动做一步"才开
    try { st.auto(); } catch (e) { window._tutAuto = false; return { ok: false, why: '演示失败：' + (e && e.message) }; }
    window._tutAuto = false;
  }
  labStep(0.05);
  tutRender(true);
  return { ok: true, step: Lab.tut.step, auto: !!st.auto };
}

/** 每帧调用：节流检查当前步骤是否完成 → 自动进入下一步 */
function tutTick(dt) {
  tutThrottle += dt;
  if (tutThrottle < 0.2) return;
  tutThrottle = 0;
  const exp = tutExp();
  if (!exp || !tutActive()) return;
  const st = exp.steps[Lab.tut.step];
  if (!st) return;
  let ok = false;
  try { ok = !!st.c(); } catch (e) { ok = false; }
  if (!ok) return;
  if (Lab.tut.step === 1 && exp.id === 'e8') Lab.tut.mem.m0 = totalMass(tutApp(0));   // 反应前质量快照
  Lab.tut.done[exp.id + ':' + Lab.tut.step] = true;
  Lab.tut.step++;
  Lab.tut.pos[exp.id] = Lab.tut.step;
  const last = Lab.tut.step >= exp.steps.length;
  Lab.log.push({
    k: 'task', at: Lab.time,
    text: '✅ ' + exp.no + ' 第 ' + Lab.tut.step + ' 步完成：' + st.t + (last ? '　🎉 实验完成！' : ''),
  });
  if (last) { Lab.tut.expDone[exp.id] = true; toast('🎉 ' + exp.title + ' 全部完成'); }
  else toast('✅ 第 ' + Lab.tut.step + ' 步完成');
  tutSave(); tutRender(true);
}

/* ============================================================================

 *   三件事：
 *     ① 推导：每一步到底该点哪个按钮（干跑 st.auto，拿真实调用参数）

 *     ③ 不挡手：引导条贴在顶栏下方，工作台/试剂架照样能点

const GUIDE_KINDS = ['addReagent', 'setHeater', 'ignite', 'stir', 'pour', 'feedGas', 'filterApp', 'setPower', 'clearApp', 'measure', 'addApparatus',
  'addTool', 'placeOn', 'slotLamp', 'lightTool', 'submergeJar', 'liftJar', 'lightSplint', 'probeGas'];
const G_ORIG = {};
let gDry = null;            // 非 null = 干跑模式（只记录调用，不碰真状态）
let gDryTools = {};         // 干跑里"虚拟摆出来的器材"：uid → 影子器材（只为把种类对上，不碰真台面）
let gActs = [];             // 玩家真实动作队列
let gSig = '', gKey = '', gHint = 0, gLastStep = -1, gLastDone = null, gFrame = 0, gLastReal = 0;
const gCfg = { hintSec: 12, demoSec: 30 };   // 卡多久给提示 / 卡多久放演示

/* --------------------------- ① 动作录制与计划推导 -------------------------- */
let gInstalled = false;
function guideInstall() {
  if (gInstalled) return;
  gInstalled = true;
  GUIDE_KINDS.forEach((k) => {
    const f = window[k];
    if (typeof f !== 'function') return;
    G_ORIG[k] = f;
    window[k] = function (...a) {
      if (window._gSilent && !gDry) return G_ORIG[k].apply(this, a);   // 程序替玩家取器材：不算玩家动作
      if (gDry) {                                     // 干跑：不改状态
        gDry.push({ k, a: a });
        // 返回值要"像真的"，否则 auto 里 `const t = addTool('lamp'); placeOn(uid, t.uid)` 推导不出来
        if (k === 'addTool') {                        // 影子器材：让 `const t = addTool('lamp'); placeOn(uid, t.uid)` 推得下去
          const vt = { uid: 'T' + (Object.keys(gDryTools).length + 1), hid: a[0], def: HEATERS.find((x) => x.id === a[0]) || null, on: false, dry: true };
          gDryTools[vt.uid] = vt;
          return vt;
        }
        if (k === 'placeOn') return { ok: true, tool: gDryTools[a[1]] || null };
        if (k === 'lightTool') { if (gDryTools[a[0]]) gDryTools[a[0]].on = !!a[1]; return { ok: true, tool: gDryTools[a[0]] || null }; }
        return { ok: true };
      }
      const r = f.apply(this, a);
      // 记下"做这个动作时进行到第几步"：步骤已经翻页的动作不再拿新步骤去评判（否则会冤枉玩家）
      gActs.push({ k: k, a: a, at: Lab.time || 0, step: (Lab.tut && Lab.tut.step) || 0 });
      return r;
    };
  });
}

function guideNorm(r) {
  const k = r.k, a = r.a || [], o = { k: k };
  if (k === 'addReagent') { o.uid = a[0]; o.f = a[1]; o.v = a[2]; o.u = a[3]; }
  else if (k === 'setHeater') { o.uid = a[0]; o.h = a[1]; o.on = a[2]; }
  else if (k === 'pour' || k === 'feedGas' || k === 'filterApp') { o.uid = a[0]; o.to = a[1]; }
  else if (k === 'setPower') { o.uid = a[0]; o.on = a[1]; }
  else if (k === 'measure') { o.uid = (a[0] && a[0].uid) || (typeof a[0] === 'string' ? a[0] : null); }   // measure 收 app 对象（也兼容 uid）
  else if (k === 'addApparatus') { o.kind = a[0]; }              // 参数是仪器 id（'tube'…）
  else if (k === 'addTool') { o.hid = a[0]; }
  else if (k === 'slotLamp') { o.stand = a[0]; o.hid = ((gDryTools[a[1]] || toolByUid(a[1])) || {}).hid || null; }
  else if (k === 'placeOn') { o.uid = a[0]; o.tool = a[1]; o.toolHid = ((gDryTools[a[1]] || toolByUid(a[1])) || {}).hid || null; }
  else if (k === 'lightTool') { o.uid = a[0]; o.lit = a[1]; o.hid = ((gDryTools[a[0]] || toolByUid(a[0])) || {}).hid || null; }
  else if (k === 'lightSplint' || k === 'probeGas') { o.uid = a[0]; o.to = a[1]; o.hid = ((gDryTools[a[0]] || toolByUid(a[0])) || {}).hid || 'splint'; }
  else { o.uid = a[0]; }
  return o;
}

/** 干跑这一步的 auto：把动作函数换成记录器、把工作台换成一次性副本 → 拿到"该做哪些动作"且零副作用 */
function guideDryRun(exp, idx) {
  const st = exp.steps[idx];
  if (!st || !st.auto) return [];
  const real = Lab.apps, realSel = Lab.selected, realSig = benchSig;
  Lab.apps = real.map((a) => Object.assign({}, a, { contents: a.contents.slice(), gasOut: Object.assign({}, a.gasOut) }));
  const rec = [];
  gDry = rec; gDryTools = {};
  try { st.auto(); } catch (e) { /* 推导失败不算错，退化成"只给文字提示" */ }
  gDry = null;
  Lab.apps = real; Lab.selected = realSel; benchSig = realSig;   // 台面签名也还原，避免白刷一帧
  return rec.map(guideNorm);
}

function guidePlan(exp, idx) {
  if (!exp) return [];
  if (!Lab.tut.pcache) Lab.tut.pcache = {};
  const key = exp.id + ':' + idx;
  if (!Lab.tut.pcache[key]) Lab.tut.pcache[key] = guideDryRun(exp, idx);
  return Lab.tut.pcache[key];
}

/** 手把手：这一步的计划里正好要加这种试剂 → 取用量弹窗直接按步骤填好。
 *  （默认 50 mL 过不了要 80 mL 的步骤；中和滴定那类"多一滴就过头"的步骤更不能拿默认值去撞） */
function guideAmountFor(formula, dflt, unit) {
  const r = { v: dflt, u: unit, used: false };
  try {
    const exp = tutExp();
    if (!exp || !guideOn()) return r;
    const plan = guidePlan(exp, Lab.tut.step);
    const it = plan[guidePlanNext(plan)];
    if (it && it.k === 'addReagent' && it.f === formula && Number(it.v) > 0) {
      r.v = it.v; if (it.u) r.u = it.u; r.used = true;
    }
  } catch (e) { }
  return r;
}

/** 计划里"想要的实物状态已经成立"的项 —— 玩家自己先点着了灯 / 先架上去了，就别再指着让点第二遍
 *  （否则引导会说"点🔥点燃"，而那盏灯正亮着，一点就变成熄灭，还判你点错） */
function guideSatisfied(w) {
  if (!w) return false;
  if (w.k === 'addTool') return Lab.tools.some((t) => t.hid === w.hid);
  if (w.k === 'lightTool') { const t = Lab.tools.find((x) => x.hid === w.hid); return !!t && !!t.on === !!w.lit; }
  if (w.k === 'placeOn') {
    const a = appByUid(w.uid); if (!a) return false;
    if (w.toolHid === 'gauze') return !!a.gauze;                  // 石棉网已经垫上了
    const m = meterOn(a, (METERS.find((x) => x.id === w.toolHid) || {}).measures);   // 量器已经插着了
    if (m) return true;
    if (!a.standOn) return false;
    const t = toolByUid(a.standOn); return !!t && (!w.toolHid || t.hid === w.toolHid);
  }
  if (w.k === 'slotLamp') {
    // 计划里的器材 uid 是干跑时排的（干跑时台面上没有玻璃棒，编号会整体错位）—— 只认种类：铁架台全场唯一
    const s = Lab.tools.find((x) => x.hid === 'stand') || toolByUid(w.stand);
    const h = s ? standLampOf(s) : null;
    return !!h && (!w.hid || h.hid === w.hid);
  }
  if (w.k === 'measure') return false;                            // 测量只能真点（点第二次无害，所以不做"已满足"跳过）
  if (w.k === 'setPower') { const a = appByUid(w.uid); return !!a && !!a.elec === !!w.on; }
  if (w.k === 'setHeater') { const a = appByUid(w.uid); return !!a && !!a.heater && !!a.heater.on === !!w.on; }
  return false;        // 加料 / 搅拌 / 测量 / 倾倒 / 过滤 / 导气 / 点燃 / 清空 / 摆仪器：只能真做，不能跳过
}

/** 把计划的指针推过"已完成 + 已经满足"的项，返回下一个真正要让玩家做的项 */
function guideAdvance(plan) {
  const d = (Lab.tut.pdone || (Lab.tut.pdone = {}));
  let pi = Lab.tut.pi || 0;
  while (pi < plan.length && (d[pi] || guideSatisfied(plan[pi]))) { d[pi] = true; pi++; }
  Lab.tut.pi = pi;
  return pi;
}

/** 覆盖率自检：49 步里有多少步能指出"点哪个控件"（用各实验自己的台面、按顺序推进状态再推导，状态相关的 auto 才准） */
function guideCoverage() {
  const keep = { id: Lab.tut.id, open: Lab.tut.open, step: Lab.tut.step, done: Object.assign({}, Lab.tut.done), pos: Object.assign({}, Lab.tut.pos), expDone: Object.assign({}, Lab.tut.expDone) };
  const rows = []; const kinds = {};
  TUT.forEach((e) => {
    tutStart(e.id, true);
    e.steps.forEach((s, i) => {
      Lab.tut.step = i;
      if (typeof renderBench === 'function') renderBench(true);       // 卡片要按最新状态重画，才不会算不出"该点哪个控件"
      const t = guideTarget();
      const kind = t ? t.kind : null;
      kinds[kind || 'none'] = (kinds[kind || 'none'] || 0) + 1;
      rows.push({ at: e.id + ':' + (i + 1), kind: kind, label: t ? t.label : null, text: s.t });
      if (s.auto) { try { s.auto(); } catch (err) { } }     // 按理想路径把状态推到下一步（只推导，不跑物理）
    });
  });
  Lab.tut.done = keep.done; Lab.tut.pos = keep.pos; Lab.tut.expDone = keep.expDone; Lab.tut.pcache = {};
  if (keep.id) { tutStart(keep.id); Lab.tut.step = keep.step; Lab.tut.pos[keep.id] = keep.step; } else { tutReset(); }
  if (keep.open) tutToggle(true);
  const waits = rows.filter((r) => r.kind === 'wait' || r.kind === 'done').length;
  return { steps: rows.length, waits: waits, pointed: rows.length - waits, kinds: kinds, rows: rows };
}

/* ------------------------------ ② 目标控件链 ------------------------------ */
const gCard = (uid) => document.querySelector('.appcard[data-uid="' + uid + '"]');
const gTool = (uid) => document.querySelector('.toolcard[data-uid="' + uid + '"]');
const gToolBtn = (uid, op) => { const c = gTool(uid); return c ? c.querySelector('.ops button[data-op="' + op + '"]') : null; };
const gToolName = (uid) => { const t = (typeof toolByUid === 'function') ? toolByUid(uid) : null; return t ? t.def.name + ' ' + uid : '器材'; };
const gOpBtn = (uid, op) => { const c = gCard(uid); return c ? c.querySelector('.ops button[data-op="' + op + '"]') : null; };
const gAppName = (uid) => { const a = appByUid(uid); return a ? a.def.name : '容器'; };

/** 当前这一步，玩家"现在该点哪个控件" —— 按真实 UI 路径一步步指 */
function guideTarget() {
  const exp = tutExp(); if (!exp) return null;
  const st = exp.steps[Lab.tut.step];
  const speedBtn = document.querySelector('#speedBtn');
  if (!st) return { key: 'alldone', el: speedBtn, label: '🎉 这个实验做完了 —— 点「📖 全览」写实验报告', kind: 'done' };
  const plan = guidePlan(exp, Lab.tut.step);
  const a = plan[guideAdvance(plan)];
  const mAmt = document.querySelector('#modal.show #amtOk');
  const mTgt = document.querySelector('#modal.show .tgt');
  // 有对话框挡着，但它不是这一步要用的 → 先让玩家关掉
  if (!a) {
    const sp = Lab.speed || 1, top = (typeof SPEEDS !== 'undefined') ? SPEEDS[SPEEDS.length - 1] : 20;
    return {
      key: 'wait' + sp, el: sp < top ? speedBtn : null, kind: 'wait',
      label: sp < top
        ? '这一步自己会进行 —— 点「⏩ 时间」调到 ×' + top + '，几秒就能看完'
        : '已经在 ×' + top + ' 最快了 —— 真实实验要等几分钟，看着它发生就行',
    };
  }
  if (a.k !== 'addReagent' && mAmt) return { key: 'closex', el: document.querySelector('#amtCancel'), label: '这一步不需要加入药品 → 先点「取消」', kind: 'close' };
  /* 新器材的操作（排水法集气、木条检验）也要能指到具体控件 */
  if (a.k === 'submergeJar') {
    const b = gOpBtn(a.uid, 'submerge');
    return b ? { key: 'submerge', el: b, label: '点集气瓶上的「⤵ 倒扣进水槽」—— 排水法：瓶里灌满水、倒扣在水槽里', kind: 'op' } : null;
  }
  if (a.k === 'liftJar') {
    const b = gOpBtn(a.uid, 'liftjar');
    return b ? { key: 'liftjar', el: b, label: '点「⬆ 取出集气瓶」把收集好气体的瓶子取出来', kind: 'op' } : null;
  }
  if (a.k === 'lightSplint' || a.k === 'probeGas') {
    const sp = Lab.tools.find((x) => x.hid === (a.hid || 'splint')) || null;      // 干跑摆的是影子器材，按种类找真器材
    if (a.k === 'probeGas' && mTgt) {
      const tg = (a.to && document.querySelector('#modal.show .tgt[data-uid="' + a.to + '"]')) || mTgt;   // 点在该检验的那个瓶上
      return { key: 'tgt:' + (tg.dataset.uid || 'probe'), el: tg, label: '在弹窗里点「' + ((appByUid(a.to) || {}).def || {}).name + '」那一行 → 把木条伸进去检验', kind: 'modal' };
    }
    const b = sp ? gToolBtn(sp.uid, a.k === 'lightSplint' ? 'splintlight' : 'probe') : null;
    return b ? {
      key: a.k === 'lightSplint' ? 'splintlight' : 'probe', el: b, kind: 'op',
      label: a.k === 'lightSplint' ? '点木条卡片上的「🔥 点着木条」' : '点木条卡片上的「🔎 伸进容器检验」',
    } : null;
  }
  if (a.k === 'addReagent') {
    if (mAmt) {
      const inp = document.querySelector('#modal #amtVal'), un = document.querySelector('#modal #amtUnit');
      const wv = Number(a.v), wu = a.u || 'g';
      const isOk = !!inp && Math.abs(Number(inp.value) - wv) < 1e-6 && (!un || un.value === wu);
      if (isOk) return { key: 'amtok', el: mAmt, label: '用量 ' + wv + ' ' + wu + ' 就是这一步要的 → 点「加入 ' + gAppName(a.uid) + '」', kind: 'modal' };
      return { key: 'amtfix', el: inp || mAmt, want: { v: wv, u: wu }, label: '把用量改成 ' + wv + ' ' + wu + '（这一步不能多也不能少）→ 再点「加入 ' + gAppName(a.uid) + '」', kind: 'amount' };
    }
    if (Lab.selected !== a.uid && gCard(a.uid)) return { key: 'sel:' + a.uid, el: gCard(a.uid), label: '先点一下「' + gAppName(a.uid) + '」卡片，把它选中', kind: 'select' };
    const s = subOf(a.f) || {};
    // 单质（Fe / Mg / Cu / C / S…）根本不在试剂架里 —— 只在左边元素周期表上，引导必须指对地方
    if (s.isElem) {
      const el = (typeof ELEM_BY_SYM !== 'undefined' && ELEM_BY_SYM.get) ? ELEM_BY_SYM.get(a.f) : null;
      const sym = el ? el.sym : a.f;
      const info = document.querySelector('#elemInfo');
      const tb = document.querySelector('#takeElem');
      if (tb && info && info.dataset.sym === sym) return { key: 'take:' + sym, el: tb, label: '点「取用 5 g ' + (el ? el.cn : sym) + '」→ 弹窗里点「加入 ' + gAppName(a.uid) + '」', kind: 'element' };
      const cell = document.querySelector('#ptable [data-sym="' + sym + '"]');
      if (cell) return { key: 'el:' + sym, el: cell, label: '左边「元素周期表」→ 点「' + sym + ' ' + (el ? el.cn : '') + '」（单质不在试剂架上，得从周期表取）', kind: 'element' };
    }
    const chip = document.querySelector('#shelf [data-sub="' + a.f + '"]');
    if (chip) return { key: 'chip:' + a.f, el: chip, label: '右边试剂架 → 点「' + a.f + ' ' + (s.name || '') + '」', kind: 'reagent' };
    return { key: 'search:' + a.f, el: document.querySelector('#shelfSearch'), label: '右边试剂架搜索框里搜「' + (s.name || a.f) + '」', kind: 'search' };
  }
  if (a.k === 'addTool') {
    const h = (typeof HEATERS !== 'undefined' ? HEATERS : []).find((x) => x.id === a.hid);
    const ab = document.querySelector('#addTools button[data-hid="' + a.hid + '"]');
    if (ab) return { key: 'addtool:' + a.hid, el: ab, label: '工作台上方「器材」行 → 点「' + (h ? h.icon + ' ' + h.name : a.hid) + '」摆一件上台面', kind: 'tool' };
  }
  if (a.k === 'placeOn') {
    const list = Lab.tools.filter((x) => x.hid === a.toolHid);
    const t = list.find((x) => !x.app) || list[0] || Lab.tools[0] || null;   // 优先用"还没插上去的那件"（同一个量器可能有好几件）
    if (t && t.app && t.app !== a.uid) {                                     // 唯一一件正插在别的容器上：先拔出来
      const ub = gToolBtn(t.uid, 'unmount');
      if (ub) return { key: 'unmount:' + t.uid, el: ub, kind: 'place', label: '「' + t.def.name + '」正插在「' + gAppName(t.app) + '」上 —— 先点「⏏ 拔出」，再插进「' + gAppName(a.uid) + '」' };
    }
    if (t && a.toolHid === 'stand') {                                      // 铁架台没有「架上来」，它的槽位叫「⬆ 上格放容器」
      const sb = gToolBtn(t.uid, 'slotapp');
      if (sb) return { key: 'slotapp:' + t.uid, el: sb, label: '点「铁架台」卡片上的「⬆ 上格放容器」，把' + gAppName(a.uid) + '放进铁圈里', kind: 'place' };
    }
    const mb = t ? gToolBtn(t.uid, 'mount') : null;
    if (mb) {
      // 「⬆ 架上来」架的是**当前选中的**那个容器 —— 选错了就会把别的器皿架上灯，玩家照着点也做不完
      if (a.uid && Lab.selected !== a.uid && gCard(a.uid)) {
        return { key: 'sel:' + a.uid, el: gCard(a.uid), label: '先点一下「' + gAppName(a.uid) + '」卡片把它选中 —— 「⬆ 架上来」架的是选中的那一个（现在选的是「' + gAppName(Lab.selected) + '」）', kind: 'select' };
      }
      return { key: 'mount:' + t.uid, el: mb, label: '点「' + t.def.name + '」卡片上的「⬆ 架上来」，把' + gAppName(a.uid) + '架到它上面', kind: 'place' };
    }
    const ab = document.querySelector('#addTools button[data-hid="' + (a.toolHid || 'lamp') + '"]');
    if (ab) return { key: 'addtool:' + (a.toolHid || 'lamp'), el: ab, label: '先在「器材」行点一件加热器材摆上台面', kind: 'tool' };
  }
  if (a.k === 'slotLamp') {
    const stand = Lab.tools.find((x) => x.hid === 'stand') || toolByUid(a.stand);   // 计划里的 uid 可能错位，只认种类
    if (!stand) {
      const ab1 = document.querySelector('#addTools button[data-hid="stand"]');
      if (ab1) return { key: 'addtool:stand', el: ab1, label: '先在「器材」行摆一件「🗼 铁架台」上台面', kind: 'tool' };
    }
    const sb = stand ? gToolBtn(stand.uid, 'slotlamp') : null;
    if (sb) return { key: 'slotlamp:' + a.stand, el: sb, label: '点「铁架台」卡片上的「⬇ 下格放热源」—— 铁架台下格放灯（酒精灯 / 本生灯 / 喷灯都行）', kind: 'place' };
  }
  if (a.k === 'lightTool') {
    const t = Lab.tools.find((x) => x.hid === a.hid && (a.lit ? !x.on : x.on)) || Lab.tools.find((x) => x.hid === a.hid) || null;
    let lb = t ? gToolBtn(t.uid, 'light') : null;
    if (!lb && t && t.lampStand) {                       // 热源塞在铁架台下格里：卡片收起了，开关挪到铁架台卡片上
      const st = toolByUid(t.lampStand);
      lb = st ? gToolBtn(st.uid, 'light') : null;
    }
    if (lb) return { key: 'light:' + t.uid, el: lb, label: '在「' + t.def.name + '」卡片上点「' + (a.lit ? '🔥 点燃' : '💨 熄灭') + '」' + (a.lit ? ' —— 点着才会真的开始加热' : ''), kind: 'tool' };
  }
  if (a.k === 'setHeater') {
    if (mTgt) return { key: 'closetgt', el: document.querySelector('#tgtCancel'), label: '这个窗口用不上 → 先点「取消」', kind: 'close' };
    const h = (typeof HEATERS !== 'undefined' ? HEATERS : []).find((x) => x.id === a.h);
    const ga = appByUid(a.uid);
    const lamp = Lab.tools.find((x) => x.hid === a.h);
    if (!lamp) {
      const ab0 = document.querySelector('#addTools button[data-hid="' + a.h + '"]');
      if (ab0 && h) return { key: 'addtool:' + a.h, el: ab0, label: '先在「器材」行摆一件「' + h.icon + ' ' + h.name + '」到台面上', kind: 'tool' };
    } else if (h && h.needsDirect && ga && !ga.def.direct) {
      /* 玻璃器皿上明火：必须铁架台（上格器皿）+ 石棉网 + 下格酒精灯 */
      const stand = Lab.tools.find((x) => x.hid === 'stand');
      const mesh = !!ga.gauze;
      if (!stand || !mesh) {
        const rb = gToolBtn(lamp.uid, 'rig');
        if (rb) return { key: 'rig:' + lamp.uid, el: rb, label: '点「' + lamp.def.name + '」卡片上的「🗼 配铁架台」——' + gAppName(a.uid) + '是玻璃器皿不能直火，这一下会把铁架台 + 石棉网 + 下格酒精灯配齐并点着', kind: 'rig' };
      } else {
        const sl = standLampOf(stand) || lamp;
        const lb = gToolBtn(sl.uid, 'light');
        if (lb) return { key: 'light:' + sl.uid, el: lb, label: '点「' + sl.def.name + '」卡片上的「🔥 点燃」', kind: 'tool' };
      }
    } else if (ga && standOf(ga) !== lamp) {                    // 能直火的器皿：先架上来
      const mb = gToolBtn(lamp.uid, 'mount');
      if (mb) {
        if (Lab.selected !== a.uid && gCard(a.uid)) return { key: 'sel:' + a.uid, el: gCard(a.uid), label: '先点一下「' + gAppName(a.uid) + '」卡片把它选中', kind: 'select' };
        return { key: 'mount:' + lamp.uid, el: mb, label: '点「' + lamp.def.name + '」卡片上的「⬆ 架上来」，把' + gAppName(a.uid) + '架到它上面', kind: 'place' };
      }
    } else {
      const lb = lamp ? gToolBtn(lamp.uid, 'light') : null;
      if (lb) return { key: 'light:' + lamp.uid, el: lb, label: '点「' + lamp.def.name + '」卡片上的「🔥 点燃」—— 点着才真的开始加热', kind: 'tool' };
    }
  }
  if (a.k === 'pour' || a.k === 'feedGas' || a.k === 'filterApp') {
    const op = a.k === 'pour' ? 'pour' : a.k === 'feedGas' ? 'gas' : 'filter';
    const tgt = document.querySelector('#modal.show .tgt[data-uid="' + a.to + '"]');
    if (tgt) return { key: 'tgt:' + a.to, el: tgt, label: '在弹窗里点「' + gAppName(a.to) + '」当目标容器', kind: 'target' };
    const ob = gOpBtn(a.uid, op);
    const verb = { pour: '🫗 倾倒', gas: '💨 导气', filter: '🧻 过滤' }[op];
    return { key: 'op:' + a.uid + ':' + op, el: ob, label: '在「' + gAppName(a.uid) + '」卡片上点「' + verb + '」', kind: 'op' };
  }
  if (a.k === 'measure') {
    const mb = gOpBtn(a.uid, 'measure');
    if (mb) return { key: 'op:' + a.uid + ':measure', el: mb, label: '在「' + gAppName(a.uid) + '」卡片上点「📏 测量」，读数会写进现象日志', kind: 'op' };
  }
  if (a.k === 'addApparatus') {
    const ab = document.querySelector('#addApparatus button[data-kind="' + a.kind + '"]');
    const def = (typeof APPARATUS !== 'undefined' ? APPARATUS : []).find((x) => x.id === a.kind);
    if (ab) return { key: 'add:' + a.kind, el: ab, label: '工作台上方点「' + (def ? def.name : a.kind) + '」添一个容器', kind: 'apparatus' };
  }
  const opMap = { ignite: 'ignite', stir: 'stir', setPower: 'power', clearApp: 'clear' };
  const op = opMap[a.k];
  if (op) {
    const ob = gOpBtn(a.uid, op);
    const verb = { ignite: '⚡ 点燃', stir: '🌀 搅拌', power: '⚡ 通电', clear: '🧼 倒空' }[op];
    if (ob) return { key: 'op:' + a.uid + ':' + op, el: ob, label: '在「' + gAppName(a.uid) + '」卡片上点「' + verb + '」', kind: 'op' };
  }
  return { key: 'wait', el: speedBtn, label: '这一步会自动发生 —— 想快点就点「⏩ 时间」', kind: 'wait' };
}

/** 玩家刚才那个动作，算不算"这一步该做的" */
const guidePlanNext = (plan) => { const d = Lab.tut.pdone || {}; for (let i = 0; i < plan.length; i++) { if (!d[i]) return i; } return plan.length; };
function guideMatch(act, want) {
  if (!want) return false;
  if (act.k !== want.k) return false;
  if (want.k === 'addReagent') return act.a[0] === want.uid && act.a[1] === want.f;
  if (want.k === 'setHeater') return act.a[0] === want.uid;
  if (want.k === 'pour' || want.k === 'feedGas' || want.k === 'filterApp') return act.a[0] === want.uid && act.a[1] === want.to;
  if (want.k === 'measure') return !!(act.a[0] && act.a[0].uid === want.uid);
  if (want.k === 'addApparatus') return act.a[0] === want.kind;
  if (want.k === 'addTool') return act.a[0] === want.hid;
  // 器材 uid 每次摆都不是同一个（干跑摆的是影子器材），所以按"种类 + 谁被架上去了 + 点着与否"判定
  if (want.k === 'placeOn') return act.a[0] === want.uid && (!want.toolHid || ((toolByUid(act.a[1]) || {}).hid === want.toolHid));
  if (want.k === 'lightTool') return !!act.a[1] === !!want.lit && (!want.hid || ((toolByUid(act.a[0]) || {}).hid === want.hid));
  if (want.k === 'slotLamp') return (!want.hid || ((gDryTools[act.a[1]] || toolByUid(act.a[1])) || {}).hid === want.hid);   // uid 会错位，按热源种类匹配
  if (want.k === 'lightSplint' || want.k === 'probeGas') return ((toolByUid(act.a[0]) || {}).hid || '') === (want.hid || 'splint');
  return act.a[0] === want.uid;
}
const gVerb = (act) => {
  const a = act.a || [];
  if (act.k === 'addReagent') { const s = subOf(a[1]) || {}; return '加入 ' + (s.name || a[1]); }
  if (act.k === 'setHeater') { const h = (HEATERS || []).find((x) => x.id === a[1]); return (a[2] ? '打开' : '关掉') + (h ? h.name : '热源') + '（' + gAppName(a[0]) + '）'; }
  if (act.k === 'pour') return '倾倒（' + gAppName(a[0]) + '）';
  if (act.k === 'feedGas') return '导气（' + gAppName(a[0]) + '）';
  if (act.k === 'filterApp') return '过滤（' + gAppName(a[0]) + '）';
  if (act.k === 'ignite') return '点燃（' + gAppName(a[0]) + '）';
  if (act.k === 'setPower') return (a[1] ? '通电' : '断电') + '（' + gAppName(a[0]) + '）';
  if (act.k === 'clearApp') return '倒空（' + gAppName(a[0]) + '）';
  if (act.k === 'stir') return '搅拌';
  if (act.k === 'measure') return '测量（' + gAppName(a[0] && a[0].uid) + '）';
  if (act.k === 'addApparatus') { const d = (APPARATUS || []).find((x) => x.id === a[0]); return '摆了' + (d ? d.name : a[0]); }
  if (act.k === 'addTool') { const h = (HEATERS || []).find((x) => x.id === a[0]); return '摆了' + (h ? h.name : a[0]); }
  if (act.k === 'placeOn') { const t = toolByUid(a[1]); return '把' + gAppName(a[0]) + '架到' + (t ? t.def.name : '台面') + '上'; }
  if (act.k === 'lightTool') { const t = toolByUid(a[0]); return (a[1] ? '点燃' : '熄灭') + (t ? t.def.name : '器材'); }
  return act.k;
};

/* --------------------------- ③ 每帧：判定 / 纠错 / 提示 --------------------------- */
/** 复合动作（setHeater = 摆灯 → 架好 → 点燃）里的"必经子动作"：
 *  玩家按引导一步一步做（先摆酒精灯、再架上去、再点燃）时，中间这几下都只是这条计划的组成部分，
 *  绝不能判成"不是必需的" —— 但也**不算完成**（得真的点着、`heater.on` 成立了才算）。 */
function guidePrereq(act, plan) {
  if (!act || !plan || !plan.length) return false;
  const toolHid = (uid) => ((toolByUid(uid) || {}) || {}).hid || null;
  return plan.some((w) => {
    if (!w || w.k !== 'setHeater') return false;
    if (act.k === 'addTool') return act.a[0] === w.h || act.a[0] === 'stand' || act.a[0] === 'gauze';   // 摆热源 / 铁架台 / 石棉网
    if (act.k === 'lightTool') return toolHid(act.a[0]) === w.h && act.a[1] !== false; // 点燃它
    if (act.k === 'slotLamp') return true;                                                              // 热源进下格
    if (act.k === 'placeOn') {
      if (act.a[0] !== w.uid) return false;                                          // 只能是这个容器
      const hid = toolHid(act.a[1]);
      return hid === w.h || hid === 'gauze' || hid === 'stand' || act.a[1] == null;  // 架到灯上 / 垫石棉网 / 放上铁架台
    }
    return false;
  });
}

function guideTick(dtReal) {
  guideInstall();
  const exp = tutExp();
  const step = exp ? Lab.tut.step : -1;
  if (exp && step !== gLastStep) {            // 换步：重置本步子动作指针与计时
    gLastStep = step; Lab.tut.pi = 0; Lab.tut.pdone = {}; Lab.tut.idle = 0; gHint = 0; Lab.tut.nudge = null; Lab.tut.nudgeAt = 0;
  }
  if (gActs.length) {
    const cur = exp && exp.steps[Lab.tut.step];
    // 沙盒 / 引导条收起 / 全览打开 / 这个实验已经做完 → 一律不评判（免得偷偷写日志，也免得读到不存在的步骤）
    if (!exp || !cur || !guideOn()) { gActs = []; }
    else {
      const plan = guidePlan(exp, Lab.tut.step);
      const d = (Lab.tut.pdone || (Lab.tut.pdone = {}));
      gActs.forEach((act) => {
        Lab.tut.idle = 0; gHint = 0;
        if (act.step !== Lab.tut.step) return;                          // 上一步的动作，别拿这一步的清单去评判
        let hit = -1;                                                   // 同一步里的动作顺序可以不同：命中任意未完成项都算对
        for (let i = 0; i < plan.length; i++) {
          if (d[i] && !guideSatisfied(plan[i])) continue;               // 已经做过的项不再重复接受（但"刚做完就自然满足"的项要收下，别把玩家自己的正确操作判成多余）
          if (guideMatch(act, plan[i])) { hit = i; break; }
        }
        if (hit >= 0) { d[hit] = true; guideAdvance(plan); Lab.tut.nudge = null; return; }
        if (guidePrereq(act, plan)) { Lab.tut.nudge = null; return; }   // 复合动作的必经子步骤：不算错，也先别算完成
        if (act.k === 'stir') return;                                   // 搅拌无害：这一步用不上它，也不判玩家错
        if (act.k === 'placeOn' && act.a[1] == null) return;             // 把量器拔下来：换容器时的正常中间步骤，不算错
        if (!Lab.tut.nudge || (Lab.time - Lab.tut.nudgeAt) > 6) {        // 同一类错别刷屏
          Lab.tut.nudge = '⚠ 刚才那步不是必需的：' + gVerb(act) + ' —— 这一步要做的是「' + cur.t + '」';
          Lab.tut.nudgeAt = Lab.time;
          Lab.tut.wrong = (Lab.tut.wrong || 0) + 1;
          Lab.log.push({ k: 'warn', at: Lab.time, text: '🎓 引导：' + Lab.tut.nudge });
        }
      });
      guideAdvance(plan);          // 玩家没做、但实物状态本来就成立的项 → 直接跳过，别指着让点第二遍
      gActs = [];
    }
  }
  if (exp && exp.steps[Lab.tut.step]) { Lab.tut.idle = (Lab.tut.idle || 0) + dtReal; }
  const lvl = Lab.tut.idle >= gCfg.demoSec ? 2 : Lab.tut.idle >= gCfg.hintSec ? 1 : 0;
  if (lvl !== gHint) gHint = lvl;
  guideRender(false);
  // 只有引导条在跑时才画高亮/箭头 —— 否则「全览」面板打开时箭头会浮在面板上面穿帮
  if (guideOn()) { if ((gFrame = (gFrame + 1) % 6) === 0) guidePaintLast(); }
}

let gLastT = null;
function guidePaintLast() {
  if (!guideOn()) return;                   // 全览面板打开时一律不画（滚动/缩放事件也会走到这里）
  let t = gLastT;
  if (!t || !t.el || !t.el.isConnected) t = guideTarget();   // 台面 DOM 被重建过 → 重新解析目标，别让高亮凭空消失
  if (!t || !t.el) return;
  gLastT = t;
  if (!t.el.classList.contains('tutglow')) { guideClearGlow(); t.el.classList.add('tutglow'); }
  // 台面挤的时候，正在指的那张卡片抬到最上层 —— 否则它可能被别的卡片盖住点不到
  const card = t.el.closest ? t.el.closest('.appcard, .toolcard') : null;
  if (card) {
    document.querySelectorAll('.tutlift').forEach((e) => { if (e !== card) e.classList.remove('tutlift'); });
    card.classList.add('tutlift');
  }
  guideArrow(t.el, t.label);
}

/** 清掉所有高亮（含"抬到上层"的卡片） */
function guideClearGlow() {
  document.querySelectorAll('.tutglow').forEach((e) => e.classList.remove('tutglow'));
  document.querySelectorAll('.tutlift').forEach((e) => e.classList.remove('tutlift'));
}

function guideArrow(el, label) {
  const ar = document.querySelector('#guarrow'); if (!ar) return;
  const r = el.getBoundingClientRect();
  const vis = r.width > 0 && r.bottom > 56 && r.top < (window.innerHeight - 4);
  if (!vis) { ar.classList.remove('show'); return; }
  ar.textContent = '👆 ' + (label || '点这里');
  ar.classList.add('show');
  // 弹窗里的目标（「加入」按钮）一律把气泡放到下面 —— 放上面会盖住「用量 / 单位」那两行，玩家正要看它们
  const inModal = !!(el.closest && el.closest('#modal'));
  const above = !inModal && r.top > 96;
  ar.style.left = Math.max(8, Math.min(window.innerWidth - 300, r.left + r.width / 2 - 90)) + 'px';
  ar.style.top = (above ? Math.max(58, r.top - 30) : r.bottom + 6) + 'px';
}

function guidePaint(t) {
  gLastT = t;
  guideClearGlow();
  const ar = document.querySelector('#guarrow'); if (ar) ar.classList.remove('show');
  if (!t || !t.el) return;
  t.el.classList.add('tutglow');
  const card = t.el.closest ? t.el.closest('.appcard, .toolcard') : null;
  if (card) card.classList.add('tutlift');           // 指着的卡片抬到最上层，保证点得到
  if (t.key !== gKey) {                       // 目标变了才滚动，别跟玩家抢滚动条
    gKey = t.key;
    try { t.el.scrollIntoView({ block: 'center', inline: 'nearest' }); } catch (e) { }
  } else {
    // 台面是横向可滚的：指着的控件被滚出视野时要拉回来（否则引导指着看不见的东西）
    try {
      const bench = t.el.closest && t.el.closest('#bench');
      if (bench) {
        const r = t.el.getBoundingClientRect(), br = bench.getBoundingClientRect();
        if (r.left < br.left + 6 || r.right > br.right - 6 || r.top < br.top + 6 || r.bottom > br.bottom - 6) {
          t.el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
      }
    } catch (e) { }
  }
  guideArrow(t.el, t.label);
}
function guideArrowOff() { const ar = document.querySelector('#guarrow'); if (ar) ar.classList.remove('show'); guideClearGlow(); }

/* --------------------------- 手把手步骤面板（工作台右侧） --------------------------- */
const guideOn = () => !!(Lab.tut.id && !Lab.tut.open && !Lab.tut.handOff);
function guideRender(force) {
  const box = document.querySelector('#guide'); if (!box) return;
  const on = guideOn();
  document.body.classList.toggle('guiding', on);
  if (!on) { if (box.classList.contains('show')) { box.classList.remove('show'); box.innerHTML = ''; } gSig = ''; guideArrowOff(); return; }
  const exp = tutExp(); if (!exp) { box.classList.remove('show'); return; }
  const st = exp.steps[Lab.tut.step];
  const t = guideTarget();
  const done = !st;
  const sig = [exp.id, Lab.tut.step, Lab.tut.pi, t && t.key, Lab.tut.nudge || '', gHint, done].join('|');
  if (!force && sig === gSig) { guidePaintLast(); return; }
  gSig = sig;
  const pct = Math.round(Lab.tut.step / exp.steps.length * 100);
  const hintText = gHint >= 1 && st && st.h ? '💡 ' + st.h : '';
  let line3 = '';
  if (Lab.tut.nudge) line3 = '<span class="gnudge">' + Lab.tut.nudge + '</span>';
  else if (hintText) line3 = '<span class="ghint">' + hintText + '</span>';
  else if (gLastDone && (Lab.time - gLastDone.at) < 6) line3 = '<span class="gok">✅ ' + gLastDone.text + '</span>';
  else line3 = '<span class="gtip">照着「🎯」点就行。点错了我会当场提醒，不会扣你分。</span>';
  /* 全部步骤铺开：做过的打勾、当前这条高亮 —— 玩家一眼看到"整段流程走到哪了" */
  let list = '';
  exp.steps.forEach((s, i) => {
    const isDone = !!Lab.tut.done[exp.id + ':' + i];
    const cur = i === Lab.tut.step;
    list += '<div class="gitem' + (isDone ? ' done' : cur ? ' cur' : '') + '" data-i="' + i + '">'
      + '<span class="gn">' + (isDone ? '✅' : (i + 1)) + '</span><span>' + s.t + '</span></div>';
  });
  const scrollTop = (() => { const l = box.querySelector('.glist'); return l ? l.scrollTop : 0; })();
  box.innerHTML = '<div class="gwrap">'
    + '<div class="grow1">'
    + '<span class="gno">' + exp.no + '　第 ' + Math.min(Lab.tut.step + 1, exp.steps.length) + ' / ' + exp.steps.length + ' 步</span>'
    + '<span class="gbar"><i style="width:' + pct + '%"></i></span>'
    + '<span class="gsp"></span>'
    + '<button id="gFull" title="看完整讲解（目的 / 现象 / 方程式 / 易错）">📖</button>'
    + '<button id="gRestart" title="从第 1 步重做">↺</button>'
    + '<button id="gOff" title="收起步骤面板（点「📘 实验教程」可再打开）">✕</button>'
    + '</div>'
    + '<b class="gtitle">' + exp.title + '</b>'
    + '<div class="gcur">'
    + '<div class="grow2"><span class="gstepn">' + Math.min(Lab.tut.step + 1, exp.steps.length) + '</span>'
    + '<b class="gtodo">' + (done ? '本实验全部完成！🎉' : st.t) + '</b></div>'
    + (t ? '<span class="gtgt">🎯 <b>' + t.label + '</b></span>' : '')
    + '<div class="grow3">' + line3 + '</div>'
    + '<div class="gacts">'
    + (gHint >= 2 && st && st.auto ? '<button id="gDemo" class="ghost">🎬 看一遍</button>' : '')
    + (st && !st.auto ? '<span class="gtip">⏳ 这一步要等一等（可点顶栏「⏩ 时间」加速）</span>' : '')
    + '</div>'
    + '</div>'
    + '<div class="glist"><div class="glbl">完整步骤（' + exp.steps.length + ' 步）</div>' + list + '</div>'
    + '</div>';
  box.classList.add('show');
  const gl = box.querySelector('.glist'); if (gl && scrollTop) gl.scrollTop = scrollTop;
  const b1 = box.querySelector('#gFull'); if (b1) b1.addEventListener('click', () => tutToggle(true));
  const b2 = box.querySelector('#gRestart'); if (b2) b2.addEventListener('click', () => { tutStart(exp.id, true); toast('已重置工作台，从第 1 步重做'); });
  const b3 = box.querySelector('#gOff'); if (b3) b3.addEventListener('click', () => { Lab.tut.handOff = true; guideRender(true); toast('步骤面板已收起（点右上「📘 实验教程」可再打开）'); });
  const b4 = box.querySelector('#gDemo'); if (b4) b4.addEventListener('click', () => { Lab.tut.demoN = (Lab.tut.demoN || 0) + 1; const r = tutDemo(); if (!r.ok) toast(r.why); });
  guidePaint(t);
}

/* --------------------------- 接入：包住教程的状态机 --------------------------- */
function guideWrapTut() {
  const _start = window.tutStart, _reset = window.tutReset, _tick = window.tutTick, _toggle = window.tutToggle;
  window.tutStart = function (id, restart) {
    const r = _start(id, restart);
    gActs = [];                                 // 摆仪器是教程自动做的，不算"玩家动作"（不然一开局就误报）
    Lab.tut.pcache = {}; Lab.tut.pi = 0; Lab.tut.pdone = {}; Lab.tut.idle = 0; Lab.tut.nudge = null; Lab.tut.wrong = 0; Lab.tut.handOff = false;
    gLastStep = -1; gHint = 0; gLastDone = null; gKey = '';
    _toggle.call(null, false);                 // 手把手：面板让开，别挡着工作台
    guideRender(true);
    return r;
  };
  window.tutReset = function () {
    const r = _reset(); gActs = []; Lab.tut.handOff = false;
    Lab.tut.nudge = null; Lab.tut.wrong = 0; Lab.tut.pdone = {}; Lab.tut.pi = 0;   // 退出教程 → 引导状态一起清干净
    guideRender(true); return r;
  };
  window.tutToggle = function (on) { const r = _toggle(on); gSig = ''; guideRender(true); return r; };
  window.tutTick = function (dt) {
    const before = Lab.tut.step;
    _tick(dt);
    if (Lab.tut.step !== before && tutExp()) {
      const prev = tutExp().steps[before];
      if (prev) { gLastDone = { text: '第 ' + Lab.tut.step + ' 步完成：' + prev.t, at: Lab.time }; Lab.tut.pi = 0; }
    }
    guideTick(dt);
  };
}

function guideInit() {
  if (document.querySelector('#guarrow')) return;
  const ar = document.createElement('div');
  ar.id = 'guarrow'; ar.className = 'guarrow';
  document.body.appendChild(ar);
  window.addEventListener('scroll', () => guidePaintLast(), true);
  window.addEventListener('resize', () => guidePaintLast());
  guideInstall(); guideWrapTut(); guideRender(true);
  // 教程模块导出的是"包装前"的函数引用 —— 这里换成包装后的，外部调用才走引导
  Object.assign(window.CHEM, { tutStart: window.tutStart, tutReset: window.tutReset, tutTick: window.tutTick, tutToggle: window.tutToggle });
  // 动作函数同理：CHEM.addReagent 等也要经过录制器，否则"程序化操作"会绕过引导判定
  GUIDE_KINDS.forEach((k) => { if (typeof window[k] === 'function' && window.CHEM[k]) window.CHEM[k] = window[k]; });
}
document.addEventListener('DOMContentLoaded', guideInit);

Object.assign(window.CHEM, {
  guideOn: guideOn, guideTarget: guideTarget, guidePlan: guidePlan, guideCoverage: guideCoverage,
  guideTick: guideTick, guideRender: guideRender, guideCfg: gCfg,
  guideActs: () => gActs.slice(),
  guideState: () => {
    const exp = tutExp(), t = guideTarget();
    return {
      on: guideOn(), mode: Lab.tut.open ? 'list' : 'hand', exp: exp ? exp.id : null, step: Lab.tut.step,
      steps: exp ? exp.steps.length : 0, pi: Lab.tut.pi, wrong: Lab.tut.wrong || 0, demoN: Lab.tut.demoN || 0,
      hint: gHint, idle: Math.round((Lab.tut.idle || 0) * 10) / 10, nudge: Lab.tut.nudge || null,
      plan: exp ? guidePlan(exp, Lab.tut.step) : [],
      target: t ? { key: t.key, label: t.label, kind: t.kind, want: t.want || null, tag: t.el ? (t.el.tagName + (t.el.dataset ? JSON.stringify(t.el.dataset) : '')) : null,
        visible: !!(t.el && t.el.getBoundingClientRect().width > 0) } : null,
    };
  },
});

const EXT_EXPS = { e16: '离子检验是中考必考题型，教材正文以"活动与探究"形式给出', e18: '碳酸氢钠的性质属拓展内容', e20: '结晶水与无水硫酸铜检验水，教材"拓展视野"内容' };

const unitLabel = (u) => u.book + ' · 第' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'][u.no] + '单元';
const courseOf = (id) => {
  for (const u of CURRICULUM) {
    for (const l of u.lessons) if (l.exps.indexOf(id) >= 0) return { u, l };
  }
  return null;
};

/** 把课程表回填进实验数据：分组标签、课题信息。表是唯一真源。 */
function courseApply() {
  if (typeof TUT === 'undefined') return [];
  const miss = [];
  TUT.forEach((e) => {
    if (e.ext === 'cmp') return;                     // 化合物制备课：自成一条轨，不占教材单元表
    const hit = courseOf(e.id);
    if (!hit) { miss.push(e.id); return; }
    e.grp = unitLabel(hit.u) + '（' + hit.l.n + ' ' + hit.l.t + '）';
    e.course = { unit: hit.u.unit, unitNo: hit.u.no, book: hit.u.book, lesson: hit.l.n + ' ' + hit.l.t, alt: hit.u.alt };
  });
  return miss;
}

const courseStats = () => {
  let core = 0, todo = 0, exps = 0, out = 0;
  CURRICULUM.forEach((u) => u.lessons.forEach((l) => { core += 1; exps += l.exps.length; todo += l.todo.length; }));
  let cmp = 0;
  (typeof TUT !== 'undefined' ? TUT : []).forEach((e) => { if (e.ext === 'cmp') { cmp += 1; return; } if (!courseOf(e.id)) out += 1; });
  return { units: CURRICULUM.length, lessons: core, exps, todo, out, cmp };
};
/** 自查：有没有实验没进课程表、有没有课程表点了名但游戏里没有的实验 */
const courseAudit = () => {
  const ids = (typeof TUT !== 'undefined' ? TUT : []).filter((e) => e.ext !== 'cmp').map((e) => e.id);
  const mapped = [];
  CURRICULUM.forEach((u) => u.lessons.forEach((l) => l.exps.forEach((x) => mapped.push(x))));
  return {
    unmapped: ids.filter((x) => mapped.indexOf(x) < 0),          // 游戏里有、表里没写
    missing: mapped.filter((x) => ids.indexOf(x) < 0),           // 表里写了、游戏里没有
    dup: mapped.filter((x, i) => mapped.indexOf(x) !== i),
  };
};

function courseOpen(on) {
  const m = document.querySelector('#courseModal');
  if (!m) return;
  const show = on == null ? !m.classList.contains('show') : !!on;
  if (show) m.innerHTML = '<div class="cbox">' + courseHTML() + '</div>';
  m.classList.toggle('show', show);
  if (show) {
    const s = document.querySelector('#cSearch');
    if (s) {
      s.addEventListener('input', () => {
        const q = s.value.trim().toLowerCase();
        const units = [...document.querySelectorAll('#courseModal .cunit')];
        const hitStrong = (el) => (el.dataset.strong || '').toLowerCase().indexOf(q) >= 0;
        /* 标题命中优先：搜"溶液"就该先给"第九单元 溶液"，而不是把所有提到溶液的边角都翻出来 */
        const anyStrong = !q || units.some((u) => hitStrong(u) || [...u.querySelectorAll('.clesson')].some(hitStrong));
        units.forEach((u) => {
          let any = false;
          u.querySelectorAll('.clesson').forEach((l) => {
            const hit = !q || (anyStrong ? (hitStrong(u) || hitStrong(l)) : (l.dataset.key || '').indexOf(q) >= 0);
            l.style.display = hit ? '' : 'none';
            if (hit) any = true;
          });
          u.style.display = any ? '' : 'none';
        });
      });
      s.focus();
    }
    m.querySelectorAll('.cchip[data-exp]').forEach((b) => b.addEventListener('click', () => {
      const id = b.dataset.exp;
      courseOpen(false);
      if (window.CHEM && window.CHEM.tutStart) window.CHEM.tutStart(id, true);
    }));
    m.querySelector('#cClose').addEventListener('click', () => courseOpen(false));

}
