<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元素实验室 · 真实化学沙盒</title>
<style>
/* 元素实验室 —— 样式（深色实验室风） */
:root {
  --bg: #080d12; --panel: #0f1922; --panel2: #14222d; --line: #20343f;
  --txt: #d9e9f4; --dim: #7d9cb0; --acc: #4fd1c5; --warm: #ffb454; --bad: #ff7a5c; --ok: #8ce07a;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--txt); font: 13px/1.5 "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
  background: radial-gradient(1200px 700px at 20% -10%, #12222e 0%, var(--bg) 60%);
  overflow: hidden;
}
h4, h5 { margin: 0 0 6px; font-size: 13px; }
button { font: inherit; color: var(--txt); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; cursor: pointer; transition: .12s; }
button:hover { border-color: var(--acc); background: #1b2c38; }
button.primary { background: linear-gradient(180deg, #1d4a4a, #16383a); border-color: #2f7b76; color: #d8fffa; }
button.on { border-color: var(--warm); box-shadow: 0 0 0 1px #ffb45433 inset; color: #ffdca8; }
input, select { font: inherit; color: var(--txt); background: #0b141b; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }

header {
  height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #122330, #0d1a22);
}
header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
header h1 small { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 6px; }
header .stat { color: var(--dim); font-size: 12px; }
header .stat b { color: var(--acc); }
header .spacer { flex: 1; }

main { display: grid; grid-template-columns: 402px minmax(470px, 1fr) 372px; gap: 10px; padding: 10px; height: calc(100vh - 52px); }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; min-height: 0; }
.pane > .scroll { overflow: auto; min-height: 0; }

/* 周期表 */
#ptable { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; margin-bottom: 8px; }
.el { aspect-ratio: 1; padding: 0; border-width: 1px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.el b { font-size: 11px; }
.el i { font-size: 7.5px; color: var(--dim); font-style: normal; }
.el:hover { transform: translateY(-1px); border-color: #fff; }
#elemInfo { border-top: 1px solid var(--line); padding-top: 8px; }
#elemInfo h4 .sym { color: var(--acc); font-size: 15px; }
.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 1px 0; }
.kv span { color: var(--dim); }
.hazard { color: var(--bad); font-size: 12px; margin: 4px 0; }
#elemInfo button { width: 100%; margin-top: 6px; }

/* 试剂架 */
#shelfSearch { width: 100%; margin-bottom: 8px; }
.shelfsec { margin-bottom: 8px; }
.shelfsec h5 { color: var(--dim); text-transform: none; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 3px 7px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.chip b { font-size: 11px; }
.chip span { font-size: 10px; color: var(--dim); }
.hint { color: var(--dim); font-size: 11px; }

/* 工作台 */
#addApparatus { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
#addApparatus button i { color: var(--dim); font-size: 10px; font-style: normal; margin-left: 4px; }
#bench { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; overflow: auto; }
.empty { color: var(--dim); padding: 40px; width: 100%; text-align: center; }
.appcard { width: 216px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; }
.appcard.sel { border-color: var(--acc); box-shadow: 0 0 0 1px #4fd1c555, 0 6px 20px #0008; }
.apphead { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 4px; }
.apphead .uid, .apphead .cap { color: var(--dim); font-size: 10px; }
.apphead .uid { margin-left: auto; }
.vessel { width: 100%; height: 148px; border-radius: 8px; display: block; background: #0a1116; }
.readouts { margin: 6px 0; font-size: 11px; }
.ro { display: flex; gap: 6px; align-items: center; }
.ro b.hot { color: var(--warm); }
.contents { color: var(--dim); font-size: 10.5px; word-break: break-all; }
.contents.gas { color: #9fd8ff; }
.warn { color: var(--bad); font-size: 11px; }
.ops { display: flex; flex-wrap: wrap; gap: 4px; }
.ops button { padding: 3px 6px; font-size: 11px; }
.heatrow { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
.heatrow .lbl { color: var(--dim); font-size: 11px; }
.hbtn { padding: 2px 6px; font-size: 11px; }
.hbtn i { color: var(--dim); font-style: normal; font-size: 10px; }

/* 日志 */
#log { flex: 1; overflow: auto; font-size: 12px; }
.logrow { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px dashed #1a2b36; }
.logrow .ic { width: 16px; }
.logrow.rxn .tx { color: #bff5ea; }
.logrow.warn .tx { color: var(--warm); }
.logrow.task .tx { color: var(--ok); }
.logrow small { color: var(--dim); }
#tasks { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
.task { font-size: 12px; padding: 2px 0; color: #cfe6f2; }
.task.done { color: var(--dim); text-decoration: line-through; }

/* 弹窗与提示 */
#modal { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 50; }
#modal.show { display: flex; }
#modal .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: 320px; box-shadow: 0 20px 60px #000c; }
#modal label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 12px; }
#modal input, #modal select { width: 130px; }
#modal .row { display: flex; gap: 8px; margin-top: 12px; }
#modal .row button { flex: 1; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #16323c; border: 1px solid var(--acc); color: #d8fffa; padding: 8px 16px; border-radius: 20px; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.pane h3 { margin: 0 0 6px; font-size: 13px; color: var(--dim); font-weight: 500; }

/* 炸裂的容器 */
.appcard.broken { border-color: #ff6b6b; background: rgba(60, 18, 22, 0.55); }
.appcard.broken .vessel { filter: saturate(0.6); }
.readouts .warn.big { color: #ff9a9a; font-weight: 600; line-height: 1.5; }

</style>
</head>
<body>
<header>
  <h1>🧪 元素实验室<small>真实物理 · 真实化学</small></h1>
  <span class="stat">容器 <b id="apparatusCount">0 / 6</b></span>
  <span class="stat">已发现反应 <b id="rxCount">0</b> / <b id="rxTotal">0</b></span>
  <span class="spacer"></span>
  <button id="guideToggle">🎓 引导 开/关</button>
  <button id="resetAll">↺ 重置</button>
</header>
<main>
  <aside class="pane" id="left">
    <h3>元素周期表（118 种，点格子取用）</h3>
    <div class="scroll">
      <div id="ptable"></div>
      <div id="elemInfo"><span class="hint">点一个元素看真实数据（原子量 / 熔点 / 沸点 / 密度 / 电负性 / 危险性）</span></div>
    </div>
  </aside>
  <section class="pane" id="center">
    <h3>工作台</h3>
    <div id="addApparatus"></div>
    <div id="bench"></div>
  </section>
  <aside class="pane" id="right">
    <h3>试剂架</h3>
    <input id="shelfSearch" placeholder="搜索试剂 / 化学式…">
    <div class="scroll" id="shelf" style="max-height:38%"></div>
    <h3 style="margin-top:8px">现象日志</h3>
    <div id="log"></div>
    <div id="tasks"></div>
  </aside>
</main>
<div id="modal"></div>
<div id="toast"></div>

/* ============================================================================
 * 02-chem.js —— 化学内核：化学式解析、摩尔质量、物质库
 * ----------------------------------------------------------------------------
 * 物质库格式（| 分隔）：
 *   化学式|名称|298K态|类别|颜色|溶解度|ΔfH°|备注
 *     态：s 固 / l 液 / g 气 / aq 水溶液中的溶质
 *     类别：solvent acid base salt oxide element organic indicator ore
 *     溶解度：数值 g/100g 水(20°C) ／ - 不溶 ／ ~ 微溶 ／ ∞ 互溶 ／ 空 未知
 *     ΔfH°：kJ/mol，前面加 ~ 表示估算值（无真实数据）；空 = 未知
 *   化学式支持：括号、结晶水（·）、电荷（^2- / ^+）
 * ==========================================================================*/

/** 解析化学式 → { atoms: Map<符号,个数>, charge: number } */
function parseFormula(f) {
  let body = String(f).trim(), charge = 0;
  const cm = /^(.*?)\^(\d*)([+-])$/.exec(body);
  if (cm) { body = cm[1]; charge = (cm[2] ? Number(cm[2]) : 1) * (cm[3] === '+' ? 1 : -1); }
  const atoms = new Map();
  const countGroup = (str, mult) => {
    let i = 0;
    while (i < str.length) {
      const ch = str[i];
      if (ch === '(') {
        let depth = 1, j = i + 1;
        while (j < str.length && depth > 0) { if (str[j] === '(') depth++; else if (str[j] === ')') depth--; j++; }
        let k = j, num = '';
        while (k < str.length && /\d/.test(str[k])) num += str[k++];
        countGroup(str.slice(i + 1, j - 1), mult * (num ? Number(num) : 1));
        i = k;
      } else if (/[A-Z]/.test(ch)) {
        let sym = ch, j = i + 1;
        while (j < str.length && /[a-z]/.test(str[j])) sym += str[j++];
        let num = '';
        while (j < str.length && /\d/.test(str[j])) num += str[j++];
        if (!ELEM_BY_SYM.has(sym)) throw new Error('未知元素符号: ' + sym + ' (在 ' + f + ')');
        atoms.set(sym, (atoms.get(sym) || 0) + mult * (num ? Number(num) : 1));
        i = j;
      } else i++;
    }
  };
  // 结晶水：CuSO4·5H2O → CuSO4 + 5×(H2O)
  body.split(/[·⋅.]/).forEach((part, idx) => {
    let p = part, mult = 1;
    const hm = /^(\d+)(.+)$/.exec(p);
    if (hm && idx > 0) { mult = Number(hm[1]); p = hm[2]; }
    countGroup(p, mult);
  });
  return { atoms, charge };
}

/** 摩尔质量 g/mol（由元素真实原子量累加，不查表 → 不可能写错） */
const _mmCache = new Map();
function molarMass(f) {
  if (_mmCache.has(f)) return _mmCache.get(f);
  let m = 0;
  try { parseFormula(f).atoms.forEach((n, sym) => { m += n * ELEM_BY_SYM.get(sym).mass; }); }
  catch (e) { m = NaN; }
  m = Math.round(m * 1000) / 1000;
  _mmCache.set(f, m);
  return m;
}

/* ============================================================================
 * 03-reactions.js —— 反应引擎：自动配平 + 真实反应库 + 匹配与推进
 * ----------------------------------------------------------------------------
 * 设计要点：
 *   1) 反应只写「左边有什么、右边有什么」，系数由线性代数配平器求出
 *      （分数精确运算 + 零空间），配不出来的模板直接不进库并记 warning。
 *   2) 每一条入库反应都会跑一次元素守恒 + 电荷守恒校验，校验不过 = 抛错。
 *   3) ΔH 由生成焓 ΔfH° 自动算（ΔH = ΣνΔfH°(产物) − ΣνΔfH°(反应物)）；
 *      缺数据的标「估算」，有真实数据的标「实测」，不冒充。
 * ==========================================================================*/

/* ------------------------------ 精确分数工具 ------------------------------ */
const _gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
const _lcm2 = (a, b) => Math.abs(a * b) / _gcd(a, b);
function fr(n, d = 1) { if (d < 0) { n = -n; d = -d; } if (n === 0) return [0, 1]; const g = _gcd(n, d); return [n / g, d / g]; }
const fAdd = (a, b) => fr(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
const fSub = (a, b) => fr(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
const fMul = (a, b) => fr(a[0] * b[0], a[1] * b[1]);
const fDiv = (a, b) => fr(a[0] * b[1], a[1] * b[0]);

/* ------------------------------- 配平器 --------------------------------- */
/** 求 lhs/rhs 的最简整数系数；无唯一正解则返回 null */
function balanceReaction(lhs, rhs) {
  const n = lhs.length + rhs.length;
  if (!lhs.length || !rhs.length) return null;
  if (lhs.some((f) => rhs.includes(f))) return null;          // 两边同种物质 → 拒绝
  const all = lhs.concat(rhs);
  let parsed;
  try { parsed = all.map(parseFormula); } catch (e) { return null; }
  const signs = all.map((_, i) => (i < lhs.length ? 1 : -1));
  const elems = new Set();
  parsed.forEach((p) => p.atoms.forEach((_, k) => elems.add(k)));
  const rows = [...elems].map((el) => parsed.map((p, i) => (p.atoms.get(el) || 0) * signs[i]));
  if (parsed.some((p) => p.charge !== 0)) rows.push(parsed.map((p, i) => p.charge * signs[i]));
  const m = rows.length;
  const A = rows.map((r) => r.map((v) => fr(v)));

  // 高斯-约当消元（RREF）
  const pivot = [];
  let r = 0;
  for (let c = 0; c < n && r < m; c++) {
    let p = -1;
    for (let i = r; i < m; i++) if (A[i][c][0] !== 0) { p = i; break; }
    if (p < 0) continue;
    const t = A[r]; A[r] = A[p]; A[p] = t;
    const pv = A[r][c];
    for (let j = c; j < n; j++) A[r][j] = fDiv(A[r][j], pv);
    for (let i = 0; i < m; i++) {
      if (i === r || A[i][c][0] === 0) continue;
      const k = A[i][c];
      for (let j = c; j < n; j++) A[i][j] = fSub(A[i][j], fMul(k, A[r][j]));
    }
    pivot.push(c); r++;
  }
  const free = [];
  for (let c = 0; c < n; c++) if (!pivot.includes(c)) free.push(c);
  if (free.length !== 1) return null;                          // 需唯一解
  const fc = free[0];
  const x = new Array(n).fill(null).map(() => [0, 1]);
  x[fc] = [1, 1];
  pivot.forEach((pc, idx) => { x[pc] = fr(-A[idx][fc][0], A[idx][fc][1]); });

  // 清分母 → 最简整数
  let L = 1;
  x.forEach((v) => { L = _lcm2(L, v[1]); });
  let ints = x.map((v) => Math.round(v[0] * L / v[1]));
  let g = 0;
  ints.forEach((v) => { g = _gcd(g, v); });
  if (g > 1) ints = ints.map((v) => v / g);
  if (ints.some((v) => !Number.isFinite(v)) || ints.some((v) => v <= 0)) return null;
  return ints;
}

/** 守恒校验：左右原子数 + 电荷（配平的最终判据） */
function verifyBalance(lhs, rhs, coef) {
  const all = lhs.concat(rhs);
  const parsed = all.map(parseFormula);
  const bad = [];
  const elems = new Set();
  parsed.forEach((p) => p.atoms.forEach((_, k) => elems.add(k)));
  elems.forEach((el) => {
    let s = 0;
    parsed.forEach((p, i) => { s += p.atoms.get(el) * coef[i] * (i < lhs.length ? 1 : -1); });
    if (Math.abs(s) > 1e-9) bad.push(el + (s > 0 ? ' 多' : ' 少') + Math.abs(s));
  });
  let q = 0;
  parsed.forEach((p, i) => { q += p.charge * coef[i] * (i < lhs.length ? 1 : -1); });
  if (Math.abs(q) > 1e-9) bad.push('电荷不平衡 ' + q);
  return bad;
}

/** 建库：配平 → 校验 → 入库；任何一条不配平都不进库 */
function buildReactions() {
  RX_DEFS.forEach(([kind, lhsS, rhsS, condS, rate, phen, note]) => {
    const lhs = lhsS.split(',').map((s) => s.trim());
    const rhs = rhsS.split(',').map((s) => s.trim());
    const unknown = lhs.concat(rhs).filter((f) => !SUB.has(f));
    if (unknown.length) { RX_WARN.push({ lhs: lhsS, rhs: rhsS, why: '物质库缺少: ' + unknown.join(',') }); return; }
    const coef = balanceReaction(lhs, rhs);
    if (!coef) { RX_WARN.push({ lhs: lhsS, rhs: rhsS, why: '配平失败（无唯一整数解）' }); return; }
    const bad = verifyBalance(lhs, rhs, coef);
    if (bad.length) { RX_WARN.push({ lhs: lhsS, rhs: rhsS, why: '守恒校验失败: ' + bad.join('/') }); return; }
    const cond = parseCond(condS);
    // ΔH：全部有生成焓才算「实测」，缺数据则按类别估算
    let dh = 0, dhAq = 0, missing = false, est = false, estAq = false;
    const sum = (arr, off, sgn) => arr.forEach((f, i) => {
      const s = subOf(f);
      if (!s || !s.dHf) { missing = true; return; }
      if (s.dHf.est) est = true;
      dh += sgn * coef[off + i] * s.dHf.v;
      // 逐物质判断：在溶液里以水合离子存在的用 ΔfH°(aq)；
      // 金属固体、以及会冒泡逸出的气体（CO₂/H₂…）仍用它自己纯态的值。
      const aq = s.st === 'g' ? null : DHF_AQ[f];
      if (aq ? aq.est : s.dHf.est) estAq = true;
      dhAq += sgn * coef[off + i] * (aq ? aq.v : s.dHf.v);
    });
    sum(lhs, 0, -1); sum(rhs, lhs.length, +1);
    if (missing) {
      const KIND_DH = { 中和: -57, 燃烧: -550, 置换: -150, 化合: -300, 分解: 120, 复分解: -60, 氧化还原: -200 };
      dh = KIND_DH[kind] != null ? KIND_DH[kind] : -100;
      est = true;
      dhAq = dh; estAq = true;
    }
    dh = Math.round(dh * 10) / 10;
    dhAq = Math.round(dhAq * 10) / 10;
    // 气体／沉淀自动识别
    const gases = [], ppts = [];
    rhs.forEach((f, i) => {
      const s = subOf(f);
      if (s.st === 'g') gases.push(f);
      else if ((s.solubility === -1 || s.solubility === -2) && ['salt', 'base', 'oxide'].includes(s.cat)
        && (cond.sol || lhs.some((lf) => subOf(lf).st === 'aq'))) ppts.push(f);
    });
    const eq = lhs.map((f, i) => (coef[i] > 1 ? coef[i] : '') + f).join(' + ')
      + ' → ' + rhs.map((f, i) => (coef[lhs.length + i] > 1 ? coef[lhs.length + i] : '') + f
        + (gases.includes(f) ? '↑' : ppts.includes(f) ? '↓' : '')).join(' + ');
    const condText = [cond.ignite ? '点燃' : '', cond.temp ? '≥' + cond.temp + 'K' : '',
      cond.cat ? '催化剂 ' + cond.cat : '', cond.conc === 'conc' ? '浓' : cond.conc === 'dil' ? '稀' : '',
      cond.discharge ? '放电' : '', cond.sol ? '溶液' : ''].filter(Boolean).join(' · ');
    RXNS.push({
      id: RXNS.length, kind, lhs, rhs, coef, cond, rate, phen: phen.split('、'),
      note, dH: dh, dhEst: est, dHaq: dhAq, dhAqEst: estAq, gases, ppts, eq, condText,
      key: lhs.slice().sort().join(',') + '>' + rhs.slice().sort().join(','),
    });
  });
  return RXNS;
}
buildReactions();

/* ------------------------------ 反应匹配 --------------------------------- */
/** 条件是否满足（env = {temp, catalysts:Set, conc, dilute}） */
function condMet(rx, env) {
  const c = rx.cond;
  if (c.ignite && !env.ignite) return false;
  if (c.elec && !env.elec) return false;
  if (c.discharge && !env.discharge) return false;
  if (c.light && !env.light) return false;
  if (c.temp && env.temp + 1e-6 < c.temp) return false;
  if (c.cat && !(env.catalysts && env.catalysts.has(c.cat))) return false;
  if (c.conc === 'conc' && env.conc !== 'conc') return false;
  if (c.conc === 'dil' && env.conc === 'conc') return false;
  return true;
}

/** 从容器内容里找出所有能进行的反应（按 条件更苛刻者优先 排序） */
function matchReactions(contents, env) {
  const have = new Map();
  contents.forEach((c) => { if (c.mol > 1e-9) have.set(c.formula, (have.get(c.formula) || 0) + c.mol); });
  const out = [];
  for (const rx of RXNS) {
    if (!condMet(rx, env)) continue;
    if (rx.cond.sol) {   // 溶液反应：允许有固体（固液界面反应），但必须存在溶液相
      const ok = rx.lhs.every((f) => (have.get(f) || 0) > 1e-9);
      const hasSolution = contents.some((c) => c.mol > 1e-9 && (c.dissolved || subOf(c.formula).st === 'aq' || subOf(c.formula).st === 'l'));
      if (!ok || !hasSolution) continue;
    } else if (!rx.lhs.every((f) => (have.get(f) || 0) > 1e-9)) continue;
    // 反应进度上限 = 极限试剂
    let max = Infinity;
    rx.lhs.forEach((f, i) => { max = Math.min(max, (have.get(f) || 0) / rx.coef[i]); });
    if (!(max > 1e-12)) continue;
    out.push({ rx, max });
  }
  // 更苛刻（有温度/点燃/催化剂要求）的排前面，避免被泛化反应抢走
  out.sort((a, b) => {
    const sc = (o) => (o.rx.cond.ignite ? 8 : 0) + (o.rx.cond.cat ? 4 : 0) + (o.rx.cond.conc ? 2 : 0) + (o.rx.cond.temp ? 1 : 0);
    return sc(b) - sc(a) || b.rx.rate - a.rx.rate;
  });
  return out;
}

/** 按极限试剂推进一次反应；返回 {extent, dH(J), eq, phen, gases, ppts}
 *  inSolution=true 时用「水合离子生成焓」算 ΔH —— 溶液里真正生成的是水合离子，
 *  用纯态生成焓会把中和热算成 −104 kJ/mol（真值 −57.3）。 */
function applyReaction(match, dtSec, inSolution) {
  const { rx, max } = match;
  const rateLimit = rx.rate * 0.25 * dtSec;         // 速率越高越快完成
  const extent = Math.min(max, rateLimit);
  if (!(extent > 1e-12)) return null;
  const useAq = !!inSolution && rx.dHaq != null && !rx.dhAqEst;
  const dh = useAq ? rx.dHaq : rx.dH;
  return {
    rx, extent, dHUsed: dh, usedAq: useAq,
    dH: dh * 1000 * extent,                       // kJ/mol → J
    consume: rx.lhs.map((f, i) => ({ formula: f, mol: rx.coef[i] * extent })),
    produce: rx.rhs.map((f, i) => ({ formula: f, mol: rx.coef[rx.lhs.length + i] * extent })),
  };
}

/* 自检：全库守恒（探针会再独立跑一遍） */
const RX_BAD = RXNS.filter((rx) => verifyBalance(rx.lhs, rx.rhs, rx.coef).length > 0);

/* ============================================================================
 * 04-physics.js —— 物理层：热量、相变、溶解、浓度、pH（全部按真实公式/常数）
 * ----------------------------------------------------------------------------
 * 统一记账单位：物质的量 mol（质量 g = mol × M，体积 L 由水的量推出）
 *   热     Q = Σ n·Cp,m·ΔT      （水 Cp,m = 75.3 J/(mol·K)，实测）
 *   供热   Q = P·η·dt，且不超过热源温度（火焰不是无限热源）
 *   散热   牛顿冷却 dQ = -k·(T−T_env)·dt
 *   沸腾   达到沸点后多出来的能量全部用于汽化：Δn = ΔQ / ΔHvap（水 40.65 kJ/mol → 2257 J/g）
 *   溶解   溶解速率 ∝ 表面积 ×(1−c/c_sat)，并计入真实溶解焓（硝酸铵溶于水会真的变冷）
 *   沸点升高 ΔTb = Kb·b（水 Kb=0.512）、凝固点降低 ΔTf = Kf·b（Kf=1.86）
 * ==========================================================================*/

const PHYS = {
  R: 8.314, T0: 298.15, P0: 101325,
  Kb: 0.512, Kf: 1.86,          // 水的沸点升高 / 凝固点降低常数 K·kg/mol
  ETA_FLAME: 0.35, ETA_PLATE: 0.72,  // 火焰/电热板 传热效率
  MAX_PARTICLES: 140,
};

const _sub = (f) => subOf(f);

/** 液态水物质的量 */
const waterMol = (app) => app.contents.filter((c) => c.formula === 'H2O' && c.phase !== 'g')
  .reduce((a, c) => a + c.mol, 0);
/** 水溶液体积 L */
const waterVolume = (app) => waterMol(app) * 18.015 / 1000;
/** 玻璃器皿炸裂：内容物洒掉、热源/电源断开、留下碎玻璃 —— 真实实验室最常见的翻车 */
function breakVessel(app, why) {
  if (app.broken) return;
  app.broken = true;
  app.brokenWhy = why;
  app.contents = [];
  app.heater = null;
  app.elec = false;
  app.ignited = false;
  app.bubbleRate = 0; app.pptRate = 0; app.flash = 0; app.flame = 0; app.smoke = 0;
  app.temp = PHYS.T0 + 15;
  for (let i = 0; i < 16; i++) {
    app.shards.push({
      x: (Math.random() - 0.5) * 1.05, y: Math.random() * 0.35,
      r: 2 + Math.random() * 4.5, rot: Math.random() * 6.283,
    });
  }
  Lab.log.push({ k: 'warn', text: '❌ ' + app.def.name + ' 炸裂：' + why + '　内容物全部洒掉，容器报废（点「✕ 移除」清理）', at: Lab.time });
  Lab.lastMsg = app.def.name + ' 炸裂了！' + why;
  Lab.brokenCount = (Lab.brokenCount || 0) + 1;
}

/** 骤冷判定：往滚烫的玻璃器皿里加室温物料 → 热应力炸裂 */
function shockCheck(app, addMassG) {
  if (app.broken || app.def.mat !== 'glass') return false;
  if (!(app.temp > 430) || !(addMassG > 1)) return false;
  const C0 = heatCapacity(app), C1 = addMassG * 4.18;
  const mixed = (C0 * app.temp + C1 * PHYS.T0) / Math.max(1e-6, C0 + C1);
  if (app.temp - mixed > 130) {
    breakVessel(app, '骤冷：' + Math.round(app.temp - 273.15) + '°C 的器皿直接加入室温物料，热应力炸裂');
    return true;
  }
  return false;
}

/** 容器里气相空间能装多少 mol 气体（1 atm 理想气体，气体受热膨胀后装得更少） */
function headspaceMol(app) {
  const ml = Math.max(0, app.def.cap - waterVolume(app));
  return (ml / 1000) / 24.5 * (298.15 / Math.max(200, app.temp));
}
const gasInApp = (app, formula) => app.contents
  .filter((c) => c.phase === 'g' && (!formula || c.formula === formula))
  .reduce((a, c) => a + c.mol, 0);
/** 把气体放进容器气相：装不下的部分冒泡逸出；两种情况都计入「放出过这种气体」 */
function putGas(app, formula, mol) {
  const room = Math.max(0, headspaceMol(app) - gasInApp(app));
  const keep = Math.min(mol, room);
  if (keep > 1e-12) addContent(app, formula, keep, 'g', false);
  const out = mol - keep;
  if (out > 1e-12) app.gasBubbles.push({ f: formula, mol: out });
  app.gasVented += Math.max(0, out);
  app.gasOut[formula] = (app.gasOut[formula] || 0) + mol;
  return keep;
}
/** 溶质总物质的量（已溶解、非水） */
const soluteMol = (app) => app.contents.filter((c) => c.dissolved && c.formula !== 'H2O')
  .reduce((a, c) => a + c.mol, 0);
/** 质量 g */
const massOf = (c) => c.mol * (_sub(c.formula) ? _sub(c.formula).M : 20);
const totalMass = (app) => app.contents.reduce((a, c) => a + massOf(c), 0) + app.glassMass;

/** 热容 J/K：内容物 + 玻璃器壁 */
function heatCapacity(app) {
  let C = app.glassMass * 0.83;                 // 硼硅玻璃 cp ≈ 0.83 J/(g·K)
  app.contents.forEach((c) => {
    const s = _sub(c.formula); if (!s) return;
    C += c.mol * subCp(s) * s.M;
  });
  return C;
}

/** 沸点 K：水的沸点 + 溶质引起的沸点升高 */
function boilingPoint(app) {
  const w = waterMol(app); if (!w) return 373.15;
  const m = (soluteMol(app) / (w * 18.015)) * 1000;   // 质量摩尔浓度 mol/kg
  return 373.15 + PHYS.Kb * m;
}
/** 凝固点 K */
function freezingPoint(app) {
  const w = waterMol(app); if (!w) return 273.15;
  const m = (soluteMol(app) / (w * 18.015)) * 1000;
  return 273.15 - PHYS.Kf * m;
}

/* --------------------------------- 溶解 ---------------------------------- */
const _dissRate = new Map();
function stepDissolution(app, dt) {
  const w = waterMol(app);
  if (!w) return;
  const V = waterVolume(app);
  app.contents.forEach((c) => {
    if (c.dissolved || c.phase === 'g' || c.formula === 'H2O') return;
    const s = _sub(c.formula); if (!s || !s.balanced) return;
    if (!Number.isFinite(c.mol) || c.mol <= 0) return;
    let sol = s.solubility;
    if (sol === -1) return;                       // 不溶
    if (sol === -2) sol = 0.2;                    // 微溶
    if (sol === Infinity) sol = 1000;
    if (sol == null) sol = 5;
    // 溶解度随温度升高而增大（KNO3 类显著，用 2%/K 近似）
    sol *= 1 + 0.02 * (app.temp - 298.15);
    const csat = (sol * 10) / s.M;                // mol/L
    const conc = c.mol / V;
    if (conc >= csat - 1e-12) return;
    const area = Math.pow(Math.max(c.mol, 1e-9), 2 / 3);   // 表面积近似
    let rate = 0.35 * area * (1 - conc / csat);            // mol/s
    if (s.st === 'aq' || s.st === 'l') rate = c.mol / dt;  // 液体/溶液立刻混匀
    const dn = Math.min(c.mol, rate * dt, (csat - conc) * V);
    if (dn <= 1e-12) return;
    c.mol -= dn;
    addContent(app, c.formula, dn, 'aq', true);
    const dh = DISSOLUTION_DH[c.formula];
    if (dh != null) app.heatBuffer += -dh * 1000 * dn;      // 吸热为正 → 温度下降
    app.events.push({ t: 'dissolve', f: c.formula, mol: dn, dh: dh || 0 });
    if (c.mol <= 1e-9) c.mol = 0;
  });
  app.contents = app.contents.filter((c) => c.mol > 1e-12);   // 清掉溶解完的空壳
}

/* ------------------------------ 内容物操作 ------------------------------- */
function addContent(app, formula, mol, phase, dissolved) {
  const ex = app.contents.find((c) => c.formula === formula && c.phase === (phase || (subOf(formula) || {}).st) && !!c.dissolved === !!dissolved);
  if (ex) { ex.mol += mol; return ex; }
  const s = subOf(formula);
  const st = phase || (s ? s.st : 's');
  const entry = { formula, mol, phase: dissolved ? 'aq' : st, dissolved: !!dissolved, born: app.time };
  app.contents.push(entry);
  return entry;
}
function removeContent(app, formula, mol) {
  const c = app.contents.find((x) => x.formula === formula && x.mol > 0);
  if (!c) return;
  c.mol = Math.max(0, c.mol - mol);
  if (c.mol <= 1e-9) app.contents.splice(app.contents.indexOf(c), 1);
}
/** 容器里元素原子总数（守恒断言用） */
function atomTally(app) {
  const t = {}; 
  app.contents.forEach((c) => {
    const p = parseFormula(c.formula);
    p.atoms.forEach((n, sym) => { t[sym] = (t[sym] || 0) + n * c.mol; });
  });
  return t;
}

/* --------------------------------- 热量 ---------------------------------- */
function stepThermal(app, dt) {
  if (!Number.isFinite(app.temp)) app.temp = PHYS.T0;   // 自愈：任何非有限温度都拉回室温
  if (!Number.isFinite(app.heatBuffer)) app.heatBuffer = 0;
  const C = heatCapacity(app);
  let dQ = app.heatBuffer; app.heatBuffer = 0;
  const src = app.heater && app.heater.on ? app.heater : null;
  if (src) {
    const gap = src.flameT - app.temp;
    if (gap > 0) dQ += Math.min(src.power * (src.eff || PHYS.ETA_FLAME) * dt, C * gap);
  }
  dQ -= app.kCool * (app.temp - PHYS.T0) * dt;      // 牛顿冷却
  app.temp += dQ / C;

  // ---- 沸腾：多余能量全部用于汽化，温度锁在沸点 ----
  const w = waterMol(app);
  const bp = boilingPoint(app);
  if (w > 1e-9 && app.temp > bp) {
    const C2 = heatCapacity(app);
    const excess = (app.temp - bp) * C2;
    const hvapJ = (HVAP.H2O || 40.65) * 1000;
    const dn = Math.min(w, excess / hvapJ);
    app.temp = bp;
    if (dn > 0) {
      removeContent(app, 'H2O', dn);
      app.steamAccum += dn;
      app.events.push({ t: 'boil', mol: dn });
    }
    // 继续沸腾由后续供热推动（温度被锁在沸点，热量不断转成汽化）
    if (dn <= 1e-12 && src) {
      const dn2 = Math.min(w, src.power * (src.eff || PHYS.ETA_FLAME) * dt / hvapJ);
      if (dn2 > 0) { removeContent(app, 'H2O', dn2); app.steamAccum += dn2; app.events.push({ t: 'boil', mol: dn2 }); }
    }
  }
  // ---- 凝固：水结冰（放热） ----
  const fp = freezingPoint(app);
  if (w > 1e-9 && app.temp < fp) {
    const C2 = heatCapacity(app);
    const deficit = (fp - app.temp) * C2;
    const hfusJ = (HFUS.H2O || 6.01) * 1000;
    const dn = Math.min(w, deficit / hfusJ);
    if (dn > 0) { app.temp = fp; app.iceMol = (app.iceMol || 0) + dn; app.events.push({ t: 'freeze', mol: dn }); }
  }
  // ---- 干烧保护：容器耐温上限 ----
  if (app.temp > app.maxTemp) { app.temp = app.maxTemp; app.dryWarn = true; }
  // 玻璃器皿受热超过承受极限 → 炸裂（陶瓷的 breakT 比 maxTemp 高，所以永远不会触发）
  if (app.def.breakT && !app.broken && app.temp >= app.def.breakT) {
    breakVessel(app, '受热到 ' + Math.round(app.temp) + ' K（' + Math.round(app.temp - 273.15) + '°C），超过玻璃承受极限；干烧/不均匀受热必然炸裂');
  }
  if (waterMol(app) < 1e-9 && app.heater && app.heater.on) app.dryWarn = true;
  else if (waterMol(app) > 1e-9) app.dryWarn = false;
  // ---- 辐射散热让温度不会无限涨（大温差时冷却更快，已是线性近似） ----
  app.C = C;
  return app.temp;
}

/* --------------------------------- 反应 ---------------------------------- */
function stepChemistry(app, dt, env) {
  const contents = app.contents;
  const matches = matchReactions(contents, env);
  const done = [];
  for (const mt of matches) {
    const r = applyReaction(mt, dt, waterMol(app) > 1e-9);   // 有水就是溶液态 → 用水合生成焓
    if (!r) continue;
    // 消耗：跨多条同种物质记录按化学计量精确扣除（同一物质可能同时有固体和已溶两份）
    r.consume.forEach(({ formula, mol }) => {
      let need = mol;
      for (let i = 0; i < contents.length && need > 1e-12; i++) {
        const c = contents[i];
        if (c.formula !== formula) continue;
        const take = Math.min(c.mol, need);
        c.mol -= take; need -= take;
      }
    });
    for (let i = contents.length - 1; i >= 0; i--) if (contents[i].mol <= 1e-12) contents.splice(i, 1);
    // 生成产物
    r.produce.forEach(({ formula, mol }) => {
      const s = subOf(formula);
      if (s.st === 'g') {
        // 可溶气体先溶进水里（NH3/HCl/CO2…），剩下的进容器气相，装不下才冒泡逸出
        const sol = s.solubility;
        const w = waterMol(app);
        let rest = mol;
        if (w > 0 && sol !== null && sol !== -1 && sol > 0.05) {
          const csat = (sol * 10) / s.M;
          const V = waterVolume(app);
          const cur = app.contents.filter((x) => x.formula === formula && x.dissolved).reduce((a, x) => a + x.mol, 0) / V;
          const dis = Math.min(mol, Math.max(0, (csat - cur) * V));
          if (dis > 1e-12) addContent(app, formula, dis, 'aq', true);
          rest = mol - dis;
        }
        if (rest > 1e-12) putGas(app, formula, rest);
      } else {
        // 在溶液里生成的可溶物应当直接溶在水里，而不是凭空变成一堆固体颗粒
        const w = waterMol(app);
        const dissolvable = s.st === 'aq' || (s.st !== 'l' && (s.solubility === Infinity
          || (typeof s.solubility === 'number' && s.solubility > 0.01)));
        const asDissolved = dissolvable && (s.st === 'aq' || w > 1e-9);
        addContent(app, formula, mol, asDissolved ? 'aq' : null, asDissolved);
      }
    });
    app.heatBuffer -= r.dH;                    // ΔH：负=放热 → 给体系加热（符号别写反）
    app.flash = Math.min(1, app.flash + Math.min(1, Math.abs(r.dH) / 4000) * (r.dH < 0 ? 1 : 0.25));
    app.events.push({ t: 'rxn', rx: r.rx, extent: r.extent, dH: r.dH });
    done.push(r);
    if (r.rx.gases.length) app.bubbleRate = Math.min(80, app.bubbleRate + 40 * r.extent * 20);
    if (r.rx.ppts.length) {
      app.pptRate = Math.min(60, app.pptRate + 40 * r.extent * 20);
      r.rx.ppts.forEach((f) => { const p = r.produce.find((x) => x.formula === f); if (p) { app.pptMade += p.mol; app.pptBy[f] = (app.pptBy[f] || 0) + p.mol; } });
    }
    if (r.rx.phen.includes('白烟') || r.rx.phen.includes('大量白烟')) app.smoke = Math.min(1.5, app.smoke + 0.6);
    if (r.rx.phen.some((p) => p.includes('火焰') || p.includes('白光') || p.includes('火星'))) app.flame = Math.min(1.6, app.flame + 0.8);
  }
  return done;
}

/* --------------------------------- pH ----------------------------------- */
/** 真实 pKa / pKb（第一个质子） */
const ACID_PKA = { HCl: -6.3, H2SO4: -3.0, HNO3: -1.4, HF: 3.17, H3PO4: 2.15, H2CO3: 6.35, H2S: 7.05, CH3COOH: 4.76, H2O2: 11.6 };
const BASE_PKB = { NaOH: -0.6, KOH: -0.5, 'Ca(OH)2': -2.4, 'Ba(OH)2': -2.4, 'NH3·H2O': 4.75 };

function computePH(app) {
  const V = waterVolume(app);
  if (V < 1e-6) return null;
  let cH = 0, cOH = 0;
  app.contents.filter((c) => c.dissolved).forEach((c) => {
    const c0 = c.mol / V;
    const pKa = ACID_PKA[c.formula];
    if (pKa != null) {
      const ka = Math.pow(10, -pKa);
      cH += ka > 1 ? c0 : Math.sqrt(ka * c0);      // 强酸完全电离 / 弱酸近似
    }
    const pKb = BASE_PKB[c.formula];
    if (pKb != null) {
      const kb = Math.pow(10, -pKb);
      cOH += kb > 1 ? c0 : Math.sqrt(kb * c0);
    }
  });
  const net = cH - cOH;
  if (Math.abs(net) < 1e-12) return 7;
  const negLog = (x) => -Math.log10(Math.max(1e-15, Math.min(1, x)));
  return net > 0 ? negLog(net) : 14 - negLog(-net);
}
/** 指示剂颜色（真实变色范围：酚酞 8.2 无色→红，石蕊 5.5~7.5 红→蓝） */
function indicatorTint(app) {
  const ph = computePH(app);
  if (ph == null) return null;
  const has = (name) => app.contents.some((c) => c.dissolved && c.formula === name);
  if (has('酚酞')) return ph >= 8.2 ? '#e0409a' : null;
  if (has('石蕊')) return ph < 5.5 ? '#e04040' : ph > 7.5 ? '#4050e0' : '#8a5fbf';
  return null;
}

/* ------------------------------ 单步推进 -------------------------------- */
function worldStep(app, dt, env) {
  app.events = app.events.filter((e) => (app.time - (e.at || (e.at = app.time))) < 0.2);
  stepDissolution(app, dt);
  const rxns = stepChemistry(app, dt, env || { temp: app.temp });
  stepThermal(app, dt);
  app.time += dt;
  app.gasMol = app.gasBubbles.reduce((a, g) => a + g.mol, 0);
  return rxns;
}

/** 新建容器状态 */
function makeApparatus(def) {
  return {
    id: def.id, def, contents: [], temp: PHYS.T0, time: 0,
    glassMass: def.glassMass, kCool: def.kCool, maxTemp: def.maxTemp,
    heatBuffer: 0, heater: null, events: [], gasBubbles: [], steamAccum: 0, iceMol: 0,
    bubbleRate: 0, pptRate: 0, flash: 0, flame: 0, smoke: 0, dryWarn: false,
    gasVented: 0, pptMade: 0, gasOut: {}, pptBy: {}, elec: false,
    broken: false, brokenWhy: null, shards: [],
    stir: 0, ignited: false, stirrerOn: false, catalysts: new Set(),
    dirty: true, bubbles: [], ppts: [], steam: [], C: 0, gasMol: 0,
  };
}

/** 容器定义：cap 容积 mL；direct = 能否直火加热；maxTemp 耐温上限 K */

];

/** 催化剂（不消耗，只开门） */
const CATALYSTS = new Set(['MnO2', 'Fe', 'V2O5']);

const AMOUNT_DEFAULT = { g: 5, mL: 50 };   // 默认取用量

/* ------------------------------- 世界状态 -------------------------------- */
const Lab = {
  apps: [], seq: 1, log: [], selected: null, discovered: new Set(),
  tasks: [], taskDone: {}, guideOn: true, totalRx: 0,
  time: 0, lastMsg: '',
};

function addApparatus(kindId) {
  const def = APPARATUS.find((a) => a.id === kindId);
  if (!def) return null;
  if (Lab.apps.length >= 6) return null;            // 到上限就拒绝，绝不静默挤掉别人的容器
  const app = makeApparatus(def);
  app.uid = 'A' + (Lab.seq++);
  Lab.apps.push(app);
  if (!Lab.selected) Lab.selected = app.uid;
  return app;
}
const appByUid = (uid) => Lab.apps.find((a) => a.uid === uid) || null;
const selectedApp = () => appByUid(Lab.selected);

/** 容器里的液面高度比例（0~1），供渲染与容积判断 */
function fillRatio(app) {
  const mL = waterMol(app) * 18.015 + app.contents.filter((c) => !c.dissolved && c.phase !== 'g')
    .reduce((a, c) => a + massOf(c) / Math.max(1, (subOf(c.formula) || {}).density || 2), 0);
  return Math.max(0, Math.min(1.2, mL / app.def.cap));
}

/* --------------------------------- 加料 ---------------------------------- */
/** 把「数值 + 单位」换算成 mol */
function amountToMol(formula, value, unit) {
  const s = subOf(formula); if (!s) return 0;
  if (unit === 'mol') return value;
  if (unit === 'g') return value / s.M;
  if (unit === 'mL') {                     // 体积：真实密度 × 质量分数换算（浓盐酸 37%、浓硫酸 98%）
    const d = subDensity(s) || 1.0;
    return (value * d * massFrac(formula)) / s.M;
  }
  return 0;
}

function addReagent(uid, formula, value, unit) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };
  const s = subOf(formula); if (!s) return { ok: false, why: '库里没有这种物质' };
  const mol = amountToMol(formula, value, unit || 'g');
  if (!Number.isFinite(mol) || !(mol > 0)) return { ok: false, why: '取用量无效（' + value + ' ' + (unit || 'g') + '）' };
  if (app.broken) return { ok: false, why: app.def.name + ' 已经炸裂了，先点「✕ 移除」再换一个' };
  if (s.st !== 'g' && shockCheck(app, mol * s.M)) return { ok: false, why: app.def.name + ' 在加料时骤冷炸裂了！' };
  const after = waterMol(app) + (formula === 'H2O' ? mol : 0);
  if (after * 18.015 > app.def.cap) return { ok: false, why: app.def.name + ' 装不下（容积 ' + app.def.cap + ' mL）' };
  // 气体：能溶的先溶，其余进容器气相（装不下才逸出）——「通入 CO₂」就是这条路
  if (s.st === 'g') {
    let rest = mol;
    if (s.solubility !== null && s.solubility > 0.05 && waterMol(app) > 0) {
      const V = waterVolume(app);
      const csat = (s.solubility * 10) / s.M;
      const cur = app.contents.filter((c) => c.formula === formula && c.dissolved).reduce((a, c) => a + c.mol, 0);
      const dis = Math.min(mol, Math.max(0, csat * V - cur));
      if (dis > 1e-12) addContent(app, formula, dis, 'aq', true);
      rest = mol - dis;
    }
    if (rest > 1e-12) putGas(app, formula, rest);
  } else if (formula === 'H2O' || s.st === 'l' || s.st === 'aq' || !app.contents.some((c) => c.formula === 'H2O')) {
    // 溶剂/液体/溶液，或干容器里直接投料：液体成相，固体先当未溶固体
    const liquid = (formula === 'H2O' || s.st === 'l' || s.st === 'aq') && !CATALYSTS.has(formula);
    addContent(app, formula, mol, liquid ? null : 's', false);
  } else {
    addContent(app, formula, mol, 's', false);
  }
  Lab.log.push({ k: 'add', text: '往 ' + app.def.name + ' 里加入 ' + fmtAmount(s, value, unit) + ' ' + s.name + (formula === s.formula ? '' : '（' + formula + '）'), at: Lab.time });
  const haz = (s.note || '').match(/放射性|剧毒|有毒|自燃|燃烧|爆炸|腐蚀/);
  if (haz) pushMsg('⚠ ' + s.name + '（' + formula + '）：' + haz[0] + '物质，按规范操作 —— 本模拟不做核反应，也不模拟毒性伤害');
  return { ok: true, mol };
}

function fmtAmount(s, value, unit) {
  if (unit === 'mol') return round(value, 3) + ' mol';
  if (unit === 'g') return round(value, 2) + ' g';
  return round(value, 1) + ' mL';
}
const round = (v, n = 2) => { const p = Math.pow(10, n); return Math.round(v * p) / p; };

/* --------------------------------- 操作 ---------------------------------- */
function setHeater(uid, heaterId, on) {
  const app = appByUid(uid); if (!app) return;
  if (app.broken) { pushMsg(app.def.name + ' 已经炸裂了，不能再加热'); return; }
  if (!on) { if (app.heater) app.heater.on = false; app.heater = null; return; }
  const h = HEATERS.find((x) => x.id === heaterId); if (!h) return;
  app.heater = { ...h, on: true };
  if (h.needsDirect && !app.def.direct) {
    app.heater.eff *= 0.5;
    pushMsg(app.def.name + ' 不能直接放在明火上，须垫石棉网：受热不均，传热效率下降，可能炸裂');
  }
}
function ignite(uid) {
  const app = appByUid(uid); if (!app) return;
  app.ignited = true; app.igniteUntil = Lab.time + 3;
  app.flame = Math.max(app.flame, 0.6);
  Lab.log.push({ k: 'ignite', text: '点燃 ' + app.def.name + ' 中的物质', at: Lab.time });
}
function stir(uid) {
  const app = appByUid(uid); if (!app) return;
  app.stirrerOn = !app.stirrerOn;
  Lab.log.push({ k: 'stir', text: (app.stirrerOn ? '开始' : '停止') + '搅拌 ' + app.def.name, at: Lab.time });
}
function clearApp(uid) {
  const app = appByUid(uid); if (!app) return;
  app.contents.length = 0; app.gasBubbles.length = 0; app.bubbles.length = 0; app.ppts.length = 0;
  app.temp = PHYS.T0; app.iceMol = 0; app.dryWarn = false;
  Lab.log.push({ k: 'clear', text: '倒空并洗净 ' + app.def.name, at: Lab.time });
}
/** 倾倒：把 from 的液体（含溶质）全部转移到 to */
function pour(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的倾倒' };
  if (a.broken) return { ok: false, why: a.def.name + ' 已经炸裂了，里面的东西全洒了' };
  if (b.broken) return { ok: false, why: b.def.name + ' 已经炸裂了，装不了东西' };
  const liquid = a.contents.filter((c) => c.dissolved || c.phase === 'l' || c.phase === 'aq');
  const wMol = liquid.filter((c) => c.formula === 'H2O').reduce((s, c) => s + c.mol, 0);
  if (wMol <= 1e-9) return { ok: false, why: a.def.name + ' 里没有可倒的液体' };
  if ((waterMol(b) + wMol) * 18.015 > b.def.cap) return { ok: false, why: b.def.name + ' 装不下这些液体' };
  if (shockCheck(b, wMol * 18.015)) return { ok: false, why: b.def.name + ' 被倒进来的液体骤冷激裂了！' };
  liquid.forEach((c) => {
    addContent(b, c.formula, c.mol, c.phase === 'l' ? 'l' : 'aq', c.phase !== 'l');
    c.mol = 0;
  });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  Lab.log.push({ k: 'pour', text: '把 ' + a.def.name + ' 中的液体倒入 ' + b.def.name, at: Lab.time });
  return { ok: true };
}

/* 过滤：把液相滤到另一个容器，未溶固体留在原容器（初中「粗盐提纯」核心操作） */
function filterApp(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的过滤目标' };
  if (a.broken || b.broken) return { ok: false, why: '炸裂的容器不能用来过滤' };
  const liquid = a.contents.filter((c) => c.phase !== 'g' && (c.dissolved || c.phase === 'l'));
  const wMol = liquid.filter((c) => c.formula === 'H2O').reduce((s, c) => s + c.mol, 0);
  if (wMol <= 1e-9) return { ok: false, why: a.def.name + ' 里没有可滤的液体' };
  if ((waterMol(b) + wMol) * 18.015 > b.def.cap) return { ok: false, why: b.def.name + ' 装不下这些滤液' };
  liquid.forEach((c) => { addContent(b, c.formula, c.mol, c.phase === 'l' ? 'l' : 'aq', c.phase !== 'l'); c.mol = 0; });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  const kept = a.contents.filter((c) => !c.dissolved && c.phase !== 'g');
  Lab.log.push({
    k: 'pour', at: Lab.time,
    text: '过滤：' + a.def.name + ' 里的液体滤进 ' + b.def.name + '，滤纸上留下 '
      + (kept.length ? kept.map((c) => c.formula).join('、') : '少量不溶物'),
  });
  return { ok: true, kept: kept.map((c) => c.formula) };
}

/** 通电（电解）：需要容器里有水/电解质溶液 */
function setPower(uid, on) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };
  if (app.broken) return { ok: false, why: app.def.name + ' 已经炸裂了，不能通电' };
  if (on && waterMol(app) <= 1e-9) return { ok: false, why: app.def.name + ' 里没有液体，通不了电（电解需要水溶液）' };
  app.elec = !!on;
  if (app.elec) {
    Lab.log.push({ k: 'ignite', text: '给 ' + app.def.name + ' 通电：两根惰性电极插入液体', at: Lab.time });
    pushMsg('⚡ 通电中：两极冒气泡（负极氢气、正极氧气，体积比约 2:1）。真实实验会加少量硫酸钠增强导电');
  } else {
    Lab.log.push({ k: 'ignite', text: '切断 ' + app.def.name + ' 的电源', at: Lab.time });
  }
  return { ok: true, on: app.elec };
}

function pushMsg(text) { Lab.lastMsg = text; Lab.log.push({ k: 'warn', text, at: Lab.time }); if (Lab.log.length > 200) Lab.log.shift(); }

/** 每步环境（点燃/催化剂/浓度） */
function envOf(app) {
  const cats = new Set(app.contents.filter((c) => c.mol > 1e-9 && CATALYSTS.has(c.formula)).map((c) => c.formula));
  return {
    temp: app.temp,
    catalysts: cats,
    ignite: !!app.ignited && (app.igniteUntil || 0) > Lab.time,
    conc: app.acidConc === 'conc' ? 'conc' : 'dil',
    light: false, discharge: !!app.discharge, elec: !!app.elec,
  };
}

/** 反应是否已被发现（key 是排序过的，用集合比较更稳） */
function rxFound(lhs, rhs) {
  const norm = (s) => s.split(',').map((x) => x.trim()).sort().join(',');
  const want = norm(lhs) + '>' + norm(rhs);
  return Lab.discovered.has(want);
}
const TASKS = [
  { id: 't1', text: '称 5 g 食盐溶于 50 mL 水，得到澄清溶液', check: () => Lab.apps.some((a) => a.contents.some((c) => c.formula === 'NaCl' && c.dissolved && c.mol > 0.05)) },
  { id: 't2', text: '把水加热到沸腾（看温度计到 373 K 以上）', check: () => Lab.apps.some((a) => a.steamAccum > 0) },
  { id: 't3', text: '让盐酸和氢氧化钠中和，并用酚酞或 pH 计确认接近中性', check: () => rxFound('HCl,NaOH', 'NaCl,H2O') || Lab.apps.some((a) => { const ph = computePH(a); return ph != null && ph > 5.5 && ph < 8.5 && a.contents.some((c) => c.formula === 'NaCl' && c.dissolved); }) },
  { id: 't4', text: '用锌（或铁）把硫酸铜里的铜置换出来（蓝色褪去、析出红色铜）', check: () => rxFound('Zn,CuSO4', 'ZnSO4,Cu') || rxFound('Fe,CuSO4', 'FeSO4,Cu') },
  { id: 't5', text: '做出一次明显放热反应（反应本身让温度上升 10 K 以上）', check: () => (Lab.maxRxRise || 0) > 10 },
  { id: 't6', text: '放出一次气体（看到气泡逸出）', check: () => Lab.apps.some((a) => a.gasVented > 0.001) },
];
function refreshTasks() {
  TASKS.forEach((t) => { if (!Lab.taskDone[t.id] && t.check()) { Lab.taskDone[t.id] = true; Lab.log.push({ k: 'task', text: '✅ 任务完成：' + t.text, at: Lab.time }); } });
  return TASKS;
}

/* ------------------------------ 主循环一步 ------------------------------- */
function labStep(dt) {
  const envs = [];
  Lab.time += dt;
  Lab.apps.forEach((app) => {
    // 反应产物气泡/蒸汽速率自然衰减（缓慢衰减：气泡要飘一会儿才散）
    app.bubbleRate = Math.max(0, app.bubbleRate - dt * 6);
    app.pptRate = Math.max(0, app.pptRate - dt * 4);
    if (app.gasBubbles.length) app.bubbleRate = Math.max(app.bubbleRate, 30);
    app.flash = Math.max(0, app.flash - dt * 1.6);
    app.flame = Math.max(0, app.flame - dt * 0.8);
    app.smoke = Math.max(0, app.smoke - dt * 0.7);
    if (app.ignited && (app.igniteUntil || 0) <= Lab.time && app.flame <= 0.05) app.ignited = false;
    // 冒泡计数 → 供渲染与气体验证
    app.gasBubbles = app.gasBubbles.filter((g) => { g.mol -= dt * 0.02; return g.mol > 1e-4; });
    const before = app.temp;
    const rx = worldStep(app, dt, envOf(app));
    rx.forEach((r) => {
      Lab.totalRx++;
      Lab.discovered.add(r.rx.key);
      Lab.log.push({
        k: 'rxn', at: Lab.time, uid: app.uid,
        text: r.rx.eq + (r.rx.condText ? '  （' + r.rx.condText + '）' : ''),
        note: r.rx.note + '｜' + r.rx.phen.join('、') + '｜ΔH≈' + round(r.dHUsed, 1) + ' kJ/mol'
          + (r.usedAq ? (r.rx.dhAqEst ? '（估算）' : '（水合态生成焓）') : (r.rx.dhEst ? '（估算）' : '（由生成焓算出）')),
      });
    });
    // 反应过程内的累计温升（同一次反应可能跨好几步，不能只看单步；单纯加热不算）
    if (rx.length) {
      if (app._rxMark == null || Lab.time - (app._rxLast || 0) > 1.5) app._rxMark = before;
      app._rxLast = Lab.time;
      Lab.maxRxRise = Math.max(Lab.maxRxRise || 0, app.temp - app._rxMark);
    } else if (app._rxMark != null && Lab.time - (app._rxLast || 0) > 1.5) app._rxMark = null;
  });
  if (Lab.log.length > 240) Lab.log.splice(0, Lab.log.length - 240);
  refreshTasks();
}


/* ================= 06-view.js ================= */
/* ============================================================================
 * 06-view.js —— 视觉层：玻璃器皿、液面、固体堆积、气泡、沉淀、火焰、蒸汽、闪光
 * ----------------------------------------------------------------------------
 * 全部 Canvas 2D 手绘，无贴图无外部资源。粒子数与物理步长解耦（固定 dt 上限）。
 * ==========================================================================*/

const VIEW = { bubbleCap: 90, pptCap: 80, steamCap: 40 };

/* ---------------------------- 溶液颜色（真实观感） ------------------------- */
const TINT_STRENGTH = {
  CuSO4: 3.2, CuCl2: 2.6, 'Cu(NO3)2': 2.6, KMnO4: 6.0, I2: 4.0, Br2: 4.0,
  FeCl3: 2.0, 'Fe2(SO4)3': 2.0, K2MnO4: 3.0, 酚酞: 2.0, 石蕊: 1.5,
};
function solutionColor(app) {
  const V = Math.max(1e-4, waterVolume(app));
  let r = 0, g = 0, b = 0, wsum = 0;
  app.contents.filter((c) => c.dissolved && c.formula !== 'H2O').forEach((c) => {
    const s = subOf(c.formula); if (!s) return;
    const col = hex2rgb(s.color);
    // 无色溶质（食盐、硝酸银、氢氧化钠…）不该把水染成白汤，只有带色离子的才计权
    const mx = Math.max(col[0], col[1], col[2]);
    if (mx <= 0) return;
    const sat = (mx - Math.min(col[0], col[1], col[2])) / mx;
    if (sat < 0.12) return;
    const conc = c.mol / V;
    const str = (TINT_STRENGTH[c.formula] || 1) * conc;
    if (str < 1e-4) return;
    r += col[0] * str; g += col[1] * str; b += col[2] * str; wsum += str;
  });
  // 指示剂（酚酞遇碱变红 / 石蕊变蓝）优先级最高：真实实验里它就是一眼能看见
  const tint = indicatorTint(app);
  if (tint) { const col = hex2rgb(tint); const w = 1.1; r += col[0] * w; g += col[1] * w; b += col[2] * w; wsum += w; }
  if (wsum > 0) {
    const base = [200, 228, 245];
    const mix = [r / wsum, g / wsum, b / wsum];
    const a = Math.min(0.92, 0.12 + wsum * 0.5);
    const col = base.map((v, i) => Math.round(v * (1 - a) + mix[i] * a));
    return { rgb: col, alpha: 0.62 + a * 0.28 };
  }
  return { rgb: [200, 228, 245], alpha: 0.55 };
}
const hex2rgb = (h) => {
  if (!h) return [200, 200, 200];
  if (h[0] !== '#') return [200, 200, 200];
  const v = h.length === 4 ? h.slice(1).split('').map((c) => c + c).join('') : h.slice(1);
  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
};
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

/* ------------------------------- 器皿几何 -------------------------------- */
function vesselGeom(shape, w, h) {
  const P = new Path2D();
  let top, bot, x0, x1;
  if (shape === 'tube') {
    x0 = w * 0.37; x1 = w * 0.63; top = h * 0.10; bot = h * 0.86;
    const r = (x1 - x0) / 2;
    P.moveTo(x0, top); P.lineTo(x0, bot - r); P.arc((x0 + x1) / 2, bot - r, r, Math.PI, 0, true);
    P.lineTo(x1, top); P.closePath();
  } else if (shape === 'beaker') {
    x0 = w * 0.24; x1 = w * 0.76; top = h * 0.20; bot = h * 0.84;
    P.moveTo(x0, top); P.lineTo(x0 + w * 0.02, bot - h * 0.04); P.quadraticCurveTo(x0 + w * 0.03, bot, x0 + w * 0.09, bot);
    P.lineTo(x1 - w * 0.09, bot); P.quadraticCurveTo(x1 - w * 0.03, bot, x1 - w * 0.02, bot - h * 0.04);
    P.lineTo(x1, top); P.closePath();
  } else if (shape === 'flask') {
    x0 = w * 0.20; x1 = w * 0.80; top = h * 0.08; bot = h * 0.88;
    const nx0 = w * 0.43, nx1 = w * 0.57, ny = h * 0.36;
    P.moveTo(nx0, top); P.lineTo(nx0, ny); P.lineTo(x0, bot - h * 0.05);
    P.quadraticCurveTo(x0, bot, x0 + w * 0.12, bot); P.lineTo(x1 - w * 0.12, bot);
    P.quadraticCurveTo(x1, bot, x1, bot - h * 0.05); P.lineTo(nx1, ny); P.lineTo(nx1, top); P.closePath();
  } else if (shape === 'dish') {
    x0 = w * 0.18; x1 = w * 0.82; top = h * 0.46; bot = h * 0.84;
    P.moveTo(x0, top); P.quadraticCurveTo(w * 0.5, bot + h * 0.06, x1, top); P.closePath();
  } else {                                  // crucible 坩埚
    x0 = w * 0.28; x1 = w * 0.72; top = h * 0.34; bot = h * 0.86;
    P.moveTo(x0, top); P.lineTo(x0 + w * 0.06, bot); P.lineTo(x1 - w * 0.06, bot); P.lineTo(x1, top); P.closePath();
  }
  return { path: P, top, bot, x0, x1, cx: (x0 + x1) / 2, w: x1 - x0 };
}

/* -------------------------------- 粒子系统 -------------------------------- */
function spawnParticles(app, dt) {
  const g = app._geo; if (!g) return;
  const boil = app.temp > (typeof boilingPoint === 'function' ? boilingPoint(app) - 1.5 : 372) && waterMol(app) > 1e-9;
  let rate = app.bubbleRate + (boil ? 26 : 0);
  if (app.heater && app.heater.on && waterMol(app) > 1e-9 && app.temp > 320) rate += (app.temp - 320) * 0.08;
  // 累积器：每帧生成量常常不足 1 个，直接四舍五入会永远生不出粒子
  const acc = (k, amt) => { app[k] = (app[k] || 0) + amt; const n = Math.floor(app[k]); app[k] -= n; return n; };
  const nB = Math.min(8, acc('_bAcc', rate * dt * 2));
  for (let i = 0; i < nB && app.bubbles.length < VIEW.bubbleCap; i++) {
    const bx = g.x0 + (g.x1 - g.x0) * (0.12 + Math.random() * 0.76);
    const y = app._liquidTop + (g.bot - app._liquidTop) * (0.3 + Math.random() * 0.7);
    app.bubbles.push({ x: bx, y, r: 1.2 + Math.random() * 2.6, v: 12 + Math.random() * 26, ph: Math.random() * 6.28 });
  }
  const nP = Math.min(6, acc('_pAcc', app.pptRate * dt * 2));
  for (let i = 0; i < nP && app.ppts.length < VIEW.pptCap; i++) {
    const px = g.x0 + (g.x1 - g.x0) * (0.08 + Math.random() * 0.84);
    app.ppts.push({ x: px, y: app._liquidTop + Math.random() * (g.bot - app._liquidTop) * 0.5, r: 0.8 + Math.random() * 1.6, v: 4 + Math.random() * 9, c: app._pptRgb || [80, 80, 80] });
  }
  const nS = Math.min(4, acc('_sAcc', boil ? dt * 18 : 0));
  for (let i = 0; i < nS && app.steam.length < VIEW.steamCap; i++) {
    app.steam.push({ x: g.cx + (Math.random() - 0.5) * g.w * 0.7, y: app._liquidTop - 2, r: 4 + Math.random() * 7, life: 1, v: 14 + Math.random() * 16 });
  }
}

function stepParticles(app, dt) {
  const g = app._geo; if (!g) return;
  const surface = app._liquidTop;
  app.bubbles = app.bubbles.filter((b) => {
    b.y -= b.v * dt; b.ph += dt * 6;
    return b.y > surface - 3;
  });
  app.ppts = app.ppts.filter((p) => {
    p.y += p.v * dt;
    return p.y < g.bot - 2;
  });
  app.steam = app.steam.filter((s) => { s.y -= s.v * dt; s.r += dt * 9; s.life -= dt * 0.55; return s.life > 0; });
}

/* --------------------------------- 渲染 ---------------------------------- */
function drawBench(ctx, w, h) {
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#10161d'); bg.addColorStop(0.62, '#0d1319'); bg.addColorStop(1, '#1b2833');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(120,180,220,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h * 0.86); ctx.lineTo(w, h * 0.86); ctx.stroke();
  ctx.fillStyle = 'rgba(120,180,220,0.05)'; ctx.fillRect(0, h * 0.86, w, h * 0.14);
  // 网格纹路
  ctx.strokeStyle = 'rgba(120,180,220,0.05)';
  for (let x = 0; x < w; x += 18) { ctx.beginPath(); ctx.moveTo(x, h * 0.86); ctx.lineTo(x, h); ctx.stroke(); }
}

function drawFlame(ctx, app, g, h) {
  if (!app.heater || !app.heater.on) return;
  const t = app.time * 8;
  const cx = g.cx, base = h * 0.90;
  const kind = app.heater.id;
  const flick = 0.85 + 0.15 * Math.sin(t) + 0.08 * Math.sin(t * 2.7);
  if (kind === 'plate') {
    const grd = ctx.createRadialGradient(cx, base - 4, 2, cx, base - 4, g.w * 0.8);
    grd.addColorStop(0, 'rgba(255,90,40,0.55)'); grd.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(cx, base - 2, g.w * 0.8, h * 0.05, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(20,20,24,0.9)'; ctx.fillRect(cx - g.w * 0.55, base - 2, g.w * 1.1, 6);
    return;
  }
  const fh = (kind === 'bunsen' ? h * 0.22 : h * 0.15) * flick;
  const fw = g.w * (kind === 'bunsen' ? 0.34 : 0.42);
  // 外焰
  let grd = ctx.createRadialGradient(cx, base - fh * 0.45, 1, cx, base - fh * 0.45, fh * 0.9);
  grd.addColorStop(0, kind === 'bunsen' ? 'rgba(170,220,255,0.95)' : 'rgba(255,230,150,0.95)');
  grd.addColorStop(0.5, kind === 'bunsen' ? 'rgba(90,150,255,0.65)' : 'rgba(255,150,40,0.7)');
  grd.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, base - fh * 0.45, fw * 0.6, fh * 0.62, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - fw * 0.35, base); ctx.quadraticCurveTo(cx - fw * 0.15, base - fh * 0.9, cx, base - fh);
  ctx.quadraticCurveTo(cx + fw * 0.15, base - fh * 0.9, cx + fw * 0.35, base); ctx.closePath();
  ctx.fillStyle = kind === 'bunsen' ? 'rgba(150,200,255,0.55)' : 'rgba(255,200,90,0.5)'; ctx.fill();
  // 灯体
  if (kind === 'lamp') { ctx.fillStyle = '#2a3947'; ctx.fillRect(cx - g.w * 0.26, base, g.w * 0.52, h * 0.07); }
  else { ctx.fillStyle = '#26333f'; ctx.fillRect(cx - 4, base, 8, h * 0.07); ctx.fillRect(cx - g.w * 0.3, h * 0.97, g.w * 0.6, 4); }
}

function drawBroken(ctx, g, app, w, h) {
  ctx.save();
  // 只剩半截的器壁 + 锯齿缺口
  ctx.strokeStyle = 'rgba(150,205,225,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(g.x0, g.top + (g.bot - g.top) * 0.34);
  ctx.lineTo(g.x0, g.bot - 8);
  ctx.quadraticCurveTo(g.cx, g.bot + 8, g.x1, g.bot - 8);
  ctx.lineTo(g.x1, g.top + (g.bot - g.top) * 0.42);
  ctx.stroke();
  // 裂纹
  ctx.strokeStyle = 'rgba(225,245,255,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const x = g.x0 + (g.x1 - g.x0) * (0.18 + i * 0.21);
    ctx.beginPath();
    ctx.moveTo(x, g.bot - 10);
    ctx.lineTo(x + (i % 2 ? 7 : -7), g.top + (g.bot - g.top) * (0.45 + i * 0.05));
    ctx.stroke();
  }
  // 台面上的碎玻璃
  (app.shards || []).forEach((s) => {
    const sx = g.cx + s.x * (g.x1 - g.x0) * 1.15;
    const sy = Math.min(h - 6, g.bot + 8 + s.y * 34);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(s.rot);
    ctx.beginPath();
    ctx.moveTo(-s.r * 0.6, s.r * 0.5); ctx.lineTo(s.r * 0.7, s.r * 0.3); ctx.lineTo(-s.r * 0.1, -s.r * 0.7);
    ctx.closePath();
    ctx.fillStyle = 'rgba(170,220,240,0.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(230,250,255,0.7)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = 'rgba(255,120,120,0.92)';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('❌ 已炸裂', g.cx, g.top + 14);
  ctx.restore();
}

function renderApparatus(canvas, app, dt) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 190, h = canvas.clientHeight || 150;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBench(ctx, w, h);
  const g = vesselGeom(app.def.shape, w, h);
  app._geo = g;
  if (app.broken) { drawBroken(ctx, g, app, w, h); return; }

  // 液面高度
  const fr = Math.max(0, Math.min(1, fillRatio(app)));
  const innerTop = g.top + (g.bot - g.top) * 0.06;
  const liquidTop = g.bot - (g.bot - innerTop) * Math.min(1, fr);
  app._liquidTop = liquidTop;
  const col = solutionColor(app);
  app._pptRgb = (app.contents.find((c) => !c.dissolved && c.phase !== 'g' && subOf(c.formula) && subOf(c.formula).solubility === -1) ?
    hex2rgb(subOf(app.contents.find((c) => !c.dissolved && c.phase !== 'g' && subOf(c.formula) && subOf(c.formula).solubility === -1).formula).color) : [70, 70, 70]);

  spawnParticles(app, dt);
  stepParticles(app, dt);

  drawFlame(ctx, app, g, h);

  // 玻璃内部
  ctx.save();
  ctx.fillStyle = 'rgba(190,225,245,0.06)'; ctx.fill(g.path); ctx.fill();
  if (waterMol(app) > 1e-9 || app.iceMol > 0) {
    ctx.save(); ctx.clip(g.path);
    const lg = ctx.createLinearGradient(0, liquidTop, 0, g.bot);
    lg.addColorStop(0, rgba(col.rgb, col.alpha * 0.85));
    lg.addColorStop(1, rgba(col.rgb.map((v) => Math.round(v * 0.82)), col.alpha));
    ctx.fillStyle = lg;
    ctx.fillRect(g.x0 - 2, liquidTop, g.w + 4, g.bot - liquidTop + 2);
    // 水面的弯月面
    ctx.strokeStyle = rgba([235, 248, 255], 0.55); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(g.x0, liquidTop); ctx.quadraticCurveTo(g.cx, liquidTop + 3, g.x1, liquidTop); ctx.stroke();
    ctx.restore();
  }
  // 未溶解固体（按量堆积）
  const solids = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
  if (solids.length) {
    ctx.save(); ctx.clip(g.path);
    let pile = 0;
    solids.forEach((c) => {
      const s = subOf(c.formula); if (!s) return;
      const c2 = hex2rgb(s.color);
      const vol = massOf(c) / Math.max(0.5, subDensity(s) || 2);
      const hgt = Math.min(h * 0.30, 3 + vol * 0.9);
      const yy = g.bot - pile;
      ctx.fillStyle = rgba(c2, 0.95);
      ctx.beginPath();
      ctx.moveTo(g.x0 + 1, yy);
      for (let i = 0; i <= 8; i++) {
        const x = g.x0 + 1 + (g.w - 2) * (i / 8);
        const bump = Math.sin(i * 1.7 + c.mol * 3) * (hgt * 0.22);
        ctx.lineTo(x, yy - hgt * (0.55 + 0.45 * Math.sin((i / 8) * Math.PI)) - bump);
      }
      ctx.lineTo(g.x1 - 1, yy); ctx.closePath(); ctx.fill();
      pile += hgt * 0.28;
    });
    ctx.restore();
  }
  // 沉淀颗粒
  app.ppts.forEach((p) => {
    ctx.fillStyle = rgba(p.c, 0.85);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  });
  // 气泡
  app.bubbles.forEach((b) => {
    const wob = Math.sin(b.ph) * 1.4;
    ctx.strokeStyle = 'rgba(240,252,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x + wob, b.y, b.r, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(220,245,255,0.18)'; ctx.fill();
  });
  // 液面上方的蒸汽
  app.steam.forEach((s) => {
    ctx.fillStyle = 'rgba(225,240,250,' + (0.30 * s.life) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  });
  // 玻璃高光与轮廓
  ctx.save(); ctx.clip(g.path);
  const hl = ctx.createLinearGradient(g.x0, 0, g.x1, 0);
  hl.addColorStop(0, 'rgba(255,255,255,0.16)'); hl.addColorStop(0.18, 'rgba(255,255,255,0.03)');
  hl.addColorStop(0.85, 'rgba(255,255,255,0.01)'); hl.addColorStop(1, 'rgba(255,255,255,0.13)');
  ctx.fillStyle = hl; ctx.fillRect(g.x0 - 4, 0, g.w + 8, h);
  ctx.restore();
  ctx.strokeStyle = 'rgba(200,232,248,0.55)'; ctx.lineWidth = 1.6; ctx.stroke(g.path);
  // 刻度线
  if (app.def.shape !== 'dish') {
    ctx.strokeStyle = 'rgba(200,232,248,0.28)'; ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      const y = g.bot - (g.bot - g.top) * (i / 5);
      ctx.beginPath(); ctx.moveTo(g.x1 - 6, y); ctx.lineTo(g.x1 - 1, y); ctx.stroke();
    }
  }
  // 反应闪光 / 干烧告警
  if (app.flash > 0.01) {
    const grd = ctx.createRadialGradient(g.cx, liquidTop, 1, g.cx, liquidTop, Math.max(g.w, 60));
    grd.addColorStop(0, 'rgba(255,240,190,' + Math.min(0.75, app.flash) + ')');
    grd.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
  }
  if (app.flame > 0.5) {
    ctx.fillStyle = 'rgba(255,200,120,' + Math.min(0.35, app.flame * 0.25) + ')';
    ctx.beginPath(); ctx.arc(g.cx, liquidTop, Math.max(g.w * 0.7, 40), 0, 6.283); ctx.fill();
  }
  if (app.smoke > 0.05) {
    ctx.fillStyle = 'rgba(235,235,240,' + Math.min(0.5, app.smoke * 0.35) + ')';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(g.cx + (Math.sin(app.time * 1.4 + i * 2) * g.w * 0.28), h * 0.16 - i * 5, 6 + i * 3, 0, 6.283);
      ctx.fill();
    }
  }
  if (app.dryWarn) {
    ctx.strokeStyle = 'rgba(255,90,70,' + (0.35 + 0.25 * Math.sin(app.time * 6)) + ')';
    ctx.lineWidth = 2.4; ctx.stroke(g.path);
  }
  // 高温红热
  if (app.temp > 700) {
    const hot = Math.min(0.5, (app.temp - 700) / 900);
    ctx.save(); ctx.clip(g.path);
    ctx.fillStyle = 'rgba(255,110,40,' + hot + ')'; ctx.fillRect(g.x0 - 4, g.bot - h * 0.3, g.w + 8, h * 0.3);
    ctx.restore();
  }
}

/** 初始化容器的粒子容器字段 */
function initViewState(app) {
  app.bubbles = app.bubbles || []; app.ppts = app.ppts || []; app.steam = app.steam || [];
}

const $ = (s) => document.querySelector(s);
const mk = (tag, cls, html) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; };
const K2C = (k) => Math.round((k - 273.15) * 10) / 10;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

/* ------------------------------- 周期表面板 ------------------------------- */
function buildPtable() {

/* -------------------------------- 试剂架 --------------------------------- */
const CAT_NAME = { acid: '酸', base: '碱', salt: '盐', oxide: '氧化物', element: '单质', organic: '有机物', indicator: '指示剂', solvent: '溶剂' };
function buildShelf() {
  const box = $('#shelf'); if (!box) return;
  const cats = ['acid', 'base', 'salt', 'oxide', 'element', 'organic', 'indicator', 'solvent'];
  const q = ($('#shelfSearch') || {}).value || '';
  box.innerHTML = '';
  cats.forEach((cat) => {
    const list = SUBSTANCES.filter((s) => s.cat === cat && !s.isElem)
      .filter((s) => !q || s.name.includes(q) || s.formula.toLowerCase().includes(q.toLowerCase()));
    if (!list.length) return;
    const sec = mk('div', 'shelfsec', '<h5>' + CAT_NAME[cat] + '</h5>');

      b.style.borderColor = 'color-mix(in srgb, ' + s.color + ' 55%, #4a6a80)';
      b.addEventListener('click', () => {

  // 单质（118 种元素）单独一格

  sec.appendChild(mk('div', 'hint', '周期表里点任一元素 → 取用该单质'));
  box.appendChild(sec);
}

/* ------------------------------- 取用量弹窗 ------------------------------- */
function askAmount(formula, def, cb, unit) {
  const s = subOf(formula);
  const isLiq = unit === 'mL' || s.st === 'l' || s.st === 'aq' || formula === 'H2O';
  const m = $('#modal');
  m.innerHTML = '<div class="card"><h4>' + s.name + '（' + formula + '）</h4>'
    + '<div class="kv"><span>摩尔质量</span><b>' + s.M + ' g/mol</b></div>'
    + '<div class="kv"><span>溶解度</span><b>' + solText(s) + '</b></div>'
    + (s.dHf ? '<div class="kv"><span>ΔfH°</span><b>' + s.dHf.v + ' kJ/mol' + (s.dHf.est ? '（估算）' : '') + '</b></div>' : '')
    + '<label>用量 <input id="amtVal" type="number" value="' + def + '" min="0.01" step="0.5"></label>'
    + '<label>单位 <select id="amtUnit">'
    + '<option value="g">克 g</option><option value="mL">毫升 mL</option><option value="mol">摩尔 mol</option>'
    + '</select></label>'
    + '<div class="row"><button class="primary" id="amtOk">加入 ' + (selectedApp() ? selectedApp().def.name : '（未选容器）') + '</button>'
    + '<button id="amtCancel">取消</button></div></div>';
  m.classList.add('show');
  $('#amtUnit').value = isLiq ? 'mL' : 'g';
  $('#amtOk').addEventListener('click', () => {
    const v = Number($('#amtVal').value), u = $('#amtUnit').value;
    m.classList.remove('show'); cb(v, u);
  });
  $('#amtCancel').addEventListener('click', () => m.classList.remove('show'));
  m.addEventListener('click', (ev) => { if (ev.target === m) m.classList.remove('show'); });
}
const solText = (s) => s.solubility === -1 ? '不溶' : s.solubility === -2 ? '微溶' : s.solubility === Infinity ? '互溶' : s.solubility == null ? '—' : s.solubility + ' g/100g 水';

/* ------------------------------- 工作台 --------------------------------- */
let benchSig = '';
let taskSig = '';
function benchSignature() { return Lab.apps.map((a) => a.uid + ':' + a.def.id).join('|'); }
function renderBench(force) {
  const sig = benchSignature();
  if (!force && sig === benchSig) return;
  benchSig = sig;
  const bench = $('#bench'); bench.innerHTML = '';
  if (!Lab.apps.length) { bench.appendChild(mk('div', 'empty', '工作台是空的 —— 上面点一个仪器加进来')); return; }
  Lab.apps.forEach((app) => {
    const card = mk('div', 'appcard' + (Lab.selected === app.uid ? ' sel' : ''));

      + '<span class="cap">' + app.def.cap + ' mL</span></div>'

    });
    card.querySelectorAll('.ops button').forEach((b) => b.addEventListener('click', () => opClick(app, b.dataset.op)));
    bench.appendChild(card);
    app.canvas = card.querySelector('canvas');
  });
  buildHeatRow();
}

function buildHeatRow() {
  const app = selectedApp(); if (!app) return;
  const card = document.querySelector('.appcard[data-uid="' + app.uid + '"]'); if (!card) return;
  const row = card.querySelector('.heatrow');
  row.innerHTML = '<span class="lbl">热源</span>';
  HEATERS.forEach((h) => {
    const on = app.heater && app.heater.on && app.heater.id === h.id;
    const b = mk('button', 'hbtn' + (on ? ' on' : ''), h.icon + ' ' + h.name + ' <i>' + h.power + 'W</i>');
    b.title = '最高温度 ' + K2C(h.flameT) + '°C，传热效率 ' + Math.round((h.eff || 0) * 100) + '%'
      + (h.needsDirect ? '（需可直火容器，否则垫石棉网）' : '');
    b.addEventListener('click', () => { setHeater(app.uid, h.id, !on); buildHeatRow(); updateReadouts(); });
    row.appendChild(b);
  });
  const cc = mk('button', 'hbtn' + (app.acidConc === 'conc' ? ' on' : ''), '酸浓度：' + (app.acidConc === 'conc' ? '浓' : '稀'));
  cc.title = '影响铜与硝酸等反应（浓硝酸放 NO₂，稀硝酸放 NO）';
  cc.addEventListener('click', () => { app.acidConc = app.acidConc === 'conc' ? 'dil' : 'conc'; buildHeatRow(); });
  row.appendChild(cc);
  const flame = mk('button', 'hbtn' + (app.stirrerOn ? ' on' : ''), '🌀 持续搅拌');
  flame.addEventListener('click', () => { stir(app.uid); buildHeatRow(); });
  row.appendChild(flame);
}

function opClick(app, op) {
  Lab.selected = app.uid;
  if (op === 'heat') { const h = HEATERS[0]; const on = app.heater && app.heater.on; setHeater(app.uid, h.id, !on); buildHeatRow(); }
  else if (op === 'ignite') ignite(app.uid);
  else if (op === 'stir') { stir(app.uid); buildHeatRow(); }
  else if (op === 'clear') clearApp(app.uid);
  else if (op === 'del') { Lab.apps.splice(Lab.apps.indexOf(app), 1); if (Lab.selected === app.uid) Lab.selected = null; renderBench(true); }
  else if (op === 'measure') measure(app);
  updateReadouts();
}
function measure(app) {
  const parts = [];
  parts.push('温度计：' + K2C(app.temp) + ' °C（' + round(app.temp, 2) + ' K）');
  parts.push('天平：' + round(totalMass(app), 3) + ' g');
  parts.push('量筒：' + round(waterVolume(app) * 1000, 1) + ' mL 溶液');
  const ph = computePH(app);
  if (ph != null) parts.push('pH 计：' + round(ph, 2));
  Lab.log.push({ k: 'measure', at: Lab.time, text: '【测量 ' + app.def.name + '】' + parts.join('｜') });
}

/* ------------------------------ 读数刷新 --------------------------------- */
function updateReadouts() {
  Lab.apps.forEach((app) => {
    const card = document.querySelector('.appcard[data-uid="' + app.uid + '"]');
    if (!card) return;
    card.classList.toggle('sel', Lab.selected === app.uid);
    const ro = card.querySelector('.readouts');
    const ph = computePH(app);
    const liq = app.contents.filter((c) => c.dissolved);
    const solid = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
    const gas = app.gasBubbles.concat(app.contents.filter((c) => c.dissolved && subOf(c.formula).st === 'g'));
    const cTxt = (n) => (n >= 0.01 ? round(n, 3) : n.toExponential(1));
    const html = '<div class="ro"><span>🌡</span><b class="' + (app.temp > 340 ? 'hot' : '') + '">' + K2C(app.temp) + ' °C</b></div>'
      + '<div class="ro"><span>⚖</span><b>' + round(totalMass(app), 2) + ' g</b></div>'
      + '<div class="ro"><span>🧪</span><b>' + round(waterVolume(app) * 1000, 1) + ' mL</b>'
      + (ph != null ? ' · pH <b>' + round(ph, 2) + '</b>' : '') + '</div>'
      + (liq.filter((c) => c.formula !== 'H2O').length || waterMol(app) > 1e-9
        ? '<div class="contents"><i>溶液：</i>' + (waterMol(app) > 1e-9 ? '水 ' + round(waterMol(app) * 18.015, 1) + ' g　' : '')
          + liq.filter((c) => c.formula !== 'H2O').map((c) => esc(c.formula) + ' ' + cTxt(c.mol) + ' mol').join('，') + '</div>' : '')
      + (solid.length ? '<div class="contents"><i>固体：</i>' + solid.map((c) => esc(c.formula) + ' ' + round(massOf(c), 2) + ' g').join('，') + '</div>' : '')
      + (gas.length ? '<div class="contents gas"><i>气体：</i>' + gas.map((g) => esc(g.f || g.formula)).join('，') + '</div>' : '')
      + (app.dryWarn && !app.broken ? '<div class="warn">⚠ 干烧！容器里没有液体了</div>' : '');
    if (app.broken) {
      card.classList.add('broken');
      const bh = '<div class="warn big">❌ 已炸裂：' + esc(app.brokenWhy || '受热/骤冷超过玻璃承受极限') + '</div>'
        + '<div class="contents"><i>提示：</i>内容物已洒掉。玻璃器皿不能干烧，也不能趁热倒冷水 —— 点「✕ 移除」清理碎片</div>';
      if (ro._sig !== bh) { ro.innerHTML = bh; ro._sig = bh; }
      return;
    }
    card.classList.remove('broken');
    if (ro._sig !== html) { ro.innerHTML = html; ro._sig = html; }
    card.querySelectorAll('.ops button').forEach((b) => {
      if (b.dataset.op === 'stir') b.classList.toggle('on', !!app.stirrerOn);
      if (b.dataset.op === 'heat') b.classList.toggle('on', !!(app.heater && app.heater.on));
    });
  });
  $('#apparatusCount').textContent = Lab.apps.length + ' / 6';
}

/* -------------------------------- 日志 --------------------------------- */
let logShown = 0;
const ICON = { rxn: '🧪', add: '➕', measure: '📏', warn: '⚠', task: '✅', ignite: '🔥', stir: '🌀', clear: '🧼', pour: '🫗' };
function flushLog() {
  const box = $('#log');
  if (logShown > Lab.log.length) { box.innerHTML = ''; logShown = 0; }
  for (let i = logShown; i < Lab.log.length; i++) {
    const e = Lab.log[i];
    const d = mk('div', 'logrow ' + e.k);
    d.innerHTML = '<span class="ic">' + (ICON[e.k] || '·') + '</span><span class="tx">' + esc(e.text)
      + (e.note ? '<br><small>' + esc(e.note) + '</small>' : '') + '</span>';
    box.appendChild(d);
  }
  if (Lab.log.length > logShown) { box.scrollTop = box.scrollHeight; logShown = Lab.log.length; }
  $('#rxCount').textContent = Lab.discovered.size;
  $('#rxTotal').textContent = RXNS.length;
}

/* -------------------------------- 任务 --------------------------------- */
function renderTasks(force) {
  const sig = String(Lab.guideOn) + '|' + TASKS.map((t) => (Lab.taskDone[t.id] ? 1 : 0)).join('');
  if (!force && sig === taskSig) return;
  taskSig = sig;
  const box = $('#tasks');
  box.innerHTML = '<h4>新手引导 ' + (Lab.guideOn ? '' : '<small>（已关闭）</small>') + '</h4>';
  if (!Lab.guideOn) { box.appendChild(mk('div', 'hint', '引导已关闭：随便玩。想重新打开点右上角「引导」。')); return; }
  TASKS.forEach((t) => {
    const done = !!Lab.taskDone[t.id];
    box.appendChild(mk('div', 'task' + (done ? ' done' : ''), (done ? '✅ ' : '⬜ ') + t.text));
  });
  const done = TASKS.filter((t) => Lab.taskDone[t.id]).length;
  box.appendChild(mk('div', 'hint', '进度 ' + done + ' / ' + TASKS.length + (done === TASKS.length ? '　🎉 全部完成' : '')));
}

/* -------------------------------- 存档 --------------------------------- */
const SAVE_KEY = 'chemlab.v01';
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      guideOn: Lab.guideOn, taskDone: Lab.taskDone, discovered: [...Lab.discovered],
      apps: Lab.apps.map((a) => ({ def: a.def.id, b: a.broken ? 1 : 0, contents: a.contents.map((c) => ({ f: c.formula, m: c.mol, d: c.dissolved })) })),
    }));
  } catch (e) { /* file:// 下 localStorage 可能不可用，静默降级 */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const s = JSON.parse(raw);
    Lab.guideOn = s.guideOn !== false;
    Lab.taskDone = s.taskDone || {};
    (s.discovered || []).forEach((k) => Lab.discovered.add(k));
    (s.apps || []).slice(0, 3).forEach((a) => {
      const app = addApparatus(a.def); if (!app) return;
      if (a.b) breakVessel(app, '上次实验里炸裂的容器');
      (a.contents || []).forEach((c) => { if (subOf(c.f)) addContent(app, c.f, c.m, null, c.d); });
    });
    return true;
  } catch (e) { return false; }
}

/* -------------------------------- 提示 --------------------------------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ------------------------------- 主循环 -------------------------------- */
let lastT = 0, acc = 0;
function frame(now) {
  const dtReal = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  acc += dtReal;
  const step = 1 / 60;
  let guard = 0;
  while (acc >= step && guard++ < 4) { labStep(step); acc -= step; }
  Lab.apps.forEach((app) => { initViewState(app); if (app.canvas) renderApparatus(app.canvas, app, dtReal); });
  renderBench(false);
  updateReadouts(); flushLog(); renderTasks();
  if (Lab.dirtySave || (Lab.time % 5) < 0.02) { save(); Lab.dirtySave = false; }
  requestAnimationFrame(frame);
}

/* -------------------------------- 启动 --------------------------------- */
function boot() {
  buildPtable(); buildShelf();
  if (!load()) { addApparatus('beaker'); addApparatus('tube'); }
  Lab.selected = Lab.apps.length ? Lab.apps[0].uid : null;
  renderBench(true);
  $('#addApparatus').innerHTML = APPARATUS.map((a) => '<button data-kind="' + a.id + '">' + a.name + '<i>' + a.cap + 'mL</i></button>').join('');
  $('#addApparatus').addEventListener('click', (ev) => {
    const k = ev.target.dataset.kind; if (!k) return;
    const app = addApparatus(k);
    if (app) { Lab.selected = app.uid; Lab.dirtySave = true; renderBench(true); shim(); }
    else toast('最多 6 个容器');
    updateReadouts();
  });
  $('#guideToggle').addEventListener('click', () => {
    Lab.guideOn = !Lab.guideOn; renderTasks(); save();
    toast(Lab.guideOn ? '引导已打开' : '引导已关闭（纯沙盒）');
  });
  $('#resetAll').addEventListener('click', () => {
    Lab.apps.length = 0; Lab.log.length = 0; Lab.discovered.clear(); Lab.taskDone = {}; logShown = 0;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
    addApparatus('beaker'); addApparatus('tube'); renderBench(true); toast('已重置');
  });
  $('#shelfSearch').addEventListener('input', buildShelf);
  Lab.log.push({ k: 'warn', at: 0, text: '欢迎来到元素实验室：左边点元素取单质，右边点试剂加料，中间加热/点燃/搅拌，看现象。' });
  renderTasks(); updateReadouts();
  requestAnimationFrame((t) => { lastT = t; frame(t); });
}
const shim = () => { };
document.addEventListener('DOMContentLoaded', boot);

/* ------------------------- 调试/验证 API（探针用） ------------------------ */
window.CHEM = {
  Lab, ELEMENTS, ELEM_BY_SYM, SUBSTANCES, SUB, RXNS, RX_WARN, PARSE: parseFormula,
  ELEM_REAGENT, molarMass, balanceReaction, verifyBalance, matchReactions, computePH, atomTally,
  addApparatus, addReagent, setHeater, ignite, stir, clearApp, pour, measure, worldStep, labStep,
  setPower, filterApp, gasInApp, headspaceMol,
  waterMol, waterVolume, totalMass, boilingPoint, heatCapacity, subOf, PHYS, APPARATUS, HEATERS,
  TASKS, save, load, envOf, rxFound,
};

</script>
