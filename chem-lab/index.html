/** 器材是"实物"：要加热，得先摆一盏灯（addTool）、把容器架上去（placeOn）、再点着（lightTool）。
 *  热量只在"容器确实架在这件器材上 + 这件器材确实点着"时才进入系统 —— 每步都按实物关系重算，
 *  所以挪走、熄灭、撤器材都会立刻停止加热。 */
function addTool(hid, x, force) {
  const def = (hid && hid.id) ? hid : TOOL_DEFS.find((h) => h.id === hid);
  if (!def) return null;
  if (Lab.tools.length >= 6 && !force) { pushMsg('台面上的器材已经够多了（最多 6 件）'); return null; }
  const t = {
    uid: 'T' + (Lab.toolSeq++), kind: def.kind || 'heat', hid: def.id, def: def, on: false,
    x: 0, y: 0, app: null, lampUid: null, lampStand: null,
    z: ++Lab.zSeq,                                  // 后摆上来的在前面
    flame: 0, t: 0, canvas: null,
  };
  const tw = toolW(t);
  if (x == null) { const sp = nextX(tw); t.x = sp.x; t.y = sp.y; }
  else { t.x = clampX(x, tw); t.y = 0; }
  Lab.tools.push(t);
  Lab.scrollEnd = true;
  const what = t.kind === 'heat' ? '（' + def.fuel + '，' + def.power + 'W，最高约 ' + K2C(def.flameT) + '°C）'
    : t.kind === 'meter' ? '（测量器材：' + def.desc + '）' : '（' + def.desc + '）';
  Lab.log.push({ k: 'add', at: Lab.time, text: '在工作台上摆了 ' + def.name + what });
  return t;
}
const toolByUid = (uid) => Lab.tools.find((t) => t.uid === uid) || null;
/** 容器现在架在哪件器材上（没架东西 = null） */
const standOf = (app) => ((app && app.standOn) ? toolByUid(app.standOn) : null);
/** 有没有别的容器已经占着这件器材 */
const occupantOf = (tool, except) => Lab.apps.find((a) => a !== except && a.standOn === tool.uid) || null;
const litTools = () => Lab.tools.filter((t) => t.on);

/* ------------------------- 铁架台：上格铁圈 / 下格酒精灯 ------------------------- */
/** 铁架台上格里架着的容器（没有 = null） */
const standAppOf = (t) => ((t && t.hid === 'stand') ? (Lab.apps.find((a) => a.standOn === t.uid) || null) : null);
/** 铁架台下格里的酒精灯（没有 = null） */
const standLampOf = (t) => ((t && t.lampUid) ? toolByUid(t.lampUid) : null);
const lampInStand = (lamp) => ((lamp && lamp.lampStand) ? toolByUid(lamp.lampStand) : null);
/** 下格放/取热源（lampUid 传 null = 取出来）。第十轮：不再限定酒精灯 —— 本生灯、喷灯、电热板都能进下格 */
function slotLamp(toolUid, lampUid) {
  const t = toolByUid(toolUid); if (!t || t.hid !== 'stand') return { ok: false, why: '这不是铁架台' };
  const old = standLampOf(t);
  if (old) { old.lampStand = null; t.lampUid = null; }
  if (!lampUid) {
    if (old) { Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + old.def.name + ' ' + old.uid + ' 从铁架台下格取出来' }); syncHeaters(); }
    return { ok: true, off: true };
  }
  const lamp = toolByUid(lampUid);
  if (!lamp || lamp.kind !== 'heat') return { ok: false, why: '下格只能放热源（酒精灯 / 本生灯 / 喷灯 / 电热板）' };
  if (lamp.lampStand && lamp.lampStand !== t.uid) return { ok: false, why: '这件热源在别的铁架台里' };
  t.lampUid = lamp.uid; lamp.lampStand = t.uid;
  if (old !== lamp) { lamp.x = t.x; lamp.y = 0; }
  Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + lamp.def.name + ' ' + lamp.uid + ' 放进铁架台 ' + t.uid + ' 的下格' });
  syncHeaters();
  return { ok: true, tool: lamp, lamp: lamp };
}

function lightTool(uid, on) {
  const t = toolByUid(uid); if (!t) return { ok: false, why: '台面上没有这件器材' };
  t.on = !!on;
  if (on) t.flame = Math.max(t.flame, 0.75);
  Lab.log.push({ k: 'ignite', at: Lab.time, text: (on ? '点燃 ' : '熄灭 ') + t.def.name + '（' + t.def.fuel + '）' });
  if (on) {
    const above = Lab.apps.filter((a) => a.standOn === t.uid);
    pushMsg('点燃 ' + t.def.name + '：火焰最高约 ' + K2C(t.def.flameT) + '°C，'
      + (above.length ? '正在加热 ' + above.map((a) => a.def.name + ' ' + a.uid).join('、') : '上面还空着 —— 把容器拖到它上面'));
  } else pushMsg('熄灭 ' + t.def.name);
  syncHeaters();
  return { ok: true, tool: t };
}

/** 把容器架到某件器材上（toolUid 传 null = 拿回台面）。
 *  测量器材走"插入"这条路：温度计/量筒/pH 计插进容器，石棉网垫在容器下面。 */
function placeOn(appUid, toolUid) {
  const app = appByUid(appUid); if (!app) return { ok: false, why: '没有这个容器' };
  if (app.broken) return { ok: false, why: app.def.name + ' 已经炸裂了' };
  if (!toolUid) {
    app.standOn = null;
    (app.meters || []).forEach((uid) => { const m = toolByUid(uid); if (m) m.app = null; });
    app.meters = []; app.gauze = false;
    if (app.rod) { const r = toolByUid(app.rod); if (r) r.app = null; app.rod = null; }
    repackBench(); syncHeaters(); return { ok: true };
  }
  const t = toolByUid(toolUid); if (!t) return { ok: false, why: '台面上没有这件器材' };
  if (t.kind === 'item' && t.def.insert) {                // 玻璃棒：插进容器（一根棒同时只插一个容器）
    Lab.apps.forEach((o) => { if (o !== app && o.rod === t.uid) o.rod = null; });
    app.rod = t.uid; t.app = app.uid;
    Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + t.def.name + ' 插进 ' + app.def.name + ' ' + app.uid + '（' + t.def.desc + '）' });
    repackBench(); updateReadouts && updateReadouts();
    return { ok: true, tool: t };
  }
  if (t.kind === 'meter') {                              // 测量：插进容器（一台仪器一次只插一个）
    Lab.tools.forEach((o) => { if (o !== t && o.kind === 'meter' && o.app === app.uid && o.def.measures === t.def.measures) o.app = null; });
    Lab.apps.forEach((o) => { if (o !== app && o.meters) o.meters = o.meters.filter((uid) => uid !== t.uid); });
    app.meters = (app.meters || []).filter((uid) => (toolByUid(uid) || {}).app === app.uid);
    if (app.meters.indexOf(t.uid) < 0) app.meters.push(t.uid);
    t.app = app.uid;
    Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + t.def.name + ' 插进 ' + app.def.name + ' ' + app.uid + '（' + t.def.desc + '）' });
    repackBench(); updateReadouts && updateReadouts();
    return { ok: true, tool: t, meter: true };
  }
  if (t.kind === 'item' && t.hid === 'gauze') {           // 石棉网：垫在容器下面
    app.gauze = true; t.app = app.uid;
    Lab.log.push({ k: 'place', at: Lab.time, text: '在 ' + app.def.name + ' ' + app.uid + ' 下面垫了石棉网' });
    syncHeaters(); return { ok: true, tool: t, meter: true };
  }
  if (lampInStand(t)) return { ok: false, why: t.def.name + ' 在铁架台的下格里 —— 容器放到铁架台的上格就行（点铁架台的「⬆ 放容器」）' };
  if (t.kind === 'heat' && t.def.needsDirect && !app.def.direct) {   // 明火 + 玻璃器皿：必须过铁架台石棉网
    return { ok: false, why: '⛔ ' + app.def.name + ' 不能直接架在' + t.def.name + '上（明火直烧玻璃，受热不均会炸）—— 先摆「🗼 铁架台」，把容器放进上格、' + t.def.name + ' 放进下格，再点「🕸 石棉网」的「⬇ 垫到容器下」' };
  }
  const other = occupantOf(t, app);
  if (other) return { ok: false, why: t.def.name + ' 上已经架着 ' + other.def.name + ' ' + other.uid + ' 了' };
  app.standOn = t.uid; app.x = t.x; app.y = t.y || 0;
  app.z = Math.max(app.z || 0, (t.z || 0) + 1);        // 架上去的容器画在器材上面（但别挡住器材的按钮区）
  repackBench();                                       // 重排一次，别让两张卡片压住对方的按钮
  Lab.log.push({ k: 'place', at: Lab.time, text: '把 ' + app.def.name + ' ' + app.uid + ' 架到 ' + t.def.name + ' ' + t.uid + ' 上' });
  syncHeaters();
  return { ok: true, tool: t };
}

/* ------------------------------ 测量（数值只能测出来） ------------------------------ */
const meterOn = (app, measures) => ((app && app.meters) || []).map(toolByUid).filter(Boolean)
  .find((t) => t.def && t.def.measures === measures) || null;
const meterOnBench = (measures) => Lab.tools.find((t) => t.kind === 'meter' && t.def.measures === measures) || null;
/** 读数的新鲜度：容器里的东西 / 温度 / 酸碱度变过，旧读数就不作数
 *  ⚠️ 必须带上「溶没溶」和 pH —— 盐酸刚滴进去还没溶解时 pH 是 7、溶解完是 0.2，
 *  只按物质的量算签名会以为旧读数还新鲜，于是 pH 行一直显示 7（"读不出数"的真凶）。 */
const appSig = (app) => app.contents.length + '|' + round(app.contents.reduce((a, c) => a + c.mol, 0), 4)
  + '|' + Math.round(app.temp / 5)            // 温度按 5 °C 一档：慢慢加热时不用每秒重测一次
  + '|' + app.contents.filter((c) => c.dissolved).length
  + '|' + (() => { const p = computePH(app); return p == null ? 'x' : round(p, 2); })();
const measFresh = (app, m) => { const r = app.meas && app.meas[m]; return !!r && r.sig === appSig(app); };

/** 读一个数：必须真的用量器 —— 温度计/量筒/pH 计要插进容器，天平放台面上就行 */
function readValue(app, measures) {
  const def = METERS.find((m) => m.measures === measures);
  if (!def) return { ok: false, why: '没有这种测量器材' };
  const on = meterOn(app, measures), bench = meterOnBench(measures);
  if (def.attach && !on) {
    return { ok: false, meter: def, why: '先把「' + def.icon + ' ' + def.name + '」插进' + app.def.name
      + (bench ? '（点它卡片上的「⬇ 插进 ' + app.def.name + '」）' : '（台面上还没摆，先在「器材」行点一件）') };
  }
  if (!def.attach && !bench) return { ok: false, meter: def, why: '台面上还没有「' + def.name + '」，先在「器材」行摆一件' };
  let v = null, text = '';
  /* 卡片那一格很窄：显示用短文本，精确值（K、含容器质量）写进日志 */
  if (measures === 'temp') { v = K2C(app.temp); text = v + ' °C'; }
  else if (measures === 'vol') {
    if (app.inTrough || app.gasML) {                     // 排水量气：气体顶出来的水接住量，就是气体体积
      v = round(gasVolumeML(app), 1); text = v + ' mL 气体';
    } else { v = round(waterVolume(app) * 1000, 1); text = v + ' mL'; }
  }
  else if (measures === 'ph') {
    const ph = computePH(app);
    if (ph == null) return { ok: false, meter: def, why: app.def.name + ' 里没有水溶液，pH 计读不出数（先加水/加溶液）' };
    v = round(ph, 2);
    text = v + (ph > 7.8 ? '（碱性）' : ph < 6.5 ? '（酸性）' : '（中性）');
  } else if (measures === 'mass') { v = round(totalMass(app), 2); text = v + ' g'; }
  app.meas = app.meas || {};
  app.meas[measures] = { v: v, text: text, at: Lab.time, sig: appSig(app), by: def.name };
  const full = measures === 'temp' ? v + ' °C（' + round(app.temp, 2) + ' K）'
    : measures === 'ph' ? text + '（pH 计读数）'
      : measures === 'mass' ? text + '（含容器 ' + round(app.glassMass, 1) + ' g）' : text;
  Lab.log.push({ k: 'measure', at: Lab.time, text: '【测量 ' + app.def.name + ' ' + app.uid + '】' + def.icon + ' ' + def.name + '：' + full });
  Lab.measureCount = (Lab.measureCount || 0) + 1;
  app.measCount = (app.measCount || 0) + 1;
  return { ok: true, v: v, text: text, meter: def };
}
/** 四样一起测：有量器的读出来，没有的给出缺什么 */
function measureAll(app) {
  const got = [], miss = [], missNames = [];
  METERS.forEach((m) => {
    const r = readValue(app, m.measures);
    if (r.ok) got.push(r.text);
    else { miss.push(r.why); if (missNames.indexOf(m.name) < 0) missNames.push(m.name); }
  });
  return { ok: got.length > 0, got: got, miss: miss, missNames: missNames };
}

function delTool(uid) {  const i = Lab.tools.findIndex((t) => t.uid === uid); if (i < 0) return;
  const t = Lab.tools[i];
  Lab.apps.forEach((a) => { if (a.standOn === t.uid) a.standOn = null; });   // 器材撤走 → 容器落回台面
  const sl = standLampOf(t); if (sl) { sl.lampStand = null; t.lampUid = null; }  // 下格的酒精灯回到台面
  Lab.tools.splice(i, 1);
  repackBench();
  Lab.log.push({ k: 'clear', at: Lab.time, text: '收走 ' + t.def.name });
  syncHeaters();
}

function removeApp(uid) {
  const i = Lab.apps.findIndex((a) => a.uid === uid); if (i < 0) return;
  Lab.apps.splice(i, 1);
  if (Lab.selected === uid) Lab.selected = Lab.apps.length ? Lab.apps[0].uid : null;
  syncHeaters();
}

/** 把"实物关系"翻译成物理引擎认的 app.heater（每步同步一次，所以挪走/熄灭立刻生效） */
function syncHeaters() {
  Lab.apps.forEach((app) => {
    if (app.broken) { app.heater = null; return; }         // 碎了的器皿不再受热
    const t = standOf(app);
    if (!t) { app.heater = null; return; }
    let h;
    if (t.hid === 'stand') {                               // 铁架台：容器在上格铁圈上，靠下格的酒精灯加热
      const lamp = standLampOf(t);
      if (!lamp) { app.heater = null; return; }
      h = Object.assign({}, lamp.def, { on: !!lamp.on, viaStand: true, eff: (lamp.def.eff || 0.5) * 0.9 });
    } else h = Object.assign({}, t.def, { on: !!t.on });
    /* 明火加热的硬规矩（真实实验规则，不是提示）：
       玻璃烧杯/锥形瓶/集气瓶/水槽 不能和明火直接接触 —— 必须
       「铁架台（上格铁圈托容器）+ 石棉网（垫在器皿底下）+ 下格酒精灯」三件齐了才传热。
       试管/坩埚/蒸发皿是真能直接上火的，电热板不是明火，这两类不受限。 */
    if (h.needsDirect && !app.def.direct) {
      const viaStand = !!h.viaStand;
      const mesh = !!app.gauze;
      h.wantedOn = h.on;
      if (!viaStand) {                                    // 直接架在灯头上 = 违规
        h.blocked = 'directFlame'; h.on = false;
        if (h.wantedOn && app._blockWhy !== 'directFlame') {
          app._blockWhy = 'directFlame';
          pushMsg('⛔ ' + app.def.name + '不能直接架在' + h.name + '上（明火直烧玻璃，受热不均会炸）——'
            + '先摆「🗼 铁架台」，把' + app.def.name + '放到上格铁圈，再把热源塞进下格');
        }
      } else if (!mesh) {                                 // 上了铁架台但没垫石棉网
        h.blocked = 'noMesh'; h.on = false;
        if (h.wantedOn && app._blockWhy !== 'noMesh') {
          app._blockWhy = 'noMesh';
          pushMsg('⛔ 铁架台上还差一张石棉网：' + app.def.name + '要垫着石棉网才能受热均匀 ——'
            + '台面摆「🕸 石棉网」，点它的「⬇ 垫到容器下」');
        }
      } else {                                            // 齐活
        if (app._blockWhy) { app._blockWhy = null; pushMsg('✅ 铁架台 + 石棉网 + ' + h.name + ' 齐了，' + app.def.name + '开始正常受热'); }
        if (h.on && !app._meshOk) { app._meshOk = true; pushMsg(app.def.name + ' 垫了石棉网，受热均匀，可以正常加热'); }
        h.meshOk = true;
      }
    } else if (app._blockWhy) { app._blockWhy = null; }
    app.heater = h;
  });
  return Lab.apps;
}

/** 「🗼 配铁架台」：把**台面上已有的**铁架台 + 石棉网 + 这件热源装成一套，并点着。
 *  第十轮用户要求：缺器材只能**告诉他缺什么**，不许偷偷给他 —— 三件里少一件就停下来说清楚。 */
function assembleRig(lampUid) {
  const lamp = toolByUid(lampUid);
  if (!lamp || lamp.kind !== 'heat') return { ok: false, why: '这不是热源器材（酒精灯 / 本生灯 / 喷灯 / 电热板）' };
  const app = appByUid(Lab.selected) || null;
  if (!app) return { ok: false, why: '先点一下要加热的容器卡片（选中它），再点这里' };
  if (app.broken) return { ok: false, why: app.def.name + ' 已经炸裂了' };
  if (app.def.direct) return { ok: false, why: app.def.name + ' 本来就能直火加热 —— 直接点「⬆ 架上来」把它架到' + lamp.def.name + '上就行' };
  const g = Lab.tools.find((x) => x.hid === 'gauze');
  const stand = Lab.tools.find((x) => x.hid === 'stand');
  const miss = [];
  if (!stand) miss.push('🗼 铁架台');
  if (!g) miss.push('🕸 石棉网');
  if (miss.length) {
    const why = '还差 ' + miss.join(' 和 ') + ' —— 左侧「器材」里先摆上，再回来点「🗼 配铁架台」';
    pushMsg('⛔ ' + why);
    return { ok: false, why: why, miss: miss };
  }
  const old = lampInStand(lamp);
  if (old && old.uid !== lamp.uid) slotLamp(old.uid, null);
  if (g) { app.gauze = true; g.app = app.uid; }
  const occ = occupantOf(stand, app);
  if (occ) { occ.standOn = null; pushMsg('把 ' + occ.def.name + ' ' + occ.uid + ' 从上格取回台面'); }
  slotLamp(stand.uid, lamp.uid);
  const r = placeOn(app.uid, stand.uid);
  if (!r.ok) return r;
  lightTool(lamp.uid, true);
  syncHeaters();
  Lab.selected = app.uid;
  Lab.log.push({ k: 'place', at: Lab.time, text: '装配加热装置：铁架台上格放 ' + app.def.name + '，下格放 ' + lamp.def.name + '，器皿下垫石棉网' });
  return { ok: true, app: app, stand: stand, lamp: lamp };
}

/** 脚本 API（教程/测试用）：只装配**台面上已有**的器材，缺了就说缺什么（不再白送）。
 *  ⚠️ 明火加热玻璃器皿（烧杯/锥形瓶/集气瓶）必须走「铁架台 + 石棉网 + 下格热源」，
 *  自动步骤用 tutHeat()（08-tutorial.js）显式摆器材，手玩请自己摆。 */
function setHeater(uid, heaterId, on) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };
  if (app.broken) { pushMsg(app.def.name + ' 已经炸裂了，不能再加热'); return { ok: false, why: '已炸裂' }; }
  if (!on) { const t = standOf(app); if (t) { lightTool(t.uid, false); const l = standLampOf(t); if (l) lightTool(l.uid, false); } app.heater = null; syncHeaters(); return { ok: true, off: true }; }
  const h = HEATERS.find((x) => x.id === heaterId); if (!h) return { ok: false, why: '没有这种热源' };
  const needRig = !!(h.needsDirect && !app.def.direct);
  if (needRig) {
    const miss = [];
    const g = Lab.tools.find((x) => x.hid === 'gauze');
    const stand = Lab.tools.find((x) => x.hid === 'stand');
    if (!stand) miss.push('🗼 铁架台');
    if (!g) miss.push('🕸 石棉网');
    if (miss.length) return { ok: false, why: '还差 ' + miss.join(' 和 ') + '（玻璃器皿上明火要三件齐：铁架台 + 石棉网 + 下格热源）', miss: miss };
    if (g) { app.gauze = true; g.app = app.uid; }
    let heat = standLampOf(stand) || Lab.tools.find((x) => x.hid === h.id && !lampInStand(x));
    if (!heat) return { ok: false, why: '还差一件热源（' + h.name + '）—— 先在器材里摆上台面', miss: [h.name] };
    slotLamp(stand.uid, heat.uid);
    const r0 = placeOn(app.uid, stand.uid); if (!r0.ok) return r0;
    lightTool(heat.uid, true);
    syncHeaters();
    return { ok: true, tool: heat, stand: stand, rig: true };
  }
  let t = standOf(app);
  if (!t || t.hid !== h.id) t = Lab.tools.find((x) => x.hid === h.id && !occupantOf(x));
  if (!t) return { ok: false, why: '台面上还没有' + h.name + ' —— 先在左侧「器材」里摆上一件', miss: [h.name] };
  const r = placeOn(app.uid, t.uid); if (!r.ok) return r;
  lightTool(t.uid, true);
  syncHeaters();
  return { ok: true, tool: t };
}
function ignite(uid) {
  const app = appByUid(uid); if (!app) return;
  app.ignited = true; app.igniteUntil = Lab.time + 3;
  app.flame = Math.max(app.flame, 0.6);
  Lab.log.push({ k: 'ignite', text: '点燃 ' + app.def.name + ' 中的物质', at: Lab.time });
}
/** 规范操作：搅拌/引流要用玻璃棒 —— 但**玻璃棒得玩家自己从器材行拿**（第十一轮：器材一律不白送）。
 *  只有手把手课程在"自动做一步"时才代取（那是教程在演示给玩家看）。 */
function ensureRod(app, why) {
  const rod = toolByUid(app.rod);
  if (rod) return rod;
  if (!window._tutAuto) return null;                     // 玩家自己的动作：缺就是缺，绝不代取
  window._gSilent = true;
  const t = Lab.tools.find((x) => x.def && x.def.id === 'rod') || addTool('rod');
  const r = t ? placeOn(app.uid, t.uid) : { ok: false, why: '台面上器材摆满了（最多 6 件），先收走一件再摆玻璃棒' };
  window._gSilent = false;
  if (!r.ok) { pushMsg(r.why); return null; }
  Lab.log.push({ k: 'place', at: Lab.time, text: '🧑‍🔬 规范操作：' + (why || '搅拌') + '要用玻璃棒 —— 取一根插进 ' + app.def.name + '（溶解速率 ×1.8）' });
  return t;
}
/** 缺玻璃棒时的统一提示（点搅拌 / 过滤都要先自己拿） */
const rodHint = (why) => '还差 🥢 玻璃棒：先到「器材」行点一下拿上台面，再' + (why || '搅拌')
  + '（没有玻璃棒也能手摇，但溶解、引流都慢）';
function stir(uid) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };
  const rod = ensureRod(app, '搅拌');
  if (!rod && !window._tutAuto) { toast(rodHint('搅拌')); Lab.log.push({ k: 'stir', at: Lab.time, text: '🌀 手摇搅拌 ' + app.def.name + '（没有玻璃棒：溶解速率不变）' }); return { ok: true, on: app.stirrerOn, rod: false, hint: rodHint('搅拌') }; }
  app.stirrerOn = !app.stirrerOn;

  return { ok: true, on: app.stirrerOn, rod: !!rod };
}
function clearApp(uid) {

  app.contents.length = 0; app.gasBubbles.length = 0; app.bubbles.length = 0; app.ppts.length = 0;

/** 倾倒：把 from 的液体（含溶质）全部转移到 to */
function pour(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的倾倒' };
  if (a.broken) return { ok: false, why: a.def.name + ' 已经炸裂了，里面的东西全洒了' };
  if (b.broken) return { ok: false, why: b.def.name + ' 已经炸裂了，装不了东西' };
  const liquid = a.contents.filter((c) => c.dissolved || c.phase === 'l' || c.phase === 'aq');
  const wMol = liquid.filter((c) => c.formula === 'H2O').reduce((s, c) => s + c.mol, 0);
  if (wMol <= 1e-9) return { ok: false, why: a.def.name + ' 里没有可倒的液体' };
  if ((waterMol(b) + wMol) * 18.015 > b.def.cap) return { ok: false, why: b.def.name + ' 装不下这些液体' };
  if (shockCheck(b, wMol * 18.015)) return { ok: false, why: b.def.name + ' 被倒进来的液体骤冷激裂了！' };
  liquid.forEach((c) => {
    addContent(b, c.formula, c.mol, c.phase === 'l' ? 'l' : 'aq', c.phase !== 'l');
    c.mol = 0;
  });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  Lab.pourCount++;
  Lab.log.push({ k: 'pour', text: '把 ' + a.def.name + ' 中的液体倒入 ' + b.def.name, at: Lab.time });
  return { ok: true };
}

/** 导气：把 a 气相里的气体通入 b（导管/排气法）。装不下的从 b 逸出；b 里有液体则冒泡穿过 */
function feedGas(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的导气目标' };
  if (a.broken || b.broken) return { ok: false, why: '炸裂的容器接不了导管' };
  // 通气时，溶液里溶解的气体也会被带出来：溶解的 CO₂ 回到气相，碳酸不稳定、直接分解放出 CO₂
  [...a.contents].forEach((c) => {
    if (c.mol <= 1e-9 || c.phase === 'g' || c.formula === 'H2O') return;
    if (c.formula === 'H2CO3') {
      addContent(a, 'H2O', c.mol, null, true);
      addContent(a, 'CO2', c.mol, 'g', false);
      c.mol = 0;
    } else if (c.formula === 'NH3·H2O') {
      // 氨水被"导气"带走时放出氨气（真实实验里加热氨水就是制氨气的办法）
      addContent(a, 'H2O', c.mol, null, true);
      addContent(a, 'NH3', c.mol, 'g', false);
      c.mol = 0;
    } else {
      const s = subOf(c.formula);
      if (s && s.st === 'g') { c.phase = 'g'; c.dissolved = false; }
    }
  });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  const gases = a.contents.filter((c) => c.phase === 'g' && c.mol > 1e-9);
  if (!gases.length) return { ok: false, why: a.def.name + ' 里没有气体可导出（先让它产生气体）' };
  const names = gases.map((c) => c.formula);
  gases.forEach((c) => {
    const keep = putGas(b, c.formula, c.mol);
    if (keep > 1e-12 && waterMol(b) > 1e-9) b.gasBubbles.push({ f: c.formula, mol: keep });   // 气体穿过液体 → 冒泡
    c.mol = 0;
  });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  Lab.gasFeedCount++;
  Lab.log.push({
    k: 'pour', at: Lab.time,
    text: '导气：' + a.def.name + ' 中的 ' + names.join('、') + ' 通入 ' + b.def.name
      + (waterMol(b) > 1e-9 ? '（气泡穿过液体）' : ''),
  });
  return { ok: true, moved: names };
}

/* 过滤：把液相滤到另一个容器，未溶固体留在原容器（初中「粗盐提纯」核心操作） */
function filterApp(fromUid, toUid) {
  const a = appByUid(fromUid), b = appByUid(toUid);
  if (!a || !b || a === b) return { ok: false, why: '无效的过滤目标' };
  if (a.broken || b.broken) return { ok: false, why: '炸裂的容器不能用来过滤' };
  const liquid = a.contents.filter((c) => c.phase !== 'g' && (c.dissolved || c.phase === 'l'));
  const wMol = liquid.filter((c) => c.formula === 'H2O').reduce((s, c) => s + c.mol, 0);
  if (wMol <= 1e-9) return { ok: false, why: a.def.name + ' 里没有可滤的液体' };
  if ((waterMol(b) + wMol) * 18.015 > b.def.cap) return { ok: false, why: b.def.name + ' 装不下这些滤液' };
  liquid.forEach((c) => { addContent(b, c.formula, c.mol, c.phase === 'l' ? 'l' : 'aq', c.phase !== 'l'); c.mol = 0; });
  a.contents = a.contents.filter((c) => c.mol > 1e-9);
  const kept = a.contents.filter((c) => !c.dissolved && c.phase !== 'g');
  if (!ensureRod(a, '过滤引流') && !window._tutAuto) return { ok: false, why: rodHint('过滤引流') };   // 玻璃棒得自己拿
  Lab.filterCount++;
  Lab.log.push({
    k: 'pour', at: Lab.time,
    text: '过滤：' + a.def.name + ' 里的液体用 🥢 玻璃棒引流滤进 ' + b.def.name + '，滤纸上留下 '
      + (kept.length ? kept.map((c) => c.formula).join('、') : '少量不溶物'),
  });
  return { ok: true, kept: kept.map((c) => c.formula) };
}

/** 通电（电解）：需要容器里有水/电解质溶液 */
function setPower(uid, on) {
  const app = appByUid(uid); if (!app) return { ok: false, why: '没有这个容器' };

    Lab.elecCount++;

  } else {

function pushMsg(text) { Lab.lastMsg = text; Lab.log.push({ k: 'warn', text, at: Lab.time }); if (Lab.log.length > 200) Lab.log.shift(); }

/** 每步环境（点燃/催化剂/浓度） */
function envOf(app) {
  const cats = new Set(app.contents.filter((c) => c.mol > 1e-9 && CATALYSTS.has(c.formula)).map((c) => c.formula));
  return {
    temp: app.temp,
    catalysts: cats,
    ignite: !!app.ignited && (app.igniteUntil || 0) > Lab.time,
    conc: app.acidConc === 'conc' ? 'conc' : 'dil',
    light: false, discharge: !!app.discharge, elec: !!app.elec,
  };
}

/** 反应是否已被发现（key 是排序过的，用集合比较更稳） */
function rxFound(lhs, rhs) {

  const want = norm(lhs) + '>' + norm(rhs);

const TASKS = [

/* ------------------------------ 主循环一步 ------------------------------- */
function labStep(dt) {
  const envs = [];
  Lab.time += dt;
  syncHeaters();                                    // 先把"谁架在什么器材上、点着没有"翻译成热源，再跑物理
  Lab.tools.forEach((t) => { t.t = (t.t || 0) + dt; t.flame = Math.max(0, (t.flame || 0) - dt * 0.8); });
  Lab.apps.forEach((app) => {
    // 反应产物气泡/蒸汽速率自然衰减（缓慢衰减：气泡要飘一会儿才散）
    app.bubbleRate = Math.max(0, app.bubbleRate - dt * 6);
    app.pptRate = Math.max(0, app.pptRate - dt * 4);
    if (app.gasBubbles.length) app.bubbleRate = Math.max(app.bubbleRate, 30);
    app.flash = Math.max(0, app.flash - dt * 1.6);
    app.flame = Math.max(0, app.flame - dt * 0.8);
    app.smoke = Math.max(0, app.smoke - dt * 0.7);
    app.glow = Math.max(0, (app.glow || 0) - dt * 0.75);     // 白光：暗下去比反应慢一档，让人看得见（原来 1.5 一闪就没）
    app.spark = Math.max(0, (app.spark || 0) - dt * 0.9);    // 火星持续几秒
    app.boom = Math.max(0, (app.boom || 0) - dt * 2.2);      // 爆炸冲击波一晃而过
    if (app.ignited && (app.igniteUntil || 0) <= Lab.time && app.flame <= 0.05) app.ignited = false;
    // 冒泡计数 → 供渲染与气体验证
    app.gasBubbles = app.gasBubbles.filter((g) => { g.mol -= dt * 0.02; return g.mol > 1e-4; });
    const before = app.temp;
    const rx = worldStep(app, dt, envOf(app));
    rx.forEach((r) => {
      Lab.totalRx++;
      Lab.discovered.add(r.rx.key);
      Lab.log.push({
        k: 'rxn', at: Lab.time, uid: app.uid,
        text: r.rx.eq + (r.rx.condText ? '  （' + r.rx.condText + '）' : ''),
        note: r.rx.note + '｜' + r.rx.phen.join('、') + '｜ΔH≈' + round(r.dHUsed, 1) + ' kJ/mol'
          + (r.usedAq ? (r.rx.dhAqEst ? '（估算）' : '（水合态生成焓）') : (r.rx.dhEst ? '（估算）' : '（由生成焓算出）')),
      });
    });
    // 反应过程内的累计温升（同一次反应可能跨好几步，不能只看单步；单纯加热不算）
    if (rx.length) {
      if (app._rxMark == null || Lab.time - (app._rxLast || 0) > 1.5) app._rxMark = before;
      app._rxLast = Lab.time;
      Lab.maxRxRise = Math.max(Lab.maxRxRise || 0, app.temp - app._rxMark);
    } else if (app._rxMark != null && Lab.time - (app._rxLast || 0) > 1.5) app._rxMark = null;
  });
  if (Lab.log.length > 240) Lab.log.splice(0, Lab.log.length - 240);
  refreshTasks();
}

/* ------------------------------------------------ 排水集气法 & 木条检验 ----- */
/** 工作台上有水槽吗（水槽是容器，排水法要用它装水） */
const troughApp = () => Lab.apps.find((a) => a.def && a.def.id === 'trough') || null;
/** 把集气瓶倒扣进水槽：瓶里灌满水，之后导进去的气体就把水顶出来 */
function submergeJar(jarUid, troughUid) {
  const jar = appByUid(jarUid);
  if (!jar) return { ok: false, why: '没有这个集气瓶' };
  if (!jar.def || jar.def.id !== 'gasjar') return { ok: false, why: jar.def.name + ' 不是集气瓶：排水集气法要用集气瓶' };
  const tr = appByUid(troughUid) || troughApp();
  if (!tr) return { ok: false, why: '工作台上还没有水槽 —— 先在左上「放一个」里加一个 🛁 水槽（水槽是容器，先给它加水）' };
  if (!tr.def || tr.def.id !== 'trough') return { ok: false, why: tr.def.name + ' 不是水槽，集气瓶倒扣不进去' };
  const haveML = waterVolume(tr) * 1000;
  if (haveML < 5) return { ok: false, why: '水槽里几乎没水（' + round(haveML, 1) + ' mL）—— 先从试剂架往水槽里加水（水槽能装 2000 mL），再把集气瓶倒扣进去' };
  if (jar.standOn) placeOn(jar.uid, null);
  jar.contents.length = 0; jar.ppts.length = 0; jar.bubbles.length = 0; jar.gasBubbles.length = 0;
  jar.meas = {}; jar.drainedML = 0; jar.tested = null;
  const cap = Math.min(jar.def.cap, haveML);
  removeWater(tr, cap / 18.015);
  addContent(jar, 'H2O', cap / 18.015, 'l', false);
  jar.inTrough = tr.uid;
  Lab.submergeCount = (Lab.submergeCount || 0) + 1;
  Lab.log.push({ k: 'place', at: Lab.time, text: '把集气瓶倒扣进水槽，瓶里灌满了水（' + round(cap, 0) + ' mL）—— 现在可以导气收集气体了' });
  pushMsg('⤵ 集气瓶倒扣在水槽里（排水法）：点发生装置的「💨 导气」→ 选集气瓶，气体会把瓶里的水顶出来');
  return { ok: true, ml: cap };
}
/** 把集气瓶从水槽里取出来正放，瓶里收集到的气体就留在瓶里 */
function liftJar(jarUid) {
  const jar = appByUid(jarUid);
  if (!jar || !jar.inTrough) return { ok: false, why: '这个集气瓶没倒扣在水槽里' };
  jar.inTrough = null;
  const ml = gasVolumeML(jar);
  jar.gasML = ml;                                        // 取出来后仍按"收集到的气体体积"读数
  const names = jar.contents.filter((c) => c.phase === 'g').map((c) => subName(c.formula)).join('、');
  Lab.log.push({ k: 'place', at: Lab.time, text: '把集气瓶从水槽里取出来正放：瓶内收集到 ' + round(ml, 1) + ' mL 气体（' + (names || '没有气体') + '）' });
  return { ok: true, ml: ml };
}
/** 点着 / 吹灭木条（检验气体前要点着） */
function lightSplint(uid, on) {
  const t = toolByUid(uid);
  if (!t || t.hid !== 'splint') return { ok: false, why: '这不是木条' };
  t.lit = on !== false;
  Lab.log.push({ k: 'ignite', at: Lab.time, text: (t.lit ? '点着木条 🪵（可以用它检验气体了）' : '吹灭木条') });
  return { ok: true, lit: t.lit };
}
/** 把木条伸进容器检验气体：氧气 → 复燃；二氧化碳 → 熄灭 */
function probeGas(toolUid, appUid) {
  const t = toolByUid(toolUid), app = appByUid(appUid);
  if (!t || t.hid !== 'splint') return { ok: false, why: '要拿木条去检验气体' };
  if (!app) return { ok: false, why: '先选一个装着气体的容器' };
  if (!t.lit) return { ok: false, why: '木条还没点着 —— 点它卡片上的「🔥 点着木条」' };
  const total = gasInApp(app);
  if (total <= 1e-9) return { ok: false, why: app.def.name + ' 里没有气体（先制气，再用「💨 导气」收集起来）' };
  const o2 = gasInApp(app, 'O2') / total, co2 = gasInApp(app, 'CO2') / total;
  let res;
  if (o2 >= 0.30) res = { k: 'O2', text: '带火星的木条「啪」地复燃、烧得更旺 —— 瓶里是氧气（O₂ 支持燃烧）' };
  else if (co2 >= 0.50) res = { k: 'CO2', text: '燃着的木条伸进去立刻熄灭 —— 瓶里是二氧化碳（CO₂ 不燃烧、也不支持燃烧）' };
  else if (o2 >= 0.12) res = { k: 'mix', text: '木条烧得比在空气里旺一点 —— 气体里含氧，但不纯' };
  else res = { k: 'none', text: '木条没有明显变化 —— 不是氧气' };
  app.tested = res.k; app.testText = res.text; t.lit = false;
  Lab.probeCount = (Lab.probeCount || 0) + 1;
  Lab.log.push({ k: 'test', at: Lab.time, text: '【木条检验 ' + app.def.name + ' ' + app.uid + '】' + res.text });
  pushMsg('🪵 ' + res.text);
  return { ok: true, k: res.k, text: res.text };
}


/* ================= 06-view.js ================= */
/* ============================================================================
 * 06-view.js —— 视觉层：玻璃器皿、液面、固体堆积、气泡、沉淀、火焰、蒸汽、闪光
 * ----------------------------------------------------------------------------
 * 全部 Canvas 2D 手绘，无贴图无外部资源。粒子数与物理步长解耦（固定 dt 上限）。
 * ==========================================================================*/

const VIEW = { bubbleCap: 90, pptCap: 80, steamCap: 40, baseH: 64 };
/* 画布基准高（= CSS --bh）。粒子/字号按实际画布高与基准的比值缩放，
   这样把模型改小以后，气泡不会变得又大又笨。 */
const vk = (app) => (app && app._k) || 1;

/* ---------------------------- 溶液颜色（真实观感） ------------------------- */
const TINT_STRENGTH = {
  CuSO4: 3.2, CuCl2: 2.6, 'Cu(NO3)2': 2.6, KMnO4: 6.0, I2: 4.0, Br2: 4.0,
  FeCl3: 2.0, 'Fe2(SO4)3': 2.0, K2MnO4: 3.0, 酚酞: 2.0, 石蕊: 1.5,
};
function solutionColor(app) {
  const V = Math.max(1e-4, waterVolume(app));
  let r = 0, g = 0, b = 0, wsum = 0;
  app.contents.filter((c) => c.dissolved && c.formula !== 'H2O').forEach((c) => {
    const s = subOf(c.formula); if (!s) return;
    const col = hex2rgb(s.color);
    // 无色溶质（食盐、硝酸银、氢氧化钠…）不该把水染成白汤，只有带色离子的才计权
    const mx = Math.max(col[0], col[1], col[2]);
    if (mx <= 0) return;
    const sat = (mx - Math.min(col[0], col[1], col[2])) / mx;
    if (sat < 0.12) return;
    const conc = c.mol / V;
    const str = (TINT_STRENGTH[c.formula] || 1) * conc;
    if (str < 1e-4) return;
    r += col[0] * str; g += col[1] * str; b += col[2] * str; wsum += str;
  });
  // 指示剂（酚酞遇碱变红 / 石蕊变蓝）优先级最高：真实实验里它就是一眼能看见
  const tint = indicatorTint(app);
  if (tint) { const col = hex2rgb(tint); const w = 1.1; r += col[0] * w; g += col[1] * w; b += col[2] * w; wsum += w; }
  if (wsum > 0) {
    const base = [200, 228, 245];
    const mix = [r / wsum, g / wsum, b / wsum];
    const a = Math.min(0.92, 0.12 + wsum * 0.5);
    const col = base.map((v, i) => Math.round(v * (1 - a) + mix[i] * a));
    return { rgb: col, alpha: 0.62 + a * 0.28 };
  }
  return { rgb: [200, 228, 245], alpha: 0.55 };
}
const hex2rgb = (h) => {
  if (!h) return [200, 200, 200];
  if (h[0] !== '#') return [200, 200, 200];
  const v = h.length === 4 ? h.slice(1).split('').map((c) => c + c).join('') : h.slice(1);
  return [parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16)];
};
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

/* ------------------------------- 器皿几何 -------------------------------- */
function vesselGeom(shape, w, h) {
  const P = new Path2D();
  let top, bot, x0, x1;
  if (shape === 'tube') {
    x0 = w * 0.37; x1 = w * 0.63; top = h * 0.10; bot = h * 0.86;
    const r = (x1 - x0) / 2;
    P.moveTo(x0, top); P.lineTo(x0, bot - r); P.arc((x0 + x1) / 2, bot - r, r, Math.PI, 0, true);
    P.lineTo(x1, top); P.closePath();
  } else if (shape === 'beaker') {
    x0 = w * 0.24; x1 = w * 0.76; top = h * 0.20; bot = h * 0.84;
    P.moveTo(x0, top); P.lineTo(x0 + w * 0.02, bot - h * 0.04); P.quadraticCurveTo(x0 + w * 0.03, bot, x0 + w * 0.09, bot);
    P.lineTo(x1 - w * 0.09, bot); P.quadraticCurveTo(x1 - w * 0.03, bot, x1 - w * 0.02, bot - h * 0.04);
    P.lineTo(x1, top); P.closePath();
  } else if (shape === 'flask') {
    x0 = w * 0.20; x1 = w * 0.80; top = h * 0.08; bot = h * 0.88;
    const nx0 = w * 0.43, nx1 = w * 0.57, ny = h * 0.36;
    P.moveTo(nx0, top); P.lineTo(nx0, ny); P.lineTo(x0, bot - h * 0.05);
    P.quadraticCurveTo(x0, bot, x0 + w * 0.12, bot); P.lineTo(x1 - w * 0.12, bot);
    P.quadraticCurveTo(x1, bot, x1, bot - h * 0.05); P.lineTo(nx1, ny); P.lineTo(nx1, top); P.closePath();
  } else if (shape === 'dish') {
    x0 = w * 0.18; x1 = w * 0.82; top = h * 0.46; bot = h * 0.84;
    P.moveTo(x0, top); P.quadraticCurveTo(w * 0.5, bot + h * 0.06, x1, top); P.closePath();
  } else {                                  // crucible 坩埚
    x0 = w * 0.28; x1 = w * 0.72; top = h * 0.34; bot = h * 0.86;
    P.moveTo(x0, top); P.lineTo(x0 + w * 0.06, bot); P.lineTo(x1 - w * 0.06, bot); P.lineTo(x1, top); P.closePath();
  }
  return { path: P, top, bot, x0, x1, cx: (x0 + x1) / 2, w: x1 - x0 };
}

/* -------------------------------- 粒子系统 -------------------------------- */
function spawnParticles(app, dt) {
  const g = app._geo; if (!g) return;
  const boil = app.temp > (typeof boilingPoint === 'function' ? boilingPoint(app) - 1.5 : 372) && waterMol(app) > 1e-9;
  let rate = app.bubbleRate + (boil ? 26 : 0);
  if (app.heater && app.heater.on && waterMol(app) > 1e-9 && app.temp > 320) rate += (app.temp - 320) * 0.08;
  // 累积器：每帧生成量常常不足 1 个，直接四舍五入会永远生不出粒子
  const acc = (k, amt) => { app[k] = (app[k] || 0) + amt; const n = Math.floor(app[k]); app[k] -= n; return n; };
  const k = vk(app);
  const nB = Math.min(8, acc('_bAcc', rate * dt * 2));
  for (let i = 0; i < nB && app.bubbles.length < VIEW.bubbleCap; i++) {
    const bx = g.x0 + (g.x1 - g.x0) * (0.12 + Math.random() * 0.76);
    const y = app._liquidTop + (g.bot - app._liquidTop) * (0.3 + Math.random() * 0.7);
    app.bubbles.push({ x: bx, y, r: (1.2 + Math.random() * 2.6) * k, v: (12 + Math.random() * 26) * k, ph: Math.random() * 6.28 });
  }
  const nP = Math.min(6, acc('_pAcc', app.pptRate * dt * 2));
  for (let i = 0; i < nP && app.ppts.length < VIEW.pptCap; i++) {
    const px = g.x0 + (g.x1 - g.x0) * (0.08 + Math.random() * 0.84);
    app.ppts.push({ x: px, y: app._liquidTop + Math.random() * (g.bot - app._liquidTop) * 0.5, r: (0.8 + Math.random() * 1.6) * k, v: (4 + Math.random() * 9) * k, c: app._pptRgb || [80, 80, 80] });
  }
  const nS = Math.min(4, acc('_sAcc', boil ? dt * 18 : 0));
  for (let i = 0; i < nS && app.steam.length < VIEW.steamCap; i++) {
    app.steam.push({ x: g.cx + (Math.random() - 0.5) * g.w * 0.7, y: app._liquidTop - 2, r: (4 + Math.random() * 7) * k, life: 1, v: (14 + Math.random() * 16) * k });
  }
}

function stepParticles(app, dt) {
  const g = app._geo; if (!g) return;
  const surface = app._liquidTop;
  app.bubbles = app.bubbles.filter((b) => {
    b.y -= b.v * dt; b.ph += dt * 6;
    return b.y > surface - 3;
  });
  app.ppts = app.ppts.filter((p) => {
    p.y += p.v * dt;
    return p.y < g.bot - 2;
  });
  app.steam = app.steam.filter((s) => { s.y -= s.v * dt; s.r += dt * 9; s.life -= dt * 0.55; return s.life > 0; });
}

/* --------------------------------- 渲染 ---------------------------------- */
function drawBench(ctx, w, h) {
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#10161d'); bg.addColorStop(0.62, '#0d1319'); bg.addColorStop(1, '#1b2833');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(120,180,220,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, h * 0.86); ctx.lineTo(w, h * 0.86); ctx.stroke();
  ctx.fillStyle = 'rgba(120,180,220,0.05)'; ctx.fillRect(0, h * 0.86, w, h * 0.14);
  // 网格纹路
  ctx.strokeStyle = 'rgba(120,180,220,0.05)';
  for (let x = 0; x < w; x += 18) { ctx.beginPath(); ctx.moveTo(x, h * 0.86); ctx.lineTo(x, h); ctx.stroke(); }
}

function drawFlame(ctx, app, g, h) {
  if (!app.heater || !app.heater.on) return;
  const t = app.time * 8;
  const cx = g.cx, base = h * 0.90;
  const kind = app.heater.id;
  const flick = 0.85 + 0.15 * Math.sin(t) + 0.08 * Math.sin(t * 2.7);
  if (kind === 'plate') {
    const grd = ctx.createRadialGradient(cx, base - 4, 2, cx, base - 4, g.w * 0.8);
    grd.addColorStop(0, 'rgba(255,90,40,0.55)'); grd.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(cx, base - 2, g.w * 0.8, h * 0.05, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(20,20,24,0.9)'; ctx.fillRect(cx - g.w * 0.55, base - 2, g.w * 1.1, 6);
    return;
  }
  const fh = (kind === 'bunsen' ? h * 0.22 : h * 0.15) * flick;
  const fw = g.w * (kind === 'bunsen' ? 0.34 : 0.42);
  // 外焰
  let grd = ctx.createRadialGradient(cx, base - fh * 0.45, 1, cx, base - fh * 0.45, fh * 0.9);
  grd.addColorStop(0, kind === 'bunsen' ? 'rgba(170,220,255,0.95)' : 'rgba(255,230,150,0.95)');
  grd.addColorStop(0.5, kind === 'bunsen' ? 'rgba(90,150,255,0.65)' : 'rgba(255,150,40,0.7)');
  grd.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(cx, base - fh * 0.45, fw * 0.6, fh * 0.62, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - fw * 0.35, base); ctx.quadraticCurveTo(cx - fw * 0.15, base - fh * 0.9, cx, base - fh);
  ctx.quadraticCurveTo(cx + fw * 0.15, base - fh * 0.9, cx + fw * 0.35, base); ctx.closePath();
  ctx.fillStyle = kind === 'bunsen' ? 'rgba(150,200,255,0.55)' : 'rgba(255,200,90,0.5)'; ctx.fill();
  // 灯体
  if (kind === 'lamp') { ctx.fillStyle = '#2a3947'; ctx.fillRect(cx - g.w * 0.26, base, g.w * 0.52, h * 0.07); }
  else { ctx.fillStyle = '#26333f'; ctx.fillRect(cx - 4, base, 8, h * 0.07); ctx.fillRect(cx - g.w * 0.3, h * 0.97, g.w * 0.6, 4); }
}

function drawBroken(ctx, g, app, w, h) {
  ctx.save();
  // 只剩半截的器壁 + 锯齿缺口
  ctx.strokeStyle = 'rgba(150,205,225,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(g.x0, g.top + (g.bot - g.top) * 0.34);
  ctx.lineTo(g.x0, g.bot - 8);
  ctx.quadraticCurveTo(g.cx, g.bot + 8, g.x1, g.bot - 8);
  ctx.lineTo(g.x1, g.top + (g.bot - g.top) * 0.42);
  ctx.stroke();
  // 裂纹
  ctx.strokeStyle = 'rgba(225,245,255,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const x = g.x0 + (g.x1 - g.x0) * (0.18 + i * 0.21);
    ctx.beginPath();
    ctx.moveTo(x, g.bot - 10);
    ctx.lineTo(x + (i % 2 ? 7 : -7), g.top + (g.bot - g.top) * (0.45 + i * 0.05));
    ctx.stroke();
  }
  // 台面上的碎玻璃
  (app.shards || []).forEach((s) => {
    const sx = g.cx + s.x * (g.x1 - g.x0) * 1.15;
    const sy = Math.min(h - 6, g.bot + 8 + s.y * 34);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(s.rot);
    ctx.beginPath();
    ctx.moveTo(-s.r * 0.6, s.r * 0.5); ctx.lineTo(s.r * 0.7, s.r * 0.3); ctx.lineTo(-s.r * 0.1, -s.r * 0.7);
    ctx.closePath();
    ctx.fillStyle = 'rgba(170,220,240,0.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(230,250,255,0.7)'; ctx.lineWidth = 0.8; ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = 'rgba(255,120,120,0.92)';
  ctx.font = 'bold ' + Math.round(11 * vk(app)) + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('❌ 已炸裂', g.cx, g.top + 14 * vk(app));
  ctx.restore();
}

function renderApparatus(canvas, app, dt) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 190, h = canvas.clientHeight || 150;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  app._k = Math.max(0.55, Math.min(1.25, h / VIEW.baseH));     // 粒子/字号缩放系数
  drawBench(ctx, w, h);
  const g = vesselGeom(app.def.shape, w, h);
  app._geo = g;
  if (app.broken) { drawBroken(ctx, g, app, w, h); return; }

  // 液面高度
  const fr = Math.max(0, Math.min(1, fillRatio(app)));
  const innerTop = g.top + (g.bot - g.top) * 0.06;
  const liquidTop = g.bot - (g.bot - innerTop) * Math.min(1, fr);
  app._liquidTop = liquidTop;
  const col = solutionColor(app);
  app._pptRgb = (app.contents.find((c) => !c.dissolved && c.phase !== 'g' && subOf(c.formula) && subOf(c.formula).solubility === -1) ?
    hex2rgb(subOf(app.contents.find((c) => !c.dissolved && c.phase !== 'g' && subOf(c.formula) && subOf(c.formula).solubility === -1).formula).color) : [70, 70, 70]);

  spawnParticles(app, dt);
  stepParticles(app, dt);

  drawFlame(ctx, app, g, h);

  // 玻璃内部
  ctx.save();
  ctx.fillStyle = 'rgba(190,225,245,0.06)'; ctx.fill(g.path); ctx.fill();
  if (waterMol(app) > 1e-9 || app.iceMol > 0) {
    ctx.save(); ctx.clip(g.path);
    const lg = ctx.createLinearGradient(0, liquidTop, 0, g.bot);
    lg.addColorStop(0, rgba(col.rgb, col.alpha * 0.85));
    lg.addColorStop(1, rgba(col.rgb.map((v) => Math.round(v * 0.82)), col.alpha));
    ctx.fillStyle = lg;
    ctx.fillRect(g.x0 - 2, liquidTop, g.w + 4, g.bot - liquidTop + 2);
    // 水面的弯月面
    ctx.strokeStyle = rgba([235, 248, 255], 0.55); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(g.x0, liquidTop); ctx.quadraticCurveTo(g.cx, liquidTop + 3, g.x1, liquidTop); ctx.stroke();
    ctx.restore();
  }
  // 未溶解固体（按量堆积）
  const solids = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
  if (solids.length) {
    ctx.save(); ctx.clip(g.path);
    let pile = 0;
    solids.forEach((c) => {
      const s = subOf(c.formula); if (!s) return;
      const c2 = hex2rgb(s.color);
      const vol = massOf(c) / Math.max(0.5, subDensity(s) || 2);
      const hgt = Math.min(h * 0.30, 3 + vol * 0.9);
      const yy = g.bot - pile;
      ctx.fillStyle = rgba(c2, 0.95);
      ctx.beginPath();
      ctx.moveTo(g.x0 + 1, yy);
      for (let i = 0; i <= 8; i++) {
        const x = g.x0 + 1 + (g.w - 2) * (i / 8);
        const bump = Math.sin(i * 1.7 + c.mol * 3) * (hgt * 0.22);
        ctx.lineTo(x, yy - hgt * (0.55 + 0.45 * Math.sin((i / 8) * Math.PI)) - bump);
      }
      ctx.lineTo(g.x1 - 1, yy); ctx.closePath(); ctx.fill();
      pile += hgt * 0.28;
    });
    ctx.restore();
  }
  // 沉淀颗粒
  app.ppts.forEach((p) => {
    ctx.fillStyle = rgba(p.c, 0.85);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  });
  // 气泡
  app.bubbles.forEach((b) => {
    const wob = Math.sin(b.ph) * 1.4;
    ctx.strokeStyle = 'rgba(240,252,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x + wob, b.y, b.r, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(220,245,255,0.18)'; ctx.fill();
  });
  // 液面上方的蒸汽
  app.steam.forEach((s) => {
    ctx.fillStyle = 'rgba(225,240,250,' + (0.30 * s.life) + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
  });
  // 玻璃高光与轮廓
  ctx.save(); ctx.clip(g.path);
  const hl = ctx.createLinearGradient(g.x0, 0, g.x1, 0);
  hl.addColorStop(0, 'rgba(255,255,255,0.16)'); hl.addColorStop(0.18, 'rgba(255,255,255,0.03)');
  hl.addColorStop(0.85, 'rgba(255,255,255,0.01)'); hl.addColorStop(1, 'rgba(255,255,255,0.13)');
  ctx.fillStyle = hl; ctx.fillRect(g.x0 - 4, 0, g.w + 8, h);
  ctx.restore();
  ctx.strokeStyle = 'rgba(200,232,248,0.55)'; ctx.lineWidth = 1.6; ctx.stroke(g.path);
  // 刻度线
  if (app.def.shape !== 'dish') {
    ctx.strokeStyle = 'rgba(200,232,248,0.28)'; ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      const y = g.bot - (g.bot - g.top) * (i / 5);
      ctx.beginPath(); ctx.moveTo(g.x1 - 6, y); ctx.lineTo(g.x1 - 1, y); ctx.stroke();
    }
  }
  // 反应闪光 / 干烧告警
  if (app.flash > 0.01) {
    const grd = ctx.createRadialGradient(g.cx, liquidTop, 1, g.cx, liquidTop, Math.max(g.w, 60));
    grd.addColorStop(0, 'rgba(255,240,190,' + Math.min(0.75, app.flash) + ')');
    grd.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
  }
  if (app.flame > 0.5) {
    ctx.fillStyle = 'rgba(255,200,120,' + Math.min(0.35, app.flame * 0.25) + ')';
    ctx.beginPath(); ctx.arc(g.cx, liquidTop, Math.max(g.w * 0.7, 40), 0, 6.283); ctx.fill();
  }
  /* ---- 剧烈反应特效：白光 / 火星四射 / 爆炸 / 窜起的火苗 ---- */
  if (app.glow > 0.02) {                                   // 镁条燃烧那类白光：整格泛白
    const k = Math.min(1, app.glow);
    const gg = ctx.createRadialGradient(g.cx, liquidTop, 1, g.cx, liquidTop, Math.max(g.w * 2.4, 120));
    gg.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, 1.05 * k) + ')');
    gg.addColorStop(0.32, 'rgba(255,250,214,' + (0.62 * k) + ')');
    gg.addColorStop(0.7, 'rgba(255,226,150,' + (0.22 * k) + ')');
    gg.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, w, h);
    ctx.save();                                            // 再加一层中心过曝：「耀眼」两个字得对得起
    ctx.globalCompositeOperation = 'lighter';
    const gg2 = ctx.createRadialGradient(g.cx, liquidTop, 1, g.cx, liquidTop, Math.max(g.w * 0.75, 46));
    gg2.addColorStop(0, 'rgba(255,255,255,' + Math.min(0.95, 0.8 * k) + ')');
    gg2.addColorStop(1, 'rgba(255,255,235,0)');
    ctx.fillStyle = gg2; ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }
  if (app.spark > 0.02) {                                  // 火星四射：从液面炸开的火星
    const k = Math.min(1, app.spark);
    const n = 40;                                        // 火星多一些：铁丝在氧气里是「四射」
    ctx.save();
    ctx.lineWidth = 1.7; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 6.283 + app.time * 0.8;
      const life = (app.time * 2.2 + i * 0.137) % 1;        // 每颗火星各走各的：0→1 就是它的一生
      const r0 = Math.max(g.w * 0.18, 8) + life * (g.w * 0.9 + 26);
      const x = g.cx + Math.cos(a) * r0, y = liquidTop + Math.sin(a) * r0 * 0.75 + life * life * 14;
      const len = 4 + 11 * (1 - life);
      ctx.strokeStyle = 'rgba(255,' + Math.round(230 - 90 * life) + ',' + Math.round(120 - 90 * life) + ',' + (k * (1 - life) * 0.95) + ')';
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * 0.75 + 6 * life);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (app.boom > 0.02) {                                   // 爆炸：冲一下 + 冲击波环（幅度克制，别把点击抖飞）
    const k = Math.min(1, app.boom);
    ctx.fillStyle = 'rgba(255,190,110,' + (0.5 * k) + ')'; ctx.fillRect(0, 0, w, h);
    const ring = (1 - k) * Math.max(g.w, 50) + 8;
    ctx.strokeStyle = 'rgba(255,240,200,' + (0.8 * k) + ')'; ctx.lineWidth = 2 + 3 * k;
    ctx.beginPath(); ctx.arc(g.cx, liquidTop, ring, 0, 6.283); ctx.stroke();
  }
  if (app.flame > 0.9) {                                   // 剧烈燃烧：液面上真的窜火苗
    const k = Math.min(1, (app.flame - 0.9) / 0.7);
    for (let i = 0; i < 5; i++) {
      const px = g.cx + Math.sin(app.time * 3.1 + i * 1.7) * g.w * 0.34;
      const hgt = (7 + 15 * k) * (0.75 + 0.25 * Math.sin(app.time * 6 + i));
      flame(ctx, px, liquidTop + 2, hgt, Math.max(4, g.w * 0.1),
        [255, 245, 200], i % 2 ? [120, 200, 255] : [255, 160, 50]);
    }
  }
  if (app.smoke > 0.05) {
    ctx.fillStyle = 'rgba(235,235,240,' + Math.min(0.5, app.smoke * 0.35) + ')';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(g.cx + (Math.sin(app.time * 1.4 + i * 2) * g.w * 0.28), h * 0.16 - i * 5, 6 + i * 3, 0, 6.283);
      ctx.fill();
    }
  }
  if (app.dryWarn) {
    ctx.strokeStyle = 'rgba(255,90,70,' + (0.35 + 0.25 * Math.sin(app.time * 6)) + ')';
    ctx.lineWidth = 2.4; ctx.stroke(g.path);
  }
  // 高温红热
  if (app.temp > 700) {
    const hot = Math.min(0.5, (app.temp - 700) / 900);
    ctx.save(); ctx.clip(g.path);
    ctx.fillStyle = 'rgba(255,110,40,' + hot + ')'; ctx.fillRect(g.x0 - 4, g.bot - h * 0.3, g.w + 8, h * 0.3);
    ctx.restore();
  }
}

/** 初始化容器的粒子容器字段 */
function initViewState(app) {
  app.bubbles = app.bubbles || []; app.ppts = app.ppts || []; app.steam = app.steam || [];
}

/* ============================ 器材（热源）绘制 ============================= */
/** 画一件热源器材。点着时火焰顶到画布上沿 —— 正好接住架在它上面的容器底部。 */
function flame(ctx, cx, baseY, hh, ww, inner, outer) {
  const grd = ctx.createRadialGradient(cx, baseY - hh * 0.35, 1, cx, baseY - hh * 0.3, Math.max(6, hh * 0.85));
  grd.addColorStop(0, 'rgba(' + inner.join(',') + ',0.96)');
  grd.addColorStop(0.45, 'rgba(' + outer.join(',') + ',0.85)');
  grd.addColorStop(1, 'rgba(' + outer.join(',') + ',0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(cx - ww / 2, baseY);
  ctx.quadraticCurveTo(cx - ww * 0.64, baseY - hh * 0.55, cx, baseY - hh);
  ctx.quadraticCurveTo(cx + ww * 0.64, baseY - hh * 0.55, cx + ww / 2, baseY);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,253,225,0.75)';
  ctx.beginPath();
  ctx.moveTo(cx - ww * 0.22, baseY);
  ctx.quadraticCurveTo(cx - ww * 0.30, baseY - hh * 0.42, cx, baseY - hh * 0.64);
  ctx.quadraticCurveTo(cx + ww * 0.30, baseY - hh * 0.42, cx + ww * 0.22, baseY);
  ctx.closePath(); ctx.fill();
}

function renderTool(canvas, tool, dt) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 104, h = canvas.clientHeight || TOOL_TOP;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, baseY = h - 5;
  const on = !!tool.on;
  tool.t = (tool.t || 0) + dt;
  const flick = 0.88 + 0.12 * Math.sin(tool.t * 9.3) + 0.06 * Math.sin(tool.t * 21.7);
  // 台面上的影子
  ctx.fillStyle = 'rgba(0,0,0,0.34)';
  ctx.beginPath(); ctx.ellipse(cx, baseY + 2, w * 0.36, 4.5, 0, 0, 6.283); ctx.fill();

  if (tool.hid === 'lamp') {
    const bh = h * 0.46, bw = w * 0.58, tw = w * 0.28;
    ctx.beginPath();                                     // 玻璃灯体
    ctx.moveTo(cx - bw / 2, baseY);
    ctx.lineTo(cx + bw / 2, baseY);
    ctx.lineTo(cx + tw / 2, baseY - bh);
    ctx.lineTo(cx - tw / 2, baseY - bh);
    ctx.closePath();
    const lg = ctx.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0);
    lg.addColorStop(0, 'rgba(190,225,245,0.32)'); lg.addColorStop(0.45, 'rgba(225,242,252,0.10)');
    lg.addColorStop(1, 'rgba(170,210,235,0.28)');
    ctx.fillStyle = lg; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = 'rgba(150,215,235,0.28)';            // 乙醇（约半瓶）
    ctx.fillRect(cx - bw / 2, baseY - bh * 0.52, bw, bh * 0.52);
    ctx.restore();
    ctx.strokeStyle = 'rgba(200,232,248,0.62)'; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#8b939c';                           // 灯芯座
    ctx.fillRect(cx - tw / 2 - 2, baseY - bh - 7, tw + 4, 8);
    ctx.strokeStyle = '#cdbb9c'; ctx.lineWidth = 2.2;    // 灯芯
    ctx.beginPath(); ctx.moveTo(cx, baseY - bh - 6); ctx.lineTo(cx, baseY - bh - 13); ctx.stroke();
    if (on) flame(ctx, cx, baseY - bh - 11, h * 0.62 * flick, w * 0.24, [255, 235, 170], [255, 150, 40]);
  } else if (tool.hid === 'bunsen') {
    ctx.fillStyle = '#6f7883';                           // 底座
    ctx.beginPath(); ctx.ellipse(cx, baseY - 3, w * 0.34, 7, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#7d8791';
    ctx.fillRect(cx - w * 0.30, baseY - 5, w * 0.60, 6);
    const th = h * 0.44, tw2 = w * 0.17;
    const tg = ctx.createLinearGradient(cx - tw2, 0, cx + tw2, 0);
    tg.addColorStop(0, '#5c646d'); tg.addColorStop(0.35, '#9aa4ad'); tg.addColorStop(1, '#5c646d');
    ctx.fillStyle = tg; ctx.fillRect(cx - tw2 / 2, baseY - 5 - th, tw2, th);
    ctx.fillStyle = '#3a424a';                           // 进气孔
    for (let i = 0; i < 3; i++) ctx.fillRect(cx - tw2 / 2 - 1, baseY - 5 - th + 8 + i * 6, tw2 + 2, 2.4);
    if (on) {
      flame(ctx, cx, baseY - 5 - th + 1, h * 0.66 * flick, w * 0.20, [235, 246, 255], [90, 150, 255]);
      ctx.fillStyle = 'rgba(255,180,90,0.35)';
      ctx.beginPath(); ctx.arc(cx, baseY - 5 - th - 2, 3.6, 0, 6.283); ctx.fill();
    }
  } else if (tool.def.kind === 'heat') {                 // 电热板
    const pw = w * 0.78, ph = h * 0.17, py = baseY - ph - 6;
    ctx.fillStyle = '#2f3841';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - pw / 2, py, pw, ph, 3) : ctx.rect(cx - pw / 2, py, pw, ph); ctx.fill();
    ctx.fillStyle = on ? 'rgba(255,90,40,' + (0.55 + 0.25 * flick) + ')' : '#20272e';
    ctx.beginPath(); ctx.ellipse(cx, py + ph / 2, pw * 0.40, ph * 0.42, 0, 0, 6.283); ctx.fill();
    if (on) {
      ctx.strokeStyle = 'rgba(255,190,110,0.75)'; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(cx + i * pw * 0.13, py + 2); ctx.lineTo(cx + i * pw * 0.13, py + ph - 2); ctx.stroke(); }
    }
    ctx.fillStyle = '#4a555f';                           // 支柱 + 底座
    ctx.fillRect(cx - w * 0.06, py + ph, w * 0.12, baseY - py - ph - 4);
    ctx.fillRect(cx - w * 0.30, baseY - 4, w * 0.60, 5);
    ctx.fillStyle = on ? '#ff6a3d' : '#3b444d';          // 指示灯
    ctx.beginPath(); ctx.arc(cx + w * 0.26, baseY - 8, 2.6, 0, 6.283); ctx.fill();
  } else {                                               // 测量器材 + 辅助器材
    drawSmallTool(ctx, tool, w, h, cx, baseY, on, flick);
  }
}

/** 小件器材/量器的模型：铁架台是大件（上格铁圈 + 下格酒精灯），其余按实物画个能认出来的样子 */
function drawSmallTool(ctx, tool, w, h, cx, baseY, on, flick) {
  const STEEL_D = '#5a626c';
  const lbl = (x, y, t, c) => { ctx.font = '9px system-ui,-apple-system,sans-serif'; ctx.fillStyle = c || '#7d8894'; ctx.textAlign = 'center'; ctx.fillText(t, x, y); ctx.textAlign = 'start'; };
  const grad = (x0, x1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, STEEL_D); g.addColorStop(0.4, '#c3ccd6'); g.addColorStop(1, STEEL_D); return g; };
  const roundRect = (x, y, ww, hh, r) => {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, ww, hh, r);
    else { ctx.moveTo(x + r, y); ctx.lineTo(x + ww - r, y); ctx.quadraticCurveTo(x + ww, y, x + ww, y + r); ctx.lineTo(x + ww, y + hh - r); ctx.quadraticCurveTo(x + ww, y + hh, x + ww - r, y + hh); ctx.lineTo(x + r, y + hh); ctx.quadraticCurveTo(x, y + hh, x, y + hh - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); }
  };
  if (tool.hid === 'stand') {                            // 铁架台：上下两格
    const rodX = cx + w * 0.32, rodW = Math.max(4, w * 0.035);
    const ringY = h * 0.19, ringRx = w * 0.30, ringRy = Math.max(5, w * 0.085);
    const slotTop = h * 0.40, slotH = baseY - 6 - slotTop;
    const app = (Lab.apps.find((a) => a.standOn === tool.uid)) || null;
    const lamp = tool.lampUid ? (Lab.tools.find((x) => x.uid === tool.lampUid) || null) : null;
    ctx.fillStyle = 'rgba(0,0,0,0.34)';                  // 台面影子
    ctx.beginPath(); ctx.ellipse(cx, baseY + 2, w * 0.42, 4.5, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = STEEL_D;                             // 底座
    roundRect(cx - w * 0.44, baseY - 8, w * 0.88, 8, 2); ctx.fill();
    ctx.fillStyle = grad(rodX - rodW, rodX + rodW);      // 立杆 + 横臂
    ctx.fillRect(rodX - rodW / 2, h * 0.06, rodW, baseY - 8 - h * 0.06);
    ctx.fillRect(rodX - w * 0.22, ringY - 2.5, w * 0.22, 5);
    ctx.strokeStyle = grad(cx - ringRx, cx + ringRx); ctx.lineWidth = Math.max(3, w * 0.022);
    ctx.beginPath(); ctx.ellipse(cx - w * 0.04, ringY, ringRx, ringRy, 0, 0, 6.283); ctx.stroke();
    if (app) {                                           // 上格：容器画在铁圈里
      const vw = w * 0.50, vh = h * 0.40;
      const g = vesselGeom(app.def.shape, vw, vh);
      ctx.save(); ctx.translate(cx - w * 0.04 - vw / 2, ringY - vh * 0.80);
      if (app.gauze) { ctx.fillStyle = 'rgba(190,190,190,0.55)'; ctx.fillRect(0, vh * 0.80, vw, 3); }
      ctx.fillStyle = 'rgba(195,225,242,0.16)'; ctx.fill(g.path);
      const fill = Math.min(1, fillRatio(app));
      if (fill > 0.01) {
        const sc = solutionColor(app);
        ctx.save(); ctx.clip(g.path);
        ctx.fillStyle = rgba(sc.rgb, sc.alpha);
        const lh = (g.bot - g.top) * fill;
        ctx.fillRect(g.x0 - 2, g.bot - lh, g.w + 4, lh);
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(205,234,250,0.62)'; ctx.lineWidth = 1.2; ctx.stroke(g.path);
      if (app.broken) { ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(g.x0, g.top); ctx.lineTo(g.x1, g.bot); ctx.moveTo(g.x1, g.top); ctx.lineTo(g.x0, g.bot); ctx.stroke(); }
      ctx.restore();
      lbl(cx - w * 0.04, h * 0.055, '上格 · ' + app.def.name, '#9fd0ff');
    } else {
      ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(160,190,215,0.45)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(cx - w * 0.04, ringY - h * 0.06, w * 0.22, h * 0.055, 0, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
      lbl(cx - w * 0.04, h * 0.10, '上格 · 空（放容器）', '#7d8894');
    }
    ctx.setLineDash([4, 4]); ctx.strokeStyle = lamp ? 'rgba(255,180,90,0.5)' : 'rgba(160,190,215,0.35)'; ctx.lineWidth = 1;
    roundRect(cx - w * 0.34, slotTop, w * 0.64, slotH, 4); ctx.stroke(); ctx.setLineDash([]);
    if (lamp) {                                          // 下格：酒精灯（含火焰）
      const lx = cx - w * 0.04, bw = w * 0.26, bh = slotH * 0.62, tw = w * 0.12, ly = baseY - 8;
      ctx.beginPath(); ctx.moveTo(lx - bw / 2, ly); ctx.lineTo(lx + bw / 2, ly); ctx.lineTo(lx + tw / 2, ly - bh); ctx.lineTo(lx - tw / 2, ly - bh); ctx.closePath();
      ctx.fillStyle = 'rgba(200,232,248,0.20)'; ctx.fill();
      ctx.fillStyle = 'rgba(150,215,235,0.30)'; ctx.fillRect(lx - bw / 2, ly - bh * 0.5, bw, bh * 0.5);
      ctx.strokeStyle = 'rgba(200,232,248,0.62)'; ctx.lineWidth = 1.1; ctx.stroke();
      ctx.fillStyle = '#8b939c'; ctx.fillRect(lx - tw / 2 - 2, ly - bh - 5, tw + 4, 6);
      ctx.strokeStyle = '#cdbb9c'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(lx, ly - bh - 4); ctx.lineTo(lx, ly - bh - 9); ctx.stroke();
      if (lamp.on) flame(ctx, lx, ly - bh - 8, h * 0.30 * flick, w * 0.13, [255, 235, 170], [255, 150, 40]);
      lbl(lx, slotTop + 10, '下格 · ' + (lamp.on ? '已点燃' : '酒精灯'), lamp.on ? '#ffab4a' : '#9fd0ff');   // 灯在格子里：标签写在格子上沿，别压在底座上
    } else lbl(cx - w * 0.04, slotTop + slotH / 2 + 3, '下格 · 空', '#7d8894');
  } else if (tool.hid === 'gauze') {                     // 石棉网
    const gw = w * 0.70, gh = h * 0.30, gy = baseY - gh - 4;
    ctx.fillStyle = '#b8b2a6'; ctx.fillRect(cx - gw / 2, gy, gw, gh);
    ctx.strokeStyle = '#8d8578'; ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) { const x = cx - gw / 2 + (gw / 5) * i; ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + gh); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(cx - gw / 2, gy + gh / 2); ctx.lineTo(cx + gw / 2, gy + gh / 2); ctx.stroke();
    lbl(cx, baseY + 10, tool.app ? '垫在容器下' : '待垫', tool.app ? '#8fe08f' : '#7d8894');
  } else if (tool.hid === 'tripod') {                    // 三脚架
    const ty = baseY - h * 0.52;
    ctx.strokeStyle = grad(cx - w * 0.3, cx + w * 0.3); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx - w * 0.28, baseY - 3); ctx.lineTo(cx - w * 0.10, ty);
    ctx.moveTo(cx + w * 0.28, baseY - 3); ctx.lineTo(cx + w * 0.10, ty);
    ctx.moveTo(cx, baseY - 3); ctx.lineTo(cx, ty); ctx.stroke();
    ctx.fillStyle = STEEL_D; ctx.beginPath(); ctx.ellipse(cx, ty, w * 0.24, 5, 0, 0, 6.283); ctx.fill();
    lbl(cx, baseY + 10, '配石棉网用', '#7d8894');
  } else if (tool.hid === 'rod') {                       // 玻璃棒
    ctx.save(); ctx.translate(cx, baseY - h * 0.1); ctx.rotate(-0.42);
    ctx.fillStyle = 'rgba(205,234,250,0.42)'; ctx.fillRect(-w * 0.035, -h * 0.48, w * 0.07, h * 0.92);
    ctx.strokeStyle = 'rgba(225,245,255,0.7)'; ctx.lineWidth = 1; ctx.strokeRect(-w * 0.035, -h * 0.48, w * 0.07, h * 0.92);
    ctx.restore();
  } else if (tool.hid === 'dropper') {                   // 胶头滴管
    ctx.fillStyle = '#3b4450'; ctx.beginPath(); ctx.ellipse(cx, baseY - h * 0.78, w * 0.10, h * 0.13, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(205,234,250,0.35)'; ctx.fillRect(cx - w * 0.035, baseY - h * 0.66, w * 0.07, h * 0.52);
    ctx.strokeStyle = 'rgba(225,245,255,0.65)'; ctx.lineWidth = 1; ctx.strokeRect(cx - w * 0.035, baseY - h * 0.66, w * 0.07, h * 0.52);
    ctx.fillStyle = 'rgba(120,200,240,0.75)'; ctx.beginPath(); ctx.arc(cx, baseY - h * 0.10, 2.4, 0, 6.283); ctx.fill();
  } else if (tool.hid === 'thermo') {                    // 温度计
    ctx.fillStyle = 'rgba(205,234,250,0.30)'; ctx.fillRect(cx - w * 0.06, baseY - h * 0.82, w * 0.12, h * 0.72);
    ctx.strokeStyle = 'rgba(225,245,255,0.7)'; ctx.lineWidth = 1; ctx.strokeRect(cx - w * 0.06, baseY - h * 0.82, w * 0.12, h * 0.72);
    ctx.fillStyle = '#e0554a'; ctx.fillRect(cx - w * 0.02, baseY - h * 0.76, w * 0.04, h * 0.66);
    ctx.beginPath(); ctx.arc(cx, baseY - h * 0.08, w * 0.085, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#9fb3c4'; ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) { const y = baseY - h * 0.70 + i * h * 0.11; ctx.beginPath(); ctx.moveTo(cx + w * 0.06, y); ctx.lineTo(cx + w * 0.12, y); ctx.stroke(); }
    lbl(cx, baseY + 10, tool.app ? '插在容器里' : '插进容器才读数', tool.app ? '#8fe08f' : '#7d8894');
  } else if (tool.hid === 'cylinder') {                  // 量筒
    ctx.fillStyle = 'rgba(205,234,250,0.22)'; ctx.fillRect(cx - w * 0.15, baseY - h * 0.80, w * 0.30, h * 0.74);
    ctx.strokeStyle = 'rgba(225,245,255,0.7)'; ctx.lineWidth = 1.1; ctx.strokeRect(cx - w * 0.15, baseY - h * 0.80, w * 0.30, h * 0.74);
    ctx.fillStyle = '#6f7883'; ctx.fillRect(cx - w * 0.22, baseY - 6, w * 0.44, 6);
    ctx.strokeStyle = '#9fb3c4'; ctx.lineWidth = 1;
    for (let i = 0; i < 7; i++) { const y = baseY - h * 0.74 + i * h * 0.10; ctx.beginPath(); ctx.moveTo(cx - w * 0.15, y); ctx.lineTo(cx - w * 0.02, y); ctx.stroke(); }
    lbl(cx, baseY + 10, '看凹液面最低处', '#7d8894');
  } else if (tool.hid === 'phmeter') {                   // pH 计
    ctx.fillStyle = '#2f3841'; roundRect(cx - w * 0.12, baseY - h * 0.80, w * 0.24, h * 0.72, 3); ctx.fill();
    ctx.fillStyle = '#7fd6b0'; ctx.fillRect(cx - w * 0.09, baseY - h * 0.74, w * 0.18, h * 0.16);
    ctx.fillStyle = '#c8d4de'; ctx.fillRect(cx - w * 0.03, baseY - h * 0.10, w * 0.06, h * 0.10);
    lbl(cx, baseY + 10, tool.app ? '读数中' : '插进溶液', tool.app ? '#8fe08f' : '#7d8894');
  } else if (tool.hid === 'balance') {                   // 电子天平
    ctx.fillStyle = '#39424c'; roundRect(cx - w * 0.38, baseY - h * 0.30, w * 0.76, h * 0.28, 3); ctx.fill();
    ctx.fillStyle = '#7fd6b0'; ctx.fillRect(cx + w * 0.04, baseY - h * 0.24, w * 0.28, h * 0.14);
    ctx.fillStyle = STEEL_D; ctx.beginPath(); ctx.ellipse(cx - w * 0.14, baseY - h * 0.32, w * 0.22, h * 0.05, 0, 0, 6.283); ctx.fill();
    lbl(cx, baseY - h * 0.44, '称台面上容器的质量', '#7d8894');
  } else {                                               // 兜底
    ctx.fillStyle = 'rgba(160,180,200,0.35)'; ctx.fillRect(cx - w * 0.3, baseY - h * 0.4, w * 0.6, h * 0.38);
  }
}

/* --------- 第九轮：实验台整屏特效层（白光 / 爆炸冲击波要漫出容器小画布） ---------
 * #fx 贴在 #bench 上的一层透明画布，pointer-events:none；每帧把全台容器特效取最大值画一次。
 * 原来白光只画在容器那张 ~110×150 的小画布里 —— 镁条烧起来也就亮一小块，谈不上"剧烈"。 */
function fxEnsure() {
  const bench = document.getElementById('bench');
  if (!bench) return null;
  let cv = document.getElementById('fx');
  if (!cv) { cv = document.createElement('canvas'); cv.id = 'fx'; bench.appendChild(cv); }
  const r = bench.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(1, Math.round(r.width)), H = Math.max(1, Math.round(r.height));
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  return { cv: cv, ctx: cv.getContext('2d'), W: W, H: H, dpr: dpr, bench: bench };
}

function renderFx() {
  const f = fxEnsure(); if (!f) return;
  const ctx = f.ctx, dpr = f.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, f.cv.width, f.cv.height);
  let glow = 0, boom = 0, spark = 0, hot = null;
  Lab.apps.forEach((app) => {
    if (!app.canvas) return;
    if ((app.glow || 0) > glow) { glow = app.glow; hot = app; }
    if ((app.boom || 0) > boom) { boom = app.boom; hot = app; }
    if ((app.spark || 0) > spark) spark = app.spark;
  });
  if (glow < 0.02 && boom < 0.02 && spark < 0.02) return;
  const br = f.bench.getBoundingClientRect();
  const pt = hot ? hot.canvas.getBoundingClientRect() : null;
  const cx = pt ? (pt.left - br.left + pt.width / 2) : f.W / 2;
  const cy = pt ? (pt.top - br.top + pt.height * 0.45) : f.H / 2;
  ctx.save();
  ctx.scale(dpr, dpr);
  if (glow > 0.02) {                                  // 耀眼白光：漫过整张台面
    const k = Math.min(1, glow);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const R = Math.max(f.W, f.H) * 0.62;
    const gg = ctx.createRadialGradient(cx, cy, 1, cx, cy, R);
    gg.addColorStop(0, 'rgba(255,255,255,' + Math.min(0.95, 0.9 * k) + ')');
    gg.addColorStop(0.18, 'rgba(255,251,214,' + (0.55 * k) + ')');
    gg.addColorStop(0.5, 'rgba(255,228,150,' + (0.2 * k) + ')');
    gg.addColorStop(1, 'rgba(255,215,130,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, f.W, f.H);
    ctx.restore();
  }
  if (spark > 0.25) {                                 // 火星四射：台面上也洒一层暖光（否则只看得到小画布里的几颗）
    const k = Math.min(1, spark);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const R2 = Math.max(f.W, f.H) * 0.3;
    const gs = ctx.createRadialGradient(cx, cy, 1, cx, cy, R2);
    gs.addColorStop(0, 'rgba(255,214,150,' + (0.3 * k) + ')');
    gs.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = gs; ctx.fillRect(0, 0, f.W, f.H);
    ctx.restore();
  }
  if (boom > 0.02) {                                  // 爆炸：整屏闪一下 + 一圈冲击波
    const k = Math.min(1, boom);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,240,205,' + (0.42 * k) + ')';
    ctx.fillRect(0, 0, f.W, f.H);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,196,120,' + (0.75 * k) + ')';
    ctx.lineWidth = 3 + 6 * k;
    ctx.beginPath(); ctx.arc(cx, cy, 30 + 150 * (1 - k), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

/* ------------------------------- 取用量弹窗 ------------------------------- */
function askAmount(formula, def, cb, unit) {
  const s = subOf(formula);
  const g = guideAmountFor(formula, def, unit);     // 手把手：这一步正好要加它 → 用量按步骤填好（默认 50 mL 过不了要 80 mL 的步骤）
  def = g.v; unit = g.u;
  const isLiq = unit === 'mL' || s.st === 'l' || s.st === 'aq' || formula === 'H2O';
  const m = $('#modal');
  m.innerHTML = '<div class="card"><h4>' + s.name + '（' + formula + '）</h4>'
    + '<div class="subfull">' + subFull(s.formula) + (s.note ? '<br>' + s.note : '') + '</div>'
    + (g.used ? '<div class="ghint">🎓 这一步需要 ' + def + ' ' + (isLiq ? 'mL' : 'g') + ' —— 已按步骤填好，直接点「加入」</div>' : '')
    + '<div class="kv"><span>摩尔质量</span><b>' + s.M + ' g/mol</b></div>'
    + '<div class="kv"><span>溶解度</span><b>' + solText(s) + '</b></div>'
    + (s.dHf ? '<div class="kv"><span>ΔfH°</span><b>' + s.dHf.v + ' kJ/mol' + (s.dHf.est ? '（估算）' : '') + '</b></div>' : '')
    + '<label>用量 <input id="amtVal" type="number" value="' + def + '" min="0.01" step="0.5"></label>'
    + '<label>单位 <select id="amtUnit">'
    + '<option value="g">克 g</option><option value="mL">毫升 mL</option><option value="mol">摩尔 mol</option>'
    + '</select></label>'
    + '<div class="row"><button class="primary" id="amtOk">加入 ' + (selectedApp() ? selectedApp().def.name : '（未选容器）') + '</button>'
    + '<button id="amtCancel">取消</button></div></div>';
  m.classList.add('show');
  $('#amtUnit').value = isLiq ? 'mL' : 'g';
  $('#amtOk').addEventListener('click', () => {
    const v = Number($('#amtVal').value), u = $('#amtUnit').value;

const solText = (s) => s.solubility === -1 ? '不溶' : s.solubility === -2 ? '微溶' : s.solubility === Infinity ? '互溶' : s.solubility == null ? '—' : s.solubility + ' g/100g 水';

/* ------------------------------- 工作台 --------------------------------- */
let benchSig = '';
let taskSig = '';
function benchSignature() {
  return Lab.apps.map((a) => a.uid + ':' + a.def.id + '@' + Math.round(a.x) + ',' + Math.round(a.y || 0) + '/' + (a.standOn || '-')
    + (Lab.selected === a.uid ? '*' : '') + (a.broken ? 'B' : '') + (a.acidConc === 'conc' ? 'C' : '')).join('|')
    + '#' + Lab.tools.map((t) => t.uid + ':' + t.hid + '@' + Math.round(t.x) + '/' + Math.round(t.y || 0) + (t.on ? '!' : '')
      + (t.lampUid ? '^' + t.lampUid : '') + (t.app ? '>' + t.app : '')).join('|');
}
const benchEl = () => document.getElementById('bench');
const itemPos = (x, w) => Math.max(2, x);            // 台面够长：不压缩位置，超出就横向滚动

function renderBench(force) {
  const sig = benchSignature();
  if (!force && sig === benchSig) return;
  benchSig = sig;
  const bench = benchEl(); bench.innerHTML = '';
  if (!Lab.apps.length && !Lab.tools.length) {
    bench.appendChild(mk('div', 'empty', '这是一大片空地 —— 上面点「放一个」把容器和酒精灯摆上台面'));
    return;
  }
  assignZ();
  Lab.tools.forEach((t) => { if (!t.lampStand) bench.appendChild(mkToolCard(t)); });   // 器材在下层，容器在上层（下格里的酒精灯画在铁架台模型里）
  Lab.apps.forEach((app) => { bench.appendChild(mkAppCard(app)); });
  layoutRig();                                                     // 架上去的容器：按器材"真实"高度抬升 + 不让它被顶出台面
  if (Lab.scrollEnd) { Lab.scrollEnd = false; ensureVisible(); }   // 只有"刚摆上来"才滚到新卡片，别跟引导抢滚动
  updateHeatStatus();
}

/** 架上去的容器该抬多高 —— 量器材卡片的**实际**高度（写死常数会算错，卡片会压住器材的火焰和标题）。
 *  两条约束：
 *    ① 抬升量不许把容器的顶推出台面（矮窗口里宁可视觉上重叠一点，也不能看不见、点不到）
 *    ② 抬升量要留着器材自己的按钮行露在下面（否则「点燃 / 架上来 / 收走」被容器盖住） */
function layoutRig() {
  const bench = benchEl(); if (!bench) return;
  const bh = bench.clientHeight || 0;
  Lab.apps.forEach((app) => {
    const card = bench.querySelector('.appcard[data-uid="' + app.uid + '"]'); if (!card) return;
    const t = standOf(app);
    if (!t || t.hid === 'stand') { card.style.bottom = (app.y || 0) + 'px'; return; }   // 上格里的容器：模型画在铁架台里，卡片留在台面上不抬升
    const tc = bench.querySelector('.toolcard[data-uid="' + t.uid + '"]');
    const th = (tc && tc.offsetHeight) || TOOL_TOP;
    const ah = card.offsetHeight || 0;
    const want = th - 4;
    let lift = want;
    if (bh && ah) lift = Math.max(0, Math.min(lift, bh - ah - 6));      // ① 顶不出台面
    card.style.bottom = (lift + (app.y || 0)) + 'px';
    card.classList.toggle('rigtight', lift < want - 2);                 // 保底压缩了 → 标一下，样式上给个暗示
  });
}

/** 台面比窗口宽时，把最右边（刚摆的）那张卡片滚进视野 */
function ensureVisible() {
  const bench = benchEl(); if (!bench) return;
  let right = 0;
  Lab.tools.concat(Lab.apps).forEach((it) => { right = Math.max(right, it.x + (it.kind === 'heat' ? toolW(it) : ITEM_W.app)); });
  if (right > bench.scrollLeft + bench.clientWidth - 8) bench.scrollLeft = right - bench.clientWidth + 16;
}

/** 台面层级：按"摆放先后"排成 10..21（永远压在弹窗 50 / 引导 55 / 教程 60 之下） */
function assignZ() {
  Lab.tools.concat(Lab.apps).sort((a, b) => (a.z || 0) - (b.z || 0)).forEach((it, i) => { it._zi = 10 + i; });
}

/** 容器卡片：底边 = 台面；架在器材上时抬高到器材顶 */

  card.querySelectorAll('.ops button').forEach((b) => b.addEventListener('click', (ev) => { ev.stopPropagation(); opClick(app, b.dataset.op); }));
  attachDrag(card, app, 'app');

  return card;

/** 器材卡片：一件实物（酒精灯/本生灯/电热板），自己有点燃开关 */
function mkToolCard(t) {
  const card = mk('div', 'toolcard' + (t.on ? ' lit' : '') + (t.def.big ? ' big' : ''));
  card.dataset.uid = t.uid; card.dataset.hid = t.hid;

  const ops = isHeat
