/* ============================================================================
 * 11-observe.js —— 俯视观察窗（从上往看容器里面）
 *
 *   侧视图能看清"有没有气泡往上冒"，但**颜色变化、沉淀、结晶、浑浊**这些
 *   侧着看几乎看不出来 —— 真实实验里学生是低头往烧杯里看的。
 *   这里就补上这一眼：每个容器一个圆（俯视），放大显示液面颜色、沉淀颗粒、
 *   结晶闪光、气泡，配一句"肉眼能写进实验报告"的现象描述（不给数字 ——
 *   要数字得拿量器去测）。
 * ==========================================================================*/

const OBS_C = { bg: '#0c161d', glass: '#8fb6c9', label: '#b9d7e6' };

/** 用肉眼能说的话描述容器里现在什么样（不是数值！） */
function observe(app) {
  if (app.broken) return { txt: '器皿已破裂，内容物洒了', tag: 'bad' };
  const bits = [];
  const solids = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
  const fine = app.contents.some((c) => c.dissolved && subOf(c.formula) && subOf(c.formula).st === 's');
  const murky = solids.length > 0 || app.pptMade > 1e-6 || fine;
  const col = solutionColor(app);
  const [r, g, b] = col.rgb;
  const base = [200, 228, 245];                                   // 纯水在这个配色下的样子
  const dbase = Math.abs(r - base[0]) + Math.abs(g - base[1]) + Math.abs(b - base[2]);
  const tinted = !!indicatorTint(app);
  if (waterMol(app) > 1e-9) {
    if (tinted) bits.push('指示剂已经显色');
    else if (dbase > 26) {
      const name = (r > g && g > b) ? (b > 150 ? '黄色' : '橙棕色') : (b > r && b > g ? '蓝色' : (g > r && g > b ? '绿色' : '有色'));
      bits.push(name + '溶液');
    } else bits.push(murky ? '液体本身无色' : '无色澄清的液体');
  }
  if (app.pptRate > 2) bits.push('白色沉淀正在生成');
  else if (murky) bits.push('浑浊，有沉淀（' + (solids.length ? subName(solids[0].formula) : '细小颗粒') + '）');
  if (app.bubbleRate > 12) bits.push('剧烈冒气泡');
  else if (app.bubbleRate > 1.5) bits.push('不断冒出气泡');
  if (app.flame > 0.25) bits.push('有火焰');
  if (app.smoke > 0.25) bits.push('冒白烟');
  if (app.steamAccum > 0.02) bits.push('水汽蒸腾');
  if (app.iceMol > 1e-6) bits.push('结冰了');
  if (app.temp > 372 && waterMol(app) > 1e-6) bits.push('液体在沸腾');
  else if (app.heater && app.heater.on) bits.push(app.heater.viaStand ? '在铁架台上受热' : '正在受热');
  if (!bits.length) bits.push(waterMol(app) > 1e-9 ? '无明显变化（澄清液体）' : '空的');
  return { txt: bits.join('；') };
}

function drawObserve(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 340, h = cv.clientHeight || 150;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#eef4f7';                     // 白台面：俯视看的就是它，浅色差异一眼能辨
  if (g.roundRect) { g.beginPath(); g.roundRect(0, 0, w, h, 10); g.fill(); } else g.fillRect(0, 0, w, h);
  const apps = Lab.apps;
  if (!apps.length) {
    g.fillStyle = '#7b8fa0'; g.font = '12px system-ui';
    g.fillText('工作台上还没有容器', 12, h / 2);
    return;
  }
  const n = apps.length;
  const perRow = n <= 3 ? n : Math.ceil(n / 2);
  const rows = Math.ceil(n / perRow);
  const cellW = w / perRow, cellH = h / rows;
  const base = Math.min(cellW, cellH) * 0.42;
  apps.forEach((app, i) => {
    const cx = (i % perRow) * cellW + cellW / 2;
    const cy = Math.floor(i / perRow) * cellH + cellH * 0.46;
    const sel = app.uid === Lab.selected;
    const R = base * (sel ? 1.16 : 1);
    // 液体填充比例（俯视：水越多圆越大，最多到器皿内径）
    const cap = app.def.cap;
    const fill = Math.min(1, Math.max(0, (waterVolume(app) * 1000 + app.contents.filter((c) => !c.dissolved && c.phase !== 'g').reduce((a, c) => a + c.mol * 20, 0)) / cap));
    const { rgb, alpha } = solutionColor(app);
    // 玻璃外圈
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,.8)'; g.fill();
    g.lineWidth = sel ? 2.6 : 1.5;
    g.strokeStyle = sel ? '#0f9b8e' : '#9fb6c2'; g.stroke();
    // 液面
    const rl = R * 0.86 * (fill > 0.02 ? Math.sqrt(Math.min(1, fill)) : 0);
    if (rl > 1.5) {
      g.beginPath(); g.arc(cx, cy, rl, 0, Math.PI * 2);
      g.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + Math.max(0.78, alpha) + ')'; g.fill();
    }
    // 沉淀（贴底，俯视看是撒在圆里的小颗粒）
    const solids = app.contents.filter((c) => !c.dissolved && c.phase !== 'g' && c.formula !== 'H2O');
    const ppts = app.pptMade > 1e-6 || app.pptRate > 0.5;
    if (solids.length || ppts) {
      const dots = Math.min(22, 6 + Math.round((solids.reduce((a, c) => a + c.mol, 0) + app.pptMade) * 140));
      const pcol = (solids.length && (subOf(solids[0].formula) || {}).color) || '#e8eef2';
      g.globalAlpha = 0.9; g.fillStyle = pcol;
      const pale = /^#(f|e|d)/i.test(pcol);        // 白色沉淀在白台面上要有轮廓才看得见
      g.strokeStyle = 'rgba(120,150,170,.75)'; g.lineWidth = 0.8;
      for (let k = 0; k < dots; k++) {
        const a = (k * 2.399) % (Math.PI * 2), rr = rl * 0.92 * Math.sqrt((k + 0.5) / dots);
        g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.9, 0, Math.PI * 2); g.fill();
        if (pale) g.stroke();
      }
      g.globalAlpha = 0.32; g.strokeStyle = pcol; g.lineWidth = 3;   // 沉降在底上的一圈
      g.beginPath(); g.arc(cx, cy, rl * 0.9, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 1;
    }
    // 结晶闪光
    if (app.contents.some((c) => c.formula === 'H2O' && c.phase === 's') === false && app.iceMol > 1e-6) {
      g.strokeStyle = 'rgba(220,245,255,.75)'; g.lineWidth = 1;
      for (let k = 0; k < 6; k++) {
        const a = k * 1.05, rr = rl * (0.3 + 0.6 * ((k % 3) / 3));
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        g.beginPath(); g.moveTo(x - 3, y); g.lineTo(x + 3, y); g.moveTo(x, y - 3); g.lineTo(x, y + 3); g.stroke();
      }
    }
    // 气泡：俯视看是液面上不断冒出的白点
    const bub = Math.min(26, Math.round(app.bubbleRate * 0.5));
    for (let k = 0; k < bub; k++) {
      const a = (k * 1.7 + (Date.now() / 620) % 6.28), rr = rl * (0.25 + 0.7 * ((k % 5) / 5));
      g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 2.1, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
      g.strokeStyle = 'rgba(120,150,170,.5)'; g.lineWidth = 0.7; g.stroke();
    }
    // 受热：外圈暖光
    const st = app.standOn ? toolByUid(app.standOn) : null;
    if (st && st.on && !app.broken) {
      g.beginPath(); g.arc(cx, cy, R + 3, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(255,180,84,.55)'; g.lineWidth = 2.4; g.stroke();
    }
    // 标签
    g.fillStyle = sel ? '#0b6b60' : '#3f5568'; g.font = (sel ? '600 ' : '') + '11px system-ui';
    const nm = app.uid + ' ' + app.def.name;
    g.fillText(nm, cx - g.measureText(nm).width / 2, cy + R + 13);
  });
}

function obsRender() {
  const info = document.querySelector('#obslist');
  if (info) {

function obsInit() {

/* ================= 12-synth.js ================= */
/* ============================================================================
 * 12-synth.js —— 化合物合成教学（人教版九上/九下「物质的制备」配套）
 *
 * 诚实规矩：这里**不写死化学方程式**。每条路线只声明「目标物质 + 需要哪些原料」，
 * 方程、反应类型、条件、现象都从真实的反应库 RXNS 里查出来（synthResolve）。
 * 查不到的路线直接标成"反应库里没有"并在控制台报出来（套件会 fail），绝不编造。
 * ========================================================================== */

/** 合成路线：f = 目标物质，lhs = 原料（顺序无所谓，按集合匹配反应库） */
const SYNTH_RAW = [
  /* ---- 单质气体：实验室制法 ---- */
  { f: 'O2', lhs: ['KMnO4'], grp: '单质气体', use: ['试管', '酒精灯'], note: '九上第二单元：加热高锰酸钾制氧气（管口略向下倾斜，防冷凝水倒流）' },
  { f: 'O2', lhs: ['H2O2'], cat: 'MnO2', grp: '单质气体', use: ['锥形瓶', '胶头滴管'], note: '九上第二单元：过氧化氢分解（MnO₂ 作催化剂）—— 催化剂只改速率，不改产量' },
  { f: 'H2', lhs: ['Zn', 'H2SO4'], grp: '单质气体', use: ['试管/锥形瓶'], note: '九上第四单元：锌与稀硫酸（氢前金属 + 稀酸）' },
  { f: 'CO2', lhs: ['CaCO3', 'HCl'], grp: '单质气体', use: ['锥形瓶', '集气瓶'], note: '九上第六单元：大理石与稀盐酸，向上排空气法收集' },
  { f: 'O2', lhs: ['H2O'], grp: '单质气体', use: ['水电解器/通电'], note: '九上第四单元：电解水，正氧负氢、体积比 1:2' },

  /* ---- 氧化物 ---- */
  { f: 'H2O', lhs: ['H2', 'O2'], grp: '氧化物', use: ['点燃'], note: '九上第四单元：氢气燃烧生成水（淡蓝色火焰，干冷烧杯内壁出现水雾）' },
  { f: 'CuO', lhs: ['Cu', 'O2'], grp: '氧化物', use: ['坩埚/试管', '酒精灯'], note: '九上第二单元：铜在空气中灼烧，紫红变黑' },
  { f: 'MgO', lhs: ['Mg', 'O2'], grp: '氧化物', use: ['点燃'], note: '九上第二单元：镁条燃烧，耀眼白光（也是"白光"特效的来源）' },
  { f: 'Fe3O4', lhs: ['Fe', 'O2'], grp: '氧化物', use: ['点燃'], note: '九上第二单元：铁丝在氧气中燃烧，火星四射、生成黑色固体（瓶底要留水）' },
  { f: 'SO2', lhs: ['S', 'O2'], grp: '氧化物', use: ['点燃'], note: '九上第二单元：硫在氧气中燃烧，蓝紫色火焰、有刺激性气味' },
  { f: 'CaO', lhs: ['CaCO3'], grp: '氧化物', use: ['坩埚', '酒精喷灯（≥900 °C）'], note: '九下：高温煅烧石灰石制生石灰，需要喷灯级的高温' },

  /* ---- 碱 ---- */
  { f: 'Ca(OH)2', lhs: ['CaO', 'H2O'], grp: '碱', use: ['烧杯', '玻璃棒'], note: '九下：生石灰与水反应放热（"熟化"），配石灰水' },
  { f: 'NaOH', lhs: ['Ca(OH)2', 'Na2CO3'], grp: '碱', use: ['烧杯', '玻璃棒', '过滤'], note: '九下：苛化法制烧碱（工业上用碳酸钠 + 石灰水，滤掉碳酸钙）' },
  { f: 'Cu(OH)2', lhs: ['CuSO4', 'NaOH'], grp: '碱', use: ['试管', '胶头滴管'], note: '九下：可溶性铜盐 + 碱 → 蓝色絮状沉淀' },
  { f: 'Fe(OH)3', lhs: ['FeCl3', 'NaOH'], grp: '碱', use: ['试管', '胶头滴管'], note: '九下：铁盐 + 碱 → 红褐色沉淀' },

  /* ---- 盐 ---- */
  { f: 'NaCl', lhs: ['HCl', 'NaOH'], grp: '盐', use: ['烧杯', 'pH 计', '蒸发皿'], note: '九下：中和反应后蒸发结晶得食盐（pH 计判定恰好中和）' },
  { f: 'CuSO4', lhs: ['CuO', 'H2SO4'], grp: '盐', use: ['烧杯', '玻璃棒', '酒精灯'], note: '九下：黑色氧化铜溶于稀硫酸，溶液变蓝' },
  { f: 'FeCl3', lhs: ['Fe2O3', 'HCl'], grp: '盐', use: ['烧杯', '玻璃棒'], note: '九下：除铁锈的原理（Fe₂O₃ + 盐酸）' },
  { f: 'FeSO4', lhs: ['Fe', 'H2SO4'], grp: '盐', use: ['试管'], note: '九下：铁与稀硫酸（置换反应，溶液变浅绿）' },
  { f: 'ZnSO4', lhs: ['Zn', 'CuSO4'], grp: '盐', use: ['试管'], note: '九下：金属活动性 —— 锌能把铜从它的盐溶液里换出来' },
  { f: 'CaCO3', lhs: ['CO2', 'Ca(OH)2'], grp: '盐', use: ['试管', '导气'], note: '九上第六单元：检验二氧化碳（石灰水变浑浊）' },
  { f: 'Na2CO3', lhs: ['CO2', 'NaOH'], grp: '盐', use: ['烧杯', '导气'], note: '九下：吸收二氧化碳制纯碱（也是"NaOH 变质"的原因）' },
  { f: 'NaHCO3', lhs: ['Na2CO3', 'CO2', 'H2O'], grp: '盐', use: ['烧杯', '导气'], note: '九下：碳酸钠溶液继续吸二氧化碳生成小苏打' },
  { f: 'KNO3', lhs: ['HNO3', 'KOH'], grp: '盐', use: ['烧杯', '蒸发皿'], note: '九下：中和反应制硝酸钾（复合肥）' },
  { f: 'Na2SO4', lhs: ['H2SO4', 'NaOH'], grp: '盐', use: ['烧杯', 'pH 计'], note: '九下：硫酸与氢氧化钠中和，产物是硫酸钠' },
  { f: 'AgCl', lhs: ['AgNO3', 'NaCl'], grp: '盐', use: ['试管', '胶头滴管'], note: '九下：检验氯离子（白色沉淀，不溶于稀硝酸）' },
  { f: 'BaSO4', lhs: ['BaCl2', 'Na2SO4'], grp: '盐', use: ['试管', '胶头滴管'], note: '九下：检验硫酸根离子（白色沉淀）' },
];

const SYNTH_GRPS = ['单质气体', '氧化物', '碱', '盐'];

/** 把一条路线接到真实反应库上：方程/条件/类型/现象全部来自 RXNS */
function synthResolve(route) {
  const want = route.lhs.slice().sort().join(',');
  const rx = (typeof RXNS !== 'undefined' ? RXNS : []).find((r) => r.rhs.indexOf(route.f) >= 0
    && r.lhs.slice().sort().join(',') === want);
  return { route: route, rx: rx || null };
}
const SYNTH = SYNTH_RAW.map(synthResolve);

/** 合成进度：Lab.madeEver 是"这辈子合成过什么"的真实台账（由反应引擎写入） */
const synthMade = (f) => !!(Lab.madeEver && Lab.madeEver.has(f));
function synthStats() {
  if (typeof routeStats === 'function') {
    const st = routeStats();
    return { routes: st.routes, targets: st.targets, done: st.made, bad: 0, doneList: [], st: st };
  }
  const targets = [...new Set(SYNTH.map((s) => s.route.f))];
  const done = targets.filter(synthMade);
  const bad = SYNTH.filter((s) => !s.rx).length;
  return { routes: SYNTH.length, targets: targets.length, done: done.length, bad: bad, doneList: done };
}
/** 反应引擎每生成一种物质都会喊这里一声 —— 首次拿到某个目标物就报喜 */
function synthOnMade(f) {
  const hit = SYNTH.find((s) => s.route.f === f);
  if (!hit || !hit.rx) return;
  const first = (Lab.madeLog || {})[f] !== true;
  Lab.madeLog = Lab.madeLog || {};
  if (!first) return;
  Lab.madeLog[f] = true;
  const st = synthStats();
  Lab.log.push({
    k: 'win', at: Lab.time,
    text: '🎉 合成成功：' + subName(f) + '（' + f + '）—— ' + hit.rx.eq + '　[' + hit.rx.kind + '反应，'
      + (hit.rx.condText || '常温') + ']　已合成 ' + st.done + ' / ' + st.targets + ' 种化合物',
  });
}

/* ------------------------------- 面板 ---------------------------------- */
/** 一条路线 = 目标 + 一串真实反应（多步链把每步都写出来） */
function synthRouteRow(r, i) {
  const done = synthMade(r.f);
  const last = r.rxs[r.rxs.length - 1];
  const chain = r.rxs.length > 1;
  const reTxt = (chain ? '从单质出发：' : '') + r.rxs[0].lhs.map((x) => subName(x) + ' ' + x).join(' + ');
  const eqTxt = chain ? r.rxs.map((rx, k) => '(' + (k + 1) + ') ' + rx.eq).join('　') : last.eq;
  const phen = r.rxs.map((rx) => (Array.isArray(rx.phen) ? rx.phen.join('；') : rx.phen)).join('；');
  const condTxt = r.rxs.map((rx) => rx.condText || '常温即可').join(' → ');
  const hay = (r.f + ' ' + subName(r.f) + ' ' + r.rxs.map((rx) => rx.lhs.join(' ')).join(' ')
    + ' ' + r.rxs.map((rx) => rx.lhs.map(subName).join(' ')).join(' ') + ' ' + eqTxt + ' ' + (r.note || '')
    + ' ' + r.use.join(' ') + ' ' + r.tier).toLowerCase();
  return '<div class="clesson syn' + (done ? ' done' : '') + '" data-key="' + esc(hay) + '">'
    + '<span class="synchk">' + (done ? '✔ 已合成' : '◻ 未合成') + '</span>'
    + '<b>' + esc(subName(r.f)) + '</b> <code>' + esc(r.f) + '</code>'
    + '　<span class="synkind">' + esc(last.kind) + '反应</span>'
    + '　<span class="synkind syntier t' + esc(r.tier) + '">' + esc(r.tier) + (chain ? '（' + r.rxs.length + ' 步）' : '') + '</span>'
    + (r.curated ? '　<span class="synkind syntext">教材路线</span>' : '')
    + '<div class="syneq">' + esc(eqTxt) + '</div>'
    + '<div class="synrow"><i>原料：</i>' + esc(reTxt) + '</div>'
    + '<div class="synrow"><i>条件：</i>' + esc(condTxt)
    + '　<i>现象：</i>' + esc(phen) + '</div>'
    + '<div class="synrow"><i>器材：</i>' + esc(r.use.join('、')) + (chain ? '　<i>同一个器皿里连着做</i>' : '') + '</div>'
    + (r.note ? '<div class="synnote">' + esc(r.note) + '</div>' : '')
    + '<div class="synfoot">' + (r.noLesson
      ? '<span class="synbad">◻ 不做手把手：' + esc(r.noLesson) + '</span><i>路线数据是真的，只是模拟器里没法一步步走完</i>'
      : '<button class="synstart" data-cmp="' + i + '">▶ 手把手做这条</button>'
        + '<i>跟教材实验一样：一步一步高亮该点哪个控件，判定读真实状态</i>') + '</div></div>';
}

function synthHTML() {
  const q = (synthQ || '').trim().toLowerCase();
  const st = synthStats();
  const rt = (typeof ROUTES !== 'undefined' ? ROUTES : []);
  let out = '<div class="ctop"><b>⚗ 化合物合成教学</b>'
    + '<span class="calt">' + (rt.length || SYNTH.length) + ' 条路线 · 目标 ' + st.targets + ' 种 · 已合成 <b class="synok">' + st.done + '</b> 种</span>'
    + '<input id="synthSearch" placeholder="搜索目标 / 原料（如 铜、CO2、盐酸）" value="' + esc(synthQ || '') + '">'
    + '<button id="synthClose">✕ 关闭</button></div>'
    + '<div class="cbody"><div class="synthintro">怎么用：把路线里的原料加进同一个容器，凑齐条件（加热 / 点燃 / 通电 / 催化剂），反应真的发生了才算合成成功 —— '
    + '本页的方程、反应类型、条件、现象全部来自反应库，合成进度按容器里真实生成过的物质统计。</div>';
  if (!rt.length) return out + '</div>';
  if (st.st && st.st.noRoute && st.st.noRoute.length) {
    out += '<div class="synthintro">本作物质库里的 ' + st.st.cmpTotal + ' 种化合物：<b class="synok">'
      + st.st.targets + '</b> 种有合成路线（' + st.st.routes + ' 条，其中'
      + '简单 ' + st.st.byTier['简单'] + ' / 中等 ' + st.st.byTier['中等'] + ' / 难 ' + st.st.byTier['难'] + '），'
      + '另外 ' + (st.st.shelfOnly || []).length + ' 种是试剂架上直接拿的（不需要合成）。'
      + ((st.st.reallyNone || []).length ? '还剩 ' + st.st.reallyNone.length + ' 种（'
        + st.st.reallyNone.slice(0, 10).join('、') + '）在反应库里没有"生成它"的反应，先如实留空 —— 不编路线。' : '')
      + ' 难度不是标上去的：原料数、反应温度、要不要点燃/电解，都是从反应库真实条件算出来的。</div>';
  }
  ROUTE_TIERS.forEach((tier) => {
    const rows = rt.filter((r) => r.tier === tier);
    if (!rows.length) return;
    const shown = rows.filter((r) => !q || synthRouteHay(r).indexOf(q) >= 0);
    if (!shown.length) return;
    out += '<div class="cunit"><div class="cuname">' + tier + '　<span class="cnote">' + rows.length + ' 条'
      + (tier === '简单' ? '（原料直接取得到，常温或一步就成）' : tier === '中等' ? '（要加热 / 催化剂 / 三种原料）'
        : tier === '难' ? '（要高温 / 点燃 / 电解）' : '（两步以上的链条，或高温 + 多步）') + '</span></div>';
    shown.forEach((r) => { out += synthRouteRow(r, rt.indexOf(r)); });
    out += '</div>';
  });
  if (!out.length) out += '<div class="synthintro">没有匹配的路线</div>';
  return out + '</div>';
}

/** 一条路线参与搜索的文本（目标 / 原料 / 方程 / 难度 / 教材出处） */
function synthRouteHay(r) {
  return (r.f + ' ' + subName(r.f) + ' ' + r.rxs.map((rx) => rx.lhs.join(' ') + ' ' + rx.lhs.map(subName).join(' ')).join(' ')
    + ' ' + r.rxs.map((rx) => rx.eq).join(' ') + ' ' + (r.note || '') + ' ' + r.use.join(' ') + ' ' + r.tier).toLowerCase();
}
let synthQ = '';
function synthOpen(on) {
  const m = document.querySelector('#synthModal');
  if (!m) return;
  const show = on == null ? !m.classList.contains('show') : !!on;
  if (show) m.innerHTML = '<div class="cbox">' + synthHTML() + '</div>';
  m.classList.toggle('show', show);
  if (show) {
    const s = document.querySelector('#synthSearch');
    if (s) {
      s.addEventListener('input', () => { synthQ = s.value; m.innerHTML = '<div class="cbox">' + synthHTML() + '</div>'; const s2 = document.querySelector('#synthSearch'); if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); } });
      s.focus();
    }
    const c = document.querySelector('#synthClose');
    if (c) c.addEventListener('click', () => synthOpen(false));
  }
}

function synthInit() {
  const bad = SYNTH.filter((s) => !s.rx);
  if (bad.length) console.warn('合成路线在反应库里查不到（请修正）：' + bad.map((s) => s.route.lhs.join('+') + '→' + s.route.f).join('，'));
  const btn = document.querySelector('#synthBtn');
  if (btn) btn.addEventListener('click', () => synthOpen());
  if (!document.querySelector('#synthModal')) {
    const m = document.createElement('div');
    m.id = 'synthModal';
    m.addEventListener('click', (ev) => { if (ev.target === m) synthOpen(false); });
    document.body.appendChild(m);
  }
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') synthOpen(false); });
  const mm = document.querySelector('#synthModal');
  if (mm) mm.addEventListener('click', (ev) => {                 // 从合成面板直接开一条手把手课程
    const b = ev.target && ev.target.closest ? ev.target.closest('button[data-cmp]') : null;
    if (b && typeof cmpStart === 'function') cmpStart(Number(b.dataset.cmp));
  });
}
document.addEventListener('DOMContentLoaded', synthInit);

Object.assign(window.CHEM, {
  SYNTH, SYNTH_RAW, synthResolve, synthStats, synthMade, synthOpen,
  synthHTML: () => synthHTML(), synthOnMade,
});


/* ================= 12a-routes.js ================= */
/* ============================================================================
 * 12a-routes.js —— 全物质合成路线表（第十一轮）
 *
 * 用户要求：「只要这里面有的化合物，你全给我做上；别只做这几个简单的，做点难的。」
 *
 * 诚实规矩（沿用 12-synth.js 的底线）：**一条方程都不写死**。
 *   路线 = 目标物质 + 一串反应，全部从真实反应库 RXNS 里搜出来；
 *   难度 = 由这条路线**真实的**原料数 / 条件（反应温度、点燃、电解、催化剂、步数）算出来。
 *   搜不到的如实标出来，绝不编。
 *
 * 两类路线：
 *   ① 一步路线（简单/中等/难）：一条反应的原料全都直接取得到（试剂架 + 周期表上的单质）。
 *   ② 从单质出发的多步路线（难/地狱）：一步一步做上去 ——
 *      比如 CuSO₄：Cu 灼烧成 CuO，再用稀硫酸溶掉，2 步；同类还有 NaOH、FeCl₃、Na₂CO₃ …
 *      只收「同一个器皿能一次做下来」的链（点燃 / 电解 / ≥800 K 煅烧 会换器皿，串不起来，只给一步路线）。
 * ========================================================================== */

/** 能"直接取到"的东西：试剂架上的物质 + 周期表上的单质 */
const ROUTE_AVAIL = new Set();
const ROUTE_ELEM = new Set();
(function routeAvailInit() {
  if (typeof SUBSTANCES !== 'undefined') SUBSTANCES.forEach((s) => { if (!s.isElem) ROUTE_AVAIL.add(s.formula); });
  if (typeof ELEMENTS !== 'undefined') ELEMENTS.forEach((e) => { ROUTE_AVAIL.add(e.sym); ROUTE_ELEM.add(e.sym); });
  ROUTE_AVAIL.add('H2O'); ROUTE_ELEM.add('H2O');
})();

/** 产物 → 反应（同一个物质可能有好几条制法） */
const RX_BY_PRODUCT = {};
(function routeIndexInit() {
  if (typeof RXNS === 'undefined') return;
  RXNS.forEach((r) => r.rhs.forEach((f) => { (RX_BY_PRODUCT[f] = RX_BY_PRODUCT[f] || []).push(r); }));
})();

/** 目标清单：反应库里出现过的**所有**产物 + 手写路线的目标 */
const ROUTE_TARGETS = (function routeTargetsInit() {
  const set = new Set();
  if (typeof RXNS !== 'undefined') RXNS.forEach((r) => r.rhs.forEach((f) => set.add(f)));
  if (typeof SYNTH_RAW !== 'undefined') SYNTH_RAW.forEach((s) => set.add(s.f));
  return Array.from(set);
})();

/** 一步就能做：原料全都直接取得到（而且不能拿产物自己当原料） */
function routeDirect(r) {
  return r.lhs.every((x) => ROUTE_AVAIL.has(x)) && r.rhs.every((f) => r.lhs.indexOf(f) < 0);
}
/** 这一步能不能跟别的步骤挤在同一个器皿里串（点燃 / 电解 / 光照 / ≥800 K 煅烧 都要换器皿） */
function routeChainable(r) {
  const c = r.cond || {};
  if (c.ignite || c.elec || c.light) return false;
  if (c.temp && c.temp >= 800) return false;
  if (r.kind === '点燃' || r.kind === '电解') return false;
  return true;
}
/** 一步路线的排序分：原料越少、条件越温和越靠前 */
function routeScore1(r) {
  const c = r.cond || {};
  let s = r.lhs.length * 10;
  if (c.temp) s += c.temp >= 500 ? 6 : 3;
  if (c.ignite) s += 8;
  if (c.elec) s += 9;
  if (c.cat) s += 4;
  if (c.sol) s += 1;
  if (c.conc) s += 2;
  if (c.dil) s += 1;
  return s;
}
const routeBest = (arr, also) => arr.slice().sort((a, b) => routeScore1(a) - routeScore1(b))
  .filter((r) => !also || also(r))[0] || null;

/** 器皿推断：和 13-complexp.js 的 cmpBench 同一套规则，这里自带一份（本模块先加载，别依赖后面的东西） */
function routeBenchId(rx) {
  const c = (rx && rx.cond) || {};
  if (c.elec) return 'beaker';
  if (c.ignite) return 'gasjar';
  if (c.temp >= 800) return 'crucible';
  if (c.temp >= 400) return 'tube';
  if (rx && (rx.kind === '复分解' || rx.kind === '中和')) return 'tube';
  return 'flask';
}
const routeAppName = (k) => {
  const d = (typeof APPARATUS !== 'undefined' ? APPARATUS : []).find((a) => a.id === k);
  return d ? d.name : k;
};
function routeUseFor(rx) { return [routeAppName(routeBenchId(rx))]; }

/** 难度分档：只看真实条件（温度/点燃/电解/催化剂/原料数/步数） */
function routeTier(rxs) {
  const c = (rxs[rxs.length - 1] || {}).cond || {};
  const hard = !!(c.elec || c.ignite || (c.temp && c.temp >= 800)
    || rxs.some((r) => r.kind === '电解' || r.kind === '点燃'));
  const warm = rxs.some((r) => (r.cond || {}).temp || (r.cond || {}).cat);
  if (rxs.length >= 3) return hard ? '地狱' : '难';
  if (rxs.length === 2) return hard ? '地狱' : '难';
  if (hard) return '难';
  if (warm || rxs[0].lhs.length >= 3) return '中等';
  return '简单';
}

/** 多步路线的起点（普通试剂）：单质 + 水 + 空气成分 + **常温一步路线**里出现的原料 ——
 *  也就是实验室常备、直接买得到的那几种；像 CuO、CaO、SO2 这种要靠反应做出来的，不算起点。
 *  有了这条线，从单质一步步做上去和货架上端来端去才分得开。 */
const ROUTE_ROOT = new Set();
(function routeRootInit() {
  ROUTE_ELEM.forEach((x) => ROUTE_ROOT.add(x));
  ['H2O', 'O2', 'N2'].forEach((x) => ROUTE_ROOT.add(x));
  ROUTE_TARGETS.forEach((f2) => {
    (RX_BY_PRODUCT[f2] || []).filter(routeDirect).forEach((rx) => {
      if (routeTier([rx]) === '简单') rx.lhs.forEach((x) => { if (!ROUTE_ELEM.has(x)) ROUTE_ROOT.add(x); });
    });
  });
})();

/** 反向搜索：要 f，就得先有做 f 的原料；原料自己也得做得出来（或者货架上直接有）。
 *  起点 = 试剂架 + 周期表上的单质；链上至少有一个自己做出来的中间体才算多步路线。 */
function routeFromAvail(f, depth, seen) {
  if (ROUTE_ROOT.has(f)) return [];
  if (depth <= 0) return null;
  const cands = (RX_BY_PRODUCT[f] || []).filter(routeChainable)
    .filter((r) => seen.indexOf(r.id) < 0 && r.rhs.every((x) => r.lhs.indexOf(x) < 0))
    .sort((a, b) => routeScore1(a) - routeScore1(b));
  for (const rx of cands) {
    const parts = [];
    let ok = true;
    for (const x of rx.lhs) {
      const sub = routeFromAvail(x, depth - 1, seen.concat([rx.id]));
      if (!sub) { ok = false; break; }
      parts.push(sub);
    }
    if (!ok) continue;
    return [].concat.apply([], parts).concat([rx]);
  }
  return null;
}

/** 从单质起步的链：**第一步**的原料必须全是单质/水/空气成分（O₂、N₂、CO₂），
 *  后面几步允许用买得到的试剂当配菜（比如 Cu 先灼烧成 CuO，再用稀硫酸溶掉 → CuSO₄）。
 *  这样才是从单质出发一步步做上去的难路线，而不是把货架上的东西端来端去。 */
function routeFromElementsStep(f, depth, seen) {
  if (depth <= 0) return null;
  const cands = (RX_BY_PRODUCT[f] || []).filter(routeChainable)
    .filter((r) => seen.indexOf(r.id) < 0 && r.rhs.every((x) => r.lhs.indexOf(x) < 0))
    .sort((a, b) => routeScore1(a) - routeScore1(b));
  for (const rx of cands) {
    if (!rx.lhs.every((x) => ROUTE_ROOT.has(x))) continue;      // 第一步：原料全是单质/水/空气
    return [rx];
  }
  return null;
}
function routeElementChain(f, depth, seen) {
  if (depth <= 0) return null;
  const cands = (RX_BY_PRODUCT[f] || []).filter(routeChainable)
    .filter((r) => seen.indexOf(r.id) < 0 && r.rhs.every((x) => r.lhs.indexOf(x) < 0))
    .sort((a, b) => routeScore1(a) - routeScore1(b));
  for (const rx of cands) {
    const missing = rx.lhs.filter((x) => !ROUTE_ROOT.has(x));   // 需要自己做出来的原料（普通试剂除外）
    if (!missing.length || missing.length > 1) continue;
    const first = routeFromElementsStep(missing[0], depth - 1, seen.concat([rx.id]));
    if (first) return first.concat([rx]);
    const deeper = routeElementChain(missing[0], depth - 1, seen.concat([rx.id]));
    if (deeper) return deeper.concat([rx]);
  }
  return null;
}

/* ---- 手写路线（教材 / 工业经典）：优先用它们，带着教材出处与实验注意 ---- */
const CURATED = {};
(function routeCuratedInit() {
  if (typeof SYNTH === 'undefined') return;
  SYNTH.forEach((s) => {
    if (!s.rx) return;
    const k = s.route.f + '|' + s.rx.lhs.slice().sort().join(',');
    if (!CURATED[k]) CURATED[k] = s;
  });
})();

/** 模拟器没法手把手走一遍的路线（**实测**出来的，不是猜的：探针逐条走，走不通才写进来）：
 *  键 = 目标物质，值 = 老实写的原因。这些路线照样在面板里（方程/条件/器材全是反应库真数据），
 *  只是不做手把手演示，不装作"能演示"。 */
const ROUTE_NO_LESSON = {
  'Al': '熔融 Al₂O₃ 电解要 1233 K，本作没有熔盐电解',
  'Cu': 'CuCl₂ 电解要电极与离子迁移，本作的通电反应做不完整（通电后不启动）',
  'Cl2': '电解饱和食盐水要电极与离子迁移，本作的通电反应做不完整',
  'SO3': '2SO₂ + O₂ ⇌ 2SO₃ 要 723 K + V₂O₅，平衡转化率低，模拟器里短时间内出不来产物',
  'Fe3O4': '要在纯氧里点燃铁丝；集气瓶里的氧不够，反应启动不了',
  'Na2O2': '钠要先加热到着火点才燃；集气瓶里点不着（Mg、S 那种能直接点燃的照做）',
  /* 下面这些是探针逐条实测"走不完"的（每个实验都在 ×20/×60 加速下等过 25 s，产物一直没出来）：
     本作的动力学/平衡对这些反应就是慢 —— 与其让玩家干等，不如如实标出来 */
  'Br2': '氯气溶进水里会先和水反应（生成 HClO），主反应在本作动力学下演示时长内出不来溴',
  'Ca(ClO)2': '氯气要先溶进石灰水，副反应抢走氯气，演示时长内出不来产物',
  'I2': '氯水里的副反应抢走氯气，置换出碘的速度在本作里太慢',
  'NaClO': '氯气与氢氧化钠的反应要先把氯气溶进碱液，本作里这个过程太慢',
  'MnCl2': '浓盐酸与高锰酸钾要加热才放出氯气，本作里这条链在演示时长内走不完',
  'H2CO3': 'CO₂ + H₂O ⇌ H₂CO₃ 是可逆弱平衡，而且 CO₂ 会逸出，短时间内测不到碳酸',
  'Na2SO3': 'SO₂ 主要留在气相，溶进碱液的部分太少，短时间内测不到产物',
  'C2H6': '乙烯加氢要 423 K + Ni 催化，本作的催化加氢动力学太慢',
  'Hg': '氧化汞分解要 ≥773 K，模拟器的热源在演示时长内升不到位',
  'CaSiO3': '要 ≥1473 K 高温熔融，模拟器的热源到不了这个温度',
};
const routeNoLesson = (f) => ROUTE_NO_LESSON[f] || null;

function routeBuild(f) {
  const picks = [];
  const curatedRx = (function () {
    const k = Object.keys(CURATED).filter((x) => x.indexOf(f + '|') === 0);
    return k.length ? CURATED[k[0]].rx : null;         // 教材/工业路线优先：带着出处与实验注意
  })();
  const direct = (RX_BY_PRODUCT[f] || []).filter(routeDirect);
  const one = (curatedRx && direct.indexOf(curatedRx) >= 0) ? curatedRx : routeBest(direct);
  if (one) picks.push({ f: f, rxs: [one], kind: 'one' });
  /* 自动多步链先关掉（搜出来一半是"做出来又拆回去"的绕路，化学上没意义）；
     真正要多步 = 逐个手工核对后再加，宁可少也不能编。 */
  const ROUTE_AUTO_CHAIN = false;
  const chain = ROUTE_AUTO_CHAIN ? routeElementChain(f, 3, []) : null;
  if (chain && chain.length >= 2) {
    /* 同一个器皿能一次做下来才收（同种器材 / 或都是溶液-试管级） */
    const ids = chain.map(routeBenchId);
    if (ids.every((x) => x === ids[0])) picks.push({ f: f, rxs: chain, kind: 'chain' });
    else {                                            // 器皿不同 = 串不进一个容器，退而求其次：只保留前半段能同器的部分
      const cut = chain.slice(0, ids.findIndex((x, i) => x !== ids[0]));
      if (cut.length >= 2 && cut[cut.length - 1].rhs.indexOf(f) >= 0) picks.push({ f: f, rxs: cut, kind: 'chain' });
    }
  }
  return picks.map((p) => {
    const key = f + '|' + p.rxs[0].lhs.slice().sort().join(',');
    const cur = p.kind === 'one' ? CURATED[key] : null;
    const last = p.rxs[p.rxs.length - 1];
    return {
      f: f, rxs: p.rxs, kind: p.kind, tier: routeTier(p.rxs),
      use: cur ? cur.route.use.slice() : routeUseFor(last),
      note: cur ? cur.route.note : '',
      grp: cur ? cur.route.grp : (last.kind || '合成') + '法',
      curated: !!cur, eqs: p.rxs.map((r) => r.eq),
      noLesson: routeNoLesson(f) || null,          // 模拟器做不了的路线：面板据此不做手把手
    };
  });
}

const ROUTES = (function routesInit() {
  const list = [];
  ROUTE_TARGETS.forEach((f) => { routeBuild(f).forEach((r) => list.push(r)); });
  const order = { '简单': 0, '中等': 1, '难': 2, '地狱': 3 };
  list.sort((a, b) => (order[a.tier] - order[b.tier]) || (a.rxs.length - b.rxs.length) || a.f.localeCompare(b.f));
  return list;
})();

const ROUTE_TIERS = ['简单', '中等', '难', '地狱'];

function routeStats() {
  const targets = new Set(ROUTES.map((r) => r.f));
  const byTier = {};
  ROUTE_TIERS.forEach((t) => { byTier[t] = ROUTES.filter((r) => r.tier === t).length; });
  const cmpTotal = (typeof SUBSTANCES !== 'undefined' ? SUBSTANCES.filter((s) => !s.isElem).length : 0);
  const noRoute = [];
  if (typeof SUBSTANCES !== 'undefined') {
    SUBSTANCES.forEach((s) => {
      if (s.isElem) return;
      const has = ROUTES.some((r) => r.f === s.formula);
      if (!has) noRoute.push(s.formula);
    });
  }
  return {
    routes: ROUTES.length, targets: targets.size, cmpTotal: cmpTotal,
    chains: ROUTES.filter((r) => r.kind === 'chain').length,
    curated: ROUTES.filter((r) => r.curated).length,
    byTier: byTier, made: ROUTES.filter((r) => typeof synthMade === 'function' && synthMade(r.f)).length,
    noRoute: noRoute,
    shelfOnly: noRoute.filter((f) => ROUTE_AVAIL.has(f)),          // 货架上直接拿得到，本来就不需要合成
    reallyNone: noRoute.filter((f) => !ROUTE_AVAIL.has(f)),        // 既拿不到、也没反应能生成
  };
}

Object.assign(window.CHEM, { ROUTES, ROUTE_TIERS, routeStats, routeFromAvail, routeElementChain, ROUTE_ROOT, routeDirect, routeBuild, ROUTE_AVAIL, ROUTE_ELEM, RX_BY_PRODUCT });

/* ============================================================================
 * 13-complexp.js —— 每个化合物的专门教学（跟教材实验同一套手把手引擎）
 *
 * 用户在第九轮之后提的需求：「给每个化合物都做专门的教学，也是跟我们的实验一样手把手」。
 *
 * 做法（不写死步骤、不写死方程）：
 *   ① 从 12-synth.js 的路线表出发（目标物质 + 原料），方程/条件/现象从反应库 RXNS 查；
 *   ② 按**真实配平系数**算出每一步该加多少（固体按克、液体按毫升，够反应还有余量）；
 *   ③ 生成和教材实验完全同构的步骤：加料 → 满足条件（点燃/加热/通电/催化剂）→ 观察现象 → 记台账；
 *   ④ 判定读的都是工作台真实状态（容器里有没有这种物质、有没有气体逸出、有没有沉淀、台账记没记上），
 *      所以「点了就算」在这里同样不成立。
 * ==========================================================================*/

const CMP_CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四',
  '十五', '十六', '十七', '十八', '十九', '二十', '二十一', '二十二', '二十三', '二十四', '二十五', '二十六', '二十七', '二十八',
  '二十九', '三十', '三十一', '三十二', '三十三', '三十四', '三十五', '三十六', '三十七', '三十八', '三十九', '四十'];
const CMP_CN_LEN = CMP_CN.length;

/** 多步路线（从单质一步一步做上去）：同一个器皿里连着做，每步都要真的反应出来才算过 */
function cmpChainLesson(route, chain, idx) {
  const f = route.f;
  const fname = subName(f) + '（' + f + '）';
  const bench = cmpBench(route, chain.rxs[chain.rxs.length - 1]);      // 链上各步都过 routeChainable 筛，器皿是同一个
  const steps = [];
  const u0 = () => tutUid(0);
  chain.rxs.forEach((rx, k) => {
    const c = rx.cond || {};
    const doses = cmpDoses({ f: route.f, lhs: rx.lhs.slice() }, rx, bench);
    const heater = cmpHeater(route, rx, bench);
    const made = rx.rhs.filter((x) => rx.lhs.indexOf(x) < 0);
    const mid = k < chain.rxs.length - 1 ? (made[0] || rx.rhs[0]) : f;
    steps.push(mkStep('第 ' + (k + 1) + ' 步：' + doses.map((d) => d.v + ' ' + d.u + ' ' + subName(d.f)).join(' + ')
      + ' → ' + subName(mid),
      '这一步的方程：' + rx.eq + '（' + (rx.condText || '常温即可') + '）'
      + (k === 0 ? '　—— 从单质/原料开始，一步步做上去，别跳步' : '　—— 上一步做出来的东西还在这个器皿里，接着加料就行'),
      () => cmpMade(0, mid)() || synthMade(mid) || doses.every((d) => ((Lab.tut.added || {})[d.f] || 0) > 0),
      () => {
        if (c.sol && rx.lhs.indexOf('H2O') < 0 && waterMol(tutApp(0)) < 1e-3) addReagent(u0(), 'H2O', 10, 'mL');
        doses.forEach((d) => addReagent(u0(), d.f, d.v, d.u));
        if (c.cat) addReagent(u0(), c.cat, 0.5, 'g');
        if (c.ignite) ignite(u0());
        else if (c.temp) tutHeat(0, heater);
      }));
    if (c.temp) {
      steps.push(mkStep('第 ' + (k + 1) + ' 步加热：升到 ' + (c.temp) + ' K 以上（' + ((HEATERS.find((h) => h.id === heater) || {}).name || '酒精灯') + '）',
        '器皿直接架到热源上点着（这一串反应都在同一个器皿里做，别中途换容器）',
        () => !!(tutApp(0) && tutApp(0).heater && tutApp(0).heater.on), null));
    }
  });
  steps.push(mkStep('观察并归纳：' + fname + ' 合成出来了 —— ' + chain.rxs.map((r) => r.eq).join('　→　'),
    '整条链：' + chain.rxs.map((r, k) => '(' + (k + 1) + ') ' + (r.condText || '常温')).join(' → ')
    + '。从单质出发一步步做，比直接买试剂难，但这是真实的工业思路。',
    () => synthMade(f), null));
  return {
    id: 'c' + (idx + 1), ext: 'cmp',
    no: '合成' + (CMP_CN[idx] || (idx + 1)),
    grp: '⚗ 化合物制备 · ' + chain.tier + ' · ' + chain.rxs.length + ' 步',
    title: '制备 ' + subName(f) + '：' + chain.rxs.length + ' 步链（' + subName(chain.rxs[0].lhs[0]) + ' 出发）',
    goal: '从单质/原料出发，用 ' + chain.rxs.length + ' 步做出 ' + fname + '。' + (route.note || ''),
    gear: [].concat.apply([], chain.rxs.map((rx) => rx.lhs)).filter((x, i, a) => a.indexOf(x) === i)
      .map((x) => subName(x)).concat([subName(f), '器皿：' + cmpAppName(bench[0])]),
    terms: [{ f: f, note: '目标产物' }].concat(chain.rxs.map((rx, k) => ({ f: rx.rhs[0], note: '第 ' + (k + 1) + ' 步产物' })))
      .map((t) => [subName(t.f), t.f, t.note]),
    bench: bench,
    steps: steps,
    see: chain.rxs.map((r) => (Array.isArray(r.phen) ? r.phen.join('；') : r.phen)).join('；') + '。',
    eq: chain.rxs.map((r) => r.eq),
    key: chain.rxs.map((r, k) => '(' + (k + 1) + ') ' + r.eq + '　条件：' + (r.condText || '常温即可')),
    safe: '多步合成：每一步都要等上一步真的反应完再加下一步（否则原料会和上一步的东西抢反应）。',
    need: [].concat.apply([], chain.rxs.map((rx) => rx.lhs)).filter((x, i, a) => a.indexOf(x) === i)
      .map((x) => ({ f: x, n: subName(x) + '（原料）' })),
  };
}

const cmpAppName = (k) => {
  const d = (typeof APPARATUS !== 'undefined' ? APPARATUS : []).find((a) => a.id === k);
  return d ? d.name : k;
};

/** 器材推断：电解 → 烧杯；点燃 → 集气瓶；≥800 °C → 坩埚（能直火）；溶液/沉淀 → 试管；其余 → 锥形瓶 */
function cmpBench(route, rx) {
  if (route.bench) return route.bench.slice();
  const c = (rx && rx.cond) || {};
  if (c.elec) return ['beaker'];
  if (c.ignite) return ['gasjar'];
  if (c.temp >= 800) return ['crucible'];
  if (c.temp >= 400) return ['tube'];          // 要上 400 K 以上：用能直火的试管，别拿锥形瓶隔着石棉网慢慢焐
  if (route.grp === '盐' || route.grp === '碱') return ['tube'];
  return ['flask'];
}

/** 热源：器皿能直火就按温度挑（灯/本生灯/喷灯），不能直火只能走酒精灯 + 铁架台 + 石棉网 */
function cmpHeater(route, rx, bench) {
  const direct = bench.every((k) => { const d = APPARATUS.find((a) => a.id === k); return !d || d.direct; });
  if (!direct) return 'lamp';
  const t = ((rx && rx.cond) || {}).temp || 0;
  if (t >= 1000) return 'torch';
  if (t >= 700) return 'bunsen';
  return 'lamp';
}

/** 用量：以第一个原料为基准，按配平系数换算 —— 固体给克、液体/溶液给毫升，其余原料多给 25% */
function cmpDoses(route, rx, bench) {
  const lhs = route.lhs.slice();
  const coef = (rx && rx.coef) ? rx.coef.slice(0, lhs.length) : lhs.map(() => 1);
  const base = subOf(lhs[0]) || { st: 's', M: 100 };
  const c0 = coef[0] || 1;
  const anchorMol = lhs[0] === 'H2O' ? 1.6 : (base.st === 's' ? 2 / base.M : 0.05);
  const cap = ((APPARATUS.find((a) => a.id === (bench || [])[0]) || {}).cap) || 250;
  const waterML = Math.max(5, Math.min(30, Math.round(cap * 0.4)));      // 试管只有 25 mL：30 mL 水会被判"装不下"
  const r10 = (x) => Math.max(0.05, Math.round(x * 100) / 100);
  const GAS_MIN = 0.011;                                                 // 弹窗的最小用量是 0.01，给气体留一点余量
  const ignite = !!(rx && rx.cond && rx.cond.ignite);
  const VM = 22400;                                                      // mL/mol（模拟器的气体体积量级）
  const gasIdx = lhs.map((f, i) => ((subOf(f) || {}).st === 'g' ? i : -1)).filter((i) => i >= 0);
  const allGas = gasIdx.length === lhs.length && lhs.length > 0;
  const gasTotal = ((allGas ? 0.6 : 0.4) * cap) / VM;                    // 气体总摩尔数：别把瓶子灌爆
  const gasSum = gasIdx.reduce((s2, i) => s2 + (coef[i] || 1), 0) || 1;
  return lhs.map((f, i) => {
    const s = subOf(f) || { st: 's', M: 100 };
    const c = coef[i] || 1;
    let mol = anchorMol * (c / c0) * (i === 0 ? 1 : 1.25);
    if (s.st === 'g') mol = Math.min(mol, gasTotal * (c / gasSum));       // 气体：按容积上限给药
    if (f === 'H2O') return { f: f, v: waterML, u: 'mL', mol: waterML / 18 };
    if (s.st === 'g') {                                                   // 气体：克数是小数字，别被弹窗下限挡回来
      const gv = Math.max(GAS_MIN, Math.round(mol * s.M * 1000) / 1000);
      return { f: f, v: gv, u: 'g', mol: gv / s.M };
    }
    if (s.st === 's') {
      let sv = r10(mol * s.M);
      if (ignite) sv = Math.min(sv, 0.4);                                 // 点燃类实验按教材「少量」给药：镁 2 g 会把集气瓶炸了
      return { f: f, v: sv, u: 'g', mol: sv / s.M };
    }
    return { f: f, v: r10(mol * s.M), u: 'mL', mol: mol };
  });
}

/** 产物判定：气体看逸出账 + 气相（SO₂/CO₂ 会溶在水里，也要算） */
function cmpMade(i, f) {
  const s = subOf(f) || {};
  return () => {
    const a = tutApp(i);
    if (s.st === 'g') return gasAt(i, f) > 1e-4 || appHas(a, f, 1e-9) || heldGas(f, 1e-4);
    return appHas(a, f, 1e-9) || !!(a && a.pptBy && (a.pptBy[f] || 0) > 1e-9);
  };
}

function cmpLesson(route, rx, idx) {
  const f = route.f;
  const fname = subName(f) + '（' + f + '）';
  const bench = cmpBench(route, rx);
  const heater = cmpHeater(route, rx, bench);
  const c = (rx && rx.cond) || {};
  const doses = cmpDoses(route, rx, bench);
  const steps = [];
  const u0 = () => tutUid(0);

  /* ① 溶液反应先配溶液：固体干放在试管里是不会反应的（第九轮 e28 踩过的坑） */
  if (c.sol && route.lhs.indexOf('H2O') < 0) {
    const wv = Math.max(5, Math.min(20, Math.round((((APPARATUS.find((a) => a.id === bench[0]) || {}).cap) || 250) * 0.3)));
    steps.push(mkStep('先加 ' + wv + ' mL 水（溶液反应要有溶液相）',
      '试剂架搜「水」→ 加入 ' + wv + ' mL：溶液反应必须真有溶液相，干粉混在一起是不反应的',
      () => waterMol(tutApp(0)) > 1e-3,
      () => addReagent(u0(), 'H2O', wv, 'mL')));
  }

  /* ② 一种原料一步：用量按配平系数算好，弹窗会照这一步填 */
  doses.forEach((d, i) => {
    const s = subOf(d.f) || {};
    steps.push(mkStep('加入 ' + d.v + ' ' + d.u + ' ' + subName(d.f) + '（' + d.f + '）',
      '试剂架搜「' + subName(d.f) + '」→ 加入 ' + d.v + ' ' + d.u
      + '（按 ' + (rx ? rx.eq : '') + ' 配平算出来的量' + (i === 0 ? '' : '，留了 25% 余量') + '）',
      /* 加料判定：容器里还找得到 / 还在气相 / 本实验真的加过这一笔 ——
         气体试剂（氯气、SO₂…）一进水就可能参加副反应，只按"还找得到"会误判成没加 */
      () => anyHas(d.f, 1e-6) || heldGas(d.f, 1e-6) || ((Lab.tut.added || {})[d.f] || 0) > 0 || cmpMade(0, f)(),
      () => addReagent(u0(), d.f, d.v, d.u)));
  });

  /* ③ 催化剂（路线里单独写的 cat 字段） */
  if (route.cat) {
    steps.push(mkStep('加入少量 ' + subName(route.cat) + '（' + route.cat + '）作催化剂',
      '试剂架搜「' + subName(route.cat) + '」→ 加入 0.5 g（催化剂只改速率，不改产量）',
      () => anyHas(route.cat, 1e-6) || cmpMade(0, f)(),
      () => addReagent(u0(), route.cat, 0.5, 'g')));
  }

  /* ④ 满足条件：点燃 / 加热 / 通电 —— 条件不满足，反应库里的这条方程根本不会启动 */
  if (c.ignite) {
    steps.push(mkStep('点燃：反应需要点火',
      '点容器卡片上的「🔥 点燃」（点燃类反应：先有可燃物 + 氧气，再给火）',
      () => { const a = tutApp(0); return !!(a && (a.ignited || a.broken)) || cmpMade(0, f)(); },
      () => ignite(u0())));
  }
  if (c.temp) {
    const hname = (HEATERS.find((h) => h.id === heater) || {}).name || '酒精灯';
    steps.push(mkStep('加热到 ' + c.temp + ' K 以上（用' + hname + '）',
      bench.every((k) => (APPARATUS.find((a) => a.id === k) || {}).direct)
        ? '把「' + hname + '」摆上台面 → 点「⬆ 架上来」→ 点「🔥 点燃」（第十轮起器材不会白送，缺了就提示缺哪件）'
        : '玻璃器皿不能见明火：先在「器材」行摆出铁架台 + 石棉网 + ' + hname + '，容器进上格、石棉网垫到器皿下、热源塞进下格，再点「🔥 点燃」',
      () => !!(tutApp(0) && tutApp(0).heater && tutApp(0).heater.on),
      () => tutHeat(0, heater)));
  }
  if (c.elec || route.use.some((x) => /电解|通电/.test(x))) {
    steps.push(mkStep('接通电源：开始电解',
      '点容器卡片上的「⚡ 通电」',
      () => !!(tutApp(0) && tutApp(0).elec),
      () => setPower(u0(), true)));
  }

  /* ⑤ 观察：产物真的出现了才算（气体看逸出账、固体看容器里、沉淀看沉淀账） */
  steps.push(mkStep('观察现象：' + (rx ? (Array.isArray(rx.phen) ? rx.phen.join('；') : rx.phen) : '等待反应发生'),
    '看着容器里的变化（温度、气泡、颜色、沉淀），这一步不点按钮 —— 现象要真的发生',
    () => cmpMade(0, f)() || synthMade(f), null));

  /* ⑥ 记台账：合成教学的真进度（Lab.madeEver 由反应引擎写入，不是自己报的） */
  steps.push(mkStep('观察并归纳：' + fname + ' 已经合成出来了 —— ' + (rx ? rx.eq : ''),
    '这条路线走通了：' + (rx ? (rx.condText || '常温即可') : '') + '。它会被记进「⚗ 合成路线」的进度里。',
    () => synthMade(f), null));

  const names = route.lhs.map((x) => subName(x) + (route.cat && x === route.cat ? '' : '')).join(' + ');
  return {
    id: 'c' + (idx + 1), ext: 'cmp',
    no: '合成' + (CMP_CN[idx] || (idx + 1)),
    grp: '⚗ 化合物制备 · ' + route.grp,
    title: '制备 ' + subName(f) + '：' + names,
    goal: (route.note || '') + '　目标物质：' + fname + '。',
    gear: route.use.map((x) => x).concat(doses.map((d) => subName(d.f) + ' ' + d.v + d.u)).concat(route.cat ? [subName(route.cat) + ' 0.5 g'] : []),
    terms: [{ f: f, note: route.note || '' }].concat(route.lhs.map((x) => ({ f: x, note: '原料：' + subName(x) })))
      .concat(route.cat ? [{ f: route.cat, note: '催化剂：只改速率，不改产量' }] : [])
      .map((t) => [subName(t.f), t.f, t.note]),
    bench: bench,
    steps: steps,
    see: (rx ? (Array.isArray(rx.phen) ? rx.phen.join('；') : rx.phen) : '') + '。'
      + '（' + fname + ' 就是这条路线要拿到的东西。）',
    eq: rx ? [rx.eq] : [],
    key: rx ? [
      (rx.kind || '') + '反应，条件：' + (rx.condText || '常温即可'),
      '原料配比按配平系数算：' + doses.map((d) => subName(d.f) + ' ' + d.v + d.u).join(' + '),
      route.note || '',
    ] : ['反应库里查不到这条路线，已报给开发者'],
    safe: c.ignite ? '点燃类反应：远离可燃物，眼睛别凑近瓶口（铁丝在氧气里燃烧会溅落熔渣）。'
      : (c.temp >= 800 ? '高温操作：用坩埚/蒸发皿并戴护目镜，加热完别用手直接碰。'
        : (c.elec ? '电解用低压直流电源，手湿不要碰电极。' : '按屏幕提示操作；闻气味要用扇闻法。')),
    need: doses.map((d) => ({ f: d.f, n: subName(d.f) + '（原料）' }))
      .concat(route.cat ? [{ f: route.cat, n: subName(route.cat) + '（催化剂）' }] : [])
      .concat(c.temp ? [{ t: heater, n: (HEATERS.find((h) => h.id === heater) || {}).name || '加热器材' }] : []),
  };
}

/* 路线表 → 课程表：全物质路线（第十一轮起覆盖 ROUTES 整张表，含从单质出发的多步链）。
   顺序与 ROUTES 一致 —— 合成面板按同一个下标跳转。 */
const CMP_LESSONS = (typeof ROUTES !== 'undefined' ? ROUTES : []).map((r, i) => {
  if (typeof routeNoLesson === 'function' && routeNoLesson(r.f)) return null;   // 模拟器做不了的：不给手把手，面板如实说明
  if (r.kind === 'chain') return cmpChainLesson({ f: r.f, lhs: r.rxs[0].lhs.slice(), use: r.use, note: r.note, grp: r.grp }, r, i);
  const r0 = r.rxs[0];
  return cmpLesson({ f: r.f, lhs: r0.lhs.slice(), use: r.use, note: r.note, grp: r.grp, cat: (r0.cond || {}).cat || null, tier: r.tier }, r0, i);
});
CMP_LESSONS.forEach((l) => { if (l) l.need = l.need || []; });
if (typeof TUT !== 'undefined') TUT.push.apply(TUT, CMP_LESSONS.filter(Boolean));

/** 从合成面板点「▶ 手把手做这条」：开始对应课程（被模拟器挡下的路线如实说明，不装作能演示） */
function cmpStart(i) {
  const l = CMP_LESSONS[i];
  const rt = (typeof ROUTES !== 'undefined' ? ROUTES[i] : null);
  if (!l) {
    const why = (rt && typeof routeNoLesson === 'function' && routeNoLesson(rt.f))
      || '这条路线在反应库里查不到，已报给开发者';
    if (typeof toast === 'function') toast('这条路线不做手把手：' + why);
    return { ok: false, why: why };
  }
  synthOpen(false);
  const r = tutStart(l.id, true);
  if (typeof tutToggle === 'function') tutToggle(true);
  Lab.tut.sel = l.id;
  tutRender(true);
  return r;
}

Object.assign(window.CHEM, { CMP_LESSONS, cmpStart, cmpLesson, ROUTE_NO_LESSON });

</script>
