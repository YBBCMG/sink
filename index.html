<script>
"use strict";
/* =============================================================================
   深潜 · SINK  —  单文件网页小游戏（零依赖 / 零素材 / 零网络请求）
   -----------------------------------------------------------------------------
   核心循环：深度 = 分数；氧气是唯一生命；加速下潜 = ×2.5 得分但氧气 ×2、视野更小。
   「越贪越快，越快越瞎。」
   分区：0 Config · 1 Utils · 2 Store · 3 Audio · 4 Canvas · 5 State
        6 Update · 7 Render · 8 Input · 9 Loop · 10 SelfTest/Debug
   ============================================================================= */

/* ============================ 0. Config ================================== */
const W0 = 960, H0 = 600;              // 逻辑分辨率（渲染层按等比缩放铺满窗口）
const CFG = {
  pxPerMeter: 12,                      // 12 逻辑像素 = 1 米
  baseSpeed: 130,                      // 正常下潜 px/s
  boostSpeed: 360,                     // 加速下潜 px/s
  boostMul: 2.5,                       // 加速段得分倍率
  playerR: 13,
  playerY: 192,
  xMin: 46, xMax: W0 - 46,
  maxVX: 640, steerK: 14, accelK: 20,  // 转向手感
  /* 键盘转向（A/D）：按住＝踩油门（轻点微调 / 长按全速），不是一按就到顶的火箭。
     原来 want 直接给 ±maxVX，实测轻点 0.16s 就冲到 97% 全速、贴边还剩 461px/s 撞墙 → 又冲又不准。 */
  kbAccel: 24, kbHold: 0.12, kbRamp: 0.35, kbTapMul: 0.30,
  kbSoftEdge: 120,                     // 贴边 120px 内线性收力：软着陆，不撞墙急停
  boostRamp: 24, speedRamp: 9,         // 下潜手感：踩加速要脆(τ≈42ms)，松开要顺(τ≈110ms)
  o2Max: 100,
  o2Drain: 1.12,                       // 基础 1.12/s → 约 89 秒
  boostDrainMul: 2.05,
  /* --- 深渊压力：随深度缓慢加压，曲线 d/(d+diffHalf) 永远爬不到顶 --- */
  diffHalf: 1500,                      // 600m→29% · 1500m→50% · 4500m→75%（深水段原样不动）
  diffGrace: 160,                      // 前 160m 不计压力（缓坡起步）：600m→23% · 900m→33%（原来 38%）
  drainGain: 0.50,                     // 氧气消耗 ×(1+压力×0.50)
  bubbleLoss: 0.20,                    // 气泡含氧 ×(1-压力×0.20)，最低保 58%
  hitGain: 0.45,                       // 撞击伤害 ×(1+压力×0.45)
  rowGain: 0.14,                       // 障碍行更密 ×(1-压力×0.14)，最低 0.76×
  gapGain: 0.08,                       // 安全走廊更窄 ×(1-压力×0.08)
  extraObst: 0.30,                     // 每行多塞一个障碍的概率 = 压力×0.30
  hitDamage: 15,
  bubbleO2: 13,
  bubbleThin: 700,                     // 越深气泡越稀：间隔 ×(1+depth/700×0.9)。
                                       // 原来 4000 太松 —— 深水「完美捡泡 = 净回氧」，脚本对局 3/9 种子跑成 300s 不朽。
                                       // 改 700 后有氧上限才是真的上限：中位 87.6s、8/9 落在 60~120s 带内。
  invulnTime: 1.2,
  hitSlowTime: 0.65, hitSlowMul: 0.45,
  nearMissBonus: 5, nearMissPad: 22,
  lightNear: 360, lightFar: 150, lightSpan: 900,
  lightMut: 60,                        // 质变·灯距：每级 +60（永久视野）
  jellyLight: 200, jellyDecay: 9, jellyCap: 560,   // 捡一只：视野 +200，约 22s 才衰减干净（原来 90/26，两秒就没了）
  rowNear: 0.72, rowFar: 0.34, rowSpan: 1300,   // 障碍行间隔随深度收紧
  gapNear: 330, gapFar: 215,                    // 安全走廊宽度
  gapStep: 200,                                 // 相邻走廊最大横移（保证「过得去」）
  bubbleEvery: [0.45, 1.05],
  jellyEvery: [5.5, 9.5],
  /* --- 战斗：准星 + 普攻（AD 推准星，光束打在准星那条线上） --- */
  atkDmg: 50,                          // 单发伤害：石头 100 血＝两发，泥鳅 30 血＝一发
  atkEvery: 0.50,                      // 连发间隔（速射技能缩它）
  atkReach: 300,                       // 准星在玩家正前方多远（逻辑像素）
  atkHalfW: 22,                        // 光束半宽＝判定宽容度（散射技能加宽它）
  beamT: 0.13,                         // 光束视觉残留
  aimLerp: 16,                         // 准星跟手速度（越大越硬）
  aimAutoR: 520,                       // 自动瞄准：这个距离内最近的怪物会被准星咬住
  aimIdle: 2.5,                        // 鼠标停手多久后交给自动瞄准（一动鼠标立刻收回控制权）
  rockHP: 100, cableHP: 30,            // 石头 / 泥鳅（线缆）血量
  /* --- 深海猎食者：1000m 以下才出现，且刚过线有一段适应期 ---
     注意：怪是所有氧气压力的主承重墙 —— 砍太狠局时会失控变长（实测砍 5 倍 → 中位 183s、3 局撞 300s 上限）。
     所以浅段只留 35% 的爬升，深段反而要比原版更凶（原 deepen=0.7+1.4×压力）。 */
  mobFrom: 1000,
  mobRamp: 400, mobIntro: 0.30,        // 只软化 1000~1400m 这一段，1400m 起恢复原版压力
  mobCapBase: 2, mobCapGain: 4,        // 同时在场上限 = 2 + 4×压力（压力 0.4→4 只，0.63→5 只）
  mobDeepen: [0.70, 1.40],             // 深段倍率 = 0.70 + 1.40×压力（＝原版，别动）
  hunterHP: 150, hunterEvery: [2.1, 3.7], hunterRush: 215, hunterVX: 200, huntDamage: 18,
  spitterHP: 90, spitterEvery: [2.8, 4.6], spitterRush: 70, spitterVX: 130,
  boltEvery: [1.3, 2.0], boltDmg: 12, boltSpeed: 235, boltR: 8,
  /* --- 2026-09-25 玩家反馈：后期怪太软（照明使者原地放技能就能躺赢） ---
     两手：① 1800m 起所有怪物血量爬坡（×2 → ×3 封顶）；② 2000m 起新增两种猎食者。
     剃刀鲸：斜插猛冲的大家伙，撞完不消失，逼你真的挪位置；
     圣盾使：金钟水母放三连电球，盾开着减伤 75%，盾碎 3.5s 才能重开 —— 先破盾再输出。 */
  mobHpFrom: 1800, mobHpSpan: 1600, mobHpCap: 3,
  reaverHP: 320, reaverEvery: [4.5, 7.5], reaverRush: 95, reaverVX: 265, reaverDmg: 22,
  wardenHP: 260, wardenEvery: [6.0, 9.5], wardenFan: [2.4, 3.4], wardenShieldCut: 0.75, wardenBreakT: 3.5,
  killScore: 40, breakScore: 6,
  /* --- 击杀回氧：自带被动，不用选技能（回的是「氧气上限的百分比」，不随深度缩水）
     但它天生是「无限刷」：怪随深度变多，回氧速率会超过耗氧 1.12~1.68/s ——
     实测 killO2=0.10 无递减时 12/12 种子跑成 300s 不朽（平均回氧 2057，撞穿计时上限）。
     所以加连杀递减：一波里的第一只满额（＝你要的 10%），killComboReset 秒内再杀按 killComboMul 逐只打折。
     0.50/8.0 是 7 变体×12 种子扫出来的最优：12/12 落在 60~120s 带内（中位 95.6s，范围 75~110），
     比「完全关掉回氧」的 11/12 还稳，平均回氧 20.8 —— 手感有了，无限刷没了。 --- */
  killO2: 0.10,
  killComboMul: 0.50, killComboReset: 8.0,
  /* --- 主动技能（Q/E/F）：冷却制，要玩家自己按，绝不跟普攻一起自动放 --- */
  /* 2026-09-25 玩家反馈：冷却太长了 → 7s 降到 4s（「凝神」每级 ×0.88，点满 5 级约 2.1s） */
  shockCd: 4.0, shockR: 240, shockMob: 150, shockObst: 200,   // 冲击波：以本体为圆心的清场
  dashCd: 5.0, dashT: 1.1, dashMul: 2.4, dashDmg: 80,         // 突进：无敌 + 提速 + 撞碎挡路的
  flareCd: 10.0, flareT: 4.0, flareLight: 620,                // 探照：短时间内把黑暗推开
  /* 深水斜坡（不封顶）：1.2km 以内完全不变 —— 前段手感是玩家点名要保的；
     再深就按 deepSpan 线性加价。没有这一档，强化一多深水就成永动机，
     实测 9 个种子里 4 个能一路顶到 300s 上限都不死。 */
  deepFrom: 1100, deepSpan: 1400,
  /* --- 深渊馈赠（割草式三选一）：每 CFG.lvEvery 米一次 ---
     2026-09-25 玩家要求：原来 100/180/260… 越往后越稀，1km 才强化 4~5 次，深水压力直接糊脸。
     现在恒定 100m 一次：到 1km 正好 10 次，前段攒得出东西，深水反而好玩。 */
  lvEvery: 100,
  /* 神器牌：稀有档 —— 每次三选一按这个概率「混进来一张」，命中就占掉一个卡位。
     2026-09-25 玩家反馈「概率要足够低」：0.22 → 0.09（约每 11 次三选一才见一张）。 */
  artChance: 0.09,
  /* 质变：2000m 后的第一次三选一 = 三条全新方向（MUTATIONS） */
  mutateAt: 2000,
  /* 神器上限：一局最多持有几张（新神器只在持有数 < 上限时判定） */
  artCap: 3,
  /* 护心符（被动神器）：符咒环绕，触敌灼伤 */
  amuDmg: 35, amuCd: 10.0, amuT: 3.0, amuR: 58, amuSpeed: 2.2,
  /* 刷新：每局可以重抽几次三选一（2026-09-25 玩家要求：两次，每次重抽都还是三张） */
  rerollPerRun: 2,
  /* 流派纯度：1000m 之前、选定流派之后，三选一只给自己的流派牌（基础牌一张不掺） */
  routeOnlyUntil: 1000
};

/* 深渊压力 0→1：0m 是 0，越深越接近 1 但永远到不了顶 —— 慢，且不封顶 */
/* 深渊压力曲线：前 CFG.diffGrace 米是「缓坡起步」，之后才按 d/(d+half) 爬 ——
   玩家反馈「难度增加太快」：生效的是前中段（人还没到深水就死了），
   所以给前段一个起步宽限，深水段保持原样（不然尾段会松到出现 240s 准不朽局）。 */
function diffK(depth) { const d = Math.max(0, depth - CFG.diffGrace); return d / (d + CFG.diffHalf); }

/* ---------- 深渊馈赠：技能池（每级线性叠加，满 5 级不再出现） ----------
   minD = 解锁深度；w = 抽卡权重。类型只决定配色与手感，不影响数值。 */
const SKILLS = [
  { id: "greed",  n: "贪婪", t: "收益", d: "加速得分倍率 +0.30",       max: 5, minD: 0,   w: 1.0 },
  { id: "haul",   n: "打捞", t: "收益", d: "气泡含氧 +4",              max: 5, minD: 0,   w: 1.0 },
  { id: "edge",   n: "擦身", t: "收益", d: "擦身 +6 分 · 判定垫 +4px",  max: 5, minD: 120, w: 1.0 },
  { id: "seal",   n: "气密", t: "生存", d: "氧气上限 +18（立刻补上）",   max: 5, minD: 0,   w: 1.0 },
  { id: "eco",    n: "节氧", t: "生存", d: "耗氧 ×0.90",               max: 5, minD: 200, w: 0.9 },
  { id: "plate",  n: "耐压", t: "生存", d: "撞击伤害 ×0.85",            max: 5, minD: 200, w: 0.9 },
  { id: "shell",  n: "缓冲", t: "生存", d: "受击无敌 +0.30s",           max: 5, minD: 400, w: 0.8 },
  { id: "stream", n: "流线", t: "机动", d: "常速 +8%",                 max: 5, minD: 0,   w: 1.0 },
  { id: "rudder", n: "舵效", t: "机动", d: "转向响应 +22%",             max: 5, minD: 0,   w: 1.0 },
  { id: "thrust", n: "推进", t: "机动", d: "加速速度 +8%",              max: 5, minD: 120, w: 1.0 },
  { id: "magnet", n: "磁力", t: "采集", d: "吸附半径 +55px",            max: 5, minD: 150, w: 0.95 },
  { id: "bloom",  n: "流萤", t: "采集", d: "水母视野 +60 · 更常见",      max: 5, minD: 150, w: 0.95 },
  /* --- 战斗：普攻强化。权重 2.2（其余牌 ~1.0），且解锁深度整体提前 ——
     原来 minD 260~520，实测整局 7 次三选一里战斗牌只撞上 2 次，玩家「根本找不到特殊技能」。 --- */
  { id: "power",   n: "火力", t: "战斗", d: "普攻伤害 +25",                        max: 5, minD: 170, w: 2.2 },
  { id: "rapid",   n: "速射", t: "战斗", d: "普攻间隔 ×0.82",                      max: 5, minD: 240, w: 2.2 },
  { id: "crusher", n: "碎岩", t: "战斗", d: "普攻对障碍物 +50 伤害（一击碎泥鳅）",   max: 5, minD: 330, w: 2.2 },
  { id: "spread",  n: "散射", t: "战斗", d: "普攻光束 +16px 宽",                    max: 5, minD: 420, w: 2.2 },
  /* --- 主动技能强化：「主动」是独立一档（不稀释战斗牌保底），专管 Q/E/F 三个要自己按的技能 --- */
  { id: "overload",  n: "过载", t: "主动", r: "mage", d: "冲击波 半径 +40 · 伤害 +30",        max: 5, minD: 300, w: 1.7 },
  { id: "afterburn", n: "余燃", t: "主动", r: "warrior", d: "突进 冷却 −1.0s · 无敌 +0.25s",     max: 5, minD: 360, w: 1.7 },
  { id: "lumen",     n: "长明", t: "主动", r: "lamp", d: "探照 持续 +2s · 半径 +120",         max: 5, minD: 480, w: 1.7 },
  { id: "m_cd",     n: "凝神", t: "主动", r: "mage",    d: "冲击波 冷却 x0.88",          max: 5, minD: 300, w: 1.7 },
  { id: "m_dmg",    n: "震荡", t: "主动", r: "mage",    d: "冲击波 伤害 +40",            max: 5, minD: 380, w: 1.7 },

  { id: "w_hp",     n: "铁躯", t: "主动", r: "warrior", d: "氧气上限 +22（立刻补上）",     max: 5, minD: 320, w: 1.7 },
  { id: "w_ram",    n: "猛撞", t: "主动", r: "warrior", d: "突进撞击伤害 +50（怪也能撞）", max: 5, minD: 400, w: 1.7 },
  { id: "w_vamp",   n: "噬血", t: "主动", r: "warrior", d: "突进撞碎 / 撞死 回氧 +2.5%",  max: 5, minD: 480, w: 1.7 },
  { id: "l_dot",    n: "灼光", t: "主动", r: "lamp",    d: "探照期间 每秒灼伤 30",        max: 5, minD: 340, w: 1.7 },
  { id: "l_heal",   n: "回春", t: "主动", r: "lamp",    d: "探照期间 每秒回氧 +1.0%",     max: 5, minD: 420, w: 1.7 },
  { id: "l_shield", n: "光盾", t: "主动", r: "lamp",    d: "探照期间 受伤 -35%",          max: 5, minD: 500, w: 1.7 }
];

/* ---------- 神器牌：稀有档（2026-09-25 玩家要求重做）----------
   机制（这轮按玩家口径改了三处）：
   ① 更稀有：artChance 0.22 → 0.09（抽到本身就是事件）；
   ② 神器 = 被动生效的技能，不用玩家按 —— 效果全部写进 recalcMods / stepPlay；
   ③ 每张可拿两次：Lv1 本体，Lv2 是「神器的强化」（专属强化牌只在持有后混进池）；
   ④ 每局最多持有 3 张神器（新神器只在你持有 <3 时判定）。
   选流派那次（Lv2）不给神器 —— 那一次是「定流派」，端上来的就是那三条路。 */
const ARTIFACTS = [
  { id: "a_amulet", n: "✦ 护心符",   t: "神器", d: "被动：3 枚符咒环绕自身，触敌灼伤 35，冷 10s 持续 3s", max: 2, minD: 200, w: 1.0 },
  { id: "a_thorn",  n: "✦ 荆棘甲",   t: "神器", d: "被动：被撞反伤 45（同归于尽的猎手先死）",            max: 2, minD: 250, w: 1.0 },
  { id: "a_duel",   n: "✦ 双生光束", t: "神器", d: "被动：普攻分出第二条光束，射向另一个目标",            max: 2, minD: 300, w: 1.0 },
  { id: "a_reb",    n: "✦ 深渊回响", t: "神器", d: "被动：技能伤害命中回氧 +0.5%/次",                    max: 2, minD: 250, w: 1.0 }
];

const ARTIFACT_UP = {
  a_amulet:"符咒 +2 枚 · 灼伤 +20",
  a_thorn: "反伤 +45 · 反伤命中回氧 +1%",
  a_duel:  "第三条光束 · 每条光束伤害 ×1.25",
  a_reb:   "回氧翻倍（+1.0%/次）"
};

/* ---------- 三条路线：第二次强化时三选一，选完另外两条永久关闭 ----------
   选路线只给「技能本身」；冷却 / 伤害 / 范围这些数值要靠之后的路线牌一级一级点出来。
   基础牌（没有 r 字段的那些）不锁路线，随便哪条路都能抽到。 */

     坑（2026-09-25 修）：保底原来只在 pool 里找，而 pool 已经按 minD 过滤过 ——
     Lv1(100m) 时火力要 170m 才解锁，池里一张战斗牌都没有，保底空转；
     Lv2(280m) 本该是保底首次生效，又被「选路线」那次三选一顶掉，
     结果实战第一次拿到战斗牌被推到 540m（保底写了等于没写）。
     所以保底不认深度门槛：池里没有就把最早解锁的那张直接补进来。
     （只在战斗牌总等级 <2 时生效，不会长期改变卡池曲线。） */
  /* 只在混池阶段生效：1km 前只给流派牌，而战斗牌全是基础牌，硬塞进来就破了流派纯度 */
  if (!routeOnly && combatOwned() < 2) {
    let ci = pool.findIndex((s) => s.t === "战斗");
    if (ci < 0) {
      const early = SKILLS.filter((s) => s.t === "战斗" && skLv(s.id) < s.max).sort((a, b) => a.minD - b.minD)[0];
      if (early) { pool.push(early); ci = pool.length - 1; }
    }
    if (ci >= 0) out.push(pool.splice(ci, 1)[0]);
  }
  /* 神器占的是「三张里的一个卡位」：照样凑满 3 张。
     坑（本轮探针抓到）：原来写 artifact?2:3，结果神器一出现卡面只剩 2 张 —— 神器不是额外奖励位。 */
  while (out.length < 3 && pool.length) {
    let tot = 0;
    for (const s of pool) tot += s.w;
    let x = rg() * tot, k = 0;
    for (; k < pool.length - 1; k++) { x -= pool[k].w; if (x <= 0) break; }
    out.push(pool.splice(k, 1)[0]);
  }
  /* 同名卡去重：保底混进来的牌可能正好和权重抽到的撞上（三张里出现两张「裂痕」看着像 bug） */
  const seen = new Set();
  return out.filter((s) => !seen.has(s.id) && seen.add(s.id));
}
/* 刷新（reroll）：每局 CFG.rerollPerRun 次，重抽三张牌 ——
   抽卡种子带上 rerollN，所以重抽一定换一批，不会原样端回来。
   选流派那次不给刷：三张就是那三条路，刷了还是它们。 */
function rerollChoices() {
  if (G.state !== "levelup" || !G.choices) return false;
  if (G.choices.some((s) => s.route)) return false;      // 路线 / 质变都不给刷：选完才继续
  if (G.rerolls <= 0) return false;
  G.rerolls -= 1; G.rerollN += 1;
  const c = rollChoices();
  if (!c.length) return false;
  G.choices = c;
  G.flash = 0.5;
  SFX.pick();
  return true;
}
function levelUp() {
  G.level += 1;
  G.nextLv += lvNeed(G.level + 1);
  const c = rollChoices();
  if (!c.length) return;                 // 全满级：安静地继续下潜
  G.choices = c;
  G.state = "levelup";
  G.flash = 0.55;
  SFX.level();
}
function applyPick(i) {
  if (G.state !== "levelup" || !G.choices) return false;
  const s = G.choices[i];
  if (!s) return false;
  if (s.route) {                        // 路线 / 质变：选一条，另外两条从此不再出现
    if (s.mutate) { G.mutate = s.route.id; popup(p.x, p.y - 44, "质变 · " + s.route.n, s.route.col.join(",")); }
    else { G.route = s.route.id; popup(p.x, p.y - 44, s.route.n, s.route.col.join(",")); }
    recalcMods();
    G.choices = null; G.state = "play";
    G.flash = 0.7;
    burst(p.x, p.y, 28, s.route.col.join(","));
    SFX.pick();

  }
  G.sk[s.id] = skLv(s.id) + 1;

  G.choices = null; G.state = "play";
  const col = KIND_COL[s.t] || [190, 240, 255];
  if (s.id === "seal") G.o2 = Math.min(o2MaxNow(), G.o2 + 18);
  if (s.id === "a_amulet") G.amuT = 0;                // 护心符：拿到当场就转起来（默认生效，不用按）
  popup(p.x, p.y - 48, s.n + (s.max > 1 ? " Lv" + G.sk[s.id] : ""), col.join(","));

/* ============================ 1. Utils =================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const frac = (t) => t - Math.floor(t);
const hash1 = (n) => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);   // 渲染用，不消耗 RNG
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const rnd = () => rng();
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rnd());
const mixRgb = (a, b, t) => `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;

/* ============================ 2. Store =================================== */
const store = (() => {

  catch (e) { ok = false; }
  return {

    set(k, v) { mem[k] = v; if (ok) { try { localStorage.setItem(k, v); } catch (e) {} } }

/* ============================ 3. Audio =================================== */
/* 全部 WebAudio 现场合成：0 KB 音效素材。必须先有用户手势才建 AudioContext。 */
const SFX = (() => {
  let ac = null, master = null, noiseBuf = null, droneNodes = null, gestured = false;
  let muted = store.get("sink.muted", "0") === "1";
  function ensure() {
    if (!gestured) return null;
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ac = new AC(); } catch (e) { return null; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85; master.connect(ac.destination);
    const len = Math.max(1, Math.floor(ac.sampleRate * 0.5));
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }
  function tone(f0, f1, dur, type, vol) {
    const c = ensure(); if (!c || muted) return;
    try {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f0, c.currentTime);
      if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), c.currentTime + dur);
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(vol, c.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(master); o.start(); o.stop(c.currentTime + dur + 0.03);
    } catch (e) {}
  }
  function noise(dur, vol, freq) {
    const c = ensure(); if (!c || muted || !noiseBuf) return;
    try {
      const s = c.createBufferSource(); s.buffer = noiseBuf;
      const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 800;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(c.currentTime + dur);
    } catch (e) {}
  }
  return {
    get muted() { return muted; },
    setMuted(m) { muted = m; store.set("sink.muted", m ? "1" : "0"); if (master) master.gain.value = m ? 0 : 0.85; },
    toggleMute() { this.setMuted(!muted); return muted; },
    unlock() { gestured = true; const c = ensure(); if (c && c.state === "suspended") c.resume().catch(() => {}); },
    start() { tone(330, 660, 0.14, "triangle", 0.10); },
    bubble() { tone(560 + Math.random() * 180, 980 + Math.random() * 200, 0.09, "sine", 0.10); },
    jelly() { tone(420, 884, 0.28, "sine", 0.10); },
    nomiss() { tone(1200, 1700, 0.05, "triangle", 0.05); },
    shoot() { tone(760, 240, 0.07, "square", 0.045); noise(0.05, 0.05, 2600); },
    kill() { noise(0.20, 0.20, 1600); tone(320, 90, 0.18, "triangle", 0.09); },
    zap() { tone(180, 90, 0.14, "sawtooth", 0.07); noise(0.10, 0.10, 1800); },
    level() { tone(520, 780, 0.16, "triangle", 0.10); setTimeout(() => tone(780, 1180, 0.22, "triangle", 0.09), 110); },
    pick() { tone(880, 1320, 0.14, "sine", 0.10); tone(1320, 1560, 0.1, "triangle", 0.05); },
    hit() { noise(0.26, 0.32, 900); tone(190, 55, 0.26, "sawtooth", 0.16); },
    over() { tone(220, 48, 0.95, "sine", 0.18); noise(0.7, 0.14, 420); },
    droneOn() {
      const c = ensure(); if (!c || droneNodes) return;
      try {
        const o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
        o1.type = "sine"; o2.type = "sine";
        o1.frequency.value = 48; o2.frequency.value = 72.5;
        f.type = "lowpass"; f.frequency.value = 320;
        g.gain.setValueAtTime(0.0001, c.currentTime);
        g.gain.exponentialRampToValueAtTime(muted ? 0.0001 : 0.045, c.currentTime + 0.7);
        o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
        o1.start(); o2.start();
        droneNodes = { o1, o2, g, c };
      } catch (e) {}
    },
    droneOff() {
      if (!droneNodes) return;
      const { o1, o2, g, c } = droneNodes; droneNodes = null;
      try {
        g.gain.cancelScheduledValues(c.currentTime);
        g.gain.setValueAtTime(g.gain.value, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.35);
        o1.stop(c.currentTime + 0.45); o2.stop(c.currentTime + 0.45);
      } catch (e) {}
    },
    droneUpdate(s01) {
      if (!droneNodes) return;
      try { droneNodes.o1.frequency.value = 48 + s01 * 24; droneNodes.o2.frequency.value = 72.5 + s01 * 36; } catch (e) {}
    }
  };
})();

/* ============================ 6b. 战斗 =================================== */

    else { popup(e.x, e.y - e.r - 20, "盾 -" + Math.round(dmg * 0.25), "255,225,150"); burst(e.x, e.y, 4, "255,220,140"); return false; }

    G.dashStamp = (G.dashStamp || 0) + 1;                // 一次突进对每个障碍只算一次账
    /* 突进期间无敌（撞怪不挨咬）—— 但战士选了质变之后这条无敌取消：
       玩家口径「虽然冲锋期间会受到伤害，但敌人被吸过来，自身防御/撞击/吸血全抬」。
       换成减伤（巨鲸崩涛 25% 起 · 破浪无阻 15%/级），撞进去是要付代价的。 */
    const warriorMut = !!(G.mutate && MUT_MAP[G.mutate] && MUT_MAP[G.mutate].r === "warrior");
    if (!warriorMut) p.invuln = Math.max(p.invuln, G.m.dashT);
    burst(p.x, p.y, 16, "150,255,220"); SFX.zap();
  } else if (k === "f") {
    G.act.f = G.m.flareCd;
    G.actFx.flare = G.m.flareT;
    burst(p.x, p.y, 18, "210,240,255"); SFX.jelly();
  } else return false;
  return true;
}

function spawnHunter() {
  ents.push({ kind: "hunter", x: rr(60, W0 - 60), y: H0 + 50, r: 20, hp: mobHP(CFG.hunterHP), maxHp: mobHP(CFG.hunterHP), seed: rnd() * 997, hit: false, near: false, flash: 0 });
}
function spawnSpitter() {
  ents.push({ kind: "spitter", x: rr(60, W0 - 60), y: H0 + 50, r: 17, hp: mobHP(CFG.spitterHP), maxHp: mobHP(CFG.spitterHP), seed: rnd() * 997, hit: false, near: false, flash: 0, fireT: 1.3 });
}
/* 2026-09-25 玩家反馈「后期敌人数值太低」：1800m 起全怪物血量线性爬坡，2400m 后 ×3 封顶 */
function mobHP(base) {
  const k = clamp((G.depth - CFG.mobHpFrom) / CFG.mobHpSpan, 0, 1);
  const mul = 1 + k * (CFG.mobHpCap - 1);
  return Math.round(base * mul);
}
/* 剃刀鲸：2000m+。体型大、血厚、斜插猛冲，撞完不消失 —— 逼你真的挪位置，
   原地站桩放技能会先被它撞掉一层氧。 */
function spawnReaver() {
  const fromLeft = rnd() < 0.5;
  ents.push({ kind: "reaver", x: fromLeft ? -60 : W0 + 60, y: H0 + rr(40, 160), r: 30,
              hp: mobHP(CFG.reaverHP), maxHp: mobHP(CFG.reaverHP), seed: rnd() * 997,
              hit: false, near: false, flash: 0, vx: (fromLeft ? 1 : -1) * CFG.reaverVX * rr(0.8, 1.2) });
}
/* 圣盾使：2000m+。金钟水母，贴近了放三连电球；盾开着减伤 75%，
   盾被打破（单次伤害 ≥60 或累计 3 次命中）后 3.5s 内不重开 —— 先破盾再输出。 */
function spawnWarden() {
  ents.push({ kind: "warden", x: rr(120, W0 - 120), y: H0 + 40, r: 22,
              hp: mobHP(CFG.wardenHP), maxHp: mobHP(CFG.wardenHP), seed: rnd() * 997,
              hit: false, near: false, flash: 0, fireT: 2.0, fanN: 0, fanT: 0,
              shield: true, shieldHp: 3, breakT: 0 });
}
function hurtPlayer(dmg, col) {
  if (p.invuln > 0) return false;
  /* 照明路线·光盾：探照生效期间伤害打折 */
  if (G.actFx.flare > 0 && G.m.flareShield > 0) {
    const cut = Math.round(dmg * G.m.flareShield);
    dmg = Math.max(1, dmg - cut);
    popup(p.x, p.y - 46, "光盾 -" + cut, "210,240,255");
  }
  /* 质变·巨鲸崩涛（+崩甲）：固定百分比减伤（基础 25%，崩甲每级 +8%，60% 封顶） */
  if (G.mutate === "bulwark") {
    const cutK = Math.min(0.60, 0.25 + 0.08 * skLv("b_arm"));
    const cut = Math.round(dmg * cutK);
    if (cut > 0) { dmg = Math.max(1, dmg - cut); popup(p.x, p.y - 60, "崩涛 -" + cut, "150,255,220"); }
  }
  /* 质变·破浪无阻（+不碎）：突进期间的额外减伤 —— 战士质变没有无敌，靠这个顶住 */
  if (G.m.dashCut > 0 && G.actFx.dash > 0) {
    const cut = Math.round(dmg * G.m.dashCut);
    if (cut > 0) { dmg = Math.max(1, dmg - cut); popup(p.x, p.y - 74, "破浪 -" + cut, "170,255,205"); }
  }
  G.o2 -= dmg;
  p.invuln = G.m.invuln; p.hurtT = 0.4; G.slowT = CFG.hitSlowTime;
  G.shakeT = 0.45; G.shakeMag = 13; G.redFlash = 0.9;
  burst(p.x, p.y, 18, col || "255,150,150");
  popup(p.x, p.y - 26, "-" + dmg + " 氧", "255,160,160");
  SFX.hit();
  return true;
}
/* 荆棘甲（被动神器）：被咬时反伤；Lv2 起反伤命中回氧 +1% */
function thornHit(i, e) {
  const died = hurtEnt(i, e, G.m.thorn.d, "180,255,190");
  G.thornHits = (G.thornHits || 0) + 1;
  if (died && G.m.thorn.heal > 0) {
    const gain = o2MaxNow() * G.m.thorn.heal;
    G.o2 = Math.min(o2MaxNow(), G.o2 + gain);
    popup(p.x, p.y - 70, "荆棘回氧 +" + gain.toFixed(1), "150,255,200");
  }
}
/* 深渊回响（被动神器）：冲击波 / 灼光 / 符咒 / 光环这类「技能伤害」命中时回氧 */
function echoHit(n) {
  if (!G.m.echo || n <= 0) return;
  const gain = o2MaxNow() * G.m.echo * n;
  G.o2 = Math.min(o2MaxNow(), G.o2 + gain);
  G.o2Echo = (G.o2Echo || 0) + gain;
}

function stepPlay(dt) {
  const I = G.input;
  G.runTime += dt;

  /* --- 主动技能计时：冷却倒计时 + 生效时间倒计时 --- */
  for (const k in G.act) if (G.act[k] > 0) G.act[k] = Math.max(0, G.act[k] - dt);
  const fx = G.actFx;
  if (fx.dash > 0) fx.dash = Math.max(0, fx.dash - dt);
  if (fx.flare > 0) fx.flare = Math.max(0, fx.flare - dt);
  if (fx.shock > 0) fx.shock = Math.max(0, fx.shock - dt);
  if (fx.shock2 && fx.shock2.t > 0) { fx.shock2.t = Math.max(0, fx.shock2.t - dt); if (fx.shock2.t <= 0) fx.shock2 = null; }
  /* 质变·雷暴二响：等那一响落地 */
  if (G.pulseQ) { G.pulseQ.t -= dt; if (G.pulseQ.t <= 0) { pulseBoom(G.pulseQ); G.pulseQ = null; } }

  /* --- 照明路线：探照生效期间 灼伤 + 回氧（护盾在 hurtPlayer 里结算） --- */
  if (fx.flare > 0) {
    if (G.m.flareDot > 0) {
      G.dotT = (G.dotT || 0) + dt;
      if (G.dotT >= 0.25) { G.dotT = 0; flareBurn(); }
    }
    if (G.m.flareHeal > 0) G.o2 = Math.min(o2MaxNow(), G.o2 + o2MaxNow() * G.m.flareHeal / 100 * dt);
    /* 质变·灯塔长明（+塔供）：探照期间额外回氧 */
    if (G.m.flareHeal2 > 0) G.o2 = Math.min(o2MaxNow(), G.o2 + o2MaxNow() * G.m.flareHeal2 / 100 * dt);
  } else G.dotT = 0;

  /* --- 被动神器 & 质变：默认生效，不用玩家按（2026-09-25 玩家口径） --- */
  /* 护心符：冷却 → 转起来灼敌 → 收工。amuT 是剩余生效时间，amuCd 是冷却 */
  if (G.m.amu) {
    G.amuCd = Math.max(0, (G.amuCd || 0) - dt);
    if (G.amuT > 0) {
      G.amuT = Math.max(0, G.amuT - dt);
      G.amuAng = (G.amuAng || 0) + G.m.amu.sp * dt;
      G.amuTick = (G.amuTick || 0) + dt;
      if (G.amuTick >= 0.25) {                    // 0.25s 一跳，跟灼光同节奏，不刷屏
        G.amuTick = 0;
        let hits = 0;
        for (let i = ents.length - 1; i >= 0; i--) {
          const e = ents[i];
          if (e.kind !== "hunter" && e.kind !== "spitter" && e.kind !== "reaver" && e.kind !== "warden") continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) > G.m.amu.r + e.r) continue;
          const before = { hp: e.hp, sh: e.shieldHp };
          hurtEnt(i, e, Math.round(G.m.amu.d / 4), "255,235,180");
          if (e.hp !== before.hp || e.shieldHp !== before.sh) { hits++; G.amuHits++; }   // 打在盾上也算命中
        }
        echoHit(hits);
      }
    } else if (G.amuCd <= 0) { G.amuT = G.m.amu.t; G.amuCd = G.m.amu.cd; G.flash = Math.max(G.flash, 0.18); }
  }
  /* 质变·深灯火环：常亮光环，环内怪每秒灼伤、自己每秒回氧 */
  if (G.mutate === "abyss") {
    const hR = 240 + 30 * skLv("a_dmg"), hD = 22 + 8 * skLv("a_dmg"), hO = 0.15 + 0.10 * skLv("a_o2");
    G.haloR = hR;
    G.o2 = Math.min(o2MaxNow(), G.o2 + o2MaxNow() * hO / 100 * dt);
    G.haloTick = (G.haloTick || 0) + dt;
    if (G.haloTick >= 0.5) {
      G.haloTick = 0;
      let hits = 0;
      for (let i = ents.length - 1; i >= 0; i--) {
        const e = ents[i];
        if (e.kind !== "hunter" && e.kind !== "spitter" && e.kind !== "reaver" && e.kind !== "warden") continue;
        if (Math.hypot(e.x - p.x, e.y - p.y) > hR + e.r) continue;
        const before = { hp: e.hp, sh: e.shieldHp };
        hurtEnt(i, e, Math.round(hD / 2), "210,240,255");
        if (e.hp !== before.hp || e.shieldHp !== before.sh) hits++;   // 打在盾上也算命中
      }
      echoHit(hits);
    }
  } else G.haloR = 0;
  /* 质变·星光灼穿：光照半径内的怪一直挨烧（默认生效，不用按 F），灼死回氧 */
  if (G.m.starDot > 0) {
    G.starTick = (G.starTick || 0) + dt;
    if (G.starTick >= 0.5) {
      G.starTick = 0;
      const starR = G.lightR + G.m.starR;
      let hits = 0;
      for (let i = ents.length - 1; i >= 0; i--) {
        const e = ents[i];
        if (!MOB_SET[e.kind] || e.kind === "bolt") continue;
        if (Math.hypot(e.x - p.x, e.y - p.y) > starR + e.r) continue;
        const died = hurtEnt(i, e, Math.round(G.m.starDot / 2), "200,255,235");
        if (died && G.m.starO2 > 0) {
          const gm = o2MaxNow() * G.m.starO2;
          G.o2 = Math.min(o2MaxNow(), G.o2 + gm);
          popup(p.x, p.y - 70, "星供 +" + gm.toFixed(1), "200,255,235");
        }
        hits++;
      }
      echoHit(hits);
    }
  }
  /* 质变·巨鲸崩涛：突进期间把周围怪往身边拽（撞进去喂猛撞/荆棘/光环） */
  if (G.mutate === "bulwark" && fx.dash > 0) {
    const pullR = 260 + 80 * skLv("b_pull"), pullK = Math.min(1, dt * (7 * (1 + 0.3 * skLv("b_pull"))));
    for (const e of ents) {
      if (e.kind !== "hunter" && e.kind !== "spitter" && e.kind !== "reaver" && e.kind !== "warden") continue;
      const dx = p.x - e.x, dy2 = p.y - e.y, dd = Math.hypot(dx, dy2);
      if (dd < pullR && dd > 1) { e.x += dx / dd * Math.min(dd, 220 * dt); e.y += dy2 / dd * Math.min(dd, 220 * dt); e.pulled = 0.3; }
      else if (e.pulled > 0) e.pulled = Math.max(0, e.pulled - dt);
    }
  }
  /* 台风眼标记：到点自己掉 */
  for (const e of ents) if (e.markT > 0) e.markT = Math.max(0, e.markT - dt);

  /* --- 加速：只有还有氧气才能踩 --- */
  G.boosting = I.boost && G.o2 > 0;
  if (G.slowT > 0) G.slowT = Math.max(0, G.slowT - dt);
  let target = G.boosting ? G.m.boost : G.m.base;
  if (fx.dash > 0) target = Math.max(target, G.m.base * CFG.dashMul);   // 突进期间至少这么快
  if (G.slowT > 0) target *= CFG.hitSlowMul;
  G.speed += (target - G.speed) * Math.min(1, dt * (G.boosting ? CFG.boostRamp : CFG.speedRamp));

  /* --- 深度与分数 --- */
  const dm = G.speed * dt / CFG.pxPerMeter;
  G.depth += dm;
  if (G.boosting) G.bonus += dm * (boostMulNow() - 1);
  if (G.depth >= G.nextLv) levelUp();          // 到点就三选一（状态切 levelup，本帧剩余照跑）

  /* --- 氧气（深渊压力：越深耗得越快）--- */
  const dk = G.diff = diffK(G.depth);
  const deepMul = 1 + Math.max(0, G.depth - CFG.deepFrom) / CFG.deepSpan;    // 深水不封顶斜坡
  const drain = CFG.o2Drain * (G.boosting ? CFG.boostDrainMul : 1) * (1 + dk * CFG.drainGain) * G.m.drain * deepMul;
  G.o2 -= drain * dt;

  /* --- 视野 --- */
  /* 视野：质变·灯塔长明把下限锁死（不再随深度收窄 —— 深水里视野是最贵的资源） */
  const litBase = lerp(CFG.lightNear, CFG.lightFar, clamp(G.depth / CFG.lightSpan, 0, 1)) + CFG.lightMut * skLv("a_light");
  const lit = Math.max(G.m.lightLock || 0, litBase);
  G.lightBonus = Math.max(0, G.lightBonus - CFG.jellyDecay * dt);
  /* 探照：生效期间把光照半径硬顶到 flare，时间一到自己退回背景值（不是永久加成） */
  let litTarget = lit + G.lightBonus;
  if (fx.flare > 0) litTarget = Math.max(litTarget, G.m.flare);
  G.lightR += (litTarget - G.lightR) * Math.min(1, dt * 3);

  /* --- 转向：键盘＝按住踩油门（轻点微调 / 长按全速），鼠标＝比例控制 --- */
  let want = 0;
  const kdir = (I.right ? 1 : 0) - (I.left ? 1 : 0);
  if (kdir) {
    I.kbHold = (I.kbHold || 0) + dt;
    const k = clamp((I.kbHold - CFG.kbHold) / CFG.kbRamp, 0, 1);
    const ease = k * k * (3 - 2 * k);                    // smoothstep：起步软、中段快、末端稳
    want = kdir * CFG.maxVX * (CFG.kbTapMul + (1 - CFG.kbTapMul) * ease);
    I.ptrActive = false;                                 // 键盘优先，不和鼠标拖拽抢
  } else {
    I.kbHold = 0;
    if (I.ptrActive) want = clamp((I.ptrX - p.x) * G.m.steer, -CFG.maxVX, CFG.maxVX);
  }
  /* 软边界：贴边 120px 内线性收力（硬钳到 0 会让船像撞墙一样急停） */
  if (want > 0) want *= clamp((CFG.xMax - p.x) / CFG.kbSoftEdge, 0, 1);
  else if (want < 0) want *= clamp((p.x - CFG.xMin) / CFG.kbSoftEdge, 0, 1);
  p.vx += (want - p.vx) * Math.min(1, dt * (kdir ? CFG.kbAccel : G.m.accel));
  p.x += p.vx * dt;
  if (p.x < CFG.xMin) { p.x = CFG.xMin; p.vx = 0; }
  if (p.x > CFG.xMax) { p.x = CFG.xMax; p.vx = 0; }
  if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);

  /* --- 准星（鼠标准心管打哪）与普攻连发 --- */
  const A = G.aim;
  if (I.aimActive) { A.tx = I.ax; A.ty = I.ay; A.idle = 0; }
  else A.idle += dt;
  if (A.idle > CFG.aimIdle) {
    /* 自动瞄准兜底（触屏 / 键盘玩家）：只咬怪物，没怪物就回到正前方 */
    let best = null, bd = 1e9;
    for (const e of ents) {
      if (e.kind !== "hunter" && e.kind !== "spitter") continue;
      const dd = Math.hypot(e.x - p.x, e.y - p.y);
      if (dd < bd) { bd = dd; best = e; }
    }
    if (best && bd < CFG.aimAutoR) { A.tx = best.x; A.ty = best.y; }
    else { A.tx = clamp(p.x, 14, W0 - 14); A.ty = clamp(p.y + CFG.atkReach * 0.7, 70, H0 - 12); }
  }
  A.tx = clamp(A.tx, 14, W0 - 14); A.ty = clamp(A.ty, 70, H0 - 12);
  A.x += (A.tx - A.x) * Math.min(1, dt * CFG.aimLerp);
  A.y += (A.ty - A.y) * Math.min(1, dt * CFG.aimLerp);
  if (A.beam > 0) A.beam = Math.max(0, A.beam - dt);
  A.cd -= dt;
  if (A.cd <= 0) { A.cd = G.m.atkEvery; fireAttack(); }

  /* --- 生成 --- */
  const prog = clamp(G.depth / CFG.rowSpan, 0, 1);
  G.rowT -= dt;
  if (G.rowT <= 0) {
    G.rowT = lerp(CFG.rowNear, CFG.rowFar, prog) * (0.85 + 0.3 * rnd()) * Math.max(0.76, 1 - dk * CFG.rowGain);
    spawnRow(prog, dk);
  }
  G.bubbleT -= dt;
  if (G.bubbleT <= 0) {
    G.bubbleT = rr(CFG.bubbleEvery[0], CFG.bubbleEvery[1]) * (1 + 0.9 * clamp(G.depth / CFG.bubbleThin, 0, 1));
    ents.push({ kind: "bubble", x: rr(64, W0 - 64), y: H0 + 34, r: rr(9, 14), seed: rnd() * 997 });
  }
  G.jellyT -= dt;
  if (G.jellyT <= 0) {
    G.jellyT = rr(CFG.jellyEvery[0], CFG.jellyEvery[1]) * G.m.jellyFreq;
    ents.push({ kind: "jelly", x: rr(70, W0 - 70), y: H0 + 40, r: rr(14, 19), seed: rnd() * 997 });
  }
  /* --- 深海猎食者：1000m 以下才出现；刚过线有适应期，越深才越凶 ---
     2026-09-25：2000m 起加入剃刀鲸（近身冲撞）与圣盾使（三连电球 + 护盾）。 */
  if (G.depth >= CFG.mobFrom) {
    const intro = clamp((G.depth - CFG.mobFrom) / CFG.mobRamp, 0, 1);
    const rate = (CFG.mobIntro + (1 - CFG.mobIntro) * intro) * (CFG.mobDeepen[0] + CFG.mobDeepen[1] * dk);
    const cap = CFG.mobCapBase + Math.round(CFG.mobCapGain * dk) + (G.depth >= 2000 ? 1 : 0);
    let live = 0;
    for (const e of ents) if (e.kind !== "bubble" && e.kind !== "jelly" && e.kind !== "bolt" && e.kind !== "rock" && e.kind !== "cable") live++;
    G.huntT -= dt * rate;
    if (G.huntT <= 0) { G.huntT = rr(CFG.hunterEvery[0], CFG.hunterEvery[1]); if (live < cap) spawnHunter(); }
    G.spitT -= dt * rate;
    if (G.spitT <= 0) { G.spitT = rr(CFG.spitterEvery[0], CFG.spitterEvery[1]); if (live < cap) spawnSpitter(); }
    if (G.depth >= 2000) {
      G.reavT = (G.reavT === undefined ? rr(3, 6) : G.reavT) - dt * rate;
      if (G.reavT <= 0) { G.reavT = rr(CFG.reaverEvery[0], CFG.reaverEvery[1]); if (live < cap) spawnReaver(); }
      G.wardT = (G.wardT === undefined ? rr(6, 10) : G.wardT) - dt * rate;
      if (G.wardT <= 0) { G.wardT = rr(CFG.wardenEvery[0], CFG.wardenEvery[1]); if (live < cap) spawnWarden(); }
    }
  }

  /* --- 实体推进 + 碰撞 --- */
  const dy = G.speed * dt;
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
    /* 电球：自带速度，不跟世界一起滚（它是「扑」过来的，不是「沉」上来的） */
    if (e.kind === "bolt") {
      e.x += e.vx * dt; e.y += e.vy * dt; e.life -= dt;
      if (e.life <= 0 || e.x < -60 || e.x > W0 + 60 || e.y < -60 || e.y > H0 + 60) { ents.splice(i, 1); continue; }
      if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + CFG.playerR) {
        hurtPlayer(Math.round(CFG.boltDmg * (1 + dk * CFG.hitGain) * G.m.dmg), "190,220,255");
        burst(e.x, e.y, 8, "170,215,255");
        ents.splice(i, 1);
      }
      continue;
    }
    /* 电袭者是「悬停射手」：不跟着水流一起滚，靠自己慢慢游上来 ——
       否则世界滚动 + 自己的漂移会让它 3 秒穿过整屏，一枪都来不及放 */
    if (e.kind !== "spitter" && e.kind !== "warden") e.y -= dy;
    /* 怪物自己的动作：猎手加速上冲咬人，喷吐者保持距离放冷枪，
       剃刀鲸横冲直撞（撞完不消失），圣盾使悬停 + 三连电球 */
    if (e.kind === "hunter") {
      e.y -= CFG.hunterRush * dt;
      e.x += clamp(p.x - e.x, -CFG.hunterVX * dt, CFG.hunterVX * dt);
    } else if (e.kind === "spitter") {
      e.y -= CFG.spitterRush * dt;
      e.x += clamp(p.x - e.x, -CFG.spitterVX * dt, CFG.spitterVX * dt);
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > p.y + 70 && e.y < H0 + 30) {
        e.fireT = rr(CFG.boltEvery[0], CFG.boltEvery[1]);
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        ents.push({ kind: "bolt", x: e.x, y: e.y, r: CFG.boltR, vx: Math.cos(a) * CFG.boltSpeed, vy: Math.sin(a) * CFG.boltSpeed, life: 4.5, seed: rnd() * 997 });
        SFX.zap();
      }
    } else if (e.kind === "reaver") {
      /* 剃刀鲸：横着冲过屏幕 + 缓慢上移，撞到人也不消失（冷却 1.2s 后再撞） */
      e.x += e.vx * dt;
      e.y -= 42 * dt;
      if (e.x < -90 || e.x > W0 + 90) { ents.splice(i, 1); continue; }
    } else if (e.kind === "warden") {
      /* 圣盾使：悬停射手，慢慢飘上来；三连电球一轮，轮间隔 wardenFan */
      e.y -= CFG.spitterRush * 0.5 * dt;
      e.x += Math.sin(G.t * 1.4 + e.seed) * 24 * dt;
      e.fireT -= dt;
      if (e.breakT > 0) e.breakT = Math.max(0, e.breakT - dt); else if (e.shieldHp <= 0) { e.shield = true; e.shieldHp = 3; }
      if (e.fireT <= 0 && e.fanN <= 0 && e.y > p.y + 90 && e.y < H0 + 10) { e.fanN = 3; e.fanT = 0; e.fireT = rr(CFG.wardenFan[0], CFG.wardenFan[1]); }
      if (e.fanN > 0) {
        e.fanT -= dt;
        if (e.fanT <= 0) {
          e.fanT = 0.22; e.fanN -= 1;
          const a = Math.atan2(p.y - e.y, p.x - e.x) + rr(-0.16, 0.16);
          ents.push({ kind: "bolt", x: e.x, y: e.y, r: CFG.boltR, vx: Math.cos(a) * CFG.boltSpeed, vy: Math.sin(a) * CFG.boltSpeed, life: 4.5, seed: rnd() * 997 });
          SFX.zap();
        }
      }
    }
    if (e.y < -140) { ents.splice(i, 1); continue; }
    /* 磁力：圈内的收集物朝玩家本体整体收拢（x、y 一起动）。
       旧写法只拽 x —— 上方的东西被拉到同一条竖线上、却照样留在上方飞走，永远吃不到
       （实测：正上方 90px 的气泡最近只到 96px 就出屏了）。收拢量按剩余距离比例
       （每秒 6 倍），越近拽得越紧，也不会过冲。 */
    if (G.m.magnet > 0 && (e.kind === "bubble" || e.kind === "jelly")) {
      const mdx = p.x - e.x, mdy = p.y - e.y;
      if (Math.hypot(mdx, mdy) < G.m.magnet) {
        const mk = Math.min(1, dt * 6);
        e.x += mdx * mk; e.y += mdy * mk;
      }
    }
    const d = obstacleDist(e);
    const rr2 = CFG.playerR;
    if (e.kind === "bubble" || e.kind === "jelly") {
      if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + rr2 + 2) {
        if (e.kind === "bubble") {
          const gain = G.m.bubble * Math.max(0.58, 1 - dk * CFG.bubbleLoss);
          G.o2 = Math.min(o2MaxNow(), G.o2 + gain);
          popup(e.x, e.y, "+" + Math.round(gain) + " 氧", "150,255,210"); SFX.bubble();
        }
        else { G.lightBonus = Math.min(CFG.jellyCap, G.lightBonus + G.m.jellyLight); popup(e.x, e.y, "视野 +" + Math.round(G.m.jellyLight), "190,230,255"); SFX.jelly(); }
        burst(e.x, e.y, 10, e.kind === "bubble" ? "150,255,210" : "190,230,255");
        ents.splice(i, 1);
      }
    } else if (fx.dash > 0 && (e.kind === "rock" || e.kind === "cable") && d < rr2 + 10 && e.dashS !== G.dashStamp) {
      /* 突进撞上去不算撞车，是撞碎：无敌期间给挡路的开个洞。
         dashS 是「哪一次突进已经打过它」的戳记 —— 不加就会每帧（120/s）扣一次 80 血。 */
      e.dashS = G.dashStamp;
      /* 战士·猛撞：撞击伤害加成 */
      const diedO = hurtEnt(i, e, CFG.dashDmg + G.m.ramDmg, "150,255,220");
      if (diedO && G.m.vamp > 0) healVamp(e.x, e.y);
      ramOnHit(e, diedO);
      continue;
    } else if (fx.dash > 0 && G.m.ramDmg > 0 && (e.kind === "hunter" || e.kind === "spitter" || e.kind === "reaver" || e.kind === "warden")
               && Math.hypot(e.x - p.x, e.y - p.y) < rr2 + e.r + 6 && e.dashS !== G.dashStamp) {
      /* 基础突进只撞碎障碍物，点了猛撞才能把怪一起撞了 */
      e.dashS = G.dashStamp;
      const diedM = hurtEnt(i, e, G.m.ramDmg, "150,255,220");
      if (diedM && G.m.vamp > 0) healVamp(e.x, e.y);
      ramOnHit(e, diedM);
      continue;
    } else if (d < rr2 && p.invuln <= 0 && !e.hit) {
      e.hit = true;
      const isMob2 = e.kind === "hunter" || e.kind === "spitter" || e.kind === "reaver" || e.kind === "warden";
      if (isMob2) {
        /* 咬人结算：猎手/电袭者同归于尽；剃刀鲸/圣盾使活着走开（e.cd 冷却后再咬） */
        const dmg = Math.round((e.kind === "reaver" ? CFG.reaverDmg : e.kind === "warden" ? CFG.huntDamage : CFG.huntDamage) * (1 + dk * CFG.hitGain) * G.m.dmg);
        hurtPlayer(dmg, e.kind === "reaver" ? "255,190,120" : "255,150,120");
        if (G.m.thorn && G.m.thorn.d > 0) thornHit(i, e);          // 荆棘甲：反伤（可能反死它）
        if (e.kind === "hunter" || e.kind === "spitter") { burst(e.x, e.y, 20, "255,140,110"); ents.splice(i, 1); }
        else e.cd = 1.2;
      } else {
        hurtPlayer(Math.round(CFG.hitDamage * (1 + dk * CFG.hitGain) * G.m.dmg));
      }
    } else if (e.cd > 0 && e.hit && (e.kind === "reaver" || e.kind === "warden")) {
      e.cd = Math.max(0, e.cd - dt);
      if (e.cd <= 0) e.hit = false;       // 大家伙咬完一口会绕回来再咬：冷却好了才能咬下一口
    } else if (!e.near && (e.kind === "rock" || e.kind === "cable") && d < rr2 + G.m.nearPad) {
      e.near = true;
      G.bonus += G.m.nearBonus;
      popup(p.x + (e.x > p.x ? 30 : -30), p.y - 20, "擦身 +" + G.m.nearBonus, "255,225,150");
      SFX.nomiss();
    }
  }

  if (G.o2 <= 0) { G.o2 = 0; gameOver(); }
}

function update(dt) {
  G.t += dt;
  if (G.shakeT > 0) G.shakeT = Math.max(0, G.shakeT - dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3.2);
  if (G.redFlash > 0) G.redFlash = Math.max(0, G.redFlash - dt * 2.2);
  updateSnow(dt);
  updateParticles(dt);
  updatePopups(dt);
  if (G.state === "play") stepPlay(dt);
  if (G.state === "title" || G.state === "over") { G.speed += (CFG.baseSpeed - G.speed) * Math.min(1, dt * 2); }
  SFX.droneUpdate(clamp((G.speed - CFG.baseSpeed) / (CFG.boostSpeed - CFG.baseSpeed), 0, 1));
}

/* ============================ 7. Render ================================== */
function rrRect(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function text(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 600) + " " + size + 'px "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
/* 卡面描述换行（2026-09-25 玩家截图：护心符那条描述 336px，卡面只有 252px，直接冲出卡边）。
   贪心断行：中文按字断，连续英文/数字/符号（35 10s 之类）当一个整块，不拆开。
   maxW 是「每一行都不许超过的宽度」，字体必须和真正画的时候一致，量了才算数。 */
function wrapText(str, maxW, size, weight) {
  ctx.font = (weight || 600) + " " + size + 'px "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif';
  const toks = String(str).match(/[A-Za-z0-9+×.\-%/]+|\s+|[\s\S]/g) || [];
  const lines = [];
  let line = "";
  for (const tk of toks) {
    if (tk === "\n") { lines.push(line); line = ""; continue; }
    if (line && ctx.measureText(line + tk).width > maxW) { lines.push(line); line = tk.replace(/^\s+/, ""); }
    else line += tk;
  }
  lines.push(line);
  return lines;
}
function panel(x, y, w, h) {
  rrRect(x, y, w, h, 18);
  ctx.fillStyle = "rgba(4,14,26,0.84)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,190,230,0.26)"; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawEntity(e) {

  ctx.strokeStyle = "rgba(150,235,255,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  const pw = Math.max(2.5, pb.r * 0.17), ph = pb.r * 0.86;      // 两条竖杠 = 暂停
  ctx.fillStyle = "#dff6ff";
  ctx.fillRect(pb.x - pw * 2, pb.y - ph / 2, pw, ph);
  ctx.fillRect(pb.x + pw, pb.y - ph / 2, pw, ph);
}

function drawWorld() {
  const d = clamp(G.depth / 1200, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H0);
  g.addColorStop(0, mixRgb([10, 38, 66], [1, 4, 12], d));
  g.addColorStop(1, mixRgb([22, 70, 108], [3, 10, 22], d));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W0, H0);
  /* 光柱 */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 4; i++) {
    const bx = 60 + i * 250 + Math.sin(G.t * 0.25 + i) * 26;
    const lg = ctx.createLinearGradient(bx, 0, bx + 90, H0 * 0.9);
    lg.addColorStop(0, "rgba(130,205,255," + (0.085 * (1 - d)).toFixed(3) + ")");
    lg.addColorStop(1, "rgba(130,205,255,0)");
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(bx - 34, 0); ctx.lineTo(bx + 34, 0);
    ctx.lineTo(bx + 150, H0 * 0.9); ctx.lineTo(bx - 110, H0 * 0.9);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  /* 浮游雪 */
  for (const s of G.snow) {
    ctx.globalAlpha = s.a * (0.35 + 0.65 * (1 - d));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = "#bfe6ff"; ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const e of ents) drawEntity(e);
  for (const q of G.particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a * 0.9;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgb(" + q.col + ")"; ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (G.state === "play" || G.state === "pause" || G.state === "over") drawPlayer();
  else { const bx = p.x, by = p.y; p.x = W0 / 2; p.y = 78 + Math.sin(G.t * 1.4) * 7; drawPlayer(); p.x = bx; p.y = by; }
  /* 拾取飘字 */
  for (const q of G.popups) {
    ctx.globalAlpha = clamp(q.life / 0.9, 0, 1);
    text(q.text, q.x, q.y, 14, "rgba(" + q.col + ",1)", "center", 700);
  }
  ctx.globalAlpha = 1;
  /* 黑暗 / 视野：光照半径之外 alpha=1（纯黑）—— 轮廓、气泡一律看不见。
     早先是「全屏压暗 + 一圈渐变」，半径外还剩 55~65% 亮度，等于自带夜视仪。 */
  const px = p.x, py = p.y + (G.state === "play" ? Math.sin(G.t * 2.2) * 3 : 0);
  const lr = Math.max(90, G.lightR);
  const dg = ctx.createRadialGradient(px, py, lr * 0.20, px, py, lr);
  dg.addColorStop(0, "rgba(2,8,18,0)");
  dg.addColorStop(0.52, "rgba(2,8,18," + (0.30 + 0.34 * d).toFixed(3) + ")");
  dg.addColorStop(0.80, "rgba(2,8,18," + (0.80 + 0.20 * d).toFixed(3) + ")");
  dg.addColorStop(1, "rgba(2,8,18,1)");
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W0, H0);
  /* 水母例外：它是光源，得在黑暗层之上重绘一遍，否则一样被吞进纯黑 */
  for (const e of ents) if (e.kind === "jelly") drawJellyGlow(e);
  /* 猎食者/电球也是生物光：不在光照半径内照样看得见它们扑过来（否则 1000m 以下纯挨打）；
     但障碍物不是光源 —— 光照半径外它就该是黑的（玩家口径：半径外啥也看不见） */
  for (const e of ents) if (MOB_SET[e.kind]) drawCombatGlow(e);
  for (const e of ents) drawHpBar(e);
  drawActiveFx();
  drawAim();
  /* 受伤红闪 */
  if (G.redFlash > 0) {
    ctx.fillStyle = "rgba(255,60,60," + (G.redFlash * 0.22).toFixed(3) + ")";
    ctx.fillRect(0, 0, W0, H0);
  }
}

/* 主动技能特效：都画在黑暗层之上（深水里不放光就等于没放） */
function drawActiveFx() {
  const fx = G.actFx;
  if (fx.shock > 0) {
    const k = clamp(1 - fx.shock / 0.45, 0, 1);          // 0→1 向外扩散
    const Rr = G.m.shockR * (0.25 + 0.85 * k);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.max(0, 1 - k) * 0.9;
    ctx.beginPath(); ctx.arc(fx.sx, fx.sy, Rr, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(170,240,255,0.95)"; ctx.lineWidth = 1.5 + 6 * (1 - k); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx.sx, fx.sy, Rr * 0.72, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,225,170,0.7)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  if (fx.shock2 && fx.shock2.t > 0) {
    /* 质变·雷暴二响：第二响的环（画在原地，不是玩家脚下） */
    const k2 = clamp(1 - fx.shock2.t / 0.42, 0, 1);
    const R2 = fx.shock2.r * (0.25 + 0.85 * k2);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.max(0, 1 - k2) * 0.9;
    ctx.beginPath(); ctx.arc(fx.shock2.x, fx.shock2.y, R2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(195,200,255,0.95)"; ctx.lineWidth = 1.5 + 6 * (1 - k2); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx.shock2.x, fx.shock2.y, R2 * 0.7, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(220,235,255,0.6)"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
  }
  if (fx.dash > 0) {
    const a = clamp(fx.dash / Math.max(0.001, G.m.dashT), 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.55 * a;
    const g = ctx.createLinearGradient(p.x, p.y - 130, p.x, p.y + 10);
    g.addColorStop(0, "rgba(120,255,215,0)");
    g.addColorStop(1, "rgba(150,255,225,0.85)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(p.x - 4, p.y + 10); ctx.lineTo(p.x + 4, p.y + 10);
    ctx.lineTo(p.x + 17, p.y - 130); ctx.lineTo(p.x - 17, p.y - 130);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  /* 探照生效期间给屏幕边缘一圈冷光，提示「现在是技能在照，不是背景变亮了」 */
  if (fx.flare > 0) {
    const a = clamp(fx.flare / Math.max(0.001, G.m.flareT), 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.16 * a;
    ctx.fillStyle = "rgba(150,215,255,1)";
    ctx.fillRect(0, 0, W0, 10); ctx.fillRect(0, H0 - 10, W0, 10);
    ctx.restore();
  }
  /* 质变·深灯火环：常亮光环（被动，不用按）。画在黑暗层之上，深水里也得看得见自己在发光 */
  if (G.haloR > 0 && (G.state === "play" || G.state === "pause")) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(p.x, p.y, G.haloR * 0.55, p.x, p.y, G.haloR);
    g.addColorStop(0, "rgba(150,215,255,0)");
    g.addColorStop(0.85, "rgba(150,215,255," + (0.10 + 0.03 * Math.sin(G.t * 3)).toFixed(3) + ")");
    g.addColorStop(1, "rgba(190,235,255,0.02)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, G.haloR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(190,235,255,0.35)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, G.haloR, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  /* 护心符：符咒环绕（被动神器，默认生效）。生效期间转圈，冷却期间收进本体 */
  if (G.m && G.m.amu && G.amuT > 0 && (G.state === "play" || G.state === "pause")) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = clamp(G.amuT / G.m.amu.t, 0, 1);
    for (let k = 0; k < G.m.amu.n; k++) {
      const ang = (G.amuAng || 0) + k * Math.PI * 2 / G.m.amu.n;
      const fx2 = p.x + Math.cos(ang) * G.m.amu.r, fy2 = p.y + Math.sin(ang) * G.m.amu.r;
      const g = ctx.createRadialGradient(fx2, fy2, 1, fx2, fy2, 14);
      g.addColorStop(0, "rgba(255,235,170," + (0.85 * a).toFixed(2) + ")");
      g.addColorStop(1, "rgba(255,200,90,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx2, fy2, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,246,210," + (0.95 * a).toFixed(2) + ")";
      ctx.font = "700 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("符", fx2, fy2 + 1);
    }
    ctx.restore();
  }
}
/* 水母是光源：黑暗层之上重画一遍（加色），保证光照半径外仍看得见它游过来 */
function drawJellyGlow(e) {
  const pulse = 1 + Math.sin(G.t * 3 + e.seed) * 0.14;
  const rad = e.r * 5.6 * pulse;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, rad);
  g.addColorStop(0, "rgba(175,220,255,0.50)");
  g.addColorStop(0.45, "rgba(110,175,255,0.15)");
  g.addColorStop(1, "rgba(90,150,255,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(e.x, e.y, rad, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(e.x, e.y, e.r * pulse, e.r * 0.78 * pulse, 0, Math.PI, 0);
  ctx.fillStyle = "rgba(215,240,255,0.70)"; ctx.fill();
  ctx.restore();
}

/* 黑暗层之上重绘的「生物光」白名单：只有真会扑上来咬人的家伙自带光。
   坑（2026-09-25 玩家截图）：调用点原来写的是「不是气泡、不是水母就重绘一笔」，
   而重绘的兜底分支画的是「紫伞 + 5 根触手 + 中央亮核」＝电袭者的样子 ——
   于是每块石头、每条泥鳅在黑暗里都顶着一只紫色水母（探针实测：石头 1479 个紫像素、
   泥鳅 629 个，最亮 rgb(187,159,243) 就是那只假水母的伞边）。 */
const MOB_SET = { hunter: 1, spitter: 1, reaver: 1, warden: 1, bolt: 1 };
/* 猎食者的生物光 + 本体：都画在黑暗层之上，保证光照半径外也看得清（不然深水区纯挨打） */
function drawCombatGlow(e) {
  const rad = e.r * (e.kind === "hunter" ? 2.8 : e.kind === "bolt" ? 3.4 : 3.0);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(e.x, e.y, 1, e.x, e.y, rad);
  if (e.kind === "hunter") { g.addColorStop(0, "rgba(255,95,70,0.38)"); g.addColorStop(1, "rgba(255,60,40,0)"); }
  else if (e.kind === "spitter") { g.addColorStop(0, "rgba(175,140,255,0.38)"); g.addColorStop(1, "rgba(140,110,255,0)"); }
  else if (e.kind === "reaver") { g.addColorStop(0, "rgba(255,150,80,0.42)"); g.addColorStop(1, "rgba(255,110,40,0)"); }
  else if (e.kind === "warden") { g.addColorStop(0, "rgba(255,225,120,0.45)"); g.addColorStop(1, "rgba(255,190,60,0)"); }
  else { g.addColorStop(0, "rgba(180,225,255,0.45)"); g.addColorStop(1, "rgba(120,180,255,0)"); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(e.x, e.y, rad, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  if (e.kind === "bolt") return;                       // 电球本体在 drawEntity 里已经够亮
  /* 本体轮廓：黑暗里只剩一团糊的话，玩家没法判断该往哪打 */
  const x = e.x, y = e.y;
  ctx.save();
  if (e.kind === "hunter") {
    const R0 = e.r, wob = Math.sin(G.t * 9 + e.seed) * 2;
    ctx.beginPath();
    ctx.moveTo(x, y - R0 * 1.55);
    ctx.lineTo(x + R0 * 1.05, y + R0 * 0.30);
    ctx.lineTo(x + R0 * 0.30, y + R0 * 0.12);
    ctx.lineTo(x, y + R0 * 1.30 + wob);
    ctx.lineTo(x - R0 * 0.30, y + R0 * 0.12);
    ctx.lineTo(x - R0 * 1.05, y + R0 * 0.30);
    ctx.closePath();
    ctx.fillStyle = e.flash > 0 ? "rgba(255,235,225,0.95)" : "rgba(72,15,19,0.86)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,125,100,0.9)"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = "rgba(255,105,80,1)";
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(x + sx * R0 * 0.34, y - R0 * 0.62, 3.4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    }
  } else if (e.kind === "reaver") {
    /* 剃刀鲸：横着的巨型刀鱼，冲撞方向朝前，背部一排利鳍 */
    const R0 = e.r, dir = e.vx >= 0 ? 1 : -1;
    ctx.save();
    ctx.translate(x, y); ctx.scale(dir, 1);
    ctx.beginPath();
    ctx.moveTo(R0 * 1.5, 0);
    ctx.quadraticCurveTo(R0 * 0.4, -R0 * 0.75, -R0 * 1.35, -R0 * 0.28);
    ctx.quadraticCurveTo(-R0 * 0.9, 0, -R0 * 1.35, R0 * 0.34);
    ctx.quadraticCurveTo(R0 * 0.4, R0 * 0.72, R0 * 1.5, 0);
    ctx.closePath();
    ctx.fillStyle = e.flash > 0 ? "rgba(255,240,225,0.95)" : "rgba(84,38,8,0.88)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,170,90,0.95)"; ctx.lineWidth = 1.8; ctx.stroke();
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-R0 * 0.9 + i * R0 * 0.55, -R0 * 0.42);
      ctx.lineTo(-R0 * 0.65 + i * R0 * 0.55, -R0 * 0.95);
      ctx.lineTo(-R0 * 0.45 + i * R0 * 0.55, -R0 * 0.40);
      ctx.closePath();
      ctx.fillStyle = "rgba(255,150,80,0.85)"; ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(R0 * 0.85, -R0 * 0.18, 3.6, 2.3, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,225,150,1)"; ctx.fill();
    ctx.restore();
  } else if (e.kind === "warden") {
    /* 圣盾使：金钟水母 + 一圈护盾弧（盾开着才画）；蓄力时中央亮起 */
    const pulse = 1 + Math.sin(G.t * 3 + e.seed) * 0.08;
    const sh = e.shield && e.breakT <= 0;
    ctx.beginPath();
    ctx.ellipse(x, y, e.r * pulse, e.r * 0.9 * pulse, 0, Math.PI, 0);
    ctx.fillStyle = e.flash > 0 ? "rgba(255,250,230,0.95)" : "rgba(120,95,20,0.85)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,225,120,0.95)"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.strokeStyle = "rgba(255,215,110,0.8)"; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * e.r * 0.36, y + e.r * 0.1);
      ctx.quadraticCurveTo(x + i * e.r * 0.36 + Math.sin(G.t * 5 + i + e.seed) * 5, y + e.r * 0.85, x + i * e.r * 0.36, y + e.r * 1.4);
      ctx.stroke();
    }
    if (sh) {
      ctx.beginPath(); ctx.arc(x, y, e.r * 1.65, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,235,150," + (0.35 + 0.2 * Math.sin(G.t * 6)).toFixed(2) + ")";
      ctx.lineWidth = 2.4; ctx.stroke();
      ctx.fillStyle = "rgba(255,225,120,0.6)";
      for (let k = 0; k < e.shieldHp; k++) {
        ctx.beginPath(); ctx.arc(x - 10 + k * 10, y - e.r * 1.65 - 8, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
  } else if (e.kind === "spitter") {
    /* 电袭者（紫伞）：悬停射手 —— 只有它走这套紫伞外观，别的 kind 一律不画 */
    const pulse = 1 + Math.sin(G.t * 4 + e.seed) * 0.10;
    const ch = clamp(1 - e.fireT / 0.9, 0, 1);
    ctx.beginPath();
    ctx.ellipse(x, y, e.r * pulse, e.r * 0.85 * pulse, 0, Math.PI, 0);
    ctx.fillStyle = e.flash > 0 ? "rgba(240,245,255,0.95)" : "rgba(78,58,140,0.86)";
    ctx.fill();
    ctx.strokeStyle = "rgba(200,170,255,0.9)"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.strokeStyle = "rgba(190,160,255,0.8)"; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * e.r * 0.36, y + e.r * 0.1);
      ctx.quadraticCurveTo(x + i * e.r * 0.36 + Math.sin(G.t * 6 + i + e.seed) * 5, y + e.r * 0.85, x + i * e.r * 0.36, y + e.r * 1.5);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y + e.r * 0.3, 3 + ch * 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255," + Math.round(205 - ch * 130) + ",125," + (0.55 + ch * 0.45).toFixed(2) + ")";
    ctx.fill();
  }
  /* 台风眼·裂痕标记：一个转圈的紫金色角标，一眼看出「这货正在挨额外打」 */
  if (e.markT > 0) {
    ctx.save();
    ctx.translate(x, y - e.r - 14);
    ctx.rotate(G.t * 2.4);
    ctx.strokeStyle = "rgba(255,170,240,0.95)"; ctx.lineWidth = 2.2;
    for (let k = 0; k < 3; k++) { ctx.rotate(Math.PI * 2 / 3); ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI / 2.6); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
}
/* 血条：打过才显示（满血不糊脸），画在黑暗之上 —— 否则深水区连血条都看不见 */
function drawHpBar(e) {
  if (!e.maxHp || e.hp <= 0 || e.hp >= e.maxHp) return;
  const w = Math.max(30, e.r * 2.4), h = 3.5;
  const bx = e.x - w / 2, by = e.y - e.r - (e.kind === "hunter" ? 26 : 16);
  ctx.fillStyle = "rgba(6,14,24,0.8)"; ctx.fillRect(bx, by, w, h);
  const f = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = f > 0.5 ? "rgba(150,235,190,0.95)" : "rgba(255,180,120,0.95)";
  ctx.fillRect(bx, by, w * f, h);
}
/* 准星（AD 操控）+ 普攻光束：都画在黑暗层之上 —— 光是打出去的，不该被黑暗吃掉 */
function drawAim() {
  if (G.state !== "play" && G.state !== "pause") return;
  const A = G.aim;
  const [ex, ey] = aimPoint();
  ctx.save();
  /* 瞄准导引线：从玩家指向准星，弱到自己不抢戏 */
  ctx.strokeStyle = "rgba(255,190,120,0.16)";
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.setLineDash([]);
  if (A.beam > 0) {
    const a = A.beam / CFG.beamT;                       // 1 → 0 的视觉残留
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    const beams = [[A.ex, A.ey]].concat(A.extra || []);
    for (let k = 0; k < beams.length; k++) {
      const [tx, ty] = beams[k];
      ctx.strokeStyle = "rgba(255,190,120," + (0.50 * a).toFixed(3) + ")";
      ctx.lineWidth = 12 * a + 3;
      ctx.beginPath(); ctx.moveTo(A.sx, A.sy); ctx.lineTo(tx, ty); ctx.stroke();

function render() {
  ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
  ctx.fillStyle = "#02060d";
  ctx.fillRect(0, 0, R.cw, R.ch);
  ctx.setTransform(R.dpr * R.scale, 0, 0, R.dpr * R.scale, R.dpr * R.ox, R.dpr * R.oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W0, H0); ctx.clip();
  let sx = 0, sy = 0;
  if (G.shakeT > 0) {
    const m = G.shakeMag * (G.shakeT / 0.7);
    sx = (Math.random() * 2 - 1) * m; sy = (Math.random() * 2 - 1) * m;
  }
  ctx.translate(sx, sy);
  if (SELFTEST.active) {
    drawSelfTest();
    ctx.restore();
    return;
  }
  drawWorld();
  if (G.state === "play" || G.state === "pause" || G.state === "levelup") {
    /* 选牌时把 HUD 压暗：否则「100 米」会和「深渊馈赠」标题叠在一起，看着像花了屏 */

    ents.push({ kind: "rock",    x: p.x - 250, y: py + 10,  r: 28, hp: 50,  maxHp: CFG.rockHP,    seed: 21, flash: 0 });
    ents.push({ kind: "cable",   x: p.x + 300, y: py + 90,  r: 17, len: 90, hp: 30, maxHp: CFG.cableHP, seed: 33, flash: 0 });
    ents.push({ kind: "bolt",    x: p.x + 130, y: py + 150, r: CFG.boltR, vx: -60, vy: -120, life: 3, seed: 5 });
    G.input.aimActive = false; G.aim.idle = 99;
    G.aim.tx = G.aim.x = p.x - 150; G.aim.ty = G.aim.y = py + 120;
    /* 截图要把整场战斗都照亮，不然一半零件埋在纯黑里（黑暗验收另有 dark 场景） */
    G.lightR = 560; G.lightBonus = 0;
    fireAttack();
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "active") {
    /* 主动技能验收截图：选「法师」→ Q 放出去正在扩散、按钮转冷却；
       另外两个按钮没选，画虚线写「封」。摆一圈目标进去，一眼看出范围内被打掉了。 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.route = "mage"; recalcMods();            // 技能得先选出来：没选路线 tryActive 一律拒绝
    G.depth = parseFloat(q.get("depth") || "1300") || 1300;
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    const py = p.y + 190;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI * 0.75 + i * (Math.PI * 1.5 / 4);
      ents.push({ kind: i % 2 ? "hunter" : "rock", x: clamp(p.x + Math.cos(a) * 190, 50, W0 - 50), y: py + Math.sin(a) * 160,
                  r: i % 2 ? 20 : 28, hp: i % 2 ? 60 : 70, maxHp: i % 2 ? CFG.hunterHP : CFG.rockHP, seed: 5 + i * 7, flash: 0 });
    }
    G.lightR = 620; G.lightBonus = 0;
    G.o2 = 58;
    tryActive("q");                            // 放得出来：Q 的冷却扇形进画面
    fireAttack();
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "active2") {
    /* 探照生效中：光照半径被技能顶到最大，黑暗被推开（对比 09-dark） */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.depth = parseFloat(q.get("depth") || "1200") || 1200;
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    G.o2 = 62;
    G.route = "lamp"; recalcMods();             // 探照只属于「照明使者」
    G.lightR = lerp(CFG.lightNear, CFG.lightFar, clamp(G.depth / CFG.lightSpan, 0, 1));
    tryActive("f");
    for (let i = 0; i < 90; i++) update(STEP);      // 让光照过渡到位
    for (const e of ents) if (e.kind === "hunter") e.x = clamp(e.x, 90, W0 - 90);
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "mutate") {
    /* 质变验收截图：跑到 2000m 停在质变三选一卡面上（挂机 AI 撑不到 2km：保氧不死） */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    let guard = 0;
    while ((G.state === "play" || G.state === "levelup") && guard++ < 120 * 2400) {
      if (G.state === "levelup") { if (!aiPick()) break; }
      G.o2 = Math.max(G.o2, 90);
      autopilot(STEP); update(STEP);
      if (!G.mutate && G.route && G.depth >= CFG.mutateAt && G.state === "levelup") break;
    }
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "deepmob") {
    /* 深水怪验收截图：2000m 场地摆一只剃刀鲸 + 一只开盾的圣盾使 + 护心符转着 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.depth = 2100; G.route = "mage"; recalcMods();
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    const py = p.y + 170;
    ents.push({ kind: "reaver", x: p.x - 210, y: py + 40, r: 30, hp: 320, maxHp: 320, seed: 7, hit: false, near: false, flash: 0, vx: 200 });
    ents.push({ kind: "warden", x: p.x + 180, y: py + 20, r: 22, hp: 260, maxHp: 260, seed: 15, hit: false, near: false, flash: 0, fireT: 1.6, fanN: 0, fanT: 0, shield: true, shieldHp: 3, breakT: 0 });
    ents.push({ kind: "hunter", x: p.x + 40, y: py + 130, r: 20, hp: 300, maxHp: 300, seed: 21, hit: false, near: false, flash: 0 });
    G.sk = { a_amulet: 1 }; recalcMods();
    G.amuT = G.m.amu.t; G.amuCd = G.m.amu.cd; G.amuAng = 0.6;      // 符咒当场转起来
    G.lightR = 560; G.lightBonus = 0; G.o2 = 72;
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "help") {
    /* 规则弹层截图：标题页点「?」之后的样子 */
    G.helpOpen = true;
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("auto") !== null) {
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    const n = clamp(parseInt(q.get("auto"), 10) || 0, 0, 120 * 600);
    for (let i = 0; i < n; i++) { if (G.state === "levelup") aiPick(); update(STEP); }
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "play") {
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
  }
  requestAnimationFrame(frame);
}
init();
</script>
