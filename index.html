<script>
"use strict";
/* =============================================================================
   深潜 · SINK  —  单文件网页小游戏（零依赖 / 零素材 / 零网络请求）
   -----------------------------------------------------------------------------
   核心循环：深度 = 分数；氧气是唯一生命；加速下潜 = ×2.5 得分但氧气 ×2、视野更小。
   「越贪越快，越快越瞎。」
   分区：0 Config · 1 Utils · 2 Store · 3 Audio · 4 Canvas · 5 State
        6 Update · 7 Render · 8 Input · 9 Loop · 10 SelfTest/Debug
   ============================================================================= */

/* ============================ 0. Config ================================== */
const W0 = 960, H0 = 600;              // 逻辑分辨率（渲染层按等比缩放铺满窗口）
const CFG = {
  pxPerMeter: 12,                      // 12 逻辑像素 = 1 米
  baseSpeed: 130,                      // 正常下潜 px/s
  boostSpeed: 360,                     // 加速下潜 px/s
  boostMul: 2.5,                       // 加速段得分倍率
  playerR: 13,
  playerY: 192,
  xMin: 46, xMax: W0 - 46,
  maxVX: 640, steerK: 14, accelK: 20,  // 转向手感
  /* 键盘转向（A/D）：按住＝踩油门（轻点微调 / 长按全速），不是一按就到顶的火箭。
     原来 want 直接给 ±maxVX，实测轻点 0.16s 就冲到 97% 全速、贴边还剩 461px/s 撞墙 → 又冲又不准。 */
  kbAccel: 24, kbHold: 0.12, kbRamp: 0.35, kbTapMul: 0.30,
  kbSoftEdge: 120,                     // 贴边 120px 内线性收力：软着陆，不撞墙急停
  boostRamp: 24, speedRamp: 9,         // 下潜手感：踩加速要脆(τ≈42ms)，松开要顺(τ≈110ms)
  o2Max: 100,
  o2Drain: 1.12,                       // 基础 1.12/s → 约 89 秒
  boostDrainMul: 2.05,
  /* --- 深渊压力：随深度缓慢加压，曲线 d/(d+diffHalf) 永远爬不到顶 --- */
  diffHalf: 1500,                      // 600m→29% · 1500m→50% · 4500m→75%（深水段原样不动）
  diffGrace: 160,                      // 前 160m 不计压力（缓坡起步）：600m→23% · 900m→33%（原来 38%）
  drainGain: 0.50,                     // 氧气消耗 ×(1+压力×0.50)
  bubbleLoss: 0.20,                    // 气泡含氧 ×(1-压力×0.20)，最低保 58%
  hitGain: 0.45,                       // 撞击伤害 ×(1+压力×0.45)
  rowGain: 0.14,                       // 障碍行更密 ×(1-压力×0.14)，最低 0.76×
  gapGain: 0.08,                       // 安全走廊更窄 ×(1-压力×0.08)
  extraObst: 0.30,                     // 每行多塞一个障碍的概率 = 压力×0.30
  hitDamage: 15,
  bubbleO2: 13,
  bubbleThin: 700,                     // 越深气泡越稀：间隔 ×(1+depth/700×0.9)。
                                       // 原来 4000 太松 —— 深水「完美捡泡 = 净回氧」，脚本对局 3/9 种子跑成 300s 不朽。
                                       // 改 700 后有氧上限才是真的上限：中位 87.6s、8/9 落在 60~120s 带内。
  invulnTime: 1.2,
  hitSlowTime: 0.65, hitSlowMul: 0.45,
  nearMissBonus: 5, nearMissPad: 22,
  lightNear: 360, lightFar: 150, lightSpan: 900,
  lightMut: 60,                        // 质变·灯距：每级 +60（永久视野）
  jellyLight: 200, jellyDecay: 9, jellyCap: 560,   // 捡一只：视野 +200，约 22s 才衰减干净（原来 90/26，两秒就没了）
  rowNear: 0.72, rowFar: 0.34, rowSpan: 1300,   // 障碍行间隔随深度收紧
  gapNear: 330, gapFar: 215,                    // 安全走廊宽度
  gapStep: 200,                                 // 相邻走廊最大横移（保证「过得去」）
  bubbleEvery: [0.45, 1.05],
  jellyEvery: [5.5, 9.5],
  /* --- 战斗：准星 + 普攻（AD 推准星，光束打在准星那条线上） --- */
  atkDmg: 50,                          // 单发伤害：石头 100 血＝两发，泥鳅 30 血＝一发
  atkEvery: 0.50,                      // 连发间隔（速射技能缩它）
  atkReach: 300,                       // 准星在玩家正前方多远（逻辑像素）
  atkHalfW: 22,                        // 光束半宽＝判定宽容度（散射技能加宽它）
  beamT: 0.13,                         // 光束视觉残留
  aimLerp: 16,                         // 准星跟手速度（越大越硬）
  aimAutoR: 520,                       // 自动瞄准：这个距离内最近的怪物会被准星咬住
  aimIdle: 2.5,                        // 鼠标停手多久后交给自动瞄准（一动鼠标立刻收回控制权）
  rockHP: 100, cableHP: 30,            // 石头 / 泥鳅（线缆）血量
  /* --- 深海猎食者：1000m 以下才出现，且刚过线有一段适应期 ---
     注意：怪是所有氧气压力的主承重墙 —— 砍太狠局时会失控变长（实测砍 5 倍 → 中位 183s、3 局撞 300s 上限）。
     所以浅段只留 35% 的爬升，深段反而要比原版更凶（原 deepen=0.7+1.4×压力）。 */
  mobFrom: 1000,
  mobRamp: 400, mobIntro: 0.30,        // 只软化 1000~1400m 这一段，1400m 起恢复原版压力
  mobCapBase: 2, mobCapGain: 4,        // 同时在场上限 = 2 + 4×压力（压力 0.4→4 只，0.63→5 只）
  mobDeepen: [0.70, 1.40],             // 深段倍率 = 0.70 + 1.40×压力（＝原版，别动）
  hunterHP: 150, hunterEvery: [2.1, 3.7], hunterRush: 215, hunterVX: 200, huntDamage: 18,
  spitterHP: 90, spitterEvery: [2.8, 4.6], spitterRush: 70, spitterVX: 130,
  boltEvery: [1.3, 2.0], boltDmg: 12, boltSpeed: 235, boltR: 8,
  /* --- 2026-09-25 玩家反馈：后期怪太软（照明使者原地放技能就能躺赢） ---
     两手：① 1800m 起所有怪物血量爬坡（×2 → ×3 封顶）；② 2000m 起新增两种猎食者。
     剃刀鲸：斜插猛冲的大家伙，撞完不消失，逼你真的挪位置；
     圣盾使：金钟水母放三连电球，盾开着减伤 75%，盾碎 3.5s 才能重开 —— 先破盾再输出。 */
  mobHpFrom: 1800, mobHpSpan: 1600, mobHpCap: 3,
  reaverHP: 320, reaverEvery: [4.5, 7.5], reaverRush: 95, reaverVX: 265, reaverDmg: 22,
  wardenHP: 260, wardenEvery: [6.0, 9.5], wardenFan: [2.4, 3.4], wardenShieldCut: 0.75, wardenBreakT: 3.5,
  /* --- 2026-09-25 玩家口径「多加几个怪物，各带一点小机制，3000/4000/5000m 逐千米出现」---
     裂腹鱼（3000m）：打死不是结束，是一刀两断成两条幼体（幼体快而脆，不再分裂）。
     吸氧蛭（4000m）：不咬血，贴上来挂在你身上抽氧 —— 突进能当场甩掉，打死也算甩掉。
     熄灯鮟鱇（5000m）：不追着撞你，它吞你的灯光 —— 活着就按距离压视野，打死才把光还你。 */
  splitFrom: 3000, splitHP: 210, splitEvery: [5.0, 8.5], splitRush: 88, splitVX: 165, splitDmg: 16,
  splitKidHP: 0.32, splitKidSpd: 1.55, splitKidDmg: 0.6, splitKidR: 15,
  leechFrom: 4000, leechHP: 130, leechEvery: [6.5, 10.5], leechRush: 115, leechVX: 125,
  leechDrain: 0.15, leechHold: 4.5, leechRel: 1.4,
  lampFrom: 5000, lampHP: 380, lampEvery: [7.5, 12.0], lampRush: 62, lampVX: 95, lampDmg: 20,
  lampEat: 0.45, lampEatR: 320, lampDrop: 90,
  killScore: 40, breakScore: 6,
  /* --- 击杀回氧：自带被动，不用选技能（回的是「氧气上限的百分比」，不随深度缩水）
     但它天生是「无限刷」：怪随深度变多，回氧速率会超过耗氧 1.12~1.68/s ——
     实测 killO2=0.10 无递减时 12/12 种子跑成 300s 不朽（平均回氧 2057，撞穿计时上限）。
     所以加连杀递减：一波里的第一只满额（＝你要的 10%），killComboReset 秒内再杀按 killComboMul 逐只打折。
     0.50/8.0 是 7 变体×12 种子扫出来的最优：12/12 落在 60~120s 带内（中位 95.6s，范围 75~110），
     比「完全关掉回氧」的 11/12 还稳，平均回氧 20.8 —— 手感有了，无限刷没了。 --- */
  killO2: 0.10,
  killComboMul: 0.50, killComboReset: 8.0,
  /* --- 主动技能（Q/E/F）：冷却制，要玩家自己按，绝不跟普攻一起自动放 --- */
  /* 2026-09-25 玩家反馈：冷却太长了 → 7s 降到 4s（「凝神」每级 ×0.88，点满 5 级约 2.1s） */
  shockCd: 4.0, shockR: 240, shockMob: 150, shockObst: 200,   // 冲击波：以本体为圆心的清场
  dashCd: 5.0, dashT: 1.1, dashMul: 2.4, dashDmg: 80,         // 突进：提速 + 撞碎挡路的
  /* 2026-09-26 玩家口径「冲锋期间无敌，CD 又够短，理论上能一直无敌，太超模」→ 只保开头一段。
     关键：这个窗口**不跟着 afterburn 变长**（那座就是靠「+0.25s 突进时长」把无敌一起拉长的）。
     实测 afterburn 3 级 = 冷却 2.0s / 突进 1.85s → 旧版无敌占比 92%（几乎永动），现在 0.5/2.0 = 25%。 */
  dashInv: 0.5,
  /* --- 2026-09-26 联机（玩家口径：各自算氧 · 倒下 10s 复活 · 双人时敌方血量与伤害翻倍）---
     coopMul 只乘「敌方的血量与咬/撞/电伤害」，不乘持续伤害与 O2 百分比类效果
     （吸血蛭 15%/s 翻倍就是 30%/s，3 秒必死 —— 那不是难度，是耍赖）。
     这里的倍率只在**真的有客人连上**时生效，单机永远 ×1。 */
  coopMul: 2, reviveT: 10, reviveO2: 0.5, coopInvuln: 2,
  flareCd: 10.0, flareT: 4.0, flareLight: 620,                // 探照：短时间内把黑暗推开
  /* 深水斜坡（不封顶）：1.2km 以内完全不变 —— 前段手感是玩家点名要保的；
     再深就按 deepSpan 线性加价。没有这一档，强化一多深水就成永动机，
     实测 9 个种子里 4 个能一路顶到 300s 上限都不死。 */
  deepFrom: 1100, deepSpan: 1400,
  /* --- 深渊馈赠（割草式三选一）：每 CFG.lvEvery 米一次 ---
     2026-09-25 玩家要求：原来 100/180/260… 越往后越稀，1km 才强化 4~5 次，深水压力直接糊脸。
     现在恒定 100m 一次：到 1km 正好 10 次，前段攒得出东西，深水反而好玩。 */
  lvEvery: 100,
  /* 神器牌：稀有档 —— 每次三选一按这个概率「混进来一张」，命中就占掉一个卡位。
     2026-09-25 玩家反馈「概率要足够低」：0.22 → 0.09（约每 11 次三选一才见一张）。 */
  artChance: 0.09,
  /* 质变：2000m 后的第一次三选一 = 三条全新方向（MUTATIONS） */
  /* ---- 精英怪三条线（2026-09-25 玩家口径：怪太弱，要免疫怪、不受控制怪、免无视无敌怪）----
     免疫怪：吃直伤不吃持续伤害；免控怪：拉不动钉不住；免无视无敌怪：自带无敌壳、咬你无视你的无敌帧 */
  /* Spd = 上行速度系数（× hunterRush 215）。**必须让 215×系数 明显大于下潜速度 130**，
     否则怪追不上来、直接滚出屏幕 —— 这是探针实测出来的坑（0.62 ≈ 原地踏步）。
     铁壳蟹 0.85（净 +53 · 慢）、锚鲸 0.80（净 +42 · 最慢）、破免者 0.95（净 +74 · 追得最紧） */
  shellFrom: 2200, shellEvery: [6, 11], shellHP: 210, shellDmg: 34, shellSpd: 0.85,
  anchorFrom: 3100,   // 跟裂腹鱼的 3000m 错开，免得两条过线提示挤在同一帧
  anchorEvery: [9, 15], anchorHP: 260, anchorDmg: 30, anchorSpd: 0.80,
  nullifyFrom: 3800, nullifyEvery: [12, 20], nullifyHP: 240, nullifyDmg: 40, nullifySpd: 0.95,
  /* 铁壳蟹不是「一刀切免疫」，而是「有条件的抗性 + 一个能打穿的窗口」（2026-09-25 玩家口径：
     可以免疫，但不能一刀切）。甲壳期持续伤害只吃 35%、钉住/烙印增伤只吃一半；
     直伤累到 30% 血就砸开壳，破壳 9s 内 DoT ×1.25、增伤全额 —— 这就是那条「打穿的窗口」。 */
  shellDotCut: 0.35, shellAmpCut: 0.5, shellOpen: 9, shellBreak: 0.30,
  /* --- 2026-09-26 玩家口径「怪物数值太低、太容易被秒，做几个又有数值又有机制的」---
     三只重装，血量是同级怪的 2~3 倍，每只都带一条必须应对的机制（按深度过线才出）。
     共鸣母体（2400m）：自己不打人，替 300px 内的同伴扛 30% 伤害、每 1.5s 回 6% 血 —— 不先拆它，别的怪就是坦克。
     铁幕鲎（2900m）：反导热甲 —— 合甲期直伤打 2 折、**持续伤害 ×1.5**（跟铁壳蟹正好反着来）；
                     甲壳每 3.4s 合、3.0s 开，开甲那 3 秒是爆发流唯一的窗口。
     缺氧鲸（3500m）：自带 230px 缺氧带 —— 站在里面气泡 / 击杀 / 噬血的回氧全部归零，还每秒多掉 2.5% 上限氧。
                     它不快，所以是「要么退出去，要么先弄死它」的走位题。 */
  broodFrom: 2400, broodHP: 620, broodEvery: [13, 20], broodRush: 155, broodVX: 105, broodDmg: 24, broodSpd: 0.72,   // 悬停怪：rush = 游到位的速度
  broodAuraR: 300, broodCut: 0.30, broodHeal: 0.06, broodTick: 1.5,
  curtainFrom: 2900, curtainHP: 780, curtainEvery: [15, 23], curtainRush: 172, curtainVX: 130, curtainDmg: 30, curtainSpd: 0.80,
  curtainCut: 0.20, curtainDotMul: 1.5, curtainClose: 3.4, curtainOpenT: 3.0,
  anoxFrom: 3500, anoxHP: 900, anoxEvery: [17, 25], anoxRush: 204, anoxVX: 70, anoxDmg: 34, anoxSpd: 0.95,   // 横向 70：故意留出「横着跑出缺氧带」这条路
  anoxR: 230, anoxDrain: 0.025,
  /* 重装三只有**独立名额**：它们悬停在场上不走，如果吃的是普通怪的 live 预算，
     深段的普通怪就不刷了 —— 实测 2500m/40s 从 27~32 只掉到 22（verify 的「深段压力」判据当场抓住）。
     现在普通怪照旧按 cap 刷，重装单独算，最多同时 2 只。 */
  heavyCap: 2,
  nullifyShell: 1.6, nullifyGap: 4.2,
  mutateAt: 2000, t2At: 4000,          // t2At：到这里你那条质变长出两条进阶（二选一）
  /* 神器上限：一局最多持有几张（新神器只在持有数 < 上限时判定） */
  artCap: 3,
  /* 新机制的公共旋钮（数值在 recalcMods 里按「本职业 / 外职业」分档） */
  zoneLife: 60,        // 场上同时存在的「场」上限（超了挤掉最老的）
  /* 刷新：每局可以重抽几次三选一（2026-09-25 玩家要求：两次，每次重抽都还是三张） */
  rerollPerRun: 2,
  /* 流派纯度：1000m 之前、选定流派之后，三选一只给自己的流派牌（基础牌一张不掺） */
  routeOnlyUntil: 1000
};

/* 深渊压力 0→1：0m 是 0，越深越接近 1 但永远到不了顶 —— 慢，且不封顶 */
/* 深渊压力曲线：前 CFG.diffGrace 米是「缓坡起步」，之后才按 d/(d+half) 爬 ——
   玩家反馈「难度增加太快」：生效的是前中段（人还没到深水就死了），
   所以给前段一个起步宽限，深水段保持原样（不然尾段会松到出现 240s 准不朽局）。 */
function diffK(depth) { const d = Math.max(0, depth - CFG.diffGrace); return d / (d + CFG.diffHalf); }

/* ---------- 深渊馈赠：技能池（每级线性叠加，满 5 级不再出现） ----------
   minD = 解锁深度；w = 抽卡权重。类型只决定配色与手感，不影响数值。 */
const SKILLS = [
  { id: "greed",  n: "贪婪", t: "收益", d: "加速得分倍率 +0.30",       max: 5, minD: 0,   w: 1.0 },
  { id: "haul",   n: "打捞", t: "收益", d: "气泡含氧 +4",              max: 5, minD: 0,   w: 1.0 },
  { id: "edge",   n: "擦身", t: "收益", d: "擦身 +6 分 · 判定垫 +4px",  max: 5, minD: 120, w: 1.0 },
  { id: "seal",   n: "气密", t: "生存", d: "氧气上限 +18（立刻补上）",   max: 5, minD: 0,   w: 1.0 },
  { id: "eco",    n: "节氧", t: "生存", d: "耗氧 ×0.90",               max: 5, minD: 200, w: 0.9 },

function boostMulNow() { return CFG.boostMul + 0.30 * skLv("greed"); }
/* 所有强化在这里汇总成一份系数表，玩法里只读 G.m —— 改数值不用翻遍 stepPlay */
function recalcMods() {
  const rd = skLv("rudder");
  G.m = {
    drain: Math.pow(0.90, skLv("eco")),
    dmg: Math.pow(0.85, skLv("plate")),
    invuln: CFG.invulnTime + 0.30 * skLv("shell"),
    base: CFG.baseSpeed * (1 + 0.08 * skLv("stream")),
    boost: CFG.boostSpeed * (1 + 0.08 * skLv("thrust")),
    steer: CFG.steerK * (1 + 0.22 * rd),
    accel: CFG.accelK * (1 + 0.22 * rd),
    magnet: 55 * skLv("magnet"),
    bubble: CFG.bubbleO2 + 4 * skLv("haul"),
    nearBonus: CFG.nearMissBonus + 6 * skLv("edge"),
    nearPad: CFG.nearMissPad + 4 * skLv("edge"),
    jellyLight: CFG.jellyLight + 60 * skLv("bloom"),
    jellyFreq: Math.pow(0.85, skLv("bloom")),
    /* 战斗 */
    atkDmg: CFG.atkDmg + 25 * skLv("power"),
    atkEvery: CFG.atkEvery * Math.pow(0.82, skLv("rapid")),
    atkObst: 50 * skLv("crusher"),          // 只对障碍物追加的伤害：Lv1 起 50+50=100 → 石头一发碎
    atkHalfW: CFG.atkHalfW + 16 * skLv("spread"),
    /* --- 神器（职业质变件）：本职业满档 artOn() / 外职业弱化档 artOff() --- */
    core: artOn("t_core") ? { r: 140 + 60 * (artOn("t_core") > 1 ? 1 : 0), d: 30 + 20 * (artOn("t_core") > 1 ? 1 : 0),
                              life: 3.5, pull: artOn("t_core") > 1 ? 0.55 : 0 } : null,
    coreOff: artOff("t_core") ? { r: 80, d: 12, life: 2.5, pull: 0 } : null,
    voidCd: artOn("t_void") ? (artOn("t_void") > 1 ? 1.2 : 0.7) : 0,
    voidCdAll: artOff("t_void") ? 0.2 : 0,
    voidO2: artOn("t_void") > 1 ? 0.004 : 0,
    tusk: artOn("t_tusk") ? { n: 6 + (artOn("t_tusk") > 1 ? 4 : 0), d: 45 + (artOn("t_tusk") > 1 ? 25 : 0), o2: artOn("t_tusk") > 1 ? 0.005 : 0 } : null,
    tuskOff: artOff("t_tusk") ? { n: 3, d: 25, o2: 0 } : null,
    frenzy: (artOn("t_frenzy") || artOff("t_frenzy")) ? {
      max: artOn("t_frenzy") ? (15 + (artOn("t_frenzy") > 1 ? 6 : 0)) : 6,
      dmg: artOn("t_frenzy") ? (artOn("t_frenzy") > 1 ? 0.045 : 0.03) : 0.015,
      cut: artOn("t_frenzy") ? (artOn("t_frenzy") > 1 ? 0.025 : 0.015) : 0.0075,
      lose: artOn("t_frenzy") > 1 ? 1 : 3
    } : null,
    prism: artOn("t_prism") ? { jumps: 4 + (artOn("t_prism") > 1 ? 2 : 0), k: 0.65 + (artOn("t_prism") > 1 ? 0.15 : 0) } : null,
    prismOff: artOff("t_prism") ? { jumps: 2, k: 0.35 } : null,
    dawn: (artOn("t_dawn") || artOff("t_dawn")) ? {
      per: artOn("t_dawn") ? 0.08 : 0.04, o2: artOn("t_dawn") ? 0.15 : 0, cap: 0.35 + (artOn("t_dawn") > 1 ? 0.15 : 0),
      dot: artOn("t_dawn") > 1 ? 20 : 0, rAdd: artOff("t_dawn") ? 40 : 0
    } : null,
    /* 主动技能（Q/E/F）——冷却和强度都从这里读，激活时不直接看 CFG */
    killO2: CFG.killO2,
    shockCd: Math.max(1.5, CFG.shockCd * Math.pow(0.88, skLv("m_cd")) * Math.pow(0.90, skLv("t_cd"))),
    shockR: CFG.shockR + 40 * skLv("overload") + 45 * skLv("m_rng"),
    shockD: CFG.shockMob + 30 * skLv("overload") + 40 * skLv("m_dmg"),
    ramDmg: 50 * skLv("w_ram"), vamp: 0.025 * skLv("w_vamp"),
    flareDot: 30 * skLv("l_dot"),
    flareHeal: 1.0 * skLv("l_heal"),
    flareShield: Math.min(0.75, 0.35 * skLv("l_shield")),
    dashCd: Math.max(1.8, CFG.dashCd - 1.0 * skLv("afterburn")),
    dashT: CFG.dashT + 0.25 * skLv("afterburn"),
    flareT: CFG.flareT + 2 * skLv("lumen"),
    flare: CFG.flareLight + 120 * skLv("lumen"),
    flareCd: Math.max(3.0, CFG.flareCd)
  };
  /* --- 质变专属系数：9 条方向各自的被动数值都从这里出（没选 = 中性值）。
     玩法里只读 G.m.xxx，不在各处再写一遍 if (G.mutate === ...)。 --- */
  const mu = G.mutate || "", M = G.m;
  /* 战士 · 鲸吞漩涡：E 变成「原地张口吸东西」 */
  if (mu === "whirl") {
    M.dashCd = Math.max(1.0, M.dashCd * 0.75);
    M.whirl = { t: 1.2, r: 300 + 70 * skLv("w_r"), pull: 420 * (1 + 0.35 * skLv("w_r")),
                d: CFG.dashDmg + M.ramDmg + 70 * skLv("w_d"), o2: 0.008 * skLv("w_o2") };
  }
  /* 战士 · 鲸落骨甲：层数在 G.bone，这里只给上限与系数（效果随层数现算） */
  if (mu === "bone") {
    M.bone = { max: 12 + 3 * skLv("o_max"), dmg: 0.04 + 0.02 * skLv("o_max"), cut: 0.02,
               save: Math.min(0.85, 0.55 + 0.08 * skLv("o_cut")), gain: 1 + (skLv("o_gain") ? 1 : 0) };
  }
  /* 战士 · 回声冲撞：突进路上留激流带 */
  if (mu === "chg") {
    /* 玩家口径「回声冲撞没用」→ 改成朝准星的高速冲刺：位移本身变成操作 */
    M.dashCd = Math.max(1.2, M.dashCd * 0.85 * Math.pow(0.9, skLv("p_cd")));
    /* 基底 = 突进那一套（CFG.dashDmg + 猛撞 w_ram）+ 冲锋自己的 40/p_dmg。
       零技能时仍是 80+0+40 = 120，跟老数值对齐；先点猛撞再拿冲锋不再作废。 */
    M.chg = { speed: CFG.baseSpeed * 2.2 + 130 * skLv("p_spd"), t: 0.34,
              dmg: CFG.dashDmg + M.ramDmg + 40 + 50 * skLv("p_dmg") };
  }
  /* 法师 · 虚空奇点：拉 + 钉（直伤打折，靠钉住的增伤和普攻补回来） */
  if (mu === "sing") {
    /* 半径 = 冲击波基底半径（含过载/扩散）+ 100（控场税）+ s_r；
       伤害总额 = 冲击波那一发的伤害 × k（见 shockwave：摊到每一段上，不随时间变多） */
    M.sing = { r: M.shockR + 100 + 80 * skLv("s_r"), life: 1.5 + 0.6 * skLv("s_pin"), k: 0.60, amp: 0.30 + 0.10 * skLv("s_pin") };
    M.shockCd = Math.max(1.2, M.shockCd * Math.pow(0.88, skLv("s_cd")));
  }
  /* 法师 · 熔核连锁：冲击波打死的怪会引爆，被引爆死的还会继续引 */
  if (mu === "fis") {
    M.fis = { r: 140 + 50 * skLv("f_r"), k: 0.75 * (1 + 0.25 * skLv("f_dmg")), jump: 3 + 2 * skLv("f_jump"),
              decay: 0.88 + 0.02 * skLv("f_jump") };
  }
  /* 法师 · 窒息燃烧：吃氧换伤害，越缺氧越狠 */
  if (mu === "asp") {
    /* 玩家口径「增加吸血」：回氧 = 实际造成伤害的 10%（不再是一口固定值） */
    M.asp = { cost: Math.max(0.02, 0.06 - 0.02 * skLv("a_cost")), rate: 1.8 + 0.4 * skLv("a_rate"),
              heal: 0.10 + 0.02 * skLv("a_heal"),
              /* 玩家口径「50% 血量以上改为每次放技能减 10% 血、且不触发吸血」：
                 本作的「血」就是氧 —— 氧 ≥50% 上限时走 costHi 这一档（固定 10%，不吃「省耗」牌），
                 噬氧整档停用；氧 <50% 才回到 6% 起的老规矩。 */
              costHi: 0.10, hiAt: 0.50 };
  }
  /* 照明 · 白夜：探照变成「插在地上的一盏灯」，灼光 / 回春 / 光盾全从这片灯发出来 */
  if (mu === "lance") {
    /* 玩家口径「白夜没什么用」→ 换成光矛：按住蓄力、松手打出一道贯穿光束 */
    M.lance = { charge: 1.2, dmg: 140 + 40 * skLv("n_dmg"), w: 26 + 6 * skLv("n_wide"),
                range: 1100, cd: Math.max(1.2, 3.2 * Math.pow(0.88, skLv("n_cd"))) };
  }
  /* 照明 · 行灯拖尾：走一路掉一路灯蕊，连成串就是火线 */
  if (mu === "lant") {
    /* 玩家口径「做成符咒那种环绕」→ 灯蕊不再丢在原地，改成绕着自己转的一圈火 */
    /* 进阶·爆灯：上限压到 4 盏（多的拿去炸）；进阶·长明双环：抬到 12 盏（外环 8 + 内环 4） */
    const lMax = G.t2 === "lantA" ? 4 : (G.t2 === "lantB" ? 12 : 6 + 2 * skLv("l_n"));
    M.lant = { max: lMax, gap: Math.max(70, 110 - 10 * skLv("l_n")), r: 118, lineR: 46,
               orbit: 96, spin: 0.85, dmg: 22 + 18 * skLv("l_d"), line: 40 + 30 * skLv("l_line") };
  }
  /* 照明 · 审判之光：光照半径内叠印，满 4 层当场处决，印记跳到最近的怪 */
  if (mu === "judge") {
    /* 玩家口径（2026-09-26）「原本的审判之光就是满四层烙印秒杀 —— 你把它改回去」：
       满印 = 处决（光本身仍然零伤害，只负责计数与收账）。免处决的重型怪吃断罪伤害。 */
    M.judge = { every: Math.max(0.5, 1.0 - 0.15 * skLv("j_rate")), need: 4,
                condemn: 260 + 120 * skLv("j_layer"),       // 锚鲸这类免处决的重型怪吃多少
                heal: 0.015 * skLv("j_heal") };             // 恩泽牌：每次处决回氧（没牌就是 0）
  }
}
/* 三选一抽卡：独立 RNG（不动玩法随机流，同一 seed 的障碍布局不会因为抽卡而改变） */
function combatOwned() {
  let n = 0;
  for (const s of SKILLS) if (s.t === "战斗") n += skLv(s.id);
  return n;
}
function rollChoices() {
  /* 质变：2000m 后的第一次强化 = 你这个角色的三条质变方向（别的牌一律不给；不可刷新，和选流派同规）
     角色 = 路线（法师 / 照明使者 / 战士）：一人三条，一共 9 条 —— 另外六条这辈子不会出现在你面前。
     每局只能选这一次（选完 G.mutate 定住，这段分支再也不进）。 */
  if (!G.mutate && G.depth >= CFG.mutateAt && G.route) {
    return MUTATIONS.filter((m) => m.r === G.route).map((m) => ({ id: m.id, n: m.n, t: "质变", route: m, mutate: m, d: m.d, sub: m.sub, max: 1, minD: 0, w: 0 }));
  }
  /* 二段分叉：到 4000m，你手上那条质变长出两条进阶 —— 只端这两张，二选一（选完 G.t2 定住）。
     没质变的局走不进来：上面那条分支会继续端三条基础质变，不会开天窗。 */
  if (G.mutate && !G.t2 && G.depth >= CFG.t2At && MUT_T2[G.mutate]) {
    return MUT_T2[G.mutate].map((m) => ({ id: m.id, n: m.n, t: "进阶", route: m, t2: m, d: m.d, sub: m.sub, max: 1, minD: 0, w: 0 }));
  }
  /* 第二次强化：三条路线一起端上来，别的牌一律不给 */
  if (G.level === 2 && !G.route) return ROUTES.map((r) => ({ id: r.id, n: r.n, t: "路线", route: r, d: r.d, sub: r.s, max: 1, minD: 0, w: 0 }));
  /* 刷新必须换一批牌：种子带上 rerollN（否则重抽回来还是同样三张） */
  const rg = mulberry32(((G.seed ^ 0x5bf03635) + G.level * 2654435761 + (G.rerollN | 0) * 0x9e3779b1) >>> 0);
  /* 带 r 的是路线专属牌：选了哪条路，才抽得到哪条路的牌。质变牌同理（r = 质变 id）。 */
  let pool = SKILLS.concat(MUT_SKILLS).filter((s) => skLv(s.id) < s.max && G.depth >= s.minD && (!s.r || s.r === G.route || s.r === G.mutate));
  /* 流派纯度（2026-09-25 玩家要求）：1km 之前、选定流派之后，三选一只给自己那条的牌，
     基础牌一张都不掺。流派牌不足 3 张就先放宽深度门槛（宁可给早），再不够才退回混池 —— 不开天窗。 */
  const routeOnly = !!G.route && G.depth < CFG.routeOnlyUntil;
  if (routeOnly) {
    let own = SKILLS.filter((s) => s.r === G.route && skLv(s.id) < s.max && G.depth >= s.minD);
    if (own.length < 3) own = SKILLS.filter((s) => s.r === G.route && skLv(s.id) < s.max);
    /* 够三张才纯血。不够就得退回混池 —— 旧代码写的是 own.length 非 0 就独占，
       而每条路线在 SKILLS 里只有 4 张牌：刷满两张纯血池就只剩 2 张，当期三选一直接开天窗
       （玩家口径「牌库并没有被抽完，但只会给你两张牌」的一半来源）。 */
    if (own.length >= 3) pool = own;
  }
  const out = [];
  /* 神器：稀有档单独判一次（不跟普通牌比权重）。
     2026-09-25 重做：① 持有数 < CFG.artCap 才判新神器；② 已持有的神器可能出「Lv2 强化」
     （描述换成 ARTIFACT_UP 的那行，效果随等级走 recalcMods）；③ 选流派那次（Lv2）不给。 */
  let artifact = null;
  {
    const ownedN = ARTIFACTS.reduce((n, s) => n + Math.min(1, skLv(s.id)), 0);
    const arts = ARTIFACTS.filter((s) => skLv(s.id) < s.max && G.depth >= s.minD && (skLv(s.id) > 0 || ownedN < CFG.artCap));
    if (arts.length && G.level !== 2 && rg() < CFG.artChance) {
      /* 职业适配（玩家口径「某个职业拿到特定神器要强度大幅提升」）：
         七成概率先把本职业那两件端上来 —— 配对是常态，错配才是意外（错配也不是废牌，
         每件神器都写了外职业弱化档 artOff，卡面会标「外职业 · 弱化档」）。 */
      const mine = arts.filter((s) => s.r === G.route);
      const pool2 = (mine.length && rg() < 0.70) ? mine : arts;
      let at = 0; for (const s of pool2) at += s.w;
      let ax = rg() * at, ak = 0;
      for (; ak < pool2.length - 1; ak++) { ax -= pool2[ak].w; if (ax <= 0) break; }
      const base = pool2[ak];
      artifact = Object.assign({}, base, {
        cls: ROUTE_MAP[base.r] ? ROUTE_MAP[base.r].n : base.r,
        own: base.r === G.route,
        aff: base.r === G.route ? "本职业" : "外职业"
      });
      out.push(artifact);
    }
  }
  /* 质变纯度：定了质变、还没拿满第一轮质变牌时，三选一里保底混一张质变牌
     （不学流派那样 100% 纯 —— 质变之后基础牌也该有出场机会，只保证「新的特殊效果」能长出来） */
  if (G.mutate) {
    const mutOwned = MUT_SKILLS.reduce((n, s) => n + Math.min(skLv(s.id), 1), 0);
    if (mutOwned < 3 && !out.some((s) => s.r === G.mutate) && G.level !== 2) {
      let own = MUT_SKILLS.filter((s) => s.r === G.mutate && skLv(s.id) < s.max && G.depth >= s.minD);
      if (!own.length) own = MUT_SKILLS.filter((s) => s.r === G.mutate && skLv(s.id) < s.max);
      if (own.length && out.length < 3) {
        const pick = own[ri(0, own.length - 1)];
        /* 关键：这张牌必须**从池里取走**。旧代码直接 push、池里还留着同一张，
           下面「凑满 3 张」的循环有概率把它再抽一次（同 id 两张），末尾去重就削掉一张 → 只剩两张。
           实测 400 个种子里 22 例撞上（种子 28 / 39 / 49 …），玩家看到的就是这个。 */
        const pi = pool.findIndex((s) => s.id === pick.id);
        if (pi >= 0) pool.splice(pi, 1);
        out.push(pick);
      }
    }
  }
  /* 保底：战斗牌总共不到 2 级时，每次普通三选一必带一张战斗牌 ——
     「特殊技能要找到才有用」，靠权重撞运气不够（实测原来整局只撞上 2/7 次）。
     坑（2026-09-25 修）：保底原来只在 pool 里找，而 pool 已经按 minD 过滤过 ——
     Lv1(100m) 时火力要 170m 才解锁，池里一张战斗牌都没有，保底空转；
     Lv2(280m) 本该是保底首次生效，又被「选路线」那次三选一顶掉，
     结果实战第一次拿到战斗牌被推到 540m（保底写了等于没写）。
     所以保底不认深度门槛：池里没有就把最早解锁的那张直接补进来。
     （只在战斗牌总等级 <2 时生效，不会长期改变卡池曲线。） */
  /* 只在混池阶段生效：1km 前只给流派牌，而战斗牌全是基础牌，硬塞进来就破了流派纯度 */
  if (!routeOnly && combatOwned() < 2) {
    let ci = pool.findIndex((s) => s.t === "战斗");
    if (ci < 0) {
      const early = SKILLS.filter((s) => s.t === "战斗" && skLv(s.id) < s.max).sort((a, b) => a.minD - b.minD)[0];
      if (early) { pool.push(early); ci = pool.length - 1; }
    }
    if (ci >= 0) out.push(pool.splice(ci, 1)[0]);
  }
  /* 神器占的是「三张里的一个卡位」：照样凑满 3 张。
     坑（本轮探针抓到）：原来写 artifact?2:3，结果神器一出现卡面只剩 2 张 —— 神器不是额外奖励位。 */
  const drawWeighted = () => {
    let tot = 0;
    for (const s of pool) tot += s.w;
    let x = rg() * tot, k = 0;
    for (; k < pool.length - 1; k++) { x -= pool[k].w; if (x <= 0) break; }
    return pool.splice(k, 1)[0];
  };
  /* 凑满 3 张：**抽的时候就排重**（重复的直接丢回不补位，继续抽）。
     旧写法是「先凑满、末尾再去重」，撞上同 id 就会把三张削成两张 —— 这就是玩家报的那个 bug。 */
  while (out.length < 3 && pool.length) {
    const card = drawWeighted();
    if (out.some((s) => s.id === card.id)) continue;      // 同 id：这张作废，池子继续抽下一张
    out.push(card);
  }
  /* 保险丝：万一还有漏网的重复（保底那几条路各自 push 过东西），去掉后从池里补满 */
  const seen = new Set();
  const uniq = out.filter((s) => !seen.has(s.id) && seen.add(s.id));
  while (uniq.length < 3 && pool.length) {
    const card = drawWeighted();
    if (uniq.some((s) => s.id === card.id)) continue;
    uniq.push(card);
  }
  return uniq;
}
/* 刷新（reroll）：每局 CFG.rerollPerRun 次，重抽三张牌 ——
   抽卡种子带上 rerollN，所以重抽一定换一批，不会原样端回来。
   选流派那次不给刷：三张就是那三条路，刷了还是它们。 */
function rerollChoices() {
  if (G.state !== "levelup" || !G.choices) return false;
  if (G.choices.some((s) => s.route)) return false;      // 路线 / 质变都不给刷：选完才继续
  if (G.rerolls <= 0) return false;
  G.rerolls -= 1; G.rerollN += 1;
  const c = rollChoices();
  if (!c.length) return false;
  G.choices = c;
  G.flash = 0.5;
  SFX.pick();
  return true;
}
function levelUp() {
  G.level += 1;
  G.nextLv += lvNeed(G.level + 1);
  const c = rollChoices();
  if (!c.length) return;                 // 全满级：安静地继续下潜
  G.choices = c;
  G.state = "levelup";
  G.flash = 0.55;
  SFX.level();
}
function applyPick(i) {
  if (G.state !== "levelup" || !G.choices) return false;
  const s = G.choices[i];
  if (!s) return false;
  if (s.route) {                        // 路线 / 质变：选一条，另外两条从此不再出现
    if (s.t2) { G.t2 = s.route.id; popup(p.x, p.y - 44, "进阶 · " + s.route.n, s.route.col.join(String.fromCharCode(44))); }
    else if (s.mutate) { G.mutate = s.route.id; popup(p.x, p.y - 44, "质变 · " + s.route.n, s.route.col.join(",")); }
    else { G.route = s.route.id; popup(p.x, p.y - 44, s.route.n, s.route.col.join(",")); }
    recalcMods();
    G.choices = null; G.state = "play";
    G.flash = 0.7;
    burst(p.x, p.y, 28, s.route.col.join(","));
    SFX.pick();
    return true;
  }
  G.sk[s.id] = skLv(s.id) + 1;
  recalcMods();
  G.choices = null; G.state = "play";
  const col = KIND_COL[s.t] || [190, 240, 255];
  if (s.id === "seal") G.o2 = Math.min(o2MaxNow(), G.o2 + 18);
  if (G.m.frenzy) G.frenzy = Math.min(G.frenzy, G.m.frenzy.max);   // 拿到 / 升级血鲸之牙：把已攒层数夹进新上限
  popup(p.x, p.y - 48, s.n + (s.max > 1 ? " Lv" + G.sk[s.id] : ""), col.join(","));
  burst(p.x, p.y, 20, col.join(","));

}

/* ============================ 1. Utils =================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const frac = (t) => t - Math.floor(t);
const hash1 = (n) => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);   // 渲染用，不消耗 RNG
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);
const rnd = () => rng();
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rnd());
const mixRgb = (a, b, t) => `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;

/* ============================ 2. Store =================================== */
const store = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem("__sink_probe", "1"); localStorage.removeItem("__sink_probe"); }
  catch (e) { ok = false; }
  return {

    get(k, d) { if (ok) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} } return k in mem ? mem[k] : d; },
    set(k, v) { mem[k] = v; if (ok) { try { localStorage.setItem(k, v); } catch (e) {} } }
  };
})();

/* ============================ 3. Audio =================================== */
/* 全部 WebAudio 现场合成：0 KB 音效素材。必须先有用户手势才建 AudioContext。 */
const SFX = (() => {
  let ac = null, master = null, noiseBuf = null, droneNodes = null, gestured = false;
  let muted = store.get("sink.muted", "0") === "1";
  function ensure() {
    if (!gestured) return null;
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ac = new AC(); } catch (e) { return null; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.85; master.connect(ac.destination);
    const len = Math.max(1, Math.floor(ac.sampleRate * 0.5));
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }
  function tone(f0, f1, dur, type, vol) {
    const c = ensure(); if (!c || muted) return;
    try {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(f0, c.currentTime);
      if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), c.currentTime + dur);
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(vol, c.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(master); o.start(); o.stop(c.currentTime + dur + 0.03);
    } catch (e) {}
  }
  function noise(dur, vol, freq) {
    const c = ensure(); if (!c || muted || !noiseBuf) return;
    try {
      const s = c.createBufferSource(); s.buffer = noiseBuf;
      const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 800;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(c.currentTime + dur);
    } catch (e) {}
  }
  return {
    get muted() { return muted; },
    setMuted(m) { muted = m; store.set("sink.muted", m ? "1" : "0"); if (master) master.gain.value = m ? 0 : 0.85; },
    toggleMute() { this.setMuted(!muted); return muted; },
    unlock() { gestured = true; const c = ensure(); if (c && c.state === "suspended") c.resume().catch(() => {}); },
    start() { tone(330, 660, 0.14, "triangle", 0.10); },
    bubble() { tone(560 + Math.random() * 180, 980 + Math.random() * 200, 0.09, "sine", 0.10); },
    jelly() { tone(420, 884, 0.28, "sine", 0.10); },
    nomiss() { tone(1200, 1700, 0.05, "triangle", 0.05); },
    shoot() { tone(760, 240, 0.07, "square", 0.045); noise(0.05, 0.05, 2600); },
    kill() { noise(0.20, 0.20, 1600); tone(320, 90, 0.18, "triangle", 0.09); },
    zap() { tone(180, 90, 0.14, "sawtooth", 0.07); noise(0.10, 0.10, 1800); },
    level() { tone(520, 780, 0.16, "triangle", 0.10); setTimeout(() => tone(780, 1180, 0.22, "triangle", 0.09), 110); },
    pick() { tone(880, 1320, 0.14, "sine", 0.10); tone(1320, 1560, 0.1, "triangle", 0.05); },
    hit() { noise(0.26, 0.32, 900); tone(190, 55, 0.26, "sawtooth", 0.16); },
    over() { tone(220, 48, 0.95, "sine", 0.18); noise(0.7, 0.14, 420); },
    droneOn() {
      const c = ensure(); if (!c || droneNodes) return;
      try {
        const o1 = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
        o1.type = "sine"; o2.type = "sine";
        o1.frequency.value = 48; o2.frequency.value = 72.5;
        f.type = "lowpass"; f.frequency.value = 320;
        g.gain.setValueAtTime(0.0001, c.currentTime);
        g.gain.exponentialRampToValueAtTime(muted ? 0.0001 : 0.045, c.currentTime + 0.7);
        o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
        o1.start(); o2.start();
        droneNodes = { o1, o2, g, c };
      } catch (e) {}
    },
    droneOff() {
      if (!droneNodes) return;
      const { o1, o2, g, c } = droneNodes; droneNodes = null;
      try {
        g.gain.cancelScheduledValues(c.currentTime);
        g.gain.setValueAtTime(g.gain.value, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.35);
        o1.stop(c.currentTime + 0.45); o2.stop(c.currentTime + 0.45);
      } catch (e) {}
    },
    droneUpdate(s01) {
      if (!droneNodes) return;
      try { droneNodes.o1.frequency.value = 48 + s01 * 24; droneNodes.o2.frequency.value = 72.5 + s01 * 36; } catch (e) {}
    }
  };
})();

/* ---------- 骨片（鲸骨撞角）：碎障溅出的飞行碎片，撞到怪就结算 ---------- */
function spawnShards(x, y, n, dmg, o2) {
  /* 2026-09-25 二次口径（玩家截图：骨片只有右边一半）「要 360 度无死角」：
     更早那版是 -90° 起每块偏 0.34rad 的窄扇（全挤在天上）；上一版改成 -90°→+90° 的
     180° 扇 —— 看着是「铺满」，但 cos 恒 ≥ 0，所以整扇永远贴在右半屏，怪从背后过来就是白炸。
     现在整圈均分：起点正上、步长 2π/n（末尾不重复，n=6 就是每 60° 一块），前后左右都铺。
     速度用同一份、不叠重力，一圈才会真的均匀。 */
  const SPAN = Math.PI * 2;
  for (let i = 0; i < n; i++) {
    const a = n === 1 ? 0 : -Math.PI / 2 + (i * SPAN) / n;
    G.shards.push({ x, y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, t: 0.7, dmg, o2 });
  }

function stepShards(dt) {
  for (let i = G.shards.length - 1; i >= 0; i--) {
    const s = G.shards[i];
    s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt;          // 直线飞（原先还加 60 的下坠，会把扇面拽偏）
    let gone = s.t <= 0 || s.y < -40 || s.y > H0 + 40 || s.x < -60 || s.x > W0 + 60;   // 上下左右出屏都收
    if (!gone) for (const e of ents) {
      if (e.dead || !MOB_SET[e.kind] || e.kind === "bolt") continue;
      if (Math.hypot(e.x - s.x, e.y - s.y) > e.r + 9) continue;
      const k = ents.indexOf(e);
      if (k >= 0) hurtEnt(k, e, s.dmg, "225,240,255");
      if (s.o2 > 0) G.o2 = Math.min(o2MaxNow(), G.o2 + o2MaxNow() * s.o2);
      gone = true; break;
    }
    if (gone) G.shards.splice(i, 1);

/* ---------- 光折射（万花棱镜）：从一只怪跳到最近的下一只，每跳伤害递减 ---------- */
function beamChain(from, jumps, k, col, base) {
  let cur = from, dmg = Math.round((base || G.m.atkDmg) * k);

      if (e.dead || !MOB_SET[e.kind] || e.kind === "bolt" || seen.indexOf(e) >= 0) continue;
      const d = Math.hypot(e.x - cur.x, e.y - cur.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) return;
    G.beams.push({ x1: cur.x, y1: cur.y, x2: best.x, y2: best.y, t: 0.22, col: col || "180,240,255" });
    const i = ents.indexOf(best);
    if (i >= 0) hurtEnt(i, best, dmg, col || "180,240,255");

  G.depth += dm;
  if (G.boosting) G.bonus += dm * (boostMulNow() - 1);
  if (G.depth >= G.nextLv) levelUp();          // 到点就三选一（状态切 levelup，本帧剩余照跑）

  /* --- 氧气（深渊压力：越深耗得越快）--- */
  const dk = G.diff = diffK(G.depth);
  const deepMul = 1 + Math.max(0, G.depth - CFG.deepFrom) / CFG.deepSpan;    // 深水不封顶斜坡
  /* 缺氧带（缺氧鲸）：站在圈里吸不进氧 + 每秒额外掉 2.5% 上限 —— 这里只算「多掉的那份」，
     回氧端（气泡 / 击杀 / 噬血）各自过 anoxNear() 那道闸 */
  G.anoxCut = G.depth >= CFG.anoxFrom && anoxNearFor(p);
  const drain = CFG.o2Drain * (G.boosting ? CFG.boostDrainMul : 1) * (1 + dk * CFG.drainGain) * G.m.drain * deepMul
    + (G.anoxCut ? o2MaxNow() * CFG.anoxDrain : 0);
  G.o2 -= drain * dt;

  /* --- 视野 --- */
  /* 视野：质变·灯塔长明把下限锁死（不再随深度收窄 —— 深水里视野是最贵的资源） */
  const litBase = lerp(CFG.lightNear, CFG.lightFar, clamp(G.depth / CFG.lightSpan, 0, 1)) + CFG.lightMut * skLv("a_light");
  const lit = Math.max(G.m.lightLock || 0, litBase);
  G.lightBonus = Math.max(0, G.lightBonus - CFG.jellyDecay * dt);
  /* 探照：生效期间把光照半径硬顶到 flare，时间一到自己退回背景值（不是永久加成） */
  /* 熄灯鮟鱇：活着且在 lampEatR 内就按距离吞光（贴脸最多吞 45%） */
  let eat = 0;
  for (const e of ents) {
    if (e.kind !== "lamp" || e.dead) continue;
    const dd = Math.hypot(e.x - p.x, e.y - p.y);
    if (dd < CFG.lampEatR) eat = Math.max(eat, CFG.lampEat * (1 - dd / CFG.lampEatR));
  }
  G.lightEat = eat;
  let litTarget = (lit + G.lightBonus) * (1 - eat);
  if (fx.flare > 0) litTarget = Math.max(litTarget, G.m.flare);
  G.lightR += (litTarget - G.lightR) * Math.min(1, dt * 3);

  /* --- 转向：键盘＝按住踩油门（轻点微调 / 长按全速），鼠标＝比例控制 --- */
  let want = 0;
  const kdir = p.dead ? 0 : ((I.right ? 1 : 0) - (I.left ? 1 : 0));      // 倒下了就只能等复活
  if (kdir) {
    I.kbHold = (I.kbHold || 0) + dt;
    const k = clamp((I.kbHold - CFG.kbHold) / CFG.kbRamp, 0, 1);
    const ease = k * k * (3 - 2 * k);                    // smoothstep：起步软、中段快、末端稳
    want = kdir * CFG.maxVX * (CFG.kbTapMul + (1 - CFG.kbTapMul) * ease);
    I.ptrActive = false;                                 // 键盘优先，不和鼠标拖拽抢
  } else {
    I.kbHold = 0;
    if (I.ptrActive) want = clamp((I.ptrX - p.x) * G.m.steer, -CFG.maxVX, CFG.maxVX);
  }
  /* 软边界：贴边 120px 内线性收力（硬钳到 0 会让船像撞墙一样急停） */
  if (want > 0) want *= clamp((CFG.xMax - p.x) / CFG.kbSoftEdge, 0, 1);
  else if (want < 0) want *= clamp((p.x - CFG.xMin) / CFG.kbSoftEdge, 0, 1);
  p.vx += (want - p.vx) * Math.min(1, dt * (kdir ? CFG.kbAccel : G.m.accel));
  p.x += p.vx * dt;
  /* 质变·怒涛冲锋：冲刺期间直接按方向向量位移（A/D 让位），冲完把深度缓回原位 */
  if (G.m.chg && fx.dash > 0 && G.dashVX !== null) {
    const V = G.m.chg.speed;
    p.x += G.dashVX * V * dt;
    p.y += G.dashVY * V * dt;
  } else if (G.m.chg && Math.abs(p.y - CFG.playerY) > 0.5) {
    const back = 300 * dt;
    p.y += clamp(CFG.playerY - p.y, -back, back);
  }
  if (p.y < CFG.playerY - 190) p.y = CFG.playerY - 190;
  if (p.y > CFG.playerY + 190) p.y = CFG.playerY + 190;
  if (p.x < CFG.xMin) { p.x = CFG.xMin; p.vx = 0; }
  if (p.x > CFG.xMax) { p.x = CFG.xMax; p.vx = 0; }
  if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);

  /* --- 准星（鼠标准心管打哪）与普攻连发 --- */
  const A = G.aim;
  if (I.aimActive) { A.tx = I.ax; A.ty = I.ay; A.idle = 0; }
  else A.idle += dt;
  if (A.idle > CFG.aimIdle) {
    /* 自动瞄准兜底（触屏 / 键盘玩家）：只咬怪物，没怪物就回到正前方 */
    let best = null, bd = 1e9;
    for (const e of ents) {
      if (!mobKind(e.kind)) continue;
      const dd = Math.hypot(e.x - p.x, e.y - p.y);
      if (dd < bd) { bd = dd; best = e; }
    }
    if (best && bd < CFG.aimAutoR) { A.tx = best.x; A.ty = best.y; }
    else { A.tx = clamp(p.x, 14, W0 - 14); A.ty = clamp(p.y + CFG.atkReach * 0.7, 70, H0 - 12); }
  }
  A.tx = clamp(A.tx, 14, W0 - 14); A.ty = clamp(A.ty, 70, H0 - 12);
  A.x += (A.tx - A.x) * Math.min(1, dt * CFG.aimLerp);
  A.y += (A.ty - A.y) * Math.min(1, dt * CFG.aimLerp);
  if (A.beam > 0) A.beam = Math.max(0, A.beam - dt);
  A.cd -= dt;
  if (A.cd <= 0) { A.cd = G.m.atkEvery; if (!p.dead) fireAttack(); }

  /* --- 生成 --- */
  const prog = clamp(G.depth / CFG.rowSpan, 0, 1);
  G.rowT -= dt;
  if (G.rowT <= 0) {
    G.rowT = lerp(CFG.rowNear, CFG.rowFar, prog) * (0.85 + 0.3 * rnd()) * Math.max(0.76, 1 - dk * CFG.rowGain);
    spawnRow(prog, dk);
  }
  G.bubbleT -= dt;
  if (G.bubbleT <= 0) {
    G.bubbleT = rr(CFG.bubbleEvery[0], CFG.bubbleEvery[1]) * (1 + 0.9 * clamp(G.depth / CFG.bubbleThin, 0, 1));
    ents.push({ kind: "bubble", x: rr(64, W0 - 64), y: H0 + 34, r: rr(9, 14), seed: rnd() * 997 });
  }
  G.jellyT -= dt;
  if (G.jellyT <= 0) {
    G.jellyT = rr(CFG.jellyEvery[0], CFG.jellyEvery[1]) * G.m.jellyFreq;
    ents.push({ kind: "jelly", x: rr(70, W0 - 70), y: H0 + 40, r: rr(14, 19), seed: rnd() * 997 });
  }
  /* --- 深海猎食者：1000m 以下才出现；刚过线有适应期，越深才越凶 ---
     2026-09-25：2000m 起加入剃刀鲸（近身冲撞）与圣盾使（三连电球 + 护盾）。 */
  if (G.depth >= CFG.mobFrom) {
    const intro = clamp((G.depth - CFG.mobFrom) / CFG.mobRamp, 0, 1);
    const rate = (CFG.mobIntro + (1 - CFG.mobIntro) * intro) * (CFG.mobDeepen[0] + CFG.mobDeepen[1] * dk);
    const cap = CFG.mobCapBase + Math.round(CFG.mobCapGain * dk) + (G.depth >= 2000 ? 1 : 0);
    let live = 0, heavy = 0;
    for (const e of ents) {
      if (e.kind === "bubble" || e.kind === "jelly" || e.kind === "bolt" || e.kind === "rock" || e.kind === "cable") continue;
      if (e.kind === "brood" || e.kind === "curtain" || e.kind === "anox") heavy++; else live++;
    }
    G.huntT -= dt * rate;
    if (G.huntT <= 0) { G.huntT = rr(CFG.hunterEvery[0], CFG.hunterEvery[1]); if (live < cap) spawnHunter(); }
    G.spitT -= dt * rate;
    if (G.spitT <= 0) { G.spitT = rr(CFG.spitterEvery[0], CFG.spitterEvery[1]); if (live < cap) spawnSpitter(); }
    if (G.depth >= 2000) {
      G.reavT = (G.reavT === undefined ? rr(3, 6) : G.reavT) - dt * rate;
      if (G.reavT <= 0) { G.reavT = rr(CFG.reaverEvery[0], CFG.reaverEvery[1]); if (live < cap) spawnReaver(); }
      G.wardT = (G.wardT === undefined ? rr(6, 10) : G.wardT) - dt * rate;
      if (G.wardT <= 0) { G.wardT = rr(CFG.wardenEvery[0], CFG.wardenEvery[1]); if (live < cap) spawnWarden(); }
    }
    /* 逐千米加料：3000 裂腹鱼 · 4000 吸氧蛭 · 5000 熄灯鮟鱇（首次过线各播一条提示） */
    const gate = (cur, t) => { G[t] = (G[t] === undefined ? rr(2.2, 5) : G[t]) - dt * rate; return G[t] <= 0; };
    if (G.depth >= CFG.splitFrom) {
      if (gate(0, "splitT")) { G.splitT = rr(CFG.splitEvery[0], CFG.splitEvery[1]); if (live < cap + 1) spawnSplit(); }
    }
    if (G.depth >= CFG.leechFrom) {
      if (gate(0, "leechT")) { G.leechT = rr(CFG.leechEvery[0], CFG.leechEvery[1]); if (live < cap + 1) spawnLeech(); }
    }
    if (G.depth >= CFG.lampFrom) {
      if (gate(0, "lampT")) { G.lampT = rr(CFG.lampEvery[0], CFG.lampEvery[1]); if (live < cap + 1) spawnLamp(); }
    }
    /* 精英三线：免疫 2200 / 免控 3000 / 无视无敌 3800 —— 每只都比普通怪能扛，且各自废掉你一路打法 */
    if (G.depth >= CFG.shellFrom) {
      if (gate(0, "shellT")) { G.shellT = rr(CFG.shellEvery[0], CFG.shellEvery[1]); if (live < cap) spawnShell(); }
    }
    if (G.depth >= CFG.anchorFrom) {
      if (gate(0, "anchorT")) { G.anchorT = rr(CFG.anchorEvery[0], CFG.anchorEvery[1]); if (live < cap) spawnAnchor(); }
    }
    if (G.depth >= CFG.nullifyFrom) {
      if (gate(0, "nullifyT")) { G.nullifyT = rr(CFG.nullifyEvery[0], CFG.nullifyEvery[1]); if (live < cap) spawnNullify(); }
    }
    /* 重装三只：2400 / 2900 / 3500m（跟精英三线的 2200/3100/3800 错开，免得两条过线提示挤同帧）。
       名额独立：heavy < heavyCap，不占普通怪的 live 预算（否则深段普通怪被挤掉，压力判据当场红）。 */
    if (G.depth >= CFG.broodFrom) {
      if (gate(0, "broodT")) { G.broodT = rr(CFG.broodEvery[0], CFG.broodEvery[1]); if (heavy < CFG.heavyCap) spawnBrood(); }
    }
    if (G.depth >= CFG.curtainFrom) {
      if (gate(0, "curtainT")) { G.curtainT = rr(CFG.curtainEvery[0], CFG.curtainEvery[1]); if (heavy < CFG.heavyCap) spawnCurtain(); }
    }
    if (G.depth >= CFG.anoxFrom) {
      if (gate(0, "anoxT")) { G.anoxT = rr(CFG.anoxEvery[0], CFG.anoxEvery[1]); if (heavy < CFG.heavyCap) spawnAnox(); }
    }
    G.introShown = G.introShown || {};
    for (const it of [[CFG.splitFrom, "裂腹鱼：打死会裂成两条"], [CFG.leechFrom, "吸氧蛭：贴上来抽你的氧"], [CFG.lampFrom, "熄灯鮟鱇：活着就吞你的光"],
                          [CFG.shellFrom, "铁壳蟹：甲壳挡掉六成半持续伤害，砸开壳后 9s 内反而吃更多"], [CFG.anchorFrom, "锚鲸：拉不动、钉不住、甩不走"],
                          [CFG.nullifyFrom, "破免者：壳亮时无敌，咬你无视无敌帧"],
                          [CFG.broodFrom, "共鸣母体：替周围的怪扛三成伤害还回血 —— 先拆它"],
                          [CFG.curtainFrom, "铁幕鲎：合甲期砸不动、烧得动（直伤 2 折 · 持续伤害 1.5 倍）"],
                          [CFG.anoxFrom, "缺氧鲸：贴上来就断氧 —— 要么退出圈，要么先弄死它"]]) {
      if (G.depth >= it[0] && !G.introShown[it[0]]) {
        G.introShown[it[0]] = 1;
        /* 只在「刚过线」那 400m 里播：不然跳深度时 3000/4000/5000 三条提示会叠成一坨糊字 */
        if (G.depth < it[0] + 400) popup(p.x, p.y - 70, it[0] + "m · " + it[1], "190,235,255");
      }
    }
  }

  /* --- 实体推进 + 碰撞 --- */
  const dy = G.speed * dt;
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    if (!e) continue;                 // 连锁爆炸可能已经删过前面的实体，倒序索引会踩空
    /* 联机：这只怪这帧盯谁（最近的活人）。单机时 p2.active=false → 永远 p —— 老行为一字不改 */
    const TGT = p2.active ? nearestAlive(e.x, e.y) : p;
    if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
    if (e.resonT > 0) e.resonT = Math.max(0, e.resonT - dt);      // 共鸣加持：母体每 1.5s 续一次
    /* 电球：自带速度，不跟世界一起滚（它是「扑」过来的，不是「沉」上来的） */
    if (e.kind === "bolt") {
      e.x += e.vx * dt; e.y += e.vy * dt; e.life -= dt;
      if (e.life <= 0 || e.x < -60 || e.x > W0 + 60 || e.y < -60 || e.y > H0 + 60) { ents.splice(i, 1); continue; }
      if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + CFG.playerR) {
        hurtPlayer(Math.round(CFG.boltDmg * (1 + dk * CFG.hitGain) * G.m.dmg * coopHit()), "190,220,255");
        burst(e.x, e.y, 8, "170,215,255");
        ents.splice(i, 1);
      }
      continue;
    }
    /* 电袭者是「悬停射手」：不跟着水流一起滚，靠自己慢慢游上来 ——
       否则世界滚动 + 自己的漂移会让它 3 秒穿过整屏，一枪都来不及放 */
    /* 悬停怪不跟水流滚（自己游到位就停）：电袭者/圣盾使/熄灯鮟鱇，加上 2026-09-26 的重装三只 ——
       它们靠「一直在场」施加机制，跟着水流掠过屏幕的话光环/甲壳/缺氧带都来不及生效（实测 3 秒就飞到画外被清掉） */
    if (e.kind !== "spitter" && e.kind !== "warden" && e.kind !== "lamp"
        && e.kind !== "brood" && e.kind !== "curtain" && e.kind !== "anox") e.y -= dy;
    /* 怪物自己的动作：猎手加速上冲咬人，喷吐者保持距离放冷枪，
       剃刀鲸横冲直撞（撞完不消失），圣盾使悬停 + 三连电球 */
    if (e.kind === "hunter") {
      e.y -= CFG.hunterRush * dt;
      e.x += clamp(TGT.x - e.x, -CFG.hunterVX * dt, CFG.hunterVX * dt);
    } else if (e.kind === "spitter") {
      e.y -= CFG.spitterRush * dt;
      e.x += clamp(TGT.x - e.x, -CFG.spitterVX * dt, CFG.spitterVX * dt);
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > TGT.y + 70 && e.y < H0 + 30) {
        e.fireT = rr(CFG.boltEvery[0], CFG.boltEvery[1]);
        const a = Math.atan2(TGT.y - e.y, TGT.x - e.x);
        ents.push({ kind: "bolt", x: e.x, y: e.y, r: CFG.boltR, vx: Math.cos(a) * CFG.boltSpeed, vy: Math.sin(a) * CFG.boltSpeed, life: 4.5, seed: rnd() * 997 });
        SFX.zap();
      }
    } else if (e.kind === "reaver") {
      /* 剃刀鲸：横着冲过屏幕 + 缓慢上移，撞到人也不消失（冷却 1.2s 后再撞） */
      e.x += e.vx * dt;
      e.y -= 42 * dt;
      if (e.x < -90 || e.x > W0 + 90) { ents.splice(i, 1); continue; }
    } else if (e.kind === "warden") {
      /* 圣盾使：悬停射手，慢慢飘上来；三连电球一轮，轮间隔 wardenFan */
      e.y -= CFG.spitterRush * 0.5 * dt;
      e.x += Math.sin(G.t * 1.4 + e.seed) * 24 * dt;
      e.fireT -= dt;
      if (e.breakT > 0) e.breakT = Math.max(0, e.breakT - dt); else if (e.shieldHp <= 0) { e.shield = true; e.shieldHp = 3; }
      if (e.fireT <= 0 && e.fanN <= 0 && e.y > TGT.y + 90 && e.y < H0 + 10) { e.fanN = 3; e.fanT = 0; e.fireT = rr(CFG.wardenFan[0], CFG.wardenFan[1]); }
      if (e.fanN > 0) {
        e.fanT -= dt;
        if (e.fanT <= 0) {
          e.fanT = 0.22; e.fanN -= 1;
          const a = Math.atan2(TGT.y - e.y, TGT.x - e.x) + rr(-0.16, 0.16);
          ents.push({ kind: "bolt", x: e.x, y: e.y, r: CFG.boltR, vx: Math.cos(a) * CFG.boltSpeed, vy: Math.sin(a) * CFG.boltSpeed, life: 4.5, seed: rnd() * 997 });
          SFX.zap();
        }
      }
    } else if (e.kind === "split") {
      /* 裂腹鱼：猎手的胖版 —— 慢一档，幼体快 1.55 倍（追上来的那两条才是真麻烦） */
      const sp = e.kid ? CFG.splitKidSpd : 1;
      e.y -= CFG.splitRush * sp * dt;
      e.x += clamp(TGT.x - e.x, -CFG.splitVX * sp * dt, CFG.splitVX * sp * dt);
    } else if (e.kind === "leech") {
      /* 吸氧蛭：贴上就抽氧。抽的是「氧气上限的 15%/秒」，所以越到深处越要命；
         松口条件：计时到 / 你突进（fx.dash）/ 它被打死。甩完有 1.4s 冷却，不许贴脸秒回。 */
      if (e.on > 0 && e.relT <= 0) {
        e.on -= dt;
        const tx2 = TGT.x + e.side * 17, ty2 = TGT.y + 7 + Math.sin(G.t * 9 + e.seed) * 3;
        e.x += (tx2 - e.x) * Math.min(1, dt * 14);
        e.y += (ty2 - e.y) * Math.min(1, dt * 14);
        G.o2 -= o2MaxNow() * CFG.leechDrain * dt;
        e.popT -= dt;
        if (e.popT <= 0) { e.popT = 0.6; popup(e.x, e.y - 16, "氧 -" + (o2MaxNow() * CFG.leechDrain * 0.6).toFixed(1), "255,140,190"); }
        if (e.on <= 0 || fx.dash > 0) {
          const byDash = fx.dash > 0;
          e.on = 0; e.relT = CFG.leechRel;
          popup(e.x, e.y - 20, byDash ? "甩掉!" : "松口了", "255,190,220");
          burst(e.x, e.y, 8, "255,150,200");
        }
      } else if (e.relT > 0) {
        e.relT = Math.max(0, e.relT - dt);          // 刚被甩：往外弹一段再回来
        e.y -= CFG.leechRush * 0.5 * dt;
        e.x += e.side * 130 * dt;
      } else {
        e.y -= CFG.leechRush * dt;
        e.x += clamp(TGT.x - e.x, -CFG.leechVX * dt, CFG.leechVX * dt);
        if (TGT.invuln <= 0 && Math.hypot(e.x - TGT.x, e.y - TGT.y) < e.r + CFG.playerR + 4) {
          e.on = CFG.leechHold; e.side = rnd() < 0.5 ? -1 : 1; e.popT = 0;
          popup(TGT.x, TGT.y - 36, "吸附!", "255,140,190");
          burst(e.x, e.y, 10, "255,150,200"); SFX.zap();
        }
      }
    } else if (e.kind === "shell") {
      /* 铁壳蟹：横着慢慢压过来，懒得追 —— 靠体格和甲壳吃你；壳开着的时候反倒更脆 */
      if (e.shellT > 0) {
        e.shellT = Math.max(0, e.shellT - dt);
        if (e.shellT === 0) { popup(e.x, e.y - e.r - 22, "壳重铸", "255,214,120"); burst(e.x, e.y, 10, "255,214,120"); }
      }
      const sp2 = CFG.shellSpd;
      e.y -= CFG.hunterRush * sp2 * dt;
      e.x += clamp(TGT.x - e.x, -CFG.hunterVX * sp2 * dt, CFG.hunterVX * sp2 * dt);
    } else if (e.kind === "anchor") {
      /* 锚鲸：匀速下坠式逼近，拐弯很笨（免控的代价是它自己也转不动） */
      const sp2 = CFG.anchorSpd;
      e.y -= CFG.hunterRush * sp2 * dt;
      e.x += clamp(TGT.x - e.x, -CFG.hunterVX * sp2 * 0.55 * dt, CFG.hunterVX * sp2 * 0.55 * dt);
    } else if (e.kind === "nullify") {
      /* 破免者：壳一亮一灭（灭的时候才打得动），追得最紧 */
      e.shellT -= dt;
      if (e.invT > 0) {
        e.invT = Math.max(0, e.invT - dt);
        if (e.invT === 0) { e.shellT = CFG.nullifyGap; popup(e.x, e.y - e.r - 22, "壳碎了", "255,120,200"); burst(e.x, e.y, 14, "255,120,200"); }
      } else if (e.shellT <= 0) {
        e.invT = CFG.nullifyShell;
        popup(e.x, e.y - e.r - 22, "免伤壳", "255,120,200"); SFX.zap();
      }
      const sp2 = CFG.nullifySpd;
      e.y -= CFG.hunterRush * sp2 * dt;
      e.x += clamp(TGT.x - e.x, -CFG.hunterVX * sp2 * dt, CFG.hunterVX * sp2 * dt);
    } else if (e.kind === "brood") {
      /* 共鸣母体：游到你下方 150px 悬停（不进咬合距离），自己不打人 —— 威胁全在光环上 */
      e.y += clamp(TGT.y + 150 - e.y, -CFG.broodRush * dt, CFG.broodRush * dt);
      e.x += clamp(TGT.x - e.x, -CFG.broodVX * dt, CFG.broodVX * dt);
      e.tickT -= dt;
      if (e.tickT <= 0) {
        e.tickT = CFG.broodTick;
        burst(e.x, e.y, 8, "150,255,200");
        for (const o of ents) {
          if (o === e || o.dead || !MOB_SET[o.kind] || o.kind === "bolt" || o.kind === "brood") continue;
          if (Math.hypot(o.x - e.x, o.y - e.y) > CFG.broodAuraR) continue;
          o.resonT = CFG.broodTick * 1.25;
          if (o.hp < o.maxHp) {
            const h = Math.max(1, Math.round(o.maxHp * CFG.broodHeal));
            o.hp = Math.min(o.maxHp, o.hp + h);
            popup(o.x, o.y - o.r - 18, "+" + h, "150,255,200");
          }
        }
      }
    } else if (e.kind === "curtain") {
      /* 铁幕鲎：甲壳一合一开 —— 合甲期直伤砸不动、烧得动；开甲那 3 秒才是爆发流的窗口 */
      e.armT -= dt;
      if (e.armFlash > 0) e.armFlash = Math.max(0, e.armFlash - dt);
      if (e.armT <= 0) {
        if (e.armOn) { e.armOn = false; e.armT = CFG.curtainOpenT; e.armFlash = 0.5; popup(e.x, e.y - e.r - 24, "张甲 · 打它", "180,255,235"); }
        else { e.armOn = true; e.armT = CFG.curtainClose; e.armFlash = 0.5; popup(e.x, e.y - e.r - 24, "合甲 · 烧它", "255,214,120"); }
        burst(e.x, e.y, 12, e.armOn ? "255,214,120" : "180,255,235");
      }
      e.y += clamp(TGT.y + 40 - e.y, -CFG.curtainRush * dt, CFG.curtainRush * dt);
      e.x += clamp(TGT.x - e.x, -CFG.curtainVX * dt, CFG.curtainVX * dt);
    } else if (e.kind === "anox") {
      /* 缺氧鲸：悬在你下方 150px 慢慢横向跟着 —— 缺氧带跟着它走。
         它横向只有 70px/s，你横着加速就能拉出圈（缺氧带半径 230，横向拉开 175px 以上就出圈）。 */
      e.y += clamp(TGT.y + 150 - e.y, -CFG.anoxRush * dt, CFG.anoxRush * dt);
      e.x += clamp(TGT.x - e.x, -CFG.anoxVX * dt, CFG.anoxVX * dt);
      e.breathT -= dt;
      if (e.breathT <= 0) { e.breathT = 1.4; burst(e.x, e.y, 6, "255,140,140"); }
    } else if (e.kind === "lamp") {
      /* 熄灯鮟鱇：不跟水流滚，慢慢挪到你身边 —— 吞光是按距离算的（见视野那段） */
      e.y += clamp(TGT.y + 135 - e.y, -CFG.lampRush * dt, CFG.lampRush * dt);
      e.x += clamp(TGT.x - e.x, -CFG.lampVX * dt, CFG.lampVX * dt);
      e.popT = (e.popT || 0) - dt;
      if (G.lightEat > 0.05 && e.popT <= 0) { e.popT = 1.4; popup(e.x, e.y - e.r - 26, "吞光 " + Math.round(G.lightEat * 100) + "%", "190,160,255"); }
    }
    if (e.y < -140) { ents.splice(i, 1); continue; }
    /* 磁力：圈内的收集物朝玩家本体整体收拢（x、y 一起动）。
       旧写法只拽 x —— 上方的东西被拉到同一条竖线上、却照样留在上方飞走，永远吃不到
       （实测：正上方 90px 的气泡最近只到 96px 就出屏了）。收拢量按剩余距离比例
       （每秒 6 倍），越近拽得越紧，也不会过冲。 */
    if (G.m.magnet > 0 && (e.kind === "bubble" || e.kind === "jelly")) {
      const mdx = TGT.x - e.x, mdy = TGT.y - e.y;
      if (Math.hypot(mdx, mdy) < G.m.magnet) {
        const mk = Math.min(1, dt * 6);
        e.x += mdx * mk; e.y += mdy * mk;
      }
    }
    /* 联机：这一帧「最近的那个活人」和到他的距离。单机时 party() 只有 p —— 数值与老版完全一致 */
    let d = 1e9, HITQ = p;
    for (const q of party()) {
      if (q.dead) continue;
      const dd = obstacleDist(e, q);
      if (dd < d) { d = dd; HITQ = q; }
    }
    const rr2 = CFG.playerR;
    if (e.kind === "bubble" || e.kind === "jelly") {
      /* 资源：谁碰到算谁的（各捡各的 —— 玩家口径「氧气要各自算」） */
      const picker = !p.dead && Math.hypot(e.x - p.x, e.y - p.y) < e.r + rr2 + 2 ? p
                   : (p2.active && !p2.dead && Math.hypot(e.x - p2.x, e.y - p2.y) < e.r + rr2 + 2 ? p2 : null);
      if (picker) {
        if (e.kind === "bubble") {
          const cut = G.depth >= CFG.anoxFrom && anoxNearFor(picker);
          if (cut) { popup(e.x, e.y, "缺氧 · 吸不进", "255,150,150"); }
          else {
            const gain = G.m.bubble * Math.max(0.58, 1 - dk * CFG.bubbleLoss);
            o2Add(picker, gain);
            popup(e.x, e.y, "+" + Math.round(gain) + " 氧", "150,255,210"); SFX.bubble();
          }
        }
        else { G.lightBonus = Math.min(CFG.jellyCap, G.lightBonus + G.m.jellyLight); popup(e.x, e.y, "视野 +" + Math.round(G.m.jellyLight), "190,230,255"); SFX.jelly(); }
        burst(e.x, e.y, 10, e.kind === "bubble" ? "150,255,210" : "190,230,255");
        ents.splice(i, 1);
      }
    } else if (fx.dash > 0 && (e.kind === "rock" || e.kind === "cable") && d < rr2 + 10 && e.dashS !== G.dashStamp) {
      /* 突进撞上去不算撞车，是撞碎：无敌期间给挡路的开个洞。
         dashS 是「哪一次突进已经打过它」的戳记 —— 不加就会每帧（120/s）扣一次 80 血。 */
      e.dashS = G.dashStamp;
      /* 战士·猛撞：撞击伤害加成 */
      const diedO = hurtEnt(i, e, CFG.dashDmg + G.m.ramDmg + stackRamBonus(), "150,255,220");
      if (diedO && G.m.vamp > 0) healVamp(e.x, e.y);
      ramOnHit(e, diedO);
      continue;
    } else if (fx.dash > 0 && (G.m.ramDmg > 0 || G.m.chg) && mobKind(e.kind)
               && Math.hypot(e.x - p.x, e.y - p.y) < rr2 + e.r + 6 && e.dashS !== G.dashStamp) {
      /* 基础突进只撞碎障碍物，点了猛撞才能把怪一起撞了 —— 怒涛冲锋自带「撞怪」这一档 */
      e.dashS = G.dashStamp;
      const diedM = hurtEnt(i, e, (G.m.chg ? G.m.chg.dmg : G.m.ramDmg) + stackRamBonus(), "150,255,220");
      if (diedM && G.m.vamp > 0) healVamp(e.x, e.y);
      /* 进阶·连涛（玩家口径：原「撞角留痕」沿路铺的伤口带在身后，等于没用）：
         撞死东西就立刻刷新冲锋冷却 —— 有东西可撞就一直冲。 */
      if (diedM && G.t2 === "chgB") {
        G.act.e = Math.min(G.act.e, 0.15);
        popup(p.x, p.y - 96, "连涛 · 冲锋就绪", "150,255,220");
        burst(p.x, p.y, 18, "150,255,220");
        fxRing(p.x, p.y, 26, 96, "150,255,220", 0.34, "ring");              // 冷却当场刷新的信号：连涛的核心手感
      }
      ramOnHit(e, diedM);
      continue;
    } else if (d < rr2 && (HITQ.invuln <= 0 || e.kind === "nullify") && !e.hit && !(e.pullImm > 0) && e.kind !== "leech") {
      /* pullImm：正被虚空奇点拽着的怪不撞人（玩家口径「拉过来把自己撞死」）；
         只有「真被拽过来」的才算 —— 血量不够、被奇点直接打死的那些不吃这个豁免 */
      e.hit = true;
      const isMob2 = mobKind(e.kind);
      if (isMob2) {
        /* 咬人结算：猎手/电袭者同归于尽；剃刀鲸/圣盾使活着走开（e.cd 冷却后再咬） */
        const dmg = Math.round(contactDmg(e) * (1 + dk * CFG.hitGain) * G.m.dmg * coopHit());
        hurtPlayerOn(HITQ, dmg, e.kind === "reaver" ? "255,190,120" : "255,150,120", e.kind === "nullify");
        if (e.kind === "hunter" || e.kind === "spitter") { burst(e.x, e.y, 20, "255,140,110"); ents.splice(i, 1); }
        else e.cd = 1.2;
      } else {
        hurtPlayerOn(HITQ, Math.round(CFG.hitDamage * (1 + dk * CFG.hitGain) * G.m.dmg * coopHit()));
      }
    } else if (e.cd > 0 && e.hit && (e.kind === "reaver" || e.kind === "warden" || e.kind === "split" || e.kind === "lamp" || e.kind === "shell" || e.kind === "anchor" || e.kind === "nullify"
                                       || e.kind === "brood" || e.kind === "curtain" || e.kind === "anox")) {
      e.cd = Math.max(0, e.cd - dt);
      if (e.cd <= 0) e.hit = false;       // 大家伙咬完一口会绕回来再咬：冷却好了才能咬下一口
    } else if (!e.near && (e.kind === "rock" || e.kind === "cable") && d < rr2 + G.m.nearPad) {
      e.near = true;
      G.bonus += G.m.nearBonus;
      popup(HITQ.x + (e.x > HITQ.x ? 30 : -30), HITQ.y - 20, "擦身 +" + G.m.nearBonus, "255,225,150");
      SFX.nomiss();
    }
  }

  /* --- 联机：二号位（客人的小人）+ 各自的氧 + 各自的倒下/复活 --- */
  if (p2.active) {
    coopHostStep(dt);
    if (!p2.dead) {
      const anox2 = (G.depth >= CFG.anoxFrom && anoxNearFor(p2));
      o2Sub(p2, (drain + (anox2 ? o2MaxNow() * CFG.anoxDrain : 0)) * dt);
      if (o2Get(p2) <= 0) { o2Set(p2, 0); killPlayer(p2); }
    }
  }
  if (G.o2 <= 0) { G.o2 = 0; killPlayer(p); }
  reviveTick(p, dt);
}

/* ========================= 12. 联机 · 实时同屏合作（WebRTC 点对点）=========================
   2026-09-26 玩家口径「能做联机功能吗」→ 选「实时同屏合作」，随后又补了三条硬规矩：
     ① 氧气各自算（谁捡的谁喝，各背各的瓶子）
     ② 倒下的玩家 10s 后自动复活（两条命各算各的，同时倒下才结束）
     ③ 代价：双人模式下敌方的**血量与伤害都是单人的两倍**（CFG.coopMul）
   架构：**房主跑全量模拟**（一切数值只有一份），客人只送操作、收快照、自己插值渲染 ——
        客人不跑第二份物理，所以不会出现「两边怪的位置不一样」这种经典同步灾难。
   信令：默认走 ntfy.sh 公共主题（房间码 = 主题名，不需要我们养服务器）；
        也可以切「手动模式」纯复制粘贴 SDP，全程不碰第三方（探针就走这条路，可离线自测）。
   节奏：快照 15Hz · 操作 30Hz · ping 1Hz。实体按 nid 配对做插值，丢帧不闪。
   已知边界（M2 待做）：客人的技能键（Q/E/F）还没接、卡牌由房主选、断线不自动重连。
*/
const NET = {
  on: false, role: null, code: "", pc: null, dc: null, connected: false,
  rtt: 0, lastPing: 0, lastInput: 0, lastSnap: 0,
  snapA: null, snapB: null, nidSeq: 0, err: "", log: "", manual: false,
  in: { l: 0, p: null, ax: W0 / 2, ay: CFG.playerY + 200, b: 0 },
  sigES: null, token: Math.random().toString(36).slice(2, 8), lastSk: ""
};
/* 二号位（客人）的小人：没客人时 active=false，一切按单机跑，零行为变化 */
const p2 = { x: W0 / 2, y: CFG.playerY, vx: 0, invuln: 0, hurtT: 0, o2: CFG.o2Max, dead: false,
             reviveT: 0, kbHold: 0, active: false, name: "潜伴", ghost: 0 };
const A2 = { x: W0 / 2, y: CFG.playerY + CFG.atkReach, cd: 0.4, beam: 0, sx: 0, sy: 0, ex: 0, ey: 0, beamDmg: 0 };
const ICE_CFG = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  /* 对称 NAT（手机热点、部分公司网）下必须靠中继才能连通。这是公共免费 TURN，不保证长期可用；
     介意流量过第三方就删掉它，代价是那部分网络环境连不上（或者自己搭 coturn）。 */
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" }
] };

/* ---------- 双人规则的地基：谁是活的、氧气在谁身上、死了怎么复活 ---------- */
function coopHit() { return NET.connected ? CFG.coopMul : 1; }         // 咬 / 撞 / 电 的伤害倍率
function o2Get(q) { return q === p ? G.o2 : q.o2; }
function o2Set(q, v) { const m = o2MaxNow(); if (q === p) G.o2 = clamp(v, 0, m); else q.o2 = clamp(v, 0, m); }
function o2Sub(q, v) { o2Set(q, o2Get(q) - v); }
function o2Add(q, v) { o2Set(q, o2Get(q) + v); }
function party() { return p2.active ? [p, p2] : [p]; }
function aliveParty() { return party().filter((q) => !q.dead); }
/* 怪的索敌：盯最近的活人（单机时永远返回 p —— 老行为一字不改） */
function nearestAlive(x, y) {
  let best = p, bd = 1e9;
  for (const q of party()) {
    if (q.dead) continue;
    const d = Math.hypot(q.x - x, q.y - y);
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}
function killPlayer(q) {
  if (q.dead) return;
  q.dead = true; q.reviveT = CFG.reviveT; q.vx = 0;
  popup(q.x, q.y - 70, (q === p ? "你倒下了" : "潜伴倒下了") + " · " + CFG.reviveT + "s 后复活", "255,140,140");
  burst(q.x, q.y, 26, "255,150,150");
  if (aliveParty().length === 0) gameOver();          // 全灭才算结束（双人：同时倒下）
}
function reviveTick(q, dt) {
  if (!q.dead) return;
  q.reviveT -= dt;
  if (q.reviveT <= 0) {
    q.dead = false;
    o2Set(q, o2MaxNow() * CFG.reviveO2);
    q.invuln = Math.max(q.invuln, CFG.coopInvuln);
    popup(q.x, q.y - 70, q === p ? "你回来了" : "潜伴回来了", "150,255,200");
    burst(q.x, q.y, 30, "150,255,220");
  }
}
/* 二号位的移动：跟本体同一套「轻点微调 / 长按全速 / 鼠标比例控制」，只是输入来自网络 */
function moveSide(pl, inp, dt) {
  let want = 0;
  const kdir = inp.l | 0;
  if (kdir) {
    pl.kbHold = (pl.kbHold || 0) + dt;
    const k = clamp((pl.kbHold - CFG.kbHold) / CFG.kbRamp, 0, 1);
    const ease = k * k * (3 - 2 * k);
    want = kdir * CFG.maxVX * (CFG.kbTapMul + (1 - CFG.kbTapMul) * ease);
  } else {
    pl.kbHold = 0;
    if (inp.p != null) want = clamp((inp.p - pl.x) * (G.m ? G.m.steer : 4), -CFG.maxVX, CFG.maxVX);
  }
  if (want > 0) want *= clamp((CFG.xMax - pl.x) / CFG.kbSoftEdge, 0, 1);
  else if (want < 0) want *= clamp((pl.x - CFG.xMin) / CFG.kbSoftEdge, 0, 1);
  pl.vx += (want - pl.vx) * Math.min(1, dt * (kdir ? CFG.kbAccel : (G.m ? G.m.accel : 8)));
  pl.x += pl.vx * dt;
  if (pl.x < CFG.xMin) { pl.x = CFG.xMin; pl.vx = 0; }
  if (pl.x > CFG.xMax) { pl.x = CFG.xMax; pl.vx = 0; }
}
function aimAt(src, A, reach) {
  let tx = clamp(A.x, 14, W0 - 14), ty = clamp(A.y, 70, H0 - 12);
  const dx = tx - src.x, dy = ty - src.y, L = Math.hypot(dx, dy);
  if (L > reach) { tx = src.x + (dx / L) * reach; ty = src.y + (dy / L) * reach; }
  return [tx, ty];
}
/* 房主侧：把客人送来的操作跑成二号位（移动 + 自动瞄准射击 + 复活计时） */
function coopHostStep(dt) {
  if (!p2.active) return;
  reviveTick(p2, dt);
  if (p2.dead) return;
  moveSide(p2, NET.in, dt);
  A2.x = NET.in.ax; A2.y = NET.in.ay;
  if (A2.beam > 0) A2.beam = Math.max(0, A2.beam - dt);
  A2.cd -= dt;
  if (A2.cd <= 0) {
    A2.cd = G.m.atkEvery;
    const [ex, ey] = aimAt(p2, A2, CFG.atkReach);
    fireAttackFrom(p2, A2, ex, ey);
  }
  if (p2.invuln > 0) p2.invuln = Math.max(0, p2.invuln - dt);
  p2.hurtT = Math.max(0, p2.hurtT - dt);
}

/* ---------- 快照 ---------- */
function netPackEnt(e) {
  if (e.nid === undefined) e.nid = ++NET.nidSeq;
  const f = (e.flash > 0 ? 1 : 0) | (e.shield && e.breakT <= 0 ? 2 : 0) | (e.armOn ? 4 : 0) | (e.kid ? 8 : 0)
          | (e.invT > 0 ? 16 : 0) | (e.dead ? 32 : 0) | ((e.vx || 0) >= 0 ? 64 : 0) | (e.pinT > 0 ? 128 : 0);
  return [e.nid, e.kind, Math.round(e.x), Math.round(e.y), Math.round(e.r), Math.round(e.hp),
          Math.round(e.maxHp || e.hp), f, Math.round(e.seed || 0), Math.round(e.seal || 0), Math.round(e.shellT || 0)];
}
function netSnapBuild() {
  const S = {
    t: performance.now() | 0, st: G.state, d: Math.round(G.depth), sp: Math.round(G.speed),
    o2: +G.o2.toFixed(1), lr: Math.round(G.lightR), lb: Math.round(G.lightBonus), le: +(G.lightEat || 0).toFixed(2),
    bn: Math.round(G.bonus), lv: G.level, kn: G.kills, ac: [+G.act.q.toFixed(1), +G.act.e.toFixed(1), +G.act.f.toFixed(1)],
    mu: G.mutate || "", t2: G.t2 || "", sk: G.sk,
    a: [Math.round(p.x), Math.round(p.y), +p.invuln.toFixed(1), p.dead ? 1 : 0, +p.reviveT.toFixed(1)],
    b: [Math.round(p2.x), Math.round(p2.y), +p2.invuln.toFixed(1), p2.dead ? 1 : 0, +p2.reviveT.toFixed(1), +o2Get(p2).toFixed(1)],
    ab: [+A2.beam.toFixed(2), Math.round(A2.sx), Math.round(A2.sy), Math.round(A2.ex), Math.round(A2.ey)],
    e: [], z: []
  };
  for (const e of ents) S.e.push(netPackEnt(e));
  for (const z of G.zones) S.z.push([z.type, Math.round(z.x), Math.round(z.y), Math.round(z.r || 0), +(z.life || 0).toFixed(1),
                                     z.col || "", z.nx === undefined ? null : +z.nx.toFixed(2), z.ny === undefined ? null : +z.ny.toFixed(2)]);
  return S;
}
/* 客人侧：解包 → 按 nid 配对插值 → 写进本地世界（渲染代码一个字都不用改） */
const NET_ENT_MAP = new Map();
function netEntFrom(arr, prev) {
  const [nid, kind, x, y, r, hp, maxHp, f, seed, seal, shellT] = arr;
  let o = NET_ENT_MAP.get(nid);
  if (!o) { o = { nid: nid }; NET_ENT_MAP.set(nid, o); }
  if (prev) { o.px = prev[2]; o.py = prev[3]; } else { o.px = x; o.py = y; }
  o.kind = kind; o.x = x; o.y = y; o.r = r; o.hp = hp; o.maxHp = maxHp; o.seed = seed; o.seal = seal; o.shellT = shellT;
  o.flash = (f & 1) ? 0.16 : 0;
  o.shield = !!(f & 2); o.breakT = 0; o.shieldHp = 1;
  o.armOn = !!(f & 4); o.armFlash = 0; o.kid = !!(f & 8); o.invT = (f & 16) ? 0.5 : 0;
  o.dead = !!(f & 32); o.vx = (f & 64) ? 1 : -1; o.pinT = (f & 128) ? 1 : 0;
  o.near = false; o.chip = 0; o.dashS = 0;
  return o;
}
function netApplySnap() {
  const A = NET.snapA, B = NET.snapB;
  if (!B) return;
  const sb = B.s, sa = A ? A.s : null;
  const span = A ? Math.max(1, B.t - A.t) : 1;
  const a = A ? clamp((performance.now() - 120 - A.t) / span, 0, 1) : 1;
  const L = (k, d) => {
    if (!sa) return sb[k] === undefined ? d : sb[k];
    const v1 = sa[k], v2 = sb[k];
    return (typeof v1 === "number" && typeof v2 === "number") ? v1 + (v2 - v1) * a : (v2 === undefined ? d : v2);
  };
  /* 世界标量 */
  G.state = sb.st; G.depth = L("d", G.depth); G.speed = L("sp", G.speed);
  G.lightR = L("lr", G.lightR); G.lightBonus = L("lb", G.lightBonus); G.lightEat = L("le", 0);
  G.bonus = L("bn", G.bonus); G.level = sb.lv; G.kills = sb.kn;
  for (let k = 0; k < 3; k++) {
    const key = ["q", "e", "f"][k];
    G.act[key] = sa ? (sa.ac[k] + (sb.ac[k] - sa.ac[k]) * a) : sb.ac[k];
  }
  if (NET.lastSk !== JSON.stringify(sb.sk) || G.mutate !== sb.mu || G.t2 !== sb.t2) {
    NET.lastSk = JSON.stringify(sb.sk);
    G.mutate = sb.mu || null; G.t2 = sb.t2 || null; G.sk = JSON.parse(NET.lastSk);
    recalcMods();
  }
  /* 房主（远端）那个小人 */
  const pa = sa ? sa.a : sb.a, pb = sb.a;
  p.x = pa[0] + (pb[0] - pa[0]) * a; p.y = pa[1] + (pb[1] - pa[1]) * a;
  p.invuln = pb[2]; p.dead = !!pb[3]; p.reviveT = pb[4] || 0;
  p.o2 = L("o2", 100);                                   // 队友的氧（HUD 第二条读它）
  G.o2 = L("o2b", G.o2);                                 // 我自己的氧 = 二号位那瓶（HUD 主条读它）
  /* 我自己那个小人（客人 = 二号位） */
  const ba = sa ? sa.b : sb.b, bb = sb.b;
  const tgtX = ba[0] + (bb[0] - ba[0]) * a, tgtY = ba[1] + (bb[1] - ba[1]) * a;
  if (Math.abs(p2.x - tgtX) > 60) p2.x = tgtX; else p2.x += (tgtX - p2.x) * 0.18;   // 本地预测为主，误差大了才纠
  p2.y = tgtY; p2.invuln = bb[2]; p2.dead = !!bb[3]; p2.reviveT = bb[4] || 0; p2.o2 = bb[5];
  /* 实体：按 nid 配对插值 */
  const list = [];
  for (let i = 0; i < sb.e.length; i++) {
    const arr = sb.e[i];
    const prev = sa ? sa.e.find((q) => q[0] === arr[0]) : null;
    const o = netEntFrom(arr, prev);
    o.x = o.px + (arr[2] - o.px) * a; o.y = o.py + (arr[3] - o.py) * a;
    list.push(o);
  }
  ents.length = 0;
  for (const o of list) ents.push(o);
  /* 场：直接照抄（不用插值，踩在上面看不出抖） */
  G.zones.length = 0;
  for (const z of sb.z) {
    G.zones.push({ type: z[0], x: z[1], y: z[2], r: z[3], life: z[4], col: z[5],
                   nx: z[6] === null ? undefined : z[6], ny: z[7] === null ? undefined : z[7] });
  }
}
/* 客人侧的每帧：不跑模拟，只跑纯视觉系统 + 套快照 + 本地预测自己的小人 */
function netGuestFrame(dt) {
  G.t += dt;
  updateSnow(dt); updateParticles(dt); updateFxRings(dt); updatePopups(dt);
  if (G.shakeT > 0) G.shakeT = Math.max(0, G.shakeT - dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3.2);
  if (G.redFlash > 0) G.redFlash = Math.max(0, G.redFlash - dt * 2.2);
  if (G.state === "play" && G.m && !p2.dead) {
    /* 本地预测：自己的小人先动起来（不等房主回包），快照回来再小幅校正 */
    const inp = { l: (G.input.right ? 1 : 0) - (G.input.left ? 1 : 0),
                  p: G.input.ptrActive ? G.input.ptrX : null, ax: G.aim.x, ay: G.aim.y, b: G.boosting ? 1 : 0 };
    NET.in = inp;
    moveSide(p2, inp, dt);
    A2.x = G.aim.x; A2.y = G.aim.y;
    if (A2.beam > 0) A2.beam = Math.max(0, A2.beam - dt);
    A2.cd -= dt;
    if (A2.cd <= 0) {                                   // 只画光束，伤害由房主算
      A2.cd = G.m.atkEvery;
      const [ex, ey] = aimAt(p2, A2, CFG.atkReach);
      A2.sx = p2.x; A2.sy = p2.y; A2.ex = ex; A2.ey = ey; A2.beam = CFG.beamT;
    }
    if (p2.invuln > 0) p2.invuln = Math.max(0, p2.invuln - dt);
  }
  if (!NET.connected) return;                            // 还没连上：先只跑视觉，等握手
  netApplySnap();
  /* 操作上行 30Hz */
  if (performance.now() - NET.lastInput >= 33) {
    NET.lastInput = performance.now();
    netSend({ k: "i", l: NET.in.l, x: Math.round(NET.in.ax), y: Math.round(NET.in.ay), b: NET.in.b, p: NET.in.p === null ? null : Math.round(NET.in.p) });
  }
}
/* 房主侧的每帧：p2 由 stepPlay 里的 coopHostStep 跑，这里只负责下行快照 + ping */
function netHostTick(dt) {
  if (!NET.connected) return;
  if (performance.now() - NET.lastSnap >= 66) { NET.lastSnap = performance.now(); netSend({ k: "s", s: netSnapBuild() }); }
  if (performance.now() - NET.lastPing >= 1000) { NET.lastPing = performance.now(); netSend({ k: "p", t: performance.now() | 0 }); }
}

/* ---------- 传输 ---------- */
function netSend(obj) {
  if (NET.dc && NET.dc.readyState === "open") { try { NET.dc.send(JSON.stringify(obj)); } catch (e) { NET.err = "发送失败"; } }
}
function netLog(s) { NET.log = s; const el = document.getElementById("netStatus"); if (el) el.textContent = s; }
function netWire(pc, isHost) {
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    NET.connected = st === "connected";
    if (!isHost) p2.active = false;                      // 客人的小人由房主模拟，自己这边只画
    netLog(netLogText());
  };
  if (isHost) {
    pc.ondatachannel = null;
  } else {
    pc.ondatachannel = (ev) => { NET.dc = ev.channel; netWireDC(); };
  }
}
function netWireDC() {
  if (!NET.dc) return;
  NET.dc.onopen = () => {
    NET.connected = true;
    p2.active = true;                      // 二号位登场（房主负责模拟它，客人只画它）
    p2.dead = false; p2.reviveT = 0; o2Set(p2, o2MaxNow() * 0.75);
    popup(p.x, p.y - 90, "潜伴已连接 · 双人难度 ×" + CFG.coopMul, "150,255,200");
    netLog(netLogText());
  };
  NET.dc.onclose = () => { NET.connected = false; p2.active = false; netLog(netLogText()); };
  NET.dc.onmessage = (ev) => {
    let m = null; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.k === "s") { NET.snapA = NET.snapB; NET.snapB = { s: m.s, t: performance.now() }; }
    else if (m.k === "i") { NET.in = { l: m.l | 0, p: m.p === null ? null : m.p, ax: m.x, ay: m.y, b: m.b | 0 }; }
    else if (m.k === "p") { NET.rtt = Math.max(0, (performance.now() | 0) - m.t); netSend({ k: "q", t: m.t }); }
    else if (m.k === "q") { NET.rtt = Math.max(0, (performance.now() | 0) - m.t); }
  };
}
function netLogText() {
  if (!NET.on) return "未联机";
  const role = NET.role === "host" ? "房主" : "客人";
  if (!NET.connected) return role + " · 房间 " + NET.code + " · 等待连接…";
  return role + " · 房间 " + NET.code + " · 已连接 · " + NET.rtt + "ms" + (NET.role === "host" ? " · 双人难度 ×" + CFG.coopMul : "");
}
async function netWaitIce(pc, ms) {
  if (pc.iceGatheringState === "complete") return;
  await new Promise((res) => {
    const t = setTimeout(res, ms || 2500);
    pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); } };
  });
}
/* ---------- 信令：ntfy.sh 公共主题（房间码当主题名） ---------- */
const netTopic = (code) => "sink-" + code + "-r1";
async function netPub(code, obj) {
  try {
    const r = await fetch("https://ntfy.sh/" + netTopic(code), { method: "POST", body: JSON.stringify(obj) });
    return r.ok;
  } catch (e) { NET.err = "信令发送失败（网络被挡？可切手动模式）"; return false; }
}
function netSub(code, onMsg) {
  try {
    if (NET.sigES) NET.sigES.close();
    const es = new EventSource("https://ntfy.sh/" + netTopic(code) + "/sse");
    es.onmessage = (ev) => {
      try { const d = JSON.parse(ev.data); if (!d.message) return; const m = JSON.parse(d.message); if (m.tk !== NET.token) onMsg(m); } catch (e) {}
    };
    es.onerror = () => { NET.err = "信令通道异常（可切手动模式）"; };
    NET.sigES = es;
  } catch (e) { NET.err = "信令订阅失败：" + e.message; }
}
function netCode() {
  const AB = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += AB[Math.floor(Math.random() * AB.length)];
  return s;
}
/* ---------- 建连：房主 / 客人（自动 + 手动两套入口，走的是同一份 SDP 逻辑） ---------- */
async function netHostCreate(code, manual) {
  netClose(true);
  NET.on = true; NET.role = "host"; NET.code = code; NET.manual = !!manual;
  NET.pc = new RTCPeerConnection(ICE_CFG);
  NET.dc = NET.pc.createDataChannel("sink", { ordered: true });
  netWireDC();
  netWire(NET.pc, true);
  const offer = await NET.pc.createOffer();
  await NET.pc.setLocalDescription(offer);
  await netWaitIce(NET.pc);
  if (!manual) {
    netSub(code, async (m) => {
      if (m.k === "hello") { await netPub(code, { k: "off", tk: NET.token, sdp: NET.pc.localDescription.sdp }); }
      else if (m.k === "ans") { try { await NET.pc.setRemoteDescription({ type: "answer", sdp: m.sdp }); } catch (e) { NET.err = "应答无效"; } }
    });
    await netPub(code, { k: "off", tk: NET.token, sdp: NET.pc.localDescription.sdp });
  }
  netLog(netLogText());

}
async function netGuestJoin(code, manual) {
  netClose(true);
  NET.on = true; NET.role = "guest"; NET.code = code; NET.manual = !!manual;
  netLog(netLogText());
  if (!manual) netSub(code, async (m) => { if (m.k === "off") await netGuestAnswer(m.sdp); });
  await netPub(code, { k: "hello", tk: NET.token });
}
async function netGuestAnswer(offerSdp) {
  if (NET.pc && NET.pc.currentRemoteDescription) return "";
  NET.pc = new RTCPeerConnection(ICE_CFG);
  netWire(NET.pc, false);
  await NET.pc.setRemoteDescription({ type: "offer", sdp: offerSdp });
  const ans = await NET.pc.createAnswer();
  await NET.pc.setLocalDescription(ans);
  await netWaitIce(NET.pc);
  NET.guestReady = true;
  if (!NET.manual) { await netPub(NET.code, { k: "ans", tk: NET.token, sdp: NET.pc.localDescription.sdp }); netLog("已把应答发回房主，等通道建立…"); }
  return NET.pc.localDescription.sdp;
}
async function netHostAccept(answerSdp) {
  if (!NET.pc) return false;
  try { await NET.pc.setRemoteDescription({ type: "answer", sdp: answerSdp }); return true; }
  catch (e) { NET.err = "应答无效：" + e.message; return false; }
}
function netClose(silent) {
  try { if (NET.sigES) NET.sigES.close(); } catch (e) {}
  try { if (NET.dc) NET.dc.close(); } catch (e) {}
  try { if (NET.pc) NET.pc.close(); } catch (e) {}
  NET.sigES = null; NET.dc = null; NET.pc = null; NET.connected = false;
  NET.snapA = NET.snapB = null; NET_ENT_MAP.clear();
  p2.active = false; p2.dead = false; p2.reviveT = 0;
  if (!silent) { NET.on = false; NET.role = null; NET.code = ""; }

}

/* 二号位的本体（跟主玩家同一套皮肤，颜色偏蓝、头顶挂名） */
function drawPlayer2() {
  if (!p2.active) return;
  const bob = Math.sin(G.t * 2.2 + 1.7) * 3;
  const x = p2.x, y = p2.y + bob;
  ctx.save();
  if (p2.dead || (p2.invuln > 0 && Math.floor(G.t * 14) % 2 === 0)) ctx.globalAlpha = 0.4;
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(x, y, 2, x, y, 120);
  g.addColorStop(0, "rgba(150,255,235,0.30)");
  g.addColorStop(1, "rgba(60,200,190,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 120, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(clamp(p2.vx / 700, -0.5, 0.5) * 0.6);
  ctx.beginPath();
  const R = CFG.playerR;
  ctx.moveTo(R * 1.5, 0);
  ctx.quadraticCurveTo(R * 0.2, -R * 1.05, -R * 1.1, -R * 0.35);
  ctx.quadraticCurveTo(-R * 1.7, 0, -R * 1.1, R * 0.35);
  ctx.quadraticCurveTo(R * 0.2, R * 1.05, R * 1.5, 0);
  ctx.closePath();
  /* 队友必须一眼看得见：深水里「暗青鱼」跟背景糊成一团（第一版就是这个问题，截图里几乎找不到人），
     所以本体给亮青 + 白描边，头顶常驻名牌 */
  ctx.fillStyle = p2.dead ? "rgba(70,80,90,0.75)" : "rgba(64,200,178,0.95)";
  ctx.fill();
  ctx.strokeStyle = p2.dead ? "rgba(170,190,200,0.6)" : "rgba(225,255,250,0.98)";
  ctx.lineWidth = 2.2; ctx.stroke();
  ctx.fillStyle = "rgba(240,255,252,0.98)";
  ctx.beginPath(); ctx.arc(R * 0.42, -R * 0.2, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  text(p2.dead ? "潜伴 · 复活 " + Math.max(0, p2.reviveT).toFixed(1) + "s" : "潜伴",
       x, y - 34, 12, p2.dead ? "rgba(255,170,170,0.95)" : "rgba(180,255,240,0.95)", "center", 700);
}

function update(dt) {
  G.t += dt;
  if (G.shakeT > 0) G.shakeT = Math.max(0, G.shakeT - dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3.2);
  if (G.redFlash > 0) G.redFlash = Math.max(0, G.redFlash - dt * 2.2);
  updateSnow(dt);
  updateParticles(dt);
  updateFxRings(dt);
  updatePopups(dt);
  if (G.state === "play") stepPlay(dt);
  else if (G.state === "over") stepTrail(dt);      // 结算画面：尾流慢慢散干净
  if (G.state === "title" || G.state === "over") { G.speed += (CFG.baseSpeed - G.speed) * Math.min(1, dt * 2); }
  /* 行灯环：位置放在本体挪完之后再算（早一步算就会慢一帧 —— 探针量出 28~214px 的乱值）。
     这里在 update() 里，标题页 G.m 还是 null，必须先挡一道。 */
  if (G.state === "play" && G.m && G.m.lant) {
    const lamps = [];
    for (const z of G.zones) if (z.type === "lamp") lamps.push(z);
    G.lampA = (G.lampA || 0) + G.m.lant.spin * dt;         // 整圈慢慢转
    /* 进阶·长明双环：外环 8 盏（半径 106）内环 4 盏（半径 72），两圈反向转 */
    const dual = G.t2 === "lantB";
    const nIn = dual ? Math.min(4, lamps.length) : 0;
    const nOut = lamps.length - nIn;
    for (let k = 0; k < lamps.length; k++) {
      const z = lamps[k];
      const inner = dual && k >= nOut;
      const idx = inner ? k - nOut : k, cnt = Math.max(1, inner ? nIn : nOut);
      const dir = inner ? -1 : 1;
      const a = G.lampA * dir + idx * Math.PI * 2 / cnt + (inner ? 0.6 : 0);
      z.px = z.x; z.py = z.y;                              // 火线要连「上一帧的那一盏」
      const orb = dual ? (inner ? 72 : 106) : G.m.lant.orbit;
      z.x = p.x + Math.cos(a) * orb;
      z.y = p.y + Math.sin(a) * orb * 0.62;                 // 压扁成椭圆，像真的绕着船转
    }
  }
  SFX.droneUpdate(clamp((G.speed - CFG.baseSpeed) / (CFG.boostSpeed - CFG.baseSpeed), 0, 1));
}

/* ============================ 7. Render ================================== */
function rrRect(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function text(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 600) + " " + size + 'px "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
/* 卡面描述换行（2026-09-25 玩家截图：护心符那条描述 336px，卡面只有 252px，直接冲出卡边）。
   贪心断行：中文按字断，连续英文/数字/符号（35 10s 之类）当一个整块，不拆开。
   maxW 是「每一行都不许超过的宽度」，字体必须和真正画的时候一致，量了才算数。 */
function wrapText(str, maxW, size, weight) {
  ctx.font = (weight || 600) + " " + size + 'px "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif';
  const toks = String(str).match(/[A-Za-z0-9+×.\-%/]+|\s+|[\s\S]/g) || [];
  const lines = [];
  let line = "";
  for (const tk of toks) {
    if (tk === "\n") { lines.push(line); line = ""; continue; }
    if (line && ctx.measureText(line + tk).width > maxW) { lines.push(line); line = tk.replace(/^\s+/, ""); }
    else line += tk;
  }
  lines.push(line);
  return lines;
}
function panel(x, y, w, h) {
  rrRect(x, y, w, h, 18);
  ctx.fillStyle = "rgba(4,14,26,0.84)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,190,230,0.26)"; ctx.lineWidth = 1.5; ctx.stroke();
}
