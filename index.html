<script>
"use strict";
/* =============================================================================
   深潜 · SINK  —  单文件网页小游戏（零依赖 / 零素材 / 零网络请求）
   -----------------------------------------------------------------------------
   核心循环：深度 = 分数；氧气是唯一生命；加速下潜 = ×2.5 得分但氧气 ×2、视野更小。
   「越贪越快，越快越瞎。」
   分区：0 Config · 1 Utils · 2 Store · 3 Audio · 4 Canvas · 5 State
        6 Update · 7 Render · 8 Input · 9 Loop · 10 SelfTest/Debug
   ============================================================================= */

/* ============================ 0. Config ================================== */
const W0 = 960, H0 = 600;              // 逻辑分辨率（渲染层按等比缩放铺满窗口）
const CFG = {
  pxPerMeter: 12,                      // 12 逻辑像素 = 1 米
  baseSpeed: 130,                      // 正常下潜 px/s
  boostSpeed: 360,                     // 加速下潜 px/s
  boostMul: 2.5,                       // 加速段得分倍率
  playerR: 13,
  playerY: 192,
  xMin: 46, xMax: W0 - 46,
  maxVX: 640, steerK: 14, accelK: 20,  // 转向手感
  /* 键盘转向（A/D）：按住＝踩油门（轻点微调 / 长按全速），不是一按就到顶的火箭。
     原来 want 直接给 ±maxVX，实测轻点 0.16s 就冲到 97% 全速、贴边还剩 461px/s 撞墙 → 又冲又不准。 */
  kbAccel: 24, kbHold: 0.12, kbRamp: 0.35, kbTapMul: 0.30,
  kbSoftEdge: 120,                     // 贴边 120px 内线性收力：软着陆，不撞墙急停
  boostRamp: 24, speedRamp: 9,         // 下潜手感：踩加速要脆(τ≈42ms)，松开要顺(τ≈110ms)
  o2Max: 100,
  o2Drain: 1.12,                       // 基础 1.12/s → 约 89 秒
  boostDrainMul: 2.05,
  /* --- 深渊压力：随深度缓慢加压，曲线 d/(d+diffHalf) 永远爬不到顶 --- */
  diffHalf: 1500,                      // 600m→29% · 1500m→50% · 4500m→75%（深水段原样不动）
  diffGrace: 160,                      // 前 160m 不计压力（缓坡起步）：600m→23% · 900m→33%（原来 38%）
  drainGain: 0.50,                     // 氧气消耗 ×(1+压力×0.50)
  bubbleLoss: 0.20,                    // 气泡含氧 ×(1-压力×0.20)，最低保 58%
  hitGain: 0.45,                       // 撞击伤害 ×(1+压力×0.45)
  rowGain: 0.14,                       // 障碍行更密 ×(1-压力×0.14)，最低 0.76×
  gapGain: 0.08,                       // 安全走廊更窄 ×(1-压力×0.08)
  extraObst: 0.30,                     // 每行多塞一个障碍的概率 = 压力×0.30
  hitDamage: 15,
  bubbleO2: 13,
  bubbleThin: 700,                     // 越深气泡越稀：间隔 ×(1+depth/700×0.9)。
                                       // 原来 4000 太松 —— 深水「完美捡泡 = 净回氧」，脚本对局 3/9 种子跑成 300s 不朽。
                                       // 改 700 后有氧上限才是真的上限：中位 87.6s、8/9 落在 60~120s 带内。
  invulnTime: 1.2,
  hitSlowTime: 0.65, hitSlowMul: 0.45,
  nearMissBonus: 5, nearMissPad: 22,
  lightNear: 360, lightFar: 150, lightSpan: 900,
  lightMut: 60,                        // 质变·灯距：每级 +60（永久视野）
  jellyLight: 200, jellyDecay: 9, jellyCap: 560,   // 捡一只：视野 +200，约 22s 才衰减干净（原来 90/26，两秒就没了）
  rowNear: 0.72, rowFar: 0.34, rowSpan: 1300,   // 障碍行间隔随深度收紧
  gapNear: 330, gapFar: 215,                    // 安全走廊宽度
  gapStep: 200,                                 // 相邻走廊最大横移（保证「过得去」）
  bubbleEvery: [0.45, 1.05],
  jellyEvery: [5.5, 9.5],
  /* --- 战斗：准星 + 普攻（AD 推准星，光束打在准星那条线上） --- */
  atkDmg: 50,                          // 单发伤害：石头 100 血＝两发，泥鳅 30 血＝一发
  atkEvery: 0.50,                      // 连发间隔（速射技能缩它）
  atkReach: 300,                       // 准星在玩家正前方多远（逻辑像素）
  atkHalfW: 22,                        // 光束半宽＝判定宽容度（散射技能加宽它）
  beamT: 0.13,                         // 光束视觉残留
  aimLerp: 16,                         // 准星跟手速度（越大越硬）
  aimAutoR: 520,                       // 自动瞄准：这个距离内最近的怪物会被准星咬住
  aimIdle: 2.5,                        // 鼠标停手多久后交给自动瞄准（一动鼠标立刻收回控制权）
  rockHP: 100, cableHP: 30,            // 石头 / 泥鳅（线缆）血量
  /* --- 深海猎食者：1000m 以下才出现，且刚过线有一段适应期 ---
     注意：怪是所有氧气压力的主承重墙 —— 砍太狠局时会失控变长（实测砍 5 倍 → 中位 183s、3 局撞 300s 上限）。
     所以浅段只留 35% 的爬升，深段反而要比原版更凶（原 deepen=0.7+1.4×压力）。 */
  mobFrom: 1000,
  mobRamp: 400, mobIntro: 0.30,        // 只软化 1000~1400m 这一段，1400m 起恢复原版压力
  mobCapBase: 2, mobCapGain: 4,        // 同时在场上限 = 2 + 4×压力（压力 0.4→4 只，0.63→5 只）
  mobDeepen: [0.70, 1.40],             // 深段倍率 = 0.70 + 1.40×压力（＝原版，别动）
  hunterHP: 150, hunterEvery: [2.1, 3.7], hunterRush: 215, hunterVX: 200, huntDamage: 18,
  spitterHP: 90, spitterEvery: [2.8, 4.6], spitterRush: 70, spitterVX: 130,
  boltEvery: [1.3, 2.0], boltDmg: 12, boltSpeed: 235, boltR: 8,
  /* --- 2026-09-25 玩家反馈：后期怪太软（照明使者原地放技能就能躺赢） ---
     两手：① 1800m 起所有怪物血量爬坡（×2 → ×3 封顶）；② 2000m 起新增两种猎食者。
     剃刀鲸：斜插猛冲的大家伙，撞完不消失，逼你真的挪位置；
     圣盾使：金钟水母放三连电球，盾开着减伤 75%，盾碎 3.5s 才能重开 —— 先破盾再输出。 */
  mobHpFrom: 1800, mobHpSpan: 1600, mobHpCap: 3,
  reaverHP: 320, reaverEvery: [4.5, 7.5], reaverRush: 95, reaverVX: 265, reaverDmg: 22,
  wardenHP: 260, wardenEvery: [6.0, 9.5], wardenFan: [2.4, 3.4], wardenShieldCut: 0.75, wardenBreakT: 3.5,
  killScore: 40, breakScore: 6,
  /* --- 击杀回氧：自带被动，不用选技能（回的是「氧气上限的百分比」，不随深度缩水）
     但它天生是「无限刷」：怪随深度变多，回氧速率会超过耗氧 1.12~1.68/s ——
     实测 killO2=0.10 无递减时 12/12 种子跑成 300s 不朽（平均回氧 2057，撞穿计时上限）。
     所以加连杀递减：一波里的第一只满额（＝你要的 10%），killComboReset 秒内再杀按 killComboMul 逐只打折。
     0.50/8.0 是 7 变体×12 种子扫出来的最优：12/12 落在 60~120s 带内（中位 95.6s，范围 75~110），
     比「完全关掉回氧」的 11/12 还稳，平均回氧 20.8 —— 手感有了，无限刷没了。 --- */
  killO2: 0.10,
  killComboMul: 0.50, killComboReset: 8.0,
  /* --- 主动技能（Q/E/F）：冷却制，要玩家自己按，绝不跟普攻一起自动放 --- */
  /* 2026-09-25 玩家反馈：冷却太长了 → 7s 降到 4s（「凝神」每级 ×0.88，点满 5 级约 2.1s） */
  shockCd: 4.0, shockR: 240, shockMob: 150, shockObst: 200,   // 冲击波：以本体为圆心的清场
  dashCd: 5.0, dashT: 1.1, dashMul: 2.4, dashDmg: 80,         // 突进：无敌 + 提速 + 撞碎挡路的
  flareCd: 10.0, flareT: 4.0, flareLight: 620,                // 探照：短时间内把黑暗推开
  /* 深水斜坡（不封顶）：1.2km 以内完全不变 —— 前段手感是玩家点名要保的；
     再深就按 deepSpan 线性加价。没有这一档，强化一多深水就成永动机，
     实测 9 个种子里 4 个能一路顶到 300s 上限都不死。 */
  deepFrom: 1100, deepSpan: 1400,
  /* --- 深渊馈赠（割草式三选一）：每 CFG.lvEvery 米一次 ---
     2026-09-25 玩家要求：原来 100/180/260… 越往后越稀，1km 才强化 4~5 次，深水压力直接糊脸。
     现在恒定 100m 一次：到 1km 正好 10 次，前段攒得出东西，深水反而好玩。 */
  lvEvery: 100,
  /* 神器牌：稀有档 —— 每次三选一按这个概率「混进来一张」，命中就占掉一个卡位。
     2026-09-25 玩家反馈「概率要足够低」：0.22 → 0.09（约每 11 次三选一才见一张）。 */
  artChance: 0.09,
  /* 质变：2000m 后的第一次三选一 = 三条全新方向（MUTATIONS） */
  mutateAt: 2000,
  /* 神器上限：一局最多持有几张（新神器只在持有数 < 上限时判定） */
  artCap: 3,
  /* 新机制的公共旋钮（数值在 recalcMods 里按「本职业 / 外职业」分档） */
  zoneLife: 60,        // 场上同时存在的「场」上限（超了挤掉最老的）
  /* 刷新：每局可以重抽几次三选一（2026-09-25 玩家要求：两次，每次重抽都还是三张） */
  rerollPerRun: 2,
  /* 流派纯度：1000m 之前、选定流派之后，三选一只给自己的流派牌（基础牌一张不掺） */
  routeOnlyUntil: 1000
};

/* 深渊压力 0→1：0m 是 0，越深越接近 1 但永远到不了顶 —— 慢，且不封顶 */
/* 深渊压力曲线：前 CFG.diffGrace 米是「缓坡起步」，之后才按 d/(d+half) 爬 ——
   玩家反馈「难度增加太快」：生效的是前中段（人还没到深水就死了），
   所以给前段一个起步宽限，深水段保持原样（不然尾段会松到出现 240s 准不朽局）。 */
function diffK(depth) { const d = Math.max(0, depth - CFG.diffGrace); return d / (d + CFG.diffHalf); }

/* ---------- 深渊馈赠：技能池（每级线性叠加，满 5 级不再出现） ----------
   minD = 解锁深度；w = 抽卡权重。类型只决定配色与手感，不影响数值。 */
const SKILLS = [
  { id: "greed",  n: "贪婪", t: "收益", d: "加速得分倍率 +0.30",       max: 5, minD: 0,   w: 1.0 },
  { id: "haul",   n: "打捞", t: "收益", d: "气泡含氧 +4",              max: 5, minD: 0,   w: 1.0 },
  { id: "edge",   n: "擦身", t: "收益", d: "擦身 +6 分 · 判定垫 +4px",  max: 5, minD: 120, w: 1.0 },
  { id: "seal",   n: "气密", t: "生存", d: "氧气上限 +18（立刻补上）",   max: 5, minD: 0,   w: 1.0 },
  { id: "eco",    n: "节氧", t: "生存", d: "耗氧 ×0.90",               max: 5, minD: 200, w: 0.9 },
  { id: "plate",  n: "耐压", t: "生存", d: "撞击伤害 ×0.85",            max: 5, minD: 200, w: 0.9 },
  { id: "shell",  n: "缓冲", t: "生存", d: "受击无敌 +0.30s",           max: 5, minD: 400, w: 0.8 },
  { id: "stream", n: "流线", t: "机动", d: "常速 +8%",                 max: 5, minD: 0,   w: 1.0 },
  { id: "rudder", n: "舵效", t: "机动", d: "转向响应 +22%",             max: 5, minD: 0,   w: 1.0 },

  { id: "magnet", n: "磁力", t: "采集", d: "吸附半径 +55px",            max: 5, minD: 150, w: 0.95 },
  { id: "bloom",  n: "流萤", t: "采集", d: "水母视野 +60 · 更常见",      max: 5, minD: 150, w: 0.95 },
  /* --- 战斗：普攻强化。权重 2.2（其余牌 ~1.0），且解锁深度整体提前 ——
     原来 minD 260~520，实测整局 7 次三选一里战斗牌只撞上 2 次，玩家「根本找不到特殊技能」。 --- */
  { id: "power",   n: "火力", t: "战斗", d: "普攻伤害 +25",                        max: 5, minD: 170, w: 2.2 },
  { id: "rapid",   n: "速射", t: "战斗", d: "普攻间隔 ×0.82",                      max: 5, minD: 240, w: 2.2 },
  { id: "crusher", n: "碎岩", t: "战斗", d: "普攻对障碍物 +50 伤害（一击碎泥鳅）",   max: 5, minD: 330, w: 2.2 },
  { id: "spread",  n: "散射", t: "战斗", d: "普攻光束 +16px 宽",                    max: 5, minD: 420, w: 2.2 },
  /* --- 主动技能强化：「主动」是独立一档（不稀释战斗牌保底），专管 Q/E/F 三个要自己按的技能 --- */
  { id: "overload",  n: "过载", t: "主动", r: "mage", d: "冲击波 半径 +40 · 伤害 +30",        max: 5, minD: 300, w: 1.7 },
  { id: "afterburn", n: "余燃", t: "主动", r: "warrior", d: "突进 冷却 −1.0s · 无敌 +0.25s",     max: 5, minD: 360, w: 1.7 },
  { id: "lumen",     n: "长明", t: "主动", r: "lamp", d: "探照 持续 +2s · 半径 +120",         max: 5, minD: 480, w: 1.7 },
  { id: "m_cd",     n: "凝神", t: "主动", r: "mage",    d: "冲击波 冷却 x0.88",          max: 5, minD: 300, w: 1.7 },
  { id: "m_dmg",    n: "震荡", t: "主动", r: "mage",    d: "冲击波 伤害 +40",            max: 5, minD: 380, w: 1.7 },

  { id: "w_hp",     n: "铁躯", t: "主动", r: "warrior", d: "氧气上限 +22（立刻补上）",     max: 5, minD: 320, w: 1.7 },
  { id: "w_ram",    n: "猛撞", t: "主动", r: "warrior", d: "突进撞击伤害 +50（怪也能撞）", max: 5, minD: 400, w: 1.7 },
  { id: "w_vamp",   n: "噬血", t: "主动", r: "warrior", d: "突进撞碎 / 撞死 回氧 +2.5%",  max: 5, minD: 480, w: 1.7 },
  { id: "l_dot",    n: "灼光", t: "主动", r: "lamp",    d: "探照期间 每秒灼伤 30",        max: 5, minD: 340, w: 1.7 },

/* ---------- 神器牌：职业质变件（2026-09-25 玩家要求重做）----------
   设计口径（玩家原话）：「要让某个职业拿到特定神器之后，强度大幅提升」。
   ① 每件神器写死一个「归属职业」（r 字段）：**本职业拿到 = 质变级强度**，
      外职业拿到 = 一条明显更弱的通用版（不给废牌，但也不给错配的强度）；
   ② 抽神器时**七成概率先看本职业**（rollChoices 里那段），所以「配对上本职业」是常态而不是运气；
   ③ 全部被动生效，不用玩家按（玩家口径：神器 = 一个被动技能）；
   ④ 一局最多 3 张（artCap），每张可升 Lv2 —— 升级牌只在已持有之后混进池；
   ⑤ 老的四张（护心符 / 荆棘甲 / 双生光束 / 深渊回响）按玩家指示**整套删除**：
      它们是「谁的数值都加一点」的通用件，正是玩家嫌的「不适配职业」。 */
const ARTIFACTS = [
  /* 法师：让「冲击波」在你身后继续工作 */
  { id: "t_core", n: "✦ 湮灭核心", r: "mage", t: "神器", d: "冲击波落点留下 3.5s 核心：牵引周围怪 · 灼伤 30/s（外职业：每 4 发普攻留个小核心）", max: 2, minD: 200, w: 1.0 },
  { id: "t_void", n: "✦ 虚空回响", r: "mage", t: "神器", d: "每次击杀让冲击波冷却 −0.7s —— 连杀就无限炸（外职业：击杀 −0.2s 全部技能）", max: 2, minD: 300, w: 1.0 },
  /* 战士：让「撞击」留下东西 */

  let pool = SKILLS.concat(MUT_SKILLS).filter((s) => skLv(s.id) < s.max && G.depth >= s.minD && (!s.r || s.r === G.route || s.r === G.mutate));

     坑（2026-09-25 修）：保底原来只在 pool 里找，而 pool 已经按 minD 过滤过 ——
     Lv1(100m) 时火力要 170m 才解锁，池里一张战斗牌都没有，保底空转；
     Lv2(280m) 本该是保底首次生效，又被「选路线」那次三选一顶掉，
     结果实战第一次拿到战斗牌被推到 540m（保底写了等于没写）。

  if (!routeOnly && combatOwned() < 2) {

    if (ci < 0) {

const store = (() => {

  catch (e) { ok = false; }

    set(k, v) { mem[k] = v; if (ok) { try { localStorage.setItem(k, v); } catch (e) {} } }

function makeSnow() {

function updateSnow(dt) {
  const sp = G.speed * 0.28 * dt;
  for (const s of G.snow) {
    s.y -= sp * s.k;
    s.x += Math.sin((G.t + s.k * 9) * 0.7) * 4 * dt;
    if (s.y < -6) { s.y = H0 + 6; s.x = Math.random() * W0; }

function mkObstacle(x, y) {

  return { kind: "rock", x, y, r: rr(20, 34), hp: CFG.rockHP, maxHp: CFG.rockHP, seed: rnd() * 997, hit: false, near: false, flash: 0 };
}
function spawnRow(prog, dk) {
  const gapW = lerp(CFG.gapNear, CFG.gapFar, prog) * (1 - dk * CFG.gapGain);
  G.lastGapC = clamp(G.lastGapC + rr(-CFG.gapStep, CFG.gapStep), 150, W0 - 150);
  const gapC = G.lastGapC;
  const y = H0 + 60;

  for (let i = 0; i < n; i++) {
    let x = 0, ok = false;
    for (let k = 0; k < 24; k++) { x = rr(40, W0 - 40); if (Math.abs(x - gapC) > gapW / 2 + 26) { ok = true; break; } }
    if (ok) ents.push(mkObstacle(x, y + rr(-30, 30)));

}
function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const L = dx * dx + dy * dy;
  let t = L > 0 ? ((px - ax) * dx + (py - ay) * dy) / L : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
/* 点到「实体整条身子」的距离（再扣掉半径）。
   泥鳅（cable）身子是一条竖着的线，判定必须是整条线 —— 玩家口径：「改成一条全是」。
   坑（2026-09-25 玩家反馈）：原来石头/泥鳅之外的判定各写各的（光束只认身子顶端那个点、
   冲击波只认圆心到身子中点），结果同一条泥鳅「哪一段算数」全看不出来。 */
function entBodyDist(e, x, y) {
  if (e.kind === "cable") return distToSeg(x, y, e.x, e.y - e.len / 2, e.x, e.y + e.len / 2) - e.r;
  return Math.hypot(e.x - x, e.y - y) - e.r;
}
function obstacleDist(e) { return entBodyDist(e, p.x, p.y); }
/* 两条线段是否相交（真交点，不含平行重合） */
function segHit(ax, ay, bx, by, cx, cy, dx2, dy2) {
  const d = (bx - ax) * (dy2 - cy) - (by - ay) * (dx2 - cx);
  if (Math.abs(d) < 1e-9) return false;
  const t = ((cx - ax) * (dy2 - cy) - (cy - ay) * (dx2 - cx)) / d;
  const u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
/* 两条线段的最短距离：相交为 0，否则必在某个端点取到（四个「点到线段」取最小即可） */
function segSegDist(ax, ay, bx, by, cx, cy, dx2, dy2) {
  if (segHit(ax, ay, bx, by, cx, cy, dx2, dy2)) return 0;
  return Math.min(distToSeg(ax, ay, cx, cy, dx2, dy2), distToSeg(bx, by, cx, cy, dx2, dy2),
                  distToSeg(cx, cy, ax, ay, bx, by), distToSeg(dx2, dy2, ax, ay, bx, by));
}
/* 实体到「任意一条线段」的距离（普攻光束判定用）。
   坑（2026-09-25）：原来 cable 分支是 distToSeg(身子顶端那个点, 光束) —— 只认顶端，
   从侧面打身子中段/下段完全没伤害（探针实测 上=75 中=0 下=0）。现在按两条线段算。 */
function entSegDist(e, ax, ay, bx, by) {
  if (e.kind === "cable") return segSegDist(e.x, e.y - e.len / 2, e.x, e.y + e.len / 2, ax, ay, bx, by) - e.r;
  return distToSeg(e.x, e.y, ax, ay, bx, by) - e.r;
}

/* ============================ 6b. 战斗 =================================== */
/* 普攻：从玩家射向准星的一道光束（hitscan），沿途障碍物与怪物一起吃伤害。
   准星 = 鼠标位置（「打哪」由准星管）；鼠标停手 2.5s 或触屏/键盘玩家，交给自动瞄准兜底。 */
function aimPoint() {
  const A = G.aim;
  let tx = clamp(A.x, 14, W0 - 14), ty = clamp(A.y, 70, H0 - 12);
  const dx = tx - p.x, dy = ty - p.y, L = Math.hypot(dx, dy);
  if (L > CFG.atkReach) { tx = p.x + (dx / L) * CFG.atkReach; ty = p.y + (dy / L) * CFG.atkReach; }
  return [tx, ty];
}
/* ---------- 统一的「打一下」入口：扣血 → 飘字 → 死了发奖励并移除 ----------

function killReward(e) {
  G.bonus += CFG.killScore;
  G.kills += 1;
  /* --- 击杀钩子（新机制都挂这里）--- */
  stackGain(1);                        // 骨甲（鲸落骨甲）/ 血怒（血鲸之牙）
  if (G.m.voidCd > 0) G.act.q = Math.max(0, G.act.q - G.m.voidCd);          // 虚空回响：击杀减冲击波冷却
  if (G.m.voidCdAll > 0) for (const kk in G.act) G.act[kk] = Math.max(0, G.act[kk] - G.m.voidCdAll);
  if (G.m.voidO2 > 0) { const g = o2MaxNow() * G.m.voidO2; G.o2 = Math.min(o2MaxNow(), G.o2 + g); }
  if (G.m.fis && e.fisK) chainBoom(e, e.fisK, G.m.fis.r, G.m.fis.jump, e.fisDepth || 0);   // 熔核连锁
  /* 连杀递减：距上一只超过 killComboReset 秒就重新满额，否则按 killComboMul 逐只打折 */
  const streak = (G.t - G.comboT <= CFG.killComboReset) ? G.comboN : 0;
  const mul = Math.pow(CFG.killComboMul, streak);
  const gain = o2MaxNow() * G.m.killO2 * mul;    // 回的是「上限的 10%」× 连杀系数，深水压力再大也不缩水
  G.comboN = streak + 1; G.comboT = G.t;
  G.o2 = Math.min(o2MaxNow(), G.o2 + gain);
  G.o2Kill += gain;
  popup(e.x, e.y - e.r - 26, "击杀 +" + CFG.killScore + " · 氧 +" + gain.toFixed(1)
    + (streak > 0 ? " ×" + mul.toFixed(2) : ""), "255,215,150");
  burst(e.x, e.y, 22, e.kind === "hunter" ? "255,150,120" : "170,220,255");

/* 战士·噬血：突进撞碎 / 撞死 按氧气上限的百分比回氧 */
function healVamp(x, y) {
  if (G.m.vamp <= 0) return;
  const gain = o2MaxNow() * G.m.vamp;
  G.o2 = Math.min(o2MaxNow(), G.o2 + gain);

/* 熔核连锁（法师质变）：被冲击波打死的怪原地引爆，被炸死的继续引（跳数封顶，越跳越弱） */
function chainBoom(e, k, r, jump, depth) {
  const D = Math.round(G.m.shockD * k);
  burst(e.x, e.y, 22, "255,180,120");
  G.shakeT = Math.max(G.shakeT, 0.2); G.shakeMag = Math.max(G.shakeMag, 6);

function hurtEnt(i, e, dmg, tag, raw) {
  /* 统一增伤入口：奇点钉住 +30% / 白昼区 +35%（场自己的持续伤害走 raw=true，不叠自己） */
  if (!raw && (MOB_SET[e.kind] || e.kind === "rock" || e.kind === "cable")) dmg = Math.round(dmg * hitAmp(e));
  /* 圣盾使的盾：单次 ≥60 直接破盾；不然挡 75% 并削一层（3 层）。盾碎了 breakT 秒后重开。 */
  if (e.kind === "warden" && e.shield && e.breakT <= 0) {
    e.shieldHp -= 1;
    if (dmg >= 60 || e.shieldHp <= 0) { e.shield = false; e.breakT = CFG.wardenBreakT; popup(e.x, e.y - e.r - 20, "破盾!", "255,225,150"); burst(e.x, e.y, 12, "255,220,140"); }
    else { popup(e.x, e.y - e.r - 20, "盾 -" + Math.round(dmg * 0.25), "255,225,150"); burst(e.x, e.y, 4, "255,220,140"); return false; }
  }

  popup(e.x, e.y - e.r - 8, "-" + dmg, tag || "255,175,125");
  if (e.hp > 0) { burst(e.x, e.y, 4, "255,200,150"); return false; }
  const isMob = e.kind === "hunter" || e.kind === "spitter" || e.kind === "reaver" || e.kind === "warden";
  e.dead = true;      // 先立牌子再发奖：范围伤害 / 连锁爆炸 / 碎障溅骨片都靠它，怪和障碍一视同仁
  if (isMob) killReward(e); else breakReward(e);

     必须重找一次再删，不然删掉的是无辜的邻居。 */

function fireAttack() {

  const firstHit = [];
  const shootSeg = (ex, ey) => {
    for (let i = ents.length - 1; i >= 0; i--) {
      const e = ents[i];
      if (e.kind === "bubble" || e.kind === "jelly" || e.kind === "bolt") continue;
      if (entSegDist(e, p.x, p.y, ex, ey) > halfw) continue;
      const isObst = e.kind === "rock" || e.kind === "cable";
      const d2 = G.m.atkDmg + (isObst ? G.m.atkObst : 0);
      const before = e.hp;
      hurtEnt(i, e, d2);
      if (e.hp !== before) { hits++; totalDmg += d2; totalHits++; }
      if (isObst && e.dead) {                                   // 碎掉的障碍：鲸骨撞角（外职业档）溅骨片
        const ts = G.m.tusk || G.m.tuskOff;

  G.atkCount = (G.atkCount || 0) + 1;
  if (G.m.coreOff && G.atkCount % 4 === 0) {
    addZone({ type: "core", x: bx, y: by, r: G.m.coreOff.r, dmg: G.m.coreOff.d, life: G.m.coreOff.life, pull: 0, col: "185,160,255" });
  }
  /* 万花棱镜（照明专属神器，外职业弱化版）：光束打到怪之后在怪之间折射 2 跳 */

  /* 软边界：贴边 120px 内线性收力（硬钳到 0 会让船像撞墙一样急停） */
  if (want > 0) want *= clamp((CFG.xMax - p.x) / CFG.kbSoftEdge, 0, 1);
  else if (want < 0) want *= clamp((p.x - CFG.xMin) / CFG.kbSoftEdge, 0, 1);
  p.vx += (want - p.vx) * Math.min(1, dt * (kdir ? CFG.kbAccel : G.m.accel));
  p.x += p.vx * dt;
  /* 质变·怒涛冲锋：冲刺期间直接按方向向量位移（A/D 让位），冲完把深度缓回原位 */
  if (G.m.chg && fx.dash > 0 && G.dashVX !== null) {
    const V = G.m.chg.speed;
    p.x += G.dashVX * V * dt;
    p.y += G.dashVY * V * dt;
  } else if (G.m.chg && Math.abs(p.y - CFG.playerY) > 0.5) {
    const back = 300 * dt;
    p.y += clamp(CFG.playerY - p.y, -back, back);
  }
  if (p.y < CFG.playerY - 190) p.y = CFG.playerY - 190;
  if (p.y > CFG.playerY + 190) p.y = CFG.playerY + 190;
  if (p.x < CFG.xMin) { p.x = CFG.xMin; p.vx = 0; }
  if (p.x > CFG.xMax) { p.x = CFG.xMax; p.vx = 0; }
  if (p.invuln > 0) p.invuln = Math.max(0, p.invuln - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);

  /* --- 准星（鼠标准心管打哪）与普攻连发 --- */
  const A = G.aim;
  if (I.aimActive) { A.tx = I.ax; A.ty = I.ay; A.idle = 0; }
  else A.idle += dt;
  if (A.idle > CFG.aimIdle) {
    /* 自动瞄准兜底（触屏 / 键盘玩家）：只咬怪物，没怪物就回到正前方 */
    let best = null, bd = 1e9;
    for (const e of ents) {
      if (e.kind !== "hunter" && e.kind !== "spitter") continue;
      const dd = Math.hypot(e.x - p.x, e.y - p.y);
      if (dd < bd) { bd = dd; best = e; }
    }
    if (best && bd < CFG.aimAutoR) { A.tx = best.x; A.ty = best.y; }
    else { A.tx = clamp(p.x, 14, W0 - 14); A.ty = clamp(p.y + CFG.atkReach * 0.7, 70, H0 - 12); }
  }
  A.tx = clamp(A.tx, 14, W0 - 14); A.ty = clamp(A.ty, 70, H0 - 12);
  A.x += (A.tx - A.x) * Math.min(1, dt * CFG.aimLerp);
  A.y += (A.ty - A.y) * Math.min(1, dt * CFG.aimLerp);
  if (A.beam > 0) A.beam = Math.max(0, A.beam - dt);
  A.cd -= dt;
  if (A.cd <= 0) { A.cd = G.m.atkEvery; fireAttack(); }

  /* --- 生成 --- */
  const prog = clamp(G.depth / CFG.rowSpan, 0, 1);
  G.rowT -= dt;
  if (G.rowT <= 0) {
    G.rowT = lerp(CFG.rowNear, CFG.rowFar, prog) * (0.85 + 0.3 * rnd()) * Math.max(0.76, 1 - dk * CFG.rowGain);
    spawnRow(prog, dk);
  }
  G.bubbleT -= dt;
  if (G.bubbleT <= 0) {
    G.bubbleT = rr(CFG.bubbleEvery[0], CFG.bubbleEvery[1]) * (1 + 0.9 * clamp(G.depth / CFG.bubbleThin, 0, 1));
    ents.push({ kind: "bubble", x: rr(64, W0 - 64), y: H0 + 34, r: rr(9, 14), seed: rnd() * 997 });
  }
  G.jellyT -= dt;
  if (G.jellyT <= 0) {
    G.jellyT = rr(CFG.jellyEvery[0], CFG.jellyEvery[1]) * G.m.jellyFreq;
    ents.push({ kind: "jelly", x: rr(70, W0 - 70), y: H0 + 40, r: rr(14, 19), seed: rnd() * 997 });
  }
  /* --- 深海猎食者：1000m 以下才出现；刚过线有适应期，越深才越凶 ---
     2026-09-25：2000m 起加入剃刀鲸（近身冲撞）与圣盾使（三连电球 + 护盾）。 */
  if (G.depth >= CFG.mobFrom) {
    const intro = clamp((G.depth - CFG.mobFrom) / CFG.mobRamp, 0, 1);
    const rate = (CFG.mobIntro + (1 - CFG.mobIntro) * intro) * (CFG.mobDeepen[0] + CFG.mobDeepen[1] * dk);
    const cap = CFG.mobCapBase + Math.round(CFG.mobCapGain * dk) + (G.depth >= 2000 ? 1 : 0);
    let live = 0;
    for (const e of ents) if (e.kind !== "bubble" && e.kind !== "jelly" && e.kind !== "bolt" && e.kind !== "rock" && e.kind !== "cable") live++;
    G.huntT -= dt * rate;
    if (G.huntT <= 0) { G.huntT = rr(CFG.hunterEvery[0], CFG.hunterEvery[1]); if (live < cap) spawnHunter(); }
    G.spitT -= dt * rate;
    if (G.spitT <= 0) { G.spitT = rr(CFG.spitterEvery[0], CFG.spitterEvery[1]); if (live < cap) spawnSpitter(); }
    if (G.depth >= 2000) {
      G.reavT = (G.reavT === undefined ? rr(3, 6) : G.reavT) - dt * rate;
      if (G.reavT <= 0) { G.reavT = rr(CFG.reaverEvery[0], CFG.reaverEvery[1]); if (live < cap) spawnReaver(); }
      G.wardT = (G.wardT === undefined ? rr(6, 10) : G.wardT) - dt * rate;
      if (G.wardT <= 0) { G.wardT = rr(CFG.wardenEvery[0], CFG.wardenEvery[1]); if (live < cap) spawnWarden(); }
    }
  }

  /* --- 实体推进 + 碰撞 --- */
  const dy = G.speed * dt;
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    if (!e) continue;                 // 连锁爆炸可能已经删过前面的实体，倒序索引会踩空
    if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
    /* 电球：自带速度，不跟世界一起滚（它是「扑」过来的，不是「沉」上来的） */
    if (e.kind === "bolt") {
      e.x += e.vx * dt; e.y += e.vy * dt; e.life -= dt;
      if (e.life <= 0 || e.x < -60 || e.x > W0 + 60 || e.y < -60 || e.y > H0 + 60) { ents.splice(i, 1); continue; }
      if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + CFG.playerR) {
        hurtPlayer(Math.round(CFG.boltDmg * (1 + dk * CFG.hitGain) * G.m.dmg), "190,220,255");
        burst(e.x, e.y, 8, "170,215,255");
        ents.splice(i, 1);
      }
      continue;
    }
    /* 电袭者是「悬停射手」：不跟着水流一起滚，靠自己慢慢游上来 ——
       否则世界滚动 + 自己的漂移会让它 3 秒穿过整屏，一枪都来不及放 */
    if (e.kind !== "spitter" && e.kind !== "warden") e.y -= dy;
    /* 怪物自己的动作：猎手加速上冲咬人，喷吐者保持距离放冷枪，
       剃刀鲸横冲直撞（撞完不消失），圣盾使悬停 + 三连电球 */
    if (e.kind === "hunter") {
      e.y -= CFG.hunterRush * dt;
      e.x += clamp(p.x - e.x, -CFG.hunterVX * dt, CFG.hunterVX * dt);
    } else if (e.kind === "spitter") {
      e.y -= CFG.spitterRush * dt;
      e.x += clamp(p.x - e.x, -CFG.spitterVX * dt, CFG.spitterVX * dt);
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > p.y + 70 && e.y < H0 + 30) {
        e.fireT = rr(CFG.boltEvery[0], CFG.boltEvery[1]);
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        ents.push({ kind: "bolt", x: e.x, y: e.y, r: CFG.boltR, vx: Math.cos(a) * CFG.boltSpeed, vy: Math.sin(a) * CFG.boltSpeed, life: 4.5, seed: rnd() * 997 });
        SFX.zap();
      }
    } else if (e.kind === "reaver") {
      /* 剃刀鲸：横着冲过屏幕 + 缓慢上移，撞到人也不消失（冷却 1.2s 后再撞） */
      e.x += e.vx * dt;
      e.y -= 42 * dt;
      if (e.x < -90 || e.x > W0 + 90) { ents.splice(i, 1); continue; }
    } else if (e.kind === "warden") {
      /* 圣盾使：悬停射手，慢慢飘上来；三连电球一轮，轮间隔 wardenFan */
      e.y -= CFG.spitterRush * 0.5 * dt;
      e.x += Math.sin(G.t * 1.4 + e.seed) * 24 * dt;
      e.fireT -= dt;
      if (e.breakT > 0) e.breakT = Math.max(0, e.breakT - dt); else if (e.shieldHp <= 0) { e.shield = true; e.shieldHp = 3; }
      if (e.fireT <= 0 && e.fanN <= 0 && e.y > p.y + 90 && e.y < H0 + 10) { e.fanN = 3; e.fanT = 0; e.fireT = rr(CFG.wardenFan[0], CFG.wardenFan[1]); }
      if (e.fanN > 0) {
        e.fanT -= dt;
        if (e.fanT <= 0) {
          e.fanT = 0.22; e.fanN -= 1;
          const a = Math.atan2(p.y - e.y, p.x - e.x) + rr(-0.16, 0.16);
          ents.push({ kind: "bolt", x: e.x, y: e.y, r: CFG.boltR, vx: Math.cos(a) * CFG.boltSpeed, vy: Math.sin(a) * CFG.boltSpeed, life: 4.5, seed: rnd() * 997 });
          SFX.zap();
        }
      }
    }
    if (e.y < -140) { ents.splice(i, 1); continue; }
    /* 磁力：圈内的收集物朝玩家本体整体收拢（x、y 一起动）。
       旧写法只拽 x —— 上方的东西被拉到同一条竖线上、却照样留在上方飞走，永远吃不到
       （实测：正上方 90px 的气泡最近只到 96px 就出屏了）。收拢量按剩余距离比例
       （每秒 6 倍），越近拽得越紧，也不会过冲。 */
    if (G.m.magnet > 0 && (e.kind === "bubble" || e.kind === "jelly")) {
      const mdx = p.x - e.x, mdy = p.y - e.y;
      if (Math.hypot(mdx, mdy) < G.m.magnet) {
        const mk = Math.min(1, dt * 6);
        e.x += mdx * mk; e.y += mdy * mk;
      }
    }
    const d = obstacleDist(e);
    const rr2 = CFG.playerR;
    if (e.kind === "bubble" || e.kind === "jelly") {
      if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + rr2 + 2) {
        if (e.kind === "bubble") {
          const gain = G.m.bubble * Math.max(0.58, 1 - dk * CFG.bubbleLoss);
          G.o2 = Math.min(o2MaxNow(), G.o2 + gain);
          popup(e.x, e.y, "+" + Math.round(gain) + " 氧", "150,255,210"); SFX.bubble();
        }
        else { G.lightBonus = Math.min(CFG.jellyCap, G.lightBonus + G.m.jellyLight); popup(e.x, e.y, "视野 +" + Math.round(G.m.jellyLight), "190,230,255"); SFX.jelly(); }
        burst(e.x, e.y, 10, e.kind === "bubble" ? "150,255,210" : "190,230,255");
        ents.splice(i, 1);
      }
    } else if (fx.dash > 0 && (e.kind === "rock" || e.kind === "cable") && d < rr2 + 10 && e.dashS !== G.dashStamp) {
      /* 突进撞上去不算撞车，是撞碎：无敌期间给挡路的开个洞。
         dashS 是「哪一次突进已经打过它」的戳记 —— 不加就会每帧（120/s）扣一次 80 血。 */
      e.dashS = G.dashStamp;
      /* 战士·猛撞：撞击伤害加成 */
      const diedO = hurtEnt(i, e, CFG.dashDmg + G.m.ramDmg + stackRamBonus(), "150,255,220");
      if (diedO && G.m.vamp > 0) healVamp(e.x, e.y);
      ramOnHit(e, diedO);
      continue;
    } else if (fx.dash > 0 && (G.m.ramDmg > 0 || G.m.chg) && (e.kind === "hunter" || e.kind === "spitter" || e.kind === "reaver" || e.kind === "warden")
               && Math.hypot(e.x - p.x, e.y - p.y) < rr2 + e.r + 6 && e.dashS !== G.dashStamp) {
      /* 基础突进只撞碎障碍物，点了猛撞才能把怪一起撞了 —— 怒涛冲锋自带「撞怪」这一档 */
      e.dashS = G.dashStamp;
      const diedM = hurtEnt(i, e, G.m.chg ? G.m.chg.dmg + stackRamBonus() : G.m.ramDmg + stackRamBonus(), "150,255,220");
      if (diedM && G.m.vamp > 0) healVamp(e.x, e.y);
      ramOnHit(e, diedM);
      continue;
    } else if (d < rr2 && p.invuln <= 0 && !e.hit && !(e.pullImm > 0)) {
      /* pullImm：正被虚空奇点拽着的怪不撞人（玩家口径「拉过来把自己撞死」）；
         只有「真被拽过来」的才算 —— 血量不够、被奇点直接打死的那些不吃这个豁免 */
      e.hit = true;
      const isMob2 = e.kind === "hunter" || e.kind === "spitter" || e.kind === "reaver" || e.kind === "warden";
      if (isMob2) {
        /* 咬人结算：猎手/电袭者同归于尽；剃刀鲸/圣盾使活着走开（e.cd 冷却后再咬） */
        const dmg = Math.round((e.kind === "reaver" ? CFG.reaverDmg : e.kind === "warden" ? CFG.huntDamage : CFG.huntDamage) * (1 + dk * CFG.hitGain) * G.m.dmg);
        hurtPlayer(dmg, e.kind === "reaver" ? "255,190,120" : "255,150,120");
        if (e.kind === "hunter" || e.kind === "spitter") { burst(e.x, e.y, 20, "255,140,110"); ents.splice(i, 1); }
        else e.cd = 1.2;
      } else {
        hurtPlayer(Math.round(CFG.hitDamage * (1 + dk * CFG.hitGain) * G.m.dmg));
      }
    } else if (e.cd > 0 && e.hit && (e.kind === "reaver" || e.kind === "warden")) {
      e.cd = Math.max(0, e.cd - dt);
      if (e.cd <= 0) e.hit = false;       // 大家伙咬完一口会绕回来再咬：冷却好了才能咬下一口
    } else if (!e.near && (e.kind === "rock" || e.kind === "cable") && d < rr2 + G.m.nearPad) {
      e.near = true;
      G.bonus += G.m.nearBonus;
      popup(p.x + (e.x > p.x ? 30 : -30), p.y - 20, "擦身 +" + G.m.nearBonus, "255,225,150");
      SFX.nomiss();
    }
  }

  if (G.o2 <= 0) { G.o2 = 0; gameOver(); }
}

function update(dt) {
  G.t += dt;
  if (G.shakeT > 0) G.shakeT = Math.max(0, G.shakeT - dt);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3.2);
  if (G.redFlash > 0) G.redFlash = Math.max(0, G.redFlash - dt * 2.2);
  updateSnow(dt);
  updateParticles(dt);
  updatePopups(dt);
  if (G.state === "play") stepPlay(dt);
  else if (G.state === "over") stepTrail(dt);      // 结算画面：尾流慢慢散干净
  if (G.state === "title" || G.state === "over") { G.speed += (CFG.baseSpeed - G.speed) * Math.min(1, dt * 2); }
  /* 行灯环：位置放在本体挪完之后再算（早一步算就会慢一帧 —— 探针量出 28~214px 的乱值）。
     这里在 update() 里，标题页 G.m 还是 null，必须先挡一道。 */
  if (G.state === "play" && G.m && G.m.lant) {
    const lamps = [];
    for (const z of G.zones) if (z.type === "lamp") lamps.push(z);
    G.lampA = (G.lampA || 0) + G.m.lant.spin * dt;         // 整圈慢慢转
    for (let k = 0; k < lamps.length; k++) {
      const a = G.lampA + k * Math.PI * 2 / Math.max(1, lamps.length);
      const z = lamps[k];
      z.px = z.x; z.py = z.y;                              // 火线要连「上一帧的那一盏」
      z.x = p.x + Math.cos(a) * G.m.lant.orbit;
      z.y = p.y + Math.sin(a) * G.m.lant.orbit * 0.62;      // 压扁成椭圆，像真的绕着船转
    }
  }
  SFX.droneUpdate(clamp((G.speed - CFG.baseSpeed) / (CFG.boostSpeed - CFG.baseSpeed), 0, 1));
}

/* ============================ 7. Render ================================== */
function rrRect(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function text(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 600) + " " + size + 'px "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
/* 卡面描述换行（2026-09-25 玩家截图：护心符那条描述 336px，卡面只有 252px，直接冲出卡边）。
   贪心断行：中文按字断，连续英文/数字/符号（35 10s 之类）当一个整块，不拆开。
   maxW 是「每一行都不许超过的宽度」，字体必须和真正画的时候一致，量了才算数。 */
function wrapText(str, maxW, size, weight) {
  ctx.font = (weight || 600) + " " + size + 'px "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif';
  const toks = String(str).match(/[A-Za-z0-9+×.\-%/]+|\s+|[\s\S]/g) || [];
  const lines = [];
  let line = "";
  for (const tk of toks) {
    if (tk === "\n") { lines.push(line); line = ""; continue; }
    if (line && ctx.measureText(line + tk).width > maxW) { lines.push(line); line = tk.replace(/^\s+/, ""); }
    else line += tk;
  }
  lines.push(line);
  return lines;
}
function panel(x, y, w, h) {
  rrRect(x, y, w, h, 18);
  ctx.fillStyle = "rgba(4,14,26,0.84)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,190,230,0.26)"; ctx.lineWidth = 1.5; ctx.stroke();
}

/* ---------- 主角皮肤：里面那条鱼，换几条活法 ---------- */
/* 画笔约定：坐标系已经 translate 到鱼心、rotate 过俯仰，鼻尖朝 +x；
   s = 缩放（卡面小样用 0.6），t = 全局时间，wig = 摆尾相位（由速度驱动）。 */
/* 蓝色大肥鱼皮肤的美术：玩家给的那张 chibi 立绘，原图照抄（别搞对称 —— 玩家口径），
   只把右边缺的一小条补上：抠背景 → 找到头发顶到裁切边的行 → 右侧按圆弧收口续 30px（平涂头发色 + 描边），

    ctx.strokeStyle = "rgba(195,165,255,0.85)"; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.strokeStyle = "rgba(180,150,255,0.7)"; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * e.r * 0.36, y + e.r * 0.1);
      ctx.quadraticCurveTo(x + i * e.r * 0.36 + Math.sin(G.t * 6 + i + e.seed) * 5, y + e.r * 0.85, x + i * e.r * 0.36, y + e.r * 1.5);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y + e.r * 0.3, 3 + ch * 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255," + Math.round(205 - ch * 130) + ",125," + (0.45 + ch * 0.55).toFixed(2) + ")";
    ctx.fill();
  } else if (e.kind === "bolt") {
    /* 电球 */
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(x, y, 1, x, y, e.r * 3.2);
    g.addColorStop(0, "rgba(205,240,255,0.9)");
    g.addColorStop(1, "rgba(120,180,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, e.r * 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = "#eaf6ff"; ctx.fill();
  }
  /* 血条不画在这里：它会被黑暗层吞掉，统一挪到黑暗之上重画（drawHpBar） */
}

function drawHUD() {
  const depth = Math.floor(G.depth);
  const d = clamp(depth / 1200, 0, 1);
  /* 深度 */
  ctx.save();
  ctx.shadowColor = "rgba(120,220,255,0.55)"; ctx.shadowBlur = 16;
  text(String(depth), W0 / 2, 74, 54, "#e8f8ff", "center", 700);
  ctx.restore();
  text("米", W0 / 2 + String(depth).length * 17 + 16, 74, 20, "rgba(160,215,245,0.75)", "left", 600);
  text("深度", W0 / 2, 96, 12, "rgba(130,185,215,0.65)", "center", 600);
  if (G.bonus >= 1) text("加成 +" + Math.round(G.bonus), W0 / 2, 118, 14, "rgba(255,225,150,0.85)", "center", 600);
  /* 最佳 */
  text("最佳 " + Math.max(G.best, depth) + " m", W0 - 24, 38, 15, "rgba(140,190,220,0.7)", "right", 600);
  /* 深渊压力：越深越高，耗氧/障碍/伤害一起跟着涨 */
  const press = Math.round(diffK(depth) * 100);
  text("压力 " + press + "%", W0 - 24, 60, 12, press >= 45 ? "rgba(255,175,150,0.9)" : press >= 25 ? "rgba(255,225,150,0.75)" : "rgba(140,190,220,0.6)", "right", 600);
  drawSkillChips(W0 - 24, 84);
  /* 氧气条 */
  const bw = 300, bh = 13, bx = 24, by = H0 - 42;
  const ratio = clamp(G.o2 / o2MaxNow(), 0, 1);
  const low = ratio < 0.25;
  const pulse = low ? 0.55 + 0.45 * Math.abs(Math.sin(G.t * 6)) : 1;
  rrRect(bx, by, bw, bh, 6.5);
  ctx.fillStyle = "rgba(8,22,36,0.85)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,190,230,0.28)"; ctx.lineWidth = 1; ctx.stroke();
  const col = ratio > 0.5 ? [110, 230, 190] : ratio > 0.25 ? [255, 210, 120] : [255, 120, 120];
  ctx.save();
  rrRect(bx, by, bw, bh, 6.5); ctx.clip();
  ctx.globalAlpha = pulse;
  const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  gg.addColorStop(0, mixRgb([col[0] * 0.7, col[1] * 0.7, col[2] * 0.7], col, 0.4));
  gg.addColorStop(1, mixRgb(col, [255, 255, 255], 0.35));
  ctx.fillStyle = gg;
  ctx.fillRect(bx, by, bw * ratio, bh);
  ctx.restore();
  text("氧气", bx, by - 8, 12, low ? "rgba(255,150,150,0.95)" : "rgba(140,190,220,0.7)", "left", 600);
  text(Math.ceil(G.o2) + "%", bx + bw + 12, by + 12, 15, low ? "rgba(255,150,150,0.95)" : "rgba(190,230,250,0.85)", "left", 600);
  /* 加速提示 */
  if (G.boosting) text("加速 ×" + boostMulNow().toFixed(2).replace(/0$/, ""), bx + bw + 12, by - 8, 12, "rgba(255,225,150,0.9)", "left", 600);
  /* 深渊馈赠：等级 + 距下次强化的距离 */
  const lvSpan = lvNeed(G.level + 1);
  const lvP = clamp((G.depth - (G.nextLv - lvSpan)) / lvSpan, 0, 1);
  const lby = by - 30;
  rrRect(bx, lby, bw, 5, 2.5); ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
  rrRect(bx, lby, lvP * bw, 5, 2.5); ctx.fillStyle = "rgba(255,215,150,0.85)"; ctx.fill();
  text("强化 Lv " + G.level + "　·　距下次 " + Math.max(0, Math.ceil(G.nextLv - G.depth)) + " m" + (routeNow() ? "　·　" + routeNow().n : ""), bx, lby - 7, 12, "rgba(255,225,170,0.78)", "left", 600);
  /* 深度进度条（右侧，暗示 1000m 是传奇线） */
  const pbx = W0 - 26, pby = 120, pbh = 300;
  rrRect(pbx, pby, 4, pbh, 2); ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
  rrRect(pbx, pby + pbh * (1 - d), 4, pbh * d, 2);
  ctx.fillStyle = "rgba(140,225,255,0.75)"; ctx.fill();
  text("1000m", pbx - 6, pby - 6, 11, "rgba(140,200,230,0.55)", "right", 600);
  if (TOUCH && G.input.touches > 0) text("双指 = 加速（也可以按住左下「加速」）", W0 / 2, BOOST_BTN.y - BOOST_BTN.r - 12, 12, "rgba(140,200,230,0.6)", "center", 600);
  drawActives();
  drawTouchCtl();
}

/* 主动技能的 HUD：右下角三个圆形按钮（键位 + 名字 + 冷却扇形）。
   做成可点的圆形是为了触屏 —— 手机上只有键盘就废了。 */
function drawActives() {
  const rt = routeNow();
  for (const b of ACT_BTN) {
    /* 没选的技能画虚线：路线没定是「锁」，选了别的路线是「封」（永久关闭） */
    const owned = !!rt && rt.k === b.k;
    if (!owned) {
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x, b.y, ACT_R, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(8,18,26,0.62)"; ctx.fill();
      ctx.strokeStyle = "rgba(96,126,146,0.30)"; ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]); ctx.stroke();
      ctx.restore();
      text(b.key, b.x, b.y - 1, 15, "rgba(130,160,180,0.38)", "center", 700);
      text(rt ? "封" : "锁", b.x, b.y + 16, 10.5, "rgba(130,160,180,0.5)", "center", 600);
      continue;
    }
    const cd = G.act[b.k], total = Math.max(0.001, b.cd()), rdy = cd <= 0;
    ctx.save();
    ctx.beginPath(); ctx.arc(b.x, b.y, ACT_R, 0, Math.PI * 2);
    ctx.fillStyle = rdy ? "rgba(20,58,84,0.70)" : "rgba(10,24,36,0.70)"; ctx.fill();
    ctx.strokeStyle = rdy ? "rgba(150,235,255,0.75)" : "rgba(110,150,175,0.38)";
    ctx.lineWidth = 2; ctx.stroke();
    if (!rdy) {
      ctx.beginPath(); ctx.moveTo(b.x, b.y);
      ctx.arc(b.x, b.y, ACT_R - 1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (cd / total));
      ctx.closePath(); ctx.fillStyle = "rgba(3,10,18,0.66)"; ctx.fill();
    }
    ctx.restore();
    text(b.key, b.x, b.y - 1, 17, rdy ? "#dff6ff" : "rgba(150,180,200,0.5)", "center", 700);
    text(rdy ? b.n : cd.toFixed(1), b.x, b.y + 16, 10.5, rdy ? "rgba(185,232,252,0.88)" : "rgba(150,180,200,0.6)", "center", 600);
  }
  if (G.hint && G.t < G.hintT) text(G.hint, ACT_BTN[0].x + ACT_R, ACT_BTN[0].y - ACT_R - 14, 12.5, "rgba(255,214,150,0.92)", "right", 600);
}

/* 触屏专用控件：左下「加速」（按住不放）+ 左上「暂停」。桌面鼠标环境不画。 */
function drawTouchCtl() {
  if (!TOUCH || G.state !== "play") return;
  const b = BOOST_BTN, on = G.input.boost;
  ctx.save();
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fillStyle = on ? "rgba(255,205,130,0.30)" : "rgba(20,58,84,0.62)"; ctx.fill();
  ctx.strokeStyle = on ? "rgba(255,230,180,0.95)" : "rgba(150,235,255,0.62)"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
  text("加速", b.x, b.y + 2, 20, on ? "#fff2d6" : "#dff6ff", "center", 700);
  text("按住", b.x, b.y + 24, 11, "rgba(185,232,252,0.72)", "center", 600);
  const pb = PAUSE_BTN;
  ctx.save();
  ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(12,30,46,0.62)"; ctx.fill();
  ctx.strokeStyle = "rgba(150,235,255,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  const pw = Math.max(2.5, pb.r * 0.17), ph = pb.r * 0.86;      // 两条竖杠 = 暂停
  ctx.fillStyle = "#dff6ff";
  ctx.fillRect(pb.x - pw * 2, pb.y - ph / 2, pw, ph);
  ctx.fillRect(pb.x + pw, pb.y - ph / 2, pw, ph);
}

function drawWorld() {
  const d = clamp(G.depth / 1200, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H0);
  g.addColorStop(0, mixRgb([10, 38, 66], [1, 4, 12], d));
  g.addColorStop(1, mixRgb([22, 70, 108], [3, 10, 22], d));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W0, H0);
  /* 光柱 */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 4; i++) {
    const bx = 60 + i * 250 + Math.sin(G.t * 0.25 + i) * 26;
    const lg = ctx.createLinearGradient(bx, 0, bx + 90, H0 * 0.9);
    lg.addColorStop(0, "rgba(130,205,255," + (0.085 * (1 - d)).toFixed(3) + ")");
    lg.addColorStop(1, "rgba(130,205,255,0)");
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(bx - 34, 0); ctx.lineTo(bx + 34, 0);
    ctx.lineTo(bx + 150, H0 * 0.9); ctx.lineTo(bx - 110, H0 * 0.9);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  /* 浮游雪 */
  for (const s of G.snow) {
    ctx.globalAlpha = s.a * (0.35 + 0.65 * (1 - d));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = "#bfe6ff"; ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const e of ents) drawEntity(e);
  for (const q of G.particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a * 0.9;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgb(" + q.col + ")"; ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (G.state === "play" || G.state === "pause" || G.state === "over") { drawTrail(); drawPlayer(); }
  else { const bx = p.x, by = p.y; p.x = W0 / 2; p.y = 78 + Math.sin(G.t * 1.4) * 7; drawPlayer(); p.x = bx; p.y = by; }
  /* 拾取飘字 */
  for (const q of G.popups) {
    ctx.globalAlpha = clamp(q.life / 0.9, 0, 1);
    text(q.text, q.x, q.y, 14, "rgba(" + q.col + ",1)", "center", 700);
  }
  ctx.globalAlpha = 1;
  /* 黑暗 / 视野：光照半径之外 alpha=1（纯黑）—— 轮廓、气泡一律看不见。
     早先是「全屏压暗 + 一圈渐变」，半径外还剩 55~65% 亮度，等于自带夜视仪。 */
  const px = p.x, py = p.y + (G.state === "play" ? Math.sin(G.t * 2.2) * 3 : 0);
  const lr = Math.max(90, G.lightR);
  const dg = ctx.createRadialGradient(px, py, lr * 0.20, px, py, lr);
  dg.addColorStop(0, "rgba(2,8,18,0)");
  dg.addColorStop(0.52, "rgba(2,8,18," + (0.30 + 0.34 * d).toFixed(3) + ")");
  dg.addColorStop(0.80, "rgba(2,8,18," + (0.80 + 0.20 * d).toFixed(3) + ")");
  dg.addColorStop(1, "rgba(2,8,18,1)");
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W0, H0);
  /* 水母例外：它是光源，得在黑暗层之上重绘一遍，否则一样被吞进纯黑 */
  for (const e of ents) if (e.kind === "jelly") drawJellyGlow(e);
  /* 猎食者/电球也是生物光：不在光照半径内照样看得见它们扑过来（否则 1000m 以下纯挨打）；
     但障碍物不是光源 —— 光照半径外它就该是黑的（玩家口径：半径外啥也看不见） */
  for (const e of ents) if (MOB_SET[e.kind]) drawCombatGlow(e);
  for (const e of ents) drawHpBar(e);
  for (const e of ents) if (e.seal > 0) drawSeal(e);
  drawZones();
  drawStacks();
  drawActiveFx();
  drawAim();
  /* 受伤红闪 */
  if (G.redFlash > 0) {
    ctx.fillStyle = "rgba(255,60,60," + (G.redFlash * 0.22).toFixed(3) + ")";
    ctx.fillRect(0, 0, W0, H0);
  }
}

/* ---------- 场 / 骨片 / 折射光线 / 层数的绘制 ----------
   全部画在黑暗层之上：它们都是「技能留下的光」，深水里被黑暗吞掉就等于没有
   （和水母 / 怪同一条规矩 —— 玩家定的：光照半径之外啥也看不见，但光源自己看得见）。 */
function drawZones() {
  for (const z of G.zones) {
    const a = 0.25 + 0.55 * clamp(1 - z.t / z.life, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    if (z.type === "sing" || z.type === "core") {
      const c0 = z.type === "sing" ? "190,170,255" : "185,160,255";
      const rg = ctx.createRadialGradient(z.x, z.y, z.r * 0.1, z.x, z.y, z.r);
      rg.addColorStop(0, "rgba(" + c0 + "," + (0.34 * a).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(" + c0 + ",0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
      const spin = G.t * (z.type === "sing" ? 3.4 : 1.8);
      ctx.strokeStyle = "rgba(" + c0 + "," + (0.75 * a).toFixed(3) + ")";
      ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {                    // 三圈往里收的螺旋 = 「它在吸」
        const rr2 = z.r * (0.95 - k * 0.24);
        ctx.beginPath(); ctx.arc(z.x, z.y, rr2, spin + k * 2.1, spin + k * 2.1 + 2.2); ctx.stroke();
      }
    } else if (z.type === "lamp") {
      /* 环绕成环之后十盏灯的光斑会叠成一张白饼（截图复核抓到的）—— 单盏柔光压薄，
         把「火线」那条多边形的边提亮：玩家看到的是一圈转着的火，不是一坨白光。 */
      const rg = ctx.createRadialGradient(z.x, z.y, 4, z.x, z.y, z.r * 0.8);
      rg.addColorStop(0, "rgba(255,235,180," + (0.17 * a).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(255,225,170,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.8, 0, Math.PI * 2); ctx.fill();
      if (z.px !== undefined) {                        // 火线：和上一盏灯连起来
        ctx.strokeStyle = "rgba(255,175,95," + (0.55 * a).toFixed(3) + ")";
        ctx.lineWidth = z.lineR * 0.5;
        ctx.beginPath(); ctx.moveTo(z.px, z.py); ctx.lineTo(z.x, z.y); ctx.stroke();
        ctx.strokeStyle = "rgba(255,245,205," + (0.75 * a).toFixed(3) + ")";
        ctx.lineWidth = z.lineR * 0.16;
        ctx.beginPath(); ctx.moveTo(z.px, z.py); ctx.lineTo(z.x, z.y); ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,245,205," + (0.85 * a).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(z.x, z.y, 5 + Math.sin(G.t * 4) * 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  if (G.shards.length) {                               // 骨片（鲸骨撞角）
    ctx.strokeStyle = "rgba(235,245,255,0.9)"; ctx.lineWidth = 2.4;
    for (const s of G.shards) {
      const d = Math.max(1, Math.hypot(s.vx, s.vy)), L = 9;
      ctx.beginPath();
      ctx.moveTo(s.x - s.vx / d * L, s.y - s.vy / d * L);
      ctx.lineTo(s.x + s.vx / d * L, s.y + s.vy / d * L);
      ctx.stroke();
    }
  }
  if (G.beams.length) for (const b of G.beams) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const ba = clamp(b.t / (b.lance ? 0.34 : 0.22), 0, 1);
    if (b.lance) {                                     // 质变·光矛：粗光带 + 一根白芯 + 矛尖的爆闪
      const w = b.w || 26, L = Math.hypot(b.x2 - b.x1, b.y2 - b.y1);
      ctx.translate(b.x1, b.y1); ctx.rotate(Math.atan2(b.y2 - b.y1, b.x2 - b.x1));
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, -w * 0.42); ctx.lineTo(L * 1.03, 0); ctx.lineTo(L, w * 0.42); ctx.closePath();
      ctx.fillStyle = "rgba(255,240,190," + (0.34 * ba).toFixed(3) + ")"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -w * 0.5); ctx.lineTo(L, -w * 0.13); ctx.lineTo(L * 1.01, 0); ctx.lineTo(L, w * 0.13); ctx.lineTo(0, w * 0.5); ctx.closePath();
      ctx.fillStyle = "rgba(255,253,235," + (0.80 * ba).toFixed(3) + ")"; ctx.fill();
      const rg = ctx.createRadialGradient(L, 0, 2, L, 0, w * 5);
      rg.addColorStop(0, "rgba(255,255,240," + (0.85 * ba).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(255,245,200,0)");
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(L, 0, w * 5, 0, Math.PI * 2); ctx.fill();
      const rg2 = ctx.createRadialGradient(0, 0, 2, 0, 0, w * 2.4);
      rg2.addColorStop(0, "rgba(255,255,245," + (0.8 * ba).toFixed(3) + ")");
      rg2.addColorStop(1, "rgba(255,245,200,0)");
      ctx.fillStyle = rg2; ctx.beginPath(); ctx.arc(0, 0, w * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore(); continue;
    }
    ctx.strokeStyle = "rgba(" + (b.col || "180,240,255") + "," + ba.toFixed(2) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.restore();
  }
}
/* 审判之光的「光印」：怪头顶一排点，满层就处决（玩家看得见进度） */
function drawSeal(e) {
  if (!G.m || !G.m.judge || !e.seal) return;
  const need = G.m.judge.need, n = Math.min(need, e.seal);
  for (let k = 0; k < need; k++) {
    const x = e.x + (k - (need - 1) / 2) * 9, y = e.y - e.r - 17;
    ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2);
    if (k < n) { ctx.fillStyle = "rgba(255,255,215,0.95)"; ctx.fill(); }
    else { ctx.strokeStyle = "rgba(255,255,215,0.42)"; ctx.lineWidth = 1.2; ctx.stroke(); }
  }
}
/* 层数（骨甲 / 血怒）：绕着自己一圈点 + 一个数字，攒了多少一眼看得见 */
function drawStacks() {
  const list = [];
  if (G.m && G.mutate === "bone" && G.m.bone && G.bone > 0) list.push({ n: G.bone, col: "225,240,255", tag: "骨甲" });
  if (G.m && G.m.frenzy && G.frenzy > 0) list.push({ n: G.frenzy, col: "255,150,150", tag: "血怒" });
  if (G.m && G.m.judge && G.holy > 0) list.push({ n: G.holy, col: "195,255,235", tag: "圣光" });      // 审判之光：减伤层

/* 准星（AD 操控）+ 普攻光束：都画在黑暗层之上 —— 光是打出去的，不该被黑暗吃掉 */
function drawAim() {

  ctx.setLineDash([]);
  if (A.beam > 0) {

    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    for (let k = 0; k < beams.length; k++) {
      const [tx, ty] = beams[k];
      ctx.strokeStyle = "rgba(255,190,120," + (0.50 * a).toFixed(3) + ")";
      ctx.lineWidth = 12 * a + 3;
      ctx.beginPath(); ctx.moveTo(A.sx, A.sy); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.strokeStyle = k === 0 ? "rgba(255,246,228," + (0.92 * a).toFixed(3) + ")" : "rgba(210,235,255," + (0.85 * a).toFixed(3) + ")";
      ctx.lineWidth = 3.5 * a + 1;
      ctx.beginPath(); ctx.moveTo(A.sx, A.sy); ctx.lineTo(tx, ty); ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  const r = 14 + (A.beam > 0 ? (A.beam / CFG.beamT) * 5 : 0);

  ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.stroke();

  ctx.moveTo(ex, ey - r - 7); ctx.lineTo(ex, ey - r + 3);
  ctx.moveTo(ex, ey + r - 3); ctx.lineTo(ex, ey + r + 7);
  ctx.stroke();
  ctx.restore();
}

/* ---------- 深渊馈赠：三选一（割草式升级卡） ---------- */
const CARD_W = 252, CARD_H = 244, CARD_GAP = 26;
function cardRect(i) {
  const tw = 3 * CARD_W + 2 * CARD_GAP;
  return { x: (W0 - tw) / 2 + i * (CARD_W + CARD_GAP), y: 190, w: CARD_W, h: CARD_H };
}
function cardHit(lx, ly) {
  for (let i = 0; i < 3; i++) {
    const r = cardRect(i);
    if (lx >= r.x && lx <= r.x + r.w && ly >= r.y && ly <= r.y + r.h) return i;
  }
  return -1;
}
/* 刷新按钮：卡面下方那颗。触屏上要够大（≥44 屏幕像素高），所以尺寸也走 cssPx */
function rerollRect() {
  const w = clamp(cssPx(150), 190, 340), h = clamp(cssPx(42), 46, 96);
  return { x: (W0 - w) / 2, y: 484, w, h };
}
function rerollHit(lx, ly) {
  const r = rerollRect();
  return lx >= r.x && lx <= r.x + r.w && ly >= r.y && ly <= r.y + r.h;
}

function render() {
  ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
  ctx.fillStyle = "#02060d";
  ctx.fillRect(0, 0, R.cw, R.ch);
  ctx.setTransform(R.dpr * R.scale, 0, 0, R.dpr * R.scale, R.dpr * R.ox, R.dpr * R.oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W0, H0); ctx.clip();
  let sx = 0, sy = 0;
  if (G.shakeT > 0) {
    const m = G.shakeMag * (G.shakeT / 0.7);
    sx = (Math.random() * 2 - 1) * m; sy = (Math.random() * 2 - 1) * m;
  }
  ctx.translate(sx, sy);
  if (SELFTEST.active) {
    drawSelfTest();
    ctx.restore();
    return;
  }
  drawWorld();
  if (G.state === "play" || G.state === "pause" || G.state === "levelup") {
    /* 选牌时把 HUD 压暗：否则「100 米」会和「深渊馈赠」标题叠在一起，看着像花了屏 */
    ctx.save();
    ctx.globalAlpha = G.state === "levelup" ? 0.28 : 1;
    drawHUD();
    ctx.restore();
  }
  if (G.state === "title") drawTitle();
  else if (G.state === "over") drawOver();
  else if (G.state === "pause") drawPause();
  else if (G.state === "levelup") drawLevelUp();
  ctx.restore();
  /* 竖屏提示：画面是 16:10，竖屏只能缩成中间一条 —— 占用空白黑边明说，别让玩家以为是坏了 */
  const barH = (R.ch - R.scale * H0) / 2;
  if (barH > 60) {
    ctx.save();
    ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
    ctx.fillStyle = "rgba(140,200,230,0.72)";
    ctx.font = '600 14px "PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("↻ 把手机横过来，画面大一倍", R.cw / 2, barH * 0.5);
    ctx.restore();
  }
}

function toLogical(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: clamp((clientX - r.left - R.ox) / R.scale, -200, W0 + 200),
    y: clamp((clientY - r.top - R.oy) / R.scale, -200, H0 + 200)
  };
}
/* 加速有多个来源（键盘 / 鼠标左键 / 双指），必须「或」起来算 ——
   早先这里直接写 I.boost = I.mouseDown || touches>=2，于是按住空格时

    /* 截图要把整场战斗都照亮，不然一半零件埋在纯黑里（黑暗验收另有 dark 场景） */
    G.lightR = 560; G.lightBonus = 0;
    fireAttack();
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "active") {
    /* 主动技能验收截图：选「法师」→ Q 放出去正在扩散、按钮转冷却；
       另外两个按钮没选，画虚线写「封」。摆一圈目标进去，一眼看出范围内被打掉了。 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.route = "mage"; recalcMods();            // 技能得先选出来：没选路线 tryActive 一律拒绝
    G.depth = parseFloat(q.get("depth") || "1300") || 1300;
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    const py = p.y + 190;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI * 0.75 + i * (Math.PI * 1.5 / 4);
      ents.push({ kind: i % 2 ? "hunter" : "rock", x: clamp(p.x + Math.cos(a) * 190, 50, W0 - 50), y: py + Math.sin(a) * 160,
                  r: i % 2 ? 20 : 28, hp: i % 2 ? 60 : 70, maxHp: i % 2 ? CFG.hunterHP : CFG.rockHP, seed: 5 + i * 7, flash: 0 });
    }
    G.lightR = 620; G.lightBonus = 0;
    G.o2 = 58;
    tryActive("q");                            // 放得出来：Q 的冷却扇形进画面
    fireAttack();
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "active2") {
    /* 探照生效中：光照半径被技能顶到最大，黑暗被推开（对比 09-dark） */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.depth = parseFloat(q.get("depth") || "1200") || 1200;
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    G.o2 = 62;
    G.route = "lamp"; recalcMods();             // 探照只属于「照明使者」
    G.lightR = lerp(CFG.lightNear, CFG.lightFar, clamp(G.depth / CFG.lightSpan, 0, 1));
    tryActive("f");
    for (let i = 0; i < 90; i++) update(STEP);      // 让光照过渡到位
    for (const e of ents) if (e.kind === "hunter") e.x = clamp(e.x, 90, W0 - 90);
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "mutate") {
    /* 质变验收截图：跑到 2000m 停在质变三选一卡面上（挂机 AI 撑不到 2km：保氧不死） */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    let guard = 0;
    while ((G.state === "play" || G.state === "levelup") && guard++ < 120 * 2400) {
      if (G.state === "levelup") { if (!aiPick()) break; }
      G.o2 = Math.max(G.o2, 90);
      autopilot(STEP); update(STEP);
      if (!G.mutate && G.route && G.depth >= CFG.mutateAt && G.state === "levelup") break;
    }
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "deepmob") {
    /* 深水怪验收截图：2000m 场地摆一只剃刀鲸 + 一只开盾的圣盾使 + 护心符转着 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.depth = 2100; G.route = "mage"; recalcMods();
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    const py = p.y + 170;
    ents.push({ kind: "reaver", x: p.x - 210, y: py + 40, r: 30, hp: 320, maxHp: 320, seed: 7, hit: false, near: false, flash: 0, vx: 200 });
    ents.push({ kind: "warden", x: p.x + 180, y: py + 20, r: 22, hp: 260, maxHp: 260, seed: 15, hit: false, near: false, flash: 0, fireT: 1.6, fanN: 0, fanT: 0, shield: true, shieldHp: 3, breakT: 0 });
    ents.push({ kind: "hunter", x: p.x + 40, y: py + 130, r: 20, hp: 300, maxHp: 300, seed: 21, hit: false, near: false, flash: 0 });
    G.sk = { a_amulet: 1 }; recalcMods();
    G.amuT = G.m.amu.t; G.amuCd = G.m.amu.cd; G.amuAng = 0.6;      // 符咒当场转起来
    G.lightR = 560; G.lightBonus = 0; G.o2 = 72;
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "help") {
    /* 规则弹层截图：标题页点「?」之后的样子 */
    G.helpOpen = true;
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("auto") !== null) {
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    const n = clamp(parseInt(q.get("auto"), 10) || 0, 0, 120 * 600);
    for (let i = 0; i < n; i++) { if (G.state === "levelup") aiPick(); update(STEP); }
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "play") {
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
  }
  requestAnimationFrame(frame);
}
init();
</script>
