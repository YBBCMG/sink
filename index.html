    /* 大肥鱼：白气泡（带高光）+ 偶尔一粒白饭（签名） */
    for (const q of L) {
      const k = q.t / q.life, r = 3.1 * q.s * (0.6 + k * 0.7);
      ctx.globalAlpha = 0.34 * k;
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(225,242,255,0.55)"; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = "rgba(245,252,255,0.85)"; ctx.stroke();
      ctx.beginPath(); ctx.arc(q.x - r * 0.32, q.y - r * 0.34, r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fill();
      if (q.rice) {                                   // 饭粒：白椭圆 + 一点米尖
        ctx.globalAlpha = 0.8 * k;
        ctx.beginPath(); ctx.ellipse(q.x + 5 * q.s, q.y + 2, 4.2 * q.s, 2.3 * q.s, q.rot, 0, Math.PI * 2);
        ctx.fillStyle = "#fbfdff"; ctx.fill();
        ctx.strokeStyle = "rgba(200,220,240,0.75)"; ctx.lineWidth = 0.7; ctx.stroke();
      }
    }
  } else {
    /* 银月鱼：一弯弯月牙 + 偶尔一圈涟漪 */
    for (let i = 0; i < L.length; i++) {
      const q = L[i], k = q.t / q.life;
      ctx.globalAlpha = 0.55 * k;
      ctx.strokeStyle = "rgba(215,244,255,0.95)";
      ctx.lineWidth = 2.1 * q.s;
      ctx.beginPath();
      ctx.arc(q.x, q.y, 6.6 * q.s, -1.0 + q.rot, 1.7 + q.rot);
      ctx.stroke();
      ctx.globalAlpha = 0.30 * k;                      // 内芯一层亮银，小图上也看得见
      ctx.lineWidth = 0.9 * q.s;
      ctx.beginPath();
      ctx.arc(q.x, q.y, 6.6 * q.s, -0.8 + q.rot, 1.5 + q.rot);
      ctx.stroke();
      if (i % 4 === 0 && k > 0.3) {
        ctx.globalAlpha = 0.20 * k;
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.arc(q.x, q.y, 13 + (1 - k) * 30, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const bob = Math.sin(G.t * 2.2) * 3;
  const px = p.x, py = p.y + bob;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(px, py, 2, px, py, 150 + G.lightBonus * 0.4);
  g.addColorStop(0, "rgba(140,225,255,0.34)");
  g.addColorStop(0.45, "rgba(90,180,255,0.11)");
  g.addColorStop(1, "rgba(60,140,255,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(px, py, 150 + G.lightBonus * 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (p.invuln > 0 && Math.floor(G.t * 14) % 2 === 0) ctx.globalAlpha = 0.45;
  const tilt = clamp(p.vx / 700, -0.5, 0.5);
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tilt * 0.6);
  /* 尾鳍摆动的相位（各皮肤共用） */
  const wig = Math.sin(G.t * 16) * 0.45;
  /* 鱼身交给当前皮肤画：s=1 是正常大小，鼻尖朝 +x */
  ctx.save();
  skin().paint(ctx, G.t, 1, wig);
  ctx.restore();
  ctx.restore();
  ctx.globalAlpha = 1;

  if (G.boosting) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + G.t * 3;
      const d0 = 20 + (i % 3) * 9;
      ctx.strokeStyle = "rgba(150,230,255,0.30)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(a) * d0, py + Math.sin(a) * d0);
      ctx.lineTo(px + Math.cos(a) * (d0 + 26), py + Math.sin(a) * (d0 + 26));
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawEntity(e) {
  const x = e.x, y = e.y;
  if (e.kind === "rock") {
    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2;
      const rad = e.r * (0.72 + 0.5 * hash1(e.seed + i * 3.7));
      const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = "#0a1420"; ctx.fill();
    ctx.strokeStyle = "rgba(120,175,205,0.42)"; ctx.lineWidth = 1.4; ctx.stroke();
  } else if (e.kind === "cable") {
    ctx.beginPath();
    const h = e.len / 2;
    for (let i = 0; i <= 8; i++) {
      const t = i / 8, yy = y - h + e.len * t;
      const xx = x + Math.sin(t * 5 + e.seed) * 5;
      if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
    }
    ctx.strokeStyle = "rgba(150,190,215,0.7)"; ctx.lineWidth = e.r * 0.55; ctx.lineCap = "round"; ctx.stroke();
    ctx.strokeStyle = "rgba(20,40,60,0.9)"; ctx.lineWidth = e.r * 0.22; ctx.stroke();
  } else if (e.kind === "bubble") {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(x, y, 1, x, y, e.r * 2.6);
    g.addColorStop(0, "rgba(160,255,220,0.55)"); g.addColorStop(1, "rgba(160,255,220,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, e.r * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, e.r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(190,255,230,0.95)"; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.beginPath(); ctx.arc(x - e.r * 0.32, y - e.r * 0.34, e.r * 0.26, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fill();
  } else if (e.kind === "jelly") {
    const pulse = 1 + Math.sin(G.t * 3 + e.seed) * 0.14;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(x, y, 2, x, y, e.r * 4.2 * pulse);
    g.addColorStop(0, "rgba(150,205,255,0.5)"); g.addColorStop(1, "rgba(120,180,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, e.r * 4.2 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(x, y, e.r * pulse, e.r * 0.78 * pulse, 0, Math.PI, 0);
    ctx.fillStyle = "rgba(205,235,255,0.85)"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * e.r * 0.4, y);
      ctx.quadraticCurveTo(x + i * e.r * 0.4 + Math.sin(G.t * 4 + i) * 4, y + e.r * 0.9, x + i * e.r * 0.4, y + e.r * 1.5);
      ctx.stroke();
    }
  } else if (e.kind === "hunter") {
    /* 深海猎食者：尖头朝上（冲着玩家来）的梭形，一对红眼 */
    const R0 = e.r, wob = Math.sin(G.t * 9 + e.seed) * 2;
    ctx.beginPath();
    ctx.moveTo(x, y - R0 * 1.55);
    ctx.lineTo(x + R0 * 1.05, y + R0 * 0.30);
    ctx.lineTo(x + R0 * 0.30, y + R0 * 0.12);
    ctx.lineTo(x, y + R0 * 1.30 + wob);
    ctx.lineTo(x - R0 * 0.30, y + R0 * 0.12);
    ctx.lineTo(x - R0 * 1.05, y + R0 * 0.30);
    ctx.closePath();
    ctx.fillStyle = e.flash > 0 ? "rgba(255,235,225,0.95)" : "#2b0d12";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,110,90,0.85)"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = "rgba(255,95,70,0.95)";
    for (const sx of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(x + sx * R0 * 0.34, y - R0 * 0.62, 3.4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    }
  } else if (e.kind === "spitter") {
    /* 电袭者：紫伞 + 炮口，蓄力时炮口发亮 */
    const pulse = 1 + Math.sin(G.t * 4 + e.seed) * 0.10;
    const ch = clamp(1 - e.fireT / 0.9, 0, 1);
    ctx.beginPath();
    ctx.ellipse(x, y, e.r * pulse, e.r * 0.85 * pulse, 0, Math.PI, 0);
    ctx.fillStyle = e.flash > 0 ? "rgba(240,245,255,0.95)" : "rgba(118,88,190,0.88)";
    ctx.fill();
    ctx.strokeStyle = "rgba(195,165,255,0.85)"; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.strokeStyle = "rgba(180,150,255,0.7)"; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * e.r * 0.36, y + e.r * 0.1);
      ctx.quadraticCurveTo(x + i * e.r * 0.36 + Math.sin(G.t * 6 + i + e.seed) * 5, y + e.r * 0.85, x + i * e.r * 0.36, y + e.r * 1.5);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y + e.r * 0.3, 3 + ch * 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255," + Math.round(205 - ch * 130) + ",125," + (0.45 + ch * 0.55).toFixed(2) + ")";
    ctx.fill();
  } else if (e.kind === "bolt") {
    /* 电球 */
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(x, y, 1, x, y, e.r * 3.2);
    g.addColorStop(0, "rgba(205,240,255,0.9)");
    g.addColorStop(1, "rgba(120,180,255,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, e.r * 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(x, y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = "#eaf6ff"; ctx.fill();
  }
  /* 血条不画在这里：它会被黑暗层吞掉，统一挪到黑暗之上重画（drawHpBar） */
}

function drawHUD() {
  const depth = Math.floor(G.depth);
  const d = clamp(depth / 1200, 0, 1);
  /* 深度 */
  ctx.save();
  ctx.shadowColor = "rgba(120,220,255,0.55)"; ctx.shadowBlur = 16;
  text(String(depth), W0 / 2, 74, 54, "#e8f8ff", "center", 700);
  ctx.restore();
  text("米", W0 / 2 + String(depth).length * 17 + 16, 74, 20, "rgba(160,215,245,0.75)", "left", 600);
  text("深度", W0 / 2, 96, 12, "rgba(130,185,215,0.65)", "center", 600);
  if (G.bonus >= 1) text("加成 +" + Math.round(G.bonus), W0 / 2, 118, 14, "rgba(255,225,150,0.85)", "center", 600);
  /* 最佳 */
  text("最佳 " + Math.max(G.best, depth) + " m", W0 - 24, 38, 15, "rgba(140,190,220,0.7)", "right", 600);
  /* 深渊压力：越深越高，耗氧/障碍/伤害一起跟着涨 */
  const press = Math.round(diffK(depth) * 100);
  text("压力 " + press + "%", W0 - 24, 60, 12, press >= 45 ? "rgba(255,175,150,0.9)" : press >= 25 ? "rgba(255,225,150,0.75)" : "rgba(140,190,220,0.6)", "right", 600);
  drawSkillChips(W0 - 24, 84);
  /* 氧气条 */
  const bw = 300, bh = 13, bx = 24, by = H0 - 42;
  const ratio = clamp(G.o2 / o2MaxNow(), 0, 1);
  const low = ratio < 0.25;
  const pulse = low ? 0.55 + 0.45 * Math.abs(Math.sin(G.t * 6)) : 1;
  rrRect(bx, by, bw, bh, 6.5);
  ctx.fillStyle = "rgba(8,22,36,0.85)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,190,230,0.28)"; ctx.lineWidth = 1; ctx.stroke();
  const col = ratio > 0.5 ? [110, 230, 190] : ratio > 0.25 ? [255, 210, 120] : [255, 120, 120];
  ctx.save();
  rrRect(bx, by, bw, bh, 6.5); ctx.clip();
  ctx.globalAlpha = pulse;
  const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  gg.addColorStop(0, mixRgb([col[0] * 0.7, col[1] * 0.7, col[2] * 0.7], col, 0.4));
  gg.addColorStop(1, mixRgb(col, [255, 255, 255], 0.35));
  ctx.fillStyle = gg;
  ctx.fillRect(bx, by, bw * ratio, bh);
  ctx.restore();
  text("氧气", bx, by - 8, 12, low ? "rgba(255,150,150,0.95)" : "rgba(140,190,220,0.7)", "left", 600);
  text(Math.ceil(G.o2) + "%", bx + bw + 12, by + 12, 15, low ? "rgba(255,150,150,0.95)" : "rgba(190,230,250,0.85)", "left", 600);
  /* 加速提示 */
  if (G.boosting) text("加速 ×" + boostMulNow().toFixed(2).replace(/0$/, ""), bx + bw + 12, by - 8, 12, "rgba(255,225,150,0.9)", "left", 600);
  /* 光照条（2026-09-26 玩家口径「你在游戏里加光亮条」）：
     视野是这局最贵的资源，之前只能靠感觉 —— 被熄灯鮟鱇吞了多少、水母还剩多少加成，全在一个小条上。
     长度 = 当前光照半径 / 参考满值（水面 360 + 水母上限 560 = 920）；
     白色刻度 = 「什么都没吃也没被吞」的深度基线，一眼看出加成 / 被吞各占多少。 */
  const lby = by - 34, lbh = 8;      // 离氧气条留 6px：贴太近「氧气」两个字会顶到条上（截图里看着糊成一团）
  const lmax = CFG.lightNear + CFG.jellyCap;
  const lr = clamp(G.lightR / lmax, 0, 1);
  const litBase = lerp(CFG.lightNear, CFG.lightFar, clamp(G.depth / CFG.lightSpan, 0, 1)) + CFG.lightMut * skLv("a_light");
  const baseR = clamp((litBase * (1 - G.lightEat)) / lmax, 0, 1);
  const lcol = lr > 0.5 ? [150, 235, 255] : lr > 0.22 ? [255, 222, 150] : [255, 130, 140];
  rrRect(bx, lby, bw, lbh, 4);
  ctx.fillStyle = "rgba(8,22,36,0.85)"; ctx.fill();
  ctx.strokeStyle = "rgba(120,190,230,0.26)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.save();
  rrRect(bx, lby, bw, lbh, 4); ctx.clip();
  const lg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  lg.addColorStop(0, mixRgb([lcol[0] * 0.6, lcol[1] * 0.6, lcol[2] * 0.6], lcol, 0.45));
  lg.addColorStop(1, mixRgb(lcol, [255, 255, 255], 0.4));
  ctx.fillStyle = lg;
  ctx.fillRect(bx, lby, bw * lr, lbh);
  ctx.restore();
  /* 基线刻度：当前值在刻度左边 = 被吞光压到基线以下（熄灯鮟鱇就在脸上） */
  const tx = bx + bw * baseR;
  ctx.strokeStyle = lr < baseR - 0.01 ? "rgba(190,150,255,0.95)" : "rgba(255,255,255,0.55)";
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(tx, lby - 1.5); ctx.lineTo(tx, lby + lbh + 1.5); ctx.stroke();
  text("光照", bx, lby - 6, 11.5, lr < baseR - 0.01 ? "rgba(200,165,255,0.95)" : "rgba(140,190,220,0.72)", "left", 600);
  text(Math.round(G.lightR) + (G.lightEat > 0.01 ? " · 被吞 " + Math.round(G.lightEat * 100) + "%" : "")
       + (G.actFx.flare > 0 ? " · 探照" : ""), bx + bw, lby - 6, 11.5,
       G.lightEat > 0.01 ? "rgba(200,165,255,0.9)" : lr <= 0.22 ? "rgba(255,150,150,0.9)" : "rgba(190,230,250,0.85)", "right", 600);
  /* 深渊馈赠：等级 + 距下次强化的距离 */
  const lvSpan = lvNeed(G.level + 1);
  const lvP = clamp((G.depth - (G.nextLv - lvSpan)) / lvSpan, 0, 1);
  const lbyLv = by - 62;
  rrRect(bx, lbyLv, bw, 5, 2.5); ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
  rrRect(bx, lbyLv, lvP * bw, 5, 2.5); ctx.fillStyle = "rgba(255,215,150,0.85)"; ctx.fill();
  text("强化 Lv " + G.level + "　·　距下次 " + Math.max(0, Math.ceil(G.nextLv - G.depth)) + " m" + (routeNow() ? "　·　" + routeNow().n : ""), bx, lbyLv - 7, 12, "rgba(255,225,170,0.78)", "left", 600);
  /* 深度进度条（右侧，暗示 1000m 是传奇线） */
  const pbx = W0 - 26, pby = 120, pbh = 300;
  rrRect(pbx, pby, 4, pbh, 2); ctx.fillStyle = "rgba(255,255,255,0.10)"; ctx.fill();
  rrRect(pbx, pby + pbh * (1 - d), 4, pbh * d, 2);
  ctx.fillStyle = "rgba(140,225,255,0.75)"; ctx.fill();
  text("1000m", pbx - 6, pby - 6, 11, "rgba(140,200,230,0.55)", "right", 600);
  if (TOUCH && G.input.touches > 0) text("双指 = 加速（也可以按住左下「加速」）", W0 / 2, BOOST_BTN.y - BOOST_BTN.r - 12, 12, "rgba(140,200,230,0.6)", "center", 600);
  drawActives();
  drawTouchCtl();
}

/* 主动技能的 HUD：右下角三个圆形按钮（键位 + 名字 + 冷却扇形）。
   做成可点的圆形是为了触屏 —— 手机上只有键盘就废了。 */
function drawActives() {
  const rt = routeNow();
  for (const b of ACT_BTN) {
    /* 没选的技能画虚线：路线没定是「锁」，选了别的路线是「封」（永久关闭） */
    const owned = !!rt && rt.k === b.k;
    if (!owned) {
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x, b.y, ACT_R, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(8,18,26,0.62)"; ctx.fill();
      ctx.strokeStyle = "rgba(96,126,146,0.30)"; ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]); ctx.stroke();
      ctx.restore();
      text(b.key, b.x, b.y - 1, 15, "rgba(130,160,180,0.38)", "center", 700);
      text(rt ? "封" : "锁", b.x, b.y + 16, 10.5, "rgba(130,160,180,0.5)", "center", 600);
      continue;
    }
    const cd = G.act[b.k], total = Math.max(0.001, b.cd()), rdy = cd <= 0;
    ctx.save();
    ctx.beginPath(); ctx.arc(b.x, b.y, ACT_R, 0, Math.PI * 2);
    ctx.fillStyle = rdy ? "rgba(20,58,84,0.70)" : "rgba(10,24,36,0.70)"; ctx.fill();
    ctx.strokeStyle = rdy ? "rgba(150,235,255,0.75)" : "rgba(110,150,175,0.38)";
    ctx.lineWidth = 2; ctx.stroke();
    if (!rdy) {
      ctx.beginPath(); ctx.moveTo(b.x, b.y);
      ctx.arc(b.x, b.y, ACT_R - 1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (cd / total));
      ctx.closePath(); ctx.fillStyle = "rgba(3,10,18,0.66)"; ctx.fill();
    }
    ctx.restore();
    text(b.key, b.x, b.y - 1, 17, rdy ? "#dff6ff" : "rgba(150,180,200,0.5)", "center", 700);
    text(rdy ? b.n : cd.toFixed(1), b.x, b.y + 16, 10.5, rdy ? "rgba(185,232,252,0.88)" : "rgba(150,180,200,0.6)", "center", 600);
  }
  if (G.hint && G.t < G.hintT) text(G.hint, ACT_BTN[0].x + ACT_R, ACT_BTN[0].y - ACT_R - 14, 12.5, "rgba(255,214,150,0.92)", "right", 600);
}

/* 触屏专用控件：左下「加速」（按住不放）+ 左上「暂停」。桌面鼠标环境不画。 */
function drawTouchCtl() {
  if (!TOUCH || G.state !== "play") return;
  const b = BOOST_BTN, on = G.input.boost;
  ctx.save();
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
  ctx.fillStyle = on ? "rgba(255,205,130,0.30)" : "rgba(20,58,84,0.62)"; ctx.fill();
  ctx.strokeStyle = on ? "rgba(255,230,180,0.95)" : "rgba(150,235,255,0.62)"; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.restore();
  text("加速", b.x, b.y + 2, 20, on ? "#fff2d6" : "#dff6ff", "center", 700);
  text("按住", b.x, b.y + 24, 11, "rgba(185,232,252,0.72)", "center", 600);
  const pb = PAUSE_BTN;
  ctx.save();
  ctx.beginPath(); ctx.arc(pb.x, pb.y, pb.r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(12,30,46,0.62)"; ctx.fill();
  ctx.strokeStyle = "rgba(150,235,255,0.5)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
  const pw = Math.max(2.5, pb.r * 0.17), ph = pb.r * 0.86;      // 两条竖杠 = 暂停
  ctx.fillStyle = "#dff6ff";
  ctx.fillRect(pb.x - pw * 2, pb.y - ph / 2, pw, ph);
  ctx.fillRect(pb.x + pw, pb.y - ph / 2, pw, ph);
}

function drawWorld() {
  const d = clamp(G.depth / 1200, 0, 1);
  const g = ctx.createLinearGradient(0, 0, 0, H0);
  g.addColorStop(0, mixRgb([10, 38, 66], [1, 4, 12], d));
  g.addColorStop(1, mixRgb([22, 70, 108], [3, 10, 22], d));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W0, H0);
  /* 光柱 */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 4; i++) {
    const bx = 60 + i * 250 + Math.sin(G.t * 0.25 + i) * 26;
    const lg = ctx.createLinearGradient(bx, 0, bx + 90, H0 * 0.9);
    lg.addColorStop(0, "rgba(130,205,255," + (0.085 * (1 - d)).toFixed(3) + ")");
    lg.addColorStop(1, "rgba(130,205,255,0)");
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(bx - 34, 0); ctx.lineTo(bx + 34, 0);
    ctx.lineTo(bx + 150, H0 * 0.9); ctx.lineTo(bx - 110, H0 * 0.9);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  /* 浮游雪 */
  for (const s of G.snow) {
    ctx.globalAlpha = s.a * (0.35 + 0.65 * (1 - d));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = "#bfe6ff"; ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const e of ents) drawEntity(e);
  for (const q of G.particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.globalAlpha = a * 0.9;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgb(" + q.col + ")"; ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (G.state === "play" || G.state === "pause" || G.state === "over") { drawTrail(); drawPlayer(); }
  else { const bx = p.x, by = p.y; p.x = W0 / 2; p.y = 78 + Math.sin(G.t * 1.4) * 7; drawPlayer(); p.x = bx; p.y = by; }
  /* 拾取飘字 */
  for (const q of G.popups) {
    ctx.globalAlpha = clamp(q.life / 0.9, 0, 1);
    text(q.text, q.x, q.y, 14, "rgba(" + q.col + ",1)", "center", 700);
  }
  ctx.globalAlpha = 1;
  /* 黑暗 / 视野：光照半径之外 alpha=1（纯黑）—— 轮廓、气泡一律看不见。
     早先是「全屏压暗 + 一圈渐变」，半径外还剩 55~65% 亮度，等于自带夜视仪。 */
  const px = p.x, py = p.y + (G.state === "play" ? Math.sin(G.t * 2.2) * 3 : 0);
  const lr = Math.max(90, G.lightR);
  const dg = ctx.createRadialGradient(px, py, lr * 0.20, px, py, lr);
  dg.addColorStop(0, "rgba(2,8,18,0)");
  dg.addColorStop(0.52, "rgba(2,8,18," + (0.30 + 0.34 * d).toFixed(3) + ")");
  dg.addColorStop(0.80, "rgba(2,8,18," + (0.80 + 0.20 * d).toFixed(3) + ")");
  dg.addColorStop(1, "rgba(2,8,18,1)");
  ctx.fillStyle = dg;
  ctx.fillRect(0, 0, W0, H0);
  /* 水母例外：它是光源，得在黑暗层之上重绘一遍，否则一样被吞进纯黑 */
  for (const e of ents) if (e.kind === "jelly") drawJellyGlow(e);
  /* 猎食者/电球也是生物光：不在光照半径内照样看得见它们扑过来（否则 1000m 以下纯挨打）；
     但障碍物不是光源 —— 光照半径外它就该是黑的（玩家口径：半径外啥也看不见） */
  for (const e of ents) if (MOB_SET[e.kind]) drawCombatGlow(e);
  /* 队友也算「生物光」：他不在你的光照半径内时，得能看见他在哪（实测：画在黑暗层以下 = 远了就纯黑，
     截图上根本找不到人 —— 这一条是拿截图抓出来的） */
  drawPlayer2();
  for (const e of ents) drawHpBar(e);
  for (const e of ents) if (e.seal > 0) drawSeal(e);
  drawZones();
  drawStacks();
  drawActiveFx();
  drawAim();
  /* 受伤红闪 */
  if (G.redFlash > 0) {
    ctx.fillStyle = "rgba(255,60,60," + (G.redFlash * 0.22).toFixed(3) + ")";
    ctx.fillRect(0, 0, W0, H0);
  }
}

/* ---------- 场 / 骨片 / 折射光线 / 层数的绘制 ----------
   全部画在黑暗层之上：它们都是「技能留下的光」，深水里被黑暗吞掉就等于没有
   （和水母 / 怪同一条规矩 —— 玩家定的：光照半径之外啥也看不见，但光源自己看得见）。 */
function drawZones() {
  for (const z of G.zones) {
    const a = 0.25 + 0.55 * clamp(1 - z.t / z.life, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    if (z.type === "singHold") {
      /* 玩家口径（2026-09-26）「待炸奇点没有任何特效，我看不出来哪儿有待炸的」：
         存着的那颗单独一套长相 —— 亮紫脉冲球 + 转着的虚线环 + 倒计时弧 + 圈里写「待炸」。 */
      const left = clamp(1 - z.t / z.life, 0, 1);
      const pulse = 0.5 + 0.5 * Math.sin(G.t * 6.2);
      const blink = left < 0.25 ? (Math.sin(G.t * 24) > 0 ? 1 : 0.22) : 1;
      const c0 = "255,150,255";
      const rr0 = z.r * (0.85 + 0.15 * pulse);
      /* 底色压得很淡：玩家要的是「一眼看出这儿有颗待炸的」，不是拿紫雾糊住半个屏幕（第一版糊掉了） */
      const rg = ctx.createRadialGradient(z.x, z.y, z.r * 0.08, z.x, z.y, rr0);
      rg.addColorStop(0, "rgba(" + c0 + "," + (0.13 * blink).toFixed(3) + ")");
      rg.addColorStop(0.62, "rgba(200,165,255," + (0.06 * blink).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(190,170,255,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(z.x, z.y, rr0, 0, Math.PI * 2); ctx.fill();
      /* 转着的虚线环：一眼区分「存着的」和「正在吸的」（正在吸是三圈往里收的实线螺旋） */
      ctx.strokeStyle = "rgba(" + c0 + "," + (0.95 * blink).toFixed(3) + ")";
      ctx.lineWidth = 3;
      const spin0 = G.t * 2.6;
      for (let k = 0; k < 12; k++) {
        const a0 = spin0 + k * (Math.PI * 2 / 12);
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (0.78 + 0.06 * pulse), a0, a0 + 0.22); ctx.stroke();
      }
      /* 倒计时弧：还剩几秒一眼看得出 */
      ctx.strokeStyle = "rgba(255,235,255," + (0.9 * blink).toFixed(3) + ")";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.95, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left); ctx.stroke();
      /* 牌子：这儿必须切回 source-over —— lighter 模式下黑色加不上去，字会淹在紫雾里 */
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(26,12,46,0.74)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(z.x - 78, z.y - 21, 156, 42, 11);
      else ctx.rect(z.x - 78, z.y - 21, 156, 42);
      ctx.fill();
      text("待炸", z.x, z.y + 3, 18, "rgba(255,222,255,0.98)", "center", 700);
      text("左键引爆 " + Math.max(0, z.life - z.t).toFixed(1) + "s", z.x, z.y + 18, 11, "rgba(226,202,246,0.94)", "center", 500);
      ctx.globalCompositeOperation = "lighter";
    } else if (z.type === "sing" || z.type === "core") {
      const c0 = z.type === "sing" ? "190,170,255" : "185,160,255";
      const rg = ctx.createRadialGradient(z.x, z.y, z.r * 0.1, z.x, z.y, z.r);
      rg.addColorStop(0, "rgba(" + c0 + "," + (0.34 * a).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(" + c0 + ",0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
      const spin = G.t * (z.type === "sing" ? 3.4 : 1.8);
      ctx.strokeStyle = "rgba(" + c0 + "," + (0.75 * a).toFixed(3) + ")";
      ctx.lineWidth = 2;
      for (let k = 0; k < 3; k++) {                    // 三圈往里收的螺旋 = 「它在吸」
        const rr2 = z.r * (0.95 - k * 0.24);
        ctx.beginPath(); ctx.arc(z.x, z.y, rr2, spin + k * 2.1, spin + k * 2.1 + 2.2); ctx.stroke();
      }
      /* 进阶·吞噬奇点：吃到第几只 / 下一档要几只写在圈里（档位成长看得见） */
      if (G.t2 === "singA" && G.singEat > 0) {
        const nx = devourNextNeed(G.singEat);
        text("吞噬 " + G.singEat + (nx ? "/" + nx : " 满") + " · 奇点 +" + G.singGrow, z.x, z.y + 4, 12, "rgba(225,215,255," + (0.85 * a).toFixed(2) + ")", "center", 600);
      }
    } else if (z.type === "wound" || z.type === "fire" || z.type === "wave") {
      /* 横浪（立浪）/ 火池：一圈贴地的光，越旧越淡 */
      const col2 = z.type === "fire" ? "255,170,110" : "150,255,220";
      const rg2 = ctx.createRadialGradient(z.x, z.y, 2, z.x, z.y, z.r);
      rg2.addColorStop(0, "rgba(" + col2 + "," + (0.26 * a).toFixed(3) + ")");
      rg2.addColorStop(1, "rgba(" + col2 + ",0)");
      ctx.fillStyle = rg2;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(" + col2 + "," + (0.45 * a).toFixed(3) + ")";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.82, 0, Math.PI * 2); ctx.stroke();
      /* 立浪：三段弧要看出「一道墙」—— 补一条亮芯，不然只是三圈淡淡的青光（截图复核时看不出来） */
      if (z.type === "wave" && z.nx !== undefined) {
        const HW = z.r * 1.6;
        ctx.strokeStyle = "rgba(170,255,225," + (0.8 * a).toFixed(3) + ")";
        ctx.lineWidth = 13;
        ctx.beginPath();
        ctx.moveTo(z.x - z.nx * HW, z.y - z.ny * HW); ctx.lineTo(z.x + z.nx * HW, z.y + z.ny * HW);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,255,255," + (0.7 * a).toFixed(3) + ")";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(z.x - z.nx * HW, z.y - z.ny * HW); ctx.lineTo(z.x + z.nx * HW, z.y + z.ny * HW);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(z.x + z.nx * HW, z.y + z.ny * HW, 4.5, 0, Math.PI * 2);
        ctx.beginPath(); ctx.arc(z.x - z.nx * HW, z.y - z.ny * HW, 4.5, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (z.type === "lamp") {
      /* 环绕成环之后十盏灯的光斑会叠成一张白饼（截图复核抓到的）—— 单盏柔光压薄，
         把「火线」那条多边形的边提亮：玩家看到的是一圈转着的火，不是一坨白光。 */
      const rg = ctx.createRadialGradient(z.x, z.y, 4, z.x, z.y, z.r * 0.8);
      rg.addColorStop(0, "rgba(255,235,180," + (0.17 * a).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(255,225,170,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r * 0.8, 0, Math.PI * 2); ctx.fill();
      if (z.px !== undefined) {                        // 火线：和上一盏灯连起来
        ctx.strokeStyle = "rgba(255,175,95," + (0.55 * a).toFixed(3) + ")";
        ctx.lineWidth = z.lineR * 0.5;
        ctx.beginPath(); ctx.moveTo(z.px, z.py); ctx.lineTo(z.x, z.y); ctx.stroke();
        ctx.strokeStyle = "rgba(255,245,205," + (0.75 * a).toFixed(3) + ")";
        ctx.lineWidth = z.lineR * 0.16;
        ctx.beginPath(); ctx.moveTo(z.px, z.py); ctx.lineTo(z.x, z.y); ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,245,205," + (0.85 * a).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(z.x, z.y, 5 + Math.sin(G.t * 4) * 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  if (G.shards.length) {                               // 骨片（鲸骨撞角）
    ctx.strokeStyle = "rgba(235,245,255,0.9)"; ctx.lineWidth = 2.4;
    for (const s of G.shards) {
      const d = Math.max(1, Math.hypot(s.vx, s.vy)), L = 9;
      ctx.beginPath();
      ctx.moveTo(s.x - s.vx / d * L, s.y - s.vy / d * L);
      ctx.lineTo(s.x + s.vx / d * L, s.y + s.vy / d * L);
      ctx.stroke();
    }
  }
  if (G.beams.length) for (const b of G.beams) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const ba = clamp(b.t / (b.lance ? 0.34 : 0.22), 0, 1);
    if (b.lance) {                                     // 质变·光矛：粗光带 + 一根白芯 + 矛尖的爆闪
      const w = b.w || 26, L = Math.hypot(b.x2 - b.x1, b.y2 - b.y1);
      ctx.translate(b.x1, b.y1); ctx.rotate(Math.atan2(b.y2 - b.y1, b.x2 - b.x1));
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, -w * 0.42); ctx.lineTo(L * 1.03, 0); ctx.lineTo(L, w * 0.42); ctx.closePath();
      ctx.fillStyle = "rgba(255,240,190," + (0.34 * ba).toFixed(3) + ")"; ctx.fill();
      ctx.beginPath(); ctx.moveTo(0, -w * 0.5); ctx.lineTo(L, -w * 0.13); ctx.lineTo(L * 1.01, 0); ctx.lineTo(L, w * 0.13); ctx.lineTo(0, w * 0.5); ctx.closePath();
      ctx.fillStyle = "rgba(255,253,235," + (0.80 * ba).toFixed(3) + ")"; ctx.fill();
      const rg = ctx.createRadialGradient(L, 0, 2, L, 0, w * 5);
      rg.addColorStop(0, "rgba(255,255,240," + (0.85 * ba).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(255,245,200,0)");
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(L, 0, w * 5, 0, Math.PI * 2); ctx.fill();
      const rg2 = ctx.createRadialGradient(0, 0, 2, 0, 0, w * 2.4);
      rg2.addColorStop(0, "rgba(255,255,245," + (0.8 * ba).toFixed(3) + ")");
      rg2.addColorStop(1, "rgba(255,245,200,0)");
      ctx.fillStyle = rg2; ctx.beginPath(); ctx.arc(0, 0, w * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore(); continue;
    }
    ctx.strokeStyle = "rgba(" + (b.col || "180,240,255") + "," + ba.toFixed(2) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.restore();
  }
}
/* 审判之光的「光印」：怪头顶一排点，满层就处决（玩家看得见进度） */
function drawSeal(e) {
  if (!G.m || !G.m.judge || !e.seal) return;
  const need = G.m.judge.need, n = Math.min(need, e.seal);
  for (let k = 0; k < need; k++) {
    const x = e.x + (k - (need - 1) / 2) * 9, y = e.y - e.r - 17;
    ctx.beginPath(); ctx.arc(x, y, 3.4, 0, Math.PI * 2);
    if (k < n) { ctx.fillStyle = "rgba(255,255,215,0.95)"; ctx.fill(); }
    else { ctx.strokeStyle = "rgba(255,255,215,0.42)"; ctx.lineWidth = 1.2; ctx.stroke(); }
  }
}
/* 层数（骨甲 / 血怒）：绕着自己一圈点 + 一个数字，攒了多少一眼看得见 */
function drawStacks() {
  const list = [];
  if (G.m && G.mutate === "bone" && G.m.bone && G.bone > 0) list.push({ n: G.bone, col: "225,240,255", tag: "骨甲" });
  if (G.m && G.m.frenzy && G.frenzy > 0) list.push({ n: G.frenzy, col: "255,150,150", tag: "血怒" });
  if (G.m && G.mutate === "sing" && G.t2 === "singA" && G.singEat > 0) list.push({ n: devourTierAt(G.singEat), col: "190,170,255", tag: "吞噬" });  // 吞噬奇点：显示到第几档（不是吃了几只，那个数能到 140）
  if (G.t2) {                                       // 进阶：挂在状态栏，一眼看到自己走了哪条
    const T2M = (MUT_T2[G.mutate] || []).filter((m) => m.id === G.t2)[0];
    if (T2M) list.push({ n: T2M.n, col: T2M.col.join(String.fromCharCode(44)), tag: "进阶", txt: true });
  }
  if (G.m && G.m.lant && G.lampN > 0) list.push({ n: G.lampN, col: "255,225,170", tag: "灯蕊" });     // 行灯环：亮了几盏
  if (!list.length) return;
  let r0 = CFG.playerR + 13;
  for (const L of list) {
    const shown = Math.min(L.n, 14);
    for (let k = 0; k < shown; k++) {
      const ang = -Math.PI / 2 + k * (Math.PI * 2 / Math.max(shown, 1));
      ctx.beginPath(); ctx.arc(p.x + Math.cos(ang) * r0, p.y + Math.sin(ang) * r0, 3, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(" + L.col + ",0.9)"; ctx.fill();
    }
    text(L.tag + " " + L.n, p.x, p.y - r0 - 10, 12, "rgba(" + L.col + ",0.95)", "center", 700);
    r0 += 11;
  }
}
/* 主动技能特效：都画在黑暗层之上（深水里不放光就等于没放） */
function drawActiveFx() {
  const fx = G.actFx;
  if (fx.shock > 0) {
    const k = clamp(1 - fx.shock / 0.45, 0, 1);          // 0→1 向外扩散
    const Rr = G.m.shockR * (0.25 + 0.85 * k);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.max(0, 1 - k) * 0.9;
    ctx.beginPath(); ctx.arc(fx.sx, fx.sy, Rr, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(170,240,255,0.95)"; ctx.lineWidth = 1.5 + 6 * (1 - k); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx.sx, fx.sy, Rr * 0.72, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,225,170,0.7)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  if (fx.shock2 && fx.shock2.t > 0) {
    /* 质变·雷暴二响：第二响的环（画在原地，不是玩家脚下） */
    const k2 = clamp(1 - fx.shock2.t / 0.42, 0, 1);
    const R2 = fx.shock2.r * (0.25 + 0.85 * k2);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.max(0, 1 - k2) * 0.9;
    ctx.beginPath(); ctx.arc(fx.shock2.x, fx.shock2.y, R2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(195,200,255,0.95)"; ctx.lineWidth = 1.5 + 6 * (1 - k2); ctx.stroke();
    ctx.beginPath(); ctx.arc(fx.shock2.x, fx.shock2.y, R2 * 0.7, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(220,235,255,0.6)"; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
  }
  if (fx.dash > 0) {
    /* 怒涛冲锋是「朝准星冲」，方向由 G.dashVX/dashVY 锁死 —— 老版不分青红皂白画一条朝屏幕上方拉直的尾巴，
       横向冲锋时那条尾巴跟移动方向垂直，看着像「冲的时候有人在旁边放了根柱子」（2026-09-26 一并修）。 */
    const chgOn = !!(G.mutate === "chg" && G.m.chg && G.dashVX != null && G.dashVY != null);
    const a = clamp(fx.dash / Math.max(0.001, chgOn ? G.m.chg.t : G.m.dashT), 0, 1);
    if (chgOn) {
      const ux = G.dashVX, uy = G.dashVY, nx = -uy, ny = ux, L0 = 150;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.6 * a;
      const g = ctx.createLinearGradient(p.x - ux * L0, p.y - uy * L0, p.x, p.y);
      g.addColorStop(0, "rgba(120,255,215,0)");
      g.addColorStop(1, "rgba(190,255,240,0.9)");
      ctx.fillStyle = g;

        g4.addColorStop(1, "rgba(" + q.col + ",0)");

    ctx.save();

    g.addColorStop(1, "rgba(190,235,255,0.02)");

    ctx.beginPath(); ctx.arc(p.x, p.y, G.haloR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(190,235,255,0.35)"; ctx.lineWidth = 1.5;

  if (G.m && G.m.amu && G.amuT > 0 && (G.state === "play" || G.state === "pause")) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const a = clamp(G.amuT / G.m.amu.t, 0, 1);
    for (let k = 0; k < G.m.amu.n; k++) {
      const ang = (G.amuAng || 0) + k * Math.PI * 2 / G.m.amu.n;
      const fx2 = p.x + Math.cos(ang) * G.m.amu.r, fy2 = p.y + Math.sin(ang) * G.m.amu.r;
      const g = ctx.createRadialGradient(fx2, fy2, 1, fx2, fy2, 14);
      g.addColorStop(0, "rgba(255,235,170," + (0.85 * a).toFixed(2) + ")");
      g.addColorStop(1, "rgba(255,200,90,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx2, fy2, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,246,210," + (0.95 * a).toFixed(2) + ")";
      ctx.font = "700 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";

/* 水母是光源：黑暗层之上重画一遍（加色），保证光照半径外仍看得见它游过来 */

  g.addColorStop(0, "rgba(175,220,255,0.50)");

/* 黑暗层之上重绘的「生物光」白名单：只有真会扑上来咬人的家伙自带光。

   而重绘的兜底分支画的是「紫伞 + 5 根触手 + 中央亮核」＝电袭者的样子 ——
   于是每块石头、每条泥鳅在黑暗里都顶着一只紫色水母（探针实测：石头 1479 个紫像素、

                  brood: 1, curtain: 1, anox: 1 };   // 后三只是精英三线，再后三只是 2026-09-26 的重装三只
/* 怪物判定的唯一入口：加一只怪只改 MOB_SET 一处，不再逐个补手写的 kind 列表

function mobKind(k) { return !!MOB_SET[k] && k !== "bolt"; }

function contactDmg(e) {
  if (e.kind === "brood") return CFG.broodDmg;
  if (e.kind === "curtain") return CFG.curtainDmg;
  if (e.kind === "anox") return CFG.anoxDmg;
  if (e.kind === "reaver") return CFG.reaverDmg;
  if (e.kind === "split") return CFG.splitDmg * (e.kid ? CFG.splitKidDmg : 1);
  if (e.kind === "lamp") return CFG.lampDmg;
  if (e.kind === "shell") return CFG.shellDmg;
  if (e.kind === "anchor") return CFG.anchorDmg;

  if (!e.maxHp || e.hp <= 0 || e.hp >= e.maxHp) return;
  const w = Math.max(30, e.r * 2.4), h = 3.5;
  const bx = e.x - w / 2, by = e.y - e.r - (e.kind === "hunter" ? 26 : 16);
  ctx.fillStyle = "rgba(6,14,24,0.8)"; ctx.fillRect(bx, by, w, h);
  const f = clamp(e.hp / e.maxHp, 0, 1);
  ctx.fillStyle = f > 0.5 ? "rgba(150,235,190,0.95)" : "rgba(255,180,120,0.95)";

  setAutoPick: (m) => { AUTO_PICK = m; },
  setFreeze: (v) => { AUTO_FREEZE = !!v; },      // 探针用：关掉 rAF 自动步进，改成手动 S.update，量手感可复现
  stats: () => ({ state: G.state, depth: Math.floor(G.depth), o2: +G.o2.toFixed(2), ents: ents.length, best: G.best, speed: +G.speed.toFixed(1), level: G.level, route: G.route, sk: Object.assign({}, G.sk), choices: G.choices ? G.choices.map((s) => s.id) : null,
                   act: { q: +G.act.q.toFixed(2), e: +G.act.e.toFixed(2), f: +G.act.f.toFixed(2) },
                   actFx: { dash: +G.actFx.dash.toFixed(2), flare: +G.actFx.flare.toFixed(2), shock: +G.actFx.shock.toFixed(2) },
                   kills: G.kills, o2Kill: +G.o2Kill.toFixed(1), lightR: +G.lightR.toFixed(0), invuln: +p.invuln.toFixed(2),
                   mutate: G.mutate, artAff: G.choices && G.choices[0] && G.choices[0].aff ? G.choices[0].aff : null,
                   zones: G.zones.map((z) => z.type + "@" + Math.round(z.x) + "," + Math.round(z.y) + "r" + z.r),
                   zoneN: G.zones.length, shards: G.shards.length, beams: G.beams.length,
                   bone: G.bone || 0, frenzy: G.frenzy || 0, seals: ents.filter((e) => e.seal > 0).length,
                   whirlT: +(G.whirlT || 0).toFixed(2), orb: !!G.orb,
                   charge: +(G.charge || 0).toFixed(2), lampN: G.lampN || 0,
                   t2: G.t2, aspBCd: +(G.aspBCd || 0).toFixed(2),
                   whirlChain: G.whirlChain || 0, singEat: G.singEat || 0, singGrow: G.singGrow || 0,
                   vulnN: ents.filter((e) => (e.vulnT || 0) > 0).length })
};

/* ============================ init ======================================= */
/* 定格截图前必须把「瞬时特效」清干净：震动是每帧随机偏移、受击红闪是按时间衰减的，
   冻结状态下二者不会自己退场，会让截图看起来像出了故障。 */
function freezeClean() { G.shakeT = 0; G.shakeMag = 0; G.flash = 0; G.redFlash = 0; }
function init() {
  resize();
  G.best = parseFloat(store.get("sink.best", "0")) || 0;
  makeSnow();
  const q = new URLSearchParams(location.search);
  if (q.get("selftest") === "1") { runSelfTest(); }
  else if (q.get("scenario") === "over") {
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    let guard = 0;
    while ((G.state === "play" || G.state === "levelup") && guard++ < 120 * 400) { if (G.state === "levelup") aiPick(); autopilot(STEP); update(STEP); }
    if (G.state === "play") gameOver();
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "levelup") {
    /* 停在第一张三选一卡面上（视觉验收用） */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    let guard = 0;
    while (G.state === "play" && guard++ < 120 * 400) { autopilot(STEP); update(STEP); }
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "deep") {
    startRun(q.get("seed") === null ? 3 : +q.get("seed"));
    const want = parseFloat(q.get("depth") || "1100") || 1100;
    let guard = 0;
    while ((G.state === "play" || G.state === "levelup") && G.depth < want && guard++ < 120 * 200) { if (G.state === "levelup") aiPick(); autopilot(STEP); update(STEP); }
    if (G.state === "levelup") aiPick();      // 走到目标深度那一步正好撞上三选一：先把卡面收掉
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "build") {
    /* 跑一段并自动选牌，用来截「一身强化」的 HUD */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    const want = parseFloat(q.get("depth") || "900") || 900;
    let guard = 0;
    while ((G.state === "play" || G.state === "levelup") && G.depth < want && guard++ < 120 * 400) { if (G.state === "levelup") aiPick(); autopilot(STEP); update(STEP); }
    if (G.state === "levelup") aiPick();      // 同上：卡面不能进截图
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "dark") {
    /* 黑暗验收：光照半径外必须纯黑（连气泡都看不见），水母必须在纯黑里亮着。
       三个探针点摆在玩家同一条水平线上，左右各 430px（远在半径之外）。 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    const want = parseFloat(q.get("depth") || "1200") || 1200;
    let guard = 0;
    while ((G.state === "play" || G.state === "levelup") && G.depth < want && guard++ < 120 * 200) { if (G.state === "levelup") aiPick(); autopilot(STEP); update(STEP); }
    if (G.state === "levelup") aiPick();      // 1200m 正好是「每 100m 一次」的门槛，必撞 —— 先收卡面
    G.o2 = 80;
    ents.length = 0; G.particles.length = 0;
    /* 玩家停回正中：探针点按「正中心 ±330」摆，脚本 AI 最后停在哪不该影响测量 */
    p.x = W0 / 2; p.vx = 0;
    G.lightBonus = 0;
    G.lightR = lerp(CFG.lightNear, CFG.lightFar, clamp(G.depth / CFG.lightSpan, 0, 1));
    /* 摆在玩家下方左右各 330px（离 HUD 的深度条与氧气条都远），水母要看得见、气泡要看不见 */
    const py = p.y + 170;
    ents.push({ kind: "jelly",  x: p.x + 330, y: py, r: 17, seed: 11, vy: 0 });
    ents.push({ kind: "bubble", x: p.x - 330, y: py, r: 12, seed: 23, vy: 0 });
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "combat") {
    /* 战斗验收截图：一只猎手、一只电袭者、一块半血石头、一条泥鳅、一颗电球摆进视野，
       朝猎手开一枪后定格 —— 光束、准星、血条、飘字一次性全在画面里。 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.depth = parseFloat(q.get("depth") || "1200") || 1200;
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    const py = p.y + 200;
    ents.push({ kind: "hunter",  x: p.x - 150, y: py + 120, r: 20, hp: 100, maxHp: CFG.hunterHP,  seed: 3,  flash: 0 });
    ents.push({ kind: "spitter", x: p.x + 165, y: py + 40,  r: 17, hp: 45,  maxHp: CFG.spitterHP, seed: 9,  flash: 0, fireT: 0.35 });
    ents.push({ kind: "rock",    x: p.x - 250, y: py + 10,  r: 28, hp: 50,  maxHp: CFG.rockHP,    seed: 21, flash: 0 });
    ents.push({ kind: "cable",   x: p.x + 300, y: py + 90,  r: 17, len: 90, hp: 30, maxHp: CFG.cableHP, seed: 33, flash: 0 });
    ents.push({ kind: "bolt",    x: p.x + 130, y: py + 150, r: CFG.boltR, vx: -60, vy: -120, life: 3, seed: 5 });
    G.input.aimActive = false; G.aim.idle = 99;
    G.aim.tx = G.aim.x = p.x - 150; G.aim.ty = G.aim.y = py + 120;
    /* 截图要把整场战斗都照亮，不然一半零件埋在纯黑里（黑暗验收另有 dark 场景） */
    G.lightR = 560; G.lightBonus = 0;
    fireAttack();
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "active") {
    /* 主动技能验收截图：选「法师」→ Q 放出去正在扩散、按钮转冷却；
       另外两个按钮没选，画虚线写「封」。摆一圈目标进去，一眼看出范围内被打掉了。 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.route = "mage"; recalcMods();            // 技能得先选出来：没选路线 tryActive 一律拒绝
    G.depth = parseFloat(q.get("depth") || "1300") || 1300;
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    const py = p.y + 190;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI * 0.75 + i * (Math.PI * 1.5 / 4);
      ents.push({ kind: i % 2 ? "hunter" : "rock", x: clamp(p.x + Math.cos(a) * 190, 50, W0 - 50), y: py + Math.sin(a) * 160,
                  r: i % 2 ? 20 : 28, hp: i % 2 ? 60 : 70, maxHp: i % 2 ? CFG.hunterHP : CFG.rockHP, seed: 5 + i * 7, flash: 0 });
    }
    G.lightR = 620; G.lightBonus = 0;
    G.o2 = 58;
    tryActive("q");                            // 放得出来：Q 的冷却扇形进画面
    fireAttack();
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "active2") {
    /* 探照生效中：光照半径被技能顶到最大，黑暗被推开（对比 09-dark） */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.depth = parseFloat(q.get("depth") || "1200") || 1200;
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    G.o2 = 62;
    G.route = "lamp"; recalcMods();             // 探照只属于「照明使者」
    G.lightR = lerp(CFG.lightNear, CFG.lightFar, clamp(G.depth / CFG.lightSpan, 0, 1));
    tryActive("f");
    for (let i = 0; i < 90; i++) update(STEP);      // 让光照过渡到位
    for (const e of ents) if (e.kind === "hunter") e.x = clamp(e.x, 90, W0 - 90);
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "mutate") {
    /* 质变验收截图：跑到 2000m 停在质变三选一卡面上（挂机 AI 撑不到 2km：保氧不死） */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    let guard = 0;
    while ((G.state === "play" || G.state === "levelup") && guard++ < 120 * 2400) {
      if (G.state === "levelup") { if (!aiPick()) break; }
      G.o2 = Math.max(G.o2, 90);
      autopilot(STEP); update(STEP);
      if (!G.mutate && G.route && G.depth >= CFG.mutateAt && G.state === "levelup") break;
    }
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "deepmob") {
    /* 深水怪验收截图：2000m 场地摆一只剃刀鲸 + 一只开盾的圣盾使 + 护心符转着 */
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    G.depth = 2100; G.route = "mage"; recalcMods();
    ents.length = 0; G.particles.length = 0; G.popups.length = 0;
    const py = p.y + 170;
    ents.push({ kind: "reaver", x: p.x - 210, y: py + 40, r: 30, hp: 320, maxHp: 320, seed: 7, hit: false, near: false, flash: 0, vx: 200 });
    ents.push({ kind: "warden", x: p.x + 180, y: py + 20, r: 22, hp: 260, maxHp: 260, seed: 15, hit: false, near: false, flash: 0, fireT: 1.6, fanN: 0, fanT: 0, shield: true, shieldHp: 3, breakT: 0 });
    ents.push({ kind: "hunter", x: p.x + 40, y: py + 130, r: 20, hp: 300, maxHp: 300, seed: 21, hit: false, near: false, flash: 0 });
    G.sk = { a_amulet: 1 }; recalcMods();
    G.amuT = G.m.amu.t; G.amuCd = G.m.amu.cd; G.amuAng = 0.6;      // 符咒当场转起来
    G.lightR = 560; G.lightBonus = 0; G.o2 = 72;
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "help") {
    /* 规则弹层截图：标题页点「?」之后的样子 */
    G.helpOpen = true;
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("auto") !== null) {
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
    const n = clamp(parseInt(q.get("auto"), 10) || 0, 0, 120 * 600);
    for (let i = 0; i < n; i++) { if (G.state === "levelup") aiPick(); update(STEP); }
    freezeClean(); AUTO_FREEZE = true;
  } else if (q.get("scenario") === "play") {
    startRun(q.get("seed") === null ? 7 : +q.get("seed"));
  }
  requestAnimationFrame(frame);
}
init();
</script>
